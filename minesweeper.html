<style>

@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

.logo { align-items: center; gap: 10px; }
.logo b { font-size: clamp(28px, 8vw, 42px); font-weight: 900; background: linear-gradient(90deg, #ff6a6a, #ffb35c 50%, #3fe0d0); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }

.face svg { width: 34px; height: 34px; }

@keyframes shake { 15% { transform: translate(-6px, 3px); } 30% { transform: translate(5px, -4px); } 45% { transform: translate(-4px, -3px); } 60% { transform: translate(3px, 4px); } 80% { transform: translate(-2px, 1px); } }
#cv { display: block; touch-action: none; }
.btn.on { background: linear-gradient(160deg, #ff6a6a, #d81e3c); border-color: transparent; color: #fff; }

</div>

  <div class="mbox"><h3 id="hClassic"></h3><p id="pClassic"></p><div class="chips" id="lvChips"></div><div id="custom"></div><div class="status" id="lNG"></div><div class="chips" id="ngChips" style="margin-top:6px"></div><button class="btn primary wide" id="bClassic"></button></div>

</div></div>

<div class="ov" id="help" hidden><div class="card"><h2 id="tHelp"></h2><div class="keys" id="helpKeys"></div><div class="tips" id="helpTips"></div><div class="foot"><button class="btn primary" id="bHelpDone"></button></div></div></div>
<div class="ov" id="result" hidden><div class="card"><h2 id="resTitle"></h2><div class="big" id="resScore"></div><div class="sub" id="resSub"></div><div class="newrec" id="resNew" hidden></div><div class="grid2" id="resGrid"></div><button class="btn wide" id="bShare" hidden></button><button class="btn wide" id="bLook"></button><div class="foot"><button class="btn" id="bResMenu"></button><button class="btn primary" id="bAgain"></button></div></div></div>
<script>
// ───────────────────────── 지뢰찾기 엔진 (화면과 무관, Node 에서도 시험) ─────────────────────────
class Rng {
  constructor(seed) { this.s = seed >>> 0; }
  next() { let t = (this.s = (this.s + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
}
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const LEVELS = { easy: [9, 9, 10], medium: [16, 16, 40], hard: [30, 16, 99] };
const HIDDEN = 0, OPEN = 1, FLAG = 2, MARK = 3;
// 오늘의 퍼즐: 날마다 크기가 돌아가며 바뀐다 (모두에게 같은 판, 같은 출발 칸)
const DAILY_LEVELS = ['medium', 'hard', 'easy'];
function dailyInfo(date) {
  const day = Math.floor(Date.parse(date + 'T00:00:00Z') / 86400000);
  return { date, seed: hashStr('wiiiv-mines-' + date), level: DAILY_LEVELS[((day % 3) + 3) % 3] };
}

class Mines {
  constructor(o = {}) {
    const [w, h, n] = o.level && LEVELS[o.level] ? LEVELS[o.level] : [o.w || 9, o.h || 9, o.n || 10];
    this.w = w; this.h = h; this.n = Math.min(n, w * h - 9); this.level = o.level || 'custom';
    this.noGuess = o.noGuess ?? true; this.seed = o.seed ?? ((Math.random() * 2 ** 32) >>> 0);
    this.N = w * h; this.mine = new Uint8Array(this.N); this.adj = new Uint8Array(this.N); this.st = new Uint8Array(this.N);
    this.status = 'ready'; this.opened = 0; this.flags = 0; this.genTries = 0; this.boom = -1; this.hints = 0;
    this.nb = [];
    for (let i = 0; i < this.N; i++) { const x = i % w, y = (i / w) | 0, a = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < w && Y < h) a.push(Y * w + X); } this.nb.push(a); }
  }
  // 첫 클릭 둘레 3x3 은 지뢰 없음 → 첫 칸은 늘 0 이라 넓게 열린다
  generate(first) {
    const rng = new Rng(this.seed), safe = new Set([first, ...this.nb[first]]);
    const t0 = Date.now();
    for (let tries = 1; ; tries++) {
      this.mine.fill(0); const pool = []; for (let i = 0; i < this.N; i++) if (!safe.has(i)) pool.push(i);
      for (let k = 0; k < this.n; k++) { const j = k + Math.floor(rng.next() * (pool.length - k)); [pool[k], pool[j]] = [pool[j], pool[k]]; this.mine[pool[k]] = 1; }
      this.calcAdj(); this.genTries = tries;
      // 운에 맡기지 않아도 되는 판인지 (논리만으로 다 풀리는지)
      if (!this.noGuess || this.solvable(first) || tries >= 4000 || Date.now() - t0 > 2500) break;
    }
  }
  calcAdj() { for (let i = 0; i < this.N; i++) { let c = 0; for (const j of this.nb[i]) c += this.mine[j]; this.adj[i] = c; } }
  // ── 논리 풀이기: 숫자 하나 규칙 + 두 숫자 겹침 규칙 + 남은 지뢰 수
  solve(first, opts = {}) {
    const N = this.N, open = new Uint8Array(N), mk = new Uint8Array(N), nb = this.nb, adj = this.adj, mine = this.mine;
    let nOpen = 0, nMine = 0; const q = [];
    const doOpen = i => { if (open[i] || mk[i]) return; if (mine[i]) throw new Error('solver hit mine'); open[i] = 1; nOpen++; q.push(i); if (adj[i] === 0) for (const j of nb[i]) doOpen(j); };
    if (opts.state) { for (let i = 0; i < N; i++) { if (opts.state[i] === OPEN) { open[i] = 1; nOpen++; } } }
    else doOpen(first);
    const safeN = N - this.n; let changed = true, firstSafe = -1;
    const unknownsOf = i => { const u = []; let m = 0; for (const j of nb[i]) { if (mk[j]) m++; else if (!open[j]) u.push(j); } return { u, rem: adj[i] - m }; };
    while (changed && nOpen < safeN) {
      changed = false;
      const front = []; for (let i = 0; i < N; i++) if (open[i] && adj[i] > 0) { const c = unknownsOf(i); if (c.u.length) front.push({ i, ...c }); }
      for (const c of front) {
        if (c.rem === 0) { for (const j of c.u) { if (firstSafe < 0) firstSafe = j; if (opts.one) return { safe: j }; doOpen(j); } changed = true; }
        else if (c.rem === c.u.length) { for (const j of c.u) if (!mk[j]) { mk[j] = 1; nMine++; } changed = true; }
      }
      if (changed) continue;
      // 겹침 규칙: A의 미지 칸이 B의 미지 칸에 다 들어 있으면 B−A 에 (remB−remA) 개
      const fr = front.map(c => ({ ...c, s: new Set(c.u) }));
      for (let a = 0; a < fr.length && !changed; a++) for (let b = 0; b < fr.length && !changed; b++) {
        if (a === b) continue; const A = fr[a], B = fr[b];
        if (A.u.length >= B.u.length || Math.abs(A.i % this.w - B.i % this.w) > 2 || Math.abs(((A.i / this.w) | 0) - ((B.i / this.w) | 0)) > 2) continue;
        if (!A.u.every(j => B.s.has(j))) continue;
        const rest = B.u.filter(j => !A.s.has(j)), dm = B.rem - A.rem;
        if (dm === 0) { for (const j of rest) { if (opts.one) return { safe: j }; doOpen(j); } changed = true; }
        else if (dm === rest.length) { for (const j of rest) if (!mk[j]) { mk[j] = 1; nMine++; } changed = true; }
      }
      if (changed) continue;
      // 남은 지뢰 수: 다 찾았으면 나머지는 안전, 남은 칸 = 남은 지뢰면 전부 지뢰
      const left = this.n - nMine, hidden = []; for (let i = 0; i < N; i++) if (!open[i] && !mk[i]) hidden.push(i);
      if (left === 0 && hidden.length) { for (const j of hidden) { if (opts.one) return { safe: j }; doOpen(j); } changed = true; }
      else if (left === hidden.length && hidden.length) { for (const j of hidden) { mk[j] = 1; nMine++; } changed = true; }
    }
    return { solved: nOpen >= safeN, nOpen, mk };
  }
  solvable(first) { try { return this.solve(first).solved; } catch { return false; } }
  // 힌트: 지금 화면에서 논리로 확실히 안전한 칸 하나
  hint() {
    if (this.status !== 'play') return -1;
    const st = new Uint8Array(this.N); for (let i = 0; i < this.N; i++) st[i] = this.st[i] === OPEN ? OPEN : 0;
    let r; try { r = this.solve(-1, { state: st, one: true }); } catch { r = {}; }
    if (r.safe != null && r.safe >= 0) { this.hints++; return r.safe; }
    // 논리로 안 되면(운 판) 아무 안전한 칸이라도
    for (let i = 0; i < this.N; i++) if (!this.mine[i] && this.st[i] !== OPEN && this.nb[i].some(j => this.st[j] === OPEN)) { this.hints++; return i; }
    return -1;
  }
  // 칸 열기 → 열린 칸 목록 (거리 순, 화면 연출용)
  open(i) {
    if (this.status === 'won' || this.status === 'lost') return null;
    if (this.status === 'ready') { this.generate(i); this.status = 'play'; this.startCell = i; }
    if (this.st[i] === FLAG || this.st[i] === OPEN) return { opened: [] };
    if (this.mine[i]) { this.st[i] = OPEN; this.status = 'lost'; this.boom = i; return { opened: [], boom: i }; }
    const opened = [], seen = new Set([i]), q = [[i, 0]];
    while (q.length) {
      const [c, d] = q.shift(); if (this.st[c] === OPEN || this.st[c] === FLAG) continue;
      if (this.st[c] === MARK) { /* 물음표도 열린다 */ }
      this.st[c] = OPEN; this.opened++; opened.push([c, d]);
      if (this.adj[c] === 0) for (const j of this.nb[c]) if (!seen.has(j) && !this.mine[j]) { seen.add(j); q.push([j, d + 1]); }
    }
    if (this.opened === this.N - this.n) this.win();
    return { opened };
  }
  // 숫자 칸: 둘레 깃발 수가 맞으면 나머지를 한꺼번에 연다
  chord(i) {
    if (this.status !== 'play' || this.st[i] !== OPEN || !this.adj[i]) return null;
    const f = this.nb[i].filter(j => this.st[j] === FLAG).length; if (f !== this.adj[i]) return { opened: [], short: true };
    const all = []; let boom = null;
    for (const j of this.nb[i]) {
      if (this.st[j] !== HIDDEN && this.st[j] !== MARK) continue;
      if (this.mine[j]) { this.st[j] = OPEN; this.status = 'lost'; this.boom = j; boom = j; continue; }

  $('bHint').hidden = mode === 'daily';

const totalMs = () => elapsed + (game ? game.hints * 10000 : 0);

// ── 시작·끝
let flagMode = false;
function startClassic(fresh) {

}

function begin() {

// ── 반복
