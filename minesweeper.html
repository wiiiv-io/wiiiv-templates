<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title id="pageTitle">지뢰찾기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d1a; color: #fff; font-family: 'Segoe UI', sans-serif;
  display: flex; align-items: center; justify-content: center;
  height: 100vh; overflow: hidden; user-select: none;
}
.game-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; width: 100%;
}
.info-box {
  background: rgba(124,92,252,0.08); border: 1px solid rgba(124,92,252,0.25);
  border-radius: 8px; padding: 6px 14px; text-align: center; min-width: 60px;
}
.info-box .label { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.info-box .val { font-size: 18px; font-weight: 700; color: #7c5cfc; font-variant-numeric: tabular-nums; }
.face-btn {
  font-size: 28px; cursor: pointer; background: none; border: none;
  padding: 4px 10px; border-radius: 8px; transition: background 0.15s;
}
.face-btn:hover { background: rgba(255,255,255,0.06); }
.difficulty { display: flex; gap: 6px; }
.diff-btn {
  padding: 5px 12px; border: 1px solid rgba(124,92,252,0.3); border-radius: 6px;
  background: transparent; color: #aaa; font-size: 11px; cursor: pointer;
  transition: all 0.15s;
}
.diff-btn:hover { background: rgba(124,92,252,0.1); color: #fff; }
.diff-btn.active { background: #7c5cfc; color: #fff; border-color: #7c5cfc; }
.board {
  display: inline-grid; gap: 1px; padding: 4px;
  background: rgba(124,92,252,0.06); border: 2px solid rgba(124,92,252,0.25);
  border-radius: 6px;
}
.cell {
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; cursor: pointer;
  border-radius: 3px; transition: background 0.1s;
}
.cell.hidden {
  background: linear-gradient(145deg, #2a2a4a, #1e1e38);
  box-shadow: inset -1px -1px 2px rgba(0,0,0,0.3), inset 1px 1px 2px rgba(255,255,255,0.05);
}
.cell.hidden:hover { background: linear-gradient(145deg, #35355a, #282848); }
.cell.revealed { background: rgba(255,255,255,0.03); cursor: default; }
.cell.flagged { background: linear-gradient(145deg, #2a2a4a, #1e1e38); }
.cell.mine { background: #ff4757; }
.cell.mine-source { background: #ff2030; }
.n1 { color: #4488ff; } .n2 { color: #44cc44; } .n3 { color: #ff4444; }
.n4 { color: #2244aa; } .n5 { color: #882222; } .n6 { color: #22aaaa; }
.n7 { color: #333; } .n8 { color: #888; }
.keys-info { font-size: 10px; color: #666; }
.keys-info span { color: #888; }
</style>
</head>
<body>
<div class="game-wrap">
  <div class="difficulty">
    <button class="diff-btn active" data-level="easy" id="btn-easy" onclick="setDifficulty('easy',this)">초급</button>
    <button class="diff-btn" data-level="medium" id="btn-medium" onclick="setDifficulty('medium',this)">중급</button>
    <button class="diff-btn" data-level="hard" id="btn-hard" onclick="setDifficulty('hard',this)">고급</button>
  </div>
  <div class="top-bar" id="topBar">
    <div class="info-box"><div class="label" id="lbl-mines">지뢰</div><div class="val" id="mineCount">10</div></div>
    <button class="face-btn" id="faceBtn" onclick="newGame()">😊</button>
    <div class="info-box"><div class="label" id="lbl-time">시간</div><div class="val" id="timer">0</div></div>
  </div>
  <div class="board" id="board"></div>
  <div class="keys-info" id="keys-info"><span>좌클릭</span> 열기 | <span>우클릭</span> 깃발 🚩</div>
</div>

<script>
const LANG = 'ko';
const T = {
  ko: { title: '지뢰찾기', easy: '초급', medium: '중급', hard: '고급', mines: '지뢰', time: '시간', keysInfo: '<span>좌클릭</span> 열기 | <span>우클릭</span> 깃발 🚩' },
  en: { title: 'Minesweeper', easy: 'Easy', medium: 'Medium', hard: 'Hard', mines: 'Mines', time: 'Time', keysInfo: '<span>Left click</span> Open | <span>Right click</span> Flag 🚩' },
}[LANG];
document.getElementById('pageTitle').textContent = T.title;
document.getElementById('btn-easy').textContent = T.easy;
document.getElementById('btn-medium').textContent = T.medium;
document.getElementById('btn-hard').textContent = T.hard;
document.getElementById('lbl-mines').textContent = T.mines;
document.getElementById('lbl-time').textContent = T.time;
document.getElementById('keys-info').innerHTML = T.keysInfo;

const LEVELS = {
  easy: {cols: 9, rows: 9, mines: 10},
  medium: {cols: 16, rows: 16, mines: 40},
  hard: {cols: 30, rows: 16, mines: 99},
};

let currentLevel = 'easy';
let cols, rows, mineCount, board, revealed, flagged, mines;
let gameStarted, gameEnded, timerInterval, elapsed, firstClick;

function setDifficulty(level, btn) {
  currentLevel = level;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  newGame();
}

function newGame() {
  const cfg = LEVELS[currentLevel];
  cols = cfg.cols; rows = cfg.rows; mineCount = cfg.mines;
  board = Array.from({length: rows}, () => new Array(cols).fill(0));
  revealed = Array.from({length: rows}, () => new Array(cols).fill(false));
  flagged = Array.from({length: rows}, () => new Array(cols).fill(false));
  mines = Array.from({length: rows}, () => new Array(cols).fill(false));
  gameStarted = false; gameEnded = false; firstClick = true;
  elapsed = 0;
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('timer').textContent = '0';
  document.getElementById('mineCount').textContent = mineCount;
  document.getElementById('faceBtn').textContent = '😊';
  renderBoard();
}

function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < mineCount) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (mines[r][c]) continue;
    if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
    mines[r][c] = true;
    placed++;
  }
  // calc numbers
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (mines[r][c]) { board[r][c] = -1; continue; }
      let count = 0;
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && mines[nr][nc]) count++;
        }
      board[r][c] = count;
    }
  }
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${cols}, 26px)`;
  boardEl.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      updateCell(cell, r, c);
      cell.addEventListener('click', () => handleClick(r, c));
      cell.addEventListener('contextmenu', e => { e.preventDefault(); handleFlag(r, c); });
      boardEl.appendChild(cell);
    }
  }
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function updateCell(cell, r, c) {
  if (!revealed[r][c]) {
    cell.className = flagged[r][c] ? 'cell hidden flagged' : 'cell hidden';
    cell.textContent = flagged[r][c] ? '🚩' : '';
  } else if (mines[r][c]) {
    cell.className = 'cell mine';
    cell.textContent = '💣';
  } else {
    const n = board[r][c];
    cell.className = 'cell revealed' + (n > 0 ? ` n${n}` : '');
    cell.textContent = n > 0 ? n : '';
  }
}

function handleClick(r, c) {
  if (gameEnded || flagged[r][c] || revealed[r][c]) return;
  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    gameStarted = true;
    timerInterval = setInterval(() => {
      elapsed++;
      document.getElementById('timer').textContent = elapsed;
    }, 1000);
  }
  if (mines[r][c]) {
    revealAll(r, c);
    endGame(false);
    return;
  }
  reveal(r, c);
  checkWin();
}

function handleFlag(r, c) {
  if (gameEnded || revealed[r][c]) return;
  flagged[r][c] = !flagged[r][c];
  const cell = getCell(r, c);
  updateCell(cell, r, c);
  const flagCount = flagged.flat().filter(Boolean).length;
  document.getElementById('mineCount').textContent = mineCount - flagCount;
}

function reveal(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (revealed[r][c] || flagged[r][c] || mines[r][c]) return;
  revealed[r][c] = true;
  const cell = getCell(r, c);
  updateCell(cell, r, c);
  if (board[r][c] === 0) {
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++)
        reveal(r + dr, c + dc);
  }
}

function revealAll(srcR, srcC) {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (mines[r][c]) {
        revealed[r][c] = true;
        const cell = getCell(r, c);
        cell.className = (r === srcR && c === srcC) ? 'cell mine-source' : 'cell mine';
        cell.textContent = '💣';
      }
    }
  }
}

function checkWin() {
  let unrev = 0;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (!revealed[r][c]) unrev++;
  if (unrev === mineCount) endGame(true);
}

function endGame(won) {
  gameEnded = true;
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('faceBtn').textContent = won ? '😎' : '😵';
  if (won) {
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (mines[r][c] && !flagged[r][c]) {
          flagged[r][c] = true;
          const cell = getCell(r, c);
          updateCell(cell, r, c);
        }
    document.getElementById('mineCount').textContent = '0';
  }
}

newGame();
</script>
</body>
</html>
