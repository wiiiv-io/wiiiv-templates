<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>메모리 카드</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
#controls { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.diff-btn { background: #333; border: 1px solid #555; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.diff-btn:hover { background: #444; }
.diff-btn.active { background: #7c5cfc; border-color: #7c5cfc; }
#resetBtn { background: #7c5cfc; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background 0.2s; }
#resetBtn:hover { background: #6a4ce0; }
#ui { display: flex; gap: 20px; margin-bottom: 10px; font-size: 14px; }
.stat { display: flex; gap: 6px; align-items: center; }
.label { color: #888; }
.value { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
#grid { display: grid; gap: 8px; perspective: 800px; }
.card { position: relative; cursor: pointer; border-radius: 10px; transition: transform 0.1s; }
.card:hover { transform: scale(1.03); }
.card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.card-front { background: linear-gradient(135deg, #2a2a4a, #1a1a3a); border: 2px solid #3a3a5a; }
.card-front::after { content: '?'; font-size: 24px; color: #7c5cfc; font-weight: 700; }
.card-back { background: #1e1e3e; border: 2px solid #3a3a5a; transform: rotateY(180deg); font-size: 32px; }
.card.matched .card-back { border-color: #44dd66; box-shadow: 0 0 12px rgba(68, 221, 102, 0.3); }
.card.wrong .card-back { border-color: #ff4466; box-shadow: 0 0 12px rgba(255, 68, 102, 0.3); }
#overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,0.7); z-index: 10; }
#overlay.active { display: flex; }
#overlay h2 { font-size: 28px; color: #ffd700; }
#overlay p { font-size: 16px; color: #ccc; }
#overlay button { background: #7c5cfc; border: none; color: #fff; padding: 10px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; }
#overlay button:hover { background: #6a4ce0; }
</style>
</head>
<body>
<div id="controls">
  <button class="diff-btn active" data-diff="easy">쉬움 (6쌍)</button>
  <button class="diff-btn" data-diff="medium">보통 (8쌍)</button>
  <button class="diff-btn" data-diff="hard">어려움 (12쌍)</button>
  <button id="resetBtn">새 게임</button>
</div>
<div id="ui">
  <div class="stat"><span class="label">이동</span><span class="value" id="moves">0</span></div>
  <div class="stat"><span class="label">시간</span><span class="value" id="timer">0:00</span></div>
  <div class="stat"><span class="label">짝</span><span class="value" id="pairs">0/0</span></div>
</div>
<div id="grid"></div>
<div id="overlay">
  <h2>🎉 축하합니다!</h2>
  <p id="resultText"></p>
  <button onclick="startGame()">다시 하기</button>
</div>

<script>
const LANG = 'ko';
const T = {
  ko: { title: '메모리 카드', easy: '쉬움 (6쌍)', medium: '보통 (8쌍)', hard: '어려움 (12쌍)',
        newGame: '새 게임', moves: '이동', time: '시간', pairs: '짝',
        congrats: '🎉 축하합니다!', playAgain: '다시 하기',
        result: (m, min, sec) => `${m}회 이동 · ${min}분 ${sec}초 소요` },
  en: { title: 'Memory Card', easy: 'Easy (6 pairs)', medium: 'Medium (8 pairs)', hard: 'Hard (12 pairs)',
        newGame: 'New Game', moves: 'Moves', time: 'Time', pairs: 'Pairs',
        congrats: '🎉 Congratulations!', playAgain: 'Play Again',
        result: (m, min, sec) => `${m} moves · ${min}m ${sec}s` }
}[LANG] || {
  title: 'Memory Card', easy: 'Easy (6 pairs)', medium: 'Medium (8 pairs)', hard: 'Hard (12 pairs)',
  newGame: 'New Game', moves: 'Moves', time: 'Time', pairs: 'Pairs',
  congrats: '🎉 Congratulations!', playAgain: 'Play Again',
  result: (m, min, sec) => `${m} moves · ${min}m ${sec}s`
};

// Apply i18n to static DOM
document.title = T.title;
document.querySelector('[data-diff="easy"]').textContent = T.easy;
document.querySelector('[data-diff="medium"]').textContent = T.medium;
document.querySelector('[data-diff="hard"]').textContent = T.hard;
document.getElementById('resetBtn').textContent = T.newGame;
document.querySelectorAll('.label').forEach(el => {
  if (el.nextElementSibling?.id === 'moves') el.textContent = T.moves;
  else if (el.nextElementSibling?.id === 'timer') el.textContent = T.time;
  else if (el.nextElementSibling?.id === 'pairs') el.textContent = T.pairs;
});
document.querySelector('#overlay h2').textContent = T.congrats;
document.querySelector('#overlay button').textContent = T.playAgain;

const EMOJIS = ['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝','🍌','🍍','🥭','🫐'];
const DIFFICULTIES = {
  easy: { cols: 4, rows: 3, pairs: 6 },
  medium: { cols: 4, rows: 4, pairs: 8 },
  hard: { cols: 6, rows: 4, pairs: 12 }
};

let difficulty = 'easy';
let cards = [];
let flipped = [];
let matched = new Set();
let moves = 0;
let totalPairs = 0;
let matchedCount = 0;
let timerStart = 0;
let timerInterval = null;
let locked = false;

const gridEl = document.getElementById('grid');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const pairsEl = document.getElementById('pairs');
const overlayEl = document.getElementById('overlay');
const resultEl = document.getElementById('resultText');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  overlayEl.className = '';
  if (timerInterval) clearInterval(timerInterval);

  const diff = DIFFICULTIES[difficulty];
  totalPairs = diff.pairs;
  matchedCount = 0;
  moves = 0;
  flipped = [];
  matched = new Set();
  locked = false;

  const emojis = shuffle([...EMOJIS]).slice(0, diff.pairs);
  const deck = shuffle([...emojis, ...emojis]);
  cards = deck.map((emoji, i) => ({ id: i, emoji, flipped: false, matched: false }));

  const maxW = Math.min(window.innerWidth - 40, 500);
  const maxH = Math.min(window.innerHeight - 140, 400);
  const cardW = Math.min(Math.floor((maxW - (diff.cols - 1) * 8) / diff.cols), 80);
  const cardH = Math.min(Math.floor((maxH - (diff.rows - 1) * 8) / diff.rows), 90);
  const cSize = Math.min(cardW, cardH);

  gridEl.style.gridTemplateColumns = `repeat(${diff.cols}, ${cSize}px)`;
  gridEl.style.gridTemplateRows = `repeat(${diff.rows}, ${cSize}px)`;
  gridEl.innerHTML = '';

  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.index = i;
    el.style.width = cSize + 'px';
    el.style.height = cSize + 'px';
    el.innerHTML = `<div class="card-inner"><div class="card-front"></div><div class="card-back">${card.emoji}</div></div>`;
    el.addEventListener('click', () => flipCard(i, el));
    gridEl.appendChild(el);
  });

  // Brief reveal animation
  const allCards = gridEl.querySelectorAll('.card');
  allCards.forEach(el => el.classList.add('flipped'));
  setTimeout(() => {
    allCards.forEach(el => el.classList.remove('flipped'));
  }, 800);

  movesEl.textContent = '0';
  timerEl.textContent = '0:00';
  pairsEl.textContent = `0/${totalPairs}`;
  timerStart = 0;
}

function startTimer() {
  if (timerStart > 0) return;
  timerStart = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - timerStart) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  }, 200);
}

function flipCard(index, el) {
  if (locked) return;
  if (cards[index].matched || flipped.includes(index)) return;
  if (flipped.length >= 2) return;

  startTimer();
  cards[index].flipped = true;
  el.classList.add('flipped');
  flipped.push(index);

  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;

    const [a, b] = flipped;
    if (cards[a].emoji === cards[b].emoji) {
      cards[a].matched = true;
      cards[b].matched = true;
      matched.add(a);
      matched.add(b);
      matchedCount++;
      pairsEl.textContent = `${matchedCount}/${totalPairs}`;

      const cardEls = gridEl.querySelectorAll('.card');
      cardEls[a].classList.add('matched');
      cardEls[b].classList.add('matched');
      flipped = [];

      if (matchedCount === totalPairs) {
        clearInterval(timerInterval);
        const elapsed = Math.floor((Date.now() - timerStart) / 1000);
        const m = Math.floor(elapsed / 60);
        const s = elapsed % 60;
        setTimeout(() => {
          resultEl.textContent = T.result(moves, m, s);
          overlayEl.className = 'active';
        }, 500);
      }
    } else {
      locked = true;
      const cardEls = gridEl.querySelectorAll('.card');
      cardEls[a].classList.add('wrong');
      cardEls[b].classList.add('wrong');
      setTimeout(() => {
        cardEls[a].classList.remove('flipped', 'wrong');
        cardEls[b].classList.remove('flipped', 'wrong');
        cards[a].flipped = false;
        cards[b].flipped = false;
        flipped = [];
        locked = false;
      }, 700);
    }
  }
}

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    startGame();
  });
});

document.getElementById('resetBtn').addEventListener('click', startGame);
window.addEventListener('resize', startGame);

startGame();
</script>
</body>
</html>
