<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 오델로</title>
<style>
:root{--bg:#0d0d1a;--panel:rgba(18,16,38,.74);--line:rgba(255,255,255,.09);--fg:#ecebff;--dim:#a3a2c8;--acc:#7c5cfc;--acc2:#b9a6ff;--gold:#e8c77a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.45 'Segoe UI','Malgun Gothic',-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{pointer-events:none}
#gl.grab{cursor:grabbing}#gl.pt{cursor:pointer}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#top{position:fixed;left:14px;top:14px;display:flex;align-items:center;gap:12px;padding:9px 16px 9px 10px;max-width:calc(100% - 330px)}
.logo{height:28px;width:auto;flex:none;display:block}
#top b{font-size:15px;display:block;white-space:nowrap}
#status{font-size:12.5px;color:var(--acc2);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side{position:fixed;right:14px;top:14px;bottom:14px;width:300px;display:flex;flex-direction:column;gap:10px;padding:14px;transition:transform .3s ease}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent;transition:all .25s;min-width:0}
.sc.turn{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px rgba(124,92,252,.4)}
.sc .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
.dot{width:16px;height:16px;border-radius:50%;flex:none}.dot.b{background:radial-gradient(circle at 35% 30%,#555,#050505)}.dot.w{background:radial-gradient(circle at 35% 30%,#fff,#cfcabb)}
.sc .n{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.sc .think{font-size:11px;color:var(--acc2);min-height:15px}
.ratio{height:8px;border-radius:5px;overflow:hidden;display:flex;background:#222}
.ratio i{display:block;height:100%;transition:width .5s}.ratio .rb{background:linear-gradient(#3a3a44,#0a0a0e)}.ratio .rw{background:linear-gradient(#fff,#d8d2c2)}
#moves{flex:1;overflow-y:auto;border-radius:12px;background:rgba(0,0,0,.2);padding:8px;font-variant-numeric:tabular-nums;scrollbar-width:thin;min-height:60px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;align-content:start}
.mv{font-size:12px;padding:2px 0;border-radius:5px;text-align:center;display:flex;align-items:center;justify-content:center;gap:3px}
.mv .dot{width:9px;height:9px}.mv.last{background:rgba(124,92,252,.4);color:#fff}.mv.ps{color:var(--dim)}
.empty{grid-column:1/-1;color:var(--dim);font-size:12px;text-align:center;padding:14px 0}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:7px 2px;cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .15s}
.btn i{font-style:normal;font-size:17px;line-height:1.2}.btn:hover{background:rgba(124,92,252,.28);border-color:var(--acc)}.btn:disabled{opacity:.35;pointer-events:none}
.set{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;font-size:12px;color:var(--dim)}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:4px 2px;cursor:pointer;font-size:11.5px;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);padding:10px 20px;font-weight:600;opacity:0;transition:all .35s;pointer-events:none;z-index:8}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,5,15,.28);z-index:10;padding:16px}
.modal[hidden]{display:none}
.card{padding:26px 28px;width:min(380px,100%);text-align:center}
.card h1{font-size:34px;background:linear-gradient(90deg,#fff,#b9a6ff 55%,#4fb3ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.card .sub{color:var(--dim);margin:2px 0 20px;font-size:11px;letter-spacing:.2em}
.card .set{text-align:left;margin:0 auto 20px;gap:11px 12px}
.card p{color:var(--dim);margin:6px 0 18px}
.final{display:flex;justify-content:center;gap:22px;margin:10px 0 4px;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.final span{display:flex;align-items:center;gap:8px}.final .dot{width:22px;height:22px}
.go{border:0;background:linear-gradient(135deg,#7c5cfc,#4f8bff);color:#fff;font-weight:700;font-size:15px;padding:11px 36px;border-radius:12px;cursor:pointer;box-shadow:0 6px 24px rgba(124,92,252,.5)}
.go.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line);margin-left:6px}
#menu{position:fixed;right:14px;top:14px;width:42px;height:42px;border-radius:12px;display:none;place-items:center;font-size:20px;cursor:pointer;z-index:6}
#nogl{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);padding:30px;text-align:center}
#nogl[hidden]{display:none}
@media (max-width:860px){
  #side{left:10px;right:10px;top:auto;bottom:10px;width:auto;height:min(60vh,460px);transform:translateY(calc(100% + 20px))}
  #side.open{transform:none}
  #menu{display:grid}
  #top{max-width:calc(100% - 80px)}
}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<div id="top" class="glass"><img class="logo" id="logo"><div style="min-width:0"><b id="tTitle"></b><div id="status"></div></div></div>
<div id="toast" class="glass"></div>
<button id="menu" class="glass">☰</button>
<aside id="side" class="glass">
  <div class="scores"><div class="sc" id="scB"></div><div class="sc" id="scW"></div></div>
  <div class="ratio"><i class="rb" id="rb"></i><i class="rw" id="rw"></i></div>
  <div id="moves"></div>
  <div class="btns">
    <button class="btn" id="bNew"><i>✦</i><span></span></button>
    <button class="btn" id="bUndo"><i>↶</i><span></span></button>
    <button class="btn" id="bHint"><i>💡</i><span></span></button>
    <button class="btn" id="bFlip"><i>⟲</i><span></span></button>
  </div>
  <div class="set">
    <span id="lTheme"></span><div class="seg" id="segTheme"></div>
    <span id="lSound"></span><div class="seg" id="segSound"></div>
  </div>
</aside>
<div class="modal" id="mStart"><div class="card glass">
  <h1 id="sTitle"></h1><div class="sub">WIIIV · 3D OTHELLO</div>
  <div class="set">
    <span id="lOpp"></span><div class="seg" id="segOpp"></div>
    <span id="lLevel"></span><div class="seg" id="segLevel"></div>
    <span id="lColor"></span><div class="seg" id="segColor"></div>
    <span id="lTheme2"></span><div class="seg" id="segTheme2"></div>
  </div>
  <button class="go" id="bStart"></button>
</div></div>
<div class="modal" id="mOver" hidden><div class="card glass"><h1 id="oTitle"></h1><div class="final" id="oScore"></div><p id="oText"></p><button class="go" id="bAgain"></button><button class="go ghost" id="bReview"></button></div></div>
<div id="nogl" hidden></div>

// ───────────────────────── 갱신 ─────────────────────────
function update(dt) {

}
