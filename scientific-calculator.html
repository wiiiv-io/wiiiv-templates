  cx.fillStyle = 'rgba(40,48,30,0.045)';
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) if (!scr.b[y * LW + x]) cx.fillRect(x * k, y * k, k - g, k - g);
  cx.fillStyle = 'rgba(22,26,18,0.9)';
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) if (scr.b[y * LW + x]) cx.fillRect(x * k, y * k, k - g, k - g);
  // 상태 표시 줄
  sx.clearRect(0, 0, stc.width, stc.height);
  const sk = stc.width / LW, fs = stc.height * 0.82;
  sx.font = `700 ${fs}px Arial, sans-serif`; sx.textBaseline = 'middle';
  for (const [name, x] of IND) {
    const on = st[name]; if (!on) continue;
    sx.fillStyle = 'rgba(22,26,18,0.88)';
    if (name === 'Math') { sx.font = `700 ${fs * 0.95}px Arial`; sx.fillText('√▭', x * sk, stc.height / 2); sx.font = `700 ${fs}px Arial, sans-serif`; continue; }
    if (name === 'D' || name === 'R' || name === 'G') { const w = sx.measureText(name).width + fs * 0.3; sx.fillRect(x * sk, stc.height * 0.08, w, stc.height * 0.84); sx.fillStyle = '#b8bea4'; sx.fillText(name, x * sk + fs * 0.15, stc.height / 2); continue; }
    sx.fillText(name, x * sk, stc.height / 2);
  }
}
// ── 키보드 (PC)
const KB = { Enter: 'eq', '=': 'eq', Backspace: 'del', Delete: 'del', Escape: 'ac', ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  '+': 'add', '-': 'sub', '*': 'mul', '/': 'div', '(': 'lp', ')': 'rp', '^': 'pow', '.': 'dot', ',': 'dot', s: 'sin', c: 'cos', t: 'tan', q: 'sqrt', l: 'logb', n: 'ln', f: 'frac', x: 'x', a: 'ans', e: 'exp', '!': 'inv', m: 'menu', o: 'optn', d: 'sd' };
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) return;
  if (e.key === 'Shift') { press('shift'); flash('shift'); return; }
  if (e.key === 'Alt') { e.preventDefault(); press('alpha'); flash('alpha'); return; }
  let id = /^\d$/.test(e.key) ? 'n' + e.key : KB[e.key];
  if (e.key === 'p') { U.shift = true; id = 'exp'; }
  if (e.key === '!') { U.shift = true; id = 'inv'; }
  if (!id) return;
  e.preventDefault(); flash(id); press(id);
});
// ── 소리 (아주 작은 딸깍, 기본 끔)
function audioTick() { }
// ── 시작
applySet(); buildKeys(); $('hint').textContent = HINT;
new ResizeObserver(layoutLCD).observe($('lcd'));
setInterval(() => { U.blink = !U.blink; if (U.scr === 'edit') draw(); }, 530);
layoutLCD();
window.__calc = { U, ed, press, get VARS() { return VARS; }, get ANS() { return ANS; }, scr, SET: () => SET };
