 {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.":"数式は =（ALPHA {calc}）で始めます。A1 は ALPHA {neg}（A）の後 1、B1 は ALPHA {dms}（B）の後 1 です。=A1×B1 を入力しましょう。","Press {eq} to enter it.":"{eq} を押して確定しましょう。","C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.":"C1 に 2400 と表示されました。A1 や B1 を変えると C1 も自動で計算し直されます。","Filling formulas and totals":"数式のコピーと合計","Fill C1's formula down to C3 and total it in C4.":"C1 の数式を C3 までコピーし、C4 に合計を出します。","Last lesson's sheet is loaded. Go up to C1 with {up}.":"前回の表が入っています。{up} で C1 に移りましょう。","1:Fill Formula in {optn} fills many cells at once. Choose it.":"{optn} の 1:Fill Formula は複数のセルに一度に数式を入れます。選びましょう。","It asks for Form and Range.":"Form と Range をたずねてきます。","Enter A1×B1 as the Form and press {eq} to go to Range.":"Form に A1×B1 を入力し、{eq} で Range に移りましょう。","The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.":"範囲は C1:C1 になっています。{del} で最後の 1 を消し、3 を入力して C1:C3 にしてから {eq}。","C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.":"C2=4000、C3=1500 です。数式は行ごとに A2×B2、A3×B3 とずれて入ります。","Go down to C4 with {down} three times.":"{down} を3回押して C4 に移りましょう。","Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.":"=Sum( を入力します：ALPHA {calc}、次に {optn}、{down}、4:Sum。","Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.":"C1:C3 を入力し、かっこを閉じて {eq} を押しましょう。C は ALPHA {inv}、コロンは ALPHA {int} です。","C4 = 7900. Mean, Min and Max in the same menu work the same way.":"C4 = 7900 です。同じメニューの Mean、Min、Max も同じように使えます。"},"pt":{"Learn":"Aprender","Learn by pressing the keys yourself":"Aprenda apertando as teclas você mesmo","Settings, variables and data changed during a lesson are restored when you close this panel.":"Configurações, variáveis e dados alterados durante uma lição são restaurados quando você fecha este painel.","Lessons":"Lições","Show me":"Mostrar","Restart":"Recomeçar","Next":"Próximo","Next lesson":"Próxima lição","This time, press":"Agora, aperte","Well done! Feel free to keep experimenting.":"Muito bem! Fique à vontade para continuar experimentando.","Close":"Fechar","lessons":"lições","Basics":"Básico","Arithmetic and order of operations":"Aritmética e ordem das operações","Compute 2+3×4 and 3×(2+5).":"Calcule 2+3×4 e 3×(2+5).","Type 2+3×4. The expression appears just as you would write it.":"Digite 2+3×4. A expressão aparece exatamente como você a escreveria.","Nothing is computed yet. You enter the whole expression first.":"Nada foi calculado ainda. Primeiro você digita a expressão inteira.","Press {eq} to compute.":"Aperte {eq} para calcular.","The answer is 14: multiplication comes before addition (3×4=12, then 2+12).":"O resultado é 14: a multiplicação vem antes da adição (3×4=12, depois 2+12).","{ac} clears the expression. Stored values and settings stay.":"{ac} apaga a expressão. Os valores guardados e as configurações continuam.","The screen is empty.":"A tela está vazia.","Use brackets to add first. Enter 3×(2+5) and compute.":"Use parênteses para somar primeiro. Digite 3×(2+5) e calcule.","The answer is 21. The brackets were computed first.":"O resultado é 21. Os parênteses foram calculados primeiro.","Fixing mistakes":"Corrigindo erros","Edit an expression with DEL and ◀.":"Edite uma expressão com DEL e ◀.","Enter 2+5.":"Digite 2+5.","Say the 5 was a mistake. {del} deletes the character before the cursor.":"Digamos que o 5 foi um erro. {del} apaga o caractere antes do cursor.","The 5 is gone.":"O 5 sumiu.","Enter 6 and compute.":"Digite 6 e calcule.","2+6=8.":"2+6=8.","You can still edit after computing. {left} brings the expression back with the cursor at the end.":"Você ainda pode editar depois de calcular. {left} traz a expressão de volta com o cursor no final.","You are editing the expression again.":"Você está editando a expressão de novo.","Delete the 6, enter 9 and compute again.":"Apague o 6, digite 9 e calcule de novo.","2+9=11. No need to retype long expressions.":"2+9=11. Não é preciso redigitar expressões longas.","Negative numbers":"Números negativos","Learn the (−) key versus minus, and squaring negatives.":"Aprenda a diferença entre a tecla (−) e o menos, e o quadrado de negativos.","For a negative number use {neg}, not minus {sub}. Compute (−)3×4.":"Para um número negativo use {neg}, não o menos {sub}. Calcule (−)3×4.","The result is −12.":"O resultado é −12.","Now enter −3² as written. Squaring is {sq}.":"Agora digite −3² como está escrito. O quadrado é {sq}.","You get −9: the square is taken first, then the sign, just like in maths.":"Dá −9: primeiro se eleva ao quadrado, depois se aplica o sinal, como na matemática.","For (−3)², wrap it in brackets.":"Para (−3)², coloque entre parênteses.","The answer is 9.":"O resultado é 9.","Fractions and decimals":"Frações e decimais","Compute 2/3 + 1/4 as a fraction, then as a decimal.":"Calcule 2/3 + 1/4 como fração e depois como decimal.","{frac} makes a fraction box with the cursor in the numerator. Enter 2.":"{frac} cria uma caixa de fração com o cursor no numerador. Digite 2.","Go down to the denominator with {down} and enter 3.":"Desça até o denominador com {down} e digite 3.","Leave the fraction with {right}, then press +.":"Saia da fração com {right} e aperte +.","Enter 1/4 the same way.":"Digite 1/4 do mesmo jeito.","Compute.":"Calcule.","You get the fraction 11/12. The calculator finds the common denominator and reduces.":"Você obtém a fração 11/12. A calculadora encontra o denominador comum e simplifica.","{sd} switches between fraction and decimal.":"{sd} alterna entre fração e decimal.","0.9166666667. Press it again to get the fraction back.":"0.9166666667. Aperte de novo para voltar à fração.","Roots and powers":"Raízes e potências","Compute √8, 2¹⁰ and ∛27, and learn SHIFT.":"Calcule √8, 2¹⁰ e ∛27, e aprenda a usar SHIFT.","Press {sqrt}, enter 8 and compute.":"Aperte {sqrt}, digite 8 e calcule.","You get 2√2, the exact form. Press S⇔D if you want the decimal.":"Você obtém 2√2, a forma exata. Aperte S⇔D se quiser o decimal.","Powers use {pow}. Enter 2, press it to get the exponent box, then enter 10.":"Potências usam {pow}. Digite 2, aperte a tecla para abrir a caixa do expoente e digite 10.","Leave the exponent with {right} and compute.":"Saia do expoente com {right} e calcule.","2¹⁰ = 1024.":"2¹⁰ = 1024.","Yellow labels above the keys need {shift} first. SHIFT then {sqrt} gives ∛. Compute ∛27.":"As legendas amarelas acima das teclas precisam de {shift} antes. SHIFT e depois {sqrt} dá ∛. Calcule ∛27.","The answer is 3. An S lights up on screen while SHIFT is active.":"O resultado é 3. Um S acende na tela enquanto SHIFT está ativo.","Trigonometry and angle units":"Trigonometria e unidades de ângulo","Compute sin 30° and sin⁻¹(0.5).":"Calcule sin 30° e sin⁻¹(0.5).","The D at the top means degrees. {sin} enters sin(. Compute sin(30).":"O D no alto significa graus. {sin} insere sin(. Calcule sin(30).","The result is 1/2.":"O resultado é 1/2.","Inverse functions use SHIFT. Compute sin⁻¹(0.5).":"Funções inversas usam SHIFT. Calcule sin⁻¹(0.5).","30: the angle whose sine is 0.5. To switch to radians use SHIFT, MENU (SETUP), then 2:Angle Unit.":"30: o ângulo cujo seno é 0.5. Para mudar para radianos use SHIFT, MENU (SETUP) e depois 2:Angle Unit.","Logarithms":"Logaritmos","Compute log₂8, log 100 and ln e.":"Calcule log₂8, log 100 e ln e.","{logb} is a log with a chosen base. Enter base 2, move with {right}, enter 8 and compute.":"{logb} é um log com a base que você escolher. Digite a base 2, avance com {right}, digite 8 e calcule.","log₂8 = 3.":"log₂8 = 3.","The common log (base 10) is SHIFT and {neg}. Compute log(100).":"O log decimal (base 10) é SHIFT e {neg}. Calcule log(100).","The result is 2.":"O resultado é 2.","The natural log is {ln}. Enter e with {alpha} then {exp}. Compute ln(e).":"O logaritmo natural é {ln}. Digite e com {alpha} e depois {exp}. Calcule ln(e).","The result is 1. Red labels need ALPHA first.":"O resultado é 1. As legendas vermelhas precisam de ALPHA antes.","Ans and variables":"Ans e variáveis","Reuse the last answer and store a value in A.":"Reutilize a última resposta e guarde um valor em A.","Compute 12×3.":"Calcule 12×3.","The result is 36.":"O resultado é 36.","With a result showing, pressing {div} starts with Ans, the last answer. Continue with ÷4.":"Com um resultado na tela, apertar {div} começa com Ans, a última resposta. Continue com ÷4.","Ans÷4 = 9.":"Ans÷4 = 9.","To keep a value, store it in a variable. Enter 7, press {sto}, then {neg} (its red label is A).":"Para guardar um valor, armazene-o numa variável. Digite 7, aperte {sto} e depois {neg} (sua legenda vermelha é A).","7 is stored in A.":"7 está guardado em A.","Recall A with ALPHA and {neg}, and compute A×2.":"Chame A com ALPHA e {neg}, e calcule A×2.","14. A variable keeps its value until you store a new one.":"14. Uma variável mantém seu valor até você guardar outro.","Scientific notation ×10ˣ":"Notação científica ×10ˣ","Compute 3×10⁸ × 2.":"Calcule 3×10⁸ × 2.","Enter 3×10⁸ with {exp}: type 3, press it to get the exponent box, then enter 8.":"Digite 3×10⁸ com {exp}: digite 3, aperte a tecla para abrir a caixa do expoente e digite 8.","Leave the exponent with {right}, then compute ×2.":"Saia do expoente com {right} e calcule ×2.","600000000. Without leaving the exponent, ×2 would go into the exponent and give a very different number.":"600000000. Sem sair do expoente, o ×2 entraria no expoente e daria um número bem diferente.","Equations":"Equações","Substituting values with CALC":"Substituindo valores com CALC","Evaluate x²+3x at x=2 and x=5.":"Calcule x²+3x para x=2 e x=5.","Enter x²+3x. x is the {x} key, squaring is {sq}.":"Digite x²+3x. x é a tecla {x}, o quadrado é {sq}.","{calc} evaluates the expression for a value you give. Press it.":"{calc} calcula a expressão para um valor que você informa. Aperte.","It asks for x.":"Ela pede o valor de x.","Enter 2 and press {eq}.":"Digite 2 e aperte {eq}.","At x=2 the value is 10 (4+6).":"Para x=2 o valor é 10 (4+6).","Press {calc} again to try another value. Enter 5 and compute.":"Aperte {calc} de novo para testar outro valor. Digite 5 e calcule.","At x=5 it is 40. Handy for filling in a table without retyping.":"Para x=5 dá 40. Prático para preencher uma tabela sem redigitar.","Solving with SOLVE":"Resolvendo com SOLVE","Solve 2x+3=11 with SOLVE.":"Resolva 2x+3=11 com SOLVE.","SOLVE works on any equation typed on the calculation screen. Enter 2x+3.":"SOLVE funciona com qualquer equação digitada na tela de cálculo. Digite 2x+3.","The equals sign of an equation is {alpha} then {calc} (red =). Add =11.":"O sinal de igual de uma equação é {alpha} e depois {calc} (= vermelho). Acrescente =11.","Now it reads 2x+3=11. This equals sign is part of the equation, not the compute key.":"Agora aparece 2x+3=11. Esse sinal de igual faz parte da equação, não é a tecla de calcular.","Press {shift} then {calc} (SOLVE).":"Aperte {shift} e depois {calc} (SOLVE).","It asks for a starting value of x; the search starts from the value x holds now.":"Ela pede um valor inicial de x; a busca começa pelo valor que x tem agora.","Press {eq} to solve.":"Aperte {eq} para resolver.","x=4. L−R=0 underneath means left side minus right side is 0: the solution is exact.":"x=4. O L−R=0 embaixo significa lado esquerdo menos lado direito igual a 0: a solução é exata.","Choosing a starting value":"Escolhendo um valor inicial","Find the negative root of x²=2.":"Encontre a raiz negativa de x²=2.","Enter x²=2. The equals sign is ALPHA and {calc}.":"Digite x²=2. O sinal de igual é ALPHA e {calc}.","Open SOLVE with SHIFT and {calc}.":"Abra o SOLVE com SHIFT e {calc}.","With two roots (±√2), SOLVE finds the one near the starting value. Enter −1 as the start and press {eq}.":"Com duas raízes (±√2), o SOLVE encontra a mais próxima do valor inicial. Digite −1 como início e aperte {eq}.","The starting value is now −1.":"O valor inicial agora é −1.","x=−1.414213562 (−√2). Start from 1 and you get +√2. For several roots, try different starting values.":"x=−1.414213562 (−√2). Começando de 1 você obtém +√2. Para várias raízes, teste valores iniciais diferentes.","Simultaneous equations":"Sistemas de equações","Solve 2x+3y=8 and x−y=−1.":"Resolva 2x+3y=8 e x−y=−1.","Press {menu}. Equation/Func is the 10th app, so choose it with the {neg} key (red A).":"Aperte {menu}. Equation/Func é o 10º app, então escolha-o com a tecla {neg} (A vermelho).","Now choose the kind of equation.":"Agora escolha o tipo de equação.","Choose 1:Simul Equation, then 2 unknowns.":"Escolha 1:Simul Equation e depois 2 incógnitas.","A coefficient table for ax+by=c appears.":"Aparece uma tabela de coeficientes para ax+by=c.","Enter 2, 3, 8 for 2x+3y=8. Each {eq} moves one cell right.":"Digite 2, 3, 8 para 2x+3y=8. Cada {eq} avança uma célula para a direita.","At the end of a row it moves to the next one.":"No fim de uma linha, ele passa para a próxima.","For x−y=−1 the coefficients are 1, −1, −1. Use {neg} for negatives.":"Para x−y=−1 os coeficientes são 1, −1, −1. Use {neg} para os negativos.","All coefficients are in.":"Todos os coeficientes foram digitados.","When no cell is being edited, {eq} solves.":"Quando nenhuma célula está sendo editada, {eq} resolve.","x=1.":"x=1.","Press {eq} again for the next unknown.":"Aperte {eq} de novo para a próxima incógnita.","y=2. Check: 2+6=8 and 1−2=−1.":"y=2. Confira: 2+6=8 e 1−2=−1.","Quadratics and the vertex":"Equações do 2º grau e o vértice","Solve x²−5x+6=0 and find the vertex of the parabola.":"Resolva x²−5x+6=0 e encontre o vértice da parábola.","Press {menu}, {neg}, then 2:Polynomial and degree 2.":"Aperte {menu}, {neg}, depois 2:Polynomial e grau 2.","This is the table for ax²+bx+c=0.":"Esta é a tabela para ax²+bx+c=0.","Enter the coefficients 1, −5, 6.":"Digite os coeficientes 1, −5, 6.","x₁=3.":"x₁=3.","Press {eq} for the other root.":"Aperte {eq} para a outra raiz.","x₂=2.":"x₂=2.","Press {eq} twice more for the vertex of y=x²−5x+6.":"Aperte {eq} mais duas vezes para ver o vértice de y=x²−5x+6.","The vertex is x=2.5, y=−0.25, the minimum: useful for sketching the graph.":"O vértice é x=2.5, y=−0.25, o mínimo: útil para esboçar o gráfico.","When there are no real roots":"Quando não há raízes reais","See the complex roots of x²+2x+5=0.":"Veja as raízes complexas de x²+2x+5=0.","Open the quadratic table with {menu}, {neg}, 2, 2.":"Abra a tabela da equação do 2º grau com {menu}, {neg}, 2, 2.","Enter the coefficients 1, 2, 5.":"Digite os coeficientes 1, 2, 5.","x₁=−1+2i. The discriminant b²−4ac=−16 is negative, so the roots are complex.":"x₁=−1+2i. O discriminante b²−4ac=−16 é negativo, então as raízes são complexas.","x₂=−1−2i. To see just \"no real roots\" instead, set Equation/Func to Off in SETUP.":"x₂=−1−2i. Para ver apenas \"sem raízes reais\", deixe Equation/Func em Off no SETUP.","Calculus and sums":"Cálculo e somatórios","Definite integrals":"Integrais definidas","Compute ∫₀² x² dx.":"Calcule ∫₀² x² dx.","{int} makes an integral box with the cursor in the integrand. Enter x².":"{int} cria uma caixa de integral com o cursor no integrando. Digite x².","Move with {right} to the lower limit and enter 0, then {right} again to the upper limit and enter 2.":"Avance com {right} até o limite inferior e digite 0, depois {right} de novo até o limite superior e digite 2.","8/3 (about 2.667): by hand, x³/3 evaluated from 0 to 2.":"8/3 (cerca de 2.667): à mão, x³/3 avaliado de 0 a 2.","Integrating trig functions in radians":"Integrando funções trigonométricas em radianos","Compute ∫₀^π sin x dx.":"Calcule ∫₀^π sin x dx.","Calculus with trig functions uses radians. Press {shift}, {menu} (SETUP), then 2:Angle Unit.":"Cálculo com funções trigonométricas usa radianos. Aperte {shift}, {menu} (SETUP) e depois 2:Angle Unit.","Choose 2:Radian.":"Escolha 2:Radian.","The indicator at the top changed from D to R.":"O indicador no alto mudou de D para R.","Press {int} and enter sin(x).":"Aperte {int} e digite sin(x).","Enter 0 and π as the limits and compute. π is SHIFT then {exp}.":"Digite 0 e π como limites e calcule. π é SHIFT e depois {exp}.","2. In degree mode the angle would be read in degrees and the answer would be wrong.":"2. No modo graus, o ângulo seria lido em graus e o resultado sairia errado.","Derivatives at a point":"Derivada num ponto","Find the derivative of x³ at x=2.":"Encontre a derivada de x³ em x=2.","SHIFT then {int} gives the derivative. Enter x³ (SHIFT then {sq}).":"SHIFT e depois {int} dá a derivada. Digite x³ (SHIFT e depois {sq}).","Move with {right} to x=, enter 2 and compute.":"Avance com {right} até x=, digite 2 e calcule.","12. The derivative of x³ is 3x², which is 12 at x=2.":"12. A derivada de x³ é 3x², que vale 12 em x=2.","Sums with Σ":"Somatórios com Σ","Sum 1 to 10, then the squares.":"Some de 1 a 10 e depois os quadrados.","SHIFT then {x} gives Σ. Enter x as the term.":"SHIFT e depois {x} dá Σ. Digite x como termo.","Move with {right} to enter the start 1, then {right} again for the end 10, and compute.":"Avance com {right} para digitar o início 1, depois {right} de novo para o fim 10, e calcule.","1+2+…+10 = 55.":"1+2+…+10 = 55.","Change only the term to get other sums. Sum x² over the same range.":"Mude só o termo para obter outras somas. Some x² no mesmo intervalo.","1²+2²+…+10² = 385. Check it with n(n+1)(2n+1)/6.":"1²+2²+…+10² = 385. Confira com n(n+1)(2n+1)/6.","Statistics":"Estatística","Enter data and find the mean":"Digite dados e encontre a média","Find the mean of 4, 7, 9, 6, 4.":"Encontre a média de 4, 7, 9, 6, 4.","{menu} opens the app list.":"{menu} abre a lista de apps.","There are 12 apps.":"Há 12 apps.","Press 6 to open Statistics.":"Aperte 6 para abrir Statistics.","Now choose the kind of statistics.":"Agora escolha o tipo de estatística.","1:1-Variable is for a single list of data. Press 1.":"1:1-Variable é para uma única lista de dados. Aperte 1.","The data table is open.":"A tabela de dados está aberta.","Enter the first value 4 and press {eq}.":"Digite o primeiro valor 4 e aperte {eq}.","4 is in row 1 and the cursor moved down.":"O 4 está na linha 1 e o cursor desceu.","Enter 7, 9, 6 and 4 the same way.":"Digite 7, 9, 6 e 4 do mesmo jeito.","All 5 values are in.":"Os 5 valores foram digitados.","{optn} opens the statistics menu.":"{optn} abre o menu de estatística.","3:1-Variable Calc shows the results.":"3:1-Variable Calc mostra os resultados.","Press 3.":"Aperte 3.","x̄=6 is the mean and Σx=30 the sum. The next lesson reads the rest of the list.":"x̄=6 é a média e Σx=30 a soma. A próxima lição lê o resto da lista.","Reading the results":"Lendo os resultados","Find both standard deviations, the median and quartiles.":"Encontre os dois desvios padrão, a mediana e os quartis.","Results for 4, 7, 9, 6, 4 are showing, 4 lines at a time. Press {down} four times.":"Os resultados de 4, 7, 9, 6, 4 estão na tela, 4 linhas por vez. Aperte {down} quatro vezes.","σx is the population standard deviation (divide by n); sx is the sample one (divide by n−1). Check which one a question asks for.":"σx é o desvio padrão populacional (divide por n); sx é o amostral (divide por n−1). Veja qual deles a questão pede.","Go down four more times.":"Desça mais quatro vezes.","Med=6 is the median; Q1=4 and Q3=8 are the quartiles.":"Med=6 é a mediana; Q1=4 e Q3=8 são os quartis.","Press {ac} to go back to the data table.":"Aperte {ac} para voltar à tabela de dados.","The data is still there, ready to edit and recompute.":"Os dados continuam lá, prontos para editar e recalcular.","Editing and deleting data":"Editando e apagando dados","Change one value, delete another and recompute.":"Altere um valor, apague outro e recalcule.","The table holds 4, 7, 9, 6, 4 and the cursor is on empty row 6. Press {up} twice to reach the 6 in row 4.":"A tabela tem 4, 7, 9, 6, 4 e o cursor está na linha vazia 6. Aperte {up} duas vezes para chegar ao 6 da linha 4.","Row 4 is highlighted.":"A linha 4 está destacada.","Enter 8 and press {eq} to replace 6 with 8.":"Digite 8 e aperte {eq} para trocar o 6 por 8.","Done. The cursor moved to row 5.":"Pronto. O cursor foi para a linha 5.","{del} deletes the whole row under the cursor. Delete the 4 in row 5.":"{del} apaga a linha inteira sob o cursor. Apague o 4 da linha 5.","The data is now 4, 7, 9, 8.":"Agora os dados são 4, 7, 9, 8.","Recompute with {optn} then 3.":"Recalcule com {optn} e depois 3.","x̄=7 and n=4. Results follow the edited data.":"x̄=7 e n=4. Os resultados acompanham os dados editados.","Using frequencies":"Usando frequências","Mean of 3 people scoring 10, 5 scoring 20, 2 scoring 30.":"Média de 3 pessoas com nota 10, 5 com nota 20 e 2 com nota 30.","Repeated values are quicker with a Freq column. Open the setup first: {shift} then {menu} (SETUP).":"Valores repetidos são mais rápidos com uma coluna Freq. Primeiro abra a configuração: {shift} e depois {menu} (SETUP).","This is the setup list.":"Esta é a lista de configurações.","Go to the next page with {down} and pick 3:Statistics.":"Vá para a próxima página com {down} e escolha 3:Statistics.","It asks whether to show the frequency column.":"Ela pergunta se deve mostrar a coluna de frequência.","Choose 1:On.":"Escolha 1:On.","The Freq column is on.":"A coluna Freq está ativada.","Open the 1-Variable table with {menu}, 6, 1.":"Abra a tabela 1-Variable com {menu}, 6, 1.","A Freq column now sits next to x.":"Agora há uma coluna Freq ao lado de x.","Enter the scores 10, 20, 30.":"Digite as notas 10, 20, 30.","Each Freq starts at 1.":"Cada Freq começa em 1.","Move to Freq with {right}, then up three times with {up} to row 1.":"Vá para Freq com {right} e suba três vezes com {up} até a linha 1.","Enter the counts 3, 5, 2.":"Digite as quantidades 3, 5, 2.","3 people scored 10, 5 scored 20, 2 scored 30.":"3 pessoas tiraram 10, 5 tiraram 20 e 2 tiraram 30.","Compute with {optn} then 3.":"Calcule com {optn} e depois 3.","x̄=19 is the mean score; n=10 is the number of people.":"x̄=19 é a nota média; n=10 é o número de pessoas.","Two variables and regression":"Duas variáveis e regressão","Fit y=a+bx to study hours and scores.":"Ajuste y=a+bx a horas de estudo e notas.","Press {menu}, 6, then choose 2:y=a+bx for paired data.":"Aperte {menu}, 6 e escolha 2:y=a+bx para dados emparelhados.","The table has x and y columns.":"A tabela tem colunas x e y.","Enter study hours x: 1, 2, 3, 4, 5.":"Digite as horas de estudo x: 1, 2, 3, 4, 5.","Move to y with {right}, then press {up} five times to reach row 1.":"Vá para y com {right} e aperte {up} cinco vezes até a linha 1.","Enter scores y: 2, 4, 5, 4, 5.":"Digite as notas y: 2, 4, 5, 4, 5.","Press {optn}, then 4:Regression Calc.":"Aperte {optn} e depois 4:Regression Calc.","a=2.2 and b=0.6, so y=2.2+0.6x. r≈0.775 is the correlation; the closer to ±1, the straighter the data.":"a=2.2 e b=0.6, então y=2.2+0.6x. r≈0.775 é a correlação; quanto mais perto de ±1, mais os dados se alinham numa reta.","Predicting with ŷ":"Prevendo com ŷ","Predict the score ŷ for x=6.":"Preveja a nota ŷ para x=6.","Last lesson's data is loaded. Press {ac} for the calculation screen; the data and fit stay.":"Os dados da última lição estão carregados. Aperte {ac} para a tela de cálculo; os dados e a reta de regressão continuam.","Enter 6 and press {optn}.":"Digite 6 e aperte {optn}.","Go to the next page with {down} and choose 4:Regression.":"Vá para a próxima página com {down} e escolha 4:Regression.","Press {down}, then 1 to insert ŷ.":"Aperte {down} e depois 1 para inserir ŷ.","The expression reads 6ŷ: \"y when x is 6\".":"A expressão fica 6ŷ: \"y quando x é 6\".","5.8 = 2.2+0.6×6. x̂ works the other way, from y to x.":"5.8 = 2.2+0.6×6. x̂ funciona ao contrário, de y para x.","Distributions":"Distribuições","Normal probability between two values":"Probabilidade normal entre dois valores","Heights average 170 cm with SD 6 cm: find P(165 ≤ X ≤ 180).":"As alturas têm média 170 cm e desvio padrão 6 cm: encontre P(165 ≤ X ≤ 180).","Open the Distribution app with {menu}, 7.":"Abra o app Distribution com {menu}, 7.","Choose a distribution.":"Escolha uma distribuição.","2:Normal CD gives the probability between two values. Press 2.":"2:Normal CD dá a probabilidade entre dois valores. Aperte 2.","It asks for Lower, Upper, σ (standard deviation) and μ (mean).":"Ela pede Lower, Upper, σ (desvio padrão) e μ (média).","Enter Lower 165 and Upper 180; each {eq} moves to the next line.":"Digite Lower 165 e Upper 180; cada {eq} passa para a próxima linha.","Enter σ=6 and μ=170.":"Digite σ=6 e μ=170.","With every value in, press {eq} to compute.":"Com todos os valores digitados, aperte {eq} para calcular.","P≈0.7499: about 75% are between 165 and 180 cm. No z-table needed.":"P≈0.7499: cerca de 75% estão entre 165 e 180 cm. Sem precisar de tabela z.","Cut-off for the top few percent":"Valor de corte para os primeiros por cento","Find the height that marks the top 5%.":"Encontre a altura que marca os 5% mais altos.","Press {menu}, 7, then 3:Inverse Normal.":"Aperte {menu}, 7 e depois 3:Inverse Normal.","It works backwards from an area to x.":"Ela faz o caminho inverso, de uma área para x.","Area is measured from the left. The top 5% starts where the lower 95% ends, so enter 0.95.":"A Area é medida a partir da esquerda. Os 5% mais altos começam onde terminam os 95% de baixo, então digite 0.95.","Enter σ=6, μ=170 and compute.":"Digite σ=6, μ=170 e calcule.","About 179.87 cm: taller than that is the top 5%.":"Cerca de 179.87 cm: acima disso estão os 5% mais altos.","Binomial distribution":"Distribuição binomial","Toss a coin 10 times: P(exactly 3 heads) and P(at most 3).":"Lance uma moeda 10 vezes: P(exatamente 3 caras) e P(no máximo 3).","Press {menu}, 7, then 4:Binomial PD. PD means \"exactly x times\".":"Aperte {menu}, 7 e depois 4:Binomial PD. PD significa \"exatamente x vezes\".","List handles many x values at once; Variable handles one.":"List trata vários valores de x de uma vez; Variable trata um só.","Choose 2:Variable.":"Escolha 2:Variable.","Enter x=3 (heads), N=10 (tosses), p=0.5 (chance of heads).":"Digite x=3 (caras), N=10 (lançamentos), p=0.5 (chance de cara).","0.1171875, about 11.7%.":"0.1171875, cerca de 11.7%.","\"At most 3\" is the cumulative Binomial CD. Press {optn} for the list, then 5 and 2.":"\"No máximo 3\" é a acumulada Binomial CD. Aperte {optn} para a lista, depois 5 e 2.","Enter 3, 10, 0.5 again and compute.":"Digite 3, 10, 0.5 de novo e calcule.","0.171875: the chances of 0, 1, 2 and 3 heads added together.":"0.171875: as chances de 0, 1, 2 e 3 caras somadas.","Matrices":"Matrizes","Entering a matrix and its determinant":"Digitando uma matriz e seu determinante","Enter A=[[2,1],[5,3]] and find its determinant.":"Digite A=[[2,1],[5,3]] e encontre seu determinante.","Open the Matrix app with {menu}, 4.":"Abra o app Matrix com {menu}, 4.","Choose which matrix to define: MatA to MatD.":"Escolha qual matriz definir: MatA a MatD.","Choose 1:MatA, then 2 rows and 2 columns.":"Escolha 1:MatA, depois 2 linhas e 2 colunas.","A 2×2 grid appears.":"Aparece uma grade 2×2.","Enter 2, 1, 5, 3. Each {eq} moves right, then down to the next row.":"Digite 2, 1, 5, 3. Cada {eq} avança para a direita e depois desce para a próxima linha.","A=[[2,1],[5,3]].":"A=[[2,1],[5,3]].","Go to the calculation screen with {ac}.":"Vá para a tela de cálculo com {ac}.","The matrix stays stored.":"A matriz continua guardada.","Press {optn}, go to the second page with {down}, choose 2:Determinant.":"Aperte {optn}, vá para a segunda página com {down} e escolha 2:Determinant.","Det( is entered.":"Det( foi inserido.","Insert MatA with {optn} then 3, close the bracket and compute.":"Insira MatA com {optn} e depois 3, feche o parêntese e calcule.","det A = 2×3 − 1×5 = 1.":"det A = 2×3 − 1×5 = 1.","Inverse matrix":"Matriz inversa","Find the inverse of A=[[2,1],[5,3]].":"Encontre a inversa de A=[[2,1],[5,3]].","Matrix A is already defined. Press {ac} for the calculation screen.":"A matriz A já está definida. Aperte {ac} para a tela de cálculo.","Insert MatA with {optn} then 3.":"Insira MatA com {optn} e depois 3.","{inv} gives the inverse. Press it and compute.":"{inv} dá a inversa. Aperte e calcule.","A⁻¹=[[3,−1],[−5,2]]; integers because det A = 1. With det 0 there is no inverse and you get Math ERROR.":"A⁻¹=[[3,−1],[−5,2]]; inteiros porque det A = 1. Com det 0 não há inversa e aparece Math ERROR.","Multiplying matrices":"Multiplicando matrizes","Define B=[[1],[2]] and compute A×B.":"Defina B=[[1],[2]] e calcule A×B.","A is defined. Now define B: {optn}, 1:Define Matrix, 2:MatB.":"A está definida. Agora defina B: {optn}, 1:Define Matrix, 2:MatB.","Choose 2 rows and 1 column.":"Escolha 2 linhas e 1 coluna.","Enter 1 and 2.":"Digite 1 e 2.","Press {ac} and enter MatA×MatB: MatA is {optn} 3, MatB is {optn} 4.":"Aperte {ac} e digite MatA×MatB: MatA é {optn} 3, MatB é {optn} 4.","MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). The first matrix's columns must match the second's rows.":"MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). O número de colunas da primeira matriz deve ser igual ao de linhas da segunda.","Vectors":"Vetores","Entering vectors and the dot product":"Digitando vetores e o produto escalar","Find the dot product of A=(1,2,3) and B=(4,5,6).":"Encontre o produto escalar de A=(1,2,3) e B=(4,5,6).","Open the Vector app with {menu}, 5.":"Abra o app Vector com {menu}, 5.","Choose 1:VctA and dimension 3.":"Escolha 1:VctA e dimensão 3.","Enter 1, 2, 3.":"Digite 1, 2, 3.","Now define B: {optn}, 1:Define Vector, 2:VctB, dimension 3.":"Agora defina B: {optn}, 1:Define Vector, 2:VctB, dimensão 3.","Enter 4, 5, 6.":"Digite 4, 5, 6.","Press {ac}, then insert VctA with {optn} 3.":"Aperte {ac} e insira VctA com {optn} 3.","The dot is on the second page of {optn}: 2:Dot Product.":"O ponto fica na segunda página de {optn}: 2:Dot Product.","Insert VctB with {optn} 4 and compute.":"Insira VctB com {optn} 4 e calcule.","32 (1×4+2×5+3×6). A dot product of 0 means the vectors are perpendicular.":"32 (1×4+2×5+3×6). Um produto escalar 0 significa que os vetores são perpendiculares.","Cross product and angle":"Produto vetorial e ângulo","Find the cross product of A and B and the angle between them.":"Encontre o produto vetorial de A e B e o ângulo entre eles.","A and B are defined. Press {ac} and enter VctA×VctB; {mul} between vectors is the cross product.":"A e B estão definidos. Aperte {ac} e digite VctA×VctB; {mul} entre vetores é o produto vetorial.","(−3, 6, −3), perpendicular to both A and B.":"(−3, 6, −3), perpendicular a A e a B.","Press {ac}, then 3:Angle on the second page of {optn}.":"Aperte {ac} e depois 3:Angle na segunda página de {optn}.","Enter VctA, a comma, VctB, close the bracket and compute. The comma is SHIFT then {rp}.":"Digite VctA, uma vírgula, VctB, feche o parêntese e calcule. A vírgula é SHIFT e depois {rp}.","About 12.93°. It follows the angle unit setting (D or R).":"Cerca de 12.93°. Segue a configuração da unidade de ângulo (D ou R).","Function tables":"Tabelas de funções","Making a table of values":"Montando uma tabela de valores","Tabulate f(x)=x²−2x for x from −2 to 4.":"Tabele f(x)=x²−2x para x de −2 a 4.","Open the Table app with {menu}, 9.":"Abra o app Table com {menu}, 9.","Enter f(x)= here.":"Digite f(x)= aqui.","Enter x²−2x and press {eq}.":"Digite x²−2x e aperte {eq}.","It also asks for g(x)=. Leave it empty for a single function.":"Ela também pede g(x)=. Deixe vazio para uma única função.","Leave g(x) empty and press {eq}.":"Deixe g(x) vazio e aperte {eq}.","Now set the range: Start, End and Step.":"Agora defina o intervalo: Start, End e Step.","Enter Start −2, End 4, Step 1.":"Digite Start −2, End 4, Step 1.","Press {eq} to build the table.":"Aperte {eq} para montar a tabela.","f(x)=0 at x=0 and x=2, where the graph meets the x-axis; the minimum −1 is at x=1. Scroll with {up}{down}.":"f(x)=0 em x=0 e x=2, onde o gráfico corta o eixo x; o mínimo −1 está em x=1. Role com {up}{down}.","Comparing two functions":"Comparando duas funções","Find where 2ˣ and x² are equal.":"Descubra onde 2ˣ e x² são iguais.","Open Table with {menu}, 9 and enter f(x)=2ˣ: use {pow} for the exponent and leave it with {right}.":"Abra Table com {menu}, 9 e digite f(x)=2ˣ: use {pow} para o expoente e saia dele com {right}.","This time also enter g(x)=x².":"Desta vez digite também g(x)=x².","Use Start 1, End 5, Step 1 and build the table.":"Use Start 1, End 5, Step 1 e monte a tabela.","They match at x=2 and x=4 (4=4, 16=16). At x=3, x² is bigger; from x=5, 2ˣ pulls ahead.":"Elas coincidem em x=2 e x=4 (4=4, 16=16). Em x=3, x² é maior; a partir de x=5, 2ˣ passa na frente.","Number bases":"Bases numéricas","Decimal to hex and binary":"De decimal para hexadecimal e binário","Convert 255 to hexadecimal and binary.":"Converta 255 para hexadecimal e binário.","Open the Base-N app with {menu}, 3.":"Abra o app Base-N com {menu}, 3.","Dec at the bottom means decimal.":"Dec embaixo significa decimal.","Enter 255 and press {eq}.":"Digite 255 e aperte {eq}.","Press {pow}, the key with blue HEX.":"Aperte {pow}, a tecla com HEX em azul.","FF. In Base-N the blue labels are what the keys do.":"FF. No Base-N, as legendas azuis são o que as teclas fazem.","Press {logb}, the key with blue BIN.":"Aperte {logb}, a tecla com BIN em azul.","11111111: the same value in another base. DEC ({sq}) gets 255 back.":"11111111: o mesmo valor em outra base. DEC ({sq}) traz o 255 de volta.","Hexadecimal arithmetic":"Aritmética hexadecimal","Compute 1F + A in hexadecimal.":"Calcule 1F + A em hexadecimal.","Press {menu}, 3, then {pow} (HEX).":"Aperte {menu}, 3 e depois {pow} (HEX).","The screen shows Hex.":"A tela mostra Hex.","A to F are the red-label keys, typed directly. 1F is 1 then {tan} (F).":"De A a F são as teclas com legenda vermelha, digitadas diretamente. 1F é 1 e depois {tan} (F).","Add A ({neg}) and compute.":"Some A ({neg}) e calcule.","29, which is 31+10=41 in decimal.":"29, que em decimal é 31+10=41.","Binary logic operations":"Operações lógicas binárias","Compute 1100 and 1010.":"Calcule 1100 and 1010.","Press {menu}, 3, then {logb} (BIN).":"Aperte {menu}, 3 e depois {logb} (BIN).","Enter 1100.":"Digite 1100.","Choose 1:and from {optn}.":"Escolha 1:and em {optn}.","Enter 1010 and compute.":"Digite 1010 e calcule.","1000: only bits set in both stay 1. or, xor and Not are in the same menu.":"1000: só os bits que valem 1 nos dois continuam 1. or, xor e Not estão no mesmo menu.","Complex numbers":"Números complexos","Complex arithmetic":"Aritmética de complexos","Compute (2+3i)(1−i).":"Calcule (2+3i)(1−i).","Open the Complex app with {menu}, 2.":"Abra o app Complex com {menu}, 2.","Here the {eng} key types i (purple label).":"Aqui a tecla {eng} digita i (legenda roxa).","Enter (2+3i).":"Digite (2+3i).","Add (1−i) and compute.":"Acrescente (1−i) e calcule.","5+i, since 2−2i+3i−3i² = 5+i with i²=−1.":"5+i, pois 2−2i+3i−3i² = 5+i com i²=−1.","Modulus, conjugate and polar form":"Módulo, conjugado e forma polar","Find |3+4i|, its conjugate, and 1+i in polar form.":"Encontre |3+4i|, seu conjugado e 1+i na forma polar.","The modulus is the absolute value: SHIFT then {lp} (Abs), enter 3+4i, leave with {right} and compute.":"O módulo é o valor absoluto: SHIFT e depois {lp} (Abs), digite 3+4i, saia com {right} e calcule.","5, which is √(3²+4²).":"5, que é √(3²+4²).","The conjugate is 2:Conjugate in {optn}. Compute Conjg(3+4i).":"O conjugado é 2:Conjugate em {optn}. Calcule Conjg(3+4i).","3−4i: only the sign of the imaginary part flips.":"3−4i: só o sinal da parte imaginária muda.","Now enter 1+i, choose 5:▶r∠θ from {optn}, and compute.":"Agora digite 1+i, escolha 5:▶r∠θ em {optn} e calcule.","√2∠45: distance √2 from the origin at 45°. To always see polar form, set Complex to r∠θ in SETUP.":"√2∠45: distância √2 da origem a 45°. Para ver sempre a forma polar, deixe Complex em r∠θ no SETUP.","Inequalities and ratios":"Inequações e proporções","Quadratic inequalities":"Inequações do 2º grau","Solve x²−5x+6<0 and x²−5x+6>0.":"Resolva x²−5x+6<0 e x²−5x+6>0.","Press {menu}. Inequality is the 11th app, chosen with the {dms} key (red B).":"Aperte {menu}. Inequality é o 11º app, escolhido com a tecla {dms} (B vermelho).","It asks for the degree.":"Ela pede o grau.","Press 2 for degree 2.":"Aperte 2 para grau 2.","Four inequality forms appear.":"Aparecem quatro formas de inequação.","Choose 2:ax²+bx+c<0.":"Escolha 2:ax²+bx+c<0.","2<x<3: where the parabola is below the x-axis.":"2<x<3: onde a parábola fica abaixo do eixo x.","Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.":"Agora inverta o sinal: {ac} volta à tabela e {optn} recomeça. Escolha 2 e depois 1:>0.","Enter 1, −5, 6 again and solve.":"Digite 1, −5, 6 de novo e resolva.","x<2, 3<x: exactly the other side.":"x<2, 3<x: exatamente o outro lado.","Proportions":"Proporções","Find X in 3:4 = X:12.":"Encontre X em 3:4 = X:12.","Press {menu}, then the {inv} key (red C) for the 12th app, Ratio.":"Aperte {menu} e depois a tecla {inv} (C vermelho) para o 12º app, Ratio.","Two forms, with X in different places.":"Duas formas, com X em lugares diferentes.","Choose 1:A:B=X:D.":"Escolha 1:A:B=X:D.","Enter A=3, B=4, D=12.":"Digite A=3, B=4, D=12.","X=9, since 3×12=4×X. Handy for scaling recipes or map distances.":"X=9, pois 3×12=4×X. Prático para ajustar receitas ou distâncias em mapas.","Spreadsheet":"Planilha","Values and formulas":"Valores e fórmulas","Enter prices and quantities, then the formula =A1×B1.":"Digite preços e quantidades e depois a fórmula =A1×B1.","Open the Spreadsheet app with {menu}, 8.":"Abra o app Spreadsheet com {menu}, 8.","Columns A–E, rows 1–45. The cursor is on A1.":"Colunas A–E, linhas 1–45. O cursor está em A1.","Enter prices 1200, 800, 1500 down column A; {eq} moves down.":"Digite os preços 1200, 800, 1500 na coluna A; {eq} desce.","Move to column B with {right}, then {up} three times to B1.":"Vá para a coluna B com {right} e depois {up} três vezes até B1.","Enter quantities 2, 5, 1.":"Digite as quantidades 2, 5, 1.","Go to C1 with {right} and {up} three times.":"Vá para C1 com {right} e {up} três vezes.","Formulas start with = (ALPHA {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.":"Fórmulas começam com = (ALPHA {calc}). A1 é ALPHA {neg} (A) e depois 1; B1 é ALPHA {dms} (B) e depois 1. Digite =A1×B1.","Press {eq} to enter it.":"Aperte {eq} para inserir.","C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.":"C1 mostra 2400. Altere A1 ou B1 e C1 recalcula sozinho.","Filling formulas and totals":"Preenchendo fórmulas e totais","Fill C1's formula down to C3 and total it in C4.":"Preencha a fórmula de C1 até C3 e some o total em C4.","Last lesson's sheet is loaded. Go up to C1 with {up}.":"A planilha da última lição está carregada. Suba até C1 com {up}.","1:Fill Formula in {optn} fills many cells at once. Choose it.":"1:Fill Formula em {optn} preenche várias células de uma vez. Escolha.","It asks for Form and Range.":"Ela pede Form e Range.","Enter A1×B1 as the Form and press {eq} to go to Range.":"Digite A1×B1 como Form e aperte {eq} para ir a Range.","The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.":"O intervalo aparece como C1:C1. Apague o último 1 com {del}, digite 3 para C1:C3 e depois {eq}.","C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.":"C2=4000 e C3=1500: a fórmula se ajusta para A2×B2 e A3×B3 linha a linha.","Go down to C4 with {down} three times.":"Desça até C4 com {down} três vezes.","Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.":"Digite =Sum(: ALPHA {calc}, depois {optn}, {down}, 4:Sum.","Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.":"Digite C1:C3, feche o parêntese e aperte {eq}. C é ALPHA {inv}; os dois-pontos são ALPHA {int}.","C4 = 7900. Mean, Min and Max in the same menu work the same way.":"C4 = 7900. Mean, Min e Max, no mesmo menu, funcionam do mesmo jeito."},"ru":{"Learn":"Обучение","Learn by pressing the keys yourself":"Учитесь, нажимая клавиши сами","Settings, variables and data changed during a lesson are restored when you close this panel.":"Настройки, переменные и данные, изменённые во время урока, восстановятся, когда вы закроете эту панель.","Lessons":"Уроки","Show me":"Показать","Restart":"Сначала","Next":"Далее","Next lesson":"Следующий урок","This time, press":"Теперь нажмите","Well done! Feel free to keep experimenting.":"Отлично! Можете продолжать экспериментировать.","Close":"Закрыть","lessons":"уроков","Basics":"Основы","Arithmetic and order of operations":"Арифметика и порядок действий","Compute 2+3×4 and 3×(2+5).":"Вычислите 2+3×4 и 3×(2+5).","Type 2+3×4. The expression appears just as you would write it.":"Введите 2+3×4. Выражение отображается так же, как вы его пишете.","Nothing is computed yet. You enter the whole expression first.":"Пока ничего не вычислено. Сначала вводится всё выражение.","Press {eq} to compute.":"Нажмите {eq}, чтобы вычислить.","The answer is 14: multiplication comes before addition (3×4=12, then 2+12).":"Ответ 14: умножение выполняется раньше сложения (3×4=12, затем 2+12).","{ac} clears the expression. Stored values and settings stay.":"{ac} очищает выражение. Сохранённые значения и настройки остаются.","The screen is empty.":"Экран пуст.","Use brackets to add first. Enter 3×(2+5) and compute.":"Чтобы сначала выполнить сложение, используйте скобки. Введите 3×(2+5) и вычислите.","The answer is 21. The brackets were computed first.":"Ответ 21. Сначала было вычислено выражение в скобках.","Fixing mistakes":"Исправление ошибок","Edit an expression with DEL and ◀.":"Редактируйте выражение с помощью DEL и ◀.","Enter 2+5.":"Введите 2+5.","Say the 5 was a mistake. {del} deletes the character before the cursor.":"Допустим, 5 введено по ошибке. {del} удаляет символ перед курсором.","The 5 is gone.":"5 удалено.","Enter 6 and compute.":"Введите 6 и вычислите.","2+6=8.":"2+6=8.","You can still edit after computing. {left} brings the expression back with the cursor at the end.":"Редактировать можно и после вычисления. {left} возвращает выражение с курсором в конце.","You are editing the expression again.":"Вы снова редактируете выражение.","Delete the 6, enter 9 and compute again.":"Удалите 6, введите 9 и вычислите снова.","2+9=11. No need to retype long expressions.":"2+9=11. Длинные выражения не нужно набирать заново.","Negative numbers":"Отрицательные числа","Learn the (−) key versus minus, and squaring negatives.":"Клавиша (−) и минус, а также квадрат отрицательного числа.","For a negative number use {neg}, not minus {sub}. Compute (−)3×4.":"Для отрицательного числа используйте {neg}, а не минус {sub}. Вычислите (−)3×4.","The result is −12.":"Результат −12.","Now enter −3² as written. Squaring is {sq}.":"Теперь введите −3² так, как написано. Возведение в квадрат — {sq}.","You get −9: the square is taken first, then the sign, just like in maths.":"Получается −9: сначала возводится в квадрат, затем ставится знак, как и в математике.","For (−3)², wrap it in brackets.":"Для (−3)² заключите число в скобки.","The answer is 9.":"Ответ 9.","Fractions and decimals":"Дроби и десятичные числа","Compute 2/3 + 1/4 as a fraction, then as a decimal.":"Вычислите 2/3 + 1/4 в виде дроби, а затем в виде десятичного числа.","{frac} makes a fraction box with the cursor in the numerator. Enter 2.":"{frac} создаёт дробь с курсором в числителе. Введите 2.","Go down to the denominator with {down} and enter 3.":"Перейдите к знаменателю с помощью {down} и введите 3.","Leave the fraction with {right}, then press +.":"Выйдите из дроби с помощью {right}, затем нажмите +.","Enter 1/4 the same way.":"Так же введите 1/4.","Compute.":"Вычислите.","You get the fraction 11/12. The calculator finds the common denominator and reduces.":"Получается дробь 11/12. Калькулятор сам находит общий знаменатель и сокращает дробь.","{sd} switches between fraction and decimal.":"{sd} переключает между дробью и десятичным числом.","0.9166666667. Press it again to get the fraction back.":"0.9166666667. Нажмите ещё раз, чтобы вернуть дробь.","Roots and powers":"Корни и степени","Compute √8, 2¹⁰ and ∛27, and learn SHIFT.":"Вычислите √8, 2¹⁰ и ∛27 и познакомьтесь с SHIFT.","Press {sqrt}, enter 8 and compute.":"Нажмите {sqrt}, введите 8 и вычислите.","You get 2√2, the exact form. Press S⇔D if you want the decimal.":"Получается 2√2 — точный вид. Нажмите S⇔D, если нужна десятичная запись.","Powers use {pow}. Enter 2, press it to get the exponent box, then enter 10.":"Степени вводятся через {pow}. Введите 2, нажмите эту клавишу, чтобы появилось поле показателя, затем введите 10.","Leave the exponent with {right} and compute.":"Выйдите из показателя с помощью {right} и вычислите.","2¹⁰ = 1024.":"2¹⁰ = 1024.","Yellow labels above the keys need {shift} first. SHIFT then {sqrt} gives ∛. Compute ∛27.":"Для жёлтых надписей над клавишами сначала нажмите {shift}. SHIFT, затем {sqrt} даёт ∛. Вычислите ∛27.","The answer is 3. An S lights up on screen while SHIFT is active.":"Ответ 3. Пока SHIFT активен, на экране горит S.","Trigonometry and angle units":"Тригонометрия и единицы углов","Compute sin 30° and sin⁻¹(0.5).":"Вычислите sin 30° и sin⁻¹(0.5).","The D at the top means degrees. {sin} enters sin(. Compute sin(30).":"D вверху означает градусы. {sin} вводит sin(. Вычислите sin(30).","The result is 1/2.":"Результат 1/2.","Inverse functions use SHIFT. Compute sin⁻¹(0.5).":"Обратные функции вызываются через SHIFT. Вычислите sin⁻¹(0.5).","30: the angle whose sine is 0.5. To switch to radians use SHIFT, MENU (SETUP), then 2:Angle Unit.":"30: угол, синус которого равен 0.5. Чтобы перейти на радианы, нажмите SHIFT, MENU (SETUP), затем 2:Angle Unit.","Logarithms":"Логарифмы","Compute log₂8, log 100 and ln e.":"Вычислите log₂8, log 100 и ln e.","{logb} is a log with a chosen base. Enter base 2, move with {right}, enter 8 and compute.":"{logb} — логарифм с выбранным основанием. Введите основание 2, перейдите с помощью {right}, введите 8 и вычислите.","log₂8 = 3.":"log₂8 = 3.","The common log (base 10) is SHIFT and {neg}. Compute log(100).":"Десятичный логарифм (по основанию 10) — SHIFT и {neg}. Вычислите log(100).","The result is 2.":"Результат 2.","The natural log is {ln}. Enter e with {alpha} then {exp}. Compute ln(e).":"Натуральный логарифм — {ln}. Число e вводится через {alpha}, затем {exp}. Вычислите ln(e).","The result is 1. Red labels need ALPHA first.":"Результат 1. Для красных надписей сначала нажмите ALPHA.","Ans and variables":"Ans и переменные","Reuse the last answer and store a value in A.":"Используйте последний ответ повторно и сохраните значение в A.","Compute 12×3.":"Вычислите 12×3.","The result is 36.":"Результат 36.","With a result showing, pressing {div} starts with Ans, the last answer. Continue with ÷4.":"Если на экране результат, нажатие {div} начинает выражение с Ans — последнего ответа. Продолжите ÷4.","Ans÷4 = 9.":"Ans÷4 = 9.","To keep a value, store it in a variable. Enter 7, press {sto}, then {neg} (its red label is A).":"Чтобы сохранить значение, запишите его в переменную. Введите 7, нажмите {sto}, затем {neg} (её красная надпись — A).","7 is stored in A.":"7 сохранено в A.","Recall A with ALPHA and {neg}, and compute A×2.":"Вызовите A с помощью ALPHA и {neg} и вычислите A×2.","14. A variable keeps its value until you store a new one.":"14. Переменная хранит значение, пока вы не сохраните в ней новое.","Scientific notation ×10ˣ":"Экспоненциальная запись ×10ˣ","Compute 3×10⁸ × 2.":"Вычислите 3×10⁸ × 2.","Enter 3×10⁸ with {exp}: type 3, press it to get the exponent box, then enter 8.":"Введите 3×10⁸ с помощью {exp}: наберите 3, нажмите эту клавишу, чтобы появилось поле показателя, затем введите 8.","Leave the exponent with {right}, then compute ×2.":"Выйдите из показателя с помощью {right}, затем вычислите ×2.","600000000. Without leaving the exponent, ×2 would go into the exponent and give a very different number.":"600000000. Если не выйти из показателя, ×2 попадёт в показатель, и получится совсем другое число.","Equations":"Уравнения","Substituting values with CALC":"Подстановка значений с CALC","Evaluate x²+3x at x=2 and x=5.":"Найдите значение x²+3x при x=2 и x=5.","Enter x²+3x. x is the {x} key, squaring is {sq}.":"Введите x²+3x. x — клавиша {x}, квадрат — {sq}.","{calc} evaluates the expression for a value you give. Press it.":"{calc} вычисляет выражение для заданного вами значения. Нажмите её.","It asks for x.":"Калькулятор запрашивает x.","Enter 2 and press {eq}.":"Введите 2 и нажмите {eq}.","At x=2 the value is 10 (4+6).":"При x=2 значение равно 10 (4+6).","Press {calc} again to try another value. Enter 5 and compute.":"Нажмите {calc} ещё раз, чтобы попробовать другое значение. Введите 5 и вычислите.","At x=5 it is 40. Handy for filling in a table without retyping.":"При x=5 получается 40. Удобно для заполнения таблицы без повторного ввода.","Solving with SOLVE":"Решение с SOLVE","Solve 2x+3=11 with SOLVE.":"Решите 2x+3=11 с помощью SOLVE.","SOLVE works on any equation typed on the calculation screen. Enter 2x+3.":"SOLVE работает с любым уравнением, набранным на экране вычислений. Введите 2x+3.","The equals sign of an equation is {alpha} then {calc} (red =). Add =11.":"Знак равенства в уравнении — {alpha}, затем {calc} (красный =). Допишите =11.","Now it reads 2x+3=11. This equals sign is part of the equation, not the compute key.":"Теперь на экране 2x+3=11. Этот знак равенства — часть уравнения, а не клавиша вычисления.","Press {shift} then {calc} (SOLVE).":"Нажмите {shift}, затем {calc} (SOLVE).","It asks for a starting value of x; the search starts from the value x holds now.":"Калькулятор запрашивает начальное значение x; поиск начинается с текущего значения x.","Press {eq} to solve.":"Нажмите {eq}, чтобы решить.","x=4. L−R=0 underneath means left side minus right side is 0: the solution is exact.":"x=4. L−R=0 ниже означает, что левая часть минус правая равна 0: решение точное.","Choosing a starting value":"Выбор начального значения","Find the negative root of x²=2.":"Найдите отрицательный корень уравнения x²=2.","Enter x²=2. The equals sign is ALPHA and {calc}.":"Введите x²=2. Знак равенства — ALPHA и {calc}.","Open SOLVE with SHIFT and {calc}.":"Откройте SOLVE с помощью SHIFT и {calc}.","With two roots (±√2), SOLVE finds the one near the starting value. Enter −1 as the start and press {eq}.":"Если корней два (±√2), SOLVE находит тот, что ближе к начальному значению. Введите −1 как начальное значение и нажмите {eq}.","The starting value is now −1.":"Теперь начальное значение −1.","x=−1.414213562 (−√2). Start from 1 and you get +√2. For several roots, try different starting values.":"x=−1.414213562 (−√2). Начните с 1 — и получите +√2. Если корней несколько, пробуйте разные начальные значения.","Simultaneous equations":"Системы уравнений","Solve 2x+3y=8 and x−y=−1.":"Решите систему 2x+3y=8 и x−y=−1.","Press {menu}. Equation/Func is the 10th app, so choose it with the {neg} key (red A).":"Нажмите {menu}. Equation/Func — 10-е приложение, поэтому выберите его клавишей {neg} (красная A).","Now choose the kind of equation.":"Теперь выберите тип уравнения.","Choose 1:Simul Equation, then 2 unknowns.":"Выберите 1:Simul Equation, затем 2 неизвестных.","A coefficient table for ax+by=c appears.":"Появляется таблица коэффициентов для ax+by=c.","Enter 2, 3, 8 for 2x+3y=8. Each {eq} moves one cell right.":"Введите 2, 3, 8 для 2x+3y=8. Каждое нажатие {eq} сдвигает на одну ячейку вправо.","At the end of a row it moves to the next one.":"В конце строки курсор переходит на следующую.","For x−y=−1 the coefficients are 1, −1, −1. Use {neg} for negatives.":"Для x−y=−1 коэффициенты 1, −1, −1. Для отрицательных чисел используйте {neg}.","All coefficients are in.":"Все коэффициенты введены.","When no cell is being edited, {eq} solves.":"Когда ни одна ячейка не редактируется, {eq} решает систему.","x=1.":"x=1.","Press {eq} again for the next unknown.":"Нажмите {eq} ещё раз, чтобы увидеть следующее неизвестное.","y=2. Check: 2+6=8 and 1−2=−1.":"y=2. Проверка: 2+6=8 и 1−2=−1.","Quadratics and the vertex":"Квадратные уравнения и вершина","Solve x²−5x+6=0 and find the vertex of the parabola.":"Решите x²−5x+6=0 и найдите вершину параболы.","Press {menu}, {neg}, then 2:Polynomial and degree 2.":"Нажмите {menu}, {neg}, затем 2:Polynomial и степень 2.","This is the table for ax²+bx+c=0.":"Это таблица для ax²+bx+c=0.","Enter the coefficients 1, −5, 6.":"Введите коэффициенты 1, −5, 6.","x₁=3.":"x₁=3.","Press {eq} for the other root.":"Нажмите {eq}, чтобы увидеть второй корень.","x₂=2.":"x₂=2.","Press {eq} twice more for the vertex of y=x²−5x+6.":"Нажмите {eq} ещё два раза, чтобы увидеть вершину y=x²−5x+6.","The vertex is x=2.5, y=−0.25, the minimum: useful for sketching the graph.":"Вершина x=2.5, y=−0.25 — это минимум: пригодится для построения графика.","When there are no real roots":"Когда действительных корней нет","See the complex roots of x²+2x+5=0.":"Посмотрите комплексные корни x²+2x+5=0.","Open the quadratic table with {menu}, {neg}, 2, 2.":"Откройте таблицу квадратного уравнения: {menu}, {neg}, 2, 2.","Enter the coefficients 1, 2, 5.":"Введите коэффициенты 1, 2, 5.","x₁=−1+2i. The discriminant b²−4ac=−16 is negative, so the roots are complex.":"x₁=−1+2i. Дискриминант b²−4ac=−16 отрицателен, поэтому корни комплексные.","x₂=−1−2i. To see just \"no real roots\" instead, set Equation/Func to Off in SETUP.":"x₂=−1−2i. Чтобы вместо этого видеть только «нет действительных корней», установите Equation/Func в Off в SETUP.","Calculus and sums":"Анализ и суммы","Definite integrals":"Определённые интегралы","Compute ∫₀² x² dx.":"Вычислите ∫₀² x² dx.","{int} makes an integral box with the cursor in the integrand. Enter x².":"{int} создаёт интеграл с курсором в подынтегральном выражении. Введите x².","Move with {right} to the lower limit and enter 0, then {right} again to the upper limit and enter 2.":"Перейдите с помощью {right} к нижнему пределу и введите 0, затем снова {right} к верхнему пределу и введите 2.","8/3 (about 2.667): by hand, x³/3 evaluated from 0 to 2.":"8/3 (примерно 2.667): вручную это x³/3, вычисленное от 0 до 2.","Integrating trig functions in radians":"Интегрирование тригонометрических функций в радианах","Compute ∫₀^π sin x dx.":"Вычислите ∫₀^π sin x dx.","Calculus with trig functions uses radians. Press {shift}, {menu} (SETUP), then 2:Angle Unit.":"В анализе тригонометрические функции используют радианы. Нажмите {shift}, {menu} (SETUP), затем 2:Angle Unit.","Choose 2:Radian.":"Выберите 2:Radian.","The indicator at the top changed from D to R.":"Индикатор вверху сменился с D на R.","Press {int} and enter sin(x).":"Нажмите {int} и введите sin(x).","Enter 0 and π as the limits and compute. π is SHIFT then {exp}.":"Введите пределы 0 и π и вычислите. π — SHIFT, затем {exp}.","2. In degree mode the angle would be read in degrees and the answer would be wrong.":"2. В режиме градусов угол считался бы в градусах, и ответ был бы неверным.","Derivatives at a point":"Производная в точке","Find the derivative of x³ at x=2.":"Найдите производную x³ при x=2.","SHIFT then {int} gives the derivative. Enter x³ (SHIFT then {sq}).":"SHIFT, затем {int} даёт производную. Введите x³ (SHIFT, затем {sq}).","Move with {right} to x=, enter 2 and compute.":"Перейдите с помощью {right} к x=, введите 2 и вычислите.","12. The derivative of x³ is 3x², which is 12 at x=2.":"12. Производная x³ равна 3x², а при x=2 это 12.","Sums with Σ":"Суммы с Σ","Sum 1 to 10, then the squares.":"Найдите сумму чисел от 1 до 10, затем сумму их квадратов.","SHIFT then {x} gives Σ. Enter x as the term.":"SHIFT, затем {x} даёт Σ. Введите x как слагаемое.","Move with {right} to enter the start 1, then {right} again for the end 10, and compute.":"Перейдите с помощью {right} и введите начало 1, затем снова {right} — конец 10, и вычислите.","1+2+…+10 = 55.":"1+2+…+10 = 55.","Change only the term to get other sums. Sum x² over the same range.":"Меняйте только слагаемое, чтобы получить другие суммы. Найдите сумму x² в том же диапазоне.","1²+2²+…+10² = 385. Check it with n(n+1)(2n+1)/6.":"1²+2²+…+10² = 385. Проверьте по формуле n(n+1)(2n+1)/6.","Statistics":"Статистика","Enter data and find the mean":"Ввод данных и среднее значение","Find the mean of 4, 7, 9, 6, 4.":"Найдите среднее значение чисел 4, 7, 9, 6, 4.","{menu} opens the app list.":"{menu} открывает список приложений.","There are 12 apps.":"Всего 12 приложений.","Press 6 to open Statistics.":"Нажмите 6, чтобы открыть Statistics.","Now choose the kind of statistics.":"Теперь выберите вид статистики.","1:1-Variable is for a single list of data. Press 1.":"1:1-Variable — для одного ряда данных. Нажмите 1.","The data table is open.":"Таблица данных открыта.","Enter the first value 4 and press {eq}.":"Введите первое значение 4 и нажмите {eq}.","4 is in row 1 and the cursor moved down.":"4 записано в строку 1, а курсор сместился вниз.","Enter 7, 9, 6 and 4 the same way.":"Так же введите 7, 9, 6 и 4.","All 5 values are in.":"Все 5 значений введены.","{optn} opens the statistics menu.":"{optn} открывает меню статистики.","3:1-Variable Calc shows the results.":"3:1-Variable Calc показывает результаты.","Press 3.":"Нажмите 3.","x̄=6 is the mean and Σx=30 the sum. The next lesson reads the rest of the list.":"x̄=6 — среднее, Σx=30 — сумма. В следующем уроке разберём остальную часть списка.","Reading the results":"Чтение результатов","Find both standard deviations, the median and quartiles.":"Найдите оба стандартных отклонения, медиану и квартили.","Results for 4, 7, 9, 6, 4 are showing, 4 lines at a time. Press {down} four times.":"Показаны результаты для 4, 7, 9, 6, 4, по 4 строки за раз. Нажмите {down} четыре раза.","σx is the population standard deviation (divide by n); sx is the sample one (divide by n−1). Check which one a question asks for.":"σx — стандартное отклонение генеральной совокупности (деление на n); sx — выборочное (деление на n−1). Проверьте, какое требуется в задаче.","Go down four more times.":"Спуститесь ещё на четыре строки.","Med=6 is the median; Q1=4 and Q3=8 are the quartiles.":"Med=6 — медиана; Q1=4 и Q3=8 — квартили.","Press {ac} to go back to the data table.":"Нажмите {ac}, чтобы вернуться к таблице данных.","The data is still there, ready to edit and recompute.":"Данные сохранились: их можно изменить и пересчитать.","Editing and deleting data":"Изменение и удаление данных","Change one value, delete another and recompute.":"Измените одно значение, удалите другое и пересчитайте.","The table holds 4, 7, 9, 6, 4 and the cursor is on empty row 6. Press {up} twice to reach the 6 in row 4.":"В таблице 4, 7, 9, 6, 4, курсор на пустой строке 6. Нажмите {up} дважды, чтобы перейти к 6 в строке 4.","Row 4 is highlighted.":"Строка 4 выделена.","Enter 8 and press {eq} to replace 6 with 8.":"Введите 8 и нажмите {eq}, чтобы заменить 6 на 8.","Done. The cursor moved to row 5.":"Готово. Курсор перешёл на строку 5.","{del} deletes the whole row under the cursor. Delete the 4 in row 5.":"{del} удаляет всю строку под курсором. Удалите 4 в строке 5.","The data is now 4, 7, 9, 8.":"Теперь данные: 4, 7, 9, 8.","Recompute with {optn} then 3.":"Пересчитайте: {optn}, затем 3.","x̄=7 and n=4. Results follow the edited data.":"x̄=7 и n=4. Результаты учитывают изменённые данные.","Using frequencies":"Использование частот","Mean of 3 people scoring 10, 5 scoring 20, 2 scoring 30.":"Среднее для 3 человек с баллом 10, 5 — с баллом 20, 2 — с баллом 30.","Repeated values are quicker with a Freq column. Open the setup first: {shift} then {menu} (SETUP).":"Повторяющиеся значения удобнее вводить со столбцом Freq. Сначала откройте настройки: {shift}, затем {menu} (SETUP).","This is the setup list.":"Это список настроек.","Go to the next page with {down} and pick 3:Statistics.":"Перейдите на следующую страницу с помощью {down} и выберите 3:Statistics.","It asks whether to show the frequency column.":"Калькулятор спрашивает, показывать ли столбец частот.","Choose 1:On.":"Выберите 1:On.","The Freq column is on.":"Столбец Freq включён.","Open the 1-Variable table with {menu}, 6, 1.":"Откройте таблицу 1-Variable: {menu}, 6, 1.","A Freq column now sits next to x.":"Теперь рядом с x есть столбец Freq.","Enter the scores 10, 20, 30.":"Введите баллы 10, 20, 30.","Each Freq starts at 1.":"Каждое значение Freq изначально равно 1.","Move to Freq with {right}, then up three times with {up} to row 1.":"Перейдите к Freq с помощью {right}, затем трижды нажмите {up}, чтобы попасть в строку 1.","Enter the counts 3, 5, 2.":"Введите количества 3, 5, 2.","3 people scored 10, 5 scored 20, 2 scored 30.":"3 человека получили 10, 5 — 20, 2 — 30.","Compute with {optn} then 3.":"Вычислите: {optn}, затем 3.","x̄=19 is the mean score; n=10 is the number of people.":"x̄=19 — средний балл; n=10 — число людей.","Two variables and regression":"Две переменные и регрессия","Fit y=a+bx to study hours and scores.":"Подберите y=a+bx для часов подготовки и баллов.","Press {menu}, 6, then choose 2:y=a+bx for paired data.":"Нажмите {menu}, 6, затем выберите 2:y=a+bx для парных данных.","The table has x and y columns.":"В таблице есть столбцы x и y.","Enter study hours x: 1, 2, 3, 4, 5.":"Введите часы подготовки x: 1, 2, 3, 4, 5.","Move to y with {right}, then press {up} five times to reach row 1.":"Перейдите к y с помощью {right}, затем пять раз нажмите {up}, чтобы попасть в строку 1.","Enter scores y: 2, 4, 5, 4, 5.":"Введите баллы y: 2, 4, 5, 4, 5.","Press {optn}, then 4:Regression Calc.":"Нажмите {optn}, затем 4:Regression Calc.","a=2.2 and b=0.6, so y=2.2+0.6x. r≈0.775 is the correlation; the closer to ±1, the straighter the data.":"a=2.2 и b=0.6, значит y=2.2+0.6x. r≈0.775 — коэффициент корреляции; чем ближе к ±1, тем ближе данные к прямой.","Predicting with ŷ":"Прогноз с помощью ŷ","Predict the score ŷ for x=6.":"Спрогнозируйте балл ŷ при x=6.","Last lesson's data is loaded. Press {ac} for the calculation screen; the data and fit stay.":"Данные прошлого урока загружены. Нажмите {ac}, чтобы перейти к экрану вычислений; данные и регрессия сохраняются.","Enter 6 and press {optn}.":"Введите 6 и нажмите {optn}.","Go to the next page with {down} and choose 4:Regression.":"Перейдите на следующую страницу с помощью {down} и выберите 4:Regression.","Press {down}, then 1 to insert ŷ.":"Нажмите {down}, затем 1, чтобы вставить ŷ.","The expression reads 6ŷ: \"y when x is 6\".":"Выражение 6ŷ означает «y при x, равном 6».","5.8 = 2.2+0.6×6. x̂ works the other way, from y to x.":"5.8 = 2.2+0.6×6. x̂ работает наоборот: от y к x.","Distributions":"Распределения","Normal probability between two values":"Нормальная вероятность между двумя значениями","Heights average 170 cm with SD 6 cm: find P(165 ≤ X ≤ 180).":"Средний рост 170 cm, стандартное отклонение 6 cm: найдите P(165 ≤ X ≤ 180).","Open the Distribution app with {menu}, 7.":"Откройте приложение Distribution: {menu}, 7.","Choose a distribution.":"Выберите распределение.","2:Normal CD gives the probability between two values. Press 2.":"2:Normal CD даёт вероятность между двумя значениями. Нажмите 2.","It asks for Lower, Upper, σ (standard deviation) and μ (mean).":"Запрашиваются Lower, Upper, σ (стандартное отклонение) и μ (среднее).","Enter Lower 165 and Upper 180; each {eq} moves to the next line.":"Введите Lower 165 и Upper 180; каждое нажатие {eq} переходит на следующую строку.","Enter σ=6 and μ=170.":"Введите σ=6 и μ=170.","With every value in, press {eq} to compute.":"Когда все значения введены, нажмите {eq}, чтобы вычислить.","P≈0.7499: about 75% are between 165 and 180 cm. No z-table needed.":"P≈0.7499: около 75% имеют рост от 165 до 180 cm. Таблица z не нужна.","Cut-off for the top few percent":"Граница для верхних нескольких процентов","Find the height that marks the top 5%.":"Найдите рост, с которого начинаются верхние 5%.","Press {menu}, 7, then 3:Inverse Normal.":"Нажмите {menu}, 7, затем 3:Inverse Normal.","It works backwards from an area to x.":"Здесь вычисление идёт в обратную сторону — от площади к x.","Area is measured from the left. The top 5% starts where the lower 95% ends, so enter 0.95.":"Area отсчитывается слева. Верхние 5% начинаются там, где заканчиваются нижние 95%, поэтому введите 0.95.","Enter σ=6, μ=170 and compute.":"Введите σ=6, μ=170 и вычислите.","About 179.87 cm: taller than that is the top 5%.":"Около 179.87 cm: те, кто выше, входят в верхние 5%.","Binomial distribution":"Биномиальное распределение","Toss a coin 10 times: P(exactly 3 heads) and P(at most 3).":"Монету подбрасывают 10 раз: P(ровно 3 орла) и P(не более 3).","Press {menu}, 7, then 4:Binomial PD. PD means \"exactly x times\".":"Нажмите {menu}, 7, затем 4:Binomial PD. PD означает «ровно x раз».","List handles many x values at once; Variable handles one.":"List обрабатывает сразу много значений x, Variable — одно.","Choose 2:Variable.":"Выберите 2:Variable.","Enter x=3 (heads), N=10 (tosses), p=0.5 (chance of heads).":"Введите x=3 (орлы), N=10 (броски), p=0.5 (вероятность орла).","0.1171875, about 11.7%.":"0.1171875, примерно 11.7%.","\"At most 3\" is the cumulative Binomial CD. Press {optn} for the list, then 5 and 2.":"«Не более 3» — это накопленная вероятность Binomial CD. Нажмите {optn}, чтобы открыть список, затем 5 и 2.","Enter 3, 10, 0.5 again and compute.":"Снова введите 3, 10, 0.5 и вычислите.","0.171875: the chances of 0, 1, 2 and 3 heads added together.":"0.171875: сумма вероятностей 0, 1, 2 и 3 орлов.","Matrices":"Матрицы","Entering a matrix and its determinant":"Ввод матрицы и её определитель","Enter A=[[2,1],[5,3]] and find its determinant.":"Введите A=[[2,1],[5,3]] и найдите её определитель.","Open the Matrix app with {menu}, 4.":"Откройте приложение Matrix: {menu}, 4.","Choose which matrix to define: MatA to MatD.":"Выберите, какую матрицу задать: от MatA до MatD.","Choose 1:MatA, then 2 rows and 2 columns.":"Выберите 1:MatA, затем 2 строки и 2 столбца.","A 2×2 grid appears.":"Появляется сетка 2×2.","Enter 2, 1, 5, 3. Each {eq} moves right, then down to the next row.":"Введите 2, 1, 5, 3. Каждое нажатие {eq} сдвигает вправо, а затем вниз на следующую строку.","A=[[2,1],[5,3]].":"A=[[2,1],[5,3]].","Go to the calculation screen with {ac}.":"Перейдите к экрану вычислений с помощью {ac}.","The matrix stays stored.":"Матрица остаётся в памяти.","Press {optn}, go to the second page with {down}, choose 2:Determinant.":"Нажмите {optn}, перейдите на вторую страницу с помощью {down} и выберите 2:Determinant.","Det( is entered.":"Введено Det(.","Insert MatA with {optn} then 3, close the bracket and compute.":"Вставьте MatA: {optn}, затем 3, закройте скобку и вычислите.","det A = 2×3 − 1×5 = 1.":"det A = 2×3 − 1×5 = 1.","Inverse matrix":"Обратная матрица","Find the inverse of A=[[2,1],[5,3]].":"Найдите обратную матрицу для A=[[2,1],[5,3]].","Matrix A is already defined. Press {ac} for the calculation screen.":"Матрица A уже задана. Нажмите {ac}, чтобы перейти к экрану вычислений.","Insert MatA with {optn} then 3.":"Вставьте MatA: {optn}, затем 3.","{inv} gives the inverse. Press it and compute.":"{inv} даёт обратную матрицу. Нажмите её и вычислите.","A⁻¹=[[3,−1],[−5,2]]; integers because det A = 1. With det 0 there is no inverse and you get Math ERROR.":"A⁻¹=[[3,−1],[−5,2]]; элементы целые, потому что det A = 1. При det 0 обратной матрицы нет, и появится Math ERROR.","Multiplying matrices":"Умножение матриц","Define B=[[1],[2]] and compute A×B.":"Задайте B=[[1],[2]] и вычислите A×B.","A is defined. Now define B: {optn}, 1:Define Matrix, 2:MatB.":"A задана. Теперь задайте B: {optn}, 1:Define Matrix, 2:MatB.","Choose 2 rows and 1 column.":"Выберите 2 строки и 1 столбец.","Enter 1 and 2.":"Введите 1 и 2.","Press {ac} and enter MatA×MatB: MatA is {optn} 3, MatB is {optn} 4.":"Нажмите {ac} и введите MatA×MatB: MatA — {optn} 3, MatB — {optn} 4.","MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). The first matrix's columns must match the second's rows.":"MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). Число столбцов первой матрицы должно совпадать с числом строк второй.","Vectors":"Векторы","Entering vectors and the dot product":"Ввод векторов и скалярное произведение","Find the dot product of A=(1,2,3) and B=(4,5,6).":"Найдите скалярное произведение A=(1,2,3) и B=(4,5,6).","Open the Vector app with {menu}, 5.":"Откройте приложение Vector: {menu}, 5.","Choose 1:VctA and dimension 3.":"Выберите 1:VctA и размерность 3.","Enter 1, 2, 3.":"Введите 1, 2, 3.","Now define B: {optn}, 1:Define Vector, 2:VctB, dimension 3.":"Теперь задайте B: {optn}, 1:Define Vector, 2:VctB, размерность 3.","Enter 4, 5, 6.":"Введите 4, 5, 6.","Press {ac}, then insert VctA with {optn} 3.":"Нажмите {ac}, затем вставьте VctA: {optn} 3.","The dot is on the second page of {optn}: 2:Dot Product.":"Скалярное произведение — на второй странице {optn}: 2:Dot Product.","Insert VctB with {optn} 4 and compute.":"Вставьте VctB: {optn} 4 и вычислите.","32 (1×4+2×5+3×6). A dot product of 0 means the vectors are perpendicular.":"32 (1×4+2×5+3×6). Скалярное произведение 0 означает, что векторы перпендикулярны.","Cross product and angle":"Векторное произведение и угол","Find the cross product of A and B and the angle between them.":"Найдите векторное произведение A и B и угол между ними.","A and B are defined. Press {ac} and enter VctA×VctB; {mul} between vectors is the cross product.":"A и B заданы. Нажмите {ac} и введите VctA×VctB; {mul} между векторами — это векторное произведение.","(−3, 6, −3), perpendicular to both A and B.":"(−3, 6, −3) — вектор, перпендикулярный и A, и B.","Press {ac}, then 3:Angle on the second page of {optn}.":"Нажмите {ac}, затем 3:Angle на второй странице {optn}.","Enter VctA, a comma, VctB, close the bracket and compute. The comma is SHIFT then {rp}.":"Введите VctA, запятую, VctB, закройте скобку и вычислите. Запятая — SHIFT, затем {rp}.","About 12.93°. It follows the angle unit setting (D or R).":"Около 12.93°. Результат зависит от настройки единицы углов (D или R).","Function tables":"Таблицы функций","Making a table of values":"Составление таблицы значений","Tabulate f(x)=x²−2x for x from −2 to 4.":"Составьте таблицу f(x)=x²−2x для x от −2 до 4.","Open the Table app with {menu}, 9.":"Откройте приложение Table: {menu}, 9.","Enter f(x)= here.":"Здесь введите f(x)=.","Enter x²−2x and press {eq}.":"Введите x²−2x и нажмите {eq}.","It also asks for g(x)=. Leave it empty for a single function.":"Также запрашивается g(x)=. Для одной функции оставьте его пустым.","Leave g(x) empty and press {eq}.":"Оставьте g(x) пустым и нажмите {eq}.","Now set the range: Start, End and Step.":"Теперь задайте диапазон: Start, End и Step.","Enter Start −2, End 4, Step 1.":"Введите Start −2, End 4, Step 1.","Press {eq} to build the table.":"Нажмите {eq}, чтобы построить таблицу.","f(x)=0 at x=0 and x=2, where the graph meets the x-axis; the minimum −1 is at x=1. Scroll with {up}{down}.":"f(x)=0 при x=0 и x=2, где график пересекает ось x; минимум −1 при x=1. Прокручивайте с помощью {up}{down}.","Comparing two functions":"Сравнение двух функций","Find where 2ˣ and x² are equal.":"Найдите, где 2ˣ и x² равны.","Open Table with {menu}, 9 and enter f(x)=2ˣ: use {pow} for the exponent and leave it with {right}.":"Откройте Table: {menu}, 9 и введите f(x)=2ˣ: показатель вводится через {pow}, выход из него — {right}.","This time also enter g(x)=x².":"На этот раз введите также g(x)=x².","Use Start 1, End 5, Step 1 and build the table.":"Задайте Start 1, End 5, Step 1 и постройте таблицу.","They match at x=2 and x=4 (4=4, 16=16). At x=3, x² is bigger; from x=5, 2ˣ pulls ahead.":"Они совпадают при x=2 и x=4 (4=4, 16=16). При x=3 больше x², а начиная с x=5 вперёд вырывается 2ˣ.","Number bases":"Системы счисления","Decimal to hex and binary":"Из десятичной в шестнадцатеричную и двоичную","Convert 255 to hexadecimal and binary.":"Переведите 255 в шестнадцатеричную и двоичную системы.","Open the Base-N app with {menu}, 3.":"Откройте приложение Base-N: {menu}, 3.","Dec at the bottom means decimal.":"Dec внизу означает десятичную систему.","Enter 255 and press {eq}.":"Введите 255 и нажмите {eq}.","Press {pow}, the key with blue HEX.":"Нажмите {pow} — клавишу с синей надписью HEX.","FF. In Base-N the blue labels are what the keys do.":"FF. В Base-N клавиши выполняют то, что указано синими надписями.","Press {logb}, the key with blue BIN.":"Нажмите {logb} — клавишу с синей надписью BIN.","11111111: the same value in another base. DEC ({sq}) gets 255 back.":"11111111: то же значение в другой системе. DEC ({sq}) возвращает 255.","Hexadecimal arithmetic":"Шестнадцатеричная арифметика","Compute 1F + A in hexadecimal.":"Вычислите 1F + A в шестнадцатеричной системе.","Press {menu}, 3, then {pow} (HEX).":"Нажмите {menu}, 3, затем {pow} (HEX).","The screen shows Hex.":"На экране Hex.","A to F are the red-label keys, typed directly. 1F is 1 then {tan} (F).":"Цифры от A до F — клавиши с красными надписями, они вводятся напрямую. 1F — это 1, затем {tan} (F).","Add A ({neg}) and compute.":"Прибавьте A ({neg}) и вычислите.","29, which is 31+10=41 in decimal.":"29, то есть 31+10=41 в десятичной системе.","Binary logic operations":"Двоичные логические операции","Compute 1100 and 1010.":"Вычислите 1100 and 1010.","Press {menu}, 3, then {logb} (BIN).":"Нажмите {menu}, 3, затем {logb} (BIN).","Enter 1100.":"Введите 1100.","Choose 1:and from {optn}.":"Выберите 1:and в {optn}.","Enter 1010 and compute.":"Введите 1010 и вычислите.","1000: only bits set in both stay 1. or, xor and Not are in the same menu.":"1000: единицами остаются только биты, равные 1 в обоих числах. or, xor и Not находятся в том же меню.","Complex numbers":"Комплексные числа","Complex arithmetic":"Арифметика комплексных чисел","Compute (2+3i)(1−i).":"Вычислите (2+3i)(1−i).","Open the Complex app with {menu}, 2.":"Откройте приложение Complex: {menu}, 2.","Here the {eng} key types i (purple label).":"Здесь клавиша {eng} вводит i (фиолетовая надпись).","Enter (2+3i).":"Введите (2+3i).","Add (1−i) and compute.":"Допишите (1−i) и вычислите.","5+i, since 2−2i+3i−3i² = 5+i with i²=−1.":"5+i, так как 2−2i+3i−3i² = 5+i при i²=−1.","Modulus, conjugate and polar form":"Модуль, сопряжённое число и тригонометрическая форма","Find |3+4i|, its conjugate, and 1+i in polar form.":"Найдите |3+4i|, сопряжённое к нему число и тригонометрическую форму 1+i.","The modulus is the absolute value: SHIFT then {lp} (Abs), enter 3+4i, leave with {right} and compute.":"Модуль — это абсолютная величина: SHIFT, затем {lp} (Abs), введите 3+4i, выйдите с помощью {right} и вычислите.","5, which is √(3²+4²).":"5, то есть √(3²+4²).","The conjugate is 2:Conjugate in {optn}. Compute Conjg(3+4i).":"Сопряжённое число — 2:Conjugate в {optn}. Вычислите Conjg(3+4i).","3−4i: only the sign of the imaginary part flips.":"3−4i: меняется только знак мнимой части.","Now enter 1+i, choose 5:▶r∠θ from {optn}, and compute.":"Теперь введите 1+i, выберите 5:▶r∠θ в {optn} и вычислите.","√2∠45: distance √2 from the origin at 45°. To always see polar form, set Complex to r∠θ in SETUP.":"√2∠45: расстояние √2 от начала координат под углом 45°. Чтобы всегда видеть тригонометрическую форму, установите Complex в r∠θ в SETUP.","Inequalities and ratios":"Неравенства и пропорции","Quadratic inequalities":"Квадратные неравенства","Solve x²−5x+6<0 and x²−5x+6>0.":"Решите x²−5x+6<0 и x²−5x+6>0.","Press {menu}. Inequality is the 11th app, chosen with the {dms} key (red B).":"Нажмите {menu}. Inequality — 11-е приложение, оно выбирается клавишей {dms} (красная B).","It asks for the degree.":"Запрашивается степень.","Press 2 for degree 2.":"Нажмите 2 для степени 2.","Four inequality forms appear.":"Появляются четыре вида неравенств.","Choose 2:ax²+bx+c<0.":"Выберите 2:ax²+bx+c<0.","2<x<3: where the parabola is below the x-axis.":"2<x<3: здесь парабола ниже оси x.","Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.":"Теперь смените знак: {ac} возвращает к таблице, затем {optn} начинает заново. Выберите 2, затем 1:>0.","Enter 1, −5, 6 again and solve.":"Снова введите 1, −5, 6 и решите.","x<2, 3<x: exactly the other side.":"x<2, 3<x: ровно другая сторона.","Proportions":"Пропорции","Find X in 3:4 = X:12.":"Найдите X в 3:4 = X:12.","Press {menu}, then the {inv} key (red C) for the 12th app, Ratio.":"Нажмите {menu}, затем клавишу {inv} (красная C) для 12-го приложения, Ratio.","Two forms, with X in different places.":"Два вида, X стоит в разных местах.","Choose 1:A:B=X:D.":"Выберите 1:A:B=X:D.","Enter A=3, B=4, D=12.":"Введите A=3, B=4, D=12.","X=9, since 3×12=4×X. Handy for scaling recipes or map distances.":"X=9, так как 3×12=4×X. Удобно для пересчёта рецептов или расстояний на карте.","Spreadsheet":"Электронные таблицы","Values and formulas":"Значения и формулы","Enter prices and quantities, then the formula =A1×B1.":"Введите цены и количества, затем формулу =A1×B1.","Open the Spreadsheet app with {menu}, 8.":"Откройте приложение Spreadsheet: {menu}, 8.","Columns A–E, rows 1–45. The cursor is on A1.":"Столбцы A–E, строки 1–45. Курсор на A1.","Enter prices 1200, 800, 1500 down column A; {eq} moves down.":"Введите цены 1200, 800, 1500 вниз по столбцу A; {eq} сдвигает вниз.","Move to column B with {right}, then {up} three times to B1.":"Перейдите к столбцу B с помощью {right}, затем трижды {up} до B1.","Enter quantities 2, 5, 1.":"Введите количества 2, 5, 1.","Go to C1 with {right} and {up} three times.":"Перейдите к C1: {right} и трижды {up}.","Formulas start with = (ALPHA {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.":"Формулы начинаются с = (ALPHA {calc}). A1 — это ALPHA {neg} (A), затем 1; B1 — ALPHA {dms} (B), затем 1. Введите =A1×B1.","Press {eq} to enter it.":"Нажмите {eq}, чтобы ввести формулу.","C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.":"В C1 отображается 2400. Измените A1 или B1 — и C1 пересчитается автоматически.","Filling formulas and totals":"Заполнение формулами и итоги","Fill C1's formula down to C3 and total it in C4.":"Протяните формулу из C1 до C3 и подсчитайте итог в C4.","Last lesson's sheet is loaded. Go up to C1 with {up}.":"Таблица прошлого урока загружена. Поднимитесь к C1 с помощью {up}.","1:Fill Formula in {optn} fills many cells at once. Choose it.":"1:Fill Formula в {optn} заполняет сразу много ячеек. Выберите его.","It asks for Form and Range.":"Запрашиваются Form и Range.","Enter A1×B1 as the Form and press {eq} to go to Range.":"Введите A1×B1 в Form и нажмите {eq}, чтобы перейти к Range.","The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.":"Диапазон C1:C1. Удалите последнюю 1 с помощью {del}, наберите 3, чтобы получилось C1:C3, затем {eq}.","C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.":"C2=4000 и C3=1500: формула построчно сдвигается к A2×B2 и A3×B3.","Go down to C4 with {down} three times.":"Спуститесь к C4: трижды {down}.","Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.":"Введите =Sum(: ALPHA {calc}, затем {optn}, {down}, 4:Sum.","Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.":"Введите C1:C3, закройте скобку и нажмите {eq}. C — это ALPHA {inv}; двоеточие — ALPHA {int}.","C4 = 7900. Mean, Min and Max in the same menu work the same way.":"C4 = 7900. Mean, Min и Max в том же меню работают так же."},"vi":{"Learn":"Học","Learn by pressing the keys yourself":"Học bằng cách tự bấm phím","Settings, variables and data changed during a lesson are restored when you close this panel.":"Cài đặt, biến và dữ liệu thay đổi trong bài học sẽ được khôi phục khi bạn đóng bảng này.","Lessons":"Bài học","Show me":"Chỉ cho tôi","Restart":"Làm lại","Next":"Tiếp","Next lesson":"Bài tiếp theo","This time, press":"Lần này, hãy bấm","Well done! Feel free to keep experimenting.":"Giỏi lắm! Bạn cứ thoải mái thử thêm nhé.","Close":"Đóng","lessons":"bài học"
