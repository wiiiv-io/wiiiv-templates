ctores es el producto vectorial.","(−3, 6, −3), perpendicular to both A and B.":"(−3, 6, −3), perpendicular tanto a A como a B.","Press {ac}, then 3:Angle on the second page of {optn}.":"Pulsa {ac} y luego 3:Angle en la segunda página de {optn}.","Enter VctA, a comma, VctB, close the bracket and compute. The comma is SHIFT then {rp}.":"Introduce VctA, una coma, VctB, cierra el paréntesis y calcula. La coma es SHIFT y luego {rp}.","About 12.93°. It follows the angle unit setting (D or R).":"Unos 12.93°. Depende del ajuste de unidad de ángulo (D o R).","Function tables":"Tablas de funciones","Making a table of values":"Crear una tabla de valores","Tabulate f(x)=x²−2x for x from −2 to 4.":"Tabula f(x)=x²−2x para x de −2 a 4.","Open the Table app with {menu}, 9.":"Abre la aplicación Table con {menu}, 9.","Enter f(x)= here.":"Introduce f(x)= aquí.","Enter x²−2x and press {eq}.":"Introduce x²−2x y pulsa {eq}.","It also asks for g(x)=. Leave it empty for a single function.":"También te pide g(x)=. Déjalo vacío si es una sola función.","Leave g(x) empty and press {eq}.":"Deja g(x) vacío y pulsa {eq}.","Now set the range: Start, End and Step.":"Ahora fija el intervalo: Start, End y Step.","Enter Start −2, End 4, Step 1.":"Introduce Start −2, End 4, Step 1.","Press {eq} to build the table.":"Pulsa {eq} para crear la tabla.","f(x)=0 at x=0 and x=2, where the graph meets the x-axis; the minimum −1 is at x=1. Scroll with {up}{down}.":"f(x)=0 en x=0 y x=2, donde la gráfica corta el eje x; el mínimo −1 está en x=1. Desplázate con {up}{down}.","Comparing two functions":"Comparar dos funciones","Find where 2ˣ and x² are equal.":"Halla dónde 2ˣ y x² son iguales.","Open Table with {menu}, 9 and enter f(x)=2ˣ: use {pow} for the exponent and leave it with {right}.":"Abre Table con {menu}, 9 e introduce f(x)=2ˣ: usa {pow} para el exponente y sal con {right}.","This time also enter g(x)=x².":"Esta vez introduce también g(x)=x².","Use Start 1, End 5, Step 1 and build the table.":"Usa Start 1, End 5, Step 1 y crea la tabla.","They match at x=2 and x=4 (4=4, 16=16). At x=3, x² is bigger; from x=5, 2ˣ pulls ahead.":"Coinciden en x=2 y x=4 (4=4, 16=16). En x=3, x² es mayor; desde x=5, 2ˣ se adelanta.","Number bases":"Sistemas de numeración","Decimal to hex and binary":"De decimal a hexadecimal y binario","Convert 255 to hexadecimal and binary.":"Convierte 255 a hexadecimal y binario.","Open the Base-N app with {menu}, 3.":"Abre la aplicación Base-N con {menu}, 3.","Dec at the bottom means decimal.":"Dec abajo significa decimal.","Enter 255 and press {eq}.":"Introduce 255 y pulsa {eq}.","Press {pow}, the key with blue HEX.":"Pulsa {pow}, la tecla con HEX en azul.","FF. In Base-N the blue labels are what the keys do.":"FF. En Base-N, las etiquetas azules indican lo que hacen las teclas.","Press {logb}, the key with blue BIN.":"Pulsa {logb}, la tecla con BIN en azul.","11111111: the same value in another base. DEC ({sq}) gets 255 back.":"11111111: el mismo valor en otra base. DEC ({sq}) vuelve a 255.","Hexadecimal arithmetic":"Aritmética hexadecimal","Compute 1F + A in hexadecimal.":"Calcula 1F + A en hexadecimal.","Press {menu}, 3, then {pow} (HEX).":"Pulsa {menu}, 3 y luego {pow} (HEX).","The screen shows Hex.":"La pantalla muestra Hex.","A to F are the red-label keys, typed directly. 1F is 1 then {tan} (F).":"De A a F son las teclas con etiqueta roja; se escriben directamente. 1F es 1 y luego {tan} (F).","Add A ({neg}) and compute.":"Suma A ({neg}) y calcula.","29, which is 31+10=41 in decimal.":"29, que en decimal es 31+10=41.","Binary logic operations":"Operaciones lógicas binarias","Compute 1100 and 1010.":"Calcula 1100 and 1010.","Press {menu}, 3, then {logb} (BIN).":"Pulsa {menu}, 3 y luego {logb} (BIN).","Enter 1100.":"Introduce 1100.","Choose 1:and from {optn}.":"Elige 1:and en {optn}.","Enter 1010 and compute.":"Introduce 1010 y calcula.","1000: only bits set in both stay 1. or, xor and Not are in the same menu.":"1000: solo quedan en 1 los bits que están a 1 en ambos. or, xor y Not están en el mismo menú.","Complex numbers":"Números complejos","Complex arithmetic":"Aritmética compleja","Compute (2+3i)(1−i).":"Calcula (2+3i)(1−i).","Open the Complex app with {menu}, 2.":"Abre la aplicación Complex con {menu}, 2.","Here the {eng} key types i (purple label).":"Aquí la tecla {eng} escribe i (etiqueta morada).","Enter (2+3i).":"Introduce (2+3i).","Add (1−i) and compute.":"Añade (1−i) y calcula.","5+i, since 2−2i+3i−3i² = 5+i with i²=−1.":"5+i, porque 2−2i+3i−3i² = 5+i con i²=−1.","Modulus, conjugate and polar form":"Módulo, conjugado y forma polar","Find |3+4i|, its conjugate, and 1+i in polar form.":"Halla |3+4i|, su conjugado y 1+i en forma polar.","The modulus is the absolute value: SHIFT then {lp} (Abs), enter 3+4i, leave with {right} and compute.":"El módulo es el valor absoluto: SHIFT y luego {lp} (Abs), introduce 3+4i, sal con {right} y calcula.","5, which is √(3²+4²).":"5, que es √(3²+4²).","The conjugate is 2:Conjugate in {optn}. Compute Conjg(3+4i).":"El conjugado es 2:Conjugate en {optn}. Calcula Conjg(3+4i).","3−4i: only the sign of the imaginary part flips.":"3−4i: solo cambia el signo de la parte imaginaria.","Now enter 1+i, choose 5:▶r∠θ from {optn}, and compute.":"Ahora introduce 1+i, elige 5:▶r∠θ en {optn} y calcula.","√2∠45: distance √2 from the origin at 45°. To always see polar form, set Complex to r∠θ in SETUP.":"√2∠45: a distancia √2 del origen y a 45°. Para ver siempre la forma polar, pon Complex en r∠θ en SETUP.","Inequalities and ratios":"Inecuaciones y proporciones","Quadratic inequalities":"Inecuaciones de segundo grado","Solve x²−5x+6<0 and x²−5x+6>0.":"Resuelve x²−5x+6<0 y x²−5x+6>0.","Press {menu}. Inequality is the 11th app, chosen with the {dms} key (red B).":"Pulsa {menu}. Inequality es la 11.ª aplicación; se elige con la tecla {dms} (B roja).","It asks for the degree.":"Te pide el grado.","Press 2 for degree 2.":"Pulsa 2 para grado 2.","Four inequality forms appear.":"Aparecen cuatro formas de inecuación.","Choose 2:ax²+bx+c<0.":"Elige 2:ax²+bx+c<0.","2<x<3: where the parabola is below the x-axis.":"2<x<3: donde la parábola está por debajo del eje x.","Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.":"Ahora cambia el signo: {ac} vuelve a la tabla y {optn} empieza de nuevo. Elige 2 y luego 1:>0.","Enter 1, −5, 6 again and solve.":"Introduce otra vez 1, −5, 6 y resuelve.","x<2, 3<x: exactly the other side.":"x<2, 3<x: justo el otro lado.","Proportions":"Proporciones","Find X in 3:4 = X:12.":"Halla X en 3:4 = X:12.","Press {menu}, then the {inv} key (red C) for the 12th app, Ratio.":"Pulsa {menu} y luego la tecla {inv} (C roja) para la 12.ª aplicación, Ratio.","Two forms, with X in different places.":"Dos formas, con X en distintas posiciones.","Choose 1:A:B=X:D.":"Elige 1:A:B=X:D.","Enter A=3, B=4, D=12.":"Introduce A=3, B=4, D=12.","X=9, since 3×12=4×X. Handy for scaling recipes or map distances.":"X=9, porque 3×12=4×X. Útil para ajustar recetas o distancias en un mapa.","Spreadsheet":"Hoja de cálculo","Values and formulas":"Valores y fórmulas","Enter prices and quantities, then the formula =A1×B1.":"Introduce precios y cantidades, y luego la fórmula =A1×B1.","Open the Spreadsheet app with {menu}, 8.":"Abre la aplicación Spreadsheet con {menu}, 8.","Columns A–E, rows 1–45. The cursor is on A1.":"Columnas A–E, filas 1–45. El cursor está en A1.","Enter prices 1200, 800, 1500 down column A; {eq} moves down.":"Introduce los precios 1200, 800, 1500 en la columna A; {eq} baja una casilla.","Move to column B with {right}, then {up} three times to B1.":"Ve a la columna B con {right} y luego {up} tres veces hasta B1.","Enter quantities 2, 5, 1.":"Introduce las cantidades 2, 5, 1.","Go to C1 with {right} and {up} three times.":"Ve a C1 con {right} y {up} tres veces.","Formulas start with = (ALPHA {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.":"Las fórmulas empiezan con = (ALPHA {calc}). A1 es ALPHA {neg} (A) y luego 1; B1 es ALPHA {dms} (B) y luego 1. Introduce =A1×B1.","Press {eq} to enter it.":"Pulsa {eq} para introducirla.","C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.":"C1 muestra 2400. Si cambias A1 o B1, C1 se recalcula sola.","Filling formulas and totals":"Rellenar fórmulas y totales","Fill C1's formula down to C3 and total it in C4.":"Copia la fórmula de C1 hasta C3 y calcula el total en C4.","Last lesson's sheet is loaded. Go up to C1 with {up}.":"Está cargada la hoja de la lección anterior. Sube a C1 con {up}.","1:Fill Formula in {optn} fills many cells at once. Choose it.":"1:Fill Formula en {optn} rellena muchas casillas a la vez. Elígelo.","It asks for Form and Range.":"Te pide Form y Range.","Enter A1×B1 as the Form and press {eq} to go to Range.":"Introduce A1×B1 como Form y pulsa {eq} para pasar a Range.","The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.":"El rango pone C1:C1. Borra el último 1 con {del}, escribe 3 para C1:C3 y pulsa {eq}.","C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.":"C2=4000 y C3=1500: la fórmula pasa a A2×B2 y A3×B3 fila a fila.","Go down to C4 with {down} three times.":"Baja a C4 con {down} tres veces.","Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.":"Introduce =Sum(: ALPHA {calc}, luego {optn}, {down}, 4:Sum.","Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.":"Introduce C1:C3, cierra el paréntesis y pulsa {eq}. C es ALPHA {inv}; los dos puntos son ALPHA {int}.","C4 = 7900. Mean, Min and Max in the same menu work the same way.":"C4 = 7900. Mean, Min y Max, en el mismo menú, funcionan igual."},"fr":{"Learn":"Apprendre","Learn by pressing the keys yourself":"Apprends en appuyant toi-même sur les touches","Settings, variables and data changed during a lesson are restored when you close this panel.":"Les réglages, variables et données modifiés pendant une leçon sont restaurés quand tu fermes ce panneau.","Lessons":"Leçons","Show me":"Montre-moi","Restart":"Recommencer","Next":"Suivant","Next lesson":"Leçon suivante","This time, press":"Cette fois, appuie sur","Well done! Feel free to keep experimenting.":"Bravo ! Continue à expérimenter librement.","Close":"Fermer","lessons":"leçons","Basics":"Bases","Arithmetic and order of operations":"Calculs et priorité des opérations","Compute 2+3×4 and 3×(2+5).":"Calcule 2+3×4 et 3×(2+5).","Type 2+3×4. The expression appears just as you would write it.":"Tape 2+3×4. L'expression s'affiche comme tu l'écrirais.","Nothing is computed yet. You enter the whole expression first.":"Rien n'est encore calculé. Tu saisis d'abord toute l'expression.","Press {eq} to compute.":"Appuie sur {eq} pour calculer.","The answer is 14: multiplication comes before addition (3×4=12, then 2+12).":"Le résultat est 14 : la multiplication passe avant l'addition (3×4=12, puis 2+12).","{ac} clears the expression. Stored values and settings stay.":"{ac} efface l'expression. Les valeurs mémorisées et les réglages restent.","The screen is empty.":"L'écran est vide.","Use brackets to add first. Enter 3×(2+5) and compute.":"Utilise des parenthèses pour additionner d'abord. Saisis 3×(2+5) et calcule.","The answer is 21. The brackets were computed first.":"Le résultat est 21. Les parenthèses ont été calculées en premier.","Fixing mistakes":"Corriger les erreurs","Edit an expression with DEL and ◀.":"Modifie une expression avec DEL et ◀.","Enter 2+5.":"Saisis 2+5.","Say the 5 was a mistake. {del} deletes the character before the cursor.":"Imagine que le 5 était une erreur. {del} efface le caractère avant le curseur.","The 5 is gone.":"Le 5 a disparu.","Enter 6 and compute.":"Saisis 6 et calcule.","2+6=8.":"2+6=8.","You can still edit after computing. {left} brings the expression back with the cursor at the end.":"Tu peux encore modifier après le calcul. {left} fait revenir l'expression avec le curseur à la fin.","You are editing the expression again.":"Tu modifies de nouveau l'expression.","Delete the 6, enter 9 and compute again.":"Efface le 6, saisis 9 et calcule à nouveau.","2+9=11. No need to retype long expressions.":"2+9=11. Inutile de retaper les longues expressions.","Negative numbers":"Nombres négatifs","Learn the (−) key versus minus, and squaring negatives.":"Distingue la touche (−) du moins, et élève des négatifs au carré.","For a negative number use {neg}, not minus {sub}. Compute (−)3×4.":"Pour un nombre négatif, utilise {neg}, pas le moins {sub}. Calcule (−)3×4.","The result is −12.":"Le résultat est −12.","Now enter −3² as written. Squaring is {sq}.":"Saisis maintenant −3² tel quel. Le carré, c'est {sq}.","You get −9: the square is taken first, then the sign, just like in maths.":"Tu obtiens −9 : le carré est calculé d'abord, puis le signe, comme en maths.","For (−3)², wrap it in brackets.":"Pour (−3)², mets-le entre parenthèses.","The answer is 9.":"Le résultat est 9.","Fractions and decimals":"Fractions et décimaux","Compute 2/3 + 1/4 as a fraction, then as a decimal.":"Calcule 2/3 + 1/4 en fraction, puis en décimal.","{frac} makes a fraction box with the cursor in the numerator. Enter 2.":"{frac} crée une fraction avec le curseur au numérateur. Saisis 2.","Go down to the denominator with {down} and enter 3.":"Descends au dénominateur avec {down} et saisis 3.","Leave the fraction with {right}, then press +.":"Sors de la fraction avec {right}, puis appuie sur +.","Enter 1/4 the same way.":"Saisis 1/4 de la même façon.","Compute.":"Calcule.","You get the fraction 11/12. The calculator finds the common denominator and reduces.":"Tu obtiens la fraction 11/12. La calculatrice trouve le dénominateur commun et simplifie.","{sd} switches between fraction and decimal.":"{sd} bascule entre fraction et décimal.","0.9166666667. Press it again to get the fraction back.":"0.9166666667. Appuie encore pour retrouver la fraction.","Roots and powers":"Racines et puissances","Compute √8, 2¹⁰ and ∛27, and learn SHIFT.":"Calcule √8, 2¹⁰ et ∛27, et découvre SHIFT.","Press {sqrt}, enter 8 and compute.":"Appuie sur {sqrt}, saisis 8 et calcule.","You get 2√2, the exact form. Press S⇔D if you want the decimal.":"Tu obtiens 2√2, la forme exacte. Appuie sur S⇔D si tu veux le décimal.","Powers use {pow}. Enter 2, press it to get the exponent box, then enter 10.":"Les puissances utilisent {pow}. Saisis 2, appuie dessus pour obtenir la case de l'exposant, puis saisis 10.","Leave the exponent with {right} and compute.":"Sors de l'exposant avec {right} et calcule.","2¹⁰ = 1024.":"2¹⁰ = 1024.","Yellow labels above the keys need {shift} first. SHIFT then {sqrt} gives ∛. Compute ∛27.":"Les inscriptions jaunes au-dessus des touches demandent d'abord {shift}. SHIFT puis {sqrt} donne ∛. Calcule ∛27.","The answer is 3. An S lights up on screen while SHIFT is active.":"Le résultat est 3. Un S s'allume à l'écran quand SHIFT est actif.","Trigonometry and angle units":"Trigonométrie et unités d'angle","Compute sin 30° and sin⁻¹(0.5).":"Calcule sin 30° et sin⁻¹(0.5).","The D at the top means degrees. {sin} enters sin(. Compute sin(30).":"Le D en haut signifie degrés. {sin} saisit sin(. Calcule sin(30).","The result is 1/2.":"Le résultat est 1/2.","Inverse functions use SHIFT. Compute sin⁻¹(0.5).":"Les fonctions réciproques utilisent SHIFT. Calcule sin⁻¹(0.5).","30: the angle whose sine is 0.5. To switch to radians use SHIFT, MENU (SETUP), then 2:Angle Unit.":"30 : l'angle dont le sinus vaut 0.5. Pour passer en radians, utilise SHIFT, MENU (SETUP), puis 2:Angle Unit.","Logarithms":"Logarithmes","Compute log₂8, log 100 and ln e.":"Calcule log₂8, log 100 et ln e.","{logb} is a log with a chosen base. Enter base 2, move with {right}, enter 8 and compute.":"{logb} est un logarithme de base au choix. Saisis la base 2, déplace-toi avec {right}, saisis 8 et calcule.","log₂8 = 3.":"log₂8 = 3.","The common log (base 10) is SHIFT and {neg}. Compute log(100).":"Le logarithme décimal (base 10) s'obtient avec SHIFT et {neg}. Calcule log(100).","The result is 2.":"Le résultat est 2.","The natural log is {ln}. Enter e with {alpha} then {exp}. Compute ln(e).":"Le logarithme népérien est {ln}. Saisis e avec {alpha} puis {exp}. Calcule ln(e).","The result is 1. Red labels need ALPHA first.":"Le résultat est 1. Les inscriptions rouges demandent d'abord ALPHA.","Ans and variables":"Ans et variables","Reuse the last answer and store a value in A.":"Réutilise la dernière réponse et mémorise une valeur dans A.","Compute 12×3.":"Calcule 12×3.","The result is 36.":"Le résultat est 36.","With a result showing, pressing {div} starts with Ans, the last answer. Continue with ÷4.":"Quand un résultat est affiché, appuyer sur {div} commence par Ans, la dernière réponse. Continue avec ÷4.","Ans÷4 = 9.":"Ans÷4 = 9.","To keep a value, store it in a variable. Enter 7, press {sto}, then {neg} (its red label is A).":"Pour garder une valeur, mémorise-la dans une variable. Saisis 7, appuie sur {sto}, puis {neg} (son inscription rouge est A).","7 is stored in A.":"7 est mémorisé dans A.","Recall A with ALPHA and {neg}, and compute A×2.":"Rappelle A avec ALPHA et {neg}, et calcule A×2.","14. A variable keeps its value until you store a new one.":"14. Une variable garde sa valeur jusqu'à ce que tu en mémorises une nouvelle.","Scientific notation ×10ˣ":"Notation scientifique ×10ˣ","Compute 3×10⁸ × 2.":"Calcule 3×10⁸ × 2.","Enter 3×10⁸ with {exp}: type 3, press it to get the exponent box, then enter 8.":"Saisis 3×10⁸ avec {exp} : tape 3, appuie dessus pour obtenir la case de l'exposant, puis saisis 8.","Leave the exponent with {right}, then compute ×2.":"Sors de l'exposant avec {right}, puis calcule ×2.","600000000. Without leaving the exponent, ×2 would go into the exponent and give a very different number.":"600000000. Sans sortir de l'exposant, ×2 irait dans l'exposant et donnerait un nombre très différent.","Equations":"Équations","Substituting values with CALC":"Remplacer par des valeurs avec CALC","Evaluate x²+3x at x=2 and x=5.":"Évalue x²+3x pour x=2 et x=5.","Enter x²+3x. x is the {x} key, squaring is {sq}.":"Saisis x²+3x. x est la touche {x}, le carré est {sq}.","{calc} evaluates the expression for a value you give. Press it.":"{calc} évalue l'expression pour une valeur que tu donnes. Appuie dessus.","It asks for x.":"Elle demande x.","Enter 2 and press {eq}.":"Saisis 2 et appuie sur {eq}.","At x=2 the value is 10 (4+6).":"Pour x=2, la valeur est 10 (4+6).","Press {calc} again to try another value. Enter 5 and compute.":"Appuie de nouveau sur {calc} pour essayer une autre valeur. Saisis 5 et calcule.","At x=5 it is 40. Handy for filling in a table without retyping.":"Pour x=5, c'est 40. Pratique pour remplir un tableau sans tout retaper.","Solving with SOLVE":"Résoudre avec SOLVE","Solve 2x+3=11 with SOLVE.":"Résous 2x+3=11 avec SOLVE.","SOLVE works on any equation typed on the calculation screen. Enter 2x+3.":"SOLVE fonctionne sur toute équation tapée sur l'écran de calcul. Saisis 2x+3.","The equals sign of an equation is {alpha} then {calc} (red =). Add =11.":"Le signe égal d'une équation est {alpha} puis {calc} (= rouge). Ajoute =11.","Now it reads 2x+3=11. This equals sign is part of the equation, not the compute key.":"L'écran affiche 2x+3=11. Ce signe égal fait partie de l'équation, ce n'est pas la touche de calcul.","Press {shift} then {calc} (SOLVE).":"Appuie sur {shift} puis {calc} (SOLVE).","It asks for a starting value of x; the search starts from the value x holds now.":"Elle demande une valeur de départ pour x ; la recherche part de la valeur actuelle de x.","Press {eq} to solve.":"Appuie sur {eq} pour résoudre.","x=4. L−R=0 underneath means left side minus right side is 0: the solution is exact.":"x=4. L−R=0 en dessous signifie membre de gauche moins membre de droite égale 0 : la solution est exacte.","Choosing a starting value":"Choisir une valeur de départ","Find the negative root of x²=2.":"Trouve la solution négative de x²=2.","Enter x²=2. The equals sign is ALPHA and {calc}.":"Saisis x²=2. Le signe égal est ALPHA et {calc}.","Open SOLVE with SHIFT and {calc}.":"Ouvre SOLVE avec SHIFT et {calc}.","With two roots (±√2), SOLVE finds the one near the starting value. Enter −1 as the start and press {eq}.":"Avec deux solutions (±√2), SOLVE trouve celle proche de la valeur de départ. Saisis −1 comme départ et appuie sur {eq}.","The starting value is now −1.":"La valeur de départ est maintenant −1.","x=−1.414213562 (−√2). Start from 1 and you get +√2. For several roots, try different starting values.":"x=−1.414213562 (−√2). En partant de 1, tu obtiens +√2. S'il y a plusieurs solutions, essaie différentes valeurs de départ.","Simultaneous equations":"Systèmes d'équations","Solve 2x+3y=8 and x−y=−1.":"Résous 2x+3y=8 et x−y=−1.","Press {menu}. Equation/Func is the 10th app, so choose it with the {neg} key (red A).":"Appuie sur {menu}. Equation/Func est la 10e application : choisis-la avec la touche {neg} (A rouge).","Now choose the kind of equation.":"Choisis maintenant le type d'équation.","Choose 1:Simul Equation, then 2 unknowns.":"Choisis 1:Simul Equation, puis 2 inconnues.","A coefficient table for ax+by=c appears.":"Un tableau de coefficients pour ax+by=c apparaît.","Enter 2, 3, 8 for 2x+3y=8. Each {eq} moves one cell right.":"Saisis 2, 3, 8 pour 2x+3y=8. Chaque {eq} avance d'une case vers la droite.","At the end of a row it moves to the next one.":"En fin de ligne, il passe à la suivante.","For x−y=−1 the coefficients are 1, −1, −1. Use {neg} for negatives.":"Pour x−y=−1, les coefficients sont 1, −1, −1. Utilise {neg} pour les négatifs.","All coefficients are in.":"Tous les coefficients sont saisis.","When no cell is being edited, {eq} solves.":"Quand aucune case n'est en cours de modification, {eq} résout.","x=1.":"x=1.","Press {eq} again for the next unknown.":"Appuie encore sur {eq} pour l'inconnue suivante.","y=2. Check: 2+6=8 and 1−2=−1.":"y=2. Vérification : 2+6=8 et 1−2=−1.","Quadratics and the vertex":"Équations du second degré et sommet","Solve x²−5x+6=0 and find the vertex of the parabola.":"Résous x²−5x+6=0 et trouve le sommet de la parabole.","Press {menu}, {neg}, then 2:Polynomial and degree 2.":"Appuie sur {menu}, {neg}, puis 2:Polynomial et degré 2.","This is the table for ax²+bx+c=0.":"Voici le tableau pour ax²+bx+c=0.","Enter the coefficients 1, −5, 6.":"Saisis les coefficients 1, −5, 6.","x₁=3.":"x₁=3.","Press {eq} for the other root.":"Appuie sur {eq} pour l'autre solution.","x₂=2.":"x₂=2.","Press {eq} twice more for the vertex of y=x²−5x+6.":"Appuie encore deux fois sur {eq} pour le sommet de y=x²−5x+6.","The vertex is x=2.5, y=−0.25, the minimum: useful for sketching the graph.":"Le sommet est x=2.5, y=−0.25, le minimum : utile pour esquisser la courbe.","When there are no real roots":"Quand il n'y a pas de solution réelle","See the complex roots of x²+2x+5=0.":"Observe les solutions complexes de x²+2x+5=0.","Open the quadratic table with {menu}, {neg}, 2, 2.":"Ouvre le tableau du second degré avec {menu}, {neg}, 2, 2.","Enter the coefficients 1, 2, 5.":"Saisis les coefficients 1, 2, 5.","x₁=−1+2i. The discriminant b²−4ac=−16 is negative, so the roots are complex.":"x₁=−1+2i. Le discriminant b²−4ac=−16 est négatif, donc les solutions sont complexes.","x₂=−1−2i. To see just \"no real roots\" instead, set Equation/Func to Off in SETUP.":"x₂=−1−2i. Pour afficher seulement « pas de solution réelle », règle Equation/Func sur Off dans SETUP.","Calculus and sums":"Analyse et sommes","Definite integrals":"Intégrales définies","Compute ∫₀² x² dx.":"Calcule ∫₀² x² dx.","{int} makes an integral box with the cursor in the integrand. Enter x².":"{int} crée une intégrale avec le curseur dans la fonction à intégrer. Saisis x².","Move with {right} to the lower limit and enter 0, then {right} again to the upper limit and enter 2.":"Déplace-toi avec {right} vers la borne inférieure et saisis 0, puis encore {right} vers la borne supérieure et saisis 2.","8/3 (about 2.667): by hand, x³/3 evaluated from 0 to 2.":"8/3 (environ 2.667) : à la main, x³/3 évalué entre 0 et 2.","Integrating trig functions in radians":"Intégrer des fonctions trigonométriques en radians","Compute ∫₀^π sin x dx.":"Calcule ∫₀^π sin x dx.","Calculus with trig functions uses radians. Press {shift}, {menu} (SETUP), then 2:Angle Unit.":"En analyse, les fonctions trigonométriques utilisent les radians. Appuie sur {shift}, {menu} (SETUP), puis 2:Angle Unit.","Choose 2:Radian.":"Choisis 2:Radian.","The indicator at the top changed from D to R.":"L'indicateur en haut est passé de D à R.","Press {int} and enter sin(x).":"Appuie sur {int} et saisis sin(x).","Enter 0 and π as the limits and compute. π is SHIFT then {exp}.":"Saisis 0 et π comme bornes et calcule. π s'obtient avec SHIFT puis {exp}.","2. In degree mode the angle would be read in degrees and the answer would be wrong.":"2. En mode degrés, l'angle serait lu en degrés et le résultat serait faux.","Derivatives at a point":"Nombre dérivé en un point","Find the derivative of x³ at x=2.":"Trouve le nombre dérivé de x³ en x=2.","SHIFT then {int} gives the derivative. Enter x³ (SHIFT then {sq}).":"SHIFT puis {int} donne la dérivée. Saisis x³ (SHIFT puis {sq}).","Move with {right} to x=, enter 2 and compute.":"Déplace-toi avec {right} vers x=, saisis 2 et calcule.","12. The derivative of x³ is 3x², which is 12 at x=2.":"12. La dérivée de x³ est 3x², qui vaut 12 en x=2.","Sums with Σ":"Sommes avec Σ","Sum 1 to 10, then the squares.":"Additionne de 1 à 10, puis les carrés.","SHIFT then {x} gives Σ. Enter x as the term.":"SHIFT puis {x} donne Σ. Saisis x comme terme.","Move with {right} to enter the start 1, then {right} again for the end 10, and compute.":"Déplace-toi avec {right} pour saisir le début 1, puis encore {right} pour la fin 10, et calcule.","1+2+…+10 = 55.":"1+2+…+10 = 55.","Change only the term to get other sums. Sum x² over the same range.":"Change seulement le terme pour obtenir d'autres sommes. Additionne x² sur le même intervalle.","1²+2²+…+10² = 385. Check it with n(n+1)(2n+1)/6.":"1²+2²+…+10² = 385. Vérifie avec n(n+1)(2n+1)/6.","Statistics":"Statistiques","Enter data and find the mean":"Saisir des données et trouver la moyenne","Find the mean of 4, 7, 9, 6, 4.":"Trouve la moyenne de 4, 7, 9, 6, 4.","{menu} opens the app list.":"{menu} ouvre la liste des applications.","There are 12 apps.":"Il y a 12 applications.","Press 6 to open Statistics.":"Appuie sur 6 pour ouvrir Statistics.","Now choose the kind of statistics.":"Choisis maintenant le type de statistiques.","1:1-Variable is for a single list of data. Press 1.":"1:1-Variable sert pour une seule liste de données. Appuie sur 1.","The data table is open.":"Le tableau de données est ouvert.","Enter the first value 4 and press {eq}.":"Saisis la première valeur 4 et appuie sur {eq}.","4 is in row 1 and the cursor moved down.":"4 est en ligne 1 et le curseur est descendu.","Enter 7, 9, 6 and 4 the same way.":"Saisis 7, 9, 6 et 4 de la même façon.","All 5 values are in.":"Les 5 valeurs sont saisies.","{optn} opens the statistics menu.":"{optn} ouvre le menu des statistiques.","3:1-Variable Calc shows the results.":"3:1-Variable Calc affiche les résultats.","Press 3.":"Appuie sur 3.","x̄=6 is the mean and Σx=30 the sum. The next lesson reads the rest of the list.":"x̄=6 est la moyenne et Σx=30 la somme. La leçon suivante lit le reste de la liste.","Reading the results":"Lire les résultats","Find both standard deviations, the median and quartiles.":"Trouve les deux écarts types, la médiane et les quartiles.","Results for 4, 7, 9, 6, 4 are showing, 4 lines at a time. Press {down} four times.":"Les résultats pour 4, 7, 9, 6, 4 s'affichent, 4 lignes à la fois. Appuie quatre fois sur {down}.","σx is the population standard deviation (divide by n); sx is the sample one (divide by n−1). Check which one a question asks for.":"σx est l'écart type de la population (division par n) ; sx est celui de l'échantillon (division par n−1). Vérifie lequel la question demande.","Go down four more times.":"Descends encore quatre fois.","Med=6 is the median; Q1=4 and Q3=8 are the quartiles.":"Med=6 est la médiane ; Q1=4 et Q3=8 sont les quartiles.","Press {ac} to go back to the data table.":"Appuie sur {ac} pour revenir au tableau de données.","The data is still there, ready to edit and recompute.":"Les données sont toujours là, prêtes à être modifiées et recalculées.","Editing and deleting data":"Modifier et supprimer des données","Change one value, delete another and recompute.":"Change une valeur, supprimes-en une autre et recalcule.","The table holds 4, 7, 9, 6, 4 and the cursor is on empty row 6. Press {up} twice to reach the 6 in row 4.":"Le tableau contient 4, 7, 9, 6, 4 et le curseur est sur la ligne 6 vide. Appuie deux fois sur {up} pour atteindre le 6 en ligne 4.","Row 4 is highlighted.":"La ligne 4 est en surbrillance.","Enter 8 and press {eq} to replace 6 with 8.":"Saisis 8 et appuie sur {eq} pour remplacer 6 par 8.","Done. The cursor moved to row 5.":"C'est fait. Le curseur est passé à la ligne 5.","{del} deletes the whole row under the cursor. Delete the 4 in row 5.":"{del} supprime toute la ligne sous le curseur. Supprime le 4 en ligne 5.","The data is now 4, 7, 9, 8.":"Les données sont maintenant 4, 7, 9, 8.","Recompute with {optn} then 3.":"Recalcule avec {optn} puis 3.","x̄=7 and n=4. Results follow the edited data.":"x̄=7 et n=4. Les résultats suivent les données modifiées.","Using frequencies":"Utiliser les effectifs","Mean of 3 people scoring 10, 5 scoring 20, 2 scoring 30.":"Moyenne de 3 personnes ayant 10, 5 ayant 20, 2 ayant 30.","Repeated values are quicker with a Freq column. Open the setup first: {shift} then {menu} (SETUP).":"Les valeurs répétées vont plus vite avec une colonne Freq. Ouvre d'abord les réglages : {shift} puis {menu} (SETUP).","This is the setup list.":"Voici la liste des réglages.","Go to the next page with {down} and pick 3:Statistics.":"Passe à la page suivante avec {down} et choisis 3:Statistics.","It asks whether to show the frequency column.":"Elle demande s'il faut afficher la colonne des effectifs.","Choose 1:On.":"Choisis 1:On.","The Freq column is on.":"La colonne Freq est activée.","Open the 1-Variable table with {menu}, 6, 1.":"Ouvre le tableau 1-Variable avec {menu}, 6, 1.","A Freq column now sits next to x.":"Une colonne Freq se trouve maintenant à côté de x.","Enter the scores 10, 20, 30.":"Saisis les notes 10, 20, 30.","Each Freq starts at 1.":"Chaque Freq vaut 1 au départ.","Move to Freq with {right}, then up three times with {up} to row 1.":"Va dans Freq avec {right}, puis remonte trois fois avec {up} jusqu'à la ligne 1.","Enter the counts 3, 5, 2.":"Saisis les effectifs 3, 5, 2.","3 people scored 10, 5 scored 20, 2 scored 30.":"3 personnes ont eu 10, 5 ont eu 20, 2 ont eu 30.","Compute with {optn} then 3.":"Calcule avec {optn} puis 3.","x̄=19 is the mean score; n=10 is the number of people.":"x̄=19 est la note moyenne ; n=10 est le nombre de personnes.","Two variables and regression":"Deux variables et régression","Fit y=a+bx to study hours and scores.":"Ajuste y=a+bx aux heures de travail et aux notes.","Press {menu}, 6, then choose 2:y=a+bx for paired data.":"Appuie sur {menu}, 6, puis choisis 2:y=a+bx pour des données appariées.","The table has x and y columns.":"Le tableau a des colonnes x et y.","Enter study hours x: 1, 2, 3, 4, 5.":"Saisis les heures de travail x : 1, 2, 3, 4, 5.","Move to y with {right}, then press {up} five times to reach row 1.":"Va dans y avec {right}, puis appuie cinq fois sur {up} pour atteindre la ligne 1.","Enter scores y: 2, 4, 5, 4, 5.":"Saisis les notes y : 2, 4, 5, 4, 5.","Press {optn}, then 4:Regression Calc.":"Appuie sur {optn}, puis 4:Regression Calc.","a=2.2 and b=0.6, so y=2.2+0.6x. r≈0.775 is the correlation; the closer to ±1, the straighter the data.":"a=2.2 et b=0.6, donc y=2.2+0.6x. r≈0.775 est le coefficient de corrélation ; plus il est proche de ±1, plus les données sont alignées.","Predicting with ŷ":"Prévoir avec ŷ","Predict the score ŷ for x=6.":"Prévois la note ŷ pour x=6.","Last lesson's data is loaded. Press {ac} for the calculation screen; the data and fit stay.":"Les données de la leçon précédente sont chargées. Appuie sur {ac} pour l'écran de calcul ; les données et l'ajustement restent.","Enter 6 and press {optn}.":"Saisis 6 et appuie sur {optn}.","Go to the next page with {down} and choose 4:Regression.":"Passe à la page suivante avec {down} et choisis 4:Regression.","Press {down}, then 1 to insert ŷ.":"Appuie sur {down}, puis 1 pour insérer ŷ.","The expression reads 6ŷ: \"y when x is 6\".":"L'expression affiche 6ŷ : « y quand x vaut 6 ».","5.8 = 2.2+0.6×6. x̂ works the other way, from y to x.":"5.8 = 2.2+0.6×6. x̂ fonctionne dans l'autre sens, de y vers x.","Distributions":"Lois de probabilité","Normal probability between two values":"Probabilité normale entre deux valeurs","Heights average 170 cm with SD 6 cm: find P(165 ≤ X ≤ 180).":"Les tailles ont une moyenne de 170 cm et un écart type de 6 cm : trouve P(165 ≤ X ≤ 180).","Open the Distribution app with {menu}, 7.":"Ouvre l'application Distribution avec {menu}, 7.","Choose a distribution.":"Choisis une loi.","2:Normal CD gives the probability between two values. Press 2.":"2:Normal CD donne la probabilité entre deux valeurs. Appuie sur 2.","It asks for Lower, Upper, σ (standard deviation) and μ (mean).":"Elle demande Lower, Upper, σ (écart type) et μ (moyenne).","Enter Lower 165 and Upper 180; each {eq} moves to the next line.":"Saisis Lower 165 et Upper 180 ; chaque {eq} passe à la ligne suivante.","Enter σ=6 and μ=170.":"Saisis σ=6 et μ=170.","With every value in, press {eq} to compute.":"Une fois toutes les valeurs saisies, appuie sur {eq} pour calculer.","P≈0.7499: about 75% are between 165 and 180 cm. No z-table needed.":"P≈0.7499 : environ 75 % mesurent entre 165 et 180 cm. Pas besoin de table de la loi normale.","Cut-off for the top few percent":"Seuil des quelques pour cent supérieurs","Find the height that marks the top 5%.":"Trouve la taille qui délimite les 5 % les plus grands.","Press {menu}, 7, then 3:Inverse Normal.":"Appuie sur {menu}, 7, puis 3:Inverse Normal.","It works backwards from an area to x.":"Elle remonte d'une aire vers x.","Area is measured from the left. The top 5% starts where the lower 95% ends, so enter 0.95.":"L'aire est mesurée depuis la gauche. Les 5 % supérieurs commencent là où finissent les 95 % inférieurs : saisis donc 0.95.","Enter σ=6, μ=170 and compute.":"Saisis σ=6, μ=170 et calcule.","About 179.87 cm: taller than that is the top 5%.":"Environ 179.87 cm : au-delà, on est dans les 5 % supérieurs.","Binomial distribution":"Loi binomiale","Toss a coin 10 times: P(exactly 3 heads) and P(at most 3).":"Lance une pièce 10 fois : P(exactement 3 piles) et P(au plus 3).","Press {menu}, 7, then 4:Binomial PD. PD means \"exactly x times\".":"Appuie sur {menu}, 7, puis 4:Binomial PD. PD signifie « exactement x fois ».","List handles many x values at once; Variable handles one.":"List traite plusieurs valeurs de x à la fois ; Variable en traite une.","Choose 2:Variable.":"Choisis 2:Variable.","Enter x=3 (heads), N=10 (tosses), p=0.5 (chance of heads).":"Saisis x=3 (piles), N=10 (lancers), p=0.5 (probabilité de pile).","0.1171875, about 11.7%.":"0.1171875, environ 11.7 %.","\"At most 3\" is the cumulative Binomial CD. Press {optn} for the list, then 5 and 2.":"« Au plus 3 » correspond à la loi cumulée Binomial CD. Appuie sur {optn} pour la liste, puis 5 et 2.","Enter 3, 10, 0.5 again and compute.":"Saisis de nouveau 3, 10, 0.5 et calcule.","0.171875: the chances of 0, 1, 2 and 3 heads added together.":"0.171875 : les probabilités de 0, 1, 2 et 3 piles additionnées.","Matrices":"Matrices","Entering a matrix and its determinant":"Saisir une matrice et son déterminant","Enter A=[[2,1],[5,3]] and find its determinant.":"Saisis A=[[2,1],[5,3]] et trouve son déterminant.","Open the Matrix app with {menu}, 4.":"Ouvre l'application Matrix avec {menu}, 4.","Choose which matrix to define: MatA to MatD.":"Choisis la matrice à définir : MatA à MatD.","Choose 1:MatA, then 2 rows and 2 columns.":"Choisis 1:MatA, puis 2 lignes et 2 colonnes.","A 2×2 grid appears.":"Une grille 2×2 apparaît.","Enter 2, 1, 5, 3. Each {eq} moves right, then down to the next row.":"Saisis 2, 1, 5, 3. Chaque {eq} avance vers la droite, puis descend à la ligne suivante.","A=[[2,1],[5,3]].":"A=[[2,1],[5,3]].","Go to the calculation screen with {ac}.":"Va à l'écran de calcul avec {ac}.","The matrix stays stored.":"La matrice reste en mémoire.","Press {optn}, go to the second page with {down}, choose 2:Determinant.":"Appuie sur {optn}, passe à la deuxième page avec {down}, choisis 2:Determinant.","Det( is entered.":"Det( est saisi.","Insert MatA with {optn} then 3, close the bracket and compute.":"Insère MatA avec {optn} puis 3, ferme la parenthèse et calcule.","det A = 2×3 − 1×5 = 1.":"det A = 2×3 − 1×5 = 1.","Inverse matrix":"Matrice inverse","Find the inverse of A=[[2,1],[5,3]].":"Trouve l'inverse de A=[[2,1],[5,3]].","Matrix A is already defined. Press {ac} for the calculation screen.":"La matrice A est déjà définie. Appuie sur {ac} pour l'écran de calcul.","Insert MatA with {optn} then 3.":"Insère MatA avec {optn} puis 3.","{inv} gives the inverse. Press it and compute.":"{inv} donne l'inverse. Appuie dessus et calcule.","A⁻¹=[[3,−1],[−5,2]]; integers because det A = 1. With det 0 there is no inverse and you get Math ERROR.":"A⁻¹=[[3,−1],[−5,2]] ; des entiers car det A = 1. Si le déterminant vaut 0, il n'y a pas d'inverse et tu obtiens Math ERROR.","Multiplying matrices":"Multiplier des matrices","Define B=[[1],[2]] and compute A×B.":"Définis B=[[1],[2]] et calcule A×B.","A is defined. Now define B: {optn}, 1:Define Matrix, 2:MatB.":"A est défini. Définis maintenant B : {optn}, 1:Define Matrix, 2:MatB.","Choose 2 rows and 1 column.":"Choisis 2 lignes et 1 colonne.","Enter 1 and 2.":"Saisis 1 et 2.","Press {ac} and enter MatA×MatB: MatA is {optn} 3, MatB is {optn} 4.":"Appuie sur {ac} et saisis MatA×MatB : MatA est {optn} 3, MatB est {optn} 4.","MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). The first matrix's columns must match the second's rows.":"MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). Le nombre de colonnes de la première matrice doit égaler le nombre de lignes de la seconde.","Vectors":"Vecteurs","Entering vectors and the dot product":"Saisir des vecteurs et le produit scalaire","Find the dot product of A=(1,2,3) and B=(4,5,6).":"Trouve le produit scalaire de A=(1,2,3) et B=(4,5,6).","Open the Vector app with {menu}, 5.":"Ouvre l'application Vector avec {menu}, 5.","Choose 1:VctA and dimension 3.":"Choisis 1:VctA et la dimension 3.","Enter 1, 2, 3.":"Saisis 1, 2, 3.","Now define B: {optn}, 1:Define Vector, 2:VctB, dimension 3.":"Définis maintenant B : {optn}, 1:Define Vector, 2:VctB, dimension 3.","Enter 4, 5, 6.":"Saisis 4, 5, 6.","Press {ac}, then insert VctA with {optn} 3.":"Appuie sur {ac}, puis insère VctA avec {optn} 3.","The dot is on the second page of {optn}: 2:Dot Product.":"Le point se trouve sur la deuxième page de {optn} : 2:Dot Product.","Insert VctB with {optn} 4 and compute.":"Insère VctB avec {optn} 4 et calcule.","32 (1×4+2×5+3×6). A dot product of 0 means the vectors are perpendicular.":"32 (1×4+2×5+3×6). Un produit scalaire nul signifie que les vecteurs sont orthogonaux.","Cross product and angle":"Produit vectoriel et angle","Find the cross product of A and B and the angle between them.":"Trouve le produit vectoriel de A et B et l'angle entre eux.","A and B are defined. Press {ac} and enter VctA×VctB; {mul} between vectors is the cross product.":"A et B sont définis. Appuie sur {ac} et saisis VctA×VctB ; {mul} entre deux vecteurs donne le produit vectoriel.","(−3, 6, −3), perpendicular to both A and B.":"(−3, 6, −3), orthogonal à A et à B.","Press {ac}, then 3:Angle on the second page of {optn}.":"Appuie sur {ac}, puis 3:Angle sur la deuxième page de {optn}.","Enter VctA, a comma, VctB, close the bracket and compute. The comma is SHIFT then {rp}.":"Saisis VctA, une virgule, VctB, ferme la parenthèse et calcule. La virgule est SHIFT puis {rp}.","About 12.93°. It follows the angle unit setting (D or R).":"Environ 12.93°. Le résultat suit le réglage de l'unité d'angle (D ou R).","Function tables":"Tableaux de valeurs","Making a table of values":"Créer un tableau de valeurs","Tabulate f(x)=x²−2x for x from −2 to 4.":"Dresse le tableau de f(x)=x²−2x pour x de −2 à 4.","Open the Table app with {menu}, 9.":"Ouvre l'application Table avec {menu}, 9.","Enter f(x)= here.":"Saisis f(x)= ici.","Enter x²−2x and press {eq}.":"Saisis x²−2x et appuie sur {eq}.","It also asks for g(x)=. Leave it empty for a single function.":"Elle demande aussi g(x)=. Laisse-le vide pour une seule fonction.","Leave g(x) empty and press {eq}.":"Laisse g(x) vide et appuie sur {eq}.","Now set the range: Start, End and Step.":"Règle maintenant l'intervalle : Start, End et Step.","Enter Start −2, End 4, Step 1.":"Saisis Start −2, End 4, Step 1.","Press {eq} to build the table.":"Appuie sur {eq} pour créer le tableau.","f(x)=0 at x=0 and x=2, where the graph meets the x-axis; the minimum −1 is at x=1. Scroll with {up}{down}.":"f(x)=0 pour x=0 et x=2, là où la courbe coupe l'axe des abscisses ; le minimum −1 est atteint en x=1. Fais défiler avec {up}{down}.","Comparing two functions":"Comparer deux fonctions","Find where 2ˣ and x² are equal.":"Trouve où 2ˣ et x² sont égaux.","Open Table with {menu}, 9 and enter f(x)=2ˣ: use {pow} for the exponent and leave it with {right}.":"Ouvre Table avec {menu}, 9 et saisis f(x)=2ˣ : utilise {pow} pour l'exposant et sors-en avec {right}.","This time also enter g(x)=x².":"Cette fois, saisis aussi g(x)=x².","Use Start 1, End 5, Step 1 and build the table.":"Utilise Start 1, End 5, Step 1 et crée le tableau.","They match at x=2 and x=4 (4=4, 16=16). At x=3, x² is bigger; from x=5, 2ˣ pulls ahead.":"Elles sont égales en x=2 et x=4 (4=4, 16=16). En x=3, x² est plus grand ; à partir de x=5, 2ˣ prend le dessus.","Number bases":"Bases de numération","Decimal to hex and binary":"Du décimal à l'hexadécimal et au binaire","Convert 255 to hexadecimal and binary.":"Convertis 255 en hexadécimal et en binaire.","Open the Base-N app with {menu}, 3.":"Ouvre l'application Base-N avec {menu}, 3.","Dec at the bottom means decimal.":"Dec en bas signifie décimal.","Enter 255 and press {eq}.":"Saisis 255 et appuie sur {eq}.","Press {pow}, the key with blue HEX.":"Appuie sur {pow}, la touche avec HEX en bleu.","FF. In Base-N the blue labels are what the keys do.":"FF. Dans Base-N, les inscriptions bleues indiquent la fonction des touches.","Press {logb}, the key with blue BIN.":"Appuie sur {logb}, la touche avec BIN en bleu.","11111111: the same value in another base. DEC ({sq}) gets 255 back.":"11111111 : la même valeur dans une autre base. DEC ({sq}) redonne 255.","Hexadecimal arithmetic":"Calcul en hexadécimal","Compute 1F + A in hexadecimal.":"Calcule 1F + A en hexadécimal.","Press {menu}, 3, then {pow} (HEX).":"Appuie sur {menu}, 3, puis {pow} (HEX).","The screen shows Hex.":"L'écran affiche Hex.","A to F are the red-label keys, typed directly. 1F is 1 then {tan} (F).":"A à F sont les touches aux inscriptions rouges, saisies directement. 1F, c'est 1 puis {tan} (F).","Add A ({neg}) and compute.":"Ajoute A ({neg}) et calcule.","29, which is 31+10=41 in decimal.":"29, soit 31+10=41 en décimal.","Binary logic operations":"Opérations logiques en binaire","Compute 1100 and 1010.":"Calcule 1100 and 1010.","Press {menu}, 3, then {logb} (BIN).":"Appuie sur {menu}, 3, puis {logb} (BIN).","Enter 1100.":"Saisis 1100.","Choose 1:and from {optn}.":"Choisis 1:and dans {optn}.","Enter 1010 and compute.":"Saisis 1010 et calcule.","1000: only bits set in both stay 1. or, xor and Not are in the same menu.":"1000 : seuls les bits à 1 dans les deux restent à 1. or, xor et Not sont dans le même menu.","Complex numbers":"Nombres complexes","Complex arithmetic":"Calcul avec les complexes","Compute (2+3i)(1−i).":"Calcule (2+3i)(1−i).","Open the Complex app with {menu}, 2.":"Ouvre l'application Complex avec {menu}, 2.","Here the {eng} key types i (purple label).":"Ici, la touche {eng} saisit i (inscription violette).","Enter (2+3i).":"Saisis (2+3i).","Add (1−i) and compute.":"Ajoute (1−i) et calcule.","5+i, since 2−2i+3i−3i² = 5+i with i²=−1.":"5+i, car 2−2i+3i−3i² = 5+i avec i²=−1.","Modulus, conjugate and polar form":"Module, conjugué et forme polaire","Find |3+4i|, its conjugate, and 1+i in polar form.":"Trouve |3+4i|, son conjugué, et 1+i sous forme polaire.","The modulus is the absolute value: SHIFT then {lp} (Abs), enter 3+4i, leave with {right} and compute.":"Le module est la valeur absolue : SHIFT puis {lp} (Abs), saisis 3+4i, sors avec {right} et calcule.","5, which is √(3²+4²).":"5, c'est-à-dire √(3²+4²).","The conjugate is 2:Conjugate in {optn}. Compute Conjg(3+4i).":"Le conjugué est 2:Conjugate dans {optn}. Calcule Conjg(3+4i).","3−4i: only the sign of the imaginary part flips.":"3−4i : seul le signe de la partie imaginaire change.","Now enter 1+i, choose 5:▶r∠θ from {optn}, and compute.":"Saisis maintenant 1+i, choisis 5:▶r∠θ dans {optn}, et calcule.","√2∠45: distance √2 from the origin at 45°. To always see polar form, set Complex to r∠θ in SETUP.":"√2∠45 : distance √2 de l'origine, à 45°. Pour toujours voir la forme polaire, règle Complex sur r∠θ dans SETUP.","Inequalities and ratios":"Inéquations et proportions","Quadratic inequalities":"Inéquations du second degré","Solve x²−5x+6<0 and x²−5x+6>0.":"Résous x²−5x+6<0 et x²−5x+6>0.","Press {menu}. Inequality is the 11th app, chosen with the {dms} key (red B).":"Appuie sur {menu}. Inequality est la 11e application, choisie avec la touche {dms} (B rouge).","It asks for the degree.":"Elle demande le degré.","Press 2 for degree 2.":"Appuie sur 2 pour le degré 2.","Four inequality forms appear.":"Quatre formes d'inéquation apparaissent.","Choose 2:ax²+bx+c<0.":"Choisis 2:ax²+bx+c<0.","2<x<3: where the parabola is below the x-axis.":"2<x<3 : là où la parabole est sous l'axe des abscisses.","Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.":"Inverse maintenant le signe : {ac} revient au tableau, puis {optn} recommence. Choisis 2, puis 1:>0.","Enter 1, −5, 6 again and solve.":"Saisis de nouveau 1, −5, 6 et résous.","x<2, 3<x: exactly the other side.":"x<2, 3<x : exactement l'autre côté.","Proportions":"Proportions","Find X in 3:4 = X:12.":"Trouve X dans 3:4 = X:12.","Press {menu}, then the {inv} key (red C) for the 12th app, Ratio.":"Appuie sur {menu}, puis la touche {inv} (C rouge) pour la 12e application, Ratio.","Two forms, with X in different places.":"Deux formes, avec X à des places différentes.","Choose 1:A:B=X:D.":"Choisis 1:A:B=X:D.","Enter A=3, B=4, D=12.":"Saisis A=3, B=4, D=12.","X=9, since 3×12=4×X. Handy for scaling recipes or map distances.":"X=9, car 3×12=4×X. Pratique pour adapter une recette ou des distances sur une carte.","Spreadsheet":"Tableur","Values and formulas":"Valeurs et formules","Enter prices and quantities, then the formula =A1×B1.":"Saisis des prix et des quantités, puis la formule =A1×B1.","Open the Spreadsheet app with {menu}, 8.":"Ouvre l'application Spreadsheet avec {menu}, 8.","Columns A–E, rows 1–45. The cursor is on A1.":"Colonnes A–E, lignes 1–45. Le curseur est sur A1.","Enter prices 1200, 800, 1500 down column A; {eq} moves down.":"Saisis les prix 1200, 800, 1500 dans la colonne A ; {eq} descend d'une case.","Move to column B with {right}, then {up} three times to B1.":"Va dans la colonne B avec {right}, puis trois fois {up} jusqu'à B1.","Enter quantities 2, 5, 1.":"Saisis les quantités 2, 5, 1.","Go to C1 with {right} and {up} three times.":"Va en C1 avec {right} et trois fois {up}.","Formulas start with = (ALPHA {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.":"Les formules commencent par = (ALPHA {calc}). A1, c'est ALPHA {neg} (A) puis 1 ; B1, c'est ALPHA {dms} (B) puis 1. Saisis =A1×B1.","Press {eq} to enter it.":"Appuie sur {eq} pour la valider.","C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.":"C1 affiche 2400. Modifie A1 ou B1 et C1 se recalcule tout seul.","Filling formulas and totals":"Recopier des formules et totaux","Fill C1's formula down to C3 and total it in C4.":"Recopie la formule de C1 jusqu'à C3 et fais le total en C4.","Last lesson's sheet is loaded. Go up to C1 with {up}.":"La feuille de la leçon précédente est chargée. Remonte en C1 avec {up}.","1:Fill Formula in {optn} fills many cells at once. Choose it.":"1:Fill Formula dans {optn} remplit plusieurs cases d'un coup. Choisis-le.","It asks for Form and Range.":"Elle demande Form et Range.","Enter A1×B1 as the Form and press {eq} to go to Range.":"Saisis A1×B1 comme Form et appuie sur {eq} pour passer à Range.","The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.":"La plage affiche C1:C1. Efface le dernier 1 avec {del}, tape 3 pour obtenir C1:C3, puis {eq}.","C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.":"C2=4000 et C3=1500 : la formule devient A2×B2 puis A3×B3, ligne par ligne.","Go down to C4 with {down} three times.":"Descends en C4 avec trois fois {down}.","Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.":"Saisis =Sum( : ALPHA {calc}, puis {optn}, {down}, 4:Sum.","Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.":"Saisis C1:C3, ferme la parenthèse et appuie sur {eq}. C, c'est ALPHA {inv} ; les deux-points, c'est ALPHA {int}.","C4 = 7900. Mean, Min and Max in the same menu work the same way.":"C4 = 7900. Mean, Min et Max dans le même menu fonctionnent de la même façon."},"ja":{"Learn":"学ぶ","Learn by pressing the keys yourself":"キーを実際に押しながら覚えましょう","Settings, variables and data changed during a lesson are restored when you close this panel.":"レッスン中に変わった設定・変数・統計データは、このパネルを閉じると元に戻ります。","Lessons":"一覧","Show me":"お手本","Restart":"最初から","Next":"次へ","Next lesson":"次のレッスン","This time, press":"今度はこのキーです","Well done! Feel free to keep experimenting.":"よくできました！自由に操作してみましょう。","Close":"閉じる","lessons":"レッスン","Basics":"基本","Arithmetic and order of operations":"四則計算と計算の順序","Compute 2+3×4 and 3×(2+5).":"2+3×4 と 3×(2+5) を計算します。","Type 2+3×4. The expression appears just as you would write it.":"2+3×4 と順に押しましょう。式は書いたとおりに表示されます。","Nothing is computed yet. You enter the whole expression first.":"まだ計算されていません。式を最後まで入力してから計算します。","Press {eq} to compute.":"{eq} を押すと計算します。","The answer is 14: multiplication comes before addition (3×4=12, then 2+12).":"答えは 14 です。かけ算はたし算より先に計算するからです（3×4=12、次に 2+12）。","{ac} clears the expression. Stored values and settings stay.":"{ac} は式を消します。記憶した値や設定はそのまま残ります。","The screen is empty.":"画面が空になりました。","Use brackets to add first. Enter 3×(2+5) and compute.":"たし算を先にするにはかっこを使います。3×(2+5) を入力して計算しましょう。","The answer is 21. The brackets were computed first.":"答えは 21 です。かっこの中を先に計算しました。","Fixing mistakes":"まちがいを直す","Edit an expression with DEL and ◀.":"DEL と ◀ で式を直します。","Enter 2+5.":"2+5 を入力しましょう。","Say the 5 was a mistake. {del} deletes the character before the cursor.":"5 を入力ミスしたとしましょう。{del} はカーソルの直前の文字を消します。","The 5 is gone.":"5 が消えました。","Enter 6 and compute.":"6 を入力して計算しましょう。","2+6=8.":"2+6=8 です。","You can still edit after computing. {left} brings the expression back with the cursor at the end.":"計算した後でも式は直せます。{left} を押すと式に戻り、カーソルが末尾に来ます。","You are editing the expression again.":"また式を編集できる状態です。","Delete the 6, enter 9 and compute again.":"6 を消して 9 を入力し、もう一度計算しましょう。","2+9=11. No need to retype long expressions.":"2+9=11 です。長い式も打ち直す必要はありません。","Negative numbers":"負の数","Learn the (−) key versus minus, and squaring negatives.":"(−) キーとひき算キーの違い、負の数の2乗を学びます。","For a negative number use {neg}, not minus {sub}. Compute (−)3×4.":"負の数にはひき算の {sub} ではなく {neg} を使います。(−)3×4 を計算しましょう。","The result is −12.":"結果は −12 です。","Now enter −3² as written. Squaring is {sq}.":"次は −3² を書いたとおりに入力します。2乗は {sq} です。","You get −9: the square is taken first, then the sign, just like in maths.":"−9 になります。数学と同じく、2乗を先に計算してから符号をつけるからです。","For (−3)², wrap it in brackets.":"(−3)² にしたいときは、かっこでくくります。","The answer is 9.":"答えは 9 です。","Fractions and decimals":"分数と小数","Compute 2/3 + 1/4 as a fraction, then as a decimal.":"2/3 + 1/4 を分数で計算し、小数に直します。","{frac} makes a fraction box with the cursor in the numerator. Enter 2.":"{frac} で分数の枠ができ、カーソルは分子にあります。2 を入力しましょう。","Go down to the denominator with {down} and enter 3.":"{down} で分母に移り、3 を入力しましょう。","Leave the fraction with {right}, then press +.":"{right} で分数の外に出てから + を押しましょう。","Enter 1/4 the same way.":"同じように 1/4 を入力しましょう。","Compute.":"計算しましょう。","You get the fraction 11/12. The calculator finds the common denominator and reduces.":"分数 11/12 で表示されます。通分と約分は電卓がしてくれます。","{sd} switches between fraction and decimal.":"{sd} は分数と小数を切り替えます。","0.9166666667. Press it again to get the fraction back.":"0.9166666667 です。もう一度押すと分数に戻ります。","Roots and powers":"平方根と累乗","Compute √8, 2¹⁰ and ∛27, and learn SHIFT.":"√8、2¹⁰、∛27 を計算し、SHIFT の使い方を覚えます。","Press {sqrt}, enter 8 and compute.":"{sqrt} を押し、8 を入力して計算しましょう。","You get 2√2, the exact form. Press S⇔D if you want the decimal.":"2√2 と正確な形で表示されます。小数にしたいときは S⇔D を押します。","Powers use {pow}. Enter 2, press it to get the exponent box, then enter 10.":"累乗は {pow} です。2 を入力してこのキーを押すと指数の枠ができます。続けて 10 を入力しましょう。","Leave the exponent with {right} and compute.":"{right} で指数から出て計算しましょう。","2¹⁰ = 1024.":"2¹⁰ = 1024 です。","Yellow labels above the keys need {shift} first. SHIFT then {sqrt} gives ∛. Compute ∛27.":"キーの上の黄色い文字は、先に {shift} を押して使います。SHIFT の後に {sqrt} で ∛ になります。∛27 を計算しましょう。","The answer is 3. An S lights up on screen while SHIFT is active.":"答えは 3 です。SHIFT が有効な間は画面に S が点灯します。","Trigonometry and angle units":"三角関数と角度の単位","Compute sin 30° and sin⁻¹(0.5).":"sin 30° と sin⁻¹(0.5) を計算します。","The D at the top means degrees. {sin} enters sin(. Compute sin(30).":"画面上の D は角度の単位が度（°）という意味です。{sin} で sin( が入ります。sin(30) を計算しましょう。","The result is 1/2.":"結果は 1/2 です。","Inverse functions use SHIFT. Compute sin⁻¹(0.5).":"逆関数は SHIFT と組み合わせます。sin⁻¹(0.5) を計算しましょう。","30: the angle whose sine is 0.5. To switch to radians use SHIFT, MENU (SETUP), then 2:Angle Unit.":"30 です。sin の値が 0.5 になる角です。ラジアンにするには SHIFT、MENU（SETUP）の後 2:Angle Unit を選びます。","Logarithms":"対数","Compute log₂8, log 100 and ln e.":"log₂8、log 100、ln e を計算します。","{logb} is a log with a chosen base. Enter base 2, move with {right}, enter 8 and compute.":"{logb} は底を指定する対数です。底に 2 を入力し、{right} で移って 8 を入力して計算しましょう。","log₂8 = 3.":"log₂8 = 3 です。","The common log (base 10) is SHIFT and {neg}. Compute log(100).":"常用対数（底 10）は SHIFT と {neg} です。log(100) を計算しましょう。","The result is 2.":"結果は 2 です。","The natural log is {ln}. Enter e with {alpha} then {exp}. Compute ln(e).":"自然対数は {ln} です。e は {alpha} の後に {exp} で入力します。ln(e) を計算しましょう。","The result is 1. Red labels need ALPHA first.":"結果は 1 です。赤い文字は先に ALPHA を押して使います。","Ans and variables":"Ans と変数","Reuse the last answer and store a value in A.":"直前の答えを使い、値を A に記憶します。","Compute 12×3.":"12×3 を計算しましょう。","The result is 36.":"結果は 36 です。","With a result showing, pressing {div} starts with Ans, the last answer. Continue with ÷4.":"答えが表示されているときに {div} を押すと、直前の答え Ans から始まります。続けて ÷4 を計算しましょう。","Ans÷4 = 9.":"Ans÷4 = 9 です。","To keep a value, store it in a variable. Enter 7, press {sto}, then {neg} (its red label is A).":"値を残しておくには変数に記憶します。7 を入力し、{sto} の後 {neg}（赤い文字が A）を押しましょう。","7 is stored in A.":"A に 7 が記憶されました。","Recall A with ALPHA and {neg}, and compute A×2.":"ALPHA と {neg} で A を呼び出し、A×2 を計算しましょう。","14. A variable keeps its value until you store a new one.":"14 です。変数は新しい値を記憶するまで値を保ちます。","Scientific notation ×10ˣ":"指数表示 ×10ˣ","Compute 3×10⁸ × 2.":"3×10⁸ × 2 を計算します。","Enter 3×10⁸ with {exp}: type 3, press it to get the exponent box, then enter 8.":"3×10⁸ は {exp} で入力します。3 を入力してこのキーを押すと指数の枠ができます。8 を入力しましょう。","Leave the exponent with {right}, then compute ×2.":"{right} で指数から出て、×2 を計算しましょう。","600000000. Without leaving the exponent, ×2 would go into the exponent and give a very different number.":"600000000 です。指数から出ないと ×2 まで指数に入り、まったく違う数になります。","Equations":"方程式","Substituting values with CALC":"CALC で値を代入する","Evaluate x²+3x at x=2 and x=5.":"x²+3x に x=2 と x=5 を代入します。","Enter x²+3x. x is the {x} key, squaring is {sq}.":"x²+3x を入力しましょう。x は {x} キー、2乗は {sq} です。","{calc} evaluates the expression for a value you give. Press it.":"{calc} は指定した値を式に代入して計算します。押しましょう。","It asks for x.":"x の値をたずねてきます。","Enter 2 and press {eq}.":"2 を入力して {eq} を押しましょう。","At x=2 the value is 10 (4+6).":"x=2 のとき値は 10 です（4+6）。","Press {calc} again to try another value. Enter 5 and compute.":"もう一度 {calc} を押すと別の値を試せます。5 を入力して計算しましょう。","At x=5 it is 40. Handy for filling in a table without retyping.":"x=5 のとき 40 です。式を打ち直さずに表を埋めるのに便利です。","Solving with SOLVE":"SOLVE で解く","Solve 2x+3=11 with SOLVE.":"2x+3=11 を SOLVE で解きます。","SOLVE works on any equation typed on the calculation screen. Enter 2x+3.":"SOLVE は計算画面に入力した方程式をそのまま解きます。2x+3 を入力しましょう。","The equals sign of an equation is {alpha} then {calc} (red =). Add =11.":"方程式の等号は {alpha} の後に {calc}（赤い =）です。=11 を続けて入力しましょう。","Now it reads 2x+3=11. This equals sign is part of the equation, not the compute key.":"2x+3=11 になりました。この等号は式の一部で、計算するキーとは別物です。","Press {shift} then {calc} (SOLVE).":"{shift} の後 {calc}（SOLVE）を押しましょう。","It asks for a starting value of x; the search starts from the value x holds now.":"x の初期値をたずねてきます。今 x に入っている値から探し始めます。","Press {eq} to solve.":"{eq} を押して解きましょう。","x=4. L−R=0 underneath means left side minus right side is 0: the solution is exact.":"x=4 です。下の L−R=0 は左辺−右辺が 0、つまり解が正確だという意味です。","Choosing a starting value":"初期値の選び方","Find the negative root of x²=2.":"x²=2 の負の解を求めます。","Enter x²=2. The equals sign is ALPHA and {calc}.":"x²=2 を入力しましょう。等号は ALPHA と {calc} です。","Open SOLVE with SHIFT and {calc}.":"SHIFT と {calc} で SOLVE を開きましょう。","With two roots (±√2), SOLVE finds the one near the starting value. Enter −1 as the start and press {eq}.":"解が ±√2 の2つあるとき、SOLVE は初期値に近い解を求めます。初期値に −1 を入力して {eq} を押しましょう。","The starting value is now −1.":"初期値が −1 になりました。","x=−1.414213562 (−√2). Start from 1 and you get +√2. For several roots, try different starting values.":"x=−1.414213562（−√2）です。1 から始めると +√2 になります。解が複数あるときは、初期値を変えて試しましょう。","Simultaneous equations":"連立方程式","Solve 2x+3y=8 and x−y=−1.":"2x+3y=8 と x−y=−1 を解きます。","Press {menu}. Equation/Func is the 10th app, so choose it with the {neg} key (red A).":"{menu} を押しましょう。Equation/Func は10番目のアプリなので、{neg} キー（赤い A）で選びます。","Now choose the kind of equation.":"方程式の種類を選びます。","Choose 1:Simul Equation, then 2 unknowns.":"1:Simul Equation を選び、未知数の数 2 を押しましょう。","A coefficient table for ax+by=c appears.":"ax+by=c の係数の表が表示されます。","Enter 2, 3, 8 for 2x+3y=8. Each {eq} moves one cell right.":"2x+3y=8 の係数 2, 3, 8 を入力しましょう。{eq} を押すたびに右のセルへ移ります。","At the end of a row it moves to the next one.":"行の終わりでは次の行に移ります。","For x−y=−1 the coefficients are 1, −1, −1. Use {neg} for negatives.":"x−y=−1 の係数は 1, −1, −1 です。負の数は {neg} で入力しましょう。","All coefficients are in.":"係数がすべて入りました。","When no cell is being edited, {eq} solves.":"セルを編集していないときに {eq} を押すと解きます。","x=1.":"x=1 です。","Press {eq} again for the next unknown.":"もう一度 {eq} を押すと次の解が出ます。","y=2. Check: 2+6=8 and 1−2=−1.":"y=2 です。確かめ：2+6=8、1−2=−1。","Quadratics and the vertex":"2次方程式と頂点","Solve x²−5x+6=0 and find the vertex of the parabola.":"x²−5x+6=0 を解き、放物線の頂点を求めます。","Press {menu}, {neg}, then 2:Polynomial and degree 2.":"{menu}、{neg} の後、2:Polynomial を選び、次数 2 を押しましょう。","This is the table for ax²+bx+c=0.":"ax²+bx+c=0 の係数の表です。","Enter the coefficients 1, −5, 6.":"係数 1, −5, 6 を入力しましょう。","x₁=3.":"x₁=3 です。","Press {eq} for the other root.":"{eq} でもう一方の解を見ましょう。","x₂=2.":"x₂=2 です。","Press {eq} twice more for the vertex of y=x²−5x+6.":"さらに {eq} を2回押すと、y=x²−5x+6 の頂点が出ます。","The vertex is x=2.5, y=−0.25, the minimum: useful for sketching the graph.":"頂点は x=2.5、y=−0.25 で、ここで最小値をとります。グラフをかくときに役立ちます。","When there are no real roots":"実数解がないとき","See the complex roots of x²+2x+5=0.":"x²+2x+5=0 の複素数解を見ます。","Open the quadratic table with {menu}, {neg}, 2, 2.":"{menu}、{neg}、2、2 で2次方程式の表を開きましょう。","Enter the coefficients 1, 2, 5.":"係数 1, 2, 5 を入力しましょう。","x₁=−1+2i. The discriminant b²−4ac=−16 is negative, so the roots are complex.":"x₁=−1+2i です。判別式 b²−4ac=−16 が負なので、解は複素数になります。","x₂=−1−2i. To see just \"no real roots\" instead, set Equation/Func to Off in SETUP.":"x₂=−1−2i です。代わりに「実数解なし」とだけ表示したいときは、SETUP の Equation/Func を Off にします。","Calculus and sums":"微積分と和","Definite integrals":"定積分","Compute ∫₀² x² dx.":"∫₀² x² dx を計算します。","{int} makes an integral box with the cursor in the integrand. Enter x².":"{int} で積分の枠ができ、カーソルは被積分関数の位置にあります。x² を入力しましょう。","Move with {right} to the lower limit and enter 0, then {right} again to the upper limit and enter 2.":"{right} で下端に移って 0 を入力し、もう一度 {right} で上端に移って 2 を入力しましょう。","8/3 (about 2.667): by hand, x³/3 evaluated from 0 to 2.":"8/3（約 2.667）です。手計算では x³/3 に 2 と 0 を代入した差です。","Integrating trig functions in radians":"三角関数の積分はラジアンで","Compute ∫₀^π sin x dx.":"∫₀^π sin x dx を計算します。","Calculus with trig functions uses radians. Press {shift}, {menu} (SETUP), then 2:Angle Unit.":"三角関数の微積分はラジアンで計算します。{shift}、{menu}（SETUP）の後 2:Angle Unit を選びましょう。","Choose 2:Radian.":"2:Radian を選びましょう。","The indicator at the top changed from D to R.":"画面上の表示が D から R に変わりました。","Press {int} and enter sin(x).":"{int} を押して sin(x) を入力しましょう。","Enter 0 and π as the limits and compute. π is SHIFT then {exp}.":"積分区間に 0 と π を入力して計算しましょう。π は SHIFT の後 {exp} です。","2. In degree mode the angle would be read in degrees and the answer would be wrong.":"2 です。度のままだと角を度として読むため、答えがまちがってしまいます。","Derivatives at a point":"微分係数","Find the derivative of x³ at x=2.":"x³ の x=2 における微分係数を求めます。","SHIFT then {int} gives the derivative. Enter x³ (SHIFT then {sq}).":"SHIFT の後 {int} で微分になります。x³ を入力しましょう（SHIFT の後 {sq}）。","Move with {right} to x=, enter 2 and compute.":"{right} で x= に移り、2 を入力して計算しましょう。","12. The derivative of x³ is 3x², which is 12 at x=2.":"12 です。x³ を微分すると 3x² で、x=2 のとき 12 になります。","Sums with Σ":"Σ で和を求める","Sum 1 to 10, then the squares.":"1 から 10 までの和と、2乗の和を求めます。","SHIFT then {x} gives Σ. Enter x as the term.":"SHIFT の後 {x} で Σ になります。足す式に x を入力しましょう。","Move with {right} to enter the start 1, then {right} again for the end 10, and compute.":"{right} で移って初めの値 1、もう一度 {right} で終わりの値 10 を入力して計算しましょう。","1+2+…+10 = 55.":"1+2+…+10 = 55 です。","Change only the term to get other sums. Sum x² over the same range.":"式だけ変えれば別の和もすぐ求められます。同じ範囲で x² の和を計算しましょう。","1²+2²+…+10² = 385. Check it with n(n+1)(2n+1)/6.":"1²+2²+…+10² = 385 です。n(n+1)(2n+1)/6 で確かめてみましょう。","Statistics":"統計","Enter data and find the mean":"データを入力して平均を求める","Find the mean of 4, 7, 9, 6, 4.":"4, 7, 9, 6, 4 の平均を求めます。","{menu} opens the app list.":"{menu} でアプリの一覧が開きます。","There are 12 apps.":"アプリは12個あります。","Press 6 to open Statistics.":"6 を押して Statistics を開きましょう。","Now choose the kind of statistics.":"統計の種類を選びます。","1:1-Variable is for a single list of data. Press 1.":"1:1-Variable は1種類のデータの統計です。1 を押しましょう。","The data table is open.":"データの表が開きました。","Enter the first value 4 and press {eq}.":"最初の値 4 を入力して {eq} を押しましょう。","4 is in row 1 and the cursor moved down.":"4 が1行目に入り、カーソルが下に移りました。","Enter 7, 9, 6 and 4 the same way.":"同じように 7, 9, 6, 4 を入力しましょう。","All 5 values are in.":"5個の値がすべて入りました。","{optn} opens the statistics menu.":"{optn} で統計のメニューが開きます。","3:1-Variable Calc shows the results.":"3:1-Variable Calc で結果を表示します。","Press 3.":"3 を押しましょう。","x̄=6 is the mean and Σx=30 the sum. The next lesson reads the rest of the list.":"x̄=6 が平均、Σx=30 が合計です。残りの項目は次のレッスンで読みます。","Reading the results":"結果の読み方","Find both standard deviations, the median and quartiles.":"2種類の標準偏差、中央値、四分位数を見つけます。","Results for 4, 7, 9, 6, 4 are showing, 4 lines at a time. Press {down} four times.":"4, 7, 9, 6, 4 の結果が1画面に4行ずつ表示されています。{down} を4回押しましょう。","σx is the population standard deviation (divide by n); sx is the sample one (divide by n−1). Check which one a question asks for.":"σx は母集団の標準偏差（n で割る）、sx は標本の標準偏差（n−1 で割る）です。問題がどちらを求めているか確認しましょう。","Go down four more times.":"さらに4回下へ進みましょう。","Med=6 is the median; Q1=4 and Q3=8 are the quartiles.":"Med=6 が中央値、Q1=4 と Q3=8 が四分位数です。","Press {ac} to go back to the data table.":"{ac} でデータの表に戻りましょう。","The data is still there, ready to edit and recompute.":"データはそのまま残っているので、直して計算し直せます。","Editing and deleting data":"データの修正と削除","Change one value, delete another and recompute.":"値を1つ変え、1つ消してから計算し直します。","The table holds 4, 7, 9, 6, 4 and the cursor is on empty row 6. Press {up} twice to reach the 6 in row 4.":"表には 4, 7, 9, 6, 4 が入っていて、カーソルは空の6行目にあります。{up} を2回押して4行目の 6 に移りましょう。","Row 4 is highlighted.":"4行目が反転表示されています。","Enter 8 and press {eq} to replace 6 with 8.":"8 を入力して {eq} を押すと、6 が 8 に置き換わります。","Done. The cursor moved to row 5.":"置き換わりました。カーソルは5行目に移りました。","{del} deletes the whole row under the cursor. Delete the 4 in row 5.":"{del} はカーソルのある行をまるごと消します。5行目の 4 を消しましょう。","The data is now 4, 7, 9, 8.":"データは 4, 7, 9, 8 になりました。","Recompute with {optn} then 3.":"{optn} の後 3 で計算し直しましょう。","x̄=7 and n=4. Results follow the edited data.":"x̄=7、n=4 です。データを直すと結果も変わります。","Using frequencies":"度数（Freq）を使う","Mean of 3 people scoring 10, 5 scoring 20, 2 scoring 30.":"10点が3人、20点が5人、30点が2人のときの平均を求めます。","Repeated values are quicker with a Freq column. Open the setup first: {shift} then {menu} (SETUP).":"同じ値がくり返すときは Freq（度数）の列を使うと速いです。まず設定を開きます：{shift} の後 {menu}（SETUP）。","This is the setup list.":"設定の一覧です。","Go to the next page with {down} and pick 3:Statistics.":"{down} で次のページに進み、3:Statistics を選びましょう。","It asks whether to show the frequency column.":"度数の列を表示するかたずねてきます。","Choose 1:On.":"1:On を選びましょう。","The Freq column is on.":"Freq の列がオンになりました。","Open the 1-Variable table with {menu}, 6, 1.":"{menu}、6、1 で 1-Variable の表を開きましょう。","A Freq column now sits next to x.":"x の隣に Freq の列ができました。","Enter the scores 10, 20, 30.":"点数 10, 20, 30 を入力しましょう。","Each Freq starts at 1.":"Freq は最初どれも 1 です。","Move to Freq with {right}, then up three times with {up} to row 1.":"{right} で Freq に移り、{up} を3回押して1行目に移りましょう。","Enter the counts 3, 5, 2.":"人数 3, 5, 2 を入力しましょう。","3 people scored 10, 5 scored 20, 2 scored 30.":"10点が3人、20点が5人、30点が2人です。","Compute with {optn} then 3.":"{optn} の後 3 で計算しましょう。","x̄=19 is the mean score; n=10 is the number of people.":"x̄=19 が平均点、n=10 が人数です。","Two variables and regression":"2変数と回帰","Fit y=a+bx to study hours and scores.":"勉強時間と点数から回帰式 y=a+bx を求めます。","Press {menu}, 6, then choose 2:y=a+bx for paired data.":"{menu}、6 を押し、2変数のデータ用の 2:y=a+bx を選びましょう。","The table has x and y columns.":"表に x と y の列があります。","Enter study hours x: 1, 2, 3, 4, 5.":"勉強時間 x として 1, 2, 3, 4, 5 を入力しましょう。","Move to y with {right}, then press {up} five times to reach row 1.":"{right} で y に移り、{up} を5回押して1行目に移りましょう。","Enter scores y: 2, 4, 5, 4, 5.":"点数 y として 2, 4, 5, 4, 5 を入力しましょう。","Press {optn}, then 4:Regression Calc.":"{optn} の後 4:Regression Calc を選びましょう。","a=2.2 and b=0.6, so y=2.2+0.6x. r≈0.775 is the correlation; the closer to ±1, the straighter the data.":"a=2.2、b=0.6 なので回帰式は y=2.2+0.6x です。r≈0.775 は相関係数で、±1 に近いほどデータは直線に近くなります。","Predicting with ŷ":"ŷ で予測する","Predict the score ŷ for x=6.":"x=6 のときの予測点数 ŷ を求めます。","Last lesson's data is loaded. Press {ac} for the calculation screen; the data and fit stay.":"前回のデータが入っています。{ac} で計算画面に戻りましょう。データと回帰式は残ります。","Enter 6 and press {optn}.":"6 を入力して {optn} を押しましょう。","Go to the next page with {down} and choose 4:Regression.":"{down} で次のページに進み、4:Regression を選びましょう。","Press {down}, then 1 to insert ŷ.":"{down} の後 1 を押して ŷ を入れましょう。","The expression reads 6ŷ: \"y when x is 6\".":"式は 6ŷ になりました。「x が 6 のときの y」という意味です。","5.8 = 2.2+0.6×6. x̂ works the other way, from y to x.":"5.8 = 2.2+0.6×6 です。x̂ を使うと逆に y から x を求めます。","Distributions":"確率分布","Normal probability between two values":"2つの値の間の正規分布の確率","Heights average 170 cm with SD 6 cm: find P(165 ≤ X ≤ 180).":"身長の平均が 170 cm、標準偏差が 6 cm のとき、P(165 ≤ X ≤ 180) を求めます。","Open the Distribution app with {menu}, 7.":"{menu}、7 で Distribution アプリを開きましょう。","Choose a distribution.":"分布を選びます。","2:Normal CD gives the probability between two values. Press 2.":"2:Normal CD は2つの値の間の確率です。2 を押しましょう。","It asks for Lower, Upper, σ (standard deviation) and μ (mean).":"Lower、Upper、σ（標準偏差）、μ（平均）をたずねてきます。","Enter Lower 165 and Upper 180; each {eq} moves to the next line.":"Lower に 165、Upper に 180 を入力しましょう。{eq} を押すたびに次の行に移ります。","Enter σ=6 and μ=170.":"σ=6、μ=170 を入力しましょう。","With every value in, press {eq} to compute.":"すべて入力したら {eq} を押して計算しましょう。","P≈0.7499: about 75% are between 165 and 180 cm. No z-table needed.":"P≈0.7499、つまり約 75% が 165〜180 cm の間です。正規分布表は必要ありません。","Cut-off for the top few percent":"上位数%の境目","Find the height that marks the top 5%.":"上位 5% に入る身長の境目を求めます。","Press {menu}, 7, then 3:Inverse Normal.":"{menu}、7 の後 3:Inverse Normal を選びましょう。","It works backwards from an area to x.":"面積から逆に x を求めます。","Area is measured from the left. The top 5% starts where the lower 95% ends, so enter 0.95.":"Area は左端からの面積です。上位 5% は下から 95% のところから始まるので、0.95 を入力しましょう。","Enter σ=6, μ=170 and compute.":"σ=6、μ=170 を入力して計算しましょう。","About 179.87 cm: taller than that is the top 5%.":"約 179.87 cm です。これより高ければ上位 5% です。","Binomial distribution":"二項分布","Toss a coin 10 times: P(exactly 3 heads) and P(at most 3).":"コインを10回投げるとき、表がちょうど3回出る確率と3回以下の確率を求めます。","Press {menu}, 7, then 4:Binomial PD. PD means \"exactly x times\".":"{menu}、7 の後 4:Binomial PD を選びましょう。PD は「ちょうど x 回」の確率です。","List handles many x values at once; Variable handles one.":"List は複数の x を一度に、Variable は1つの x を計算します。","Choose 2:Variable.":"2:Variable を選びましょう。","Enter x=3 (heads), N=10 (tosses), p=0.5 (chance of heads).":"x=3（表の回数）、N=10（投げる回数）、p=0.5（表が出る確率）を入力しましょう。","0.1171875, about 11.7%.":"0.1171875、約 11.7% です。","\"At most 3\" is the cumulative Binomial CD. Press {optn} for the list, then 5 and 2.":"「3回以下」は累積の Binomial CD です。{optn} で一覧に戻り、5、2 を選びましょう。","Enter 3, 10, 0.5 again and compute.":"同じく 3, 10, 0.5 を入力して計算しましょう。","0.171875: the chances of 0, 1, 2 and 3 heads added together.":"0.171875 です。表が 0, 1, 2, 3 回出る確率を合計した値です。","Matrices":"行列","Entering a matrix and its determinant":"行列の入力と行列式","Enter A=[[2,1],[5,3]] and find its determinant.":"A=[[2,1],[5,3]] を入力し、行列式を求めます。","Open the Matrix app with {menu}, 4.":"{menu}、4 で Matrix アプリを開きましょう。","Choose which matrix to define: MatA to MatD.":"定義する行列を MatA〜MatD から選びます。","Choose 1:MatA, then 2 rows and 2 columns.":"1:MatA を選び、行数 2、列数 2 を押しましょう。","A 2×2 grid appears.":"2×2 のマス目が表示されます。","Enter 2, 1, 5, 3. Each {eq} moves right, then down to the next row.":"2, 1, 5, 3 を入力しましょう。{eq} を押すたびに右へ、行の終わりでは次の行へ移ります。","A=[[2,1],[5,3]].":"A=[[2,1],[5,3]] です。","Go to the calculation screen with {ac}.":"{ac} で計算画面に移りましょう。","The matrix stays stored.":"行列は記憶されたままです。","Press {optn}, go to the second page with {down}, choose 2:Determinant.":"{optn} を押し、{down} で2ページ目に進んで 2:Determinant を選びましょう。","Det( is entered.":"Det( が入りました。","Insert MatA with {optn} then 3, close the bracket and compute.":"{optn} の後 3 で MatA を入れ、かっこを閉じて計算しましょう。","det A = 2×3 − 1×5 = 1.":"det A = 2×3 − 1×5 = 1 です。","Inverse matrix":"逆行列","Find the inverse of A=[[2,1],[5,3]].":"A=[[2,1],[5,3]] の逆行列を求めます。","Matrix A is already defined. Press {ac} for the calculation screen.":"行列 A は定義済みです。{ac} で計算画面に移りましょう。","Insert MatA with {optn} then 3.":"{optn} の後 3 で MatA を入れましょう。","{inv} gives the inverse. Press it and compute.":"{inv} で逆行列になります。押して計算しましょう。","A⁻¹=[[3,−1],[−5,2]]; integers because det A = 1. With det 0 there is no inverse and you get Math ERROR.":"A⁻¹=[[3,−1],[−5,2]] です。det A = 1 なので整数になります。行列式が 0 だと逆行列はなく、Math ERROR になります。","Multiplying matrices":"行列のかけ算","Define B=[[1],[2]] and compute A×B.":"B=[[1],[2]] を定義して A×B を計算します。","A is defined. Now define B: {optn}, 1:Define Matrix, 2:MatB.":"A は定義済みです。次に B を定義します：{optn}、1:Define Matrix、2:MatB。","Choose 2 rows and 1 column.":"行数 2、列数 1 を選びましょう。","Enter 1 and 2.":"1 と 2 を入力しましょう。","Press {ac} and enter MatA×MatB: MatA is {optn} 3, MatB is {optn} 4.":"{ac} を押して MatA×MatB を入力しましょう。MatA は {optn} 3、MatB は {optn} 4 です。","MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). The first matrix's columns must match the second's rows.":"MatAns=[[4],[11]] です（2×1+1×2=4、5×1+3×2=11）。前の行列の列数と後の行列の行数が等しくないとかけられません。","Vectors":"ベクトル","Entering vectors and the dot product":"ベクトルの入力と内積","Find the dot product of A=(1,2,3) and B=(4,5,6).":"A=(1,2,3) と B=(4,5,6) の内積を求めます。","Open the Vector app with {menu}, 5.":"{menu}、5 で Vector アプリを開きましょう。","Choose 1:VctA and dimension 3.":"1:VctA を選び、次元 3 を押しましょう。","Enter 1, 2, 3.":"1, 2, 3 を入力しましょう。","Now define B: {optn}, 1:Define Vector, 2:VctB, dimension 3.":"次に B を定義します：{optn}、1:Define Vector、2:VctB、次元 3。","Enter 4, 5, 6.":"4, 5, 6 を入力しましょう。","Press {ac}, then insert VctA with {optn} 3.":"{ac} を押し、{optn} 3 で VctA を入れましょう。","The dot is on the second page of {optn}: 2:Dot Product.":"内積の記号は {optn} の2ページ目、2:Dot Product です。","Insert VctB with {optn} 4 and compute.":"{optn} 4 で VctB を入れて計算しましょう。","32 (1×4+2×5+3×6). A dot product of 0 means the vectors are perpendicular.":"32 です（1×4+2×5+3×6）。内積が 0 なら2つのベクトルは垂直です。","Cross product and angle":"外積となす角","Find the cross product of A and B and the angle between them.":"A と B の外積と、2つのベクトルのなす角を求めます。","A and B are defined. Press {ac} and enter VctA×VctB; {mul} between vectors is the cross product.":"A と B は定義済みです。{ac} を押して VctA×VctB を入力しましょう。ベクトルどうしの {mul} は外積です。","(−3, 6, −3), perpendicular to both A and B.":"(−3, 6, −3) で、A と B の両方に垂直です。","Press {ac}, then 3:Angle on the second page of {optn}.":"{ac} を押し、{optn} の2ページ目の 3:Angle を選びましょう。","Enter VctA, a comma, VctB, close the bracket and compute. The comma is SHIFT then {rp}.":"VctA、カンマ、VctB を入力し、かっこを閉じて計算しましょう。カンマは SHIFT の後 {rp} です。","About 12.93°. It follows the angle unit setting (D or R).":"約 12.93° です。角度の単位の設定（D または R）に従います。","Function tables":"関数の表","Making a table of values":"値の表を作る","Tabulate f(x)=x²−2x for x from −2 to 4.":"x が −2 から 4 までの f(x)=x²−2x の表を作ります。","Open the Table app with {menu}, 9.":"{menu}、9 で Table アプリを開きましょう。","Enter f(x)= here.":"ここで f(x)= を入力します。","Enter x²−2x and press {eq}.":"x²−2x を入力して {eq} を押しましょう。","It also asks for g(x)=. Leave it empty for a single function.":"g(x)= もたずねてきます。関数が1つだけなら空のままにします。","Leave g(x) empty and press {eq}.":"g(x) は空のまま {eq} を押しましょう。","Now set the range: Start, End and Step.":"次に範囲を決めます：Start、End、Step。","Enter Start −2, End 4, Step 1.":"Start −2、End 4、Step 1 を入力しましょう。","Press {eq} to build the table.":"{eq} を押して表を作りましょう。","f(x)=0 at x=0 and x=2, where the graph meets the x-axis; the minimum −1 is at x=1. Scroll with {up}{down}.":"x=0 と x=2 で f(x)=0 となり、グラフが x 軸と交わる点です。最小値 −1 は x=1 のときです。{up}{down} でスクロールしましょう。","Comparing two functions":"2つの関数を比べる","Find where 2ˣ and x² are equal.":"2ˣ と x² が等しくなるところを探します。","Open Table with {menu}, 9 and enter f(x)=2ˣ: use {pow} for the exponent and leave it with {right}.":"{menu}、9 で Table を開き、f(x)=2ˣ を入力しましょう。指数は {pow} で入れ、{right} で出ます。","This time also enter g(x)=x².":"今度は g(x)=x² も入力しましょう。","Use Start 1, End 5, Step 1 and build the table.":"Start 1、End 5、Step 1 にして表を作りましょう。","They match at x=2 and x=4 (4=4, 16=16). At x=3, x² is bigger; from x=5, 2ˣ pulls ahead.":"x=2 と x=4 で一致します（4=4、16=16）。x=3 では x² の方が大きく、x=5 からは 2ˣ が上回ります。","Number bases":"n進法","Decimal to hex and binary":"10進数を16進数と2進数に","Convert 255 to hexadecimal and binary.":"255 を16進数と2進数に変換します。","Open the Base-N app with {menu}, 3.":"{menu}、3 で Base-N アプリを開きましょう。","Dec at the bottom means decimal.":"下の Dec は10進数という意味です。","Enter 255 and press {eq}.":"255 を入力して {eq} を押しましょう。","Press {pow}, the key with blue HEX.":"青い文字 HEX のある {pow} を押しましょう。","FF. In Base-N the blue labels are what the keys do.":"FF です。Base-N では青い文字がキーの働きです。","Press {logb}, the key with blue BIN.":"青い文字 BIN のある {logb} を押しましょう。","11111111: the same value in another base. DEC ({sq}) gets 255 back.":"11111111 です。同じ値を別の進法で表しています。DEC（{sq}）で 255 に戻ります。","Hexadecimal arithmetic":"16進数の計算","Compute 1F + A in hexadecimal.":"16進数で 1F + A を計算します。","Press {menu}, 3, then {pow} (HEX).":"{menu}、3 の後 {pow}（HEX）を押しましょう。","The screen shows Hex.":"画面に Hex と表示されました。","A to F are the red-label keys, typed directly. 1F is 1 then {tan} (F).":"A〜F は赤い文字のキーでそのまま入力します。1F は 1 の後 {tan}（F）です。","Add A ({neg}) and compute.":"A（{neg}）を足して計算しましょう。","29, which is 31+10=41 in decimal.":"29 です。10進数では 31+10=41 です。","Binary logic operations":"2進数の論理演算","Compute 1100 and 1010.":"1100 and 1010 を計算します。","Press {menu}, 3, then {logb} (BIN).":"{menu}、3 の後 {logb}（BIN）を押しましょう。","Enter 1100.":"1100 を入力しましょう。","Choose 1:and from {optn}.":"{optn} から 1:and を選びましょう。","Enter 1010 and compute.":"1010 を入力して計算しましょう。","1000: only bits set in both stay 1. or, xor and Not are in the same menu.":"1000 です。両方で 1 のビットだけが 1 になります。or、xor、Not も同じメニューにあります。","Complex numbers":"複素数","Complex arithmetic":"複素数の計算","Compute (2+3i)(1−i).":"(2+3i)(1−i) を計算します。","Open the Complex app with {menu}, 2.":"{menu}、2 で Complex アプリを開きましょう。","Here the {eng} key types i (purple label).":"ここでは {eng} キーで i を入力します（紫の文字）。","Enter (2+3i).":"(2+3i) を入力しましょう。","Add (1−i) and compute.":"(1−i) を続けて入力し、計算しましょう。","5+i, since 2−2i+3i−3i² = 5+i with i²=−1.":"5+i です。i²=−1 なので 2−2i+3i−3i² = 5+i になります。","Modulus, conjugate and polar form":"絶対値・共役・極形式","Find |3+4i|, its conjugate, and 1+i in polar form.":"|3+4i| とその共役複素数、1+i の極形式を求めます。","The modulus is the absolute value: SHIFT then {lp} (Abs), enter 3+4i, leave with {right} and compute.":"複素数の大きさは絶対値です。SHIFT の後 {lp}（Abs）を押し、3+4i を入力して {right} で出てから計算しましょう。","5, which is √(3²+4²).":"5 です。√(3²+4²) と同じです。","The conjugate is 2:Conjugate in {optn}. Compute Conjg(3+4i).":"共役複素数は {optn} の 2:Conjugate です。Conjg(3+4i) を計算しましょう。","3−4i: only the sign of the imaginary part flips.":"3−4i です。虚部の符号だけが変わります。","Now enter 1+i, choose 5:▶r∠θ from {optn}, and compute.":"次は 1+i を入力し、{optn} から 5:▶r∠θ を選んで計算しましょう。","√2∠45: distance √2 from the origin at 45°. To always see polar form, set Complex to r∠θ in SETUP.":"√2∠45 です。原点からの距離が √2、角度が 45° という意味です。いつも極形式で表示するには、SETUP の Complex を r∠θ にします。","Inequalities and ratios":"不等式と比例式","Quadratic inequalities":"2次不等式","Solve x²−5x+6<0 and x²−5x+6>0.":"x²−5x+6<0 と x²−5x+6>0 を解きます。","Press {menu}. Inequality is the 11th app, chosen with the {dms} key (red B).":"{menu} を押しましょう。Inequality は11番目のアプリなので、{dms} キー（赤い B）で選びます。","It asks for the degree.":"次数をたずねてきます。","Press 2 for degree 2.":"2 を押して次数 2 にしましょう。","Four inequality forms appear.":"4種類の不等式の形が表示されます。","Choose 2:ax²+bx+c<0.":"2:ax²+bx+c<0 を選びましょう。","2<x<3: where the parabola is below the x-axis.":"2<x<3 です。放物線が x 軸より下にある範囲です。","Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.":"今度は不等号を逆にします。{ac} で表に戻り、{optn} で選び直します。2、次に 1:>0 を選びましょう。","Enter 1, −5, 6 again and solve.":"同じく 1, −5, 6 を入力して解きましょう。","x<2, 3<x: exactly the other side.":"x<2, 3<x です。ちょうど反対側の範囲です。","Proportions":"比例式","Find X in 3:4 = X:12.":"3:4 = X:12 の X を求めます。","Press {menu}, then the {inv} key (red C) for the 12th app, Ratio.":"{menu} の後、{inv} キー（赤い C）で12番目のアプリ Ratio を選びましょう。","Two forms, with X in different places.":"X の位置が違う2つの形があります。","Choose 1:A:B=X:D.":"1:A:B=X:D を選びましょう。","Enter A=3, B=4, D=12.":"A=3、B=4、D=12 を入力しましょう。","X=9, since 3×12=4×X. Handy for scaling recipes or map distances.":"X=9 です。3×12=4×X だからです。料理の分量や地図の距離の換算に便利です。","Spreadsheet":"スプレッドシート","Values and formulas":"値と数式","Enter prices and quantities, then the formula =A1×B1.":"単価と数量を入力し、数式 =A1×B1 を作ります。","Open the Spreadsheet app with {menu}, 8.":"{menu}、8 で Spreadsheet アプリを開きましょう。","Columns A–E, rows 1–45. The cursor is on A1.":"列は A〜E、行は 1〜45 です。カーソルは A1 にあります。","Enter prices 1200, 800, 1500 down column A; {eq} moves down.":"A列に単価 1200, 800, 1500 を入力しましょう。{eq} で下に移ります。","Move to column B with {right}, then {up} three times to B1.":"{right} で B列に移り、{up} を3回押して B1 に移りましょう。","Enter quantities 2, 5, 1.":"数量 2, 5, 1 を入力しましょう。","Go to C1 with {right} and {up} three times.":"{right} と {up} 3回で C1 に移りましょう。","Formulas start with = (ALPHA
