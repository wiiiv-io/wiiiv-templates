,"Basics":"Cơ bản","Arithmetic and order of operations":"Phép tính và thứ tự thực hiện","Compute 2+3×4 and 3×(2+5).":"Tính 2+3×4 và 3×(2+5).","Type 2+3×4. The expression appears just as you would write it.":"Nhập 2+3×4. Biểu thức hiện ra đúng như bạn viết.","Nothing is computed yet. You enter the whole expression first.":"Chưa có gì được tính. Bạn nhập toàn bộ biểu thức trước.","Press {eq} to compute.":"Bấm {eq} để tính.","The answer is 14: multiplication comes before addition (3×4=12, then 2+12).":"Kết quả là 14: nhân trước cộng sau (3×4=12, rồi 2+12).","{ac} clears the expression. Stored values and settings stay.":"{ac} xóa biểu thức. Các giá trị đã lưu và cài đặt vẫn giữ nguyên.","The screen is empty.":"Màn hình đã trống.","Use brackets to add first. Enter 3×(2+5) and compute.":"Dùng dấu ngoặc để cộng trước. Nhập 3×(2+5) rồi tính.","The answer is 21. The brackets were computed first.":"Kết quả là 21. Phần trong ngoặc được tính trước.","Fixing mistakes":"Sửa lỗi","Edit an expression with DEL and ◀.":"Sửa biểu thức bằng DEL và ◀.","Enter 2+5.":"Nhập 2+5.","Say the 5 was a mistake. {del} deletes the character before the cursor.":"Giả sử số 5 bị nhập nhầm. {del} xóa ký tự đứng trước con trỏ.","The 5 is gone.":"Số 5 đã bị xóa.","Enter 6 and compute.":"Nhập 6 rồi tính.","2+6=8.":"2+6=8.","You can still edit after computing. {left} brings the expression back with the cursor at the end.":"Bạn vẫn có thể sửa sau khi tính. {left} gọi lại biểu thức với con trỏ ở cuối.","You are editing the expression again.":"Bạn đang sửa lại biểu thức.","Delete the 6, enter 9 and compute again.":"Xóa số 6, nhập 9 rồi tính lại.","2+9=11. No need to retype long expressions.":"2+9=11. Không cần gõ lại các biểu thức dài.","Negative numbers":"Số âm","Learn the (−) key versus minus, and squaring negatives.":"Phân biệt phím (−) với dấu trừ, và bình phương số âm.","For a negative number use {neg}, not minus {sub}. Compute (−)3×4.":"Với số âm, dùng {neg} chứ không phải dấu trừ {sub}. Tính (−)3×4.","The result is −12.":"Kết quả là −12.","Now enter −3² as written. Squaring is {sq}.":"Giờ nhập −3² đúng như viết. Bình phương là {sq}.","You get −9: the square is taken first, then the sign, just like in maths.":"Bạn được −9: bình phương được tính trước, rồi mới đến dấu, giống như trong toán học.","For (−3)², wrap it in brackets.":"Với (−3)², hãy đặt trong dấu ngoặc.","The answer is 9.":"Kết quả là 9.","Fractions and decimals":"Phân số và số thập phân","Compute 2/3 + 1/4 as a fraction, then as a decimal.":"Tính 2/3 + 1/4 dưới dạng phân số, rồi dạng thập phân.","{frac} makes a fraction box with the cursor in the numerator. Enter 2.":"{frac} tạo ô phân số với con trỏ ở tử số. Nhập 2.","Go down to the denominator with {down} and enter 3.":"Xuống mẫu số bằng {down} và nhập 3.","Leave the fraction with {right}, then press +.":"Ra khỏi phân số bằng {right}, rồi bấm +.","Enter 1/4 the same way.":"Nhập 1/4 theo cách tương tự.","Compute.":"Tính.","You get the fraction 11/12. The calculator finds the common denominator and reduces.":"Bạn được phân số 11/12. Máy tính tự tìm mẫu số chung và rút gọn.","{sd} switches between fraction and decimal.":"{sd} chuyển đổi giữa phân số và số thập phân.","0.9166666667. Press it again to get the fraction back.":"0.9166666667. Bấm lần nữa để quay lại phân số.","Roots and powers":"Căn và lũy thừa","Compute √8, 2¹⁰ and ∛27, and learn SHIFT.":"Tính √8, 2¹⁰ và ∛27, và làm quen với SHIFT.","Press {sqrt}, enter 8 and compute.":"Bấm {sqrt}, nhập 8 rồi tính.","You get 2√2, the exact form. Press S⇔D if you want the decimal.":"Bạn được 2√2, dạng chính xác. Bấm S⇔D nếu muốn dạng thập phân.","Powers use {pow}. Enter 2, press it to get the exponent box, then enter 10.":"Lũy thừa dùng {pow}. Nhập 2, bấm phím này để mở ô số mũ, rồi nhập 10.","Leave the exponent with {right} and compute.":"Ra khỏi số mũ bằng {right} rồi tính.","2¹⁰ = 1024.":"2¹⁰ = 1024.","Yellow labels above the keys need {shift} first. SHIFT then {sqrt} gives ∛. Compute ∛27.":"Các nhãn vàng phía trên phím cần bấm {shift} trước. SHIFT rồi {sqrt} cho ∛. Tính ∛27.","The answer is 3. An S lights up on screen while SHIFT is active.":"Kết quả là 3. Chữ S sáng trên màn hình khi SHIFT đang bật.","Trigonometry and angle units":"Lượng giác và đơn vị góc","Compute sin 30° and sin⁻¹(0.5).":"Tính sin 30° và sin⁻¹(0.5).","The D at the top means degrees. {sin} enters sin(. Compute sin(30).":"Chữ D ở trên cùng nghĩa là độ. {sin} nhập sin(. Tính sin(30).","The result is 1/2.":"Kết quả là 1/2.","Inverse functions use SHIFT. Compute sin⁻¹(0.5).":"Hàm ngược dùng SHIFT. Tính sin⁻¹(0.5).","30: the angle whose sine is 0.5. To switch to radians use SHIFT, MENU (SETUP), then 2:Angle Unit.":"30: góc có sin bằng 0.5. Để chuyển sang radian, dùng SHIFT, MENU (SETUP), rồi 2:Angle Unit.","Logarithms":"Logarit","Compute log₂8, log 100 and ln e.":"Tính log₂8, log 100 và ln e.","{logb} is a log with a chosen base. Enter base 2, move with {right}, enter 8 and compute.":"{logb} là logarit với cơ số tùy chọn. Nhập cơ số 2, di chuyển bằng {right}, nhập 8 rồi tính.","log₂8 = 3.":"log₂8 = 3.","The common log (base 10) is SHIFT and {neg}. Compute log(100).":"Logarit thập phân (cơ số 10) là SHIFT và {neg}. Tính log(100).","The result is 2.":"Kết quả là 2.","The natural log is {ln}. Enter e with {alpha} then {exp}. Compute ln(e).":"Logarit tự nhiên là {ln}. Nhập e bằng {alpha} rồi {exp}. Tính ln(e).","The result is 1. Red labels need ALPHA first.":"Kết quả là 1. Các nhãn đỏ cần bấm ALPHA trước.","Ans and variables":"Ans và biến","Reuse the last answer and store a value in A.":"Dùng lại kết quả vừa tính và lưu một giá trị vào A.","Compute 12×3.":"Tính 12×3.","The result is 36.":"Kết quả là 36.","With a result showing, pressing {div} starts with Ans, the last answer. Continue with ÷4.":"Khi đang hiện kết quả, bấm {div} sẽ bắt đầu bằng Ans, kết quả vừa tính. Tiếp tục với ÷4.","Ans÷4 = 9.":"Ans÷4 = 9.","To keep a value, store it in a variable. Enter 7, press {sto}, then {neg} (its red label is A).":"Để giữ một giá trị, hãy lưu vào biến. Nhập 7, bấm {sto}, rồi {neg} (nhãn đỏ của nó là A).","7 is stored in A.":"7 đã được lưu vào A.","Recall A with ALPHA and {neg}, and compute A×2.":"Gọi A bằng ALPHA và {neg}, rồi tính A×2.","14. A variable keeps its value until you store a new one.":"14. Biến giữ nguyên giá trị cho đến khi bạn lưu giá trị mới.","Scientific notation ×10ˣ":"Ký hiệu khoa học ×10ˣ","Compute 3×10⁸ × 2.":"Tính 3×10⁸ × 2.","Enter 3×10⁸ with {exp}: type 3, press it to get the exponent box, then enter 8.":"Nhập 3×10⁸ bằng {exp}: gõ 3, bấm phím này để mở ô số mũ, rồi nhập 8.","Leave the exponent with {right}, then compute ×2.":"Ra khỏi số mũ bằng {right}, rồi tính ×2.","600000000. Without leaving the exponent, ×2 would go into the exponent and give a very different number.":"600000000. Nếu không ra khỏi số mũ, ×2 sẽ nằm trong số mũ và cho ra một số rất khác.","Equations":"Phương trình","Substituting values with CALC":"Thay giá trị bằng CALC","Evaluate x²+3x at x=2 and x=5.":"Tính giá trị x²+3x tại x=2 và x=5.","Enter x²+3x. x is the {x} key, squaring is {sq}.":"Nhập x²+3x. x là phím {x}, bình phương là {sq}.","{calc} evaluates the expression for a value you give. Press it.":"{calc} tính giá trị biểu thức với giá trị bạn nhập. Bấm phím này.","It asks for x.":"Máy hỏi giá trị x.","Enter 2 and press {eq}.":"Nhập 2 và bấm {eq}.","At x=2 the value is 10 (4+6).":"Tại x=2 giá trị là 10 (4+6).","Press {calc} again to try another value. Enter 5 and compute.":"Bấm {calc} lần nữa để thử giá trị khác. Nhập 5 rồi tính.","At x=5 it is 40. Handy for filling in a table without retyping.":"Tại x=5 giá trị là 40. Rất tiện để điền bảng mà không phải gõ lại.","Solving with SOLVE":"Giải bằng SOLVE","Solve 2x+3=11 with SOLVE.":"Giải 2x+3=11 bằng SOLVE.","SOLVE works on any equation typed on the calculation screen. Enter 2x+3.":"SOLVE giải được mọi phương trình gõ trên màn hình tính toán. Nhập 2x+3.","The equals sign of an equation is {alpha} then {calc} (red =). Add =11.":"Dấu bằng của phương trình là {alpha} rồi {calc} (dấu = đỏ). Thêm =11.","Now it reads 2x+3=11. This equals sign is part of the equation, not the compute key.":"Giờ màn hình hiện 2x+3=11. Dấu bằng này là một phần của phương trình, không phải phím tính.","Press {shift} then {calc} (SOLVE).":"Bấm {shift} rồi {calc} (SOLVE).","It asks for a starting value of x; the search starts from the value x holds now.":"Máy hỏi giá trị ban đầu của x; việc tìm nghiệm bắt đầu từ giá trị x đang có.","Press {eq} to solve.":"Bấm {eq} để giải.","x=4. L−R=0 underneath means left side minus right side is 0: the solution is exact.":"x=4. L−R=0 bên dưới nghĩa là vế trái trừ vế phải bằng 0: nghiệm chính xác.","Choosing a starting value":"Chọn giá trị ban đầu","Find the negative root of x²=2.":"Tìm nghiệm âm của x²=2.","Enter x²=2. The equals sign is ALPHA and {calc}.":"Nhập x²=2. Dấu bằng là ALPHA và {calc}.","Open SOLVE with SHIFT and {calc}.":"Mở SOLVE bằng SHIFT và {calc}.","With two roots (±√2), SOLVE finds the one near the starting value. Enter −1 as the start and press {eq}.":"Khi có hai nghiệm (±√2), SOLVE tìm nghiệm gần giá trị ban đầu. Nhập −1 làm giá trị ban đầu rồi bấm {eq}.","The starting value is now −1.":"Giá trị ban đầu giờ là −1.","x=−1.414213562 (−√2). Start from 1 and you get +√2. For several roots, try different starting values.":"x=−1.414213562 (−√2). Bắt đầu từ 1 thì được +√2. Với nhiều nghiệm, hãy thử các giá trị ban đầu khác nhau.","Simultaneous equations":"Hệ phương trình","Solve 2x+3y=8 and x−y=−1.":"Giải 2x+3y=8 và x−y=−1.","Press {menu}. Equation/Func is the 10th app, so choose it with the {neg} key (red A).":"Bấm {menu}. Equation/Func là ứng dụng thứ 10, nên chọn bằng phím {neg} (A đỏ).","Now choose the kind of equation.":"Giờ chọn loại phương trình.","Choose 1:Simul Equation, then 2 unknowns.":"Chọn 1:Simul Equation, rồi 2 ẩn.","A coefficient table for ax+by=c appears.":"Bảng hệ số cho ax+by=c hiện ra.","Enter 2, 3, 8 for 2x+3y=8. Each {eq} moves one cell right.":"Nhập 2, 3, 8 cho 2x+3y=8. Mỗi lần {eq} chuyển sang ô bên phải.","At the end of a row it moves to the next one.":"Cuối hàng thì chuyển xuống hàng tiếp theo.","For x−y=−1 the coefficients are 1, −1, −1. Use {neg} for negatives.":"Với x−y=−1, các hệ số là 1, −1, −1. Dùng {neg} cho số âm.","All coefficients are in.":"Đã nhập đủ hệ số.","When no cell is being edited, {eq} solves.":"Khi không có ô nào đang sửa, {eq} sẽ giải.","x=1.":"x=1.","Press {eq} again for the next unknown.":"Bấm {eq} lần nữa để xem ẩn tiếp theo.","y=2. Check: 2+6=8 and 1−2=−1.":"y=2. Kiểm tra: 2+6=8 và 1−2=−1.","Quadratics and the vertex":"Phương trình bậc hai và đỉnh","Solve x²−5x+6=0 and find the vertex of the parabola.":"Giải x²−5x+6=0 và tìm đỉnh của parabol.","Press {menu}, {neg}, then 2:Polynomial and degree 2.":"Bấm {menu}, {neg}, rồi 2:Polynomial và bậc 2.","This is the table for ax²+bx+c=0.":"Đây là bảng cho ax²+bx+c=0.","Enter the coefficients 1, −5, 6.":"Nhập các hệ số 1, −5, 6.","x₁=3.":"x₁=3.","Press {eq} for the other root.":"Bấm {eq} để xem nghiệm còn lại.","x₂=2.":"x₂=2.","Press {eq} twice more for the vertex of y=x²−5x+6.":"Bấm {eq} thêm hai lần để xem đỉnh của y=x²−5x+6.","The vertex is x=2.5, y=−0.25, the minimum: useful for sketching the graph.":"Đỉnh là x=2.5, y=−0.25, điểm cực tiểu: hữu ích khi phác họa đồ thị.","When there are no real roots":"Khi không có nghiệm thực","See the complex roots of x²+2x+5=0.":"Xem nghiệm phức của x²+2x+5=0.","Open the quadratic table with {menu}, {neg}, 2, 2.":"Mở bảng phương trình bậc hai bằng {menu}, {neg}, 2, 2.","Enter the coefficients 1, 2, 5.":"Nhập các hệ số 1, 2, 5.","x₁=−1+2i. The discriminant b²−4ac=−16 is negative, so the roots are complex.":"x₁=−1+2i. Biệt thức b²−4ac=−16 âm nên các nghiệm là số phức.","x₂=−1−2i. To see just \"no real roots\" instead, set Equation/Func to Off in SETUP.":"x₂=−1−2i. Nếu chỉ muốn thấy “không có nghiệm thực”, hãy đặt Equation/Func thành Off trong SETUP.","Calculus and sums":"Giải tích và tổng","Definite integrals":"Tích phân xác định","Compute ∫₀² x² dx.":"Tính ∫₀² x² dx.","{int} makes an integral box with the cursor in the integrand. Enter x².":"{int} tạo ô tích phân với con trỏ ở biểu thức dưới dấu tích phân. Nhập x².","Move with {right} to the lower limit and enter 0, then {right} again to the upper limit and enter 2.":"Di chuyển bằng {right} đến cận dưới và nhập 0, rồi {right} lần nữa đến cận trên và nhập 2.","8/3 (about 2.667): by hand, x³/3 evaluated from 0 to 2.":"8/3 (khoảng 2.667): tính tay là x³/3 lấy từ 0 đến 2.","Integrating trig functions in radians":"Tích phân hàm lượng giác theo radian","Compute ∫₀^π sin x dx.":"Tính ∫₀^π sin x dx.","Calculus with trig functions uses radians. Press {shift}, {menu} (SETUP), then 2:Angle Unit.":"Giải tích với hàm lượng giác dùng radian. Bấm {shift}, {menu} (SETUP), rồi 2:Angle Unit.","Choose 2:Radian.":"Chọn 2:Radian.","The indicator at the top changed from D to R.":"Ký hiệu trên cùng đã đổi từ D sang R.","Press {int} and enter sin(x).":"Bấm {int} và nhập sin(x).","Enter 0 and π as the limits and compute. π is SHIFT then {exp}.":"Nhập 0 và π làm cận rồi tính. π là SHIFT rồi {exp}.","2. In degree mode the angle would be read in degrees and the answer would be wrong.":"2. Ở chế độ độ, góc sẽ được hiểu theo độ và kết quả sẽ sai.","Derivatives at a point":"Đạo hàm tại một điểm","Find the derivative of x³ at x=2.":"Tìm đạo hàm của x³ tại x=2.","SHIFT then {int} gives the derivative. Enter x³ (SHIFT then {sq}).":"SHIFT rồi {int} cho đạo hàm. Nhập x³ (SHIFT rồi {sq}).","Move with {right} to x=, enter 2 and compute.":"Di chuyển bằng {right} đến x=, nhập 2 rồi tính.","12. The derivative of x³ is 3x², which is 12 at x=2.":"12. Đạo hàm của x³ là 3x², tại x=2 bằng 12.","Sums with Σ":"Tổng với Σ","Sum 1 to 10, then the squares.":"Tính tổng từ 1 đến 10, rồi tổng các bình phương.","SHIFT then {x} gives Σ. Enter x as the term.":"SHIFT rồi {x} cho Σ. Nhập x làm số hạng.","Move with {right} to enter the start 1, then {right} again for the end 10, and compute.":"Di chuyển bằng {right} để nhập giá trị đầu 1, rồi {right} lần nữa cho giá trị cuối 10, rồi tính.","1+2+…+10 = 55.":"1+2+…+10 = 55.","Change only the term to get other sums. Sum x² over the same range.":"Chỉ cần đổi số hạng để được tổng khác. Tính tổng x² trên cùng khoảng.","1²+2²+…+10² = 385. Check it with n(n+1)(2n+1)/6.":"1²+2²+…+10² = 385. Kiểm tra bằng n(n+1)(2n+1)/6.","Statistics":"Thống kê","Enter data and find the mean":"Nhập dữ liệu và tìm trung bình","Find the mean of 4, 7, 9, 6, 4.":"Tìm trung bình của 4, 7, 9, 6, 4.","{menu} opens the app list.":"{menu} mở danh sách ứng dụng.","There are 12 apps.":"Có 12 ứng dụng.","Press 6 to open Statistics.":"Bấm 6 để mở Statistics.","Now choose the kind of statistics.":"Giờ chọn loại thống kê.","1:1-Variable is for a single list of data. Press 1.":"1:1-Variable dùng cho một dãy dữ liệu. Bấm 1.","The data table is open.":"Bảng dữ liệu đã mở.","Enter the first value 4 and press {eq}.":"Nhập giá trị đầu tiên 4 và bấm {eq}.","4 is in row 1 and the cursor moved down.":"4 nằm ở hàng 1 và con trỏ đã xuống dưới.","Enter 7, 9, 6 and 4 the same way.":"Nhập 7, 9, 6 và 4 theo cách tương tự.","All 5 values are in.":"Đã nhập đủ 5 giá trị.","{optn} opens the statistics menu.":"{optn} mở menu thống kê.","3:1-Variable Calc shows the results.":"3:1-Variable Calc hiện kết quả.","Press 3.":"Bấm 3.","x̄=6 is the mean and Σx=30 the sum. The next lesson reads the rest of the list.":"x̄=6 là trung bình và Σx=30 là tổng. Bài tiếp theo sẽ đọc phần còn lại của danh sách.","Reading the results":"Đọc kết quả","Find both standard deviations, the median and quartiles.":"Tìm cả hai độ lệch chuẩn, trung vị và các tứ phân vị.","Results for 4, 7, 9, 6, 4 are showing, 4 lines at a time. Press {down} four times.":"Kết quả của 4, 7, 9, 6, 4 đang hiện, mỗi lần 4 dòng. Bấm {down} bốn lần.","σx is the population standard deviation (divide by n); sx is the sample one (divide by n−1). Check which one a question asks for.":"σx là độ lệch chuẩn tổng thể (chia cho n); sx là độ lệch chuẩn mẫu (chia cho n−1). Hãy xem đề bài hỏi loại nào.","Go down four more times.":"Xuống thêm bốn lần nữa.","Med=6 is the median; Q1=4 and Q3=8 are the quartiles.":"Med=6 là trung vị; Q1=4 và Q3=8 là các tứ phân vị.","Press {ac} to go back to the data table.":"Bấm {ac} để quay lại bảng dữ liệu.","The data is still there, ready to edit and recompute.":"Dữ liệu vẫn còn đó, sẵn sàng để sửa và tính lại.","Editing and deleting data":"Sửa và xóa dữ liệu","Change one value, delete another and recompute.":"Đổi một giá trị, xóa một giá trị khác rồi tính lại.","The table holds 4, 7, 9, 6, 4 and the cursor is on empty row 6. Press {up} twice to reach the 6 in row 4.":"Bảng chứa 4, 7, 9, 6, 4 và con trỏ ở hàng trống số 6. Bấm {up} hai lần để đến số 6 ở hàng 4.","Row 4 is highlighted.":"Hàng 4 được tô sáng.","Enter 8 and press {eq} to replace 6 with 8.":"Nhập 8 và bấm {eq} để thay 6 bằng 8.","Done. The cursor moved to row 5.":"Xong. Con trỏ đã chuyển xuống hàng 5.","{del} deletes the whole row under the cursor. Delete the 4 in row 5.":"{del} xóa cả hàng tại con trỏ. Xóa số 4 ở hàng 5.","The data is now 4, 7, 9, 8.":"Dữ liệu giờ là 4, 7, 9, 8.","Recompute with {optn} then 3.":"Tính lại bằng {optn} rồi 3.","x̄=7 and n=4. Results follow the edited data.":"x̄=7 và n=4. Kết quả theo dữ liệu đã sửa.","Using frequencies":"Dùng tần số","Mean of 3 people scoring 10, 5 scoring 20, 2 scoring 30.":"Trung bình khi 3 người được 10 điểm, 5 người được 20, 2 người được 30.","Repeated values are quicker with a Freq column. Open the setup first: {shift} then {menu} (SETUP).":"Giá trị lặp lại nhập nhanh hơn với cột Freq. Trước tiên mở cài đặt: {shift} rồi {menu} (SETUP).","This is the setup list.":"Đây là danh sách cài đặt.","Go to the next page with {down} and pick 3:Statistics.":"Sang trang tiếp bằng {down} và chọn 3:Statistics.","It asks whether to show the frequency column.":"Máy hỏi có hiện cột tần số không.","Choose 1:On.":"Chọn 1:On.","The Freq column is on.":"Cột Freq đã bật.","Open the 1-Variable table with {menu}, 6, 1.":"Mở bảng 1-Variable bằng {menu}, 6, 1.","A Freq column now sits next to x.":"Giờ cột Freq nằm cạnh x.","Enter the scores 10, 20, 30.":"Nhập các điểm 10, 20, 30.","Each Freq starts at 1.":"Mỗi Freq bắt đầu bằng 1.","Move to Freq with {right}, then up three times with {up} to row 1.":"Sang Freq bằng {right}, rồi lên ba lần bằng {up} đến hàng 1.","Enter the counts 3, 5, 2.":"Nhập số người 3, 5, 2.","3 people scored 10, 5 scored 20, 2 scored 30.":"3 người được 10 điểm, 5 người được 20, 2 người được 30.","Compute with {optn} then 3.":"Tính bằng {optn} rồi 3.","x̄=19 is the mean score; n=10 is the number of people.":"x̄=19 là điểm trung bình; n=10 là số người.","Two variables and regression":"Hai biến và hồi quy","Fit y=a+bx to study hours and scores.":"Khớp y=a+bx với số giờ học và điểm số.","Press {menu}, 6, then choose 2:y=a+bx for paired data.":"Bấm {menu}, 6, rồi chọn 2:y=a+bx cho dữ liệu theo cặp.","The table has x and y columns.":"Bảng có cột x và y.","Enter study hours x: 1, 2, 3, 4, 5.":"Nhập số giờ học x: 1, 2, 3, 4, 5.","Move to y with {right}, then press {up} five times to reach row 1.":"Sang y bằng {right}, rồi bấm {up} năm lần để đến hàng 1.","Enter scores y: 2, 4, 5, 4, 5.":"Nhập điểm y: 2, 4, 5, 4, 5.","Press {optn}, then 4:Regression Calc.":"Bấm {optn}, rồi 4:Regression Calc.","a=2.2 and b=0.6, so y=2.2+0.6x. r≈0.775 is the correlation; the closer to ±1, the straighter the data.":"a=2.2 và b=0.6, nên y=2.2+0.6x. r≈0.775 là hệ số tương quan; càng gần ±1, dữ liệu càng thẳng hàng.","Predicting with ŷ":"Dự đoán bằng ŷ","Predict the score ŷ for x=6.":"Dự đoán điểm ŷ khi x=6.","Last lesson's data is loaded. Press {ac} for the calculation screen; the data and fit stay.":"Dữ liệu của bài trước đã được nạp. Bấm {ac} để về màn hình tính toán; dữ liệu và đường hồi quy vẫn giữ.","Enter 6 and press {optn}.":"Nhập 6 và bấm {optn}.","Go to the next page with {down} and choose 4:Regression.":"Sang trang tiếp bằng {down} và chọn 4:Regression.","Press {down}, then 1 to insert ŷ.":"Bấm {down}, rồi 1 để chèn ŷ.","The expression reads 6ŷ: \"y when x is 6\".":"Biểu thức hiện 6ŷ: “y khi x bằng 6”.","5.8 = 2.2+0.6×6. x̂ works the other way, from y to x.":"5.8 = 2.2+0.6×6. x̂ làm theo chiều ngược lại, từ y ra x.","Distributions":"Phân phối","Normal probability between two values":"Xác suất chuẩn giữa hai giá trị","Heights average 170 cm with SD 6 cm: find P(165 ≤ X ≤ 180).":"Chiều cao trung bình 170 cm, độ lệch chuẩn 6 cm: tìm P(165 ≤ X ≤ 180).","Open the Distribution app with {menu}, 7.":"Mở ứng dụng Distribution bằng {menu}, 7.","Choose a distribution.":"Chọn một phân phối.","2:Normal CD gives the probability between two values. Press 2.":"2:Normal CD cho xác suất giữa hai giá trị. Bấm 2.","It asks for Lower, Upper, σ (standard deviation) and μ (mean).":"Máy hỏi Lower, Upper, σ (độ lệch chuẩn) và μ (trung bình).","Enter Lower 165 and Upper 180; each {eq} moves to the next line.":"Nhập Lower 165 và Upper 180; mỗi lần {eq} chuyển sang dòng tiếp.","Enter σ=6 and μ=170.":"Nhập σ=6 và μ=170.","With every value in, press {eq} to compute.":"Khi đã nhập đủ mọi giá trị, bấm {eq} để tính.","P≈0.7499: about 75% are between 165 and 180 cm. No z-table needed.":"P≈0.7499: khoảng 75% có chiều cao từ 165 đến 180 cm. Không cần bảng z.","Cut-off for the top few percent":"Ngưỡng cho nhóm vài phần trăm cao nhất","Find the height that marks the top 5%.":"Tìm chiều cao đánh dấu 5% cao nhất.","Press {menu}, 7, then 3:Inverse Normal.":"Bấm {menu}, 7, rồi 3:Inverse Normal.","It works backwards from an area to x.":"Phép này tính ngược từ diện tích ra x.","Area is measured from the left. The top 5% starts where the lower 95% ends, so enter 0.95.":"Area được tính từ bên trái. 5% cao nhất bắt đầu nơi 95% thấp hơn kết thúc, nên nhập 0.95.","Enter σ=6, μ=170 and compute.":"Nhập σ=6, μ=170 rồi tính.","About 179.87 cm: taller than that is the top 5%.":"Khoảng 179.87 cm: cao hơn mức đó là thuộc 5% cao nhất.","Binomial distribution":"Phân phối nhị thức","Toss a coin 10 times: P(exactly 3 heads) and P(at most 3).":"Tung đồng xu 10 lần: P(đúng 3 lần ngửa) và P(nhiều nhất 3 lần).","Press {menu}, 7, then 4:Binomial PD. PD means \"exactly x times\".":"Bấm {menu}, 7, rồi 4:Binomial PD. PD nghĩa là “đúng x lần”.","List handles many x values at once; Variable handles one.":"List xử lý nhiều giá trị x cùng lúc; Variable xử lý một giá trị.","Choose 2:Variable.":"Chọn 2:Variable.","Enter x=3 (heads), N=10 (tosses), p=0.5 (chance of heads).":"Nhập x=3 (số lần ngửa), N=10 (số lần tung), p=0.5 (xác suất ngửa).","0.1171875, about 11.7%.":"0.1171875, khoảng 11.7%.","\"At most 3\" is the cumulative Binomial CD. Press {optn} for the list, then 5 and 2.":"“Nhiều nhất 3” là Binomial CD tích lũy. Bấm {optn} để mở danh sách, rồi 5 và 2.","Enter 3, 10, 0.5 again and compute.":"Nhập lại 3, 10, 0.5 rồi tính.","0.171875: the chances of 0, 1, 2 and 3 heads added together.":"0.171875: xác suất được 0, 1, 2 và 3 lần ngửa cộng lại.","Matrices":"Ma trận","Entering a matrix and its determinant":"Nhập ma trận và định thức","Enter A=[[2,1],[5,3]] and find its determinant.":"Nhập A=[[2,1],[5,3]] và tìm định thức của nó.","Open the Matrix app with {menu}, 4.":"Mở ứng dụng Matrix bằng {menu}, 4.","Choose which matrix to define: MatA to MatD.":"Chọn ma trận cần định nghĩa: từ MatA đến MatD.","Choose 1:MatA, then 2 rows and 2 columns.":"Chọn 1:MatA, rồi 2 hàng và 2 cột.","A 2×2 grid appears.":"Một lưới 2×2 hiện ra.","Enter 2, 1, 5, 3. Each {eq} moves right, then down to the next row.":"Nhập 2, 1, 5, 3. Mỗi lần {eq} sang phải, rồi xuống hàng tiếp theo.","A=[[2,1],[5,3]].":"A=[[2,1],[5,3]].","Go to the calculation screen with {ac}.":"Về màn hình tính toán bằng {ac}.","The matrix stays stored.":"Ma trận vẫn được lưu.","Press {optn}, go to the second page with {down}, choose 2:Determinant.":"Bấm {optn}, sang trang thứ hai bằng {down}, chọn 2:Determinant.","Det( is entered.":"Det( đã được nhập.","Insert MatA with {optn} then 3, close the bracket and compute.":"Chèn MatA bằng {optn} rồi 3, đóng ngoặc rồi tính.","det A = 2×3 − 1×5 = 1.":"det A = 2×3 − 1×5 = 1.","Inverse matrix":"Ma trận nghịch đảo","Find the inverse of A=[[2,1],[5,3]].":"Tìm ma trận nghịch đảo của A=[[2,1],[5,3]].","Matrix A is already defined. Press {ac} for the calculation screen.":"Ma trận A đã được định nghĩa. Bấm {ac} để về màn hình tính toán.","Insert MatA with {optn} then 3.":"Chèn MatA bằng {optn} rồi 3.","{inv} gives the inverse. Press it and compute.":"{inv} cho ma trận nghịch đảo. Bấm phím này rồi tính.","A⁻¹=[[3,−1],[−5,2]]; integers because det A = 1. With det 0 there is no inverse and you get Math ERROR.":"A⁻¹=[[3,−1],[−5,2]]; toàn số nguyên vì det A = 1. Nếu det bằng 0 thì không có nghịch đảo và bạn nhận Math ERROR.","Multiplying matrices":"Nhân ma trận","Define B=[[1],[2]] and compute A×B.":"Định nghĩa B=[[1],[2]] và tính A×B.","A is defined. Now define B: {optn}, 1:Define Matrix, 2:MatB.":"A đã được định nghĩa. Giờ định nghĩa B: {optn}, 1:Define Matrix, 2:MatB.","Choose 2 rows and 1 column.":"Chọn 2 hàng và 1 cột.","Enter 1 and 2.":"Nhập 1 và 2.","Press {ac} and enter MatA×MatB: MatA is {optn} 3, MatB is {optn} 4.":"Bấm {ac} và nhập MatA×MatB: MatA là {optn} 3, MatB là {optn} 4.","MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). The first matrix's columns must match the second's rows.":"MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). Số cột của ma trận thứ nhất phải bằng số hàng của ma trận thứ hai.","Vectors":"Vectơ","Entering vectors and the dot product":"Nhập vectơ và tích vô hướng","Find the dot product of A=(1,2,3) and B=(4,5,6).":"Tìm tích vô hướng của A=(1,2,3) và B=(4,5,6).","Open the Vector app with {menu}, 5.":"Mở ứng dụng Vector bằng {menu}, 5.","Choose 1:VctA and dimension 3.":"Chọn 1:VctA và số chiều 3.","Enter 1, 2, 3.":"Nhập 1, 2, 3.","Now define B: {optn}, 1:Define Vector, 2:VctB, dimension 3.":"Giờ định nghĩa B: {optn}, 1:Define Vector, 2:VctB, số chiều 3.","Enter 4, 5, 6.":"Nhập 4, 5, 6.","Press {ac}, then insert VctA with {optn} 3.":"Bấm {ac}, rồi chèn VctA bằng {optn} 3.","The dot is on the second page of {optn}: 2:Dot Product.":"Tích vô hướng nằm ở trang thứ hai của {optn}: 2:Dot Product.","Insert VctB with {optn} 4 and compute.":"Chèn VctB bằng {optn} 4 rồi tính.","32 (1×4+2×5+3×6). A dot product of 0 means the vectors are perpendicular.":"32 (1×4+2×5+3×6). Tích vô hướng bằng 0 nghĩa là hai vectơ vuông góc.","Cross product and angle":"Tích có hướng và góc","Find the cross product of A and B and the angle between them.":"Tìm tích có hướng của A và B và góc giữa chúng.","A and B are defined. Press {ac} and enter VctA×VctB; {mul} between vectors is the cross product.":"A và B đã được định nghĩa. Bấm {ac} và nhập VctA×VctB; {mul} giữa hai vectơ là tích có hướng.","(−3, 6, −3), perpendicular to both A and B.":"(−3, 6, −3), vuông góc với cả A và B.","Press {ac}, then 3:Angle on the second page of {optn}.":"Bấm {ac}, rồi 3:Angle ở trang thứ hai của {optn}.","Enter VctA, a comma, VctB, close the bracket and compute. The comma is SHIFT then {rp}.":"Nhập VctA, dấu phẩy, VctB, đóng ngoặc rồi tính. Dấu phẩy là SHIFT rồi {rp}.","About 12.93°. It follows the angle unit setting (D or R).":"Khoảng 12.93°. Kết quả theo cài đặt đơn vị góc (D hoặc R).","Function tables":"Bảng giá trị hàm số","Making a table of values":"Lập bảng giá trị","Tabulate f(x)=x²−2x for x from −2 to 4.":"Lập bảng f(x)=x²−2x với x từ −2 đến 4.","Open the Table app with {menu}, 9.":"Mở ứng dụng Table bằng {menu}, 9.","Enter f(x)= here.":"Nhập f(x)= tại đây.","Enter x²−2x and press {eq}.":"Nhập x²−2x và bấm {eq}.","It also asks for g(x)=. Leave it empty for a single function.":"Máy cũng hỏi g(x)=. Để trống nếu chỉ dùng một hàm.","Leave g(x) empty and press {eq}.":"Để trống g(x) và bấm {eq}.","Now set the range: Start, End and Step.":"Giờ đặt khoảng: Start, End và Step.","Enter Start −2, End 4, Step 1.":"Nhập Start −2, End 4, Step 1.","Press {eq} to build the table.":"Bấm {eq} để lập bảng.","f(x)=0 at x=0 and x=2, where the graph meets the x-axis; the minimum −1 is at x=1. Scroll with {up}{down}.":"f(x)=0 tại x=0 và x=2, nơi đồ thị cắt trục x; giá trị nhỏ nhất −1 tại x=1. Cuộn bằng {up}{down}.","Comparing two functions":"So sánh hai hàm số","Find where 2ˣ and x² are equal.":"Tìm nơi 2ˣ và x² bằng nhau.","Open Table with {menu}, 9 and enter f(x)=2ˣ: use {pow} for the exponent and leave it with {right}.":"Mở Table bằng {menu}, 9 và nhập f(x)=2ˣ: dùng {pow} cho số mũ và ra khỏi số mũ bằng {right}.","This time also enter g(x)=x².":"Lần này nhập thêm g(x)=x².","Use Start 1, End 5, Step 1 and build the table.":"Dùng Start 1, End 5, Step 1 rồi lập bảng.","They match at x=2 and x=4 (4=4, 16=16). At x=3, x² is bigger; from x=5, 2ˣ pulls ahead.":"Hai hàm bằng nhau tại x=2 và x=4 (4=4, 16=16). Tại x=3, x² lớn hơn; từ x=5, 2ˣ vượt lên.","Number bases":"Hệ cơ số","Decimal to hex and binary":"Thập phân sang thập lục phân và nhị phân","Convert 255 to hexadecimal and binary.":"Đổi 255 sang hệ thập lục phân và nhị phân.","Open the Base-N app with {menu}, 3.":"Mở ứng dụng Base-N bằng {menu}, 3.","Dec at the bottom means decimal.":"Dec ở dưới cùng nghĩa là hệ thập phân.","Enter 255 and press {eq}.":"Nhập 255 và bấm {eq}.","Press {pow}, the key with blue HEX.":"Bấm {pow}, phím có chữ HEX màu xanh.","FF. In Base-N the blue labels are what the keys do.":"FF. Trong Base-N, nhãn xanh là chức năng của phím.","Press {logb}, the key with blue BIN.":"Bấm {logb}, phím có chữ BIN màu xanh.","11111111: the same value in another base. DEC ({sq}) gets 255 back.":"11111111: cùng giá trị ở cơ số khác. DEC ({sq}) đưa về 255.","Hexadecimal arithmetic":"Phép tính thập lục phân","Compute 1F + A in hexadecimal.":"Tính 1F + A trong hệ thập lục phân.","Press {menu}, 3, then {pow} (HEX).":"Bấm {menu}, 3, rồi {pow} (HEX).","The screen shows Hex.":"Màn hình hiện Hex.","A to F are the red-label keys, typed directly. 1F is 1 then {tan} (F).":"A đến F là các phím nhãn đỏ, gõ trực tiếp. 1F là 1 rồi {tan} (F).","Add A ({neg}) and compute.":"Cộng A ({neg}) rồi tính.","29, which is 31+10=41 in decimal.":"29, tức là 31+10=41 trong hệ thập phân.","Binary logic operations":"Phép toán logic nhị phân","Compute 1100 and 1010.":"Tính 1100 and 1010.","Press {menu}, 3, then {logb} (BIN).":"Bấm {menu}, 3, rồi {logb} (BIN).","Enter 1100.":"Nhập 1100.","Choose 1:and from {optn}.":"Chọn 1:and từ {optn}.","Enter 1010 and compute.":"Nhập 1010 rồi tính.","1000: only bits set in both stay 1. or, xor and Not are in the same menu.":"1000: chỉ những bit bằng 1 ở cả hai số mới giữ 1. or, xor và Not nằm trong cùng menu.","Complex numbers":"Số phức","Complex arithmetic":"Phép tính số phức","Compute (2+3i)(1−i).":"Tính (2+3i)(1−i).","Open the Complex app with {menu}, 2.":"Mở ứng dụng Complex bằng {menu}, 2.","Here the {eng} key types i (purple label).":"Ở đây phím {eng} gõ i (nhãn tím).","Enter (2+3i).":"Nhập (2+3i).","Add (1−i) and compute.":"Thêm (1−i) rồi tính.","5+i, since 2−2i+3i−3i² = 5+i with i²=−1.":"5+i, vì 2−2i+3i−3i² = 5+i với i²=−1.","Modulus, conjugate and polar form":"Mô-đun, số phức liên hợp và dạng cực","Find |3+4i|, its conjugate, and 1+i in polar form.":"Tìm |3+4i|, số phức liên hợp của nó, và 1+i ở dạng cực.","The modulus is the absolute value: SHIFT then {lp} (Abs), enter 3+4i, leave with {right} and compute.":"Mô-đun là giá trị tuyệt đối: SHIFT rồi {lp} (Abs), nhập 3+4i, ra bằng {right} rồi tính.","5, which is √(3²+4²).":"5, tức là √(3²+4²).","The conjugate is 2:Conjugate in {optn}. Compute Conjg(3+4i).":"Số phức liên hợp là 2:Conjugate trong {optn}. Tính Conjg(3+4i).","3−4i: only the sign of the imaginary part flips.":"3−4i: chỉ dấu của phần ảo đổi.","Now enter 1+i, choose 5:▶r∠θ from {optn}, and compute.":"Giờ nhập 1+i, chọn 5:▶r∠θ từ {optn}, rồi tính.","√2∠45: distance √2 from the origin at 45°. To always see polar form, set Complex to r∠θ in SETUP.":"√2∠45: cách gốc tọa độ √2, ở góc 45°. Để luôn xem dạng cực, đặt Complex thành r∠θ trong SETUP.","Inequalities and ratios":"Bất phương trình và tỉ lệ","Quadratic inequalities":"Bất phương trình bậc hai","Solve x²−5x+6<0 and x²−5x+6>0.":"Giải x²−5x+6<0 và x²−5x+6>0.","Press {menu}. Inequality is the 11th app, chosen with the {dms} key (red B).":"Bấm {menu}. Inequality là ứng dụng thứ 11, chọn bằng phím {dms} (B đỏ).","It asks for the degree.":"Máy hỏi bậc.","Press 2 for degree 2.":"Bấm 2 cho bậc 2.","Four inequality forms appear.":"Bốn dạng bất phương trình hiện ra.","Choose 2:ax²+bx+c<0.":"Chọn 2:ax²+bx+c<0.","2<x<3: where the parabola is below the x-axis.":"2<x<3: nơi parabol nằm dưới trục x.","Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.":"Giờ đổi dấu: {ac} quay về bảng, rồi {optn} bắt đầu lại. Chọn 2, rồi 1:>0.","Enter 1, −5, 6 again and solve.":"Nhập lại 1, −5, 6 rồi giải.","x<2, 3<x: exactly the other side.":"x<2, 3<x: đúng phần còn lại.","Proportions":"Tỉ lệ thức","Find X in 3:4 = X:12.":"Tìm X trong 3:4 = X:12.","Press {menu}, then the {inv} key (red C) for the 12th app, Ratio.":"Bấm {menu}, rồi phím {inv} (C đỏ) cho ứng dụng thứ 12, Ratio.","Two forms, with X in different places.":"Hai dạng, với X ở vị trí khác nhau.","Choose 1:A:B=X:D.":"Chọn 1:A:B=X:D.","Enter A=3, B=4, D=12.":"Nhập A=3, B=4, D=12.","X=9, since 3×12=4×X. Handy for scaling recipes or map distances.":"X=9, vì 3×12=4×X. Tiện để quy đổi công thức nấu ăn hay khoảng cách trên bản đồ.","Spreadsheet":"Bảng tính","Values and formulas":"Giá trị và công thức","Enter prices and quantities, then the formula =A1×B1.":"Nhập giá và số lượng, rồi công thức =A1×B1.","Open the Spreadsheet app with {menu}, 8.":"Mở ứng dụng Spreadsheet bằng {menu}, 8.","Columns A–E, rows 1–45. The cursor is on A1.":"Cột A–E, hàng 1–45. Con trỏ ở A1.","Enter prices 1200, 800, 1500 down column A; {eq} moves down.":"Nhập giá 1200, 800, 1500 xuống cột A; {eq} chuyển xuống dưới.","Move to column B with {right}, then {up} three times to B1.":"Sang cột B bằng {right}, rồi {up} ba lần đến B1.","Enter quantities 2, 5, 1.":"Nhập số lượng 2, 5, 1.","Go to C1 with {right} and {up} three times.":"Đến C1 bằng {right} và {up} ba lần.","Formulas start with = (ALPHA {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.":"Công thức bắt đầu bằng = (ALPHA {calc}). A1 là ALPHA {neg} (A) rồi 1; B1 là ALPHA {dms} (B) rồi 1. Nhập =A1×B1.","Press {eq} to enter it.":"Bấm {eq} để nhập.","C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.":"C1 hiện 2400. Đổi A1 hoặc B1 thì C1 tự tính lại.","Filling formulas and totals":"Điền công thức và tính tổng","Fill C1's formula down to C3 and total it in C4.":"Điền công thức của C1 xuống đến C3 và tính tổng ở C4.","Last lesson's sheet is loaded. Go up to C1 with {up}.":"Bảng tính của bài trước đã được nạp. Lên C1 bằng {up}.","1:Fill Formula in {optn} fills many cells at once. Choose it.":"1:Fill Formula trong {optn} điền nhiều ô cùng lúc. Chọn mục này.","It asks for Form and Range.":"Máy hỏi Form và Range.","Enter A1×B1 as the Form and press {eq} to go to Range.":"Nhập A1×B1 làm Form và bấm {eq} để sang Range.","The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.":"Khoảng hiện C1:C1. Xóa số 1 cuối bằng {del}, gõ 3 để được C1:C3, rồi {eq}.","C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.":"C2=4000 và C3=1500: công thức dịch thành A2×B2 và A3×B3 theo từng hàng.","Go down to C4 with {down} three times.":"Xuống C4 bằng {down} ba lần.","Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.":"Nhập =Sum(: ALPHA {calc}, rồi {optn}, {down}, 4:Sum.","Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.":"Nhập C1:C3, đóng ngoặc và bấm {eq}. C là ALPHA {inv}; dấu hai chấm là ALPHA {int}.","C4 = 7900. Mean, Min and Max in the same menu work the same way.":"C4 = 7900. Mean, Min và Max trong cùng menu hoạt động tương tự."},"zh-TW":{"Learn":"學習","Learn by pressing the keys yourself":"親手按鍵，邊按邊學","Settings, variables and data changed during a lesson are restored when you close this panel.":"課程中變更的設定、變數和統計資料，關閉此面板後會恢復原狀。","Lessons":"目錄","Show me":"示範","Restart":"重新開始","Next":"下一步","Next lesson":"下一課","This time, press":"這次請按","Well done! Feel free to keep experimenting.":"做得好！可以繼續自由嘗試。","Close":"關閉","lessons":"課","Basics":"基礎","Arithmetic and order of operations":"四則運算與運算順序","Compute 2+3×4 and 3×(2+5).":"計算 2+3×4 和 3×(2+5)。","Type 2+3×4. The expression appears just as you would write it.":"依序輸入 2+3×4。算式會照你書寫的樣子顯示。","Nothing is computed yet. You enter the whole expression first.":"現在還沒有計算。先把整個算式輸入完。","Press {eq} to compute.":"按 {eq} 進行計算。","The answer is 14: multiplication comes before addition (3×4=12, then 2+12).":"答案是 14：先乘後加（3×4=12，再算 2+12）。","{ac} clears the expression. Stored values and settings stay.":"{ac} 清除算式。已儲存的值和設定會保留。","The screen is empty.":"螢幕已清空。","Use brackets to add first. Enter 3×(2+5) and compute.":"要先算加法，就用括號。輸入 3×(2+5) 並計算。","The answer is 21. The brackets were computed first.":"答案是 21。括號裡的部分先算了。","Fixing mistakes":"修正錯誤","Edit an expression with DEL and ◀.":"用 DEL 和 ◀ 修改算式。","Enter 2+5.":"輸入 2+5。","Say the 5 was a mistake. {del} deletes the character before the cursor.":"假設 5 輸入錯了。{del} 刪除游標前面的一個字元。","The 5 is gone.":"5 被刪除了。","Enter 6 and compute.":"輸入 6 並計算。","2+6=8.":"2+6=8。","You can still edit after computing. {left} brings the expression back with the cursor at the end.":"計算之後仍然可以修改。按 {left} 回到算式，游標位於末尾。","You are editing the expression again.":"又回到了編輯算式的狀態。","Delete the 6, enter 9 and compute again.":"刪掉 6，輸入 9，再計算一次。","2+9=11. No need to retype long expressions.":"2+9=11。長算式也不必重新輸入。","Negative numbers":"負數","Learn the (−) key versus minus, and squaring negatives.":"學習 (−) 鍵與減號的差別，以及負數的平方。","For a negative number use {neg}, not minus {sub}. Compute (−)3×4.":"輸入負數要用 {neg}，不要用減號 {sub}。計算 (−)3×4。","The result is −12.":"結果是 −12。","Now enter −3² as written. Squaring is {sq}.":"現在照原樣輸入 −3²。平方是 {sq}。","You get −9: the square is taken first, then the sign, just like in maths.":"得到 −9：先算平方，再加負號，和數學規則一樣。","For (−3)², wrap it in brackets.":"要算 (−3)²，就用括號括起來。","The answer is 9.":"答案是 9。","Fractions and decimals":"分數與小數","Compute 2/3 + 1/4 as a fraction, then as a decimal.":"把 2/3 + 1/4 算成分數，再化成小數。","{frac} makes a fraction box with the cursor in the numerator. Enter 2.":"{frac} 產生分數框，游標在分子處。輸入 2。","Go down to the denominator with {down} and enter 3.":"用 {down} 移到分母，輸入 3。","Leave the fraction with {right}, then press +.":"用 {right} 離開分數，再按 +。","Enter 1/4 the same way.":"用同樣的方法輸入 1/4。","Compute.":"計算。","You get the fraction 11/12. The calculator finds the common denominator and reduces.":"得到分數 11/12。通分和約分由計算機完成。","{sd} switches between fraction and decimal.":"{sd} 在分數和小數之間切換。","0.9166666667. Press it again to get the fraction back.":"0.9166666667。再按一次變回分數。","Roots and powers":"根號與次方","Compute √8, 2¹⁰ and ∛27, and learn SHIFT.":"計算 √8、2¹⁰ 和 ∛27，並學習 SHIFT 的用法。","Press {sqrt}, enter 8 and compute.":"按 {sqrt}，輸入 8 並計算。","You get 2√2, the exact form. Press S⇔D if you want the decimal.":"得到精確形式 2√2。需要小數時按 S⇔D。","Powers use {pow}. Enter 2, press it to get the exponent box, then enter 10.":"次方用 {pow}。輸入 2，按此鍵出現指數框，再輸入 10。","Leave the exponent with {right} and compute.":"用 {right} 離開指數並計算。","2¹⁰ = 1024.":"2¹⁰ = 1024。","Yellow labels above the keys need {shift} first. SHIFT then {sqrt} gives ∛. Compute ∛27.":"按鍵上方的黃色標示要先按 {shift}。SHIFT 後按 {sqrt} 得到 ∛。計算 ∛27。","The answer is 3. An S lights up on screen while SHIFT is active.":"答案是 3。SHIFT 生效時螢幕上會亮起 S。","Trigonometry and angle units":"三角函數與角度單位","Compute sin 30° and sin⁻¹(0.5).":"計算 sin 30° 和 sin⁻¹(0.5)。","The D at the top means degrees. {sin} enters sin(. Compute sin(30).":"上方的 D 表示角度單位是度。{sin} 輸入 sin(。計算 sin(30)。","The result is 1/2.":"結果是 1/2。","Inverse functions use SHIFT. Compute sin⁻¹(0.5).":"反函數要搭配 SHIFT。計算 sin⁻¹(0.5)。","30: the angle whose sine is 0.5. To switch to radians use SHIFT, MENU (SETUP), then 2:Angle Unit.":"30：正弦值為 0.5 的角。要改成弳度，按 SHIFT、MENU（SETUP），再選 2:Angle Unit。","Logarithms":"對數","Compute log₂8, log 100 and ln e.":"計算 log₂8、log 100 和 ln e。","{logb} is a log with a chosen base. Enter base 2, move with {right}, enter 8 and compute.":"{logb} 是可指定底數的對數。底數輸入 2，用 {right} 移動，輸入 8 並計算。","log₂8 = 3.":"log₂8 = 3。","The common log (base 10) is SHIFT and {neg}. Compute log(100).":"常用對數（底數為 10）是 SHIFT 加 {neg}。計算 log(100)。","The result is 2.":"結果是 2。","The natural log is {ln}. Enter e with {alpha} then {exp}. Compute ln(e).":"自然對數是 {ln}。e 用 {alpha} 再按 {exp} 輸入。計算 ln(e)。","The result is 1. Red labels need ALPHA first.":"結果是 1。紅色標示要先按 ALPHA。","Ans and variables":"Ans 與變數","Reuse the last answer and store a value in A.":"沿用上一個答案，並把一個值存入 A。","Compute 12×3.":"計算 12×3。","The result is 36.":"結果是 36。","With a result showing, pressing {div} starts with Ans, the last answer. Continue with ÷4.":"顯示結果時直接按 {div}，算式會以上一個答案 Ans 開頭。接著計算 ÷4。","Ans÷4 = 9.":"Ans÷4 = 9。","To keep a value, store it in a variable. Enter 7, press {sto}, then {neg} (its red label is A).":"要保留一個值，就把它存入變數。輸入 7，按 {sto}，再按 {neg}（紅色標示為 A）。","7 is stored in A.":"7 已存入 A。","Recall A with ALPHA and {neg}, and compute A×2.":"用 ALPHA 和 {neg} 叫出 A，計算 A×2。","14. A variable keeps its value until you store a new one.":"14。變數會一直保留它的值，直到存入新值。","Scientific notation ×10ˣ":"科學記號 ×10ˣ","Compute 3×10⁸ × 2.":"計算 3×10⁸ × 2。","Enter 3×10⁸ with {exp}: type 3, press it to get the exponent box, then enter 8.":"用 {exp} 輸入 3×10⁸：輸入 3，按此鍵出現指數框，再輸入 8。","Leave the exponent with {right}, then compute ×2.":"用 {right} 離開指數，再計算 ×2。","600000000. Without leaving the exponent, ×2 would go into the exponent and give a very different number.":"600000000。如果不離開指數，×2 會跑進指數裡，得到完全不同的數。","Equations":"方程式","Substituting values with CALC":"用 CALC 代入數值","Evaluate x²+3x at x=2 and x=5.":"求 x²+3x 在 x=2 和 x=5 時的值。","Enter x²+3x. x is the {x} key, squaring is {sq}.":"輸入 x²+3x。x 是 {x} 鍵，平方是 {sq}。","{calc} evaluates the expression for a value you give. Press it.":"{calc} 把你給的值代入算式計算。按一下。","It asks for x.":"它詢問 x 的值。","Enter 2 and press {eq}.":"輸入 2 並按 {eq}。","At x=2 the value is 10 (4+6).":"x=2 時值為 10（4+6）。","Press {calc} again to try another value. Enter 5 and compute.":"再按 {calc} 可以試另一個值。輸入 5 並計算。","At x=5 it is 40. Handy for filling in a table without retyping.":"x=5 時值為 40。填表時不用重新輸入算式，很方便。","Solving with SOLVE":"用 SOLVE 解方程式","Solve 2x+3=11 with SOLVE.":"用 SOLVE 解 2x+3=11。","SOLVE works on any equation typed on the calculation screen. Enter 2x+3.":"SOLVE 可以解計算畫面上輸入的任何方程式。輸入 2x+3。","The equals sign of an equation is {alpha} then {calc} (red =). Add =11.":"方程式中的等號是 {alpha} 再按 {calc}（紅色 =）。接著輸入 =11。","Now it reads 2x+3=11. This equals sign is part of the equation, not the compute key.":"現在顯示 2x+3=11。這個等號是方程式的一部分，不是計算鍵。","Press {shift} then {calc} (SOLVE).":"按 {shift} 再按 {calc}（SOLVE）。","It asks for a starting value of x; the search starts from the value x holds now.":"它詢問 x 的初始值；會從 x 目前的值開始搜尋。","Press {eq} to solve.":"按 {eq} 求解。","x=4. L−R=0 underneath means left side minus right side is 0: the solution is exact.":"x=4。下方的 L−R=0 表示左式減右式等於 0：解是精確的。","Choosing a starting value":"選擇初始值","Find the negative root of x²=2.":"求 x²=2 的負根。","Enter x²=2. The equals sign is ALPHA and {calc}.":"輸入 x²=2。等號是 ALPHA 加 {calc}。","Open SOLVE with SHIFT and {calc}.":"用 SHIFT 和 {calc} 開啟 SOLVE。","With two roots (±√2), SOLVE finds the one near the starting value. Enter −1 as the start and press {eq}.":"有兩個根（±√2）時，SOLVE 會求出靠近初始值的那個。初始值輸入 −1，再按 {eq}。","The starting value is now −1.":"初始值現在是 −1。","x=−1.414213562 (−√2). Start from 1 and you get +√2. For several roots, try different starting values.":"x=−1.414213562（−√2）。從 1 開始則得到 +√2。有多個根時，換不同的初始值試試。","Simultaneous equations":"聯立方程式","Solve 2x+3y=8 and x−y=−1.":"解 2x+3y=8 和 x−y=−1。","Press {menu}. Equation/Func is the 10th app, so choose it with the {neg} key (red A).":"按 {menu}。Equation/Func 是第 10 個 App，所以用 {neg} 鍵（紅色 A）選擇。","Now choose the kind of equation.":"現在選擇方程式的類型。","Choose 1:Simul Equation, then 2 unknowns.":"選擇 1:Simul Equation，再選 2 個未知數。","A coefficient table for ax+by=c appears.":"出現 ax+by=c 的係數表。","Enter 2, 3, 8 for 2x+3y=8. Each {eq} moves one cell right.":"輸入 2x+3y=8 的係數 2、3、8。每按一次 {eq} 向右移一格。","At the end of a row it moves to the next one.":"到列尾會移到下一列。","For x−y=−1 the coefficients are 1, −1, −1. Use {neg} for negatives.":"x−y=−1 的係數是 1、−1、−1。負數用 {neg} 輸入。","All coefficients are in.":"係數全部輸入完畢。","When no cell is being edited, {eq} solves.":"沒有在編輯儲存格時，按 {eq} 求解。","x=1.":"x=1。","Press {eq} again for the next unknown.":"再按 {eq} 看下一個未知數。","y=2. Check: 2+6=8 and 1−2=−1.":"y=2。驗算：2+6=8，1−2=−1。","Quadratics and the vertex":"二次方程式與頂點","Solve x²−5x+6=0 and find the vertex of the parabola.":"解 x²−5x+6=0，並求拋物線的頂點。","Press {menu}, {neg}, then 2:Polynomial and degree 2.":"按 {menu}、{neg}，再選 2:Polynomial 和次數 2。","This is the table for ax²+bx+c=0.":"這是 ax²+bx+c=0 的係數表。","Enter the coefficients 1, −5, 6.":"輸入係數 1、−5、6。","x₁=3.":"x₁=3。","Press {eq} for the other root.":"按 {eq} 看另一個根。","x₂=2.":"x₂=2。","Press {eq} twice more for the vertex of y=x²−5x+6.":"再按兩次 {eq}，得到 y=x²−5x+6 的頂點。","The vertex is x=2.5, y=−0.25, the minimum: useful for sketching the graph.":"頂點是 x=2.5，y=−0.25，即最小值：畫圖形時很有用。","When there are no real roots":"沒有實數根時","See the complex roots of x²+2x+5=0.":"查看 x²+2x+5=0 的複數根。","Open the quadratic table with {menu}, {neg}, 2, 2.":"用 {menu}、{neg}、2、2 開啟二次方程式表。","Enter the coefficients 1, 2, 5.":"輸入係數 1、2、5。","x₁=−1+2i. The discriminant b²−4ac=−16 is negative, so the roots are complex.":"x₁=−1+2i。判別式 b²−4ac=−16 為負，所以根是複數。","x₂=−1−2i. To see just \"no real roots\" instead, set Equation/Func to Off in SETUP.":"x₂=−1−2i。若只想顯示「無實數根」，可在 SETUP 中把 Equation/Func 設為 Off。","Calculus and sums":"微積分與求和","Definite integrals":"定積分","Compute ∫₀² x² dx.":"計算 ∫₀² x² dx。","{int} makes an integral box with the cursor in the integrand. Enter x².":"{int} 產生積分框，游標在被積分函數處。輸入 x²。","Move with {right} to the lower limit and enter 0, then {right} again to the upper limit and enter 2.":"用 {right} 移到下限並輸入 0，再按 {right} 移到上限並輸入 2。","8/3 (about 2.667): by hand, x³/3 evaluated from 0 to 2.":"8/3（約 2.667）：手算就是 x³/3 從 0 到 2 的值之差。","Integrating trig functions in radians":"三角函數積分用弳度","Compute ∫₀^π sin x dx.":"計算 ∫₀^π sin x dx。","Calculus with trig functions uses radians. Press {shift}, {menu} (SETUP), then 2:Angle Unit.":"含三角函數的微積分要用弳度。按 {shift}、{menu}（SETUP），再選 2:Angle Unit。","Choose 2:Radian.":"選擇 2:Radian。","The indicator at the top changed from D to R.":"上方的標示從 D 變成了 R。","Press {int} and enter sin(x).":"按 {int} 並輸入 sin(x)。","Enter 0 and π as the limits and compute. π is SHIFT then {exp}.":"上下限輸入 0 和 π，然後計算。π 是 SHIFT 再按 {exp}。","2. In degree mode the angle would be read in degrees and the answer would be wrong.":"2。如果用度度量，角會被當成度來計算，答案就錯了。","Derivatives at a point":"導數值","Find the derivative of x³ at x=2.":"求 x³ 在 x=2 處的導數。","SHIFT then {int} gives the derivative. Enter x³ (SHIFT then {sq}).":"SHIFT 再按 {int} 是求導數。輸入 x³（SHIFT 再按 {sq}）。","Move with {right} to x=, enter 2 and compute.":"用 {right} 移到 x=，輸入 2 並計算。","12. The derivative of x³ is 3x², which is 12 at x=2.":"12。x³ 的導函數是 3x²，在 x=2 時等於 12。","Sums with Σ":"用 Σ 求和","Sum 1 to 10, then the squares.":"求 1 到 10 的和，再求平方和。","SHIFT then {x} gives Σ. Enter x as the term.":"SHIFT 再按 {x} 得到 Σ。一般項輸入 x。","Move with {right} to enter the start 1, then {right} again for the end 10, and compute.":"用 {right} 移動，輸入起始值 1，再按 {right} 輸入終止值 10，然後計算。","1+2+…+10 = 55.":"1+2+…+10 = 55。","Change only the term to get other sums. Sum x² over the same range.":"只改一般項就能求其他的和。在同一範圍內求 x² 的和。","1²+2²+…+10² = 385. Check it with n(n+1)(2n+1)/6.":"1²+2²+…+10² = 385。用 n(n+1)(2n+1)/6 驗算看看。","Statistics":"統計","Enter data and find the mean":"輸入資料並求平均數","Find the mean of 4, 7, 9, 6, 4.":"求 4、7、9、6、4 的平均數。","{menu} opens the app list.":"{menu} 開啟 App 列表。","There are 12 apps.":"共有 12 個 App。","Press 6 to open Statistics.":"按 6 開啟 Statistics。","Now choose the kind of statistics.":"現在選擇統計的類型。","1:1-Variable is for a single list of data. Press 1.":"1:1-Variable 用於單一組資料。按 1。","The data table is open.":"資料表已開啟。","Enter the first value 4 and press {eq}.":"輸入第一個數 4，按 {eq}。","4 is in row 1 and the cursor moved down.":"4 進入第 1 列，游標往下移。","Enter 7, 9, 6 and 4 the same way.":"用同樣方法輸入 7、9、6、4。","All 5 values are in.":"5 筆資料全部輸入完畢。","{optn} opens the statistics menu.":"{optn} 開啟統計選單。","3:1-Variable Calc shows the results.":"3:1-Variable Calc 顯示結果。","Press 3.":"按 3。","x̄=6 is the mean and Σx=30 the sum. The next lesson reads the rest of the list.":"x̄=6 是平均數，Σx=30 是總和。下一課繼續讀其餘結果。","Reading the results":"讀懂結果","Find both standard deviations, the median and quartiles.":"找出兩種標準差、中位數和四分位數。","Results for 4, 7, 9, 6, 4 are showing, 4 lines at a time. Press {down} four times.":"4、7、9、6、4 的結果已顯示，每頁 4 行。按 {down} 四次。","σx is the population standard deviation (divide by n); sx is the sample one (divide by n−1). Check which one a question asks for.":"σx 是母體標準差（除以 n）；sx 是樣本標準差（除以 n−1）。注意題目問的是哪一個。","Go down four more times.":"再往下按四次。","Med=6 is the median; Q1=4 and Q3=8 are the quartiles.":"Med=6 是中位數；Q1=4 和 Q3=8 是四分位數。","Press {ac} to go back to the data table.":"按 {ac} 回到資料表。","The data is still there, ready to edit and recompute.":"資料還在，可以修改後重新計算。","Editing and deleting data":"修改與刪除資料","Change one value, delete another and recompute.":"改一個數、刪一個數，再重新計算。","The table holds 4, 7, 9, 6, 4 and the cursor is on empty row 6. Press {up} twice to reach the 6 in row 4.":"表中有 4、7、9、6、4，游標在空白的第 6 列。按 {up} 兩次到第 4 列的 6。","Row 4 is highlighted.":"第 4 列已反白。","Enter 8 and press {eq} to replace 6 with 8.":"輸入 8 並按 {eq}，把 6 改成 8。","Done. The cursor moved to row 5.":"完成。游標移到了第 5 列。","{del} deletes the whole row under the cursor. Delete the 4 in row 5.":"{del} 刪除游標所在的整列。刪除第 5 列的 4。","The data is now 4, 7, 9, 8.":"資料現在是 4、7、9、8。","Recompute with {optn} then 3.":"按 {optn} 再按 3 重新計算。","x̄=7 and n=4. Results follow the edited data.":"x̄=7，n=4。結果隨修改後的資料而變。","Using frequencies":"使用次數","Mean of 3 people scoring 10, 5 scoring 20, 2 scoring 30.":"3 人得 10 分、5 人得 20 分、2 人得 30 分，求平均分數。","Repeated values are quicker with a Freq column. Open the setup first: {shift} then {menu} (SETUP).":"重複的數用 Freq（次數）欄更快。先開啟設定：{shift} 再按 {menu}（SETUP）。","This is the setup list.":"這是設定列表。","Go to the next page with {down} and pick 3:Statistics.":"用 {down} 翻到下一頁，選擇 3:Statistics。","It asks whether to show the frequency column.":"它詢問是否顯示次數欄。","Choose 1:On.":"選擇 1:On。","The Freq column is on.":"Freq 欄已開啟。","Open the 1-Variable table with {menu}, 6, 1.":"用 {menu}、6、1 開啟 1-Variable 表。","A Freq column now sits next to x.":"x 旁邊多了一欄 Freq。","Enter the scores 10, 20, 30.":"輸入分數 10、20、30。","Each Freq starts at 1.":"每個 Freq 初始都是 1。","Move to Freq with {right}, then up three times with {up} to row 1.":"用 {right} 移到 Freq，再按 {up} 三次到第 1 列。","Enter the counts 3, 5, 2.":"輸入人數 3、5、2。","3 people scored 10, 5 scored 20, 2 scored 30.":"3 人得 10 分，5 人得 20 分，2 人得 30 分。","Compute with {optn} then 3.":"按 {optn} 再按 3 計算。","x̄=19 is the mean score; n=10 is the number of people.":"x̄=19 是平均分數；n=10 是總人數。","Two variables and regression":"雙變數與迴歸","Fit y=a+bx to study hours and scores.":"根據讀書時間和分數求迴歸直線 y=a+bx。","Press {menu}, 6, then choose 2:y=a+bx for paired data.":"按 {menu}、6，再為成對資料選擇 2:y=a+bx。","The table has x and y columns.":"表中有 x 和 y 兩欄。","Enter study hours x: 1, 2, 3, 4, 5.":"輸入讀書時數 x：1、2、3、4、5。","Move to y with {right}, then press {up} five times to reach row 1.":"用 {right} 移到 y，再按 {up} 五次到第 1 列。","Enter scores y: 2, 4, 5, 4, 5.":"輸入分數 y：2、4、5、4、5。","Press {optn}, then 4:Regression Calc.":"按 {optn}，再選 4:Regression Calc。","a=2.2 and b=0.6, so y=2.2+0.6x. r≈0.775 is the correlation; the closer to ±1, the straighter the data.":"a=2.2，b=0.6，所以 y=2.2+0.6x。r≈0.775 是相關係數，越接近 ±1，資料越接近直線。","Predicting with ŷ":"用 ŷ 預測","Predict the score ŷ for x=6.":"預測 x=6 時的分數 ŷ。","Last lesson's data is loaded. Press {ac} for the calculation screen; the data and fit stay.":"上一課的資料已載入。按 {ac} 進入計算畫面；資料和迴歸直線會保留。","Enter 6 and press {optn}.":"輸入 6 並按 {optn}。","Go to the next page with {down} and choose 4:Regression.":"用 {down} 翻到下一頁，選擇 4:Regression。","Press {down}, then 1 to insert ŷ.":"按 {down}，再按 1 插入 ŷ。","The expression reads 6ŷ: \"y when x is 6\".":"算式顯示 6ŷ：意思是「x 為 6 時的 y」。","5.8 = 2.2+0.6×6. x̂ works the other way, from y to x.":"5.8 = 2.2+0.6×6。x̂ 則相反，由 y 求 x。","Distributions":"機率分布","Normal probability between two values":"常態分布在兩值之間的機率","Heights average 170 cm with SD 6 cm: find P(165 ≤ X ≤ 180).":"身高平均 170 cm，標準差 6 cm：求 P(165 ≤ X ≤ 180)。","Open the Distribution app with {menu}, 7.":"用 {menu}、7 開啟 Distribution App。","Choose a distribution.":"選擇一種分布。","2:Normal CD gives the probability between two values. Press 2.":"2:Normal CD 求兩個值之間的機率。按 2。","It asks for Lower, Upper, σ (standard deviation) and μ (mean).":"它依序詢問 Lower、Upper、σ（標準差）和 μ（平均數）。","Enter Lower 165 and Upper 180; each {eq} moves to the next line.":"輸入 Lower 165 和 Upper 180；每按一次 {eq} 移到下一行。","Enter σ=6 and μ=170.":"輸入 σ=6 和 μ=170。","With every value in, press {eq} to compute.":"全部輸入後，按 {eq} 計算。","P≈0.7499: about 75% are between 165 and 180 cm. No z-table needed.":"P≈0.7499：約 75% 的人在 165 到 180 cm 之間。不用查常態分布表。","Cut-off for the top few percent":"前百分之幾的分界值","Find the height that marks the top 5%.":"求進入前 5% 的身高分界值。","Press {menu}, 7, then 3:Inverse Normal.":"按 {menu}、7，再選 3:Inverse Normal。","It works backwards from an area to x.":"它由面積反推 x。","Area is measured from the left. The top 5% starts where the lower 95% ends, so enter 0.95.":"Area 從左側算起。前 5% 從下方 95% 結束處開始，所以輸入 0.95。","Enter σ=6, μ=170 and compute.":"輸入 σ=6、μ=170 並計算。","About 179.87 cm: taller than that is the top 5%.":"約 179.87 cm：比這更高就進入前 5%。","Binomial distribution":"二項分布","Toss a coin 10 times: P(exactly 3 heads) and P(at most 3).":"擲硬幣 10 次：求恰好 3 次正面的機率和最多 3 次的機率。","Press {menu}, 7, then 4:Binomial PD. PD means \"exactly x times\".":"按 {menu}、7，再選 4:Binomial PD。PD 表示「恰好 x 次」。","List handles many x values at once; Variable handles one.":"List 一次算多個 x；Variable 算一個 x。","Choose 2:Variable.":"選擇 2:Variable。","Enter x=3 (heads), N=10 (tosses), p=0.5 (chance of heads).":"輸入 x=3（正面次數）、N=10（投擲次數）、p=0.5（正面的機率）。","0.1171875, about 11.7%.":"0.1171875，約 11.7%。","\"At most 3\" is the cumulative Binomial CD. Press {optn} for the list, then 5 and 2.":"「最多 3 次」是累積的 Binomial CD。按 {optn} 回到列表，再選 5 和 2。","Enter 3, 10, 0.5 again and compute.":"再次輸入 3、10、0.5 並計算。","0.171875: the chances of 0, 1, 2 and 3 heads added together.":"0.171875：0、1、2、3 次正面的機率之和。","Matrices":"矩陣","Entering a matrix and its determinant":"輸入矩陣與行列式","Enter A=[[2,1],[5,3]] and find its determinant.":"輸入 A=[[2,1],[5,3]] 並求它的行列式。","Open the Matrix app with {menu}, 4.":"用 {menu}、4 開啟 Matrix App。","Choose which matrix to define: MatA to MatD.":"選擇要定義的矩陣：MatA 到 MatD。","Choose 1:MatA, then 2 rows and 2 columns.":"選擇 1:MatA，再選 2 列 2 行。","A 2×2 grid appears.":"出現一個 2×2 的表格。","Enter 2, 1, 5, 3. Each {eq} moves right, then down to the next row.":"輸入 2、1、5、3。每按一次 {eq} 向右移，列尾則移到下一列。","A=[[2,1],[5,3]].":"A=[[2,1],[5,3]]。","Go to the calculation screen with {ac}.":"按 {ac} 進入計算畫面。","The matrix stays stored.":"矩陣仍然儲存著。","Press {optn}, go to the second page with {down}, choose 2:Determinant.":"按 {optn}，用 {down} 翻到第二頁，選擇 2:Determinant。","Det( is entered.":"已輸入 Det(。","Insert MatA with {optn} then 3, close the bracket and compute.":"按 {optn} 再按 3 插入 MatA，補上右括號並計算。","det A = 2×3 − 1×5 = 1.":"det A = 2×3 − 1×5 = 1。","Inverse matrix":"反矩陣","Find the inverse of A=[[2,1],[5,3]].":"求 A=[[2,1],[5,3]] 的反矩陣。","Matrix A is already defined. Press {ac} for the calculation screen.":"矩陣 A 已定義。按 {ac} 進入計算畫面。","Insert MatA with {optn} then 3.":"按 {optn} 再按 3 插入 MatA。","{inv} gives the inverse. Press it and compute.":"{inv} 求反矩陣。按下它並計算。","A⁻¹=[[3,−1],[−5,2]]; integers because det A = 1. With det 0 there is no inverse and you get Math ERROR.":"A⁻¹=[[3,−1],[−5,2]]；因為 det A = 1，所以都是整數。行列式為 0 時沒有反矩陣，會顯示 Math ERROR。","Multiplying matrices":"矩陣乘法","Define B=[[1],[2]] and compute A×B.":"定義 B=[[1],[2]] 並計算 A×B。","A is defined. Now define B: {optn}, 1:Define Matrix, 2:MatB.":"A 已定義。現在定義 B：{optn}、1:Define Matrix、2:MatB。","Choose 2 rows and 1 column.":"選擇 2 列 1 行。","Enter 1 and 2.":"輸入 1 和 2。","Press {ac} and enter MatA×MatB: MatA is {optn} 3, MatB is {optn} 4.":"按 {ac}，輸入 MatA×MatB：MatA 是 {optn} 3，MatB 是 {optn} 4。","MatAns=[[4],[11]] (2×1+1×2=4, 5×1+3×2=11). The first matrix's columns must match the second's rows.":"MatAns=[[4],[11]]（2×1+1×2=4，5×1+3×2=11）。前一個矩陣的行數必須等於後一個矩陣的列數。","Vectors":"向量","Entering vectors and the dot product":"輸入向量與內積","Find the dot product of A=(1,2,3) and B=(4,5,6).":"求 A=(1,2,3) 和 B=(4,5,6) 的內積。","Open the Vector app with {menu}, 5.":"用 {menu}、5 開啟 Vector App。","Choose 1:VctA and dimension 3.":"選擇 1:VctA，維度選 3。","Enter 1, 2, 3.":"輸入 1、2、3。","Now define B: {optn}, 1:Define Vector, 2:VctB, dimension 3.":"現在定義 B：{optn}、1:Define Vector、2:VctB，維度 3。","Enter 4, 5, 6.":"輸入 4、5、6。","Press {ac}, then insert VctA with {optn} 3.":"按 {ac}，再用 {optn} 3 插入 VctA。","The dot is on the second page of {optn}: 2:Dot Product.":"內積符號在 {optn} 的第二頁：2:Dot Product。","Insert VctB with {optn} 4 and compute.":"用 {optn} 4 插入 VctB 並計算。","32 (1×4+2×5+3×6). A dot product of 0 means the vectors are perpendicular.":"32（1×4+2×5+3×6）。內積為 0 表示兩向量垂直。","Cross product and angle":"外積與夾角","Find the cross product of A and B and the angle between them.":"求 A 與 B 的外積以及它們的夾角。","A and B are defined. Press {ac} and enter VctA×VctB; {mul} between vectors is the cross product.":"A 和 B 已定義。按 {ac}，輸入 VctA×VctB；向量之間的 {mul} 表示外積。","(−3, 6, −3), perpendicular to both A and B.":"(−3, 6, −3)，與 A 和 B 都垂直。","Press {ac}, then 3:Angle on the second page of {optn}.":"按 {ac}，再選 {optn} 第二頁的 3:Angle。","Enter VctA, a comma, VctB, close the bracket and compute. The comma is SHIFT then {rp}.":"輸入 VctA、逗號、VctB，補上右括號並計算。逗號是 SHIFT 再按 {rp}。","About 12.93°. It follows the angle unit setting (D or R).":"約 12.93°。結果依角度單位設定（D 或 R）而定。","Function tables":"函數表","Making a table of values":"製作函數值表","Tabulate f(x)=x²−2x for x from −2 to 4.":"列出 x 從 −2 到 4 時 f(x)=x²−2x 的值。","Open the Table app with {menu}, 9.":"用 {menu}、9 開啟 Table App。","Enter f(x)= here.":"在這裡輸入 f(x)=。","
