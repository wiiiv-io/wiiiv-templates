nd compute.":"加上 A（{neg}）並計算。","29, which is 31+10=41 in decimal.":"29，也就是十進位的 31+10=41。","Binary logic operations":"二進位邏輯運算","Compute 1100 and 1010.":"計算 1100 and 1010。","Press {menu}, 3, then {logb} (BIN).":"按 {menu}、3，再按 {logb}（BIN）。","Enter 1100.":"輸入 1100。","Choose 1:and from {optn}.":"從 {optn} 中選擇 1:and。","Enter 1010 and compute.":"輸入 1010 並計算。","1000: only bits set in both stay 1. or, xor and Not are in the same menu.":"1000：只有兩數都是 1 的位元才保留 1。or、xor 和 Not 也在同一選單中。","Complex numbers":"複數","Complex arithmetic":"複數運算","Compute (2+3i)(1−i).":"計算 (2+3i)(1−i)。","Open the Complex app with {menu}, 2.":"用 {menu}、2 開啟 Complex App。","Here the {eng} key types i (purple label).":"在這裡 {eng} 鍵輸入 i（紫色標示）。","Enter (2+3i).":"輸入 (2+3i)。","Add (1−i) and compute.":"接著輸入 (1−i) 並計算。","5+i, since 2−2i+3i−3i² = 5+i with i²=−1.":"5+i，因為 i²=−1，2−2i+3i−3i² = 5+i。","Modulus, conjugate and polar form":"絕對值、共軛與極式","Find |3+4i|, its conjugate, and 1+i in polar form.":"求 |3+4i|、它的共軛複數，以及 1+i 的極式。","The modulus is the absolute value: SHIFT then {lp} (Abs), enter 3+4i, leave with {right} and compute.":"複數的大小就是絕對值：按 SHIFT 再按 {lp}（Abs），輸入 3+4i，用 {right} 離開並計算。","5, which is √(3²+4²).":"5，即 √(3²+4²)。","The conjugate is 2:Conjugate in {optn}. Compute Conjg(3+4i).":"共軛複數是 {optn} 中的 2:Conjugate。計算 Conjg(3+4i)。","3−4i: only the sign of the imaginary part flips.":"3−4i：只有虛部的正負號改變。","Now enter 1+i, choose 5:▶r∠θ from {optn}, and compute.":"現在輸入 1+i，從 {optn} 選擇 5:▶r∠θ 並計算。","√2∠45: distance √2 from the origin at 45°. To always see polar form, set Complex to r∠θ in SETUP.":"√2∠45：到原點的距離為 √2，角度為 45°。若要一律顯示極式，在 SETUP 中把 Complex 設為 r∠θ。","Inequalities and ratios":"不等式與比例式","Quadratic inequalities":"二次不等式","Solve x²−5x+6<0 and x²−5x+6>0.":"解 x²−5x+6<0 和 x²−5x+6>0。","Press {menu}. Inequality is the 11th app, chosen with the {dms} key (red B).":"按 {menu}。Inequality 是第 11 個 App，用 {dms} 鍵（紅色 B）選擇。","It asks for the degree.":"它詢問次數。","Press 2 for degree 2.":"按 2 選擇二次。","Four inequality forms appear.":"出現四種不等式形式。","Choose 2:ax²+bx+c<0.":"選擇 2:ax²+bx+c<0。","2<x<3: where the parabola is below the x-axis.":"2<x<3：拋物線位於 x 軸下方的區間。","Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.":"現在反過來：{ac} 回到係數表，再按 {optn} 重新選擇。選 2，再選 1:>0。","Enter 1, −5, 6 again and solve.":"再次輸入 1、−5、6 並求解。","x<2, 3<x: exactly the other side.":"x<2, 3<x：正好是另一側。","Proportions":"比例式","Find X in 3:4 = X:12.":"在 3:4 = X:12 中求 X。","Press {menu}, then the {inv} key (red C) for the 12th app, Ratio.":"按 {menu}，再按 {inv} 鍵（紅色 C）選擇第 12 個 App Ratio。","Two forms, with X in different places.":"兩種形式，X 的位置不同。","Choose 1:A:B=X:D.":"選擇 1:A:B=X:D。","Enter A=3, B=4, D=12.":"輸入 A=3、B=4、D=12。","X=9, since 3×12=4×X. Handy for scaling recipes or map distances.":"X=9，因為 3×12=4×X。換算食譜份量或地圖距離時很方便。","Spreadsheet":"試算表","Values and formulas":"數值與公式","Enter prices and quantities, then the formula =A1×B1.":"輸入單價和數量，再輸入公式 =A1×B1。","Open the Spreadsheet app with {menu}, 8.":"用 {menu}、8 開啟 Spreadsheet App。","Columns A–E, rows 1–45. The cursor is on A1.":"欄為 A–E，列為 1–45。游標在 A1。","Enter prices 1200, 800, 1500 down column A; {eq} moves down.":"在 A 欄依序輸入單價 1200、800、1500；{eq} 往下移。","Move to column B with {right}, then {up} three times to B1.":"用 {right} 移到 B 欄，再按 {up} 三次到 B1。","Enter quantities 2, 5, 1.":"輸入數量 2、5、1。","Go to C1 with {right} and {up} three times.":"用 {right} 和三次 {up} 移到 C1。","Formulas start with = (ALPHA {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.":"公式以 =（ALPHA {calc}）開頭。A1 是 ALPHA {neg}（A）再按 1；B1 是 ALPHA {dms}（B）再按 1。輸入 =A1×B1。","Press {eq} to enter it.":"按 {eq} 確認輸入。","C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.":"C1 顯示 2400。修改 A1 或 B1，C1 會自動重新計算。","Filling formulas and totals":"填入公式與合計","Fill C1's formula down to C3 and total it in C4.":"把 C1 的公式往下填到 C3，並在 C4 求合計。","Last lesson's sheet is loaded. Go up to C1 with {up}.":"上一課的試算表已載入。用 {up} 移到 C1。","1:Fill Formula in {optn} fills many cells at once. Choose it.":"{optn} 中的 1:Fill Formula 可一次填入多個儲存格。選擇它。","It asks for Form and Range.":"它詢問 Form 和 Range。","Enter A1×B1 as the Form and press {eq} to go to Range.":"Form 輸入 A1×B1，按 {eq} 移到 Range。","The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.":"範圍顯示 C1:C1。用 {del} 刪掉最後的 1，輸入 3 變成 C1:C3，再按 {eq}。","C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.":"C2=4000，C3=1500：公式逐列變為 A2×B2 和 A3×B3。","Go down to C4 with {down} three times.":"按 {down} 三次移到 C4。","Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.":"輸入 =Sum(：ALPHA {calc}，再按 {optn}、{down}、4:Sum。","Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.":"輸入 C1:C3，補上右括號並按 {eq}。C 是 ALPHA {inv}；冒號是 ALPHA {int}。","C4 = 7900. Mean, Min and Max in the same menu work the same way.":"C4 = 7900。同一選單中的 Mean、Min 和 Max 用法相同。"},"zh":{"Learn":"学习","Learn by pressing the keys yourself":"亲手按键，边按边学","Settings, variables and data changed during a lesson are restored when you close this panel.":"课程中更改的设置、变量和统计数据，关闭此面板后会恢复原样。","Lessons":"目录","Show me":"演示","Restart":"重新开始","Next":"下一步","Next lesson":"下一课","This time, press":"这次请按","Well done! Feel free to keep experimenting.":"做得好！可以继续自由尝试。","Close":"关闭","lessons":"课","Basics":"基础","Arithmetic and order of operations":"四则运算与运算顺序","Compute 2+3×4 and 3×(2+5).":"计算 2+3×4 和 3×(2+5)。","Type 2+3×4. The expression appears just as you would write it.":"依次输入 2+3×4。算式会照你书写的样子显示。","Nothing is computed yet. You enter the whole expression first.":"现在还没有计算。先把整个算式输入完。","Press {eq} to compute.":"按 {eq} 进行计算。","The answer is 14: multiplication comes before addition (3×4=12, then 2+12).":"答案是 14：先算乘法再算加法（3×4=12，再算 2+12）。","{ac} clears the expression. Stored values and settings stay.":"{ac} 清除算式。已存储的值和设置会保留。","The screen is empty.":"屏幕已清空。","Use brackets to add first. Enter 3×(2+5) and compute.":"要先算加法，就用括号。输入 3×(2+5) 并计算。","The answer is 21. The brackets were computed first.":"答案是 21。括号里的部分先算了。","Fixing mistakes":"修改错误","Edit an expression with DEL and ◀.":"用 DEL 和 ◀ 修改算式。","Enter 2+5.":"输入 2+5。","Say the 5 was a mistake. {del} deletes the character before the cursor.":"假设 5 输错了。{del} 删除光标前面的一个字符。","The 5 is gone.":"5 被删除了。","Enter 6 and compute.":"输入 6 并计算。","2+6=8.":"2+6=8。","You can still edit after computing. {left} brings the expression back with the cursor at the end.":"计算之后仍然可以修改。按 {left} 回到算式，光标位于末尾。","You are editing the expression again.":"又回到了编辑算式的状态。","Delete the 6, enter 9 and compute again.":"删掉 6，输入 9，再计算一次。","2+9=11. No need to retype long expressions.":"2+9=11。长算式也不必重新输入。","Negative numbers":"负数","Learn the (−) key versus minus, and squaring negatives.":"学习 (−) 键与减号的区别，以及负数的平方。","For a negative number use {neg}, not minus {sub}. Compute (−)3×4.":"输入负数要用 {neg}，不要用减号 {sub}。计算 (−)3×4。","The result is −12.":"结果是 −12。","Now enter −3² as written. Squaring is {sq}.":"现在照原样输入 −3²。平方是 {sq}。","You get −9: the square is taken first, then the sign, just like in maths.":"得到 −9：先算平方，再加负号，和数学规则一样。","For (−3)², wrap it in brackets.":"要算 (−3)²，就用括号括起来。","The answer is 9.":"答案是 9。","Fractions and decimals":"分数与小数","Compute 2/3 + 1/4 as a fraction, then as a decimal.":"把 2/3 + 1/4 算成分数，再化成小数。","{frac} makes a fraction box with the cursor in the numerator. Enter 2.":"{frac} 生成分数框，光标在分子处。输入 2。","Go down to the denominator with {down} and enter 3.":"用 {down} 移到分母，输入 3。","Leave the fraction with {right}, then press +.":"用 {right} 离开分数，再按 +。","Enter 1/4 the same way.":"用同样的方法输入 1/4。","Compute.":"计算。","You get the fraction 11/12. The calculator finds the common denominator and reduces.":"得到分数 11/12。通分和约分由计算器完成。","{sd} switches between fraction and decimal.":"{sd} 在分数和小数之间切换。","0.9166666667. Press it again to get the fraction back.":"0.9166666667。再按一次变回分数。","Roots and powers":"根式与乘方","Compute √8, 2¹⁰ and ∛27, and learn SHIFT.":"计算 √8、2¹⁰ 和 ∛27，并学习 SHIFT 的用法。","Press {sqrt}, enter 8 and compute.":"按 {sqrt}，输入 8 并计算。","You get 2√2, the exact form. Press S⇔D if you want the decimal.":"得到精确形式 2√2。需要小数时按 S⇔D。","Powers use {pow}. Enter 2, press it to get the exponent box, then enter 10.":"乘方用 {pow}。输入 2，按此键出现指数框，再输入 10。","Leave the exponent with {right} and compute.":"用 {right} 离开指数并计算。","2¹⁰ = 1024.":"2¹⁰ = 1024。","Yellow labels above the keys need {shift} first. SHIFT then {sqrt} gives ∛. Compute ∛27.":"按键上方的黄色标记要先按 {shift}。SHIFT 后按 {sqrt} 得到 ∛。计算 ∛27。","The answer is 3. An S lights up on screen while SHIFT is active.":"答案是 3。SHIFT 生效时屏幕上会亮起 S。","Trigonometry and angle units":"三角函数与角度单位","Compute sin 30° and sin⁻¹(0.5).":"计算 sin 30° 和 sin⁻¹(0.5)。","The D at the top means degrees. {sin} enters sin(. Compute sin(30).":"顶部的 D 表示角度单位是度。{sin} 输入 sin(。计算 sin(30)。","The result is 1/2.":"结果是 1/2。","Inverse functions use SHIFT. Compute sin⁻¹(0.5).":"反函数要配合 SHIFT。计算 sin⁻¹(0.5)。","30: the angle whose sine is 0.5. To switch to radians use SHIFT, MENU (SETUP), then 2:Angle Unit.":"30：正弦值为 0.5 的角。要改成弧度，按 SHIFT、MENU（SETUP），再选 2:Angle Unit。","Logarithms":"对数","Compute log₂8, log 100 and ln e.":"计算 log₂8、log 100 和 ln e。","{logb} is a log with a chosen base. Enter base 2, move with {right}, enter 8 and compute.":"{logb} 是可指定底数的对数。底数输入 2，用 {right} 移动，输入 8 并计算。","log₂8 = 3.":"log₂8 = 3。","The common log (base 10) is SHIFT and {neg}. Compute log(100).":"常用对数（底数为 10）是 SHIFT 加 {neg}。计算 log(100)。","The result is 2.":"结果是 2。","The natural log is {ln}. Enter e with {alpha} then {exp}. Compute ln(e).":"自然对数是 {ln}。e 用 {alpha} 再按 {exp} 输入。计算 ln(e)。","The result is 1. Red labels need ALPHA first.":"结果是 1。红色标记要先按 ALPHA。","Ans and variables":"Ans 与变量","Reuse the last answer and store a value in A.":"沿用上一个答案，并把一个值存入 A。","Compute 12×3.":"计算 12×3。","The result is 36.":"结果是 36。","With a result showing, pressing {div} starts with Ans, the last answer. Continue with ÷4.":"显示结果时直接按 {div}，算式会以上一个答案 Ans 开头。接着计算 ÷4。","Ans÷4 = 9.":"Ans÷4 = 9。","To keep a value, store it in a variable. Enter 7, press {sto}, then {neg} (its red label is A).":"要保留一个值，就把它存入变量。输入 7，按 {sto}，再按 {neg}（红色标记为 A）。","7 is stored in A.":"7 已存入 A。","Recall A with ALPHA and {neg}, and compute A×2.":"用 ALPHA 和 {neg} 调出 A，计算 A×2。","14. A variable keeps its value until you store a new one.":"14。变量会一直保留它的值，直到存入新值。","Scientific notation ×10ˣ":"科学记数法 ×10ˣ","Compute 3×10⁸ × 2.":"计算 3×10⁸ × 2。","Enter 3×10⁸ with {exp}: type 3, press it to get the exponent box, then enter 8.":"用 {exp} 输入 3×10⁸：输入 3，按此键出现指数框，再输入 8。","Leave the exponent with {right}, then compute ×2.":"用 {right} 离开指数，再计算 ×2。","600000000. Without leaving the exponent, ×2 would go into the exponent and give a very different number.":"600000000。如果不离开指数，×2 会进入指数，得到完全不同的数。","Equations":"方程","Substituting values with CALC":"用 CALC 代入数值","Evaluate x²+3x at x=2 and x=5.":"求 x²+3x 在 x=2 和 x=5 时的值。","Enter x²+3x. x is the {x} key, squaring is {sq}.":"输入 x²+3x。x 是 {x} 键，平方是 {sq}。","{calc} evaluates the expression for a value you give. Press it.":"{calc} 把你给的值代入算式计算。按一下。","It asks for x.":"它询问 x 的值。","Enter 2 and press {eq}.":"输入 2 并按 {eq}。","At x=2 the value is 10 (4+6).":"x=2 时值为 10（4+6）。","Press {calc} again to try another value. Enter 5 and compute.":"再按 {calc} 可以试另一个值。输入 5 并计算。","At x=5 it is 40. Handy for filling in a table without retyping.":"x=5 时值为 40。填表时不用重新输入算式，很方便。","Solving with SOLVE":"用 SOLVE 解方程","Solve 2x+3=11 with SOLVE.":"用 SOLVE 解 2x+3=11。","SOLVE works on any equation typed on the calculation screen. Enter 2x+3.":"SOLVE 可以解计算界面上输入的任何方程。输入 2x+3。","The equals sign of an equation is {alpha} then {calc} (red =). Add =11.":"方程中的等号是 {alpha} 再按 {calc}（红色 =）。接着输入 =11。","Now it reads 2x+3=11. This equals sign is part of the equation, not the compute key.":"现在显示 2x+3=11。这个等号是方程的一部分，不是计算键。","Press {shift} then {calc} (SOLVE).":"按 {shift} 再按 {calc}（SOLVE）。","It asks for a starting value of x; the search starts from the value x holds now.":"它询问 x 的初始值；从 x 当前的值开始搜索。","Press {eq} to solve.":"按 {eq} 求解。","x=4. L−R=0 underneath means left side minus right side is 0: the solution is exact.":"x=4。下方的 L−R=0 表示左边减右边等于 0：解是精确的。","Choosing a starting value":"选择初始值","Find the negative root of x²=2.":"求 x²=2 的负根。","Enter x²=2. The equals sign is ALPHA and {calc}.":"输入 x²=2。等号是 ALPHA 加 {calc}。","Open SOLVE with SHIFT and {calc}.":"用 SHIFT 和 {calc} 打开 SOLVE。","With two roots (±√2), SOLVE finds the one near the starting value. Enter −1 as the start and press {eq}.":"有两个根（±√2）时，SOLVE 求出靠近初始值的那个。初始值输入 −1，再按 {eq}。","The starting value is now −1.":"初始值现在是 −1。","x=−1.414213562 (−√2). Start from 1 and you get +√2. For several roots, try different starting values.":"x=−1.414213562（−√2）。从 1 开始则得到 +√2。有多个根时，换不同的初始值试试。","Simultaneous equations":"联立方程","Solve 2x+3y=8 and x−y=−1.":"解 2x+3y=8 和 x−y=−1。","Press {menu}. Equation/Func is the 10th app, so choose it with the {neg} key (red A).":"按 {menu}。Equation/Func 是第 10 个应用，所以用 {neg} 键（红色 A）选择。","Now choose the kind of equation.":"现在选择方程的类型。","Choose 1:Simul Equation, then 2 unknowns.":"选择 1:Simul Equation，再选 2 个未知数。","A coefficient table for ax+by=c appears.":"出现 ax+by=c 的系数表。","Enter 2, 3, 8 for 2x+3y=8. Each {eq} moves one cell right.":"输入 2x+3y=8 的系数 2、3、8。每按一次 {eq} 向右移一格。","At the end of a row it moves to the next one.":"到行末会移到下一行。","For x−y=−1 the coefficients are 1, −1, −1. Use {neg} for negatives.":"x−y=−1 的系数是 1、−1、−1。负数用 {neg} 输入。","All coefficients are in.":"系数全部输入完毕。","When no cell is being edited, {eq} solves.":"没有在编辑单元格时，按 {eq} 求解。","x=1.":"x=1。","Press {eq} again for the next unknown.":"再按 {eq} 看下一个未知数。","y=2. Check: 2+6=8 and 1−2=−1.":"y=2。验算：2+6=8，1−2=−1。","Quadratics and the vertex":"二次方程与顶点","Solve x²−5x+6=0 and find the vertex of the parabola.":"解 x²−5x+6=0，并求抛物线的顶点。","Press {menu}, {neg}, then 2:Polynomial and degree 2.":"按 {menu}、{neg}，再选 2:Polynomial 和次数 2。","This is the table for ax²+bx+c=0.":"这是 ax²+bx+c=0 的系数表。","Enter the coefficients 1, −5, 6.":"输入系数 1、−5、6。","x₁=3.":"x₁=3。","Press {eq} for the other root.":"按 {eq} 看另一个根。","x₂=2.":"x₂=2。","Press {eq} twice more for the vertex of y=x²−5x+6.":"再按两次 {eq}，得到 y=x²−5x+6 的顶点。","The vertex is x=2.5, y=−0.25, the minimum: useful for sketching the graph.":"顶点是 x=2.5，y=−0.25，即最小值：画图像时很有用。","When there are no real roots":"没有实数根时","See the complex roots of x²+2x+5=0.":"查看 x²+2x+5=0 的复数根。","Open the quadratic table with {menu}, {neg}, 2, 2.":"用 {menu}、{neg}、2、2 打开二次方程表。","Enter the coefficients 1, 2, 5.":"输入系数 1、2、5。","x₁=−1+2i. The discriminant b²−4ac=−16 is negative, so the roots are complex.":"x₁=−1+2i。判别式 b²−4ac=−16 为负，所以根是复数。","x₂=−1−2i. To see just \"no real roots\" instead, set Equation/Func to Off in SETUP.":"x₂=−1−2i。若只想显示“无实数根”，可在 SETUP 中把 Equation/Func 设为 Off。","Calculus and sums":"微积分与求和","Definite integrals":"定积分","Compute ∫₀² x² dx.":"计算 ∫₀² x² dx。","{int} makes an integral box with the cursor in the integrand. Enter x².":"{int} 生成积分框，光标在被积函数处。输入 x²。","Move with {right} to the lower limit and enter 0, then {right} again to the upper limit and enter 2.":"用 {right} 移到下限并输入 0，再按 {right} 移到上限并输入 2。","8/3 (about 2.667): by hand, x³/3 evaluated from 0 to 2.":"8/3（约 2.667）：手算就是 x³/3 从 0 到 2 的值之差。","Integrating trig functions in radians":"三角函数积分用弧度","Compute ∫₀^π sin x dx.":"计算 ∫₀^π sin x dx。","Calculus with trig functions uses radians. Press {shift}, {menu} (SETUP), then 2:Angle Unit.":"含三角函数的微积分要用弧度。按 {shift}、{menu}（SETUP），再选 2:Angle Unit。","Choose 2:Radian.":"选择 2:Radian。","The indicator at the top changed from D to R.":"顶部的标志从 D 变成了 R。","Press {int} and enter sin(x).":"按 {int} 并输入 sin(x)。","Enter 0 and π as the limits and compute. π is SHIFT then {exp}.":"上下限输入 0 和 π，然后计算。π 是 SHIFT 再按 {exp}。","2. In degree mode the angle would be read in degrees and the answer would be wrong.":"2。如果是角度制，角会按度来理解，答案就错了。","Derivatives at a point":"导数值","Find the derivative of x³ at x=2.":"求 x³ 在 x=2 处的导数值。","SHIFT then {int} gives the derivative. Enter x³ (SHIFT then {sq}).":"SHIFT 再按 {int} 是求导。输入 x³（SHIFT 再按 {sq}）。","Move with {right} to x=, enter 2 and compute.":"用 {right} 移到 x=，输入 2 并计算。","12. The derivative of x³ is 3x², which is 12 at x=2.":"12。x³ 的导数是 3x²，在 x=2 时等于 12。","Sums with Σ":"用 Σ 求和","Sum 1 to 10, then the squares.":"求 1 到 10 的和，再求平方和。","SHIFT then {x} gives Σ. Enter x as the term.":"SHIFT 再按 {x} 得到 Σ。通项输入 x。","Move with {right} to enter the start 1, then {right} again for the end 10, and compute.":"用 {right} 移动，输入起始值 1，再按 {right} 输入终止值 10，然后计算。","1+2+…+10 = 55.":"1+2+…+10 = 55。","Change only the term to get other sums. Sum x² over the same range.":"只改通项就能求其他的和。在同一范围内求 x² 的和。","1²+2²+…+10² = 385. Check it with n(n+1)(2n+1)/6.":"1²+2²+…+10² = 385。用 n(n+1)(2n+1)/6 验算一下。","Statistics":"统计","Enter data and find the mean":"输入数据并求平均数","Find the mean of 4, 7, 9, 6, 4.":"求 4、7、9、6、4 的平均数。","{menu} opens the app list.":"{menu} 打开应用列表。","There are 12 apps.":"共有 12 个应用。","Press 6 to open Statistics.":"按 6 打开 Statistics。","Now choose the kind of statistics.":"现在选择统计的类型。","1:1-Variable is for a single list of data. Press 1.":"1:1-Variable 用于单组数据。按 1。","The data table is open.":"数据表已打开。","Enter the first value 4 and press {eq}.":"输入第一个数 4，按 {eq}。","4 is in row 1 and the cursor moved down.":"4 进入第 1 行，光标下移。","Enter 7, 9, 6 and 4 the same way.":"用同样方法输入 7、9、6、4。","All 5 values are in.":"5 个数据全部输入完毕。","{optn} opens the statistics menu.":"{optn} 打开统计菜单。","3:1-Variable Calc shows the results.":"3:1-Variable Calc 显示结果。","Press 3.":"按 3。","x̄=6 is the mean and Σx=30 the sum. The next lesson reads the rest of the list.":"x̄=6 是平均数，Σx=30 是总和。下一课继续读其余结果。","Reading the results":"读懂结果","Find both standard deviations, the median and quartiles.":"找出两种标准差、中位数和四分位数。","Results for 4, 7, 9, 6, 4 are showing, 4 lines at a time. Press {down} four times.":"4、7、9、6、4 的结果已显示，每屏 4 行。按 {down} 四次。","σx is the population standard deviation (divide by n); sx is the sample one (divide by n−1). Check which one a question asks for.":"σx 是总体标准差（除以 n）；sx 是样本标准差（除以 n−1）。注意题目要求的是哪一个。","Go down four more times.":"再往下按四次。","Med=6 is the median; Q1=4 and Q3=8 are the quartiles.":"Med=6 是中位数；Q1=4 和 Q3=8 是四分位数。","Press {ac} to go back to the data table.":"按 {ac} 回到数据表。","The data is still there, ready to edit and recompute.":"数据还在，可以修改后重新计算。","Editing and deleting data":"修改与删除数据","Change one value, delete another and recompute.":"改一个数，删一个数，再重新计算。","The table holds 4, 7, 9, 6, 4 and the cursor is on empty row 6. Press {up} twice to reach the 6 in row 4.":"表中有 4、7、9、6、4，光标在空的第 6 行。按 {up} 两次到第 4 行的 6。","Row 4 is highlighted.":"第 4 行已高亮。","Enter 8 and press {eq} to replace 6 with 8.":"输入 8 并按 {eq}，把 6 改成 8。","Done. The cursor moved to row 5.":"完成。光标移到了第 5 行。","{del} deletes the whole row under the cursor. Delete the 4 in row 5.":"{del} 删除光标所在的整行。删除第 5 行的 4。","The data is now 4, 7, 9, 8.":"数据现在是 4、7、9、8。","Recompute with {optn} then 3.":"按 {optn} 再按 3 重新计算。","x̄=7 and n=4. Results follow the edited data.":"x̄=7，n=4。结果随修改后的数据而变。","Using frequencies":"使用频数","Mean of 3 people scoring 10, 5 scoring 20, 2 scoring 30.":"3 人得 10 分、5 人得 20 分、2 人得 30 分，求平均分。","Repeated values are quicker with a Freq column. Open the setup first: {shift} then {menu} (SETUP).":"重复的数用 Freq（频数）列更快。先打开设置：{shift} 再按 {menu}（SETUP）。","This is the setup list.":"这是设置列表。","Go to the next page with {down} and pick 3:Statistics.":"用 {down} 翻到下一页，选择 3:Statistics。","It asks whether to show the frequency column.":"它询问是否显示频数列。","Choose 1:On.":"选择 1:On。","The Freq column is on.":"Freq 列已开启。","Open the 1-Variable table with {menu}, 6, 1.":"用 {menu}、6、1 打开 1-Variable 表。","A Freq column now sits next to x.":"x 旁边多了一列 Freq。","Enter the scores 10, 20, 30.":"输入分数 10、20、30。","Each Freq starts at 1.":"每个 Freq 初始都是 1。","Move to Freq with {right}, then up three times with {up} to row 1.":"用 {right} 移到 Freq，再按 {up} 三次到第 1 行。","Enter the counts 3, 5, 2.":"输入人数 3、5、2。","3 people scored 10, 5 scored 20, 2 scored 30.":"3 人得 10 分，5 人得 20 分，2 人得 30 分。","Compute with {optn} then 3.":"按 {optn} 再按 3 计算。","x̄=19 is the mean score; n=10 is the number of people.":"x̄=19 是平均分；n=10 是总人数。","Two variables and regression":"两个变量与回归","Fit y=a+bx to study hours and scores.":"根据学习时间和成绩求回归方程 y=a+bx。","Press {menu}, 6, then choose 2:y=a+bx for paired data.":"按 {menu}、6，再为成对数据选择 2:y=a+bx。","The table has x and y columns.":"表中有 x 和 y 两列。","Enter study hours x: 1, 2, 3, 4, 5.":"输入学习时间 x：1、2、3、4、5。","Move to y with {right}, then press {up} five times to reach row 1.":"用 {right} 移到 y，再按 {up} 五次到第 1 行。","Enter scores y: 2, 4, 5, 4, 5.":"输入成绩 y：2、4、5、4、5。","Press {optn}, then 4:Regression Calc.":"按 {optn}，再选 4:Regression Calc。","a=2.2 and b=0.6, so y=2.2+0.6x. r≈0.775 is the correlation; the closer to ±1, the straighter the data.":"a=2.2，b=0.6，所以 y=2.2+0.6x。r≈0.775 是相关系数，越接近 ±1，数据越接近直线。","Predicting with ŷ":"用 ŷ 预测","Predict the score ŷ for x=6.":"预测 x=6 时的成绩 ŷ。","Last lesson's data is loaded. Press {ac} for the calculation screen; the data and fit stay.":"上一课的数据已载入。按 {ac} 进入计算界面；数据和回归方程会保留。","Enter 6 and press {optn}.":"输入 6 并按 {optn}。","Go to the next page with {down} and choose 4:Regression.":"用 {down} 翻到下一页，选择 4:Regression。","Press {down}, then 1 to insert ŷ.":"按 {down}，再按 1 插入 ŷ。","The expression reads 6ŷ: \"y when x is 6\".":"算式显示 6ŷ：意思是“x 为 6 时的 y”。","5.8 = 2.2+0.6×6. x̂ works the other way, from y to x.":"5.8 = 2.2+0.6×6。x̂ 则相反，由 y 求 x。","Distributions":"概率分布","Normal probability between two values":"正态分布在两值之间的概率","Heights average 170 cm with SD 6 cm: find P(165 ≤ X ≤ 180).":"身高平均 170 cm，标准差 6 cm：求 P(165 ≤ X ≤ 180)。","Open the Distribution app with {menu}, 7.":"用 {menu}、7 打开 Distribution 应用。","Choose a distribution.":"选择一种分布。","2:Normal CD gives the probability between two values. Press 2.":"2:Normal CD 求两个值之间的概率。按 2。","It asks for Lower, Upper, σ (standard deviation) and μ (mean).":"它依次询问 Lower、Upper、σ（标准差）和 μ（平均数）。","Enter Lower 165 and Upper 180; each {eq} moves to the next line.":"输入 Lower 165 和 Upper 180；每按一次 {eq} 移到下一行。","Enter σ=6 and μ=170.":"输入 σ=6 和 μ=170。","With every value in, press {eq} to compute.":"全部输入后，按 {eq} 计算。","P≈0.7499: about 75% are between 165 and 180 cm. No z-table needed.":"P≈0.7499：约 75% 的人在 165 到 180 cm 之间。不用查正态分布表。","Cut-off for the top few percent":"前百分之几的分界值","Find the height that marks the top 5%.":"求进入前 5% 的身高分界值。","Press {menu}, 7, then 3:Inverse Normal.":"按 {menu}、7，再选 3:Inverse Normal。","It works backwards from an area to x.":"它由面积反求 x。","Area is measured from the left. The top 5% starts where the lower 95% ends, so enter 0.95.":"Area 从左侧算起。前 5% 从下方 95% 结束处开始，所以输入 0.95。","Enter σ=6, μ=170 and compute.":"输入 σ=6、μ=170 并计算。","About 179.87 cm: taller than that is the top 5%.":"约 179.87 cm：比这更高就进入前 5%。","Binomial distribution":"二项分布","Toss a coin 10 times: P(exactly 3 heads) and P(at most 3).":"抛硬币 10 次：求恰好 3 次正面的概率和最多 3 次的概率。","Press {menu}, 7, then 4:Binomial PD. PD means \"exactly x times\".":"按 {menu}、7，再选 4:Binomial PD。PD 表示“恰好 x 次”。","List handles many x values at once; Variable handles one.":"List 一次算多个 x；Variable 算一个 x。","Choose 2:Variable.":"选择 2:Variable。","Enter x=3 (heads), N=10 (tosses), p=0.5 (chance of heads).":"输入 x=3（正面次数）、N=10（抛掷次数）、p=0.5（正面的概率）。","0.1171875, about 11.7%.":"0.1171875，约 11.7%。","\"At most 3\" is the cumulative Binomial CD. Press {optn} for the list, then 5 and 2.":"“最多 3 次”是累积的 Binomial CD。按 {optn} 回到列表，再选 5 和 2。","Enter 3, 10, 0.5 again and compute.":"再次输入 3、10、0.5 并计算。","0.171875: the chances of 0, 1, 2 and 3 heads added together.":"0.171875：0、1、2、3 次正面的概率之和。","Matrices":"矩阵","Entering a matrix and its determinant":"输入矩阵与行列式","Enter A=[[2,1],[5,3]] and find its determinant.":"输入 A=[[2,1],[5,3]] 并求它的行列式。","Open the Matrix app with {menu}, 4.":"用 {menu}、4 打开 Matrix 应用。","Choose which matrix to define: MatA to MatD.":"选择要定义的矩阵：MatA 到 MatD。","Choose 1:MatA, then 2 rows and 2 columns.":"选择 1:MatA，再选 2 行 2 列。","A 2×2 grid appears.":"出现一个 2×2 的表格。","Enter 2, 1, 5, 3. Each {eq} moves right, then down to the next row.":"输入 2、1、5、3。每按一次 {eq} 向右移，行末则移到下一行。","A=[[2,1],[5,3]].":"A=[[2,1],[5,3]]。","Go to the calculation screen with {ac}.":"按 {ac} 进入计算界面。","The matrix stays stored.":"矩阵仍然保存着。","Press {optn}, go to the second page with {down}, choose 2:Determinant.":"按 {optn}，用 {down} 翻到第二页，选择 2:Determinant。","Det( is         { say: T('{eq} 로 푸세요.', 'Press {eq} to solve.'), keys: ['eq'], after: T('2<x<3 입니다. 포물선이 x 축 아래에 있는 구간입니다.', '2<x<3: where the parabola is below the x-axis.') },
        { say: T('부등호를 바꿔 봅니다. {ac} 로 계수 표에 돌아간 뒤 {optn} 을 누르면 처음부터 고릅니다. 이어서 2, 1:>0 을 고르세요.', 'Now flip the sign: {ac} returns to the table, then {optn} starts over. Choose 2, then 1:>0.'), keys: ['ac', 'optn', 'n2', 'n1'] },

    { id: 'q2', t: T('비례식', 'Proportions'), goal: T('3:4 = X:12 에서 X 를 구합니다.', 'Find X in 3:4 = X:12.'),

        { say: T('A=3, B=4, D=12 를 넣으세요.', 'Enter A=3, B=4, D=12.'), keys: ['n3', 'eq', 'n4', 'eq', 'n1', 'n2', 'eq'] },
        { say: T('{eq} 로 푸세요.', 'Press {eq} to solve.'), keys: ['eq'], after: T('X=9 입니다. 3×12=4×X 이므로 X=36÷4=9. 요리 분량이나 지도 축척을 바꿀 때 씁니다.', 'X=9, since 3×12=4×X. Handy for scaling recipes or map distances.') },

  ] },
  { id: 'sprd', t: T('스프레드시트', 'Spreadsheet'), lessons: [
    { id: 'p1', t: T('값과 수식 넣기', 'Values and formulas'), goal: T('단가와 수량을 넣고 금액 수식 =A1×B1 을 만듭니다.', 'Enter prices and quantities, then the formula =A1×B1.'),
      steps: [
        { say: T('{menu}, 8 로 Spreadsheet 앱을 여세요.', 'Open the Spreadsheet app with {menu}, 8.'), keys: ['menu', 'n8'], after: T('A~E 열, 1~45 행의 표입니다. 커서는 A1 에 있습니다.', 'Columns A–E, rows 1–45. The cursor is on A1.') },
        { say: T('A 열에 단가 1200, 800, 1500 을 넣으세요. {eq} 를 누르면 아래 칸으로 갑니다.', 'Enter prices 1200, 800, 1500 down column A; {eq} moves down.'), keys: ['n1', 'n2', 'n0', 'n0', 'eq', 'n8', 'n0', 'n0', 'eq', 'n1', 'n5', 'n0', 'n0', 'eq'] },
        { say: T('{right} 로 B 열에 가서 {up} 세 번으로 B1 에 가세요.', 'Move to column B with {right}, then {up} three times to B1.'), keys: ['right', 'up', 'up', 'up'] },
        { say: T('수량 2, 5, 1 을 넣으세요.', 'Enter quantities 2, 5, 1.'), keys: ['n2', 'eq', 'n5', 'eq', 'n1', 'eq'] },
        { say: T('{right}, {up} 세 번으로 C1 에 가세요.', 'Go to C1 with {right} and {up} three times.'), keys: ['right', 'up', 'up', 'up'] },
        { say: T('수식은 = 로 시작합니다(ALPHA {calc}). 칸 이름 A1 은 ALPHA {neg}(A) 다음 1, B1 은 ALPHA {dms}(B) 다음 1 입니다. =A1×B1 을 넣으세요.', 'Formulas start with = (ALPHA {calc}). A1 is ALPHA {neg} (A) then 1; B1 is ALPHA {dms} (B) then 1. Enter =A1×B1.'), keys: ['alpha', 'calc', 'alpha', 'neg', 'n1', 'mul', 'alpha', 'dms', 'n1'] },
        { say: T('{eq} 로 넣으세요.', 'Press {eq} to enter it.'), keys: ['eq'], after: T('C1 이 2400 이 되었습니다. A1 이나 B1 을 고치면 C1 도 저절로 다시 계산됩니다.', 'C1 shows 2400. Change A1 or B1 and C1 recalculates by itself.') },
      ], check: () => cellIs('C1', 2400) },
    { id: 'p2', t: T('수식 채우기와 합계', 'Filling formulas and totals'), goal: T('C1 의 수식을 C3 까지 채우고 합계를 C4 에 냅니다.', 'Fill C1\'s formula down to C3 and total it in C4.'),
      setup: [...SS_DATA, ...SS_C1],
      steps: [
        { say: T('지난 수업의 표가 들어 있습니다. {up} 으로 C1 에 가세요.', 'Last lesson\'s sheet is loaded. Go up to C1 with {up}.'), keys: ['up'] },
        { say: T('{optn} 의 1:Fill Formula 는 여러 칸에 수식을 한꺼번에 넣습니다. 고르세요.', '1:Fill Formula in {optn} fills many cells at once. Choose it.'), keys: ['optn', 'n1'], after: T('Form(수식)과 Range(범위)를 묻습니다.', 'It asks for Form and Range.') },
        { say: T('Form 에 A1×B1 을 넣고 {eq} 로 Range 줄에 가세요.', 'Enter A1×B1 as the Form and press {eq} to go to Range.'), keys: ['alpha', 'neg', 'n1', 'mul', 'alpha', 'dms', 'n1', 'eq'] },
        { say: T('범위는 C1:C1 로 되어 있습니다. {del} 로 끝의 1 을 지우고 3 을 넣어 C1:C3 으로 만든 뒤 {eq}.', 'The range reads C1:C1. Delete the last 1 with {del}, type 3 for C1:C3, then {eq}.'), keys: ['del', 'n3', 'eq'], after: T('C2=4000, C3=1500 이 되었습니다. 수식이 줄마다 A2×B2, A3×B3 으로 알아서 바뀌어 들어갑니다.', 'C2=4000 and C3=1500: the formula shifts to A2×B2 and A3×B3 row by row.') },
        { say: T('{down} 세 번으로 C4 에 가세요.', 'Go down to C4 with {down} three times.'), keys: ['down', 'down', 'down'] },
        { say: T('=Sum( 을 넣습니다. ALPHA {calc} 다음 {optn}, {down}, 4:Sum 입니다.', 'Enter =Sum(: ALPHA {calc}, then {optn}, {down}, 4:Sum.'), keys: ['alpha', 'calc', 'optn', 'down', 'n4'] },
        { say: T('범위 C1:C3 을 넣고 괄호를 닫아 {eq}. C 는 ALPHA {inv}, 쌍점(:)은 ALPHA {int} 입니다.', 'Enter C1:C3, close the bracket and press {eq}. C is ALPHA {inv}; the colon is ALPHA {int}.'), keys: ['alpha', 'inv', 'n1', 'alpha', 'int', 'alpha', 'inv', 'n3', 'rp', 'eq'], after: T('C4 = 7900 입니다. 같은 메뉴의 Mean(평균), Min, Max 도 같은 방법으로 씁니다.', 'C4 = 7900. Mean, Min and Max in the same menu work the same way.') },
      ], check: () => cellIs('C4', 7900) && cellIs('C2', 4000) },
  ] },
];
const LESSONS = COURSES.flatMap(c => c.lessons.map(l => ({ ...l, course: c })));

// ── 키 모양 칩 (본체 키 그림을 그대로 빌림)
const KEYMAP = Object.fromEntries(KEYS.map(k => [k.id, k]));
const ARROW = { up: '▲', down: '▼', left: '◀', right: '▶' };
function chip(id, mod) {
  if (ARROW[id]) return `<span class="kc dp">${ARROW[id]}</span>`;
  const k = KEYMAP[id]; if (!k) return id;
  if (k.t === 'metal') return `<span class="kc mt ${id}">${k.top.replace(/<span class="s">.*?<\/span>/, '')}</span>`;
  const extra = mod === 'shift' && k.s ? `<em class="s">${k.s}</em>` : mod === 'alpha' && k.a ? `<em class="a">${k.a}</em>` : '';
  return `<span class="kc ${k.t === 'fn' ? 'fn' : 'nm ' + k.t.replace('num', '').trim()}">${extra}${k.m || ''}</span>`;
}
const say = s => s.replace(/\{(\w+)\}/g, (_, id) => chip(id));
function keysRow(keys, done) {
  let html = '', mod = null;
  keys.forEach((id, i) => { html += `<span class="kw ${i < done ? 'ok' : i === done ? 'now' : ''}">${chip(id, mod)}</span>`; mod = id === 'shift' || id === 'alpha' ? id : null; });
  return html;
}

// ── 상태
const TUT = { open: false, L: null, si: 0, ki: 0, phase: 'keys', saved: null, auto: false, playing: false, nudge: '', done: new Set() };
try { const o = JSON.parse(localStorage.getItem('wiiiv-scicalc-tut') || '{}'); (o.done || []).forEach(d => TUT.done.add(d)); } catch { /* 없어도 된다 */ }
function tutSave() { try { localStorage.setItem('wiiiv-scicalc-tut', JSON.stringify({ done: [...TUT.done] })); } catch { /* 저장 못 해도 동작 */ } }

const clone = o => JSON.parse(JSON.stringify(o));
const swapStore = (o, n) => { for (const k of Object.keys(o)) delete o[k]; Object.assign(o, n); };
function snapshot() { return { SET: clone(SET), VARS: { ...VARS }, ANS, rows: STAT.rows.slice(), type: STAT.type, mode: U.mode, MAT: { ...MAT }, VCT: { ...VCT }, f: clone(fEd.root), g: clone(gEd.root), ss: SS.cells }; }
function restore() {
  const s = TUT.saved; if (!s) return; TUT.saved = null; TUT_NOSAVE = false;
  SET = s.SET; VARS = s.VARS; ANS = s.ANS; STAT.rows = s.rows; STAT.type = s.type; swapStore(MAT, s.MAT); swapStore(VCT, s.VCT); fEd.load(s.f); gEd.load(s.g); SS.cells = s.ss; SS.cache = {}; applySet();
  powerOn(); const i = MODE_OF.indexOf(s.mode); if (i > 0) pickApp(i); else U.mode = 'calc';
  save(); draw();
}
function autoPress(keys) { TUT.auto = true; try { for (const k of keys) press(k); } finally { TUT.auto = false; } }
function startLesson(L) {
  if (!TUT.saved) TUT.saved = snapshot();
  TUT_NOSAVE = true;
  SET = { ...clone(DEF), contrast: SET.contrast, font: SET.font }; VARS = {}; ANS = VQ(Q(0)); STAT.rows = []; STAT.type = 0; swapStore(MAT, {}); swapStore(VCT, {}); fEd.clear(); gEd.clear(); SS.cells = {}; SS.cache = {}; applySet();
  U.sto = false; powerOn(); pickApp(0);
  autoPress(L.setup || []);
  Object.assign(TUT, { L, si: 0, ki: 0, phase: 'keys', nudge: '', playing: false });
  draw(); render();
}
function stepOf() { return TUT.L && TUT.L.steps[TUT.si]; }
function advance() {        // 키 하나를 맞게 누른 뒤
  const st = stepOf(); TUT.ki++; TUT.nudge = '';
  if (TUT.ki >= st.keys.length) {
    if (TUT.si === TUT.L.steps.length - 1) { TUT.phase = 'done'; TUT.done.add(TUT.L.id); tutSave(); }
    else if (st.after) TUT.phase = 'after';
    else { TUT.si++; TUT.ki = 0; }
  }
  render();
}
function nextStep() { if (TUT.phase !== 'after') return; TUT.si++; TUT.ki = 0; TUT.phase = 'keys'; render(); }
TUT_HOOK = id => {
  if (!TUT.L || TUT.auto || TUT.phase === 'done') return true;
  if (TUT.playing) return false;
  if (TUT.phase === 'after') { nextStep(); }
  const st = stepOf(), want = st.keys[TUT.ki];
  if (id === want) { advance(); return true; }
  TUT.nudge = id; render(); shake(want); return false;
};
async function play() {      // 보여주기: 남은 키를 계산기가 직접 누른다
  if (TUT.playing || !TUT.L || TUT.phase === 'done') return;
  if (TUT.phase === 'after') nextStep();
  TUT.playing = true; render();
  const st = stepOf();
  while (TUT.L && stepOf() === st && TUT.ki < st.keys.length && TUT.playing) {
    const id = st.keys[TUT.ki];
    await new Promise(r => setTimeout(r, 380));
    if (!TUT.playing) break;
    flash(id); autoPress([id]); advance();
  }
  TUT.playing = false; render();
}

// ── 계산기 위 표시
function mark() {
  document.querySelectorAll('.tut-on').forEach(e => e.classList.remove('tut-on'));
  if (!TUT.open || !TUT.L || TUT.phase !== 'keys') return;
  const el = document.querySelector(`#keys [data-id="${stepOf().keys[TUT.ki]}"]`); if (el) el.classList.add('tut-on');
}
function shake(id) { const el = document.querySelector(`#keys [data-id="${id}"]`); if (!el) return; el.classList.remove('tut-shake'); void el.offsetWidth; el.classList.add('tut-shake'); }

// ── 패널
const W = {
  title: T('배우기', 'Learn'), sub: T('키를 직접 눌러 보며 익힙니다', 'Learn by pressing the keys yourself'),
  note: T('수업 중에 바뀐 설정·변수·통계 자료는 패널을 닫으면 원래대로 돌아옵니다.', 'Settings, variables and data changed during a lesson are restored when you close this panel.'),
  list: T('목록', 'Lessons'), show: T('보여주기', 'Show me'), again: T('처음부터', 'Restart'), next: T('다음', 'Next'), nextL: T('다음 수업', 'Next lesson'),
  wrong: T('이번에는 이 키입니다', 'This time, press'), well: T('잘하셨습니다! 이제 자유롭게 눌러 보셔도 됩니다.', 'Well done! Feel free to keep experimenting.'),
  open: T('배우기', 'Learn'), close: T('닫기', 'Close'), lessons: T('수업', 'lessons'),
};
const pane = document.createElement('aside'); pane.id = 'tut'; pane.hidden = true;
document.body.appendChild(pane);
const btn = document.createElement('button'); btn.id = 'tutBtn'; btn.type = 'button';
btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>${tx(W.open)}</span>`;
document.body.appendChild(btn);
btn.addEventListener('click', () => setOpen(true));
function setOpen(on) {
  TUT.open = on; pane.hidden = !on; btn.hidden = on; document.body.classList.toggle('tut-open', on);
  if (!on) { TUT.playing = false; TUT.L = null; restore(); }
  render(); fit();
}
function homeView() {
  let h = `<header><div><b>${tx(W.title)}</b><small>${tx(W.sub)}</small></div><button class="x" data-a="close" aria-label="${tx(W.close)}">×</button></header><div class="tb">`;
  for (const c of COURSES) {
    const n = c.lessons.filter(l => TUT.done.has(l.id)).length;
    h += `<section><h3>${tx(c.t)} <span>${n}/${c.lessons.length}</span></h3><ol>`;
    c.lessons.forEach((l, i) => { h += `<li><button data-a="go" data-l="${l.id}"><i>${TUT.done.has(l.id) ? '✓' : i + 1}</i><span><b>${tx(l.t)}</b><small>${tx(l.goal)}</small></span></button></li>`; });
    h += '</ol></section>';
  }
  return h + `<p class="note">${tx(W.note)}</p></div>`;
}
function lessonView() {
  const L = TUT.L, idx = L.course.lessons.findIndex(x => x.id === L.id) + 1;
  let h = `<header><button class="back" data-a="home">◀ ${tx(W.list)}</button><span class="crumb">${tx(L.course.t)} · ${idx}/${L.course.lessons.length}</span><button class="x" data-a="close" aria-label="${tx(W.close)}">×</button></header><div class="tb">`;
  h += `<h2>${tx(L.t)}</h2><p class="goal">${tx(L.goal)}</p><ol class="steps">`;
  L.steps.forEach((st, i) => {
    if (i > TUT.si) return;
    const cur = i === TUT.si, fin = i < TUT.si || TUT.phase !== 'keys';
    h += `<li class="${cur ? 'cur' : 'past'}${fin ? ' fin' : ''}"><div class="say">${say(tx(st.say))}</div><div class="kseq">${keysRow(st.keys, cur && TUT.phase === 'keys' ? TUT.ki : st.keys.length)}</div>`;
    if (cur && TUT.nudge && TUT.phase === 'keys') { const st2 = stepOf(); h += `<div class="nudge">${tx(W.wrong)} ${chip(st2.keys[TUT.ki], TUT.ki ? (['shift', 'alpha'].includes(st2.keys[TUT.ki - 1]) ? st2.keys[TUT.ki - 1] : null) : null)}</div>`; }
    if (st.after && fin) h += `<div class="after">${say(tx(st.after))}</div>`;
    h += '</li>';
  });
  h += '</ol>';
  if (TUT.phase === 'done') {
    const all = LESSONS, j = all.findIndex(x => x.id === L.id), nx = all[j + 1];
    h += `<div class="done"><p>${tx(W.well)}</p><div class="row"><button data-a="again">${tx(W.again)}</button>${nx ? `<button class="pri" data-a="go" data-l="${nx.id}">${tx(W.nextL)} ▶</button>` : `<button class="pri" data-a="home">${tx(W.list)}</button>`}</div></div>`;
  } else {
    h += `<div class="row ctl"><button data-a="again">${tx(W.again)}</button><button data-a="play" ${TUT.playing ? 'disabled' : ''}>▶ ${tx(W.show)}</button>${TUT.phase === 'after' ? `<button class="pri" data-a="next">${tx(W.next)} ▶</button>` : ''}</div>`;
  }
  return h + '</div>';
}
function render() {
  if (TUT.open) {
    const keepTop = pane.querySelector('.tb') ? pane.querySelector('.tb').scrollTop : 0;
    pane.innerHTML = TUT.L ? lessonView() : homeView();
    const tb = pane.querySelector('.tb');
    if (tb) { if (TUT.L) { const c = tb.querySelector('.steps li.cur, .done'); tb.scrollTop = keepTop; if (c) c.scrollIntoView({ block: 'nearest' }); const d = tb.querySelector('.done'); if (d) d.scrollIntoView({ block: 'nearest' }); } }
  }
  mark();
}
pane.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'close') setOpen(false);
  else if (a === 'home') { TUT.playing = false; TUT.L = null; restore(); render(); }
  else if (a === 'go') startLesson(LESSONS.find(l => l.id === b.dataset.l));
  else if (a === 'again') startLesson(TUT.L);
  else if (a === 'play') play();
  else if (a === 'next') nextStep();
  document.body.focus();
});
// 좁은 화면: 패널이 위에 오고, 계산기는 남은 높이에 맞춘다. 넓은 화면: 패널이 오른쪽.
const wide = matchMedia('(min-width: 900px)');
function fit() {
  const r = document.documentElement.style;
  if (!TUT.open) { r.setProperty('--tut-h', '0px'); r.setProperty('--tut-w', '0px'); return; }
  if (wide.matches) { r.setProperty('--tut-h', '0px'); r.setProperty('--tut-w', (pane.offsetWidth + 40) + 'px'); }
  else { r.setProperty('--tut-w', '0px'); r.setProperty('--tut-h', (pane.offsetHeight + 12) + 'px'); }
}
new ResizeObserver(fit).observe(pane);
wide.addEventListener('change', fit);
// 시험용 (test/t-tutor.py)
window.__tut = { W, MAT, COURSES, LESSONS, TUT, startLesson, autoPress, setOpen, advance };
