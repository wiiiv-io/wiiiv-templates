<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title id="pageTitle">뱀 게임</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #070b0a; overflow: hidden; }
body { font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Hiragino Sans', 'Yu Gothic UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK KR', system-ui, sans-serif; color: #eefaf2; user-select: none; -webkit-user-select: none; touch-action: none; outline: none; }
canvas { display: block; position: fixed; inset: 0; }
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.ov[hidden] { display: none; }
.ov.dim { background: rgba(3, 8, 6, .5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
.card { background: linear-gradient(160deg, rgba(24, 44, 34, .86), rgba(8, 16, 12, .92)); border: 1px solid rgba(120, 240, 170, .18); border-radius: 22px; padding: 24px 24px 20px; width: min(420px, 100%); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .06); max-height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.card::-webkit-scrollbar { display: none; }
.logo { display: block; text-align: center; white-space: nowrap; max-width: 100%; font-weight: 900; font-size: clamp(30px, 9vw, 50px); line-height: 1.1; letter-spacing: .03em; background: linear-gradient(90deg, #c6f24e, #3ee07a 45%, #3ff0d8); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .45)) drop-shadow(0 0 16px rgba(62, 224, 122, .35)); margin: 0 0 4px; }
.logo-snake { display: block; margin: 0 auto 4px; width: 132px; height: 34px; }
.tag { text-align: center; color: #8fb8a0; font-size: 12.5px; letter-spacing: .14em; margin-bottom: 18px; }
.modes { display: grid; gap: 10px; }
.mode { display: flex; align-items: center; gap: 14px; width: 100%; border: 1px solid rgba(120, 240, 170, .16); background: rgba(255, 255, 255, .04); color: inherit; font: inherit; text-align: left; padding: 12px 14px; border-radius: 14px; cursor: pointer; transition: transform .12s, background .2s, border-color .2s; }
.mode:hover, .mode:focus-visible { background: rgba(62, 224, 122, .12); border-color: rgba(120, 240, 170, .5); transform: translateY(-1px); outline: none; }
.mode b { display: block; font-size: 17px; } .mode small { color: #8fb8a0; font-size: 12.5px; line-height: 1.35; display: block; }
.mode .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.mode .ic svg { width: 26px; height: 26px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; font-size: 14px; color: #c5e2d0; }
.row > span:first-child { white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip, .btn { border: 1px solid rgba(120, 240, 170, .2); background: rgba(255, 255, 255, .06); color: inherit; font: inherit; border-radius: 10px; cursor: pointer; }
.chip { padding: 6px 10px; font-size: 12.5px; }
.chip.on { background: linear-gradient(160deg, #3ee07a, #13a896); border-color: transparent; color: #04140a; font-weight: 800; }
.chip.dot { width: 30px; height: 30px; padding: 0; border-radius: 50%; border-width: 2px; }
.chip.dot.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, .25); }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 auto; padding: 11px 10px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn.primary { background: linear-gradient(160deg, #3ee07a, #12a65a); border-color: transparent; color: #03140a; font-weight: 800; box-shadow: 0 8px 20px -8px rgba(62, 224, 122, .7); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.btn:hover { filter: brightness(1.12); }
h2 { font-size: 22px; text-align: center; margin-bottom: 12px; letter-spacing: .04em; }
.big { text-align: center; font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(90deg, #c6f24e, #3ee07a, #3ff0d8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: #8fb8a0; font-size: 13px; margin-top: -2px; }
.newrec { text-align: center; color: #ffd23f; font-weight: 800; letter-spacing: .1em; font-size: 13px; margin-top: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.grid2 { display: grid; grid-template-columns: 1fr auto; gap: 7px 14px; margin-top: 14px; font-size: 14px; color: #c5e2d0; font-variant-numeric: tabular-nums; }
.grid2 b { color: #fff; text-align: right; }
.sl { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: #c5e2d0; }
.sl input { width: 100%; accent-color: #3ee07a; }
.tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
td { padding: 7px 4px; border-bottom: 1px solid rgba(255, 255, 255, .06); } td:last-child { text-align: right; color: #8fb8a0; font-size: 12px; }
td:first-child { color: #3ee07a; font-weight: 800; width: 28px; } td:nth-child(2) { font-weight: 800; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 13.5px; color: #c5e2d0; margin-top: 4px; align-items: center; }
.keys kbd { font: 700 12px ui-monospace, monospace; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .15); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: #fff; justify-self: start; white-space: nowrap; }
.tips { margin-top: 14px; display: grid; gap: 6px; font-size: 12.5px; color: #8fb8a0; line-height: 1.45; }
.tips div::before { content: '•'; color: #3ee07a; margin-right: 6px; }
.hud { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; z-index: 5; display: flex; gap: 6px; }
.hud button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(120, 240, 170, .2); background: rgba(6, 12, 10, .55); color: #dff5e8; font-size: 17px; cursor: pointer; backdrop-filter: blur(4px); display: grid; place-items: center; }
.hud button svg { width: 18px; height: 18px; }
#wlogo { position: fixed; top: calc(17px + env(safe-area-inset-top, 0px)); left: 14px; z-index: 5; height: 26px; width: auto; display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .5)); }
#touch { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: none; padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px)); justify-content: center; align-items: flex-end; pointer-events: none; }
#touch.show { display: flex; }
.pad { display: grid; grid-template-columns: repeat(3, var(--tb)); grid-template-rows: repeat(3, var(--tb)); gap: 6px; pointer-events: auto; }
.tb { width: var(--tb); height: var(--tb); border-radius: 16px; border: 1px solid rgba(120, 240, 170, .3); background: rgba(10, 24, 16, .6); color: #dff5e8; display: grid; place-items: center; touch-action: none; }
.tb svg { width: 42%; height: 42%; }
.tb.on { background: rgba(62, 224, 122, .45); transform: scale(.94); }
.pad .u { grid-area: 1 / 2; } .pad .l { grid-area: 2 / 1; } .pad .r { grid-area: 2 / 3; } .pad .d { grid-area: 3 / 2; }
#boost { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: calc(var(--tb) * 1.4); height: calc(var(--tb) * 1.4); border-radius: 50%; z-index: 6; display: none; border: 2px solid rgba(255, 210, 63, .6); background: rgba(60, 40, 0, .45); color: #ffd23f; font-weight: 900; font-size: 13px; letter-spacing: .05em; touch-action: none; }
#boost.show { display: grid; place-items: center; } #boost.on { background: rgba(255, 210, 63, .45); color: #201400; }
@media (max-height: 640px) { .card { padding: 16px 18px 14px; } .tag { margin-bottom: 10px; } .mode { padding: 9px 12px; } .modes { gap: 7px; } .logo-snake { display: none; } }
</style>
</head>

const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  if (location.pathname.startsWith('/api/v2/wiiivapp/run/')) return 'desktop';   // 바탕화면에 설치한 앱 창 (wiiiv 데스크톱)
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;
    } catch { /* 무시 */ }
  }
  if (WIIIV_CTX !== 'wiiiv' && WIIIV_CTX !== 'desktop' && !img.dataset.wiiivLink) {
    img.dataset.wiiivLink = '1'; img.style.cursor = 'pointer'; img.title = 'wiiiv.ai';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); window.open(`${WIIIV_HOME}/?from=${encodeURIComponent(app)}`, '_blank', 'noopener'); });
  }

}

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const GW = 24, GH = 24;
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// 벽 그리기 도구
function grid() {
  const w = new Uint8Array(GW * GH);
  const g = {
    w,
    set(x, y) { if (x >= 0 && y >= 0 && x < GW && y < GH) w[y * GW + x] = 1; return g; },
    clr(x, y) { if (x >= 0 && y >= 0 && x < GW && y < GH) w[y * GW + x] = 0; return g; },
    rect(x, y, ww, hh) { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) g.set(x + i, y + j); return g; },
    hole(x, y, ww = 1, hh = 1) { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) g.clr(x + i, y + j); return g; },
    box(x, y, ww, hh) { g.rect(x, y, ww, 1).rect(x, y + hh - 1, ww, 1).rect(x, y, 1, hh).rect(x + ww - 1, y, 1, hh); return g; },
    border() { return g.box(0, 0, GW, GH); },
    // 네 방향 대칭으로 같은 사각형
    sym4(x, y, ww, hh) { g.rect(x, y, ww, hh).rect(GW - x - ww, y, ww, hh).rect(x, GH - y - hh, ww, hh).rect(GW - x - ww, GH - y - hh, ww, hh); return g; },
  };
  return g;
}

// ───────────────────────── 아레나 엔진 (곡선으로 움직이는 뱀 여러 마리) ─────────────────────────

// ── 화면 배치
function fitLogo() {

  while (el.scrollWidth > el.clientWidth + 1 && fs > 14) { fs -= 1; el.style.fontSize = fs + 'px'; }
}
function layout() {

  const playing = phase === 'play' && game;
  const pad = playing && touchMode && SET.dpad && mode !== 'arena';
  $('touch').classList.toggle('show', !!pad);

    // 기록: 끝까지 살아남은 판이 먼저, 그다음 순위, 그다음 최대 길이
    rec = { score: mx, rank: g.roundEnd ? rank : 99, info: `${g.roundEnd ? fmt(T.placeN, rank) : '-'} · ${T.ate} ${g.stats.eats}`, date };
  } else {

  }

// 죽을 때 꼬리까지 하나씩 터진다
function stepDie() {

// ── 사건 → 소리·효과 (아레나)

        if (ev.eaten) view.pop(view.W / 2, view.H / 2 - 40, '+' + Math.floor(ev.mass * 5), '#3ee07a', true);

// 컴퓨터가 메뉴 뒤에서 아레나를 보여 준다
function demoStep() { demo.step(); demo.events.length = 0; if (demo.t > 60 * 240) demo = new Arena({ demo: true, bots: 12, seed: (Math.random() * 1e9) | 0 }); }

// ── 키보드
const DKEY = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
const held = new Set();
function arenaKeys() { if (!game || mode !== 'arena' || !held.size) return; let x = 0, y = 0; for (const d of held) { x += DIRV[d][0]; y += DIRV[d][1]; } if (x || y) game.input.ang = Math.atan2(y, x); }
addEventListener('keydown', e => {

addEventListener('keyup', e => {

addEventListener('blur', () => { held.clear(); pauseGame(true); });

// ── 마우스·터치
let mouseMode = false, swipe = null;
const cv = $('cv');

const endPtr = e => { if (joy && joy.id === e.pointerId) joy = null; if (swipe && swipe.id === e.pointerId) swipe = null; if (game && mode === 'arena' && e.pointerType === 'mouse') game.input.boost = false; };

cv.addEventListener('contextmenu', e => e.preventDefault());
document.querySelectorAll('#touch .tb').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); chip.init(); b.classList.add('on'); if (game && phase === 'play' && mode !== 'arena') game.turn(b.dataset.d); });

{ const b = $('boost');

// ── 반복
function loop(now) {

// ── 메뉴 만들기
function toggleMute() { SET.muted = !SET.muted; chip.setMuted(SET.muted); $('bMute').innerHTML = SET.muted ? ICON.off : ICON.on; save(); }

let recTab = 'classic';

}

function build() {

// 준비 화면 안내는 휴대폰이면 '밀어서'
