<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">D-Day 카운터</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 16px; }
.container { width: 100%; max-width: 420px; }
h1 { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 20px; color: #e0e0e0; }

.add-card { background: #161628; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.form-row { margin-bottom: 14px; }
.form-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.form-input { width: 100%; background: #1e1e35; border: 1px solid #2a2a45; color: #fff; border-radius: 10px; padding: 12px 14px; font-size: 15px; font-family: inherit; outline: none; }
.form-input:focus { border-color: #7c5cfc; }
.form-input::placeholder { color: #444; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }

.color-row { display: flex; gap: 8px; }
.color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
.color-dot:hover { transform: scale(1.1); }
.color-dot.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }

.add-btn { width: 100%; background: #7c5cfc; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; margin-top: 4px; }
.add-btn:hover { background: #6a4ce0; }
.add-btn:active { transform: scale(0.98); }

.dday-list { display: flex; flex-direction: column; gap: 12px; }

.dday-card { border-radius: 14px; padding: 20px; position: relative; overflow: hidden; animation: cardIn 0.3s ease; }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.dday-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent); pointer-events: none; }
.dday-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.dday-title { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.95); }
.dday-date { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.dday-remove { background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 16px; padding: 2px 6px; line-height: 1; }
.dday-remove:hover { color: rgba(255,255,255,0.7); }

.dday-count { font-size: 42px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
.dday-count .prefix { font-size: 24px; font-weight: 400; opacity: 0.7; }
.dday-sub { font-size: 13px; color: rgba(255,255,255,0.5); }
.dday-today { font-size: 28px; font-weight: 700; color: rgba(255,255,255,0.95); }

.dday-progress { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); margin-top: 12px; overflow: hidden; }
.dday-progress-fill { height: 100%; border-radius: 2px; background: rgba(255,255,255,0.4); transition: width 0.5s; }

.empty-msg { text-align: center; padding: 48px 20px; color: #444; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <h1>D-Day 카운터</h1>

  <div class="add-card">
    <div class="form-row">
      <div class="form-label">이벤트 이름</div>
      <input class="form-input" id="eventName" type="text" placeholder="시험, 여행, 생일...">
    </div>
    <div class="form-row">
      <div class="form-label">날짜</div>
      <input class="form-input" id="eventDate" type="date">
    </div>
    <div class="form-row">
      <div class="form-label">색상</div>
      <div class="color-row" id="colorRow"></div>
    </div>
    <button class="add-btn" id="addBtn">추가</button>
  </div>

  <div class="dday-list" id="ddayList"></div>
</div>

<script>
const LANG = 'ko';
const COLORS = [
  '#7c5cfc', '#6366f1', '#3b82f6', '#06b6d4',
  '#10b981', '#f59e0b', '#ef4444', '#ec4899',
];
let selectedColor = COLORS[0];
let events = [];

function init() {
  const saved = localStorage.getItem('wiiiv_dday');
  if (saved) {
    try { events = JSON.parse(saved); } catch { events = []; }
  }
  if (events.length === 0) {
    const ny = new Date(new Date().getFullYear() + 1, 0, 1);
    events = [
      { id: 'd1', name: '새해', date: ny.toISOString().split('T')[0], color: '#6366f1' },
    ];
  }

  const today = new Date();
  today.setHours(0,0,0,0);
  const dateInput = document.getElementById('eventDate');
  dateInput.value = new Date(today.getTime() + 30 * 86400000).toISOString().split('T')[0];

  renderColors();
  renderList();
}

function save() {
  localStorage.setItem('wiiiv_dday', JSON.stringify(events));
}

function renderColors() {
  const row = document.getElementById('colorRow');
  row.innerHTML = COLORS.map(c =>
    `<div class="color-dot${c === selectedColor ? ' active' : ''}" style="background:${c}" data-color="${c}"></div>`
  ).join('');
  row.onclick = (e) => {
    const dot = e.target.closest('.color-dot');
    if (!dot) return;
    selectedColor = dot.dataset.color;
    renderColors();
  };
}

function calcDays(dateStr) {
  const target = new Date(dateStr + 'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = target - today;
  return Math.ceil(diff / 86400000);
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
  const wd = weekdays[d.getDay()];
  return `${y}. ${m}. ${day}. (${wd})`;
}

function renderList() {
  const list = document.getElementById('ddayList');
  if (events.length === 0) {
    list.innerHTML = '<div class="empty-msg">아직 등록된 D-Day가 없습니다.<br>위에서 이벤트를 추가하세요.</div>';
    return;
  }

  events.sort((a, b) => {
    const da = Math.abs(calcDays(a.date));
    const db = Math.abs(calcDays(b.date));
    return da - db;
  });

  list.innerHTML = events.map(ev => {
    const days = calcDays(ev.date);
    let countHtml, subHtml;

    if (days > 0) {
      countHtml = `<span class="prefix">D-</span>${days}`;
      subHtml = `${days}일 남음`;
    } else if (days === 0) {
      countHtml = `<span class="dday-today">D-Day!</span>`;
      subHtml = '오늘입니다';
    } else {
      countHtml = `<span class="prefix">D+</span>${Math.abs(days)}`;
      subHtml = `${Math.abs(days)}일 지남`;
    }

    const progressPct = days > 0 ? Math.max(0, Math.min(100, (1 - days / 365) * 100)) : 100;

    return `<div class="dday-card" style="background:${ev.color}">
      <div class="dday-top">
        <div>
          <div class="dday-title">${esc(ev.name)}</div>
          <div class="dday-date">${formatDate(ev.date)}</div>
        </div>
        <button class="dday-remove" data-id="${ev.id}" title="삭제">&times;</button>
      </div>
      <div class="dday-count">${countHtml}</div>
      <div class="dday-sub">${subHtml}</div>
      ${days > 0 ? `<div class="dday-progress"><div class="dday-progress-fill" style="width:${progressPct}%"></div></div>` : ''}
    </div>`;
  }).join('');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('addBtn').onclick = () => {
  const name = document.getElementById('eventName').value.trim();
  const date = document.getElementById('eventDate').value;
  if (!name || !date) return;

  events.push({
    id: 'e' + Date.now(),
    name,
    date,
    color: selectedColor,
  });
  save();
  renderList();
  document.getElementById('eventName').value = '';
};

document.getElementById('ddayList').onclick = (e) => {
  const btn = e.target.closest('.dday-remove');
  if (!btn) return;
  events = events.filter(ev => ev.id !== btn.dataset.id);
  save();
  renderList();
};

init();
</script>
</body>
</html>
