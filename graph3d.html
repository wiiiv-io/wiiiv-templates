<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 함수 그래프</title>
<style>
:root{--bg:#0d0d1a;--panel:#13132a;--panel2:#1a1a35;--line:#29294a;--fg:#e9e8ff;--dim:#9897c2;--acc:#7c5cfc;--acc2:#a993ff;--err:#ff6b81;--chip:#20203f}
body.light{--bg:#eef0f7;--panel:#ffffff;--panel2:#f3f3fa;--line:#dedfee;--fg:#1c1c33;--dim:#6b6b8c;--chip:#ececf7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.45 'Segoe UI','Malgun Gothic',-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
#app{display:flex;height:100%;position:relative}
#side{width:330px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin-left .25s ease;z-index:5}
#side.hide{margin-left:-330px}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.logo{height:28px;width:auto;flex:none;display:block}
/* 11/01 나무님: 갤러리 아래 편집 칸이 멀어 다루기 어렵다 — 「갤러리」·「편집」 두 탭으로 나눔 */
.ptabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:10px 14px 0;background:var(--panel2);padding:3px;border-radius:10px;flex:none}
.ptabs button{border:0;background:none;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--dim)}
.ptabs button:hover{color:var(--fg)}
.ptabs button.on{background:var(--acc);color:#fff}
.scroll[hidden]{display:none}
.brand b{display:block;font-size:15px}.brand small{color:var(--dim);font-size:11px;letter-spacing:.06em}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 18px;scrollbar-width:thin}
/* 10/25 나무님: 가운데 흰 스크롤바가 보기 싫다 — 평소엔 투명, 마우스를 올렸을 때만 화면 색에 맞춘 가는 반투명 막대 */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:rgba(160,180,255,.28) transparent}
::-webkit-scrollbar{width:8px;height:8px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
:hover::-webkit-scrollbar-thumb{background:rgba(160,180,255,.28)}
:hover::-webkit-scrollbar-thumb:hover{background:rgba(160,180,255,.45)}
section{padding-top:14px}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:700}
.cat{font-size:12px;color:var(--acc2);margin:10px 0 6px;font-weight:600}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-1px);border-color:var(--acc)}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card canvas{display:block;width:100%;aspect-ratio:3/2;background:#0b0b18}
body.light .card canvas{background:#e6e8f2}
.card span{display:block;padding:5px 8px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--panel2);padding:3px;border-radius:9px;margin-bottom:10px}
.tabs button{border:0;background:none;padding:6px 2px;border-radius:7px;cursor:pointer;font-size:11.5px;color:var(--dim)}
.tabs button.on{background:var(--acc);color:#fff}
.field{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.field label{flex:none;width:58px;text-align:right;font-family:'Cambria Math','Times New Roman',serif;font-style:italic;font-size:14px;color:var(--dim)}
.field input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:Consolas,'D2Coding',monospace;font-size:12.5px;outline:none}
.field input:focus{border-color:var(--acc)}
.field input.bad{border-color:var(--err)}
.rng{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;color:var(--dim)}
.rng b{width:58px;text-align:right;font-family:'Cambria Math','Times New Roman',serif;font-style:italic;font-size:14px;font-weight:400}
.rng input{width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-family:Consolas,monospace;font-size:12px;outline:none}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:2px}
.lbl{font-size:12px;color:var(--dim);margin:10px 0 6px}
.maps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.maps button{height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.maps button.on{border-color:var(--fg)}
.seg{display:flex;background:var(--panel2);padding:3px;border-radius:9px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:5px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.tg{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12.5px}
.tg.off{opacity:.4;pointer-events:none}
.sw{width:34px;height:19px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:17px}
.tg select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row b{width:34px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{cursor:grab}#gl.drag{cursor:grabbing}
#ov{pointer-events:none}
#eq{position:absolute;left:16px;top:14px;max-width:calc(100% - 150px);pointer-events:none}
#eqName{font-size:12px;color:var(--dim);letter-spacing:.05em;margin-bottom:2px}
.math{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-size:19px;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.35)}
body.light .math{text-shadow:none}
.math i{font-style:italic}.math sup{font-size:.68em;vertical-align:.6em;line-height:0}
.math .fn{font-style:normal}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;margin:0 2px;line-height:1.15}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}.frac>span:last-child{padding:1px 3px 0}
.ov{border-top:1px solid currentColor;padding:0 1px;margin-left:1px}
.eqline{white-space:nowrap}
#tools{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.tb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px);cursor:pointer;font-size:16px;display:grid;place-items:center}
.tb.on{background:var(--acc);border-color:var(--acc);color:#fff}
#params{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);max-width:calc(100% - 24px)}
#params:empty{display:none}
.pv{display:flex;align-items:center;gap:7px;font-size:12.5px}
.pv i{font-family:'Cambria Math','Times New Roman',serif;font-size:15px}
.pv input[type=range]{width:120px;accent-color:var(--acc)}
.pv b{min-width:38px;font-variant-numeric:tabular-nums;font-weight:600}
.pv select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 4px;font-size:12px}
.play{width:30px;height:30px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;font-size:12px}
#hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--dim);pointer-events:none;opacity:.8}
#nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--dim)}
#nogl[hidden]{display:none}   /* display:grid 가 hidden 을 이겨 빈 판이 화면 전체를 덮고 마우스를 가로채던 문제 */
@media (max-width:760px){
  #side{position:absolute;left:0;top:0;bottom:0;box-shadow:8px 0 30px rgba(0,0,0,.4)}
  #hint{display:none}
  #eq{max-width:calc(100% - 130px)}
  .math{font-size:16px}
}
</style>
</head>
<body tabindex="0">
<div id="app">
  <aside id="side">
    <div class="brand"><img class="logo" id="logo"><div><b id="tTitle"></b><small id="tSub"></small></div></div>
    <div class="ptabs" id="paneTabs"><button data-p="paneGal" id="tabGal" class="on"></button><button data-p="paneEdit" id="tabEdit"></button></div>
    <div class="scroll" id="paneGal">
      <section><div id="gallery"></div></section>
    </div>
    <div class="scroll" id="paneEdit" hidden>
      <section><h3 id="hFormula"></h3><div class="tabs" id="modeTabs"></div><div id="editor"></div><div class="err" id="err"></div></section>
      <section><h3 id="hLook"></h3>
        <div class="lbl" id="lMap"></div><div class="maps" id="maps"></div>
        <div class="lbl" id="lStyle"></div><div class="seg" id="styleSeg"></div>
        <div style="height:8px"></div><div id="toggles"></div>
        <div class="row"><span id="lRes"></span><input type="range" id="res" min="20" max="240" step="4"><b id="resV"></b></div>
      </section>
    </div>
  </aside>
  <main id="stage">
    <canvas id="gl"></canvas><canvas id="ov"></canvas>
    <div id="eq"><div id="eqName"></div><div class="math" id="eqMath"></div></div>
    <div id="tools">
      <button class="tb" id="bPanel">☰</button>
      <button class="tb" id="bSpin">↻</button>
      <button class="tb" id="bReset">⟲</button>
    </div>
    <div id="params"></div>
    <div id="hint"></div>
    <div id="nogl" hidden></div>
  </main>
</div>

const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  if (location.pathname.startsWith('/api/v2/wiiivapp/run/')) return 'desktop';   // 바탕화면에 설치한 앱 창 (wiiiv 데스크톱)
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;
    } catch { /* 무시 */ }
  }
  if (WIIIV_CTX !== 'wiiiv' && WIIIV_CTX !== 'desktop' && !img.dataset.wiiivLink) {
    img.dataset.wiiivLink = '1'; img.style.cursor = 'pointer'; img.title = 'wiiiv.ai';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); window.open(`${WIIIV_HOME}/?from=${encodeURIComponent(app)}`, '_blank', 'noopener'); });
  }
  return img;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  if (e.key === 'r' || e.key === 'R') resetView();

const PANE_EDIT = { ko: '그래프 편집', en: 'Edit', ja: '編集', zh: '编辑', 'zh-TW': '編輯', es: 'Editar', fr: 'Modifier', de: 'Bearbeiten', pt: 'Editar', ru: 'Правка', vi: 'Chỉnh sửa' };
function showPane(id) { for (const b of $('paneTabs').children) { const on = b.dataset.p === id; b.classList.toggle('on', on); $(b.dataset.p).hidden = !on; } }
// ── 시작
function init() {
  $('tTitle').textContent = T.title; $('tSub').textContent = T.sub;
  wiiivMark($('logo'), 'graph3d'); $('tabGal').textContent = T.gallery; $('tabEdit').textContent = PANE_EDIT[LG] || PANE_EDIT.en;
  $('paneTabs').onclick = e => { const b = e.target.closest('button[data-p]'); if (b) showPane(b.dataset.p); };
  $('hFormula').textContent = T.formula; $('hLook').textContent = T.look;
  $('lMap').textContent = T.colormap; $('lStyle').textContent = T.style; $('lRes').textContent = T.res; $('hint').textContent = T.hint;
  $('bPanel').title = T.panel; $('bSpin').title = T.spinTip; $('bReset').title = T.resetTip;
  $('modeTabs').innerHTML = ['explicit', 'param', 'curve', 'implicit'].map(m => `<button data-m="${m}">${T.tabs[m]}</button>`).join('');
  $('modeTabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    S.mode = b.dataset.m;
    if (!curData()[S.mode === 'implicit' ? 'f' : 'z']) { loadPreset(PRESETS.find(p => p.cat === S.mode)); return; }
    S.preset = ''; renderEditor(); recompile();
  });
  $('bPanel').onclick = () => { $('side').classList.toggle('hide'); setTimeout(resize, 260); };
  $('bSpin').onclick = () => { S.spin = !S.spin; $('bSpin').classList.toggle('on', S.spin); renderToggles(); };
  $('bSpin').classList.toggle('on', S.spin);
  $('bReset').onclick = resetView;
  $('res').oninput = () => { S.res = +$('res').value; $('resV').textContent = S.res; needBuild = true; zKeep = null; };
  try { R = Renderer(glc, false); }
  catch (e) { $('nogl').hidden = false; $('nogl').textContent = T.nogl; return; }
  if (window.innerWidth < 760) $('side').classList.add('hide');
  new ResizeObserver(resize).observe($('stage')); resize();
  renderGallery();
  loadPreset(PRESETS[0], true);
  renderThumbsAgain();
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (spec && S.play && spec.uses.has('t')) { S.t += dt * S.speed; needBuild = true; const el = $('pT'); if (el) el.textContent = S.t.toFixed(2); }
    if (needBuild) { needBuild = false; build(S.play && spec && spec.uses.has('t')); }
    if (!ptrs.size) {
      if (Math.abs(cam.vaz) + Math.abs(cam.vel) > 0.001) { cam.az += cam.vaz * dt; cam.el = Math.max(-1.45, Math.min(1.45, cam.el + cam.vel * dt)); cam.vaz *= Math.pow(0.02, dt); cam.vel *= Math.pow(0.02, dt); dirty = true; }
      if (S.spin) { cam.az += dt * 0.16; dirty = true; }
    }
    if (dirty) { dirty = false; render(); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

で自動回転をオンにしましょう。","Changing the look":"見た目を変える","Change the colormap, style, contours, background and resolution.":"カラーマップ、表示スタイル、等高線、背景、解像度を変えます。","Under {t:colormap}, pick the fiery one (inferno). Hover a swatch to see its name.":"{t:colormap} で炎のような色（inferno）を選んでください。色見本にマウスを重ねると名前が出ます。","Color shows height: brighter means higher.":"色は高さを表します。明るいほど高い位置です。","Under {t:style}, choose {t:styles.wire}.":"{t:style} で {t:styles.wire} を選んでください。","With mesh only, you can see through to the back.":"メッシュだけにすると、裏側まで透けて見えます。","Turn on {t:contour}.":"{t:contour} をオンにしましょう。","Lines of equal height, just like contour lines on a map.":"同じ高さを結んだ線で、地図の等高線と同じです。","Turn on {t:light}. Good for documents and slides.":"{t:light} をオンにしましょう。資料やスライドに向いています。","Raise {t:res} to 200 or more.":"{t:res} を200以上に上げてください。","Higher resolution is smoother but takes longer to draw.":"解像度が高いほど滑らかですが、描画に時間がかかります。","Drawing formulas":"数式を描く","Your own function z = f(x, y)":"自分の関数 z = f(x, y)","Type a formula and a range to draw a surface.":"数式と範囲を入力して曲面を描きます。","Clear the `z =` box under {t:formula} and type `x^2 - y^2`. ^ means power.":"{t:formula} の `z =` 欄を消して `x^2 - y^2` と入力してください。^ はべき乗です。","A saddle appears. The graph redraws as you type.":"鞍の形が現れます。入力するたびにグラフが描き直されます。","Set the x range to `-2` ~ `2`.":"x の範囲を `-2` ~ `2` にしてください。","Set the y range to `-2` ~ `2` as well.":"y の範囲も `-2` ~ `2` にしてください。","Ranges accept values like `pi` and `2pi` too.":"範囲には `pi` や `2pi` のような値も使えます。","Now type `sin(x) cos(y)`. You can leave out the multiplication sign.":"次は `sin(x) cos(y)` と入力してください。掛け算の記号は省略できます。","Functions like `sin x`, `|x|`, `sqrt`, `exp` and `log` work too.":"`sin x`、`|x|`、`sqrt`、`exp`、`log` などの関数も使えます。","Sliders and moving surfaces":"スライダーと動く曲面","Use a and t in a formula to tune and animate it.":"数式に a と t を使って、形を調整したり動かしたりします。","Type `a cos(r)`. r is the distance from the origin, √(x²+y²).":"`a cos(r)` と入力してください。r は原点からの距離 √(x²+y²) です。","Using a in a formula adds an a slider below the graph. b works the same way.":"数式に a を使うと、グラフの下に a のスライダーが追加されます。b も同様です。","Move the a slider below the graph.":"グラフの下の a スライダーを動かしてみましょう。","The wave height scales with a.":"波の高さが a に比例して変わります。","Now type `cos(r - t)`. t is time, so it runs by itself.":"次は `cos(r - t)` と入力してください。t は時間なので、ひとりでに動きます。","The ripples travel outward.":"波紋が外側へ広がっていきます。","Pause with the ▶/❚❚ button (Space).":"▶/❚❚ ボタン（Space）で一時停止します。","The speed box next to it changes the pace.":"隣の速度欄で速さを変えられます。","Parametric surfaces":"パラメトリック曲面","Stretch a sphere into a rugby ball.":"球を引き伸ばしてラグビーボールにします。","Click the {t:tabs.param} tab.":"{t:tabs.param} タブをクリックしてください。","x, y and z are each given in terms of u and v. For this sphere, u is longitude and v is latitude.":"x、y、z はそれぞれ u と v の式で与えます。この球では u が経度、v が緯度です。","Change `z(u,v)` to `2cos(v)` to stretch it twice as tall.":"`z(u,v)` を `2cos(v)` に変えて、縦に2倍に伸ばしましょう。","Now it is a tall rugby ball.":"縦長のラグビーボールになりました。","Set {t:colorBy} to {t:by.u}.":"{t:colorBy} を {t:by.u} にしてください。","Colors now wrap around by longitude instead of height.":"色が高さではなく経度に沿って一周するようになります。","3D curves and implicit surfaces":"3D曲線と陰関数曲面","Draw a spring curve and a sphere from formulas.":"ばねの曲線と球を数式で描きます。","Click the {t:tabs.curve} tab.":"{t:tabs.curve} タブをクリックしてください。","A curve gives x, y and z in terms of a single s.":"曲線は1つの s で x、y、z を与えます。","Make a spring: `x = cos(s)`, `y = sin(s)`, `z = s/5`.":"ばねを作りましょう：`x = cos(s)`、`y = sin(s)`、`z = s/5`。","Set the s range to `0` ~ `6pi` for three turns.":"s の範囲を `0` ~ `6pi` にすると3回巻きになります。","The {t:tube} slider changes how thick the tube is.":"{t:tube} スライダーでチューブの太さを変えられます。","Click the {t:tabs.implicit} tab.":"{t:tabs.implicit} タブをクリックしてください。","An implicit surface is every point where an equation in x, y and z holds.":"陰関数曲面は、x、y、z の方程式を満たすすべての点です。","Change the equation to `x^2 + y^2 + z^2 = 4`.":"方程式を `x^2 + y^2 + z^2 = 4` に変えてください。","A sphere of radius 2, drawn from the equation alone with no parameters.":"半径2の球です。パラメーターなしで方程式だけから描かれています。"},"pt":{"Learn" "Faça uma mola: `x = cos(s)`, `y = sin(s)`, `z = s/5`.","Set the s range to `0` ~ `6pi` for three turns.":"Defina o intervalo de s como `0` ~ `6pi` para três voltas.","The {t:tube} slider changes how thick the tube is.":"O controle deslizante {t:tube} muda a espessura do tubo.","Click the {t:tabs.implicit} tab.":"Clique na aba {t:tabs.implicit}.","An implicit surface is every point where an equation in x, y and z holds.":"Uma superfície implícita é o conjunto de pontos onde vale uma equação em x, y e z.","Change the equation to `x^2 + y^2 + z^2 = 4`.":"Mude a equação para `x^2 + y^2 + z^2 = 4`.","A sphere of radius 2, drawn from the equation alone with no parameters.":"Uma esfera de raio 2, desenhada só a partir da equação, sem parâmetros."},"ru":{"Learn":"Обучение","Learn the 3D grapher by doing":"Освойте 3D-графопостроитель на практике","Your own graph and view come back when you close this panel.":"Ваш график и вид вернутся, когда вы закроете эту панель.","Lessons":"Уроки","Show me":"Показать","Restart":"Сначала","Next lesson":"Следующий урок","Well done! Feel free to keep experimenting.":"Отлично! Можете продолжать экспериментировать.","Close":"Закрыть","Collapse":"Свернуть","Getting started":"Начало работы","Moving around the graph":"Управление графиком","Rotate, zoom and open another surface from the gallery.":"Вращайте, масштабируйте и откройте другую поверхность из галереи.","Drag the graph to rotate it. On a phone, drag with one finger.":"Перетащите график, чтобы повернуть его. На телефоне проведите одним пальцем.","Flick it and it keeps turning for a moment.":"Если резко смахнуть, он ещё немного покрутится.","Zoom with the mouse wheel. On a phone, pinch with two fingers.":"Масштабируйте колесом мыши. На телефоне сведите или разведите два пальца.","Hold Shift and drag to pan.":"Удерживайте Shift и перетаскивайте, чтобы сдвинуть вид.","Press ⟲ to go back to the starting view. Double-click the graph or press R also works.":"Нажмите ⟲, чтобы вернуться к начальному виду. Также можно дважды щёлкнуть по графику или нажать R.","In the {t:gallery}, click {p:saddle}.":"В разделе {t:gallery} нажмите {p:saddle}.","Every gallery surface is drawn from a formula, shown in the {t:formula} box.":"Каждая поверхность галереи построена по формуле, которая показана в поле {t:formula}.","Turn on auto-rotate with the ↻ button.":"Включите автовращение кнопкой ↻.","Changing the look":"Внешний вид","Change the colormap, style, contours, background and resolution.":"Меняйте цветовую карту, стиль, линии уровня, фон и разрешение.","Under {t:colormap}, pick the fiery one (inferno). Hover a swatch to see its name.":"В разделе {t:colormap} выберите огненную (inferno). Наведите курсор на образец, чтобы увидеть название.","Color shows height: brighter means higher.":"Цвет показывает высоту: чем ярче, тем выше.","Under {t:style}, choose {t:styles.wire}.":"В разделе {t:style} выберите {t:styles.wire}.","With mesh only, you can see through to the back.":"Когда видна только сетка, можно разглядеть заднюю сторону.","Turn on {t:contour}.":"Включите {t:contour}.","Lines of equal height, just like contour lines on a map.":"Линии одинаковой высоты, как горизонтали на карте.","Turn on {t:light}. Good for documents and slides.":"Включите {t:light}. Удобно для документов и слайдов.","Raise {t:res} to 200 or more.":"Увеличьте {t:res} до 200 или больше.","Higher resolution is smoother but takes longer to draw.":"Чем выше разрешение, тем глаже поверхность, но тем дольше она строится.","Drawing formulas":"Построение формул","Your own function z = f(x, y)":"Своя функция z = f(x, y)","Type a formula and a range to draw a surface.":"Введите формулу и диапазон, чтобы построить поверхность.","Clear the `z =` box under {t:formula} and type `x^2 - y^2`. ^ means power.":"Очистите поле `z =` в разделе {t:formula} и введите `x^2 - y^2`. ^ означает степень.","A saddle appears. The graph redraws as you type.":"Появится седло. График перестраивается по мере ввода.","Set the x range to `-2` ~ `2`.":"Задайте диапазон x `-2` ~ `2`.","Set the y range to `-2` ~ `2` as well.":"Задайте и диапазон y `-2` ~ `2`.","Ranges accept values like `pi` and `2pi` too.":"В диапазонах можно использовать и значения вроде `pi` и `2pi`.","Now type `sin(x) cos(y)`. You can leave out the multiplication sign.":"Теперь введите `sin(x) cos(y)`. Знак умножения можно не писать.","Functions like `sin x`, `|x|`, `sqrt`, `exp` and `log` work too.":"Работают и функции вроде `sin x`, `|x|`, `sqrt`, `exp` и `log`.","Sliders and moving surfaces":"Ползунки и движущиеся поверхности","Use a and t in a formula to tune and animate it.":"Используйте a и t в формуле, чтобы настраивать и анимировать её.","Type `a cos(r)`. r is the distance from the origin, √(x²+y²).":"Введите `a cos(r)`. r — расстояние от начала координат, √(x²+y²).","Using a in a formula adds an a slider below the graph. b works the same way.":"Если использовать a в формуле, под графиком появится ползунок a. С b — так же.","Move the a slider below the graph.":"Подвигайте ползунок a под графиком.","The wave height scales with a.":"Высота волны меняется пропорционально a.","Now type `cos(r - t)`. t is time, so it runs by itself.":"Теперь введите `cos(r - t)`. t — это время, поэтому всё движется само.","The ripples travel outward.":"Волны расходятся наружу.","Pause with the ▶/❚❚ button (Space).":"Поставьте на паузу кнопкой ▶/❚❚ (Space).","The speed box next to it changes the pace.":"Поле скорости рядом меняет темп.","Parametric surfaces":"Параметрические поверхности","Stretch a sphere into a rugby ball.":"Растяните сферу в мяч для регби.","Click the {t:tabs.param} tab.":"Откройте вкладку {t:tabs.param}.","x, y and z are each given in terms of u and v. For this sphere, u is longitude and v is latitude.":"x, y и z задаются через u и v. У этой сферы u — долгота, а v — широта.","Change `z(u,v)` to `2cos(v)` to stretch it twice as tall.":"Замените `z(u,v)` на `2cos(v)`, чтобы вытянуть её вдвое по высоте.","Now it is a tall rugby ball.":"Теперь это вытянутый мяч для регби.","Set {t:colorBy} to {t:by.u}.":"Установите {t:colorBy}: {t:by.u}.","Colors now wrap around by longitude instead of height.":"Теперь цвета идут по кругу по долготе, а не по высоте.","3D curves and implicit surfaces":"3D-кривые и неявные поверхности","Draw a spring curve and a sphere from formulas.":"Постройте по формулам пружину и сферу.","Click the {t:tabs.curve} tab.":"Откройте вкладку {t:tabs.curve}.","A curve gives x, y and z in terms of a single s.":"Кривая задаёт x, y и z через один параметр s.","Make a spring: `x = cos(s)`, `y = sin(s)`, `z = s/5`.":"Сделайте пружину: `x = cos(s)`, `y = sin(s)`, `z = s/5`.","Set the s range to `0` ~ `6pi` for three turns.":"Задайте диапазон s `0` ~ `6pi` — получится три витка.","The {t:tube} slider changes how thick the tube is.":"Ползунок {t:tube} меняет толщину трубки.","Click the {t:tabs.implicit} tab.":"Откройте вкладку {t:tabs.implicit}.","An implicit surface is every point where an equation in x, y and z holds.":"Неявная поверхность — это все точки, где выполняется уравнение от x, y и z.","Change the equation to `x^2 + y^2 + z^2 = 4`.":"Замените уравнение на `x^2 + y^2 + z^2 = 4`.","A sphere of radius 2, drawn from the equation alone with no parameters.":"Сфера радиуса 2, построенная только по уравнению, без параметров."},"vi":{"Learn":"Học","Learn the 3D grapher by doing":"Học trình vẽ đồ thị 3D bằng cách làm thử","Your own graph and view come back when you close this panel.":"Đồ thị và góc nhìn của bạn sẽ trở lại khi bạn đóng bảng này.","Lessons":"Bài học","Show me":"Chỉ cho tôi","Restart":"Làm lại","Next lesson":"Bài tiếp theo","Well done! Feel free to keep experimenting.":"Làm tốt lắm! Cứ thoải mái thử nghiệm tiếp nhé.","Close":"Đóng","Collapse":"Thu gọn","Getting started":"Bắt đầu","Moving around the graph":"Điều khiển đồ thị","Rotate, zoom and open another surface from the gallery.":"Xoay, phóng to và mở một mặt khác từ thư viện.","Drag the graph to rotate it. On a phone, drag with one finger.":"Kéo đồ thị để xoay. Trên điện thoại, kéo bằng một ngón tay.","Flick it and it keeps turning for a moment.":"Vuốt mạnh rồi thả, nó sẽ quay thêm một lúc.","Zoom with the mouse wheel. On a phone, pinch with two fingers.":"Phóng to thu nhỏ bằng con lăn chuột. Trên điện thoại, chụm hoặc mở hai ngón tay.","Hold Shift and drag to pan.":"Giữ Shift và kéo để di chuyển khung nhìn.","Press ⟲ to go back to the starting view. Double-click the graph or press R also works.":"Nhấn ⟲ để về góc nhìn ban đầu. Nhấp đúp vào đồ thị hoặc nhấn R cũng được.","In the {t:gallery}, click {p:saddle}.":"Trong {t:gallery}, nhấp vào {p:saddle}.","Every gallery surface is drawn from a formula, shown in the {t:formula} box.":"Mọi mặt trong thư viện đều được vẽ từ một công thức, hiển thị trong ô {t:formula}.","Turn on auto-rotate with the ↻ button.":"Bật tự động xoay bằng nút ↻.","Changing the look":"Thay đổi giao diện","Change the colormap, style, contours, background and resolution.":"Đổi bảng màu, kiểu hiển thị, đường đồng mức, nền và độ phân giải.","Under {t:colormap}, pick the fiery one (inferno). Hover a swatch to see its name.":"Trong {t:colormap}, chọn bảng màu lửa (inferno). Rê chuột lên ô màu để xem tên.","Color shows height: brighter means higher.":"Màu thể hiện độ cao: càng sáng càng cao.","Under {t:style}, choose {t:styles.wire}.":"Trong {t:style}, chọn {t:styles.wire}.","With mesh only, you can see through to the back.":"Khi chỉ có lưới, bạn có thể nhìn xuyên ra phía sau.","Turn on {t:contour}.":"Bật {t:contour}.","Lines of equal height, just like contour lines on a map.":"Các đường nối những điểm cùng độ cao, giống đường đồng mức trên bản đồ.","Turn on {t:light}. Good for documents and slides.":"Bật {t:light}. Phù hợp cho tài liệu và trang trình chiếu.","Raise {t:res} to 200 or more.":"Tăng {t:res} lên 200 trở lên.","Higher resolution is smoother but takes longer to draw.":"Độ phân giải càng cao càng mịn nhưng vẽ lâu hơn.","Drawing formulas":"Vẽ công thức","Your own function z = f(x, y)":"Hàm của riêng bạn z = f(x, y)","Type a formula and a range to draw a surface.":"Nhập công thức và khoảng để vẽ một mặt.","Clear the `z =` box under {t:formula} and type `x^2 - y^2`. ^ means power.":"Xóa ô `z =` trong {t:formula} và nhập `x^2 - y^2`. ^ nghĩa là lũy thừa.","A saddle appears. The graph redraws as you type.":"Một mặt yên ngựa hiện ra. Đồ thị được vẽ lại ngay khi bạn gõ.","Set the x range to `-2` ~ `2`.":"Đặt khoảng x là `-2` ~ `2`.","Set the y range to `-2` ~ `2` as well.":"Đặt khoảng y cũng là `-2` ~ `2`.","Ranges accept values like `pi` and `2pi` too.":"Khoảng cũng nhận các giá trị như `pi` và `2pi`.","Now type `sin(x) cos(y)`. You can leave out the multiplication sign.":"Bây giờ nhập `sin(x) cos(y)`. Bạn có thể bỏ dấu nhân.","Functions like `sin x`, `|x|`, `sqrt`, `exp` and `log` work too.":"Các hàm như `sin x`, `|x|`, `sqrt`, `exp` và `log` cũng dùng được.","Sliders and moving surfaces":"Thanh trượt và mặt chuyển động","Use a and t in a formula to tune and animate it.":"Dùng a và t trong công thức để tinh chỉnh và tạo chuyển động.","Type `a cos(r)`. r is the distance from the origin, √(x²+y²).":"Nhập `a cos(r)`. r là khoảng cách đến gốc tọa độ, √(x²+y²).","Using a in a formula adds an a slider below the graph. b works the same way.":"Dùng a trong công thức sẽ thêm thanh trượt a bên dưới đồ thị. b cũng vậy.","Move the a slider below the graph.":"Di chuyển thanh trượt a bên dưới đồ thị.","The wave height scales with a.":"Độ cao của sóng thay đổi theo a.","Now type `cos(r - t)`. t is time, so it runs by itself.":"Bây giờ nhập `cos(r - t)`. t là thời gian nên nó tự chạy.","The ripples travel outward.":"Các gợn sóng lan ra ngoài.","Pause with the ▶/❚❚ button (Space).":"Tạm dừng bằng nút ▶/❚❚ (Space).","The speed box next to it changes the pace.":"Ô tốc độ bên cạnh dùng để đổi nhịp.","Parametric surfaces":"Mặt tham số","Stretch a sphere into a rugby ball.":"Kéo giãn một mặt cầu thành quả bóng bầu dục.","Click the {t:tab // ───────────────────────── 배우기: 옆 패널 + 따라 하는 수업 ─────────────────────────
// 단계마다 누를 곳(target)이 빛나고, 그래프 상태가 목표(done)대로 되면 다음 단계로 넘어간다. '보여주기'(show)는 앱이 직접 조작.
// 수식 단계는 글자가 아니라 값으로 본다: 여러 점에서 계산해 목표 함수와 같으면 통과(x^2, x², x*x 모두 같음).
// 수업 동안 바꾼 그래프·시점은 패널을 닫으면 돌아온다. 문장은 ko·en 을 여기에, 나머지 언어는 TUT_I18N(영어 문장이 열쇠).
(() => {
  const S_ = (ko, en) => ({ ko, en });
  const tx = o => (o && (o[LG] || (TUT_I18N[LG] && TUT_I18N[LG][o.en]) || o.en)) || '';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lab = path => path.split('.').reduce((o, k) => (o ? o[k] : ''), T) || '';
  const pname = id => { const p = PRESETS.find(q => q.id === id); return p ? L2(p) : id; };
  // {t:이름} → 앱 화면의 그 언어 이름, {p:갤러리 id} → 갤러리 그림 이름, `식` → 수식 글꼴
  const rich = s => esc(s).replace(/\{t:([\w.]+)\}/g, (_, k) => `<b class="tct">${esc(lab(k))}</b>`).replace(/\{p:([\w-]+)\}/g, (_, k) => `<b class="tct">${esc(pname(k))}</b>`).replace(/`([^`]+)`/g, '<code>$1</code>');
  const q = sel => (typeof sel === 'string' ? document.querySelector(sel) : sel);
  const click = sel => { const e = q(sel); if (e) { const pn = e.closest && e.closest('.scroll'); if (pn && pn.hidden) showPane(pn.id); e.click(); } return !!e; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const near = (a, b, e = 1e-6) => Math.abs(a - b) <= e * Math.max(1, Math.abs(b));
  const cv = s => { try { return constVal(String(s)); } catch { return NaN; } };
  const ok = () => !!spec && !$('err').textContent;

  // 수식이 목표 함수와 같은지: 정해 둔 점들에서 값을 비교 (a·b·t 는 시험용 값으로 둔다)
  const PTS = [[0.3, -1.2, 0.7], [1.7, 0.4, -0.9], [-2.1, 1.3, 0.2], [0.9, 2.2, 1.4], [-0.6, -0.8, -1.7], [2.4, -1.9, 0.5], [-1.4, 0.6, 2.1], [1.1, 1.1, -0.3]];
  const TV = { t: 0.7, a: 1.3, b: -0.6 };
  function same(src, mode, target) {
    let f; try { f = fn(String(src).replace(/^\s*[xyz]\s*=/, ''), ALLOW[mode]).f; } catch { return false; }
    const keep = ENV.slice();
    try {
      for (const [p0, p1, p2] of PTS) {
        ENV.fill(0); ENV[SLOT.t] = TV.t; ENV[SLOT.a] = TV.a; ENV[SLOT.b] = TV.b;
        let want;
        if (mode === 'explicit') { ENV[SLOT.x] = p0; ENV[SLOT.y] = p1; ENV[SLOT.r] = Math.hypot(p0, p1); ENV[SLOT.th] = Math.atan2(p1, p0); want = target(p0, p1); }
        else if (mode === 'param') { ENV[SLOT.u] = p0; ENV[SLOT.v] = p1; want = target(p0, p1); }
        else if (mode === 'curve') { ENV[SLOT.s] = p0; want = target(p0); }
        else { ENV[SLOT.x] = p0; ENV[SLOT.y] = p1; ENV[SLOT.z] = p2; want = target(p0, p1, p2); }
        const got = f();
        if (!(Number.isFinite(got) && near(got, want))) return false;
      }
      return true;
    } finally { ENV.set(keep); }
  }
  // 음함수: 좌변−우변이 목표의 상수배이면 같은 곡면
  function sameImplicit(src, target) {
    const sides = String(src).split('='); let L, Rr;
    try { L = fn(sides[0], ALLOW.implicit).f; Rr = sides[1] != null ? fn(sides[1], ALLOW.implicit).f : () => 0; } catch { return false; }
    const keep = ENV.slice(); let k = null;
    try {
      for (const [x, y, z] of PTS) {
        ENV.fill(0); ENV[SLOT.x] = x; ENV[SLOT.y] = y; ENV[SLOT.z] = z;
        const g = L() - Rr(), h = target(x, y, z);
        if (Math.abs(h) < 1e-9) { if (Math.abs(g) > 1e-6) return false; continue; }
        const r = g / h; if (k == null) { if (!Number.isFinite(r) || Math.abs(r) < 1e-9) return false; k = r; } else if (!near(r, k)) return false;
      }
      return k != null;
    } finally { ENV.set(keep); }
  }
  // 칸에 글을 넣고 바로 그리기 (보여주기용)
  function setField(k, v) { const e = q(`#editor input[data-k="${k}"]`); if (!e) return; showPane('paneEdit'); e.value = v; e.dispatchEvent(new Event('input')); e.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' })); }
  function setRange(sel, v) { const e = q(sel); if (!e) return; const pn = e.closest('.scroll'); if (pn && pn.hidden) showPane(pn.id); e.value = v; e.dispatchEvent(new Event('input')); e.dispatchEvent(new Event('change')); }
  const field = k => `#editor input[data-k="${k}"]`;
  // 휴대폰에서 왼쪽 판이 닫혀 있으면 그 안의 곳 대신 ☰ 를 빛낸다
  const inSide = sel => () => { if ($('side').classList.contains('hide')) return '#bPanel'; let t = sel; while (typeof t === 'function') t = t(); const e = q(t), pn = e && e.closest && e.closest('.scroll'); return pn && pn.hidden ? '#paneTabs button[data-p="' + pn.id + '"]' : t; };

    if (TUT.si >= TUT.L.steps.length) { TUT.done.add(TUT.L.id); lsSet('done', [...TUT.done]); }

#tut .steps li{padding:10px 11px;border-radius:10px;border:1px solid var(--line)}
#tut .steps li.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
#tut .steps li.past{opacity:.65}#tut .steps li.past .say::before{content:'✓ ';color:#3ecf8e;font-weight:700}
#tut .after{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
#tut .trow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#tut .trow button{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px}
#tut .trow button:hover{border-color:var(--acc)}#tut .trow button[disabled]{opacity:.45;cursor:default}
#tut .trow .pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;margin-left:auto}
#tut .done p{margin:12px 0 0;color:var(--acc2);font-weight:600}
#tut .tct{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-weight:600;white-space:nowrap}
#tut code{font-family:'Cambria Math',Georgia,serif;font-size:13.5px;background:var(--chip);border-radius:5px;padding:0 5px;white-space:nowrap}
.tut-hl{outline:2px solid #ffcc33!important;outline-offset:2px;animation:tutglow 1.1s ease-in-out infinite}
@keyframes tutglow{50%{outline-color:rgba(255,204,51,.25)}}
@media (prefers-reduced-motion:reduce){.tut-hl{animation:none}}
@media (min-width:900px){body.tut-open #app{margin-right:352px}body.tut-open #tut{right:0;top:0;bottom:0;width:352px;max-height:none;border-radius:0;border-top:0;border-right:0;border-bottom:0;box-shadow:none}}
@media (max-width:760px){#tut{left:8px;right:8px;width:auto;top:auto!important;bottom:8px;max-height:34vh}#tut .steps li.past,#tut .goal{display:none}#tut .tbody{padding:8px 12px 10px}#tut h2{font-size:14px;margin-bottom:6px}#tutBtn{top:auto;bottom:64px;right:10px}}`;
  document.head.appendChild(css);
  const btn = document.createElement('button'); btn.id = 'tutBtn'; btn.type = 'button';

  }
  function homeView() {
    let h = `<header><div><b>${esc(tx(W.title))}</b><small>${esc(tx(W.sub))}</small></div><button class="x" data-a="close" title="${esc(tx(W.close))}">×</button></header><div class="tbody">`;
    for (const c of COURSES) {
      h += `<section><h3>${esc(tx(c.t))} <span>${c.lessons.filter(l => TUT.done.has(l.id)).length}/${c.lessons.length}</span></h3><ol>`;
      c.lessons.forEach((l, i) => { h += `<li><button data-a="go" data-l="${l.id}"><i>${TUT.done.has(l.id) ? '✓' : i + 1}</i><span><b>${esc(tx(l.t))}</b><small>${esc(tx(l.goal))}</small></span></button></li>`; });
      h += '</ol></section>';
    }
    return h + `<p class="note">${esc(tx(W.note))}</p></div>`;
  }
  function lessonView() {

    let h = `<header><button class="back" data-a="home">◀ ${esc(tx(W.list))}</button><span class="crumb">${esc(tx(L.course.t))} · ${idx}/${L.course.lessons.length}</span><button class="x" data-a="fold" title="${esc(tx(W.fold))}">${TUT.fold ? '▾' : '▴'}</button><button class="x" data-a="close" title="${esc(tx(W.close))}">×</button></header><div class="tbody">`;
    h += `<h2>${esc(tx(L.t))}</h2><p class="goal">${esc(tx(L.goal))}</p><ol class="steps">`;
    L.steps.forEach((st, i) => { if (i > TUT.si) return; h += `<li class="${i === TUT.si ? 'cur' : 'past'}"><div class="say">${rich(tx(st.say))}</div>${i < TUT.si && st.after ? `<div class="after">${rich(tx(st.after))}</div>` : ''}</li>`; });
    h += '</ol>';
    if (fin) { const j = LESSONS.findIndex(x => x.id === L.id), nx = LESSONS[j + 1]; h += `<div class="done"><p>${esc(tx(W.well))}</p><div class="trow"><button data-a="again">${esc(tx(W.again))}</button>${nx ? `<button class="pri" data-a="go" data-l="${nx.id}">${esc(tx(W.nextL))} ▶</button>` : `<button class="pri" data-a="home">${esc(tx(W.list))}</button>`}</div></div>`; }
    else h += `<div class="trow"><button data-a="again">${esc(tx(W.again))}</button><button data-a="show" ${TUT.busy ? 'disabled' : ''}>▶ ${esc(tx(W.show))}</button></div>`;
    return h + '</div>';
  }
  function render() {
    if (TUT.open) {
      pane.classList.toggle('fold', !!(TUT.fold && TUT.L));
      pane.innerHTML = TUT.L ? lessonView() : homeView();
      const c = pane.querySelector('.steps li.cur, .done'); if (c) c.scrollIntoView({ block: 'nearest' });
    }
    mark();
  }
  pane.addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b) return; const a = b.dataset.a;
    if (a === 'close') setOpen(false);
    else if (a === 'home') { TUT.L = null; restore(); render(); }
    else if (a === 'go') startLesson(LESSONS.find(l => l.id === b.dataset.l));
    else if (a === 'again') startLesson(TUT.L);
    else if (a === 'show') showMe();
    else if (a === 'fold') { TUT.fold = !TUT.fold; render(); }
  });
  pane.addEventListener('keydown', e => e.stopPropagation());
