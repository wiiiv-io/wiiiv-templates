<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 함수 그래프</title>
<style>
:root{--bg:#0d0d1a;--panel:#13132a;--panel2:#1a1a35;--line:#29294a;--fg:#e9e8ff;--dim:#9897c2;--acc:#7c5cfc;--acc2:#a993ff;--err:#ff6b81;--chip:#20203f}
body.light{--bg:#eef0f7;--panel:#ffffff;--panel2:#f3f3fa;--line:#dedfee;--fg:#1c1c33;--dim:#6b6b8c;--chip:#ececf7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.45 'Segoe UI','Malgun Gothic',-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
#app{display:flex;height:100%;position:relative}
#side{width:330px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin-left .25s ease;z-index:5}
#side.hide{margin-left:-330px}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,#7c5cfc,#4fb3ff,#5effc5,#fdca26,#ff6b9a,#7c5cfc);box-shadow:0 0 14px rgba(124,92,252,.5)}
.brand b{display:block;font-size:15px}.brand small{color:var(--dim);font-size:11px;letter-spacing:.06em}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 18px;scrollbar-width:thin}
section{padding-top:14px}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:700}
.cat{font-size:12px;color:var(--acc2);margin:10px 0 6px;font-weight:600}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-1px);border-color:var(--acc)}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card canvas{display:block;width:100%;aspect-ratio:3/2;background:#0b0b18}
body.light .card canvas{background:#e6e8f2}
.card span{display:block;padding:5px 8px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--panel2);padding:3px;border-radius:9px;margin-bottom:10px}
.tabs button{border:0;background:none;padding:6px 2px;border-radius:7px;cursor:pointer;font-size:11.5px;color:var(--dim)}
.tabs button.on{background:var(--acc);color:#fff}
.field{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.field label{flex:none;width:58px;text-align:right;font-family:'Cambria Math','Times New Roman',serif;font-style:italic;font-size:14px;color:var(--dim)}
.field input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:Consolas,'D2Coding',monospace;font-size:12.5px;outline:none}
.field input:focus{border-color:var(--acc)}
.field input.bad{border-color:var(--err)}
.rng{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;color:var(--dim)}
.rng b{width:58px;text-align:right;font-family:'Cambria Math','Times New Roman',serif;font-style:italic;font-size:14px;font-weight:400}
.rng input{width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-family:Consolas,monospace;font-size:12px;outline:none}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:2px}
.lbl{font-size:12px;color:var(--dim);margin:10px 0 6px}
.maps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.maps button{height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.maps button.on{border-color:var(--fg)}
.seg{display:flex;background:var(--panel2);padding:3px;border-radius:9px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:5px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.tg{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12.5px}
.tg.off{opacity:.4;pointer-events:none}
.sw{width:34px;height:19px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:17px}
.tg select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row b{width:34px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{cursor:grab}#gl.drag{cursor:grabbing}
#ov{pointer-events:none}
#eq{position:absolute;left:16px;top:14px;max-width:calc(100% - 150px);pointer-events:none}
#eqName{font-size:12px;color:var(--dim);letter-spacing:.05em;margin-bottom:2px}
.math{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-size:19px;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.35)}
body.light .math{text-shadow:none}
.math i{font-style:italic}.math sup{font-size:.68em;vertical-align:.6em;line-height:0}
.math .fn{font-style:normal}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;margin:0 2px;line-height:1.15}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}.frac>span:last-child{padding:1px 3px 0}
.ov{border-top:1px solid currentColor;padding:0 1px;margin-left:1px}
.eqline{white-space:nowrap}
#tools{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.tb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px);cursor:pointer;font-size:16px;display:grid;place-items:center}
.tb.on{background:var(--acc);border-color:var(--acc);color:#fff}
#params{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);max-width:calc(100% - 24px)}
#params:empty{display:none}
.pv{display:flex;align-items:center;gap:7px;font-size:12.5px}
.pv i{font-family:'Cambria Math','Times New Roman',serif;font-size:15px}
.pv input[type=range]{width:120px;accent-color:var(--acc)}
.pv b{min-width:38px;font-variant-numeric:tabular-nums;font-weight:600}
.pv select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 4px;font-size:12px}
.play{width:30px;height:30px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;font-size:12px}
#hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--dim);pointer-events:none;opacity:.8}
#nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--dim)}
#nogl[hidden]{display:none}   /* display:grid 가 hidden 을 이겨 빈 판이 화면 전체를 덮고 마우스를 가로채던 문제 */
@media (max-width:760px){
  #side{position:absolute;left:0;top:0;bottom:0;box-shadow:8px 0 30px rgba(0,0,0,.4)}
  #hint{display:none}
  #eq{max-width:calc(100% - 130px)}
  .math{font-size:16px}
}
</style>
</head>
<body tabindex="0">
<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo"></div><div><b id="tTitle"></b><small id="tSub"></small></div></div>
    <div class="scroll">
      <section><h3 id="hGal"></h3><div id="gallery"></div></section>
      <section><h3 id="hFormula"></h3><div class="tabs" id="modeTabs"></div><div id="editor"></div><div class="err" id="err"></div></section>
      <section><h3 id="hLook"></h3>
        <div class="lbl" id="lMap"></div><div class="maps" id="maps"></div>
        <div class="lbl" id="lStyle"></div><div class="seg" id="styleSeg"></div>
        <div style="height:8px"></div><div id="toggles"></div>
        <div class="row"><span id="lRes"></span><input type="range" id="res" min="20" max="240" step="4"><b id="resV"></b></div>
      </section>
    </div>
  </aside>
  <main id="stage">
    <canvas id="gl"></canvas><canvas id="ov"></canvas>
    <div id="eq"><div id="eqName"></div><div class="math" id="eqMath"></div></div>
    <div id="tools">
      <button class="tb" id="bPanel">☰</button>
      <button class="tb" id="bSpin">↻</button>
      <button class="tb" id="bReset">⟲</button>
    </div>
    <div id="params"></div>
    <div id="hint"></div>
    <div id="nogl" hidden></div>
  </main>
</div>
<script>
/*
 * 3D 함수 그래프 — wiiiv App 템플릿 (2026-10-23)
 * macOS Grapher 처럼 수식을 넣으면 3D 곡면을 그린다. 외부 라이브러리 없이 WebGL2 로 직접 그린다.
 * - 네 가지 그래프: z = f(x,y) / 매개변수 곡면 (u,v) / 3D 곡선 (s, 관으로) / 음함수 곡면 f(x,y,z) = 0 (마칭 사면체)
 * - 수식은 eval 없이 자체 해석기로 읽어 함수 나무로 계산한다 (곱셈 기호 생략·sin x·|x| 지원)
 * - 매개변수 a, b 는 슬라이더, t 는 시간 — 식에 쓰면 아래에 조절 막대가 나타난다
 */
const LANG = 'ko';
const T_ALL = {
  ko: {
    title: '3D 함수 그래프', sub: 'FUNCTION SURFACE STUDIO',
    gallery: '함수 갤러리', formula: '수식', look: '모양',
    cats: { explicit: '곡면 z = f(x, y)', param: '매개변수 곡면', curve: '3D 곡선', implicit: '음함수 곡면' },
    tabs: { explicit: 'z = f(x,y)', param: '매개변수', curve: '곡선', implicit: '음함수' },
    colormap: '색상표', style: '표현', styles: { solid: '면', mesh: '면 + 격자', wire: '격자' },
    floor: '바닥에 등고선 투영', contour: '곡면 등고선', box: '상자와 눈금', spin: '자동 회전', light: '밝은 배경', colorBy: '색 기준',
    by: { height: '높이', u: 'u 방향', v: 'v 방향' },
    res: '해상도', tube: '굵기', range: '범위', speed: '속도',
    hint: '드래그 회전 · 휠 확대 · Shift+드래그 이동 · 더블클릭 처음 시점 · Space 재생',
    panel: '패널 열기/닫기', spinTip: '자동 회전', resetTip: '처음 시점',
    nogl: '이 브라우저에서는 WebGL2 를 쓸 수 없어 3D 그래프를 그릴 수 없습니다.',
    e: {
      empty: '식이 비어 있습니다', badChar: '쓸 수 없는 글자: {0}', unknown: '알 수 없는 이름: {0}',
      unexpected: '식을 읽을 수 없습니다 ({0} 근처)', paren: '괄호가 닫히지 않았습니다', arity: '{0} 에는 값이 {1}개 필요합니다',
      notHere: '여기서는 {0} 를 쓸 수 없습니다 (쓸 수 있는 문자: {1})', nothing: '그릴 점이 없습니다 — 식이나 범위를 확인해 주세요',
      range: '범위가 잘못되었습니다', noSurface: '이 범위에서는 f = 0 인 곳이 없습니다 — 범위를 넓혀 보세요',
    },
  },
  en: {
    title: '3D Function Grapher', sub: 'FUNCTION SURFACE STUDIO',
    gallery: 'Gallery', formula: 'Formula', look: 'Appearance',
    cats: { explicit: 'Surfaces z = f(x, y)', param: 'Parametric surfaces', curve: '3D curves', implicit: 'Implicit surfaces' },
    tabs: { explicit: 'z = f(x,y)', param: 'Parametric', curve: 'Curve', implicit: 'Implicit' },
    colormap: 'Colormap', style: 'Style', styles: { solid: 'Solid', mesh: 'Solid + mesh', wire: 'Mesh' },
    floor: 'Contours on floor', contour: 'Surface contours', box: 'Box and ticks', spin: 'Auto rotate', light: 'Light background', colorBy: 'Color by',
    by: { height: 'Height', u: 'u', v: 'v' },
    res: 'Resolution', tube: 'Thickness', range: 'Range', speed: 'Speed',
    hint: 'Drag rotate · Wheel zoom · Shift+drag pan · Double-click reset · Space play',
    panel: 'Toggle panel', spinTip: 'Auto rotate', resetTip: 'Reset view',
    nogl: 'WebGL2 is not available in this browser, so the 3D graph cannot be drawn.',
    e: {
      empty: 'The formula is empty', badChar: 'Unsupported character: {0}', unknown: 'Unknown name: {0}',
      unexpected: 'Cannot read the formula (near {0})', paren: 'A parenthesis is not closed', arity: '{0} needs {1} value(s)',
      notHere: '{0} cannot be used here (allowed: {1})', nothing: 'Nothing to draw — check the formula or range',
      range: 'Invalid range', noSurface: 'No point with f = 0 in this range — try a wider range',
    },
  },
};
// 서버·웹이 넣는 LANG(예: ja, zh-CN, en-US)에 표가 없으면 기본 언어 → 영어 순으로 (없는 언어에서 앱이 깨지던 결함)
const LG = T_ALL[LANG] ? LANG : T_ALL[String(LANG).split('-')[0]] ? String(LANG).split('-')[0] : 'en';
const T = T_ALL[LG];
const fmt = (s, ...a) => s.replace(/\{(\d)\}/g, (_, i) => a[i]);
const L2 = (o) => o[LG] || o.en || o.ko;

// ───────────────────────── 수식 해석기 ─────────────────────────
const F1 = { sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan, sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh, exp: Math.exp, ln: Math.log, log: Math.log10, sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
  sign: Math.sign, floor: Math.floor, ceil: Math.ceil, round: Math.round, sec: x => 1 / Math.cos(x), csc: x => 1 / Math.sin(x), cot: x => 1 / Math.tan(x) };
const F2 = { atan2: Math.atan2, min: Math.min, max: Math.max, pow: Math.pow, mod: (a, b) => a - b * Math.floor(a / b), hypot: Math.hypot };
const CONSTS = { pi: Math.PI, 'π': Math.PI, e: Math.E, tau: 2 * Math.PI };
const SLOT = { x: 0, y: 1, z: 2, u: 3, v: 4, s: 5, t: 6, a: 7, b: 8, r: 9, th: 10 };
const ENV = new Float64Array(11);
const KNOWN = new Set([...Object.keys(F1), ...Object.keys(F2), ...Object.keys(CONSTS), ...Object.keys(SLOT), 'θ']);
class PErr extends Error {}

function lex(src) {
  src = src.replace(/\*\*/g, '^').replace(/[×·]/g, '*').replace(/[−–]/g, '-').replace(/÷/g, '/').replace(/²/g, '^2').replace(/³/g, '^3');
  const out = []; let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === ' ' || c === '\t') { i++; continue; }
    if ((c >= '0' && c <= '9') || c === '.') {
      const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(src.slice(i));
      if (!m) throw new PErr(fmt(T.e.badChar, c));
      out.push({ k: 'n', v: parseFloat(m[0]), p: i }); i += m[0].length; continue;
    }
    if (/[A-Za-zπθ]/.test(c)) {
      let w = /^[A-Za-zπθ]+/.exec(src.slice(i))[0];
      const wd = /^[A-Za-zπθ]+\d+/.exec(src.slice(i));
      if (wd && KNOWN.has(wd[0])) { out.push({ k: 'id', v: wd[0], p: i }); i += wd[0].length; continue; }   // atan2
      // 붙여 쓴 이름은 아는 이름 중 가장 긴 것부터 잘라 읽는다 (xy → x y, 2xsin → x sin)
      let j = 0;
      while (j < w.length) {
        let hit = null;
        for (let n = Math.min(6, w.length - j); n > 0; n--) { const s = w.substr(j, n); if (KNOWN.has(s)) { hit = s; break; } }
        if (!hit) throw new PErr(fmt(T.e.unknown, w));
        out.push({ k: 'id', v: hit === 'θ' ? 'th' : hit, p: i + j }); j += hit.length;
      }
      i += w.length; continue;
    }
    if ('+-*/^(),|'.includes(c)) { out.push({ k: c, p: i }); i++; continue; }
    if (c === '[' || c === '{') { out.push({ k: '(', p: i }); i++; continue; }
    if (c === ']' || c === '}') { out.push({ k: ')', p: i }); i++; continue; }
    throw new PErr(fmt(T.e.badChar, c));
  }
  return out;
}
function parse(src) {
  if (!src.trim()) throw new PErr(T.e.empty);
  const tk = lex(src); let p = 0;
  const peek = k => tk[p] && tk[p].k === k;
  const near = () => tk[p] ? src.slice(tk[p].p, tk[p].p + 6) : '…';
  const expect = k => { if (!peek(k)) throw new PErr(k === ')' ? T.e.paren : fmt(T.e.unexpected, near())); p++; };
  function expr() { let a = term(); while (peek('+') || peek('-')) { const op = tk[p++].k; a = { t: 'bin', op, a, b: term() }; } return a; }
  function term() {
    let a = unary();
    for (;;) {
      if (peek('*') || peek('/')) { const op = tk[p++].k; a = { t: 'bin', op, a, b: unary() }; }
      else if (tk[p] && (tk[p].k === 'id' || tk[p].k === '(' || (tk[p].k === 'n' && a.t !== 'num'))) a = { t: 'bin', op: '*', a, b: power(), imp: true };
      else break;
    }
    return a;
  }
  function unary() { if (peek('-')) { p++; return { t: 'neg', a: unary() }; } if (peek('+')) { p++; return unary(); } return power(); }
  function power() { const b = primary(); if (peek('^')) { p++; return { t: 'bin', op: '^', a: b, b: unary() }; } return b; }
  function primary() {
    const k = tk[p];
    if (!k) throw new PErr(fmt(T.e.unexpected, '…'));
    p++;
    if (k.k === 'n') return { t: 'num', v: k.v };
    if (k.k === '(') { const e = expr(); expect(')'); return e; }
    if (k.k === '|') { const e = expr(); expect('|'); return { t: 'call', f: 'abs', args: [e], bars: true }; }
    if (k.k === 'id') {
      const n = k.v;
      if (F1[n] || F2[n]) {
        let args, pw = null;
        if (F1[n] && peek('^')) { p++; pw = primary(); }     // sin^2 x = (sin x)^2
        if (peek('(')) { p++; args = [expr()]; while (peek(',')) { p++; args.push(expr()); } expect(')'); }
        else args = [power()];                          // sin x, cos 2x 처럼 괄호 없이
        const need = F1[n] ? 1 : (n === 'min' || n === 'max' || n === 'hypot') ? -1 : 2;
        if ((need > 0 && args.length !== need) || (need < 0 && args.length < 2)) throw new PErr(fmt(T.e.arity, n, need > 0 ? need : '2+'));
        const call = { t: 'call', f: n, args };
        return pw ? { t: 'bin', op: '^', a: call, b: pw } : call;
      }
      if (n in CONSTS) return { t: 'const', n };
      return { t: 'var', n };
    }
    p--; throw new PErr(fmt(T.e.unexpected, near()));
  }
  const e = expr();
  if (p < tk.length) throw new PErr(fmt(T.e.unexpected, near()));
  return e;
}
function varsOf(n, set = new Set()) {
  if (n.t === 'var') set.add(n.n);
  if (n.a) varsOf(n.a, set); if (n.b) varsOf(n.b, set); if (n.args) n.args.forEach(x => varsOf(x, set));
  return set;
}
// 함수 나무로 바꾼다. 변수가 없는 부분은 미리 계산해 둔다
function compile(n) {
  if (n.t !== 'num' && varsOf(n).size === 0) { const v = evalConst(n); return () => v; }
  switch (n.t) {
    case 'num': { const v = n.v; return () => v; }
    case 'const': { const v = CONSTS[n.n]; return () => v; }
    case 'var': { const i = SLOT[n.n]; return () => ENV[i]; }
    case 'neg': { const f = compile(n.a); return () => -f(); }
    case 'call': {
      const fs = n.args.map(compile);

  if (p.cat === 'explicit') S.ex = { z: p.z, xr: [...p.xr], yr: [...p.yr] };
  if (p.cat === 'param') S.pa = { x: p.x, y: p.y, z: p.z, ur: [...p.ur], vr: [...p.vr], by: p.by || 'height', rr: p.rr || [1, 1] };
  if (p.cat === 'curve') S.cu = { x: p.x, y: p.y, z: p.z, sr: [...p.sr], tube: p.tube };
  if (p.cat === 'implicit') S.im = { f: p.f, L: p.L };
  S.res = p.res; S.cmap = p.cmap; S.style = p.style || 'mesh';
  S.a = p.a ?? 1; S.b = p.b ?? 1; S.aR = p.aR || [-3, 3]; S.bR = p.bR || [-3, 3]; S.t = 0;
  $('res').value = S.res; $('resV').textContent = S.res;
  R.setMap(S.cmap); renderMaps(); renderStyle(); renderEditor();
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('on', c.dataset.id === p.id));
  if (!keepView) { const az = cam.az; Object.assign(cam, CAM0); cam.az = az; }
  recompile();
  if (window.innerWidth < 760) $('side').classList.add('hide');
}
function renderMaps() {
  $('maps').innerHTML = Object.keys(CMAPS).map(k => `<button title="${k}" data-c="${k}" class="${k === S.cmap ? 'on' : ''}" style="background:${cssGrad(k)}"></button>`).join('');
  $('maps').querySelectorAll('button').forEach(b => b.onclick = () => { S.cmap = b.dataset.c; R.setMap(S.cmap); renderMaps(); dirty = true; });
}
function renderStyle() {
  $('styleSeg').innerHTML = ['solid', 'mesh', 'wire'].map(k => `<button data-s="${k}" class="${k === S.style ? 'on' : ''}">${T.styles[k]}</button>`).join('');
  $('styleSeg').querySelectorAll('button').forEach(b => b.onclick = () => { S.style = b.dataset.s; renderStyle(); dirty = true; });
}

// ── 갤러리와 미리보기 그림
const thumbs = [];
function renderGallery() {
  let h = '';
  for (const cat of ['explicit', 'param', 'curve', 'implicit']) {
    h += `<div class="cat">${T.cats[cat]}</div><div class="gal">` + PRESETS.filter(p => p.cat === cat).map(p => `<div class="card" data-id="${p.id}"><canvas width="240" height="160"></canvas><span>${L2(p)}</span></div>`).join('') + '</div>';
  }
  $('gallery').innerHTML = h;
  $('gallery').querySelectorAll('.card').forEach(c => c.onclick = () => loadPreset(PRESETS.find(p => p.id === c.dataset.id)));
}
function renderThumbsAgain() { thumbs.length = 0; PRESETS.forEach(p => thumbs.push(p)); setTimeout(thumbStep, 60); }
function thumbStep() {
  const p = thumbs.shift(); if (!p) return;
  try {
    if (!RT) { const c = document.createElement('canvas'); c.width = 240; c.height = 160; RT = Renderer(c, true); RT.canvas = c; }
    const sp = compileSpec(p.cat, p.cat === 'explicit' ? { z: p.z, xr: p.xr, yr: p.yr } : p.cat === 'param' ? { ...p, by: p.by || 'height', rr: p.rr || [1, 1] } : p.cat === 'curve' ? p : { f: p.f, L: p.L });
    const res = p.cat === 'implicit' ? 36 : p.cat === 'curve' ? 40 : Math.min(70, p.res);
    const g = buildGeo(sp, res, { t: 0.6, a: p.a ?? 1, b: p.b ?? 1 });
    RT.setGeo(g); RT.setMap(p.cmap); const [L, s] = lineData(g, S.light); RT.setLines(L, s);
    const c = { ...CAM0, tz: (g.floorZ + g.topZ) / 2, dist: 4.1 }, v = viewOf(c, 240, 160), [b0, b1] = bgColors();
    RT.draw({ ...v, bg0: b0, bg1: b1, fill: S.light ? [0.95, 0.95, 0.99] : [0.06, 0.055, 0.12], style: (p.style || 'mesh') === 'solid' ? 0 : 1, contour: false, light: S.light, floorProj: true });
    const card = document.querySelector(`.card[data-id="${p.id}"] canvas`);
    if (card) card.getContext('2d').drawImage(RT.canvas, 0, 0);
  } catch (e) { /* 미리보기 하나가 실패해도 나머지는 그린다 */ }
  setTimeout(thumbStep, 16);
}

// ── 마우스·터치
const ptrs = new Map(); let lastPinch = 0, dragMoved = false;
glc.addEventListener('pointerdown', e => { glc.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, tm: performance.now(), shift: e.shiftKey || e.button === 2 }); glc.classList.add('drag'); cam.vaz = cam.vel = 0; dragMoved = false; });
glc.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y, now = performance.now(), dts = Math.max(0.008, (now - p.tm) / 1000);
  p.x = e.clientX; p.y = e.clientY; p.tm = now;
  if (Math.abs(dx) + Math.abs(dy) > 1) dragMoved = true;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) cam.dist = Math.min(14, Math.max(1.4, cam.dist * lastPinch / d)); lastPinch = d;
  } else if (p.shift) {
    const v = viewOf(cam, VW, VH), k = cam.dist * 0.0016;
    cam.tx -= (v.R[0] * dx - v.U[0] * dy) * k; cam.ty -= (v.R[1] * dx - v.U[1] * dy) * k; cam.tz -= (v.R[2] * dx - v.U[2] * dy) * k;
  } else {
    cam.az -= dx * 0.008; cam.el = Math.max(-1.45, Math.min(1.45, cam.el + dy * 0.008));
    // 손을 뗄 때의 속도로 조금 더 돈다 — 이벤트 간격으로 나눠 실제 속도, 너무 세지 않게 상한
    const k = 0.35, vmax = 4;
    cam.vaz = Math.max(-vmax, Math.min(vmax, cam.vaz * (1 - k) + (-dx * 0.008 / dts) * k));
    cam.vel = Math.max(-vmax, Math.min(vmax, cam.vel * (1 - k) + (dy * 0.008 / dts) * k));
  }
  dirty = true;
});
const up = e => {
  const p = ptrs.get(e.pointerId); if (p && performance.now() - p.tm > 90) cam.vaz = cam.vel = 0;   // 멈췄다가 놓으면 관성 없음
  ptrs.delete(e.pointerId); lastPinch = 0; if (!ptrs.size) glc.classList.remove('drag'); };
glc.addEventListener('pointerup', up); glc.addEventListener('pointercancel', up);
glc.addEventListener('contextmenu', e => e.preventDefault());
glc.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.min(14, Math.max(1.4, cam.dist * Math.exp(e.deltaY * 0.0012))); dirty = true; }, { passive: false });
glc.addEventListener('dblclick', resetView);
function resetView() { Object.assign(cam, CAM0); if (scene) cam.tz = (scene.floorZ + scene.topZ) / 2; dirty = true; }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); if (spec && spec.uses.has('t')) togglePlay(); }
  if (e.key === 'r' || e.key === 'R') resetView();
});

// ── 시작
function init() {
  $('tTitle').textContent = T.title; $('tSub').textContent = T.sub;
  $('hGal').textContent = T.gallery; $('hFormula').textContent = T.formula; $('hLook').textContent = T.look;
  $('lMap').textContent = T.colormap; $('lStyle').textContent = T.style; $('lRes').textContent = T.res; $('hint').textContent = T.hint;
  $('bPanel').title = T.panel; $('bSpin').title = T.spinTip; $('bReset').title = T.resetTip;
  $('modeTabs').innerHTML = ['explicit', 'param', 'curve', 'implicit'].map(m => `<button data-m="${m}">${T.tabs[m]}</button>`).join('');
  $('modeTabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    S.mode = b.dataset.m;
    if (!curData()[S.mode === 'implicit' ? 'f' : 'z']) { loadPreset(PRESETS.find(p => p.cat === S.mode)); return; }
    S.preset = ''; renderEditor(); recompile();
  });
  $('bPanel').onclick = () => { $('side').classList.toggle('hide'); setTimeout(resize, 260); };
  $('bSpin').onclick = () => { S.spin = !S.spin; $('bSpin').classList.toggle('on', S.spin); renderToggles(); };
  $('bSpin').classList.toggle('on', S.spin);
  $('bReset').onclick = resetView;
  $('res').oninput = () => { S.res = +$('res').value; $('resV').textContent = S.res; needBuild = true; zKeep = null; };
  try { R = Renderer(glc, false); }
  catch (e) { $('nogl').hidden = false; $('nogl').textContent = T.nogl; return; }
  if (window.innerWidth < 760) $('side').classList.add('hide');
  new ResizeObserver(resize).observe($('stage')); resize();
  renderGallery();
  loadPreset(PRESETS[0], true);
  renderThumbsAgain();
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (spec && S.play && spec.uses.has('t')) { S.t += dt * S.speed; needBuild = true; const el = $('pT'); if (el) el.textContent = S.t.toFixed(2); }
    if (needBuild) { needBuild = false; build(S.play && spec && spec.uses.has('t')); }
    if (!ptrs.size) {
      if (Math.abs(cam.vaz) + Math.abs(cam.vel) > 0.001) { cam.az += cam.vaz * dt; cam.el = Math.max(-1.45, Math.min(1.45, cam.el + cam.vel * dt)); cam.vaz *= Math.pow(0.02, dt); cam.vel *= Math.pow(0.02, dt); dirty = true; }
      if (S.spin) { cam.az += dt * 0.16; dirty = true; }
    }
    if (dirty) { dirty = false; render(); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
// 틀 안에서 처음엔 크기가 0 일 수 있다 — 자리가 잡히면 시작
(function boot() { const r = $('stage').getBoundingClientRect(); if (r.width < 10 || r.height < 10) { requestAnimationFrame(boot); return; } init(); })();
window.__g = { S, cam, PRESETS, loadPreset, get scene() { return scene; }, get spec() { return spec; }, parse, H };
</script>
