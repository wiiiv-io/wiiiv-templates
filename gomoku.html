<div class="ov" id="result" hidden style="align-items:flex-end;padding-bottom:6%;background:rgba(10,7,5,.35);backdrop-filter:none"><div class="pcard" style="width:min(360px,100%)"><h2 id="resTitle"></h2><div class="sub" id="resSub"></div><div class="newrec" id="resNew" hidden></div><div class="grid2" id="resGrid"></div><button class="btn wide" id="bShare" hidden></button><div class="foot"><button class="btn" id="bResMenu"></button><button class="btn" id="bResLook"></button><button class="btn primary" id="bAgain"></button></div></div></div>
<script>
// ───────────────────────── 오목 엔진 · AI (화면과 무관, 일꾼 스레드에서도 돈다) ─────────────────────────
const N = 15, EMPTY = 0, BLACK = 1, WHITE = 2;
const DIRS4 = [[1, 0], [0, 1], [1, 1], [1, -1]];
const other = p => 3 - p;
const inside = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
// ── 한 줄 모양 판정: 가운데(4번 자리)에 내 돌을 둔 9칸 줄 → 모양
// 글자: x 내 돌, _ 빈칸, o 막힘(상대 돌·판 밖)
const SHAPE = { NONE: 0, TWO_C: 1, TWO: 2, THREE_C: 3, THREE: 4, FOUR: 5, FOUR_OPEN: 6, FIVE: 7, OVER: 8 };
const shapeMemo = [new Map(), new Map()];
function classifyLine(key, exact) {
  const memo = shapeMemo[exact ? 1 : 0]; let r = memo.get(key); if (r !== undefined) return r;
  r = SHAPE.NONE;
  // 가운데를 지나는 연속 길이
  let L = 4, R = 4; while (L > 0 && key[L - 1] === 'x') L--; while (R < 8 && key[R + 1] === 'x') R++;
  const run = R - L + 1;
  if (run >= 6 && exact) r = SHAPE.OVER;
  else if (run >= 5) r = SHAPE.FIVE;
  else {
    // 한 수로 다섯이 되는 빈칸 수
    const fives = [];
    for (let i = 0; i < 9; i++) if (key[i] === '_') { const k2 = key.slice(0, i) + 'x' + key.slice(i + 1); if (lineFive(k2, exact)) fives.push(i); }
    if (fives.length >= 2) r = SHAPE.FOUR_OPEN;
    else if (fives.length === 1) r = SHAPE.FOUR;
    else {
      let best = SHAPE.NONE;
      for (let i = 0; i < 9; i++) if (key[i] === '_') {
        const k2 = key.slice(0, i) + 'x' + key.slice(i + 1), s = classifyLine(k2, exact);
        if (s === SHAPE.FOUR_OPEN) best = Math.max(best, SHAPE.THREE);
        else if (s === SHAPE.FOUR) best = Math.max(best, SHAPE.THREE_C);
        else if (s === SHAPE.THREE) best = Math.max(best, SHAPE.TWO);
        else if (s === SHAPE.THREE_C) best = Math.max(best, SHAPE.TWO_C);
      }
      // 두는 돌이 셋 이상 이어져야 진짜 모양 (가운데를 지나는 것만)
      r = best;
    }
  }
  memo.set(key, r); return r;
}
function lineFive(key, exact) { let L = 4, R = 4; while (L > 0 && key[L - 1] === 'x') L--; while (R < 8 && key[R + 1] === 'x') R++; const run = R - L + 1; return exact ? run === 5 : run >= 5; }

class Board {
  constructor(o = {}) { this.c = new Uint8Array(N * N); this.moves = []; this.renju = !!o.renju; }
  clone() { const b = new Board({ renju: this.renju }); b.c.set(this.c); b.moves = this.moves.slice(); return b; }
  at(x, y) { return inside(x, y) ? this.c[y * N + x] : -1; }
  // (x,y) 에 p 를 둔다고 보고 한 방향 9칸 줄 글자
  lineKey(x, y, dx, dy, p) {
    let s = '';
    for (let k = -4; k <= 4; k++) { if (!k) { s += 'x'; continue; } const v = this.at(x + dx * k, y + dy * k); s += v === p ? 'x' : v === EMPTY ? '_' : 'o'; }
    return s;
  }
  shapes(x, y, p) { const exact = this.renju && p === BLACK; return DIRS4.map(([dx, dy]) => classifyLine(this.lineKey(x, y, dx, dy, p), exact)); }
  // 렌주 규칙: 흑의 금수 (삼삼 · 사사 · 장목). 다섯이 되면 금수가 아니다
  forbidden(x, y) {
    if (!this.renju || this.c[y * N + x] !== EMPTY) return null;
    const sh = this.shapes(x, y, BLACK);
    if (sh.includes(SHAPE.FIVE)) return null;
    if (sh.includes(SHAPE.OVER)) return 'over';
    const fours = sh.filter(s => s === SHAPE.FOUR || s === SHAPE.FOUR_OPEN).length;
    if (fours >= 2) return '44';
    const threes = sh.filter(s => s === SHAPE.THREE).length;
    if (threes >= 2) return '33';
    return null;
  }
  play(x, y, p) { this.c[y * N + x] = p; this.moves.push([x, y, p]); }
  undo() { const m = this.moves.pop(); if (m) this.c[m[1] * N + m[0]] = EMPTY; return m; }
  // 방금 둔 돌로 이겼나 → 다섯 줄 좌표
  winLine(x, y) {
    const p = this.c[y * N + x]; if (!p) return null; const exact = this.renju && p === BLACK;
    for (const [dx, dy] of DIRS4) {
      const line = [[x, y]]; let k = 1; while (this.at(x + dx * k, y + dy * k) === p) line.push([x + dx * k, y + dy * k]), k++;
      k = 1; while (this.at(x - dx * k, y - dy * k) === p) line.unshift([x - dx * k, y - dy * k]), k++;
      if (exact ? line.length === 5 : line.length >= 5) return line;
    }
    return null;
  }
  full() { return this.moves.length >= N * N; }
}

// ── 수 평가: 내가 두면 얼마나 좋은가 (공격) + 상대가 두면 얼마나 나쁜가 (수비)
const SCORE = [0, 10, 60, 120, 900, 1500, 12000, 1e6, -1];
function moveScore(b, x, y, p) {
  if (b.c[y * N + x] !== EMPTY) return -Infinity;
  if (p === BLACK && b.forbidden(x, y)) return -Infinity;
  const sh = b.shapes(x, y, p); let s = 0, fours = 0, threes = 0;
  for (const v of sh) { if (v === SHAPE.OVER) { if (b.renju && p === BLACK) return -Infinity; continue; } s += SCORE[v]; if (v === SHAPE.FOUR || v === SHAPE.FOUR_OPEN) fours++; if (v === SHAPE.THREE) threes++; }
  if (sh.includes(SHAPE.FIVE)) return 1e7;
  if (fours >= 2 || (fours && threes)) s += 50000;      // 사사 · 사삼 = 다음 수에 이김
  else if (threes >= 2) s += 8000;                       // 삼삼
  return s;
}
function bestReply(b, p) { let m = 0; for (const [x, y] of candidates(b)) { const v = moveScore(b, x, y, p); if (v > m) m = v; } return m; }
function candidates(b, dist = 2) {
  const out = [], seen = new Uint8Array(N * N);
  if (!b.moves.length) return [[7, 7]];
  for (const [mx, my] of b.moves) for (let dy = -dist; dy <= dist; dy++) for (let dx = -dist; dx <= dist; dx++) {
    const x = mx + dx, y = my + dy; if (!inside(x, y)) continue; const i = y * N + x; if (seen[i] || b.c[i]) continue; seen[i] = 1; out.push([x, y]);
  }
  return out;
}
function ranked(b, p, k = 14) {
  const o = other(p), list = [];
  for (const [x, y] of candidates(b)) {
    const a = moveScore(b, x, y, p); if (a === -Infinity) continue;
    const d = moveScore(b, x, y, o); const s = a + Math.max(0, d === -Infinity ? 0 : d) * 0.85;
    list.push({ x, y, s, a, d });
  }
  list.sort((m, n) => n.s - m.s); return list.slice(0, k);
}
// 판 전체 점수 (p 입장): 양쪽의 가장 좋은 수 몇 개로 어림
function evaluate(b, p) {
  const o = other(p); let mine = 0, theirs = 0;
  const cs = candidates(b);
  const ma = [], ta = [];
  for (const [x, y] of cs) { const a = moveScore(b, x, y, p), d = moveScore(b, x, y, o); if (a > 0) ma.push(a); if (d > 0) ta.push(d); }
  ma.sort((a, c) => c - a); ta.sort((a, c) => c - a);
  for (let i = 0; i < 3; i++) { mine += (ma[i] || 0) / (i + 1); theirs += (ta[i] || 0) / (i + 1); }
  return mine - theirs * 1.1;
}
// ── 연속 사(四) 공격으로 이기는 길 찾기 (VCF): 내가 계속 사를 두고 상대는 막을 수밖에 없을 때
function fourMoves(b, p) {
  const out = [];
  for (const [x, y] of candidates(b, 2)) {
    if (p === BLACK && b.forbidden(x, y)) continue;
    const sh = b.shapes(x, y, p);
    if (sh.includes(SHAPE.FIVE)) return [{ x, y, five: true }];
    if (sh.some(s => s === SHAPE.FOUR || s === SHAPE.FOUR_OPEN)) out.push({ x, y, open: sh.includes(SHAPE.FOUR_OPEN) });
  }
  return out;
}
function fiveSpot(b, p) { for (const [x, y] of candidates(b, 1)) { if (p === BLACK && b.renju && b.forbidden(x, y)) continue; if (b.shapes(x, y, p).includes(SHAPE.FIVE)) return [x, y]; } return null; }
function vcf(b, p, depth, deadline) {
  if (depth <= 0 || Date.now() > deadline) return null;
  for (const m of fourMoves(b, p)) {

    const L = ch[0].len; const at = {}; ch.forEach(c => { if (c.len !== L) console.warn('track length', S.name, c.k, c.len, L); c.ev.forEach(e => { (at[e.t] = at[e.t] || []).push({ ...e, k: c.k }); }); });
    this.song = { S, at, L, step: 0, next: this.ctx.currentTime + 0.08, loops: 0, id };
  }
  stop() { this.song = null; }
  pause(p) { this.paused = p; if (!p && this.song && this.ctx) this.song.next = this.ctx.currentTime + 0.05; }
  pump() {
    const sg = this.song; if (!sg || this.paused || !this.ctx) return;
    const c = this.ctx, ahead = c.currentTime + 0.12;
    if (sg.next < c.currentTime - 0.25) sg.next = c.currentTime + 0.02;     // 탭이 잠들었다 깨면 따라잡지 않고 이어서
    while (sg.next < ahead) {
      const S = sg.S, accel = S.accel ? Math.min(1.6, Math.pow(S.accel, sg.loops)) : 1;
      const sp = 60 / (S.bpm * this.tempo * accel) / 4;      // 16분음표 길이(초)
      const evs = sg.at[sg.step];
      if (evs) for (const e of evs) {
        const d = e.len * sp;
        if (e.k === 'noi') {
          if (e.n === 'k') { this.noise(this.mus, sg.next, 0.09, 0.32, { type: 'lowpass', freq: 900, fto: 120 }); this.tone(this.mus, 'tri', 140, sg.next, 0.07, 0.35, { to: 50, sweep: 0.07, rel: 0.01 }); }
          else if (e.n === 's') this.noise(this.mus, sg.next, 0.12, 0.2, { type: 'bandpass', freq: 2200 });
          else if (e.n === 'h') this.noise(this.mus, sg.next, 0.035, 0.07, { type: 'highpass', freq: 7000 });
        } else {
          const f = midiHz(noteMidi(e.n));
          if (e.k === 'p1') this.tone(this.mus, S.duty[0], f, sg.next, d * 0.92, 0.13, { vib: true, decay: 0.75 });
          else if (e.k === 'p2') this.tone(this.mus, S.duty[1], f, sg.next, d * 0.8, 0.065, { decay: 0.5 });
          else this.tone(this.mus, 'tri', f, sg.next, d * 0.85, 0.3, {});
        }
      }
      if (sg.step % 4 === 0) { const when = sg.next; this.beatCbs.forEach(cb => cb(when, sg.step % (S.bar) === 0)); }
      sg.next += sp; sg.step++;
      if (sg.step >= sg.L) { sg.step = 0; sg.loops++; }
    }
  }
  onBeat(cb) { this.beatCbs.push(cb); }
  // ── 효과음
  sfx(name, a = {}) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + 0.005, F = this.fx;
    const arp = (notes, step, wave = 0.5, vol = 0.16, len) => notes.forEach((n, i) => this.tone(F, wave, midiHz(typeof n === 'number' ? n : noteMidi(n)), t + i * step, len || step * 1.6, vol, { decay: 0.4 }));
    switch (name) {
      case 'stone': this.noise(F, t, 0.06, 0.35, { type: 'bandpass', freq: a.white ? 2600 : 2100, fto: 900 }); this.tone(F, 'tri', a.white ? 330 : 280, t, 0.05, 0.35, { to: 140, sweep: 0.05, rel: 0.01 }); break;
      case 'win': arp(['C5', 'E5', 'G5', 'C6', 'G5', 'C6', 'E6', 'G6'], 0.08, 0.5, 0.14, 0.3); break;
      case 'lose': [72, 69, 65, 64, 60].forEach((m, i) => this.tone(F, 0.5, midiHz(m), t + i * 0.14, 0.15, 0.12, { decay: 0.5 })); break;
      case 'forbid': this.tone(F, 0.5, 160, t, 0.12, 0.12, { to: 120, sweep: 0.12 }); this.tone(F, 0.5, 170, t + 0.14, 0.12, 0.1, { to: 120, sweep: 0.12 }); break;
      case 'hint': arp([84, 88, 91], 0.05, 0.125, 0.08); break;
      case 'threat': arp([88, 84], 0.07, 0.125, 0.06); break;
      case 'undo': this.tone(F, 0.25, 900, t, 0.07, 0.07, { to: 500, sweep: 0.07 }); break;
      case 'menu': this.tone(F, 0.25, 1000, t, 0.03, 0.06, { rel: 0.01 }); break;
      case 'select': arp([76, 83], 0.05, 0.25, 0.1); break;
    }
  }
}

  $('bShare').onclick = () => {
    const rec = ST.puzzles[G.date]; if (!rec) return; const txt = `wiiiv ${T.title} · ${T.puzzle} ${G.date}\n${rec.ok ? '✅ ' + T.solved : '❌ ' + T.failed} · ${rec.used}/${rec.n}`;
    const fb = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch { /* 무시 */ } ta.remove(); toast(T.copied); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(T.copied), fb); else fb();
  };
}
build(); buildMenu(); layout(); showOnly('menu');

G = { mode: 'human', b: new Board(), turn: BLACK, over: true }; for (const [x, y, p] of [[7, 7, 1], [8, 6, 2], [8, 8, 1], [6, 6, 2], [9, 9, 1], [7, 8, 2], [6, 8, 1], [9, 7, 2], [10, 10, 1], [5, 5, 2]]) G.b.play(x, y, p); draw(); G = null;
addEventListener('pointerdown', () => chip.init(), { capture: true, once: true });
requestAnimationFrame(loop);
document.body.focus();
window.__gm = { get G() { return G; }, get phase() { return phase; }, get thinking() { return thinking; }, newGame, startPuzzle, humanMove, undo, hint, toMenu, ST };
