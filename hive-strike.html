    for (let i = 0; i < Math.min(w.lives, 6); i++) { const im = makeSprite('ship'); b.drawImage(im, 4 + i * 16, SH - 15); }
    // 스테이지 깃발 (50·30·20·10·5·1 큰 것부터)
    this.drawFlags(w.flagShown ?? w.stage);
    // 점수 띄우기
    this.pops = this.pops.filter(p => (p.t += 1) < 70);
    for (const p of this.pops) this.text(String(p.n), p.x, p.y - 2, '#4fc8ff', 'center', 0.75);
    // 가운데 글
    for (const m of ui.msgs) this.text(m.str, SW / 2, m.y, m.col || '#4fc8ff', 'center', m.size || 1);
  }
  drawBeam(e, f) {
    const b = this.b, h = 100 * e.beamH, top = e.y + 8;
    for (let y = 0; y < h; y++) {
      const k = y / 100, half = 6 + k * 16;
      if ((y + Math.floor(f / 2)) % 4 === 3) continue;
      const band = Math.floor((y - f * 0.8) / 6) % 3;
      b.fillStyle = band === 0 ? '#4fc8ff' : band === 1 || band === -1 ? '#b25cff' : '#ffffff';
      b.globalAlpha = 0.85; b.fillRect(Math.round(e.x - half), Math.round(top + y), Math.round(half * 2), 1);
    }
    b.globalAlpha = 1;
  }
  drawFlags(n) {
    const b = this.b; let x = SW - 4; n = n % 256;
    const kinds = [[50, '#ff4fd8', 14], [30, '#b25cff', 13], [20, '#2ee870', 12], [10, '#ffe02a', 11], [5, '#ff2a3a', 10], [1, '#4fc8ff', 8]];
    const list = []; for (const [v, col, h] of kinds) while (n >= v) { list.push([col, h]); n -= v; }
    for (const [col, h] of list.reverse()) {
      x -= h <= 8 ? 6 : 9; if (x < SW / 2) break;
      b.fillStyle = '#c8d4ff'; b.fillRect(x, SH - 2 - h, 1, h);                       // 깃대
      b.fillStyle = col; for (let i = 0; i < 4; i++) b.fillRect(x + 1, SH - 2 - h + i, Math.max(1, (h > 8 ? 6 : 4) - i), 1);   // 삼각 깃발
      b.fillStyle = '#ffffff'; b.fillRect(x + 1, SH - 2 - h + 1, 1, 1);
    }
  }
  drawFx() {
    // 폭발: 하얀 섬광 → 별 모양 빛살 → 사방으로 튀는 파편 → 깜빡이며 사라지는 불티
    const b = this.b, px = (x, y, w, h, c) => { b.fillStyle = c; b.fillRect(Math.round(x), Math.round(y), w, h); };
    this.fx = this.fx.filter(e => (e.t += 1) < (e.kind === 'player' ? 80 : e.kind === 'boss' ? 36 : 28));
    for (const e of this.fx) {
      const big = e.kind === 'player', boss = e.kind === 'boss', t = e.t, S = big ? 1.8 : boss ? 1.3 : 1;
      const main = e.color || '#ffe02a';
      // 1) 섬광
      if (t < 5) { const r = (2 + t) * S; for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); px(e.x - w, e.y + y, w * 2, 1, t < 2 ? '#ffffff' : '#ffe02a'); } }
      // 2) 빛살 8개
      if (t < 16) { const L = Math.min(10, 2 + t) * S, cols = ['#ffffff', main, '#ff2a3a', '#ffe02a'];
        for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + (big ? t * 0.05 : 0); for (let d = Math.max(1, L - 5 * S); d < L; d++) px(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, d < L - 2 ? 2 : 1, d < L - 2 ? 2 : 1, cols[(i + Math.floor(t / 3)) % 4]); } }
      // 3) 파편 (2×2, 무작위 방향·속도)
      let s = e.seed; const n = big ? 40 : boss ? 22 : 16;
      for (let i = 0; i < n; i++) {
        s = (s * 9301 + 49297) % 233280; const a = s / 233280 * 6.283; s = (s * 9301 + 49297) % 233280; const v = 0.35 + (s / 233280) * 0.65;
        const d = (3 + t * 0.85 * v * (big ? 1.4 : 1)) * S, life = big ? 80 : 28;
        if (t > life * 0.6 && (t + i) % 3 === 0) continue;           // 끝무렵 깜빡임
        if (t > life * 0.85) continue;
        const c = [main, '#ffffff', '#ff2a3a', '#ffe02a', '#4fc8ff'][i % 5], sz = t < life * 0.5 ? 2 : 1;
        px(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d + (big ? t * t * 0.004 : 0), sz, sz, c);
      }
      // 4) 전투기 폭발: 퍼지는 고리
      if (big && t > 6 && t < 40) { const r = (t - 6) * 1.1; for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283; if ((i + t) % 2) px(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r * 0.8, 1, 1, t < 24 ? '#ffe02a' : '#ff2a3a'); } }
    }
  }
}

  "resume": "Tiếp tục",
  "restart": "Chơi lại",
  "toMenu": "Về menu",
  "again": "Chơi lại",
  "menu": "Menu",
  "newRec": "★ KỶ LỤC MỚI ★",
  "none": "Chưa có kỷ lục",
  "sv": "Âm lượng hiệu ứng",
  "autofire": "Giữ để bắn liên tục",
  "scan": "Đường quét",
  "glow": "Phát sáng",
  "on": "Bật",
  "off": "Tắt",
  "stage": "MÀN {n}",
  "ready": "SẴN SÀNG",
  "challenge": "MÀN THỬ THÁCH",
  "hits": "SỐ LẦN TRÚNG",
  "bonus": "THƯỞNG",
  "perfect": "HOÀN HẢO!",
  "special": "THƯỞNG ĐẶC BIỆT 10000 ĐIỂM",
  "captured": "PHI CƠ BỊ BẮT",
  "over": "KẾT THÚC",
  "results": "- KẾT QUẢ -",
  "shots": "SỐ PHÁT BẮN",
  "ratio": "TỈ LỆ TRÚNG",
  "score": "ĐIỂM",
  "hiscore": "ĐIỂM CAO",
  "keys": [
   [
    "← →",
    "Di chuyển"
   ],
   [
    "Space / Z",
    "Bắn"
   ],
   [
    "Esc / P",
    "Tạm dừng"
   ],
   [
    "M",
    "Tắt tiếng"
   ]
  ]
 }
};

// ───────────────────────── 메뉴·흐름·조작 ─────────────────────────
const LANG = 'ko';
const T = (() => { const l = String(LANG || 'en'); if (/^zh-(TW|HK|MO|Hant)/i.test(l)) return TX['zh-TW']; return TX[l] || TX[l.split('-')[0].toLowerCase()] || TX.en; })();
document.documentElement.lang = LANG;
const $ = id => document.getElementById(id);
const coarse = matchMedia('(pointer: coarse)').matches;
const DEF = { sv: 0.7, autofire: coarse, scan: true, glow: true, muted: false };
let SET = { ...DEF }, BEST = [];
try { const d = JSON.parse(localStorage.getItem('wiiiv-hive') || '{}'); SET = { ...DEF, ...(d.set || {}) }; BEST = d.best || []; } catch { /* 저장소 없이도 동작 */ }
const save = () => { try { localStorage.setItem('wiiiv-hive', JSON.stringify({ set: SET, best: BEST })); } catch { /* 무시 */ } };
const chip = new Chip(); chip.setVol(0, SET.sv); chip.muted = SET.muted;
const scr = new Screen($('cv')); scr.opts = { scan: SET.scan, glow: SET.glow };
let world = null, demo = null, phase = 'menu', acc = 0, last = performance.now(), msgs = [], overT = 0, lastDive = 0, touchMode = false;
const fmt = (s, n) => s.replace('{n}', n);
function msg(str, ticks, y = 150, col = '#4fc8ff', size = 1) { msgs.push({ str, until: ticks, y, col, size }); }

// 제목이 창 너비를 넘지 않게 글자 크기를 맞춘다
function fitLogo() {
  const el = $('logo'); if (!el || $('menu').hidden) return;
  el.style.fontSize = ''; let fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && fs > 12) { fs -= 1; el.style.fontSize = fs + 'px'; }
}
function layout() {
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  touchMode = coarse || W < 600;
  const tb = Math.round(Math.max(54, Math.min(76, W / 6.5)));
  document.documentElement.style.setProperty('--tb', tb + 'px');
  $('touch').classList.toggle('show', touchMode && phase === 'play');
  scr.resize(W, H, dpr, { ctrlH: touchMode && phase === 'play' ? tb * 1.35 + 24 : 0 });
  fitLogo();
}
addEventListener('resize', layout);

// ── 게임
function startGame() {
  chip.init(); world = new World({ autofire: SET.autofire }); world.t = -110; world.flagShown = 0;
  phase = 'play'; msgs = []; overT = 0; scr.fx = []; scr.pops = [];
  showOnly(null); layout(); chip.jingle('start');
}
function showOnly(id) { for (const k of ['menu', 'settings', 'records', 'help', 'pause', 'result']) $(k).hidden = k !== id; $('touch').classList.toggle('show', touchMode && phase === 'play'); }
function toMenu() { phase = 'menu'; world = null; msgs = []; showOnly('menu'); layout(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLogo);
function pauseGame(p) {
  if (!world) return;
  if (p && phase === 'play') { phase = 'pause'; showOnly('pause'); ['left', 'right', 'fire'].forEach(k => world.setInput(k, false)); world.input.tx = null; }
  else if (!p && phase === 'pause') { phase = 'play'; showOnly(null); last = performance.now(); }
}
function finishGame() {
  const w = world, ratio = w.shotsFired ? Math.min(100, Math.floor(w.hits / w.shotsFired * 1000) / 10) : 0;
  w.enemies = []; w.bombs = []; w.shots = [];        // 결과 화면은 깨끗하게
  const rec = { score: w.score, stage: w.stage, ratio, date: new Date().toISOString().slice(0, 10) };
  BEST.push(rec); BEST.sort((a, b) => b.score - a.score); BEST.splice(5); save();
  phase = 'results';
  msgs = [];
  msg(T.results, 1e9, 110, '#ff2a3a');
  msg(`${T.shots}  ${w.shotsFired}`, 1e9, 136, '#ffe02a');
  msg(`${T.hits}  ${w.hits}`, 1e9, 152, '#ffe02a');
  msg(`${T.ratio}  ${ratio.toFixed(1)} %`, 1e9, 168, '#ffffff');
  $('resNew').hidden = BEST[0] !== rec || rec.score === 0; $('resNew').textContent = T.newRec;
  setTimeout(() => { if (phase === 'results') showOnly('result'); }, 700);
}

// ── 사건 → 소리·효과
function handle(ev) {
  const w = world;
  switch (ev.type) {
    case 'shoot': chip.sfx('shoot'); break;
    case 'kill': scr.boom(ev.x, ev.y, ev.et === 'boss' ? 'boss' : 'enemy', ev.et === 'boss' ? '#2ee870' : ev.et === 'goei' ? '#ff2a3a' : ev.et === 'ship' ? '#ffffff' : '#ffe02a'); chip.sfx(ev.et === 'boss' ? 'bossKill' : 'kill'); break;
    case 'bossHit': chip.sfx('bossHit'); break;
    case 'dive': { const n = performance.now(); if (n - lastDive > 380) { chip.sfx('dive'); lastDive = n; } break; }
    case 'beam': chip.sfx('beam'); break;
    case 'captured': chip.jingle('captured'); msg(T.captured, 200, 150, '#ff2a3a'); break;
    case 'ready': msg(T.ready, 100, 160, '#4fc8ff'); break;
    case 'rescue': chip.jingle('rescue'); break;
    case 'turned': case 'transform': chip.sfx('tf'); if (ev.type === 'transform') scr.boom(ev.x, ev.y, 'enemy', '#ffffff'); break;
    case 'pop': scr.pop(ev.x, ev.y, ev.n); break;
    case 'extend': chip.jingle('extend'); break;
    case 'playerHit': scr.boom(ev.x, ev.y, 'player'); chip.sfx('player'); break;
    case 'stage': {
      w.flagShown = Math.max(0, ev.n - 1); w.flagTick = 0;
      if (ev.challenge) { msg(T.challenge, 150, 150, '#4fc8ff'); if (ev.n > 1) chip.jingle('challenge'); }
      else { msg(fmt(T.stage, ev.n), 150, 150, '#4fc8ff'); if (ev.n > 1) chip.jingle('stage'); }
      if (ev.n === 1) msg(T.ready, 150, 166, '#ffffff');
      break;
    }
    case 'chResult':
      msg(T.hits, 280, 130, '#4fc8ff'); msg(String(ev.hits), 280, 146, '#ffffff');
      if (ev.perfect) { msg(T.perfect, 280, 170, '#ffe02a'); msg(T.special, 280, 186, '#ffe02a'); chip.jingle('perfect'); }
      else { msg(`${T.bonus}  ${ev.hits * 100}`, 280, 170, '#ffe02a'); chip.sfx('bonus'); }
      break;
    case 'over': msg(T.over, 200, 150, '#ff2a3a'); chip.jingle('over'); overT = 1; break;
  }
}

// ── 메뉴 시연: 컴퓨터가 조종 (죽지 않게)
function demoStep() {
  if (!demo || demo.mode === 'over' || demo.stage > 6) { demo = new World({ seed: Math.floor(Math.random() * 1e9), autofire: true }); demo.t = 100; }
  const t = demo.enemies.filter(e => e.alive && !e.captiveShip).sort((a, b) => b.y - a.y)[0];
  demo.input.tx = t ? t.x : SW / 2; demo.setInput('fire', true); demo.lives = 3;
  demo.step(); demo.events.length = 0;
}

function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  let steps = 0;
  while (acc >= 1 / 60 && steps < 5) {
    acc -= 1 / 60; steps++;
    if (phase === 'menu') demoStep();
    else if (phase === 'play' && world) {
      world.step(); world.events.splice(0).forEach(handle);
      // 깃발 하나씩 세우기
      if (world.flagShown < world.stage && ++world.flagTick % 8 === 0) { world.flagShown++; chip.sfx('flag'); }
      msgs.forEach(m => m.until--); msgs = msgs.filter(m => m.until > 0);
      if (overT && ++overT > 200) { overT = 0; finishGame(); }
    }
  }
  if (acc > 0.2) acc = 0;
  const w = phase === 'menu' ? demo : world;
  scr.frame(w, { T, hi: BEST[0] ? BEST[0].score : 20000, msgs: phase === 'menu' ? [] : msgs, f: Math.floor(now / 16) });
  requestAnimationFrame(loop);
}

// ── 키보드
const KEY = { ArrowLeft: 'left', ArrowRight: 'right', a: 'left', d: 'right', A: 'left', D: 'right', ' ': 'fire', z: 'fire', Z: 'fire', x: 'fire', X: 'fire' };
addEventListener('keydown', e => {
  chip.init();
  if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { e.preventDefault(); if (phase === 'pause') pauseGame(false); else pauseGame(true); return; }
  if ((phase === 'menu' && !$('menu').hidden) && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); startGame(); return; }
  if (phase === 'results' && e.key === 'Enter') { startGame(); return; }
  const k = KEY[e.key]; if (!k || !world || phase !== 'play') return;
  e.preventDefault(); if (e.repeat) return; world.input.tx = null; world.setInput(k, true);
});
addEventListener('keyup', e => { const k = KEY[e.key]; if (k && world) world.setInput(k, false); });
addEventListener('blur', () => pauseGame(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(true); });
// ── 터치: 단추 + 화면을 끌어 움직이기
document.querySelectorAll('#touch .tb').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); chip.init(); b.classList.add('on'); if (world && phase === 'play') { world.input.tx = null; world.setInput(k, true); } try { b.setPointerCapture(e.pointerId); } catch { /* 무시 */ } });
  const up = () => { b.classList.remove('on'); if (world) world.setInput(k, false); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
let drag = null;
$('cv').addEventListener('pointerdown', e => { chip.init(); if (!world || phase !== 'play') return; drag = e.pointerId; const x = (e.clientX - scr.ox) / scr.s; world.input.tx = x; world.setInput('fire', true); });
$('cv').addEventListener('pointermove', e => { if (drag === e.pointerId && world) world.input.tx = (e.clientX - scr.ox) / scr.s; });
const endDrag = e => { if (drag === e.pointerId && world) { drag = null; world.input.tx = null; world.setInput('fire', false); } };
$('cv').addEventListener('pointerup', endDrag); $('cv').addEventListener('pointercancel', endDrag);

// ── 메뉴
function toggleMute() { SET.muted = !SET.muted; chip.setMuted(SET.muted); $('bMute').textContent = SET.muted ? '✕' : '♪'; save(); }
function build() {
  $('pageTitle').textContent = T.title; $('logo').textContent = T.title; $('tTag').textContent = T.tag;
  $('bStart').textContent = T.start; $('bSettings').textContent = T.settings; $('bRecords').textContent = T.records; $('bHelp').textContent = T.help;
  $('bStart').onclick = () => { chip.sfx('coin'); startGame(); };
  $('bSettings').onclick = () => { buildSettings(); showOnly('settings'); };
  $('bRecords').onclick = () => { buildRecords(); showOnly('records'); };
  $('bHelp').onclick = () => { $('tHelp').textContent = T.help; $('helpKeys').innerHTML = ''; for (const [k, v] of T.keys) { const a = document.createElement('kbd'); a.textContent = k; const b = document.createElement('span'); b.textContent = v; $('helpKeys').append(a, b); } showOnly('help'); };
  for (const id of ['bSetDone', 'bRecDone', 'bHelpDone']) { $(id).textContent = T.done; $(id).onclick = () => showOnly(phase === 'pause' ? 'pause' : 'menu'); }
  $('tPause').textContent = T.pause; $('bResume').textContent = T.resume; $('bRestart').textContent = T.restart; $('bToMenu').textContent = T.toMenu;
  $('bResume').onclick = () => pauseGame(false); $('bRestart').onclick = startGame; $('bToMenu').onclick = toMenu;
  $('bAgain').textContent = T.again; $('bResMenu').textContent = T.menu; $('bAgain').onclick = startGame; $('bResMenu').onclick = toMenu;
  $('bMute').onclick = () => { chip.init(); toggleMute(); }; $('bMute').textContent = SET.muted ? '✕' : '♪';
  $('bPause').onclick = () => { chip.init(); phase === 'pause' ? pauseGame(false) : pauseGame(true); };
}
function buildSettings() {
  $('tSettings').textContent = T.settings; const B = $('setBody'); B.innerHTML = '';
  const r1 = document.createElement('label'); r1.className = 'row'; const s1 = document.createElement('span'); s1.textContent = T.sv; const i1 = document.createElement('input'); i1.type = 'range'; i1.min = 0; i1.max = 1; i1.step = 0.05; i1.value = SET.sv;
  i1.oninput = () => { SET.sv = +i1.value; chip.setVol(null, SET.sv); save(); }; i1.onchange = () => { chip.init(); chip.sfx('shoot'); }; r1.append(s1, i1); B.appendChild(r1);
  for (const key of ['autofire', 'scan', 'glow']) {
    const r = document.createElement('div'); r.className = 'row'; const s = document.createElement('span'); s.textContent = T[key]; const c = document.createElement('div'); c.className = 'chips';
    for (const v of [true, false]) { const b = document.createElement('button'); b.className = 'chip' + (SET[key] === v ? ' on' : ''); b.textContent = v ? T.on : T.off;
      b.onclick = () => { SET[key] = v; save(); scr.opts = { scan: SET.scan, glow: SET.glow }; if (world) world.autofire = SET.autofire; c.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); }; c.appendChild(b); }
    r.append(s, c); B.appendChild(r);
  }
}
function buildRecords() {
  $('tRecords').textContent = T.records; const tb = $('recTable'); tb.innerHTML = '';
  if (!BEST.length) { const td = tb.insertRow().insertCell(); td.textContent = T.none; td.style.color = '#8890a8'; return; }
  BEST.forEach((r, i) => { const tr = tb.insertRow(); tr.insertCell().textContent = ['1ST', '2ND', '3RD', '4TH', '5TH'][i]; tr.insertCell().textContent = r.score; tr.insertCell().textContent = `ST ${r.stage} · ${r.ratio}% · ${r.date}`; });
}
build(); layout(); showOnly('menu');
wiiivMark($('wlogo'), 'hive-strike');
addEventListener('pointerdown', () => chip.init(), { capture: true, once: true });
requestAnimationFrame(t => { last = t; loop(t); });
document.body.focus();
window.__hs = { get world() { return world; }, get phase() { return phase; }, start: startGame, toMenu, pause: pauseGame, chip, scr };

</script>
</body>
</html>
