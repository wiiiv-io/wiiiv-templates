<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">타자연습</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:root { --bg: #0d0d1a; --panel: #14142a; --panel2: #1a1a30; --line: #22224a; --line2: #2a2a4a; --text: #f2f1ff; --sub: #9a98b8; --dim: #5d5b7a; --acc: #7c5cfc; --acc2: #ff6b9d; --ok: #6bd39d; --bad: #ff4466; --gold: #ffd93d; --cyan: #4ecdc4; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none; }
button, select, input { font-family: inherit; color: inherit; }
.mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'D2Coding', ui-monospace, monospace; }
svg { display: block; }

/* ── 머리 */
header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #1e1e3a; flex-wrap: wrap; }
.brand { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.brand img { height: 22px; width: auto; display: block; }
nav { display: flex; gap: 3px; background: var(--panel); padding: 3px; border-radius: 9px; border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; min-width: 0; max-width: 100%; }
nav::-webkit-scrollbar { display: none; }
nav button { background: transparent; border: none; color: #9a98b8; padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background .15s, color .15s; flex: none; }
nav button:hover { color: #fff; }
nav button.active { background: var(--acc); color: #fff; font-weight: 600; }
nav .gap { width: 1px; background: var(--line2); margin: 4px 3px; flex: none; }
.right { display: flex; gap: 6px; align-items: center; margin-left: auto; }
select.cl { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: 13px; cursor: pointer; color: #ddd; }
select.cl option { background: #14142a; }
.icon-btn { background: var(--panel); border: 1px solid var(--line); color: #ccc; width: 32px; height: 30px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover { background: var(--line2); }
.icon-btn.off { color: #555; }

/* ── 경험치 · 수치 */
#xp { display: flex; align-items: center; gap: 10px; padding: 6px 16px 2px; font-size: 12px; color: #aaa; }
#lvBadge { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; font-weight: 700; padding: 2px 8px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
#lvTitle { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#xpTrack { flex: 1; height: 6px; background: #1a1a30; border-radius: 3px; overflow: hidden; max-width: 320px; min-width: 40px; }
#xpFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .4s; }
#xpNum { font-variant-numeric: tabular-nums; white-space: nowrap; }
#stats { display: flex; justify-content: center; gap: 22px; padding: 4px 16px 8px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; align-items: center; min-width: 62px; }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .l { font-size: 10px; color: #777; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.stat.combo .v { color: var(--gold); }
.stat.combo .v.hot { color: #ff6b3d; text-shadow: 0 0 12px rgba(255,107,61,.7); }
.stat.acc .v { color: var(--cyan); }
.stat.time .v.low { color: var(--bad); }

/* ── 무대 */
main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 16px 14px; min-height: 0; overflow: auto; }
section { display: none; width: 100%; max-width: 920px; flex-direction: column; align-items: center; gap: 12px; }
section.active { display: flex; }
.pills { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.pill { background: var(--panel); border: 1px solid var(--line); color: #aaa; padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 12.5px; transition: all .15s; }
.pill:hover:not(:disabled) { color: #fff; border-color: #444; }
.pill.active { background: rgba(124,92,252,.2); border-color: var(--acc); color: #d4c8ff; font-weight: 600; }
.pill:disabled { opacity: .4; cursor: default; }
.hint { font-size: 12px; color: #6f6d8c; text-align: center; line-height: 1.5; max-width: 720px; }
.notice { background: rgba(255,217,61,.08); border: 1px solid rgba(255,217,61,.35); color: #ffe58a; padding: 8px 14px; border-radius: 10px; font-size: 13px; text-align: center; }

/* 글 연습 */
#target { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; font-size: 26px; line-height: 1.6; letter-spacing: .02em; min-height: 90px; word-break: break-all; position: relative; transition: border-color .15s; }
#target.code { font-size: 19px; line-height: 1.7; }
#target.long { font-size: 22px; padding: 16px 22px; }
#target.shake { animation: shake .25s; border-color: var(--bad); }
#target .c { color: #555; border-radius: 3px; white-space: pre; }
#target .c.ok { color: #fff; }
#target .c.bad { color: var(--bad); background: rgba(255,68,102,.15); text-decoration: underline; }
#target .c.cur { background: var(--acc); color: #fff; animation: blink 1s infinite; }
#target .c.pend { color: #c8b8ff; border-bottom: 2px solid #c8b8ff; }
#target .ws.bad::before { content: '·'; }
#target .lnx { white-space: pre-wrap; }
#target .lnx.done { color: #3f7d5e; font-size: .8em; }
#target .lnx.todo { color: #4a4868; font-size: .9em; }
#target .lnx.cur { padding: 4px 0; }
#target .src { display: block; font-size: 11.5px; color: #6f6d8c; margin-bottom: 4px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#queue { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font-size: 15px; color: #555; }
#queue span:first-child { color: #888; }
#codeBlock { width: 100%; }
#codeBlock .ln { display: flex; gap: 12px; padding: 2px 0; }
#codeBlock .ln .no { color: #444; width: 22px; text-align: right; flex-shrink: 0; font-size: 14px; }
#codeBlock .ln.done .body { color: var(--ok); }
#codeBlock .ln.todo .body { color: #555; }
#codeBlock .ln .ind { white-space: pre; color: #333; }
#codeBlock .ln .ind::before { content: attr(data-dots); }
#codeTag { position: absolute; top: 8px; right: 12px; font-size: 10px; color: var(--acc); background: rgba(124,92,252,.15); padding: 2px 7px; border-radius: 4px; letter-spacing: .06em; text-transform: uppercase; }
#inp, #rainInp { width: 100%; background: var(--bg); border: 2px solid var(--line2); border-radius: 10px; color: #fff; font-size: 22px; padding: 12px 16px; outline: none; transition: border-color .15s; user-select: text; -webkit-user-select: text; }
#inp:focus, #rainInp:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(124,92,252,.2); }
#inp.mono { font-size: 18px; }
#inp::placeholder, #rainInp::placeholder { color: #444; }

/* 속도 측정 */
.testbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.testbar .lbl { font-size: 12px; color: var(--sub); }
#countdown { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: #fff; }
#countdown.low { color: var(--bad); }
.spark { width: 100%; max-width: 520px; }
.spark .cap { font-size: 11.5px; color: var(--sub); margin-bottom: 4px; display: flex; justify-content: space-between; }

/* 자리연습 */
.keybar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 12.5px; color: var(--sub); }
.keybar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.keybar select { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; font-size: 12.5px; color: #ddd; }
#keyTargets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 780px; }
.kt { width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: #666; transition: all .12s; }
.kt.ok { color: var(--ok); border-color: #2a4a3a; }
.kt.bad { color: var(--bad); border-color: #4a2a3a; }
.kt.cur { background: var(--acc); color: #fff; border-color: var(--acc); transform: scale(1.12); box-shadow: 0 0 16px rgba(124,92,252,.5); }
#kbd, .kbdcopy { width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 5px; padding: 10px; background: #101020; border-radius: 12px; border: 1px solid #1e1e3a; }
.krow { display: flex; gap: 5px; }
.key { flex: 1 1 0; min-width: 0; height: 42px; border-radius: 6px; background: #1a1a30; border: 1px solid var(--line2); border-bottom-width: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; position: relative; transition: background .08s, transform .08s; --f: #444; overflow: hidden; }
.key.ph { visibility: hidden; }
.key .lb { font-size: 14px; font-weight: 600; color: #ddd; }
.key .lb.sm { font-size: 11px; font-weight: 500; color: #888; }
.key .sb { position: absolute; top: 2px; left: 5px; font-size: 9.5px; color: #8a88a8; }
.key .lt { position: absolute; bottom: 4px; right: 5px; font-size: 9px; color: #6a688a; }
.key.dead .lb { color: #6a688a; }
.key::after { content: ''; position: absolute; bottom: 2px; left: 6px; right: 6px; height: 2px; border-radius: 1px; background: var(--f); opacity: .7; }
.key.next { background: var(--f); border-color: var(--f); transform: translateY(1px); box-shadow: 0 0 14px var(--f); }
.key.next .lb, .key.next .sb, .key.next .lt { color: #111; }
.key.hit { background: var(--ok); border-color: var(--ok); }
.key.miss { background: var(--bad); border-color: var(--bad); }
#fingers { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 11px; color: #888; }
#fingers span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--f); vertical-align: middle; }

/* 산성비 */
#field { position: relative; width: 100%; height: 400px; background: linear-gradient(180deg, #0f0f24 0%, #141432 85%, #2a1a3a 100%); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#field.shake { animation: shake .3s; }
#field.frozen { box-shadow: inset 0 0 60px rgba(120,200,255,.35); border-color: #7cc8ff; }
#field .drop { position: absolute; top: 0; font-size: 20px; font-weight: 600; color: #e8e8ff; text-shadow: 0 0 8px rgba(124,92,252,.6); white-space: nowrap; padding: 2px 8px; border-radius: 6px; background: rgba(124,92,252,.15); will-change: transform; }
#field .drop.near { color: #ffc9d6; background: rgba(255,68,102,.18); }
#field .drop.heal { color: var(--gold); background: rgba(255,217,61,.15); text-shadow: 0 0 10px rgba(255,217,61,.7); }
#field .drop.freeze { color: #aee4ff; background: rgba(120,200,255,.18); text-shadow: 0 0 10px rgba(120,200,255,.8); }
#field .drop.bomb { color: #ff9a7a; background: rgba(255,90,60,.2); text-shadow: 0 0 10px rgba(255,90,60,.8); }
#field .drop .ic { font-size: .8em; margin-right: 4px; }
#field .drop.typed { outline: 2px solid rgba(124,92,252,.8); }
#field .drop.pop { animation: pop .3s forwards; }
#field .ground { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--acc), var(--acc2)); opacity: .7; }
#field .splash { position: absolute; bottom: 4px; width: 60px; height: 20px; border-radius: 50%; background: var(--bad); opacity: .8; animation: splash .5s forwards; pointer-events: none; }
#field .banner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(13,13,26,.78); padding: 16px; text-align: center; }
#field .banner h3 { font-size: 24px; }
#field .banner p { color: #aaa; font-size: 13px; line-height: 1.7; }
#field .banner .legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font-size: 12.5px; }
#field .banner .legend span { padding: 3px 9px; border-radius: 6px; }
#field .shock { position: absolute; border-radius: 50%; border: 3px solid #ff9a7a; pointer-events: none; animation: shock .5s forwards; }
#rainBar { display: flex; gap: 20px; align-items: center; font-size: 14px; flex-wrap: wrap; justify-content: center; }
#lives { letter-spacing: 2px; }
#rainInp { max-width: 420px; font-size: 18px; text-align: center; }
.particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; animation: fly .6s forwards; }

/* 기록 */
.rec { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .rec { grid-template-columns: 1fr; } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.box h4 { font-size: 12px; letter-spacing: .06em; color: var(--sub); text-transform: uppercase; margin-bottom: 10px; }
.box table { width: 100%; border-collapse: collapse; font-size: 13px; }
.box td { padding: 4px 0; border-bottom: 1px solid #1e1e3a; }
.box td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: #fff; }
.weak { display: flex; gap: 6px; flex-wrap: wrap; }
.weak span { min-width: 34px; height: 36px; padding: 0 8px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 17px; background: rgba(255,68,102,.14); border: 1px solid rgba(255,68,102,.4); }
.weak small { display: block; font-size: 9.5px; color: var(--sub); font-weight: 500; }
.big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.btn { background: var(--acc); border: none; color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: #6a4ce0; }
.btn.ghost { background: var(--line2); }
.btn.ghost:hover { background: #3a3a5a; }
.btn.sm { padding: 6px 14px; font-size: 12.5px; }
.btn.danger { background: transparent; border: 1px solid #5a2a3a; color: #ff8aa0; }

/* 결과 */
#overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.75); z-index: 20; padding: 16px; }
#overlay.active { display: flex; }
.card { background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; padding: 26px 30px; width: min(460px, 100%); max-height: 100%; overflow-y: auto; text-align: center; animation: rise .3s; }
.card .emoji { font-size: 50px; line-height: 1; }
.card h2 { font-size: 22px; margin: 8px 0 2px; }
.card .sub { color: #999; font-size: 13px; margin-bottom: 16px; }
.card .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.card .cell { background: var(--bg); border-radius: 10px; padding: 10px; }
.card .cell .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .cell .l { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: .06em; }
.card .best { font-size: 12.5px; color: var(--gold); margin-bottom: 4px; }
.card .xpg { font-size: 12px; color: #c8b8ff; margin-bottom: 14px; }
.card .spark { margin: 0 auto 14px; }
.card .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card .weakline { font-size: 12.5px; color: var(--sub); margin-bottom: 12px; }
.card .weakline b { color: #ff8aa0; letter-spacing: .1em; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--line2); color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 25; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#comboPop { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 46px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px rgba(255,217,61,.8); pointer-events: none; opacity: 0; z-index: 26; white-space: nowrap; }
#comboPop.go { animation: comboPop .7s ease-out; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; color: #ffb3c1; }

@keyframes blink { 0%, 100% { background: #7c5cfc; } 50% { background: #5a3ce0; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { to { transform: scale(1.8); opacity: 0; } }
@keyframes splash { to { transform: scaleX(2.5); opacity: 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
@keyframes shock { from { width: 0; height: 0; opacity: 1; } to { width: 600px; height: 600px; margin: -300px 0 0 -300px; opacity: 0; } }
@keyframes comboPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -90%) scale(1); } }
@media (max-width: 760px) {
  header { padding: 6px 10px; gap: 6px; } nav { order: 3; width: 100%; } .brand { font-size: 15px; }
  #xp { padding: 4px 12px 0; } #stats { gap: 10px; padding: 2px 10px 6px; } .stat { min-width: 52px; } .stat .v { font-size: 18px; }
  main { padding: 0 10px 10px; }
  #target { font-size: 20px; padding: 14px 16px; } #target.long { font-size: 17px; } #target.code { font-size: 15px; }
  #inp { font-size: 18px; padding: 10px 12px; }
  .key { height: 32px; border-radius: 4px; } .key .lb { font-size: 11.5px; } .key .sb, .key .lt { display: none; } #kbd { padding: 5px; gap: 3px; } .krow { gap: 3px; }
  .kt { width: 32px; height: 36px; font-size: 16px; }
  #field { height: 300px; } #field .drop { font-size: 16px; }
  #countdown { font-size: 34px; }
  .card { padding: 20px 16px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><img id="wlogo" alt="wiiiv"><span id="title"></span></div>
  <nav id="modes"></nav>
  <div class="right">
    <select class="cl" id="clSel" title=""></select>
    <button class="icon-btn" id="clickBtn"></button>
    <button class="icon-btn" id="musicBtn"></button>
    <button class="icon-btn" id="soundBtn"></button>
  </div>
</header>
<div id="xp"><span id="lvBadge">Lv 1</span><span id="lvTitle"></span><div id="xpTrack"><div id="xpFill"></div></div><span id="xpNum">0 XP</span></div>
<div id="stats">
  <div class="stat"><div class="v" id="sSpeed">0</div><div class="l" id="sSpeedL"></div></div>
  <div class="stat acc"><div class="v" id="sAcc">100%</div><div class="l" id="sAccL"></div></div>
  <div class="stat combo"><div class="v" id="sCombo">0</div><div class="l" id="sComboL"></div></div>
  <div class="stat"><div class="v" id="sProg">0/0</div><div class="l" id="sProgL"></div></div>
  <div class="stat time"><div class="v" id="sTime">0:00</div><div class="l" id="sTimeL"></div></div>
</div>
<main>
  <section id="keysMode">
    <div class="pills" id="keyLevels"></div>
    <div class="keybar" id="keyBar"></div>
    <div class="notice" id="kbdNotice" hidden></div>
    <div id="keyTargets"></div>
    <div id="kbd"></div>
    <div id="fingers"></div>
    <div class="hint" id="keysHint"></div>
  </section>
  <section id="textMode">
    <div class="pills" id="textPills"></div>
    <div class="testbar" id="testBar" hidden></div>
    <div id="target"></div>
    <div id="queue"></div>
    <input id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next">
    <div class="spark" id="testSpark" hidden></div>
    <div class="hint" id="textHint"></div>
  </section>
  <section id="rainMode">
    <div id="rainBar"><span id="lives"></span><span id="rainScore"></span><span id="rainBest"></span></div>
    <div id="field"><div class="ground"></div></div>
    <input id="rainInp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
    <div class="hint" id="rainHint"></div>
  </section>
  <section id="recMode"><div class="rec" id="recBody"></div></section>
</main>
<div id="overlay"><div class="card">
  <div class="emoji" id="rEmoji"></div>
  <h2 id="rTitle"></h2>
  <div class="sub" id="rSub"></div>
  <div class="grid">
    <div class="cell"><div class="v" id="rSpeed">0</div><div class="l" id="rSpeedL"></div></div>
    <div class="cell"><div class="v" id="rAcc">0</div><div class="l" id="rAccL"></div></div>
    <div class="cell"><div class="v" id="rCombo">0</div><div class="l" id="rComboL"></div></div>
    <div class="cell"><div class="v" id="rTime">0</div><div class="l" id="rTimeL"></div></div>
  </div>
  <div class="best" id="rBest"></div>

const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;
    } catch { /* 무시 */ }
  }
  if (WIIIV_CTX !== 'wiiiv' && !img.dataset.wiiivLink) {
    img.dataset.wiiivLink = '1'; img.style.cursor = 'pointer'; img.title = 'wiiiv.ai';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); window.open(`${WIIIV_HOME}/?from=${encodeURIComponent(app)}`, '_blank', 'noopener'); });
  }
  return img;
}

      text: "임은 갔습니다. 아아, 사랑하는 나의 임은 갔습니다.\n푸른 산빛을 깨치고 단풍나무 숲을 향하여 난 작은 길을 걸어서 차마 떨치고 갔습니다.\n황금의 꽃같이 굳고 빛나던 옛 맹세는 차디찬 티끌이 되어서 한숨의 미풍에 날아갔습니다.\n날카로운 첫키스의 추억은 나의 운명의 지침을 돌려 놓고 뒷걸음쳐서 사라졌습니다.\n나는 향기로운 임의 말소리에 귀먹고 꽃다운 임의 얼굴에 눈멀었습니다.\n사랑도 사람의 일이라 만날 때에 미리 떠날 것을 염려하고 경계하지 않는 것은 아니지만 이별은 뜻밖의 일이 되고 놀란 가슴은 새로운 슬픔에 터집니다.\n그러나 이별을 쓸데없는 눈물의 원천을 만들고 마는 것은 스스로 사랑을 깨치는 것인줄 아는 까닭에 걷잡을 수 없는 슬픔의 힘을 옮겨서 새 희망의 정수박이에 들이부었습니다.\n우리는 만날 때에 떠날 것을 염려하는 것과 같이 떠날 때에 다시 만날 것을 믿습니다. 아아, 임은 갔지만은 나는 임을 보내지 아니하였습니다.\n제 곡조를 못 이기는 사랑의 노래는 임의 침묵을 휩싸고 돕니다." },

    { title: "봄·봄", author: "김유정", src: "https://ko.wikisource.org/wiki/봄봄",
      text: "\"장인님! 인제 저...\"\n내가 이렇게 뒤통수를 긁고, 나이가 찼으니 성례를 시켜줘야 하지 않겠느냐고 하면 대답이 늘,\n\"이 자식아! 성례구 뭐구 미처 자라야지!\"하고 만다.\n이 자라야 한다는 것은 내가 아니라 내 아내가 될 점순이의 키 말이다.\n내가 여기에 와서 돈 한 푼 안 받고 일하기를 삼 년 하고 꼬바기 일곱 달 동안을 했다. 그런데도 미처 못 자랐다니까 이 키는 언제야 자라는 겐지 짜장 영문 모른다. 일을 좀 더 잘해야 한다든지, 혹은 밥을 많이 먹는다고 노상 걱정이니까 좀 덜 먹어야 한다든지 하면 나도 얼마든지 할 말이 많다. 허지만 점순이가 아직 어리니까 더 자라야 한다는 여기에는 어째 볼 수 없이 고만 빙빙하고 만다." },

      text: "L'année 1866 fut marquée par un événement bizarre, un phénomène inexpliqué et inexplicable que personne n'a sans doute oublié. Sans parler des rumeurs qui agitaient les populations des ports et surexcitaient l'esprit public à l'intérieur des continents, les gens de mer furent particulièrement émus. Les négociants, armateurs, capitaines de navires, skippers et masters de l'Europe et de l'Amérique, officiers des marines militaires de tous pays, et, après eux, les gouvernements des divers États des deux continents, se préoccupèrent de ce fait au plus haut point.\nEn effet, depuis quelque temps, plusieurs navires s'étaient rencontrés sur mer avec \"une chose énorme,\" un objet long, fusiforme, parfois phosphorescent, infiniment plus vaste et plus rapide qu'une baleine.",

const LANG_LAYOUTS = { ko: ['ko'], en: ['us'], es: ['es', 'us'], fr: ['fr', 'us'], de: ['de', 'us'], pt: ['br', 'pt', 'us'], vi: ['us'], ru: ['ru'] };

// 자판 하나를 펼친다: 키 목록과 글자 → {code, shift} 지도
function buildLayout(id) {
  const L = LAYOUTS[id], codes = ROW_CODES[L.form], keys = [], map = {};
  L.rows.forEach(([base, shift], r) => {
    const b = [...base], s = [...shift];
    codes[r].forEach((code, i) => {
      const k = { code, row: r, base: b[i] === '∅' ? '' : (b[i] || ''), shift: s[i] === '∅' ? '' : (s[i] || ''), f: FINGER[code] ?? 7 };
      k.deadBase = L.dead.includes(k.base); k.deadShift = L.dead.includes(k.shift);
      keys.push(k);
    });
  });
  // 보통 글자를 먼저 올려 Shift 쪽이 같은 글자를 덮지 않게
  for (const k of keys) if (k.base && !k.deadBase && !(k.base in map)) map[k.base] = { code: k.code, shift: false, f: k.f };
  for (const k of keys) if (k.shift && !k.deadShift && !(k.shift in map)) map[k.shift] = { code: k.code, shift: true, f: k.f };
  map[' '] = { code: 'Space', shift: false, f: 8 };
  if (L.latin) { // 한글·러시아 자판 위에 영문 글자 표시
    const lat = LAYOUTS[L.latin].rows; keys.forEach(k => { const row = [...lat[k.row][0]], i = codes[k.row].indexOf(k.code); k.latin = row[i] || ''; });
  }
  return { id, name: L.name, form: L.form, keys, map };
}
// 자리연습 단계별 글자 모음
function drillPools(lay) {
  const isLetter = ch => ch.toLowerCase() !== ch.toUpperCase() || /[\u3131-\u318e]/.test(ch);
  const row = r => lay.keys.filter(k => k.row === r && !k.deadBase && k.base).map(k => k.base);
  const uniq = a => [...new Set(a)].filter(Boolean);
  const home = row(2).filter(c => c !== "'"), top = row(1), bottom = row(3), nums = uniq(lay.keys.filter(k => k.row === 0).flatMap(k => [k.deadBase ? '' : k.base, k.deadShift ? '' : k.shift]).filter(ch => /[0-9]/.test(ch)).concat(row(0)));
  const shifted = uniq(lay.keys.filter(k => k.shift && !k.deadShift && k.shift !== k.base && !/[0-9]/.test(k.shift)).map(k => k.shift));
  const letters = uniq([...home, ...top, ...bottom].filter(isLetter));
  // 종합: 글자는 두 번 넣어 더 자주 나오게
  return { home: uniq(home), top: uniq(top), bottom: uniq(bottom), nums, shifted, all: [...letters, ...letters, ...nums.filter(c => /[0-9]/.test(c)), ...uniq([...home, ...bottom]).filter(c => !isLetter(c))] };
}

      case 'miss': this.noise(F, t, 0.25, 0.3, { type: 'lowpass', freq: 1400, fto: 200 }); this.tone(F, 0.5, 220, t, 0.2, 0.1, { to: 70, sweep: 0.2 }); break;
      case 'freeze': arp([96, 91, 96, 103, 108], 0.05, 0.125, 0.07, 0.2); break;
      case 'bomb': this.noise(F, t, 0.6, 0.45, { type: 'lowpass', freq: 2400, fto: 80 }); this.tone(F, 'tri', 120, t, 0.4, 0.4, { to: 35, sweep: 0.4 }); break;
      case 'heal': arp([72, 76, 79, 84, 88], 0.05, 0.25, 0.1); break;
      case 'level': arp([72, 79, 84, 79, 84, 91], 0.06, 0.5, 0.11); break;
      case 'tick': this.tone(F, 0.25, 1320, t, 0.03, 0.06, { rel: 0.01 }); break;
      case 'win': arp(['C5', 'E5', 'G5', 'C6', 'G5', 'C6', 'E6', 'G6'], 0.08, 0.5, 0.14, 0.3); break;
      case 'lose': [72, 69, 65, 64, 60].forEach((m, i) => this.tone(F, 0.5, midiHz(m), t + i * 0.14, 0.15, 0.12, { decay: 0.5 })); break;
      case 'menu': this.tone(F, 0.25, 1000, t, 0.03, 0.06, { rel: 0.01 }); break;
    }
  }
}

    <div class="box" style="grid-column:1/-1"><h4>${esc(T.weakKeys)}</h4>${weak.length ? `<div class="weak">${weak.map(c => `<span>${esc(c)}<small>${Math.round(KS.errRate(c) * 100)}%</small></span>`).join('')}</div><div style="margin-top:10px"><button class="btn sm" id="recWeak">${esc(T.practiceWeak)}</button></div>` : `<div style="color:var(--sub);font-size:13px">${esc(T.weakNeedData)}</div>`}
      <div id="recKbd" style="margin-top:12px"></div></div>
    <div class="box" style="grid-column:1/-1;display:flex;justify-content:flex-end"><div class="confirm" id="resetBox"><button class="btn sm danger" id="resetBtn">${esc(T.reset)}</button></div></div>`;
  if ($('recWeak')) $('recWeak').onclick = () => { mode = 'keys'; keyLevel = 6; store('mode', mode); startMode(); };
  // 약점 지도 (자리연습 자판을 빌려 그린다)
  const kb = document.createElement('div'); kb.className = 'kbdcopy'; $('recKbd').appendChild(kb); buildKbd(kb, true);
  $('resetBtn').onclick = () => {
    $('resetBox').innerHTML = `<span>${esc(T.resetQ)}</span><button class="btn sm danger" id="resetYes">${esc(T.resetYes)}</button><button class="btn sm ghost" id="resetNo">${esc(T.cancel)}</button>`;
    $('resetNo').onclick = showRecords;
    $('resetYes').onclick = () => { try { Object.keys(localStorage).filter(k => k.startsWith('wiiiv-typing-') && !/-(set|cl|mode|heat|layout-\w+)$/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) { /* 무시 */ } xp = 0; Object.assign(TOT, { ms: 0, chars: 0, runs: 0 }); setCl(cl); renderXp(); showRecords(); };
  };
}

// ── 시작
$('title').textContent = T.title; wiiivMark($('wlogo'), 'typing-practice');
setCl(cl); buildNav(); syncSoundBtns(); renderXp(); startMode();
window.__ty = { get mode() { return mode; }, get cl() { return cl; }, get sess() { return sess; }, get run() { return run; }, get items() { return items; }, get rain() { return rain; }, get KS() { return KS; }, get LAY() { return LAY; }, setCl: c => { setCl(c); startMode(); }, setMode: m => { mode = m; startMode(); }, set testDur(v) { testDur = v; } };

</script>
</body>
</html>
