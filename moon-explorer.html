<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>wiiiv Moon</title>
<style>
:root { --bg: #000; --panel: rgba(14, 16, 24, 0.86); --line: rgba(160, 175, 210, 0.18); --fg: #e8ecf6; --dim: #9aa4bd; --acc: #ffd479; --acc2: #8fb7ff; --r: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 'Pretendard', 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#sky, #gl, #ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
#ov, #sky { pointer-events: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,0.45); }
#top { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
#top > * { pointer-events: auto; }
#brand { padding: 8px 14px; display: flex; flex-direction: column; min-width: 0; }
#brand b { font-size: 18px; letter-spacing: 0.02em; display: flex; align-items: flex-end; gap: 7px; line-height: 1; }
#brand b img { height: 22px; width: auto; display: block; }
#brand span { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#searchBox { position: relative; flex: 0 1 340px; min-width: 0; }
#search { width: 100%; padding: 11px 14px 11px 36px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; outline: none; backdrop-filter: blur(10px); }
#search:focus { border-color: var(--acc2); }
#searchBox svg { z-index: 1; position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
#sugg { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 50vh; overflow: auto; padding: 4px; display: none; }
#sugg.show { display: block; }
.sg { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.sg:hover, .sg.on { background: rgba(143,183,255,0.14); }
.sg small { color: var(--dim); white-space: nowrap; }
#tools { margin-left: auto; display: flex; gap: 8px; }
.tb { padding: 9px 13px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tb.on { border-color: var(--acc); color: var(--acc); }
.tb svg { width: 18px; height: 18px; flex: none; }
#side { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
.sb { width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; font-weight: 600; }
.sb small { font-size: 11px; font-weight: 700; }
#compass svg { width: 26px; height: 26px; transition: transform 0.1s linear; }
#phase { position: fixed; left: 12px; bottom: calc(40px + env(safe-area-inset-bottom)); padding: 10px 12px; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 24px); }
#phaseIcon { width: 46px; height: 46px; flex: none; }
#phaseText b { display: block; font-size: 13.5px; }
#phaseText span { color: var(--dim); font-size: 12px; }
#sunModes { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.chip { padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); font-size: 11.5px; color: var(--dim); }
.chip.on { color: #111; background: var(--acc); border-color: var(--acc); font-weight: 600; }
#sunSlider { width: 100%; margin-top: 6px; display: none; accent-color: var(--acc); }
#status { white-space: nowrap; position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 14px calc(6px + env(safe-area-inset-bottom)); display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--dim); background: linear-gradient(transparent, rgba(0,0,0,0.75)); font-variant-numeric: tabular-nums; pointer-events: none; }
#status b { color: var(--fg); font-weight: 600; }
#scale { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#scaleBar { height: 6px; border: 2px solid var(--fg); border-top: 0; }
#credit { font-size: 10.5px; opacity: 0.75; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#drawer { position: fixed; right: 68px; top: calc(70px + env(safe-area-inset-top)); width: 340px; max-height: calc(100% - 140px); overflow: auto; padding: 16px; display: none; }
#drawer.show { display: block; }
#drawer h2 { margin: 0 0 2px; font-size: 19px; line-height: 1.25; }
#drawer h3 { margin: 14px 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: 0.04em; }
#drawer .sub { color: var(--acc2); font-size: 13px; margin-bottom: 8px; }
#drawer .x { position: absolute; right: 10px; top: 8px; font-size: 22px; color: var(--dim); width: 32px; height: 32px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.origin { font-size: 13px; color: #cfd6e8; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.tag { font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: rgba(255,212,121,0.12); color: var(--acc); }
a.lnk { color: var(--acc2); font-size: 12.5px; }
.site { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
.site:hover { background: rgba(255,255,255,0.06); }
.site i { width: 10px; height: 10px; border-radius: 3px; }
.site small { color: var(--dim); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border: 0; }
.seg { display: flex; gap: 4px; }
.seg button { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.seg button.on { background: var(--acc2); color: #0b1020; border-color: var(--acc2); font-weight: 600; }
input[type=range] { accent-color: var(--acc2); }
.sw { width: 40px; height: 22px; border-radius: 99px; background: rgba(255,255,255,0.15); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left 0.15s; }
.sw.on { background: var(--acc2); } .sw.on::after { left: 21px; }
#meas { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(42px + env(safe-area-inset-bottom)); padding: 10px 14px; display: none; width: min(560px, calc(100% - 24px)); }
#meas.show { display: block; }
#meas b { color: var(--acc); font-size: 16px; }
#profile { width: 100%; height: 90px; display: block; margin-top: 6px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; pointer-events: none; transition: opacity 0.6s; }
#loading.hide { opacity: 0; }
#help { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 8px 14px; font-size: 12px; color: var(--dim); transition: opacity 1s; text-align: center; max-width: calc(100% - 24px); pointer-events: none; }
@media (max-width: 720px) {
  #brand span { display: none; } #brand { padding: 8px 12px; }
  #top { flex-wrap: wrap; } #searchBox { order: 3; flex: 1 1 100%; }
  .tb span { display: none; } .tb { padding: 9px 10px; }
  #drawer { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(36px + env(safe-area-inset-bottom)); max-height: 56%; }
  #phase { bottom: calc(34px + env(safe-area-inset-bottom)); padding: 8px 10px; } #phaseIcon { width: 38px; height: 38px; }
  #side { top: auto; bottom: calc(150px + env(safe-area-inset-bottom)); transform: none; }
  #credit { display: none; } #status { gap: 10px; font-size: 11px; padding-left: 10px; padding-right: 10px; } #stAlt { display: none; } #help { top: calc(118px + env(safe-area-inset-top)); }
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="loading"></div>
<div id="top">
  <div id="brand" class="glass"><b id="tTitle"></b><span id="tSub"></span></div>
  <div id="searchBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="search" autocomplete="off" spellcheck="false"><div id="sugg" class="glass"></div></div>
  <div id="tools">
    <button class="tb glass" id="bSites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span></span></button>
    <button class="tb glass" id="bMeasure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span></span></button>
    <button class="tb glass" id="bSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span></span></button>
  </div>
</div>
<div id="side">
  <button class="sb glass" id="zIn">+</button>
  <button class="sb glass" id="zOut">−</button>
  <button class="sb glass" id="compass"><svg viewBox="0 0 24 24"><path d="M12 2l4 10h-8z" fill="#ff6b6b"/><path d="M12 22l-4-10h8z" fill="#cfd6e8"/></svg></button>
  <button class="sb glass" id="bTilt"><small>3D</small></button>
  <button class="sb glass" id="bFace"><small id="faceT"></small></button>
</div>
<div id="phase" class="glass"><canvas id="phaseIcon" width="92" height="92"></canvas><div id="phaseText" style="min-width:0"><b></b><span></span><div id="sunModes"></div><input type="range" id="sunSlider" min="-180" max="180" step="1"></div></div>
<div id="drawer" class="glass"></div>
<div id="meas" class="glass"><div id="measT"></div><canvas id="profile"></canvas></div>
<div id="help" class="glass"></div>
<div id="status"><span id="stPos"></span><span id="stAlt"></span><span id="credit"></span><span id="scale"><span id="scaleBar"></span><span id="scaleT"></span></span></div>

const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  if (location.pathname.startsWith('/api/v2/wiiivapp/run/')) return 'desktop';   // 바탕화면에 설치한 앱 창 (wiiiv 데스크톱)
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;
    } catch { /* 무시 */ }
  }
  if (WIIIV_CTX !== 'wiiiv' && WIIIV_CTX !== 'desktop' && !img.dataset.wiiivLink) {
    img.dataset.wiiivLink = '1'; img.style.cursor = 'pointer'; img.title = 'wiiiv.ai';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); window.open(`${WIIIV_HOME}/?from=${encodeURIComponent(app)}`, '_blank', 'noopener'); });
  }
  return img;
}

// 좌표: 달 중심 원점, km. x = 경도 0 위도 0 (지구 쪽), y = 동경 90, z = 북극
const R_MOON = 1737.4, D2R = Math.PI / 180;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]), norm = a => mul(a, 1 / (vlen(a) || 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function llv(lat, lon, r = 1) { const a = lat * D2R, b = lon * D2R, c = Math.cos(a); return [r * c * Math.cos(b), r * c * Math.sin(b), r * Math.sin(a)]; }
function vll(v) { const l = vlen(v); return [Math.asin(clamp(v[2] / l, -1, 1)) / D2R, Math.atan2(v[1], v[0]) / D2R]; }
function enu(lat, lon) { const a = lat * D2R, b = lon * D2R; return { e: [-Math.sin(b), Math.cos(b), 0], n: [-Math.sin(a) * Math.cos(b), -Math.sin(a) * Math.sin(b), Math.cos(a)], u: llv(lat, lon) }; }
function rotAxis(v, ax, ang) { const c = Math.cos(ang), s = Math.sin(ang), d = dot(ax, v); return add(add(mul(v, c), mul(cross(ax, v), s)), mul(ax, d * (1 - c))); }
// 큰 원 거리 (km, 기준 구)
function gcDist(a, b) { const p = llv(a[0], a[1]), q = llv(b[0], b[1]); return Math.atan2(vlen(cross(p, q)), dot(p, q)) * R_MOON; }

// 행렬 (열 우선)
function perspective(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2); return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]); }

function mmul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }

precision highp float; precision highp int;
in vec2 a_uv; in float a_skirt;
uniform vec4 u_ll; uniform highp sampler2D u_h; uniform vec4 u_hx; uniform vec4 u_cx;
uniform float u_exag, u_R, u_skirt; uniform vec3 u_eye; uniform mat4 u_vp;
out vec2 v_uvc; out vec2 v_ll; out vec3 v_p; out float v_h;
void main() {
  float lon = u_ll.x + a_uv.x * u_ll.z, lat = u_ll.y + a_uv.y * u_ll.w;
  vec3 dir = vec3(cos(lat) * cos(lon), cos(lat) * sin(lon), sin(lat));
  float h = texture(u_h, (clamp(u_hx.xy + a_uv * u_hx.z, 0.0, 1.0) * u_hx.w + 0.5) / (u_hx.w + 1.0)).r;
  float r = u_R + h * u_exag - a_skirt * u_skirt;
  vec3 p = dir * r - u_eye;
  v_p = p; v_ll = vec2(lon, lat); v_uvc = u_cx.xy + a_uv * u_cx.z; v_h = h * u_exag;
  gl_Position = u_vp * vec4(p, 1.0);
