<style>

[hidden] { display: none !important; }

.stat b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat .plus { position: absolute; right: 10px; top: 4px; font-weight: 900; color: #7dffb0; animation: plus .8s ease-out forwards; pointer-events: none; }
@keyframes plus { to { transform: translateY(-26px); opacity: 0; } }
.btn { flex: 1 1 auto; padding: 10px 12px; font: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); } .btn:disabled { opacity: .35; cursor: default; filter: none; }
.btn.primary { background: linear-gradient(160deg, #ffcf5c, #e8913a); border-color: transparent; color: #2a1600; box-shadow: 0 8px 20px -8px rgba(255, 200, 90, .5); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; background: rgba(5, 7, 16, .6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ov[hidden] { display: none; }
.pcard { background: linear-gradient(160deg, rgba(30, 34, 64, .9), rgba(12, 14, 30, .95)); border: 1px solid rgba(160, 170, 255, .18); border-radius: 22px; padding: 22px 22px 18px; width: min(420px, 100%); max-height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8); }
.pcard::-webkit-scrollbar { display: none; }
.logo { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.tag { text-align: center; color: #9aa3c7; font-size: 13px; letter-spacing: .08em; margin-bottom: 16px; }
.mbox { border: 1px solid rgba(160, 170, 255, .16); background: rgba(255, 255, 255, .04); border-radius: 16px; padding: 14px; margin-top: 10px; }
.mbox h3 { font-size: 17px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mbox h3 small { font-size: 12px; color: #ffb35c; font-weight: 800; white-space: nowrap; }
.mbox p { font-size: 12.5px; color: #9aa3c7; margin-top: 4px; line-height: 1.45; }
.mbox .status { font-size: 13px; color: #c5cbea; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 6px 11px; font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: inherit; cursor: pointer; }
.chip.on { background: linear-gradient(160deg, #ffcf5c, #e8913a); border-color: transparent; color: #2a1600; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
h2 { font-size: 22px; text-align: center; margin-bottom: 10px; }
.big { text-align: center; font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(90deg, #ffd23f, #ff8a5c, #ff4f7a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: #9aa3c7; font-size: 13px; }
.newrec { text-align: center; color: #ffd23f; font-weight: 800; letter-spacing: .1em; font-size: 13px; margin-top: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.grid2 { display: grid; grid-template-columns: 1fr auto; gap: 7px 14px; margin-top: 14px; font-size: 14px; color: #c5cbea; font-variant-numeric: tabular-nums; }
.grid2 b { color: #fff; text-align: right; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: #c5cbea; }
.row > span:first-child { white-space: nowrap; }
.row .chips { margin-top: 0; justify-content: flex-end; }
.sl { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: #c5cbea; }
.sl input { width: 100%; accent-color: #8a7cff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 6px; }
td { padding: 7px 4px; border-bottom: 1px solid rgba(255, 255, 255, .06); } td:last-child { text-align: right; color: #9aa3c7; font-size: 12.5px; }
td:first-child { color: #b9a6ff; font-weight: 800; }
h4 { font-size: 13px; color: #9aa3c7; letter-spacing: .08em; margin-top: 14px; }
.keys { display: grid; grid-template-columns: minmax(0, 45%) 1fr; gap: 7px 14px; font-size: 13.5px; color: #c5cbea; align-items: center; }
.keys kbd { font: 700 12px ui-monospace, monospace; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .15); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: #fff; justify-self: start; white-space: normal; overflow-wrap: anywhere; }
.tips { margin-top: 14px; display: grid; gap: 6px; font-size: 12.5px; color: #9aa3c7; line-height: 1.45; }
.tips div::before { content: '•'; color: #a05cff; margin-right: 6px; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 12; background: rgba(20, 24, 50, .92); border: 1px solid rgba(160, 170, 255, .3); padding: 10px 18px; border-radius: 14px; font-weight: 800; animation: toast 1.8s ease forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

.logo { align-items: center; gap: 10px; }
@keyframes shake { 15% { transform: translate(-6px, 3px); } 30% { transform: translate(5px, -4px); } 45% { transform: translate(-4px, -3px); } 60% { transform: translate(3px, 4px); } 80% { transform: translate(-2px, 1px); } }
.btn.on { background: linear-gradient(160deg, #ff6a6a, #d81e3c); border-color: transparent; color: #fff; }

body { background: radial-gradient(120% 90% at 50% 20%, #3a9a5e 0%, #2b7e4a 50%, #1c5c35 100%); font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Hiragino Sans', 'Yu Gothic UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK KR', system-ui, sans-serif; color: #eef6f2; user-select: none; -webkit-user-select: none; touch-action: none; outline: none; }

.bar .ttl { font-weight: 900; font-size: 18px; white-space: nowrap; }

.bar .sp { flex: 1; }

.bar .info b { color: #fff; }
.ib { height: 38px; min-width: 38px; padding: 0 10px; border-radius: 11px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(0, 0, 0, .22); color: #eef6f2; cursor: pointer; display: grid; place-items: center; font: inherit; font-size: 13px; font-weight: 700; flex: none; }
.ib svg { width: 18px; height: 18px; } .ib:disabled { opacity: .35; }
.ib.lbl { display: flex; gap: 6px; align-items: center; }
#table { position: fixed; inset: 0; }
.slot { position: absolute; border-radius: var(--cr); border: 2px dashed rgba(255, 255, 255, .18); background: rgba(0, 0, 0, .12); display: grid; place-items: center; color: rgba(255, 255, 255, .22); font-size: calc(var(--cw) * .5); }
.slot.found { border-style: solid; border-color: rgba(255, 220, 140, .25); }
.slot.hl, .card.hl { box-shadow: 0 0 0 3px #ffd23f, 0 0 18px 4px rgba(255, 210, 63, .7) !important; }
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .07); background: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 3px 8px rgba(0, 0, 0, .18); transition: transform var(--sp) cubic-bezier(.2, .8, .3, 1); will-change: transform; cursor: pointer; }
.card svg { display: block; pointer-events: none; }
.card.drag { transition: none; box-shadow: 0 12px 26px rgba(0, 0, 0, .45); }
.card .ix { position: absolute; left: calc(var(--cw) * .07); top: calc(var(--cw) * .03); line-height: 1; font-weight: 800; text-align: center; letter-spacing: -.04em; }
.card .ix { display: flex; align-items: baseline; gap: calc(var(--cw) * .03); }
.card .ix .r { font-size: calc(var(--cw) * .33); }
.card .ix .s { font-size: calc(var(--cw) * .27); }
.card .ix2 { display: none; position: absolute; right: calc(var(--cw) * .07); top: calc(var(--cw) * .06); font-size: calc(var(--cw) * .3); line-height: 1; }
.card .mid { position: absolute; left: 0; right: 0; bottom: calc(var(--ch) * .1); text-align: center; font-size: calc(var(--cw) * .62); line-height: 1; }
.card .face { position: absolute; inset: calc(var(--ch) * .36) calc(var(--cw) * .14) calc(var(--ch) * .07); border-radius: calc(var(--cr) * .7); display: grid; place-items: center; font-weight: 900; font-size: calc(var(--cw) * .44); }
.card.red { color: #d0203a; } .card.blk { color: #1b1f2e; }

.dropok { outline: 2px solid rgba(255, 210, 63, .8); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
.toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 12; background: rgba(10, 30, 26, .94); border: 1px solid rgba(255, 255, 255, .25); padding: 10px 18px; border-radius: 14px; font-weight: 800; animation: toast 2.2s ease forwards; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
.logo { align-items: center; gap: 8px; flex-direction: column; }

.fan { position: relative; width: 150px; height: 70px; }
.fan i { position: absolute; left: 55px; top: 4px; width: 42px; height: 60px; border-radius: 6px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35); font-style: normal; font-weight: 900; font-size: 20px; display: grid; place-items: center; transform-origin: 50% 120%; }
.dealin { display: flex; gap: 8px; margin-top: 8px; } .dealin input { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.25); color: #fff; font: inherit; font-size: 15px; }

.pcard { background: linear-gradient(160deg, rgba(20, 60, 50, .92), rgba(6, 24, 20, .96)); border-color: rgba(255,255,255,.16); }
.mbox { border-color: rgba(255,255,255,.14); }

// - 누르면 wiiiv.ai 를 새 탭으로 연다. wiiiv 안(틀)에서는 이미 wiiiv 이고 새 창도 막혀 있어 링크를 걸지 않는다.
// - 그림은 앱 안의 것을 바로 쓰고, 같은 그림을 wiiiv.ai 에서 한 번 받아 간다 → 서버가 앱·환경별 사용 수를 센다 (IP·사용자 정보는 남기지 않음).
//   서버가 느리거나 막혀도 앱에는 영향이 없다. 같은 브라우저는 12시간 캐시라 다시 세지 않는다.
// 쓰는 법: wiiivMark(imgElement, '앱id')  — 원본: tools/wiiivapp-src/_shared/wiiiv-logo.js (모든 앱 같은 내용)
const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;
    } catch { /* 무시 */ }
  }
  if (WIIIV_CTX !== 'wiiiv' && !img.dataset.wiiivLink) {
    img.dataset.wiiivLink = '1'; img.style.cursor = 'pointer'; img.title = 'wiiiv.ai';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); window.open(`${WIIIV_HOME}/?from=${encodeURIComponent(app)}`, '_blank', 'noopener'); });
  }
  return img;
}

const RANK = c => c >> 2, SUIT = c => c & 3, RED = c => (c & 3) === 1 || (c & 3) === 2;

const SUITS = ['♣', '♦', '♥', '♠'];

  const deck = Array.from({ length: 52 }, (_, i) => i), cols = [[], [], [], [], [], [], [], []];
  for (let i = 0; i < 52; i++) { const left = 52 - i, j = rand() % left; cols[i % 8].push(deck[j]); deck[j] = deck[left - 1]; }

const LANG = 'ko';
const T = (() => { const l = String(LANG || 'en'); if (/^zh-(TW|HK|MO|Hant)/i.test(l)) return TX['zh-TW']; return TX[l] || TX[l.split('-')[0].toLowerCase()] || TX.en; })();

const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (typeof o === 'object' ? o[k] : o));
const tfmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dateLabel = ds => { try { return new Intl.DateTimeFormat(LANG, { month: 'long', day: 'numeric' }).format(new Date(ds + 'T12:00:00')); } catch { return ds; } };
const DEF = { four: false, auto: true, music: 'A', mv: 0.3, sv: 0.7, speed: 0, muted: false };
let ST = { set: { ...DEF }, stats: { played: 0, won: 0, streak: 0, bestStreak: 0, bestTime: 0, fewest: 0 }, cur: null, curDaily: null, daily: {}, dailyDeal: {} };
try { const d = JSON.parse(localStorage.getItem('wiiiv-freecell') || '{}'); ST = { ...ST, ...d, set: { ...DEF, ...(d.set || {}) }, stats: { ...ST.stats, ...(d.stats || {}) } }; } catch { /* 저장소 없이도 동작 */ }
const SET = ST.set;

const chip = new Chip(); chip.setVol(SET.mv, SET.sv); chip.muted = SET.muted;
let game = null, mode = 'classic', dayKey = null, phase = 'menu', elapsed = 0, running = false, lastT = 0, busy = false, counted = false;
const table = $('table'), els = [];

// ── 풀이기는 따로 일하는 일꾼에서 (화면이 멈추지 않게)
let worker = null, wid = 0; const pending = new Map();
try {
  const code = ENGINE_SRC + '\nonmessage = e => { const { id, state, limit } = e.data; let path = null; try { path = solveHard(state, limit); } catch (err) {} postMessage({ id, path }); };';
  worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  worker.onmessage = e => { const cb = pending.get(e.data.id); pending.delete(e.data.id); if (cb) cb(e.data.path); };
  worker.onerror = () => { worker = null; };
} catch { worker = null; }
function solveAsync(state, limit) { return new Promise(res => { if (worker) { const id = ++wid; pending.set(id, res); worker.postMessage({ id, state, limit }); } else setTimeout(() => res(solveHard(state, limit)), 20); }); }

function makeCards() {
  for (let c = 0; c < 52; c++) {
    const el = document.createElement('div'), r = RANK(c), s = SUIT(c);
    el.className = 'card'; el.dataset.c = c; el.innerHTML = svgCard(c, SET.four);
    table.appendChild(el); els[c] = el;
  }
  for (let i = 0; i < 8; i++) { const s = document.createElement('div'); s.className = 'slot' + (i >= 4 ? ' found' : ''); s.id = 'slot' + i; if (i >= 4) s.textContent = SUITS[i - 4]; table.appendChild(s); }
}

function buildRecords() {

  B.appendChild(g);
  const h = document.createElement('h4'); const s = streak(); h.textContent = `${T.history}${s ? ' · ' + fmt(T.streak, s) : ''}`; B.appendChild(h);
  const t = document.createElement('table'); const days = Object.keys(ST.daily).filter(k => ST.daily[k].done).sort().reverse().slice(0, 10);

function build() {
  $('pageTitle').textContent = T.title; $('logo').textContent = T.title; $('tTag').textContent = T.tag;
  const fan = $('fan'); fan.innerHTML = ''; [[51, -24], [46, -12], [41, 0], [36, 12], [0, 24]].forEach(([c, a]) => { const i = document.createElement('i'); i.textContent = RANKS[RANK(c)] + SUITS[SUIT(c)]; i.style.color = RED(c) ? '#d0203a' : '#1b1f2e'; i.style.transform = `rotate(${a}deg)`; i.style.fontSize = '15px'; fan.appendChild(i); });

  $('bResMenu').textContent = T.menu; $('bResMenu').onclick = toMenu; $('bAgain').onclick = () => newDeal();

    const txt = `wiiiv ${T.title} · ${T.daily} ${dayKey} (${fmt(T.dealN, rec.deal)})\n⏱ ${tfmt(rec.time)} · ${T.moves} ${rec.moves}`;
