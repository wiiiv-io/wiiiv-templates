<script>
'use strict';
const LANG = 'ko';
const CV=document.getElementById('c'),X=CV.getContext('2d');
const COLS=28,ROWS=31,TS=22;
const DPR=Math.max(window.devicePixelRatio||1,2);
CV.width=COLS*TS*DPR;CV.height=ROWS*TS*DPR;
X.scale(DPR,DPR);

/* ───────── MAP ───────── */
const MAP_STR=[
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.##### ## #####.######",
"     #.##### ## #####.#     ",
"     #.##          ##.#     ",
"     #.## ###--### ##.#     ",
"######.## #      # ##.######",
"      .   #      #   .      ",
"######.## #      # ##.######",
"     #.## ######## ##.#     ",
"     #.##          ##.#     ",
"     #.## ######## ##.#     ",
"######.## ######## ##.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#o..##................##..o#",
"###.##.##.########.##.##.###",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#.##########.##.##########.#",
"#..........................#",
"############################",
];

let map,dots,totalDots,dotsEaten;
function buildMap(){
  map=[];dots=[];totalDots=0;dotsEaten=0;
  for(let r=0;r<ROWS;r++){
    map[r]=[];dots[r]=[];
    const row=MAP_STR[r]||'';
    for(let c=0;c<COLS;c++){
      const ch=row[c]||' ';
      const wall=ch==='#',door=ch==='-',dot=ch==='.',power=ch==='o';
      map[r][c]={wall,door};
      dots[r][c]=0;
      if(dot){dots[r][c]=1;totalDots++;}
      if(power){dots[r][c]=2;totalDots++;}
    }
  }
}

/* ───────── CONSTANTS ───────── */
const DX=[0,-1,0,1],DY=[-1,0,1,0]; // up left down right
const GHOST_COLORS=['#ff0000','#ffb8ff','#00ffff','#ffb852'];
const GHOST_NAMES=['Blinky','Pinky','Inky','Clyde'];
const SCATTER_TARGETS=[[25,0],[2,0],[27,30],[0,30]];
const GHOST_START=[[14,11],[14,14],[12,14],[16,14]];
const GHOST_HOME=[false,true,true,true];
const PAC_START={col:14,row:23};
const FRUIT_POS={col:14,row:17};
const GHOST_HOUSE_CENTER={col:14,row:14};
const GHOST_HOUSE_EXIT={col:14,row:11};

const FRUITS=[
  {emoji:'🍒',pts:100},{emoji:'🍓',pts:300},{emoji:'🍊',pts:500},{emoji:'🍊',pts:500},
  {emoji:'🍎',pts:700},{emoji:'🍎',pts:700},{emoji:'🍈',pts:1000},{emoji:'🍈',pts:1000},
  {emoji:'🔔',pts:3000},{emoji:'🔔',pts:3000},{emoji:'🔑',pts:5000},{emoji:'🔑',pts:5000},
];
function fruitForLevel(lv){return lv<=12?FRUITS[lv-1]:{emoji:'🔑',pts:5000};}

/* speed tables: [pacSpd, pacDotSpd, ghostSpd, ghostFrightSpd, ghostTunnelSpd, frightSeconds] */
const SPEED_TABLE=[
  [.80,.71,.75,.50,.40,6],[.90,.79,.85,.55,.45,5],[.90,.79,.85,.55,.45,4],
  [.90,.79,.85,.55,.45,3],[1.0,.87,.95,.60,.50,2],[1.0,.87,.95,.60,.50,5],
  [1.0,.87,.95,.60,.50,2],[1.0,.87,.95,.60,.50,2],[1.0,.87,.95,.60,.50,1],
  [1.0,.87,.95,.60,.50,5],[1.0,.87,.95,.60,.50,2],[1.0,.87,.95,.60,.50,1],
  [1.0,.87,.95,.60,.50,1],[1.0,.87,.95,.60,.50,3],[1.0,.87,.95,.60,.50,1],
  [1.0,.87,.95,.60,.50,1],[1.0,.87,.95,.60,.50,0],[1.0,.87,.95,.60,.50,1],
  [.90,.79,.95,.55,.50,0],[.90,.79,.95,.55,.50,0],[.90,.79,.95,.55,.50,0]
];
function levelParams(lv){
  const s=SPEED_TABLE[Math.min(lv-1,20)];
  return{pacSpd:s[0],pacDotSpd:s[1],ghostSpd:s[2],ghostFright:s[3],ghostTunnel:s[4],frightTime:s[5]};
}

/* scatter/chase timing (seconds) */
const SC_TIMINGS=[
  [7,20,7,20,5,20,5,9999],
  [7,20,7,20,5,1033,1/60,9999],
  [5,20,5,20,5,1037,1/60,9999]
];
function getScatterChase(lv){
  if(lv===1)return SC_TIMINGS[0];
  if(lv<=4)return SC_TIMINGS[1];
  return SC_TIMINGS[2];
}

/* ───────── STATE ───────── */
let score=0,highScore=0,lives=3,level=1,state='title';
let pac,ghosts,fruit;
let modeTimer,modeIdx,scatterChaseSeq;
let frightTimer,ghostEatCombo;
let globalDotTimer;
let frameCount=0,animFrame;
let deathAnim=false,deathTimer=0;
let levelClearAnim=false,levelClearTimer=0;
let readyTimer=0;
let freezeTimer=0;
let scorePopups=[];
let gameStarted=false;

try{highScore=parseInt(localStorage.getItem('pacman_hi'))||0;}catch(e){highScore=0;}

/* ───────── AUDIO ───────── */
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playTone(freq,dur,type,vol){
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    g.gain.value=vol||.08;
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function sndDot(){playTone(440,.05,'sine',.05);}
function sndPower(){playTone(120,.4,'square',.12);setTimeout(()=>playTone(240,.3,'square',.08),100);}
function sndEatGhost(){playTone(880,.15,'sawtooth',.1);setTimeout(()=>playTone(1200,.1,'sawtooth',.08),80);}
function sndDeath(){
  for(let i=0;i<8;i++)setTimeout(()=>playTone(400-i*30,.08,'sawtooth',.06),i*80);
}
function sndFruit(){playTone(660,.1,'sine',.1);setTimeout(()=>playTone(880,.1,'sine',.1),80);setTimeout(()=>playTone(1100,.15,'sine',.08),160);}
function sndStart(){
  const notes=[262,330,392,523];
  for(let i=0;i<notes.length;i++)setTimeout(()=>playTone(notes[i],.15,'square',.06),i*140);
}
function sndLevelClear(){
  const notes=[523,659,784,1047];
  for(let i=0;i<notes.length;i++)setTimeout(()=>playTone(notes[i],.2,'sine',.08),i*120);
}

/* ───────── MOVEMENT HELPERS ───────── */
function canMove(col,row,isGhost){
  if(row<0||row>=ROWS)return false;
  const c=((col%COLS)+COLS)%COLS;
  const t=map[row]?map[row][c]:null;
  if(!t)return false;
  if(t.wall)return false;
  if(t.door&&!isGhost)return false;
  return true;
}
function dist(x1,y1,x2,y2){return(x1-x2)**2+(y1-y2)**2;}
function distReal(x1,y1,x2,y2){return Math.sqrt(dist(x1,y1,x2,y2));}
function isInTunnel(col){return col<=5||col>=22;}

/* ───────── ENTITIES ───────── */
function createPac(){
  return{
    col:PAC_START.col,row:PAC_START.row,dir:1,nextDir:1,
    x:PAC_START.col*TS+TS/2,y:PAC_START.row*TS+TS/2,
    subCol:0,subRow:0,
    mouth:0,mouthDir:1,moving:false
  };
}

function createGhost(i){
  return{
    idx:i,col:GHOST_START[i][0],row:GHOST_START[i][1],
    x:GHOST_START[i][0]*TS+TS/2,y:GHOST_START[i][1]*TS+TS/2,
    dir:i===0?2:0,nextDir:-1,
    scared:false,eaten:false,
    inHouse:GHOST_HOME[i],exitingHouse:false,
    bounceDir:1,released:!GHOST_HOME[i],
    reverseFlag:false
  };
}

/* ───────── INIT ───────── */
function initLevel(){
  buildMap();
  pac=createPac();
  ghosts=[];for(let i=0;i<4;i++)ghosts.push(createGhost(i));
  modeIdx=0;modeTimer=0;
  scatterChaseSeq=getScatterChase(level);
  frightTimer=0;ghostEatCombo=0;
  fruit={active:false,timer:0,type:fruitForLevel(level)};
  globalDotTimer=0;
  scorePopups=[];freezeTimer=0;
  deathAnim=false;levelClearAnim=false;
  frameCount=0;
}

function resetPositions(){
  pac=createPac();
  for(let i=0;i<4;i++){
    const g=ghosts[i];
    g.col=GHOST_START[i][0];g.row=GHOST_START[i][1];
    g.x=g.col*TS+TS/2;g.y=g.row*TS+TS/2;
    g.dir=i===0?2:0;g.nextDir=-1;
    g.scared=false;g.eaten=false;
    g.inHouse=GHOST_HOME[i];g.exitingHouse=false;
    g.bounceDir=1;g.released=!GHOST_HOME[i];
    g.reverseFlag=false;
  }
  modeIdx=0;modeTimer=0;frightTimer=0;ghostEatCombo=0;
  fruit.active=false;freezeTimer=0;scorePopups=[];
}

function startGame(){
  score=0;lives=3;level=1;
  initLevel();
  state='ready';readyTimer=120;
  sndStart();
  updateHUD();
  gameStarted=true;
}

function updateHUD(){
  document.getElementById('scoreTxt').textContent='SCORE '+String(score).padStart(6,'0');
  document.getElementById('hiTxt').textContent='HIGH '+String(highScore).padStart(6,'0');
  document.getElementById('lvlTxt').textContent='LEVEL '+level;
  const lDiv=document.getElementById('lives');
  lDiv.innerHTML='';
  for(let i=0;i<lives-1;i++){
    const cv2=document.createElement('canvas');cv2.width=20;cv2.height=20;
    const x2=cv2.getContext('2d');
    drawPacSprite(x2,10,10,8,.2,3);
    lDiv.appendChild(cv2);
  }
}

/* ───────── GHOST AI ───────── */
function ghostTarget(g){
  if(g.eaten)return{tx:GHOST_HOUSE_EXIT.col,ty:GHOST_HOUSE_EXIT.row};
  if(g.scared){
    // Frightened: flee from pac-man — pick the direction that maximizes distance
    return{tx:-1,ty:-1,flee:true};
  }
  const isScatter=modeIdx%2===0;
  if(isScatter)return{tx:SCATTER_TARGETS[g.idx][0],ty:SCATTER_TARGETS[g.idx][1]};

  // Chase mode targets
  const px=pac.col,py=pac.row,pd=pac.dir;
  switch(g.idx){
    case 0: // Blinky: target pac-man directly
      return{tx:px,ty:py};
    case 1:{ // Pinky: 4 tiles ahead of pac-man
      let tx=px+DX[pd]*4,ty=py+DY[pd]*4;
      if(pd===0){tx-=4;} // original overflow bug
      return{tx,ty};
    }
    case 2:{ // Inky: use Blinky as pivot
      let ax=px+DX[pd]*2,ay=py+DY[pd]*2;
      if(pd===0){ax-=2;}
      const bx=ghosts[0].col,by=ghosts[0].row;
      return{tx:ax*2-bx,ty:ay*2-by};
    }
    case 3:{ // Clyde: chase if far, scatter if close
      const d=distReal(g.col,g.row,px,py);
      return d>8?{tx:px,ty:py}:{tx:SCATTER_TARGETS[3][0],ty:SCATTER_TARGETS[3][1]};
    }
  }
  return{tx:px,ty:py};
}

function bestDir(g,target){
  const cur=g.dir;
  const opp=(cur+2)%4;
  let bestD=-1,bestDist=Infinity;

  // Priority order: up, left, down, right (original pac-man priority)
  const priority=[0,1,2,3];

  for(const d of priority){
    if(d===opp&&!g.exitingHouse)continue;
    const nc=((g.col+DX[d])%COLS+COLS)%COLS;
    const nr=g.row+DY[d];
    if(!canMove(nc,nr,true))continue;
    // Don't enter ghost house door unless eaten or exiting
    const curTile=map[g.row]?map[g.row][g.col]:null;
    const nextTile=map[nr]?map[nr][nc]:null;
    if(curTile&&!curTile.door&&nextTile&&nextTile.door&&!g.eaten&&!g.exitingHouse)continue;
    // Ghosts can't go up in specific tiles (original restriction)
    if(d===0&&!g.eaten&&!g.scared){
      if((g.row===23&&(g.col===12||g.col===15))||(g.row===11&&(g.col===12||g.col===15)))continue;
    }

    if(target.flee){
      // Frightened: maximize distance from pac-man
      const dd=dist(nc,nr,pac.col,pac.row);
      if(dd>bestDist||bestD<0){bestDist=dd;bestD=d;}
    }else{
      const dd=dist(nc,nr,target.tx,target.ty);
      if(dd<bestDist){bestDist=dd;bestD=d;}
    }
  }
  return bestD>=0?bestD:opp;
}

/* ───────── PAC-MAN MOVEMENT ───────── */
function movePac(){
  const lp=levelParams(level);
  const baseSpd=TS/10;
  const dotOnTile=dots[pac.row]&&dots[pac.row][pac.col]>0;
  let spd=baseSpd*(dotOnTile?lp.pacDotSpd:lp.pacSpd);

  const cx=pac.col*TS+TS/2,cy=pac.row*TS+TS/2;
  const atCenter=Math.abs(pac.x-cx)<0.5&&Math.abs(pac.y-cy)<0.5;

  if(atCenter){
    pac.x=cx;pac.y=cy;
    const nd=pac.nextDir;
    const nc=((pac.col+DX[nd])%COLS+COLS)%COLS;
    const nr=pac.row+DY[nd];
    if(canMove(nc,nr,false))pac.dir=nd;
    const fc=((pac.col+DX[pac.dir])%COLS+COLS)%COLS;
    const fr=pac.row+DY[pac.dir];
    if(!canMove(fc,fr,false)){pac.moving=false;return;}
    pac.moving=true;
  }

  pac.x+=DX[pac.dir]*spd;
  pac.y+=DY[pac.dir]*spd;

  // Arrival: detect reaching the next tile center
  const ntc=pac.col+DX[pac.dir],ntr=pac.row+DY[pac.dir];
  if(ntc<0){
    if(pac.x<0){pac.col=COLS-1;pac.x=pac.col*TS+TS/2;pac.y=pac.row*TS+TS/2;}
  }else if(ntc>=COLS){
    if(pac.x>=COLS*TS){pac.col=0;pac.x=pac.col*TS+TS/2;pac.y=pac.row*TS+TS/2;}
  }else{
    const ncx=ntc*TS+TS/2,ncy=ntr*TS+TS/2;
    let arrived=false;
    const d=pac.dir;
    if(d===3&&pac.x>=ncx)arrived=true;
    else if(d===1&&pac.x<=ncx)arrived=true;
    else if(d===2&&pac.y>=ncy)arrived=true;
    else if(d===0&&pac.y<=ncy)arrived=true;
    if(arrived){pac.col=ntc;pac.row=ntr;pac.x=ncx;pac.y=ncy;}
  }

  pac.mouth+=.12*pac.mouthDir;
  if(pac.mouth>.45||pac.mouth<.02){pac.mouthDir*=-1;pac.mouth=Math.max(.02,Math.min(.45,pac.mouth));}
}

/* ───────── GHOST MOVEMENT ───────── */
function moveGhost(g){
  if(g.inHouse&&!g.exitingHouse){
    g.y+=g.bounceDir*.6;
    const homeY=g.row*TS+TS/2;
    if(g.y>homeY+5||g.y<homeY-5)g.bounceDir*=-1;
    return;
  }

  const lp=levelParams(level);
  const baseSpd=TS/10;
  let spd;
  if(g.eaten)spd=baseSpd*1.6;
  else if(g.scared)spd=baseSpd*lp.ghostFright;
  else if(isInTunnel(g.col))spd=baseSpd*lp.ghostTunnel;
  else spd=baseSpd*lp.ghostSpd;
  if(g.exitingHouse)spd=baseSpd*.5;

  const cx=g.col*TS+TS/2,cy=g.row*TS+TS/2;
  const atCenter=Math.abs(g.x-cx)<0.5&&Math.abs(g.y-cy)<0.5;

  if(atCenter){
    g.x=cx;g.y=cy;
    if(g.exitingHouse){
      if(g.col===GHOST_HOUSE_EXIT.col&&g.row===GHOST_HOUSE_EXIT.row){
        g.exitingHouse=false;g.inHouse=false;g.dir=0;
        return;
      }
      if(g.col<GHOST_HOUSE_EXIT.col)g.dir=3;
      else if(g.col>GHOST_HOUSE_EXIT.col)g.dir=1;
      else g.dir=0;
    }
    else if(g.eaten&&g.col===GHOST_HOUSE_EXIT.col&&g.row===GHOST_HOUSE_EXIT.row){
      g.dir=2;
    }
    else if(g.eaten&&g.col===GHOST_HOUSE_CENTER.col&&g.row===GHOST_HOUSE_CENTER.row){
      g.eaten=false;g.inHouse=false;g.exitingHouse=true;g.scared=false;
      return;
    }
    else{
      if(g.reverseFlag){g.dir=(g.dir+2)%4;g.reverseFlag=false;}
      const target=ghostTarget(g);
      g.dir=bestDir(g,target);
    }
  }

  g.x+=DX[g.dir]*spd;
  g.y+=DY[g.dir]*spd;

  // Arrival detection
  const ntc=g.col+DX[g.dir],ntr=g.row+DY[g.dir];
  if(ntc<0){
    if(g.x<0){g.col=COLS-1;g.x=g.col*TS+TS/2;g.y=g.row*TS+TS/2;}
  }else if(ntc>=COLS){
    if(g.x>=COLS*TS){g.col=0;g.x=g.col*TS+TS/2;g.y=g.row*TS+TS/2;}
  }else{
    const ncx=ntc*TS+TS/2,ncy=ntr*TS+TS/2;
    let arrived=false;
    const d=g.dir;
    if(d===3&&g.x>=ncx)arrived=true;
    else if(d===1&&g.x<=ncx)arrived=true;
    else if(d===2&&g.y>=ncy)arrived=true;
    else if(d===0&&g.y<=ncy)arrived=true;
    if(arrived){g.col=ntc;g.row=ntr;g.x=ncx;g.y=ncy;}
  }
}

/* ───────── GHOST RELEASE ───────── */
function releaseGhosts(){
  const dotLimits=[0, level===1?0:0, level===1?30:0, level===1?60:level===2?50:0];
  for(let i=1;i<4;i++){
    const g=ghosts[i];
    if(g.released||!g.inHouse)continue;
    if(dotsEaten>=dotLimits[i]){g.released=true;g.exitingHouse=true;}
  }
  globalDotTimer++;
  if(globalDotTimer>240){
    for(let i=1;i<4;i++){
      if(ghosts[i].inHouse&&!ghosts[i].exitingHouse){
        ghosts[i].exitingHouse=true;ghosts[i].released=true;
        globalDotTimer=0;break;
      }
    }
  }
}

/* ───────── MODE SWITCHING ───────── */
function updateMode(){
  if(frightTimer>0){
    frightTimer--;
    if(frightTimer<=0){
      for(const g of ghosts){
        if(g.scared){g.scared=false;g.reverseFlag=true;}
      }
    }
    return;
  }
  modeTimer++;
  const seq=scatterChaseSeq;
  let acc=0;
  for(let i=0;i<seq.length;i++){
    acc+=seq[i]*60;
    if(modeTimer<acc){
      if(modeIdx!==i){
        const wasScatter=modeIdx%2===0;
        const isScatter=i%2===0;
        if(wasScatter!==isScatter){
          for(const g of ghosts){
            if(!g.inHouse&&!g.eaten&&!g.scared)g.reverseFlag=true;
          }
        }
        modeIdx=i;
      }
      return;
    }
  }
  modeIdx=seq.length-1;
}

/* ───────── COLLISIONS ───────── */
function checkCollisions(){
  for(const g of ghosts){
    if(g.inHouse||g.exitingHouse)continue;
    const d=distReal(pac.x,pac.y,g.x,g.y);
    if(d<TS*.65){
      if(g.scared&&!g.eaten){
        g.eaten=true;g.scared=false;
        ghostEatCombo++;
        const pts=[200,400,800,1600][Math.min(ghostEatCombo-1,3)];
        score+=pts;
        if(score>highScore){highScore=score;try{localStorage.setItem('pacman_hi',highScore);}catch(e){}}
        sndEatGhost();
        scorePopups.push({x:g.x,y:g.y,val:pts,timer:40});
        freezeTimer=30;
        updateHUD();
      }else if(!g.eaten){
        sndDeath();
        lives--;
        updateHUD();
        if(lives<=0){state='gameover';}
        else{deathAnim=true;deathTimer=75;}
        return;
      }
    }
  }
}

/* ───────── DOTS & FRUIT ───────── */
function eatDots(){
  const c=pac.col,r=pac.row;
  if(dots[r]&&dots[r][c]===1){
    dots[r][c]=0;score+=10;dotsEaten++;sndDot();
    globalDotTimer=0;
    if(dotsEaten===70||dotsEaten===170){fruit.active=true;fruit.timer=600;fruit.type=fruitForLevel(level);}
  }else if(dots[r]&&dots[r][c]===2){
    dots[r][c]=0;score+=50;dotsEaten++;sndPower();
    globalDotTimer=0;
    const lp=levelParams(level);
    if(lp.frightTime>0){
      frightTimer=lp.frightTime*60;
      ghostEatCombo=0;
      for(const g of ghosts){
        if(!g.inHouse&&!g.eaten){
          g.scared=true;
          g.reverseFlag=true;
        }
      }
    }
  }
  if(fruit.active&&pac.col===FRUIT_POS.col&&pac.row===FRUIT_POS.row){
    score+=fruit.type.pts;fruit.active=false;sndFruit();
    scorePopups.push({x:FRUIT_POS.col*TS+TS/2,y:FRUIT_POS.row*TS+TS/2,val:fruit.type.pts,timer:50});
  }
  if(score>highScore){highScore=score;try{localStorage.setItem('pacman_hi',highScore);}catch(e){}}
  updateHUD();
  if(dotsEaten>=totalDots){
    levelClearAnim=true;levelClearTimer=150;
    sndLevelClear();
  }
}

/* ───────── DRAWING ───────── */
function drawWalls(fillClr,lineClr){
  const wf=fillClr||'#0c0c4a';
  const wl=lineClr||'#2121de';
  // Fill wall tiles
  X.fillStyle=wf;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(map[r][c].wall)X.fillRect(c*TS,r*TS,TS,TS);
  }
  // Draw outline on corridor-facing edges (single path for smooth joins)
  X.strokeStyle=wl;X.lineWidth=2;
  X.beginPath();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!map[r][c].wall)continue;
    const x=c*TS,y=r*TS;
    const u=r>0&&map[r-1][c].wall;
    const d=r<ROWS-1&&map[r+1][c].wall;
    const l=c>0&&map[r][c-1].wall;
    const ri=c<COLS-1&&map[r][c+1].wall;
    if(!u){X.moveTo(x,y);X.lineTo(x+TS,y);}
    if(!d){X.moveTo(x,y+TS);X.lineTo(x+TS,y+TS);}
    if(!l){X.moveTo(x,y);X.lineTo(x,y+TS);}
    if(!ri){X.moveTo(x+TS,y);X.lineTo(x+TS,y+TS);}
  }
  X.stroke();
  // Ghost house door
  X.strokeStyle='#ffb8ae';X.lineWidth=3;
  X.beginPath();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(map[r][c].door){X.moveTo(c*TS,r*TS+TS/2);X.lineTo(c*TS+TS,r*TS+TS/2);}
  }
  X.stroke();
}

function drawDots(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const dx=c*TS+TS/2,dy=r*TS+TS/2;
      if(dots[r][c]===1){
        X.fillStyle='#ffb8ae';
        X.beginPath();X.arc(dx,dy,TS*.1,0,Math.PI*2);X.fill();
      }else if(dots[r][c]===2){
        if(Math.floor(frameCount/15)%2===0){
          X.fillStyle='#ffb8ae';
          X.beginPath();X.arc(dx,dy,TS*.28,0,Math.PI*2);X.fill();
          X.fillStyle='rgba(255,184,174,.25)';
          X.beginPath();X.arc(dx,dy,TS*.42,0,Math.PI*2);X.fill();
        }
      }
    }
  }
}

function drawPacSprite(ctx,cx,cy,radius,mouthOpen,dir){
  const angles=[1.5,1,.5,0];
  const a=angles[dir]*Math.PI;
  const inset=radius*.12;
  const mx=cx+Math.cos(a)*inset;
  const my=cy+Math.sin(a)*inset;
  ctx.fillStyle='#ffff00';
  ctx.shadowColor='#ffff00';ctx.shadowBlur=6;
  ctx.beginPath();
  ctx.arc(cx,cy,radius,a+mouthOpen*Math.PI,a+(2-mouthOpen)*Math.PI);
  ctx.lineTo(mx,my);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;
  const eyeDist=radius*.4;
  const eyeAngle=a+Math.PI*.32;
  const ex=cx+Math.cos(eyeAngle)*eyeDist;
  const ey=cy+Math.sin(eyeAngle)*eyeDist;
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(ex,ey,radius*.13,0,Math.PI*2);ctx.fill();
}

function drawPac(){
  drawPacSprite(X,pac.x,pac.y,TS/2-1,pac.mouth,pac.dir);
}

function drawGhost(g){
  const cx=g.x,cy=g.y,r=TS/2-1;
  if(g.eaten){
    drawGhostEyes(cx,cy,r,g.dir);
    return;
  }

  // Body color
  let bodyColor;
  if(g.scared){
    const flashing=frightTimer<120&&Math.floor(frameCount/15)%2===1;
    bodyColor=flashing?'#fff':'#2121de';
  }else{
    bodyColor=GHOST_COLORS[g.idx];
  }

  // Draw body: dome top + wavy skirt
  X.fillStyle=bodyColor;
  X.shadowColor=bodyColor;X.shadowBlur=5;
  X.beginPath();
  X.arc(cx,cy-r*.2,r,Math.PI,0);
  X.lineTo(cx+r,cy+r*.65);
  const waves=3;
  const waveW=r*2/waves;
  const waveH=r*.35;
  const phase=(Math.floor(frameCount/12)%2);
  for(let i=waves-1;i>=0;i--){
    const wx=cx+r-i*waveW;
    const wy=cy+r*.65;
    const up=(i+phase)%2===0;
    X.quadraticCurveTo(wx-waveW*.25,wy+(up?waveH:0),wx-waveW*.5,wy+(up?waveH*.5:0));
    X.quadraticCurveTo(wx-waveW*.75,wy+(up?0:waveH),wx-waveW,wy);
  }
  X.lineTo(cx-r,cy-r*.2);
  X.closePath();
  X.fill();
  X.shadowBlur=0;

  if(g.scared){
    // Frightened face
    const flashing=frightTimer<120&&Math.floor(frameCount/15)%2===1;
    const faceColor=flashing?'#f00':'#ffb8ae';
    // Eyes: small dots
    X.fillStyle=faceColor;
    X.beginPath();X.arc(cx-r*.3,cy-r*.15,r*.15,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(cx+r*.3,cy-r*.15,r*.15,0,Math.PI*2);X.fill();
    // Zigzag mouth
    X.strokeStyle=faceColor;X.lineWidth=1.5;
    X.beginPath();
    const mw=r*1.2;
    const my=cy+r*.25;
    const segs=6;
    X.moveTo(cx-mw/2,my);
    for(let i=1;i<=segs;i++){
      X.lineTo(cx-mw/2+i*(mw/segs),my+(i%2===0?0:r*.2*(i%4===1?1:-1)));
    }
    X.stroke();
  }else{
    drawGhostEyes(cx,cy,r,g.dir);
  }
}

function drawGhostEyes(cx,cy,r,dir){
  const eyeOffX=r*.35;
  const eyeY=cy-r*.25;
  const eyeW=r*.3,eyeH=r*.4;

  X.fillStyle='#fff';
  X.beginPath();X.ellipse(cx-eyeOffX,eyeY,eyeW,eyeH,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(cx+eyeOffX,eyeY,eyeW,eyeH,0,0,Math.PI*2);X.fill();

  const pdx=[0,-1,0,1][dir]*eyeW*.5;
  const pdy=[-1,0,1,0][dir]*eyeH*.45;
  const pupilR=eyeW*.5;
  X.fillStyle='#00f';
  X.beginPath();X.arc(cx-eyeOffX+pdx,eyeY+pdy,pupilR,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(cx+eyeOffX+pdx,eyeY+pdy,pupilR,0,Math.PI*2);X.fill();
}

function drawFruit(){
  if(!fruit.active)return;
  X.font=(TS-2)+'px serif';
  X.textAlign='center';X.textBaseline='middle';
  X.fillText(fruit.type.emoji,FRUIT_POS.col*TS+TS/2,FRUIT_POS.row*TS+TS/2);
}

function drawScorePopups(){
  for(const p of scorePopups){
    const alpha=Math.min(1,p.timer/15);
    X.globalAlpha=alpha;
    X.fillStyle='#fff';X.font='bold '+(TS*.6)+'px monospace';
    X.textAlign='center';X.textBaseline='middle';
    X.fillText(p.val,p.x,p.y-((40-p.timer)*.3));
    X.globalAlpha=1;
  }
}

function render(){
  X.fillStyle='#000';X.fillRect(0,0,COLS*TS,ROWS*TS);

  if(levelClearAnim){
    const flash=Math.floor(levelClearTimer/15)%2===0;
    if(flash)drawWalls('#1a1a3a','#ffffff');
    else drawWalls();
    drawPac();
    return;
  }

  drawWalls();
  drawDots();
  drawFruit();

  if(!deathAnim){
    for(const g of ghosts)drawGhost(g);
    drawPac();
  }else{
    // Death animation: pac-man shrinks and spins
    const t=1-deathTimer/75;
    const radius=(TS/2-1)*(1-t);
    if(radius>1){
      X.fillStyle='#ffff00';
      X.beginPath();
      X.arc(pac.x,pac.y,radius,(.5+t*2)*Math.PI,(-.5-t*2)*Math.PI);
      X.lineTo(pac.x,pac.y);
      X.fill();
    }
  }

  drawScorePopups();

  // Ready text
  if(state==='ready'){
    X.fillStyle='#ffff00';X.font='bold '+(TS*.9)+'px monospace';
    X.textAlign='center';X.textBaseline='middle';
    X.fillText('READY!',COLS*TS/2,17*TS+TS/2);
  }

  // Game over
  if(state==='gameover'){
    X.fillStyle='#ff0000';X.font='bold '+(TS*1.1)+'px monospace';
    X.textAlign='center';X.textBaseline='middle';
    X.fillText('GAME OVER',COLS*TS/2,17*TS+TS/2);
    X.fillStyle='#aaa';X.font=(TS*.6)+'px monospace';
    X.fillText(LANG==='ko'?'아무 키를 누르세요':'PRESS ANY KEY',COLS*TS/2,19*TS);
  }
}

/* ───────── GAME LOOP ───────── */
function gameLoop(){
  animFrame=requestAnimationFrame(gameLoop);
  frameCount++;

  if(state==='title'){render();return;}

  if(state==='ready'){
    readyTimer--;
    if(readyTimer<=0)state='playing';
    render();return;
  }
  if(state==='gameover'){render();return;}
  if(state!=='playing'){render();return;}

  if(deathAnim){
    deathTimer--;
    if(deathTimer<=0){deathAnim=false;resetPositions();state='ready';readyTimer=90;}
    render();return;
  }
  if(levelClearAnim){
    levelClearTimer--;
    if(levelClearTimer<=0){
      levelClearAnim=false;level++;
      initLevel();state='ready';readyTimer=90;
    }
    render();return;
  }
  if(freezeTimer>0){freezeTimer--;render();return;}

  movePac();
  eatDots();
  for(const g of ghosts)moveGhost(g);
  releaseGhosts();
  updateMode();
  checkCollisions();

  if(fruit.active){fruit.timer--;if(fruit.timer<=0)fruit.active=false;}
  scorePopups=scorePopups.filter(p=>{p.timer--;return p.timer>0;});

  render();
}

/* ───────── START SCREEN ───────── */
function buildStartScreen(){
  const intro=document.getElementById('charIntro');
  intro.innerHTML='';
  const chars=[
    {name:'PAC-MAN',color:'#ffff00',draw:(ctx)=>{drawPacSprite(ctx,12,12,10,.15,3);}},
    {name:'Blinky',color:'#ff0000',ghost:true,idx:0},
    {name:'Pinky',color:'#ffb8ff',ghost:true,idx:1},
    {name:'Inky',color:'#00ffff',ghost:true,idx:2},
    {name:'Clyde',color:'#ffb852',ghost:true,idx:3}
  ];
  for(const ch of chars){
    const box=document.createElement('div');
    box.className='charBox';
    const cv=document.createElement('canvas');
    cv.width=24;cv.height=24;
    const ctx=cv.getContext('2d');
    if(ch.ghost){
      drawStartGhost(ctx,12,12,10,ch.color);
    }else{
      ch.draw(ctx);
    }
    box.appendChild(cv);
    const lbl=document.createElement('span');
    lbl.style.color=ch.color;
    lbl.textContent=ch.name;
    box.appendChild(lbl);
    intro.appendChild(box);
  }
}

function drawStartGhost(ctx,cx,cy,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(cx,cy-2,r,Math.PI,0);
  ctx.lineTo(cx+r,cy+r-2);
  const w=r*2/3;
  for(let i=2;i>=0;i--){
    const lx=cx-r+i*w;
    ctx.quadraticCurveTo(lx+w*.5,cy+r-2+((i+1)%2===0?4:-4),lx,cy+r-2);
  }
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(cx-3,cy-3,3,4,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+3,cy-3,3,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#00f';
  ctx.beginPath();ctx.arc(cx-2,cy-2,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+4,cy-2,1.8,0,Math.PI*2);ctx.fill();
}

function hideStartScreen(){
  document.getElementById('startScreen').style.display='none';
}

function showStartScreen(){
  document.getElementById('startScreen').style.display='flex';
}

/* ───────── INPUT ───────── */
function handleStart(){
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(state==='title'){
    hideStartScreen();
    startGame();
  }else if(state==='gameover'){
    startGame();
  }
}

document.getElementById('startBtn').addEventListener('click',handleStart);

document.addEventListener('keydown',e=>{
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(state==='title'){
    if(e.key==='Enter'||e.key===' '){handleStart();return;}
  }
  if(state==='gameover'){handleStart();return;}
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W')pac.nextDir=0;
  else if(k==='ArrowLeft'||k==='a'||k==='A')pac.nextDir=1;
  else if(k==='ArrowDown'||k==='s'||k==='S')pac.nextDir=2;
  else if(k==='ArrowRight'||k==='d'||k==='D')pac.nextDir=3;
  e.preventDefault();
});

let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(state==='gameover'){handleStart();return;}
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(state!=='playing')return;
  const dx=e.touches[0].clientX-touchStartX;
  const dy=e.touches[0].clientY-touchStartY;
  if(Math.abs(dx)+Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){pac.nextDir=dx>0?3:1;}
  else{pac.nextDir=dy>0?2:0;}
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
},{passive:true});

document.getElementById('bU').addEventListener('touchstart',e=>{pac.nextDir=0;e.preventDefault();});
document.getElementById('bD').addEventListener('touchstart',e=>{pac.nextDir=2;e.preventDefault();});
document.getElementById('bL').addEventListener('touchstart',e=>{pac.nextDir=1;e.preventDefault();});
document.getElementById('bR').addEventListener('touchstart',e=>{pac.nextDir=3;e.preventDefault();});

/* ───────── RESIZE ───────── */
function resize(){
  const maxW=window.innerWidth-16;
  const maxH=window.innerHeight-70;
  const scale=Math.min(maxW/(COLS*TS),maxH/(ROWS*TS),2.5);
  CV.style.width=Math.floor(COLS*TS*scale)+'px';
  CV.style.height=Math.floor(ROWS*TS*scale)+'px';
  document.getElementById('wrap').style.width=Math.floor(COLS*TS*scale)+'px';
}
window.addEventListener('resize',resize);

/* ───────── INIT ───────── */
buildMap();
pac=createPac();
ghosts=[];for(let i=0;i<4;i++)ghosts.push(createGhost(i));
fruit={active:false,timer:0,type:fruitForLevel(1)};
modeIdx=0;modeTimer=0;scatterChaseSeq=getScatterChase(1);
frightTimer=0;ghostEatCombo=0;globalDotTimer=0;
buildStartScreen();
resize();
updateHUD();
gameLoop();
</script>
