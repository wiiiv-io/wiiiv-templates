<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title id="pageTitle">태양계 — Solar System</title>
<style>

  --fg: #e9edf7; --dim: #93a0bf; --dim2: #67728f; --acc: #ffcf6e; --acc2: #7fb4ff; --good: #7fe0b0; --r: 14px; --side: 380px; }

/* 스크롤 막대: 평소엔 숨기고, 휠·끌기로 움직일 때만 가늘게 (모든 스크롤 영역 공통) */

/* 펼친 선택 목록: 운영체제 기본(흰 바탕)에 밝은 글자가 묻히지 않게 */

/* 툴팁 */

  float actv = 0.; for (int i = 0; i < 96; i++){ if (i >= uNS) break; vec4 sp = uSpots[i]; if (sp.w <= 0.) continue; float c = dot(q, sp.xyz); actv += sp.w * 30. * exp(-(1. - c) / (sp.w * sp.w * 18.)); }

  float fil = 0.;
  for (int i = 0; i < 8; i++){ if (i >= uNF) break; vec3 c = uFilC[i].xyz, t = uFilT[i].xyz; float hl = uFilT[i].w, wd = uFilC[i].w;
    float along = dot(q - c, t); if (abs(along) > hl * 1.3) continue; float across = dot(q - c, normalize(cross(c, t)));
    float wig = (vnoise(vec3(along * 60., float(i), 2.)) - .5) * wd * 3. + sin(along / hl * 3.1 + float(i)) * wd * 1.5;
    float f = exp(-pow((across - wig) / (wd * (.6 + .6 * vnoise(vec3(along * 120., float(i), 5.)))), 2.)) * smoothstep(hl * 1.3, hl * .7, abs(along));

    vec2 wn = worley(q * 70. + vec3(0, 0, uW * .002)); float netw = (1. - smoothstep(.0, .12, wn.y - wn.x)) * (.5 + .5 * fbm(q * 200., 3));

    I2 *= 1. - fil * .85; I2 *= 1. - umbra * .7 - pen * .25;

    // 활동 영역의 넓은 빛 (흑점보다 훨씬 넓게 퍼짐)
    float glow = 0.; for (int i = 0; i < 96; i++){ if (i >= uNS) break; vec4 sp = uSpots[i]; if (sp.w <= .004) continue; float c = dot(q, sp.xyz); glow += sp.w * 22. * exp(-(1. - c) / (sp.w * .9)); }
    glow = min(glow, 2.5);
    float hole = smoothstep(.6, .76, fbm(q * 2.2 + 11., 4)) * (1. - min(glow, 1.));
    float haze = fbm(q * 14. + vec3(0, 0, uW * .004), 5); float rid = 1. - abs(2. * fbm(q * 55. + vec3(uW * .01, 0, 0), 5) - 1.); rid = pow(rid, 4.);
    float I3 = .06 + .1 * haze + .07 * rid + glow * (.7 + .5 * rid + .3 * fbm(q * 40. + uW * .02, 4));
    I3 *= 1. - hole * .8; I3 *= .75 + .7 * pow(1. - mu, 1.5);

  if (uFlare.w > 0.){ float fa = acos(clamp(dot(q, uFlare.xyz), -1., 1.)); vec3 ft = normalize(cross(uFlare.xyz, vec3(0, 0, 1)));
    float s = dot(q - uFlare.xyz, ft); float rib = exp(-pow((abs(s) - .012) / .004, 2.)) * exp(-fa * fa / .0012) * (.6 + .4 * vnoise(q * 600. + uW));
    col += (uBand == 0 ? vec3(1., .9, .75) : vec3(1.)) * (rib * 2.2 + exp(-fa / .004) * 1.6) * uFlare.w * (uBand == 0 ? 1. : 2.5); }

  o = vec4(col * uI, 1.);

}`;
// 코로나·홍염·플레어 (화면 정렬 사각형)
SH.coronaV = `
layout(location=0) in vec2 aPos;
uniform mat4 uVP; uniform vec3 uC; uniform vec3 uRx; uniform vec3 uRy; uniform float uSize;
out vec2 vQ; out vec3 vP;
${GLX.LOGDEPTH_V}
void main(){ vQ = aPos * uSize; vP = uC + (uRx * aPos.x + uRy * aPos.y) * uSize; gl_Position = uVP * vec4(vP, 1.); logDepthV(); }`;
SH.coronaF = `
in vec2 vQ; in vec3 vP;
uniform vec4 uT; uniform float uI; uniform float uAct; uniform vec2 uPoleS; uniform float uOcc; uniform float uW; uniform float uNear;
uniform vec4 uProm[8]; uniform int uNP; uniform vec4 uCME; uniform int uBand;

float wrapA(float x){ return atan(sin(x), cos(x)); }

  float t = uT.z + uW * .004;

// 하늘: 은하수(은하 좌표 지도) — 화면 전체
SH.skyV = `layout(location=0) in vec2 aPos; uniform vec3 uRt; uniform vec3 uUp; uniform vec3 uFw; uniform vec2 uTan; uniform vec2 uShift; out vec3 vD; void main(){ vD = uFw + uRt * (aPos.x - uShift.x) * uTan.x + uUp * (aPos.y - uShift.y) * uTan.y; gl_Position = vec4(aPos, .9999999, 1.); }`;
SH.skyF = `
in vec3 vD; uniform sampler2D uMW; uniform mat3 uEc2Gal; uniform float uI; out vec4 o;
void main(){ vec3 d = normalize(uEc2Gal * normalize(vD)); float l = atan(d.y, d.x), b = asin(clamp(d.z, -1., 1.));
  vec2 uv = vec2(.5 - l / 6.2831853, .5 + b / 3.14159265);
  vec3 c = textureLod(uMW, uv, 0.).rgb; o = vec4(c * uI, 1.); }`;
// 별: 점 (등급 → 밝기, B−V → 색)
SH.starV = `
layout(location=0) in vec3 aDir; layout(location=1) in vec2 aMagCi;
uniform mat4 uVP; uniform mat3 uEq2Ec; uniform float uI; uniform float uLim; uniform float uDpr;
out vec3 vCol; out float vA;
vec3 bv2rgb(float bv){ float t = 4600. * (1. / (.92 * bv + 1.7) + 1. / (.92 * bv + .62));
  vec3 c; float x = t / 100.;
  c.r = x <= 66. ? 1. : clamp(1.293 * pow(x - 60., -.1332), 0., 1.);
  c.g = x <= 66. ? clamp(.39 * log(x) - .632, 0., 1.) : clamp(1.13 * pow(x - 60., -.0755), 0., 1.);
  c.b = x >= 66. ? 1. : (x <= 19. ? 0. : clamp(.543 * log(x - 10.) - 1.196, 0., 1.));

void main(){ vec3 d = uEq2Ec * aDir; gl_Position = uVP * vec4(d * 1e6, 1.); gl_Position.z = gl_Position.w * .999999;

  vA = min(f, 1.) ; vCol = bv2rgb(aMagCi.y) * uI * max(f, .0) / (sz * sz) * 2.;

SH.starF = `in vec3 vCol; in float vA; out vec4 o; void main(){ vec2 q = gl_PointCoord * 2. - 1.; float r = dot(q, q); float a = exp(-r * 3.5); o = vec4(vCol * a, 1.); }`;

// 선 (궤도·격자): 화면 공간에서 두께를 준 사각형 — 꼭짓점은 카메라 기준 위치
SH.lineV = `
layout(location=0) in vec3 aA; layout(location=1) in vec3 aB; layout(location=2) in vec2 aAl; layout(location=3) in vec2 aQ;
uniform mat4 uVP; uniform vec2 uView; uniform float uW;
out float vAl; out float vE;
${GLX.LOGDEPTH_V}
void main(){
  vec4 ca = uVP * vec4(aA, 1.), cb = uVP * vec4(aB, 1.);
  // 카메라 뒤로 넘어가는 끝은 가까운 면에 붙임
  float nearW = 1e-4;
  if (ca.w < nearW){ float t = (nearW - ca.w) / (cb.w - ca.w); ca = mix(ca, cb, t); }
  if (cb.w < nearW){ float t = (nearW - cb.w) / (ca.w - cb.w); cb = mix(cb, ca, t); }
  vec2 sa = ca.xy / ca.w * uView, sb = cb.xy / cb.w * uView; vec2 dir = normalize(sb - sa + 1e-9); vec2 nrm = vec2(-dir.y, dir.x);
  vec4 c = aQ.x < .5 ? ca : cb; float al = aQ.x < .5 ? aAl.x : aAl.y;
  c.xy += nrm * aQ.y * uW / uView * c.w;

SH.lineF = `in float vAl; in float vE; uniform vec4 uCol; out vec4 o; ${GLX.LOGDEPTH_F}
void main(){ float a = vAl * uCol.a * (1. - smoothstep(.4, 1., abs(vE))); o = vec4(uCol.rgb * a, a * .6); logDepthF(); }`;

// 멀리 있는 천체의 빛점 (크기가 몇 화소보다 작을 때)
SH.dotV = `
layout(location=0) in vec2 aQ;
uniform mat4 uVP; uniform vec3 uC; uniform vec2 uView; uniform float uPx;
out vec2 vQ;
${GLX.LOGDEPTH_V}
void main(){ vec4 c = uVP * vec4(uC, 1.); c.xy += aQ * uPx / uView * c.w; gl_Position = c; vQ = aQ; logDepthV(); }`;
SH.dotF = `in vec2 vQ; uniform vec3 uCol; uniform float uCore; out vec4 o; ${GLX.LOGDEPTH_F}
void main(){ float r = length(vQ); float a = exp(-r * r * 8.) + exp(-r * 3.) * .15 * uCore; if (r > 1.) discard; o = vec4(uCol * a, 0.); logDepthF(); }`;

// 후처리: 밝은 부분 추출·내림·올림·톤매핑
SH.postV = `layout(location=0) in vec2 aPos; out vec2 vUV; void main(){ vUV = aPos * .5 + .5; gl_Position = vec4(aPos, 0., 1.); }`;
SH.downF = `in vec2 vUV; uniform sampler2D uSrc; uniform vec2 uTx; uniform int uFirst; out vec4 o;

SH.upF = `in vec2 vUV; uniform sampler2D uSrc; uniform vec2 uTx; uniform float uW; out vec4 o;

SH.toneF = `in vec2 vUV; uniform sampler2D uSrc; uniform sampler2D uBloom; uniform float uExpo; uniform float uBloomK; uniform vec4 uT; out vec4 o;

// ───────────────────────── 렌더러 ─────────────────────────
const RN = { shift: [0, 0], fov: 50 * D2R, expo: 1, expoT: 1, bloomK: 0.06, texs: {}, hi: {}, quality: 1 };

    facts: ['극지방의 영원히 그늘진 분화구 바닥에는 물 얼음이 있습니다(MESSENGER 관측).', '어떤 지점에서는 해가 떠오르다 잠시 멈추고 거꾸로 졌다가 다시 뜹니다 — 근일점 근처에서 공전 각속도가 자전보다 빨라지기 때문입니다.', '평균적으로 지구에서 가장 가까운 행성은 금성이 아니라 수성입니다.'] },
  venus: { tag: '지옥 같은 온실, 지구의 쌍둥이',
    desc: ['크기와 질량이 지구와 거의 같지만, 이산화탄소 대기가 지표 기압 92 bar(바닷속 900 m와 같은 압력)로 짓누르고 폭주 온실효과로 지표는 납이 녹는 465 °C입니다. 수성보다 태양에서 멀지만 태양계에서 가장 뜨거운 행성입니다.',
      '황산 구름이 행성 전체를 덮어 햇빛의 약 70%를 되쏘기 때문에 밤하늘에서 달 다음으로 밝습니다. 구름 꼭대기는 4일 만에 행성을 한 바퀴 도는 "초회전" 바람에 실려 있습니다.',
      '자전은 243일로 공전(225일)보다 길고 방향도 거꾸로입니다. 그래서 금성의 해는 서쪽에서 떠서 동쪽으로 지며, 해가 뜨고 다음 해가 뜰 때까지 117일이 걸립니다.'],
    facts: ['지표 지형은 마젤란 탐사선의 레이더로 98% 이상 지도화되었습니다. 화면의 구름 아래를 보려면 근접하세요.', '1970년 베네라 7호가 다른 행성 표면에서 처음으로 신호를 보냈습니다. 베네라 13호는 127분 동안 버티며 컬러 사진을 보냈습니다.', '고도 50 km 부근은 기압과 온도가 지구 지표와 비슷해 태양계에서 가장 "지구다운" 곳으로 꼽힙니다.'] },
  earth: { tag: '생명이 알려진 유일한 천체',
    desc: ['표면의 71%가 액체 바다이고, 질소·산소 대기와 판 구조 운동, 강한 자기장을 가진 행성입니다. 우리가 아는 한 생명이 사는 유일한 곳입니다.',
      '자전축이 공전 궤도면에 대해 23.44° 기울어 있어 계절이 생깁니다. 근일점(1월 초)에 태양과 가장 가깝지만 북반구는 그때 겨울입니다 — 계절을 만드는 것은 거리가 아니라 기울기입니다.',
      '달의 조석력이 지구 자전을 100년에 약 1.7 ms씩 늦추고, 그 각운동량을 받은 달은 해마다 3.8 cm씩 멀어지고 있습니다.'],
    facts: ['밤 쪽을 보면 도시의 불빛이, 낮 쪽 바다에서는 햇빛이 반짝이는 점(선 글린트)이 보입니다.', 'GPS 위성의 시계는 일반상대성(중력이 약해 빨라짐, 하루 +45 μs)과 특수상대성(빠르게 움직여 느려짐, 하루 −7 μs)을 합쳐 하루 38 μs를 보정합니다. 보정하지 않으면 하루에 위치가 10 km씩 어긋납니다.', '지구는 태양 둘레를 초속 약 29.8 km로 돌고 있습니다.'] },
  moon: { tag: '지구의 유일한 자연 위성',
    desc: ['약 45억 년 전 화성만 한 원시 행성 "테이아"가 지구와 부딪쳐 튀어나온 물질이 모여 생긴 것으로 여겨집니다. 아폴로가 가져온 암석의 산소 동위원소가 지구와 거의 같은 것이 그 증거입니다.',
      '자전과 공전 주기가 같은 동주기 자전 때문에 늘 같은 면이 지구를 향합니다. 다만 궤도가 타원이고 기울어 있어 흔들리듯 보이는 칭동 덕에 표면의 59%를 지구에서 볼 수 있습니다.',
      '어두운 "바다"는 30억~40억 년 전 거대 충돌구를 메운 현무암 용암이고, 밝은 고지는 더 오래된 사장암 지각입니다.'],
    facts: ['1969년부터 1972년까지 12명이 달 위를 걸었습니다.', '레이저 반사경으로 잰 지구–달 거리는 mm 정밀도이며, 이 측정은 일반상대성이론의 강한 등가 원리를 시험하는 데도 쓰입니다.', '달에서 보는 지구는 하늘의 거의 같은 자리에 머물며 위상만 바뀝니다.'] },
  mars: { tag: '붉은 행성',
    desc: ['산화철 먼지가 덮인 사막 행성입니다. 태양계에서 가장 높은 화산 올림푸스 몬스(지표에서 약 22 km)와, 미국 대륙을 가로지를 만큼 긴 협곡 마리너스 계곡(4,000 km)이 있습니다.',
      '대기는 지구의 0.6% 밀도로 얇은 이산화탄소이며, 낮 하늘은 먼지 때문에 버터스카치색이고 해 질 녘에는 해 둘레가 푸르게 보입니다. 미세한 먼지가 푸른빛을 앞쪽으로 더 잘 산란하기 때문입니다.',
      '말라 버린 강줄기, 삼각주, 퇴적암은 과거에 액체 물이 오래 흘렀다는 증거입니다. 지금도 극관과 지하에 많은 얼음이 있습니다.'],
    facts: ['화성의 하루(솔)는 24시간 39분 35초입니다.', '자전축 기울기(25.2°)가 지구와 비슷해 사계절이 있지만, 이심률이 커서 남반구 여름이 더 짧고 뜨겁습니다.', '현재 화성에는 여러 나라의 궤도선과 탐사차가 활동 중입니다.'] },
  phobos: { tag: '화성 안쪽 위성 — 천천히 떨어지는 중',
    desc: ['감자 모양의 작은 위성으로, 화성 표면 위 약 6,000 km에서 하루에 세 번 돕니다. 화성 자전보다 빨라 화성에서 보면 서쪽에서 떠서 동쪽으로 집니다.', '조석력 때문에 100년에 약 1.8 m씩 화성에 가까워지고 있어 3천만~5천만 년 뒤에는 부서져 고리가 되거나 화성에 떨어질 것입니다.'],
    facts: ['지름 9 km의 스티크니 충돌구는 포보스를 거의 부술 뻔했던 충돌의 흔적입니다.'] },
  deimos: { tag: '화성 바깥 위성', desc: ['지름 약 12 km의 작은 위성으로 화성을 30.3시간에 돕니다. 표면은 고운 먼지(레골리스)로 매끈하게 덮여 있습니다.'] },
  ceres: { tag: '소행성대 최대의 왜소행성',
    desc: ['소행성대 전체 질량의 약 4분의 1을 차지하는 천체로, 1801년 처음 발견된 "소행성"이자 2006년부터 왜소행성으로 분류됩니다.', '던(Dawn) 탐사선이 오카토르 충돌구의 밝은 점이 탄산나트륨 소금이라는 것을 밝혀냈습니다. 지하 깊은 곳의 소금물이 스며 올라온 흔적입니다.'] },
  vesta: { tag: '두 번째로 무거운 소행성', desc: ['남극의 거대 충돌구 레아실비아(지름 505 km)는 중앙 봉우리 높이가 약 22 km로, 올림푸스 몬스에 맞먹습니다. 지구에 떨어진 HED 운석들은 이 충돌에서 튀어나온 베스타 조각입니다.'] },
  jupiter: { tag: '가스 거대 행성, 태양계의 맏형',
    desc: ['다른 행성을 모두 합친 것보다 2.5배 무겁습니다. 단단한 표면 없이 수소와 헬륨이 깊어질수록 압력에 눌려 액체, 그리고 전기가 통하는 금속성 수소가 됩니다. 이 금속 수소층의 흐름이 태양계 최강의 자기장을 만듭니다.',
      '눈에 보이는 띠는 암모니아 구름입니다. 밝은 "대(zone)"는 올라오는 기류, 어두운 "띠(belt)"는 내려가는 기류이며, 그 경계에서 초속 100 m가 넘는 제트 기류가 번갈아 반대로 붑니다. 이 앱에서 목성에 가까이 가면 위도마다 다른 바람이 구름을 끌고 가는 모습이 보입니다.',
      '대적점은 지구보다 큰 고기압 폭풍으로 적어도 190년 넘게 이어져 왔지만 최근 수십 년 동안 줄어들고 있습니다.'],
    facts: ['목성의 하루는 9시간 56분으로 행성 중 가장 짧고, 그 빠른 자전 때문에 적도가 6.5% 불룩합니다.', '목성과 태양의 공통 질량 중심은 태양 표면 바깥(태양 중심에서 1.07 태양 반지름)에 있습니다.', '보이저·뉴호라이즌스 등은 목성의 중력을 이용한 스윙바이로 속도를 얻어 외행성으로 날아갔습니다.'] },
  io: { tag: '태양계에서 화산이 가장 활발한 천체',
    desc: ['400개가 넘는 활화산이 있고, 분출 기둥은 500 km 높이까지 솟습니다. 목성과 유로파·가니메데의 1:2:4 궤도 공명이 이오의 궤도를 늘 조금 찌그러뜨려, 목성의 조석이 이오 속을 주물러 데우기 때문입니다.', '노랑·빨강·흰색 얼룩은 여러 형태의 황과 이산화황 서리입니다.'],
    facts: ['이오의 조석 융기는 하루에 최대 100 m씩 오르내립니다.'] },
  europa: { tag: '얼음 아래 바다를 품은 위성',
    desc: ['10~30 km 두께의 얼음 껍질 아래에 지구 바다를 모두 합친 것보다 두 배 많은 물이 있는 것으로 보입니다. 표면의 갈색 줄무늬(리네아)는 갈라진 얼음 틈으로 바닷물이 올라와 언 흔적일 수 있습니다.', '생명이 살 수 있는 환경인지 알아보기 위해 유로파 클리퍼(2024년 발사)가 2030년에 도착합니다.'] },
  ganymede: { tag: '태양계에서 가장 큰 위성',
    desc: ['수성보다 크고, 스스로 자기장을 만드는 유일한 위성입니다. 오로라의 흔들림을 분석해 얼음 껍질 아래에 짠 바다가 있다는 것이 밝혀졌습니다.', '어둡고 오래된 지역과 밝고 홈이 팬 젊은 지역이 섞여 있습니다.'] },
  callisto: { tag: '가장 많이 얻어맞은 표면', desc: ['태양계에서 충돌구가 가장 빽빽한 표면을 가졌습니다. 지질 활동이 거의 없어 40억 년 동안의 충돌 기록이 그대로 남았습니다. 목성의 강한 방사선대 바깥에 있어 미래의 유인 기지 후보로 거론됩니다.'] },
  saturn: { tag: '고리의 행성',
    desc: ['물보다 밀도가 낮은 행성(0.69 g/cm³)입니다. 빠른 자전(10시간 33분) 때문에 적도 반지름이 극보다 10% 큽니다.',
      '고리는 폭이 수십만 km지만 두께는 대부분 10 m 남짓입니다. 99% 이상이 물 얼음 알갱이로, 모래알부터 집채만 한 덩어리까지 저마다 작은 위성처럼 토성을 돕니다. 카시니 간극은 미마스와의 2:1 공명이 비워 낸 틈입니다.',
      '고리면은 토성 궤도에 대해 26.7° 기울어 있어, 토성이 공전하는 29.5년 동안 해와 지구에서 고리를 보는 각도가 바뀝니다. 2025년에는 고리가 지구에서 옆면(두께 방향)으로 보여 거의 사라졌습니다. 이 앱의 날짜를 바꿔 보세요.'],
    facts: ['북극의 육각형 제트 기류는 한 변이 약 14,500 km입니다.', '토성의 고리는 1억~4억 년 정도로 젊을 수 있다는 연구가 있습니다(카시니 측정).', '알려진 위성 수는 274개(2025년)로 태양계 최다입니다.'] },
  mimas: { tag: '"데스스타" 위성', desc: ['지름의 3분의 1에 이르는 허셜 충돌구(139 km) 때문에 영화 속 데스스타를 닮았습니다. 궤도의 미세한 흔들림 분석으로 얇은 껍질 아래 젊은 바다가 있다는 주장(2024)이 나왔습니다.'] },
  enceladus: { tag: '물을 뿜는 얼음 위성',
    desc: ['남극 "호랑이 줄무늬" 틈에서 수증기와 얼음 알갱이를 우주로 뿜어냅니다. 카시니가 이 물기둥을 지나가며 소금, 유기물, 수소 분자, 인산염을 검출했습니다 — 바닷속 열수 분출구의 증거입니다.', '태양계에서 가장 하얀 천체로, 받은 햇빛의 거의 전부를 되쏩니다. 이 물기둥이 토성의 E 고리를 채웁니다.'] },
  tethys: { tag: '거대한 협곡을 가진 얼음 위성', desc: ['밀도가 물과 거의 같아 거의 순수한 얼음 덩어리입니다. 오디세우스 충돌구(450 km)와 길이 2,000 km의 이타카 협곡이 있습니다.'] },
  dione: { tag: '얼음 절벽의 위성', desc: ['뒤쪽 반구에 밝은 줄무늬처럼 보이는 것은 높이 수백 m의 얼음 절벽입니다.'] },
  rhea: { tag: '토성의 두 번째로 큰 위성', desc: ['얼음과 암석으로 된 위성으로, 아주 옅은 산소·이산화탄소 외기권이 검출되었습니다.'] },
  titan: { tag: '두꺼운 대기와 메탄의 비가 내리는 위성',
    desc: ['위성 중 유일하게 짙은 대기(지표 기압 1.5 bar)를 가졌습니다. 질소 대기 속 메탄이 햇빛에 쪼개져 만든 주황색 유기물 안개가 표면을 가립니다.', '지구 외에 표면에 액체가 고여 있는 유일한 천체입니다. 다만 물이 아니라 영하 180 °C의 메탄·에탄 호수와 바다이며, 메탄 비가 내리고 강이 흐릅니다.', '2005년 하위헌스 탐침이 착륙해 둥근 자갈이 깔린 강바닥 사진을 보냈습니다. 2034년에는 비행 드론 드래곤플라이가 도착합니다.'],
    facts: ['중력이 약하고 대기가 두꺼워, 팔에 날개를 달면 사람도 날 수 있습니다.'] },
  hyperion: { tag: '스펀지 위성', desc: ['밀도가 매우 낮아 내부가 40% 이상 비어 있는 스펀지 같은 천체입니다. 자전이 혼돈적이라 자전축과 속도가 예측할 수 없게 바뀝니다.'] },
  iapetus: { tag: '두 얼굴의 위성', desc: ['앞쪽 반구는 석탄처럼 검고 뒤쪽은 눈처럼 하얗습니다. 적도를 따라 높이 20 km의 산맥이 호두 껍데기처럼 둘러 있습니다.'] },
  phoebe: { tag: '붙잡힌 역행 위성', desc: ['토성을 거꾸로 도는 먼 위성으로, 카이퍼 벨트에서 붙잡혀 온 천체로 보입니다.'] },
  uranus: { tag: '옆으로 누워 도는 얼음 거대 행성',
    desc: ['자전축이 97.8° 기울어 거의 옆으로 누운 채 공전합니다. 그래서 각 극은 42년 동안 낮, 42년 동안 밤을 맞습니다. 먼 옛날 지구만 한 천체와의 충돌이 원인으로 꼽힙니다.', '대기 상층의 메탄이 붉은빛을 흡수해 청록색으로 보입니다. 내부는 물·암모니아·메탄이 뜨겁고 짙은 유체로 섞인 "얼음" 맨틀입니다.', '1986년 보이저 2호가 유일하게 근접 비행했습니다.'] },
  miranda: { tag: '누더기 위성', desc: ['높이 20 km의 베로나 절벽은 태양계에서 가장 높은 절벽으로 꼽힙니다. 표면이 서로 다른 조각을 이어 붙인 듯 뒤죽박죽입니다.', '보이저 2호가 남반구만 찍었기 때문에 북반구 지도는 비어 있습니다.'] },
  ariel: { tag: '천왕성의 밝은 위성', desc: ['천왕성 위성 중 가장 밝고 젊은 표면을 가졌으며, 단층 계곡이 그물처럼 뻗어 있습니다.'] },
  umbriel: { tag: '천왕성의 어두운 위성', desc: ['매우 어둡고 오래된 표면에 밝은 고리 모양 무늬(완다 충돌구)가 하나 있습니다.'] },
  titania: { tag: '천왕성의 가장 큰 위성', desc: ['길이 1,500 km가 넘는 협곡이 있어 과거 내부가 팽창했던 흔적을 보여줍니다.'] },
  oberon: { tag: '천왕성의 가장 바깥 큰 위성', desc: ['충돌구가 많은 오래된 표면에 높이 11 km의 산이 가장자리에 보입니다.'] },
  neptune: { tag: '가장 바깥 행성, 초음속 바람',
    desc: ['천왕성의 궤도가 예측과 어긋나는 것을 수학으로 따져 위치를 미리 계산해 찾아낸 행성입니다(1846). 펜 끝에서 발견된 행성이라 불립니다.', '태양에서 받는 빛이 지구의 900분의 1밖에 안 되는데도 초속 600 m에 이르는 태양계 최강의 바람이 붑니다. 내부 열이 받는 햇빛의 2.6배나 됩니다.'],
    facts: ['해왕성 1년은 지구의 164.8년으로, 발견 뒤 2011년에야 처음 한 바퀴를 채웠습니다.'] },
  triton: { tag: '거꾸로 도는 큰 위성',
    desc: ['큰 위성 중 유일하게 모행성 자전과 반대로 돕니다. 카이퍼 벨트에서 붙잡혀 온 천체로 보이며, 조석 때문에 천천히 가라앉아 수십억 년 뒤 해왕성의 로슈 한계 안에서 부서질 것입니다.', '보이저 2호가 표면에서 8 km 높이로 솟는 질소 간헐천을 찍었습니다.'] },
  pluto: { tag: '카이퍼 벨트의 왕',
    desc: ['1930년 발견되어 76년 동안 아홉 번째 행성이었다가 2006년 왜소행성으로 다시 분류되었습니다. 비슷한 천체(에리스 등)가 잇달아 발견되었기 때문입니다.', '2015년 뉴호라이즌스가 하트 모양의 질소 얼음 평원(스푸트니크 평원)과 물 얼음 산맥, 파란 안개를 보여주었습니다. 평원은 천천히 대류하며 표면을 새로 칠합니다.', '카론과 서로 같은 면만 마주 보는 이중 조석 고정 상태이며, 공통 질량 중심은 명왕성 바깥에 있습니다.'] },
  charon: { tag: '명왕성의 짝', desc: ['명왕성 지름의 절반이 넘어 이중 왜소행성계로도 불립니다. 북극의 붉은 "모르도르 반점"은 명왕성에서 새어 나온 메탄이 얼어 붙어 햇빛에 변한 것입니다.'] },
  eris: { tag: '명왕성의 지위를 바꾼 왜소행성', desc: ['명왕성과 거의 같은 크기에 질량은 27% 더 큽니다. 2005년 발견이 "행성이란 무엇인가" 논쟁을 일으켜 명왕성이 왜소행성으로 재분류되었습니다. 지금은 태양에서 약 96 AU 떨어져 있습니다.'] },
  haumea: { tag: '럭비공 왜소행성', desc: ['4시간이 안 되는 빠른 자전 때문에 길쭉한 타원체가 되었습니다. 고리와 두 위성을 가졌습니다.'] },
  makemake: { tag: '붉은 왜소행성', desc: ['메탄 얼음으로 덮인 카이퍼 벨트 천체로, 이스터섬 신화의 창조신 이름을 받았습니다.'] },
  sedna: { tag: '태양계 가장자리의 먼 손님', desc: ['근일점이 76 AU, 원일점이 약 1,000 AU에 이르는 극단적인 궤도를 1만 1천 년에 한 번 돕니다. 오르트 구름 안쪽 천체이거나, 먼 옛날 지나가던 별의 영향을 받았을 수 있습니다.'] },
  gonggong: { tag: '먼 붉은 왜소행성', desc: ['중국 신화의 물의 신 이름을 받았습니다. 위성 샹류를 거느립니다.'] },
  quaoar: { tag: '고리를 가진 먼 천체', desc: ['로슈 한계보다 훨씬 바깥에 고리를 가져 고리 형성 이론을 뒤흔든 천체입니다.'] },
  orcus: { tag: '"반(反) 명왕성"', desc: ['명왕성과 같은 2:3 해왕성 공명에 있지만 궤도에서 늘 명왕성 반대편에 있습니다.'] },
  arrokoth: { tag: '태양계에서 가장 원시적인 천체', desc: ['두 덩어리가 천천히 붙은 눈사람 모양으로, 46억 년 전 행성 재료가 처음 뭉치던 모습을 거의 그대로 간직했습니다. 2019년 뉴호라이즌스가 지나가며 찍었습니다.'] },
  halley: { tag: '가장 유명한 주기 혜성', desc: ['약 76년마다 돌아옵니다. 1705년 에드먼드 핼리가 1531·1607·1682년 혜성이 같은 천체라고 보고 1758년 귀환을 예언했고, 그대로 나타났습니다. 다음 근일점은 2061년 7월입니다.', '공전 방향이 행성과 반대(궤도 경사 162°)입니다.'] },
  churyumov: { tag: '로제타가 찾아간 혜성', desc: ['2014년 로제타가 궤도를 돌고 착륙선 필레가 사상 처음으로 혜성 핵에 내려앉았습니다. 두 덩어리가 붙은 오리 모양입니다.'] },
  bennu: { tag: '시료를 가져온 소행성', desc: ['오시리스-렉스가 2023년 지구로 121.6 g의 시료를 가져왔습니다. 아미노산과 염수 증발 광물이 발견되었습니다. 2182년에 지구와 충돌할 확률은 약 1/2,700입니다.'] },
  ryugu: { tag: '하야부사2의 소행성', desc: ['팽이 모양의 탄소질 소행성으로, 하야부사2가 표면과 인공 충돌구 속 시료를 가져왔습니다.'] },
  itokawa: { tag: '자갈 더미 소행성', desc: ['길이 535 m의 땅콩 모양으로, 돌무더기가 중력으로 느슨하게 뭉친 "잔해 더미"입니다.'] },
  apophis: { tag: '2029년 지구를 스쳐 갈 소행성', desc: ['2029년 4월 13일 지구 표면에서 약 3만 2천 km(정지 궤도 안쪽)를 지나며 맨눈으로 보일 것입니다. 충돌 위험은 없는 것으로 확인되었습니다.'] },
  psyche: { tag: '금속 소행성', desc: ['철·니켈이 많은 것으로 보여, 원시 행성의 핵이 드러난 것일 수 있습니다. 프시케 탐사선이 2029년 도착합니다.'] },
  eros: { tag: '처음 착륙한 소행성', desc: ['2001년 니어 슈메이커가 계획에 없던 착륙에 성공했습니다.'] },
  pallas: { tag: '크게 기운 소행성', desc: ['궤도가 34.9° 기울어 있어 탐사선이 가기 어렵습니다.'] },
  hygiea: { tag: '어두운 둥근 소행성', desc: ['거의 둥근 모양이라 왜소행성 후보로 거론됩니다.'] },
  amalthea: { tag: '목성의 붉은 작은 위성', desc: ['태양계에서 가장 붉은 천체 중 하나로, 이오에서 날아온 황이 덮은 것으로 보입니다.'] },
  proteus: { tag: '해왕성의 두 번째 위성', desc: ['스스로 둥글어지기 직전 크기의 울퉁불퉁한 위성입니다.'] },
  nereid: { tag: '찌그러진 궤도의 위성', desc: ['이심률 0.75로 위성 중 가장 찌그러진 궤도를 가졌습니다.'] },
};

INFOTXT.en = {
  sun: { tag: 'Our star, a G2V main-sequence star',
    desc: ['A ball of hot plasma holding 99.86% of the Solar System’s mass. In the core (15.7 million K) about 600 million tonnes of hydrogen fuse into helium every second, and the 4 million tonnes of mass that vanish become light and heat via E = mc².',
      'Energy made in the core spends tens of thousands of years being absorbed and re-emitted through the radiative zone, then rides boiling convection to the surface (the photosphere). Each granule there is a convection cell about 1,000 km across that lives for 8–20 minutes.',
      'The Sun rotates differentially — about 25 days at the equator and 35 near the poles. The shear winds up its magnetic field and drives sunspots, flares and coronal mass ejections on a roughly 11-year cycle.'],
    facts: ['Light from the photosphere reaches Earth in 8 min 20 s; energy from the core takes 10,000–170,000 years to reach the photosphere.', 'The corona is 1–3 million K, hundreds of times hotter than the photosphere — the “coronal heating problem” is still not fully solved.', 'The Sun orbits the galactic centre at about 230 km/s; one galactic year is ~230 million years.', 'In about 5 billion years the Sun will swell into a red giant, engulf Mercury and Venus, and end as a white dwarf.'] },
  mercury: { tag: 'The smallest, innermost planet',
    desc: ['The closest planet to the Sun is barely larger than our Moon but has an enormous iron core (~85% of its radius). With almost no atmosphere it swings from 430 °C by day to −180 °C at night.',
      'Its spin and orbit are locked in a 3:2 resonance: three rotations every two orbits. A Mercurian solar day therefore lasts 176 Earth days — two Mercurian years.',
      'Mercury’s perihelion advances 574″ per century. Planetary tugs explain 531″; the leftover 43″ defeated Newtonian gravity until 1915, when Einstein’s general relativity predicted exactly 43″ — its first triumph.'],
    facts: ['Permanently shadowed polar craters hold water ice (MESSENGER).', 'From some spots the Sun rises, pauses, sets again and re-rises — near perihelion the orbital angular speed exceeds the spin.', 'On average Mercury, not Venus, is the planet closest to Earth.'] },
  venus: { tag: 'A hellish greenhouse — Earth’s twin',
    desc: ['Nearly Earth’s size and mass, yet crushed under a CO₂ atmosphere of 92 bar (like 900 m under the sea) and baked to 465 °C by a runaway greenhouse — the hottest planet, though farther from the Sun than Mercury.',
      'Sulfuric-acid clouds cover the whole planet and reflect ~70% of sunlight, making Venus the brightest object in the night sky after the Moon. The cloud tops “super-rotate” around the planet in just four days.',
      'Venus spins once every 243 days — longer than its 225-day year — and backwards. The Sun rises in the west and a solar day lasts 117 Earth days.'],
    facts: ['Magellan’s radar mapped over 98% of the surface. Fly close to look under the clouds.', 'Venera 7 (1970) sent the first signals from another planet’s surface; Venera 13 survived 127 minutes and sent colour images.', 'At ~50 km altitude the pressure and temperature resemble Earth’s surface — the most Earth-like place in the Solar System.'] },
  earth: { tag: 'The only world known to host life',
    desc: ['Oceans cover 71% of its surface; it has a nitrogen–oxygen atmosphere, plate tectonics and a strong magnetic field. As far as we know, it is the only place with life.',
      'Its axis is tilted 23.44° to its orbit, giving seasons. Earth is closest to the Sun in early January — northern winter — because seasons come from tilt, not distance.',
      'Lunar tides slow Earth’s spin by about 1.7 ms per century; the Moon gains that angular momentum and drifts 3.8 cm farther away each year.'],
    facts: ['Look at the night side for city lights, and at the day-side oceans for the sun glint.', 'GPS clocks are corrected by 38 μs/day: general relativity (+45 μs, weaker gravity) and special relativity (−7 μs, orbital speed). Uncorrected, positions would drift ~10 km per day.', 'Earth orbits the Sun at about 29.8 km/s.'] },
  moon: { tag: 'Earth’s only natural satellite',
    desc: ['It probably formed 4.5 billion years ago from debris thrown out when a Mars-sized protoplanet, “Theia”, struck the young Earth — Apollo rocks share Earth’s oxygen isotopes.',
      'Synchronous rotation keeps the same face toward Earth, but libration lets us see 59% of the surface over time.',
      'The dark “maria” are basalt lava that flooded giant impact basins 3–4 billion years ago; the bright highlands are older anorthosite crust.'],
    facts: ['Twelve people walked on the Moon between 1969 and 1972.', 'Laser ranging measures the Earth–Moon distance to millimetres and tests general relativity’s strong equivalence principle.', 'Seen from the Moon, Earth hangs almost fixed in the sky and only changes phase.'] },
  mars: { tag: 'The red planet',
    desc: ['A desert world dusted with iron oxide. It hosts Olympus Mons, the tallest volcano in the Solar System (~22 km above its surroundings), and Valles Marineris, a canyon 4,000 km long.',
      'Its thin CO₂ atmosphere has 0.6% of Earth’s density. Daytime skies are butterscotch from dust, while sunsets glow blue around the Sun because fine dust scatters blue light forward.',
      'Dry riverbeds, deltas and sedimentary rocks show liquid water once flowed for long periods; large amounts of ice remain in the polar caps and underground.'],
    facts: ['A Martian day (sol) lasts 24 h 39 min 35 s.', 'A 25.2° tilt gives seasons; high eccentricity makes southern summers shorter and hotter.', 'Several nations’ orbiters and rovers are active at Mars today.'] },
  phobos: { tag: 'Mars’s inner moon — slowly falling', desc: ['A potato-shaped moon orbiting just 6,000 km above Mars, three times a day — faster than Mars spins, so it rises in the west.', 'Tides pull it 1.8 m closer every century; in 30–50 million years it will crash or break into a ring.'], facts: ['The 9 km Stickney crater records an impact that nearly shattered it.'] },
  deimos: { tag: 'Mars’s outer moon', desc: ['A 12 km moon that circles Mars every 30.3 hours, smoothly blanketed in fine regolith.'] },
  ceres: { tag: 'The largest body in the asteroid belt', desc: ['About a quarter of the belt’s total mass; discovered in 1801 as the first “asteroid” and classed as a dwarf planet since 2006.', 'Dawn showed the bright spots in Occator crater are sodium carbonate — brine seeping up from deep inside.'] },
  vesta: { tag: 'The second most massive asteroid', desc: ['Its south-polar Rheasilvia basin (505 km) has a central peak ~22 km high. HED meteorites found on Earth are fragments blasted from Vesta.'] },
  jupiter: { tag: 'The gas giant, eldest of the planets',
    desc: ['2.5 times more massive than all other planets combined. With no solid surface, its hydrogen and helium are squeezed with depth into liquid and then electrically conducting metallic hydrogen, whose flows generate the strongest planetary magnetic field.',
      'The visible bands are ammonia clouds: bright zones rise, dark belts sink, and jet streams faster than 100 m/s alternate direction between them. Fly close in this app to watch each latitude’s winds drag the clouds.',
      'The Great Red Spot, an anticyclone larger than Earth, has lasted at least 190 years but has been shrinking for decades.'],
    facts: ['A Jovian day is 9 h 56 min, the shortest of any planet; the fast spin bulges the equator by 6.5%.', 'The Sun–Jupiter barycentre lies outside the Sun’s surface (1.07 solar radii from its centre).', 'Voyager, New Horizons and others used Jupiter’s gravity for slingshots to the outer Solar System.'] },
  io: { tag: 'The most volcanic body in the Solar System', desc: ['Over 400 active volcanoes, with plumes reaching 500 km. The 1:2:4 resonance with Europa and Ganymede keeps Io’s orbit slightly eccentric, so Jupiter’s tides knead and heat its interior.', 'The yellow, red and white patches are forms of sulfur and sulfur-dioxide frost.'], facts: ['Io’s tidal bulge rises and falls by up to 100 m every day.'] },
  europa: { tag: 'An ocean beneath the ice', desc: ['Under a 10–30 km ice shell lies perhaps twice as much water as all Earth’s oceans. The brown streaks (lineae) may be ocean water that welled up through cracks and froze.', 'Europa Clipper (launched 2024) arrives in 2030 to assess its habitability.'] },
  ganymede: { tag: 'The largest moon in the Solar System', desc: ['Larger than Mercury and the only moon with its own magnetic field. The wobble of its aurorae revealed a salty ocean beneath the ice.', 'Dark ancient terrain is cut by bright, younger grooved terrain.'] },
  callisto: { tag: 'The most cratered surface', desc: ['Its surface is the most heavily cratered in the Solar System, preserving 4 billion years of impacts. Outside Jupiter’s fierce radiation belts, it is a candidate for a future crewed base.'] },
  saturn: { tag: 'The ringed planet',
    desc: ['The only planet less dense than water (0.69 g/cm³). Its fast 10 h 33 min spin makes the equatorial radius 10% larger than the polar one.',
      'The rings span hundreds of thousands of kilometres but are mostly only ~10 m thick. Over 99% water-ice particles — from sand grains to house-sized chunks — each orbit like a tiny moon. The Cassini Division is cleared by a 2:1 resonance with Mimas.',
      'The ring plane is tilted 26.7° to Saturn’s orbit, so over its 29.5-year orbit our view of the rings changes. In 2025 they were edge-on to Earth and nearly vanished — change the date in this app to see it.'],
    facts: ['The north-polar hexagon jet stream has sides ~14,500 km long.', 'Cassini data suggest the rings may be young — perhaps 100–400 million years.', 'With 274 known moons (2025), Saturn has the most of any planet.'] },
  mimas: { tag: 'The “Death Star” moon', desc: ['Herschel crater (139 km), a third of its diameter, makes it look like the Death Star. Tiny orbital librations suggest a young ocean beneath its shell (2024).'] },
  enceladus: { tag: 'The ice moon that sprays water', desc: ['Water vapour and ice grains jet from the “tiger stripes” at its south pole. Flying through the plumes, Cassini found salts, organics, molecular hydrogen and phosphates — signs of hydrothermal vents on its seafloor.', 'The whitest body in the Solar System; its plumes feed Saturn’s E ring.'] },
  tethys: { tag: 'An ice moon with a giant canyon', desc: ['Its density is close to water — nearly pure ice — and it bears Odysseus crater (450 km) and the 2,000 km Ithaca Chasma.'] },
  dione: { tag: 'Moon of ice cliffs', desc: ['The bright wisps on its trailing hemisphere are ice cliffs hundreds of metres high.'] },
  rhea: { tag: 'Saturn’s second-largest moon', desc: ['An ice-and-rock moon with a tenuous oxygen–CO₂ exosphere.'] },
  titan: { tag: 'Thick air and methane rain',
    desc: ['The only moon with a dense atmosphere (1.5 bar at the surface). Methane broken apart by sunlight forms an orange organic haze that hides the surface.', 'Besides Earth, the only world with liquid on its surface — not water but −180 °C methane and ethane lakes and seas, fed by methane rain and rivers.', 'Huygens landed in 2005 and photographed rounded pebbles in a dry riverbed. The Dragonfly rotorcraft arrives in 2034.'],
    facts: ['With low gravity and thick air, a person could fly by flapping wings strapped to their arms.'] },
  hyperion: { tag: 'The sponge moon', desc: ['So porous that over 40% of it is empty space; it tumbles chaotically, its spin axis and rate unpredictable.'] },
  iapetus: { tag: 'The two-faced moon', desc: ['Its leading hemisphere is coal-black, its trailing one snow-white, and a 20 km-high ridge girdles its equator like a walnut seam.'] },
  phoebe: { tag: 'A captured retrograde moon', desc: ['A distant moon orbiting Saturn backwards — probably captured from the Kuiper Belt.'] },
  uranus: { tag: 'The ice giant that rolls on its side',
    desc: ['Its axis is tilted 97.8°, so it rolls around the Sun on its side: each pole gets 42 years of daylight, then 42 of night. A giant ancient impact is the favourite explanation.', 'Methane high in the atmosphere absorbs red light, giving its cyan colour. Inside is a hot, dense “icy” fluid of water, ammonia and methane.', 'Voyager 2 made the only flyby, in 1986.'] },
  miranda: { tag: 'The patchwork moon', desc: ['Verona Rupes, ~20 km high, may be the tallest cliff in the Solar System; its surface looks stitched together from mismatched pieces.', 'Voyager 2 imaged only the southern hemisphere, so the northern map is blank.'] },
  ariel: { tag: 'Uranus’s bright moon', desc: ['The brightest and youngest-looking surface among Uranus’s moons, crossed by networks of fault valleys.'] },
  umbriel: { tag: 'Uranus’s dark moon', desc: ['A very dark, ancient surface with one bright ring (Wunda crater).'] },

        { t: '모든 질량은 서로 끌어당긴다', h: '<p>1687년 뉴턴은 사과를 떨어뜨리는 힘과 달을 붙잡아 두는 힘이 같은 것이라고 주장했습니다.</p><p class="eq">F = G·M·m / r²</p><p>파란 화살표는 지구 둘레 곳곳에서의 중력 가속도입니다. 거리가 두 배가 되면 힘은 4분의 1이 됩니다(역제곱 법칙). 노란 화살표는 달이 지구 쪽으로 받는 가속도 — 겨우 <b>2.7 mm/s²</b>입니다. 지표의 9.8 m/s²보다 3,600배 작은데, 달이 지구 반지름의 60배 거리에 있기 때문입니다(60² = 3,600). 뉴턴이 바로 이 계산으로 자신의 이론을 확인했습니다.</p>' },
        { t: '궤도란 끝없이 떨어지는 것', h: '<p>중력이 없다면 달은 흰 점선처럼 곧게 날아갔을 것입니다. 실제로는 하루 동안 빨간 화살표만큼 지구 쪽으로 "떨어졌습니다".</p><p>그런데 달은 옆으로도 빠르게(초속 1 km) 움직이기 때문에, 떨어지는 만큼 지구 표면이 둥글게 비켜 갑니다. 그래서 영원히 떨어지면서도 결코 땅에 닿지 않습니다. 이것이 궤도입니다. 우주 정거장의 우주인이 둥둥 뜨는 것도 중력이 없어서가 아니라 함께 떨어지고 있기 때문입니다.</p>' },

    { k: 'well', t: '중력 우물', s: '퍼텐셜, 탈출 속도, 행성이 빠르고 느린 이유',
      steps: [
        { t: '태양이 판 우물', h: '<p>중력장을 "우물"로 그려 봅시다. 격자의 깊이는 그 자리의 <b>중력 퍼텐셜</b>(단위 질량이 가진 위치 에너지)입니다. 태양 가까이일수록 깊습니다.</p><p>안쪽 행성일수록 가파른 비탈에 있으므로, 떨어지지 않으려면 더 빨리 돌아야 합니다. 수성은 초속 약 47 km, 지구는 30 km입니다. 이름 옆 숫자는 지금 이 순간의 공전 속도와, 그 자리에서 태양계를 벗어나는 데 필요한 <b>탈출 속도</b>(공전 속도의 √2배 정도)입니다.</p>' },
        { t: '바깥은 완만하다', h: '<p>멀어질수록 우물은 완만해지고 행성은 느려집니다. 해왕성은 초속 5.4 km로 165년에 한 바퀴를 돕니다. 케플러 제3법칙 — 공전 주기의 제곱은 긴반지름의 세제곱에 비례 — 이 바로 이 우물의 모양(1/r)에서 나옵니다.</p><p class="note">이 그림은 깊이를 보기 좋게 조절한 것입니다. 오른쪽 위 메뉴에서 "실제 비율"로 바꾸면 행성들의 우물은 너무 작아 보이지 않습니다. 목성조차 태양 질량의 0.1%입니다.</p>' },
        { t: '우물 속의 우물', h: '<p>가까이 가면 지구도 자기 우물을 가지고, 달은 그 우물의 비탈에서 돕니다. 지구 우물은 다시 태양 우물의 비탈 위에 놓여 있습니다. 우물이 겹겹이 놓인 이 구조가 태양계의 계층입니다.</p><p>지구 표면에서 탈출 속도는 11.2 km/s, 달 표면에서는 2.4 km/s입니다. 아폴로가 달에서 작은 엔진으로 돌아올 수 있었던 이유입니다.</p>' },

      steps: [
        { t: '빨라졌다 느려졌다', h: '<p>핼리 혜성은 태양 가까이(0.59 AU)에서는 초속 55 km로 스쳐 가고, 가장 먼 곳(35 AU)에서는 초속 0.9 km로 기어갑니다.</p><p>그런데 태양과 혜성을 잇는 선이 같은 시간에 쓸고 지나가는 <b>넓이</b>는 언제나 같습니다. 노랑·파랑 조각이 각각 6.3년 동안 쓴 넓이입니다. 이것은 <b>각운동량 보존</b>의 다른 모습입니다 — 피겨 선수가 팔을 오므리면 빨리 도는 것과 같습니다.</p>' },

      steps: [
        { t: '돌아가는 좌표계에서 본 우물', h: '<p>지구와 달이 함께 도는 좌표계에서 보면, 두 천체의 중력에 <b>원심력</b>이 더해진 "유효 퍼텐셜"이 생깁니다. 격자는 바로 그 모양입니다. 지구와 달 둘레는 깊고, 멀리 가면 원심력 때문에 바깥으로 기울어집니다.</p><p>그 사이에 힘이 정확히 균형을 이루는 다섯 점이 있습니다. L1·L2·L3은 말안장 모양(불안정)이고, L4·L5는 언덕 꼭대기인데도 코리올리 힘 덕분에 안정합니다. 목성의 L4·L5에는 트로이 소행성 1만 개 이상이 모여 있습니다.</p>' },
        { t: '태양–지구 라그랑주점', h: '<p>태양–지구의 L1(지구에서 태양 쪽 150만 km)에는 태양 관측선 SOHO와 DSCOVR가, L2(반대쪽 150만 km)에는 제임스 웹 우주 망원경이 있습니다. L2에서는 태양·지구·달이 모두 같은 쪽에 있어 큰 차양 하나로 망원경을 −230 °C로 식힐 수 있습니다.</p>' },

      steps: [
        { t: '이 그림이 틀린 점', h: '<p>무거운 공이 고무판을 누르는 그림은 유명하지만 사실 순환 논리입니다. 공이 판을 누르는 것은 <b>아래쪽 중력</b> 때문이니까요. 게다가 이 격자는 공간의 휘어짐이 아니라 퍼텐셜의 깊이를 그린 것입니다.</p><p>아인슈타인의 일반상대성이론에서는 질량이 <b>시공간</b>(공간 + 시간)을 휘게 하고, 물체는 그 안에서 가장 "곧은" 길(측지선)을 따라 움직일 뿐입니다. 힘이 아니라 기하입니다.</p>' },
        { t: '시간이 느려진다', h: '<p>태양계처럼 중력이 약한 곳에서는, 행성 운동의 거의 전부가 <b>시간의 휘어짐</b>에서 나옵니다. 중력 우물 깊은 곳의 시계는 느리게 갑니다. 공간의 휘어짐은 그보다 훨씬 작습니다.</p><p>왼쪽 표는 멀리 있는 시계와 비교해 하루에 늦어지는 시간입니다. 지구 표면의 시계는 하루 60 μs, 태양 표면은 0.18초 늦습니다. GPS는 위성 시계가 지상보다 하루 38 μs 빨리 가는 것을 보정해야만 제대로 동작합니다.</p>' },
      ] },
    { k: 'mercury', t: '수성 근일점의 수수께끼', s: '일반상대성이론의 첫 승리',
      steps: [
        { t: '도는 타원', h: '<p>수성의 궤도 타원은 조금씩 돌아갑니다. 100년에 574″ 중 531″은 다른 행성들의 끌림으로 설명되지만, 남은 <b>43″</b>은 50년 넘게 수수께끼였습니다. "벌칸"이라는 보이지 않는 행성까지 가정되었지요.</p><p>1915년 아인슈타인은 자신의 방정식으로 정확히 43″을 계산하고 며칠 동안 흥분해 일을 할 수 없었다고 썼습니다. 그림은 이 회전을 수백만 배 과장해 장미꽃 무늬로 보여 줍니다.</p>' },

      steps: [
        { t: '별이 자리를 옮기다', h: '<p>1919년 5월 29일 개기 일식 때, 에딩턴의 관측대는 태양 바로 옆에 보이는 히아데스 성단 별들이 평소보다 바깥쪽으로 밀려 보인다는 것을 쟀습니다. 태양 가장자리를 스치는 빛은 <b>1.75″</b> 휘는데, 뉴턴식 계산(0.87″)의 정확히 두 배 — 일반상대성이론의 예측이었습니다.</p><p>이 소식으로 아인슈타인은 하룻밤 사이에 세계적인 유명인이 되었습니다. 오늘날 이 효과는 은하 전체가 렌즈가 되는 <b>중력 렌즈</b>로 우주의 암흑 물질 지도를 그리는 데 쓰입니다.</p>' },
      ] },
    { k: 'blackhole', t: '태양이 블랙홀이 된다면', s: '궤도는 그대로일까?',
      steps: [
        { t: '지구는 빨려 들어가지 않는다', h: '<p>태양을 지름 5.9 km(슈바르츠실트 반지름 2.95 km의 두 배)로 눌러 블랙홀로 만들어도, 질량이 같으므로 바깥 우물의 모양은 <b>전혀 변하지 않습니다</b>. 행성들은 같은 궤도를 계속 돕니다 — 다만 빛이 사라져 얼어붙겠지요.</p><p>달라지는 곳은 원래 태양이 있던 안쪽입니다. 우물이 끝없이 깊어져, 사건의 지평선 너머에서는 빛조차 빠져나올 수 없습니다. 블랙홀이 무서운 것은 멀리서 당기는 힘 때문이 아니라 <b>가까이 갈 수 있게 되기</b> 때문입니다.</p>' },
      ] },
  ],
};

  ja: { title: 'アポロ11号', site: '静かの基地 — 月着陸船イーグル', v: [
    { b: '着陸地点の空', when: '1969年7月21日 02:56 UTC · 静かの海', body: ['ニール・アームストロングがイーグルのはしごを降り、月面に第一歩を記した瞬間です。「これは一人の人間にとっては小さな一歩だが、人類にとっては偉大な飛躍である。」約6億人がテレビで見守りました。', '月はいつも同じ面を地球に向けているので、ここの空で地球はほぼ同じ位置に浮かび、満ち欠けだけが変わります。大気がないため昼でも空は黒いのです。ドラッグして見回してください。'] },
    { b: '月周回軌道から見た着陸地点', when: '1969年7月20日 20:17 UTC · 着陸の瞬間', body: ['「ヒューストン、こちら静かの基地。イーグルは着陸した。」燃料は約25秒分しか残っていませんでした。アームストロングは岩だらけのクレーターを避けて手動で着陸しました。', 'その上空約110 kmでは、マイケル・コリンズが司令船コロンビアで一人月を回り、月の裏側に入るたびに地球との交信が完全に途絶えました。黄色の印が着陸地点です。'] },
    { b: 'その日地球から見た月', when: '1969年7月20日 20:17 UTC · ヒューストン', body: ['着陸の瞬間、ヒューストンの管制センターの空には三日月が浮かんでいました。新月（7月17日）から3日後で、静かの海は朝日が差し始めたところでした。低い太陽と長い影で地形が見やすいよう、あえて選ばれた日付です。', 'これはその時刻にヒューストンから見た月を狭い視野（約6°）で見たものです。'] },
  ] },
  zh: { title: '阿波罗11号', site: '静海基地 — 登月舱“鹰”号', v: [
    { b: '着陆点的天空', when: '1969年7月21日 02:56 UTC · 静海', body: ['尼尔·阿姆斯特朗走下“鹰”号的舷梯，在月面留下第一个脚印：“这是个人的一小步，却是人类的一大步。”约6亿人通过电视观看。', '月球总以同一面朝向地球，所以在这里的天空中，地球几乎停在原处，只有相位变化。没有大气，白天天空也是黑的。拖动画面环顾四周。'] },
    { b: '从月球轨道看着陆点', when: '1969年7月20日 20:17 UTC · 着陆瞬间', body: ['“休斯敦，这里是静海基地。‘鹰’已着陆。”当时燃料只剩约25秒。阿姆斯特朗手动驾驶，避开了布满巨石的陨坑。', '在其上方约110公里的轨道上，迈克尔·柯林斯独自驾驶指令舱“哥伦比亚”号绕月飞行，每次转到月球背面都会与地球完全失去联系。黄色标记为着陆点。'] },
    { b: '那天从地球看月亮', when: '1969年7月20日 20:17 UTC · 休斯敦', body: ['着陆时，休斯敦任务控制中心上空挂着一弯新月——新月（7月17日）后第三天。静海刚迎来日出；特意选择低角度阳光和长影子，方便宇航员判断地形。', '这是当时从休斯敦以窄视场（约6°）看到的月亮。'] },
  ] },
  'zh-TW': { title: '阿波羅11號', site: '寧靜海基地 — 登月艙「老鷹號」', v: [
    { b: '著陸點的天空', when: '1969年7月21日 02:56 UTC · 寧靜海', body: ['尼爾·阿姆斯壯走下「老鷹號」的梯子，在月面留下第一個腳印：「這是個人的一小步，卻是人類的一大步。」約6億人透過電視觀看。', '月球總以同一面朝向地球，所以在這裡的天空中，地球幾乎停在原處，只有盈虧變化。沒有大氣，白天天空也是黑的。拖曳畫面環顧四周。'] },
    { b: '從月球軌道看著陸點', when: '1969年7月20日 20:17 UTC · 著陸瞬間', body: ['「休士頓，這裡是寧靜海基地。老鷹號已著陸。」當時燃料只剩約25秒。阿姆斯壯手動駕駛，避開了布滿巨石的隕石坑。', '在其上方約110公里的軌道上，麥可·柯林斯獨自駕駛指揮艙「哥倫比亞號」繞月飛行，每次轉到月球背面都會與地球完全失聯。黃色標記為著陸點。'] },
    { b: '那天從地球看月亮', when: '1969年7月20日 20:17 UTC · 休士頓', body: ['著陸時，休士頓任務控制中心上空掛著一彎眉月——新月（7月17日）後第三天。寧靜海剛迎來日出；刻意選擇低角度陽光和長影子，方便太空人判斷地形。', '這是當時從休士頓以窄視野（約6°）看到的月亮。'] },
  ] },
  es: { title: 'Apolo 11', site: 'Base Tranquilidad — módulo lunar Eagle', v: [
    { b: 'Cielo en el lugar de alunizaje', when: '21 jul 1969 02:56 UTC · Mar de la Tranquilidad', body: ['Neil Armstrong baja la escalera del Eagle y pisa la Luna: «Es un pequeño paso para el hombre, un gran salto para la humanidad». Unos 600 millones de personas lo vieron por televisión.', 'Como la Luna muestra siempre la misma cara a la Tierra, aquí la Tierra queda casi fija en el cielo y solo cambia de fase. Sin aire, el cielo diurno es negro. Arrastra para mirar alrededor.'] },
    { b: 'El lugar desde la órbita', when: '20 jul 1969 20:17 UTC · alunizaje', body: ['«Houston, aquí Base Tranquilidad. El Eagle ha alunizado». Quedaban unos 25 segundos de combustible; Armstrong pilotó a mano para evitar un cráter lleno de rocas.', 'Unos 110 km más arriba, Michael Collins orbitaba solo en el módulo de mando Columbia y perdía todo contacto con la Tierra cada vez que pasaba tras la Luna. La marca amarilla es el lugar del alunizaje.'] },
    { b: 'La Luna desde la Tierra ese día', when: '20 jul 1969 20:17 UTC · Houston', body: ['En el alunizaje, una Luna creciente brillaba sobre el Control de Misión en Houston, tres días después de la luna nueva. En el Mar de la Tranquilidad acababa de amanecer; se eligió a propósito el sol bajo y las sombras largas para juzgar el terreno.', 'Es una vista estrecha (unos 6°) de la Luna desde Houston en ese momento.'] },
  ] },
  fr: { title: 'Apollo 11', site: 'Base de la Tranquillité — module lunaire Eagle', v: [
    { b: 'Le ciel au site d’alunissage', when: '21 juil. 1969 02:56 UTC · mer de la Tranquillité', body: ['Neil Armstrong descend l’échelle d’Eagle et pose le pied sur la Lune : « C’est un petit pas pour l’homme, un bond de géant pour l’humanité. » Quelque 600 millions de personnes regardent à la télévision.', 'La Lune montrant toujours la même face à la Terre, la Terre reste presque immobile dans ce ciel et ne change que de phase. Sans air, le ciel diurne est noir. Faites glisser pour regarder autour.'] },
    { b: 'Le site vu de l’orbite', when: '20 juil. 1969 20:17 UTC · alunissage', body: ['« Houston, ici la base de la Tranquillité. L’Aigle s’est posé. » Il restait environ 25 secondes de carburant ; Armstrong a piloté à la main pour éviter un cratère jonché de rochers.', 'À environ 110 km au-dessus, Michael Collins tournait seul dans le module de commande Columbia, coupé de la Terre à chaque passage derrière la Lune. La marque jaune indique le site d’alunissage.'] },
    { b: 'La Lune vue de la Terre ce jour-là', when: '20 juil. 1969 20:17 UTC · Houston', body: ['Au moment de l’alunissage, un croissant de Lune brillait au-dessus du centre de contrôle de Houston, trois jours après la nouvelle lune. Le soleil venait de se lever sur la mer de la Tranquillité : un éclairage rasant et de longues ombres avaient été choisis pour juger du terrain.', 'Voici une vue étroite (environ 6°) de la Lune depuis Houston à cet instant.'] },
  ] },
  de: { title: 'Apollo 11', site: 'Tranquility Base — Mondlandefähre Eagle', v: [
    { b: 'Himmel am Landeplatz', when: '21. Juli 1969 02:56 UTC · Meer der Ruhe', body: ['Neil Armstrong steigt die Leiter der Eagle hinab und betritt den Mond: „Das ist ein kleiner Schritt für einen Menschen, ein riesiger Sprung für die Menschheit.“ Rund 600 Millionen Menschen sahen im Fernsehen zu.', 'Da der Mond der Erde stets dieselbe Seite zuwendet, steht die Erde hier fast fest am Himmel und ändert nur ihre Phase. Ohne Luft ist der Taghimmel schwarz. Ziehen Sie, um sich umzusehen.'] },
    { b: 'Landeplatz aus der Umlaufbahn', when: '20. Juli 1969 20:17 UTC · Landung', body: ['„Houston, hier ist Tranquility Base. Der Adler ist gelandet.“ Es blieben etwa 25 Sekunden Treibstoff; Armstrong steuerte von Hand an einem geröllübersäten Krater vorbei.', 'Etwa 110 km darüber umkreiste Michael Collins allein im Kommandomodul Columbia den Mond und verlor hinter dem Mond jedes Mal den Funkkontakt zur Erde. Die gelbe Markierung zeigt den Landeplatz.'] },
    { b: 'Der Mond von der Erde an jenem Tag', when: '20. Juli 1969 20:17 UTC · Houston', body: ['Bei der Landung stand eine Mondsichel über der Missionskontrolle in Houston – drei Tage nach Neumond. Im Meer der Ruhe war gerade die Sonne aufgegangen; flaches Licht und lange Schatten wurden bewusst gewählt, um das Gelände beurteilen zu können.', 'Dies ist ein enger Blick (etwa 6°) auf den Mond von Houston aus zu diesem Zeitpunkt.'] },
  ] },
  pt: { title: 'Apollo 11', site: 'Base da Tranquilidade — módulo lunar Eagle', v: [
    { b: 'O céu no local de pouso', when: '21 jul 1969 02:56 UTC · Mar da Tranquilidade', body: ['Neil Armstrong desce a escada da Eagle e pisa na Lua: “Este é um pequeno passo para um homem, um salto gigantesco para a humanidade.” Cerca de 600 milhões de pessoas assistiram pela TV.', 'Como a Lua mostra sempre a mesma face à Terra, aqui a Terra fica quase parada no céu e só muda de fase. Sem ar, o céu diurno é preto. Arraste para olhar ao redor.'] },
    { b: 'O local visto da órbita', when: '20 jul 1969 20:17 UTC · pouso', body: ['“Houston, aqui Base da Tranquilidade. A Águia pousou.” Restavam cerca de 25 segundos de combustível; Armstrong pilotou à mão para evitar uma cratera cheia de rochas.', 'Uns 110 km acima, Michael Collins orbitava sozinho no módulo de comando Columbia, perdendo todo contato com a Terra a cada passagem por trás da Lua. A marca amarela é o local do pouso.'] },
    { b: 'A Lua vista da Terra naquele dia', when: '20 jul 1969 20:17 UTC · Houston', body: ['No pouso, uma Lua crescente brilhava sobre o Controle da Missão em Houston, três dias após a lua nova. O Mar da Tranquilidade acabava de ver o nascer do Sol; o sol baixo e as sombras longas foram escolhidos de propósito para avaliar o terreno.', 'Esta é uma vista estreita (cerca de 6°) da Lua a partir de Houston naquele momento.'] },
  ] },
  ru: { title: '«Аполлон-11»', site: 'База Спокойствия — лунный модуль «Игл»', v: [
    { b: 'Небо в месте посадки', when: '21 июля 1969, 02:56 UTC · Море Спокойствия', body: ['Нил Армстронг спускается по трапу «Игла» и ступает на Луну: «Это один маленький шаг для человека и огромный скачок для человечества». Около 600 млн человек смотрели трансляцию.', 'Луна всегда обращена к Земле одной стороной, поэтому Земля здесь почти неподвижна на небе и лишь меняет фазы. Без атмосферы дневное небо чёрное. Потяните, чтобы осмотреться.'] },
    { b: 'Место посадки с орбиты', when: '20 июля 1969, 20:17 UTC · посадка', body: ['«Хьюстон, говорит База Спокойствия. „Орёл“ сел». Топлива оставалось секунд на 25; Армстронг вёл модуль вручную, уходя от кратера, усеянного валунами.', 'На высоте около 110 км Майкл Коллинз в одиночку облетал Луну в командном модуле «Колумбия» и терял связь с Землёй за Луной на каждом витке. Жёлтая метка — место посадки.'] },
    { b: 'Луна с Земли в тот день', when: '20 июля 1969, 20:17 UTC · Хьюстон', body: ['В момент посадки над Центром управления в Хьюстоне висел серп Луны — через три дня после новолуния. В Море Спокойствия только что взошло Солнце: низкое освещение и длинные тени выбрали нарочно, чтобы оценивать рельеф.', 'Это узкий (около 6°) вид на Луну из Хьюстона в тот момент.'] },
  ] },
  vi: { title: 'Apollo 11', site: 'Căn cứ Tĩnh lặng — module Eagle', v: [
    { b: 'Bầu trời nơi hạ cánh', when: '21/7/1969 02:56 UTC · Biển Tĩnh lặng', body: ['Neil Armstrong bước xuống thang của Eagle và đặt chân lên Mặt Trăng: “Đây là bước nhỏ của một con người, nhưng là bước nhảy vọt của nhân loại.” Khoảng 600 triệu người theo dõi qua truyền hình.', 'Vì Mặt Trăng luôn hướng một mặt về Trái Đất, ở đây Trái Đất gần như đứng yên trên bầu trời và chỉ đổi pha. Không có khí quyển nên bầu trời ban ngày vẫn đen. Kéo để nhìn quanh.'] },
    { b: 'Nơi hạ cánh nhìn từ quỹ đạo', when: '20/7/1969 20:17 UTC · lúc hạ cánh', body: ['“Houston, đây là Căn cứ Tĩnh lặng. Đại bàng đã đáp.” Khi đó chỉ còn khoảng 25 giây nhiên liệu; Armstrong lái bằng tay để tránh một hố đầy đá tảng.', 'Ở độ cao khoảng 110 km, Michael Collins một mình bay quanh Mặt Trăng trong module chỉ huy Columbia, mất hoàn toàn liên lạc với Trái Đất mỗi lần bay ra sau Mặt Trăng. Dấu vàng là nơi hạ cánh.'] },
    { b: 'Mặt Trăng từ Trái Đất hôm ấy', when: '20/7/1969 20:17 UTC · Houston', body: ['Lúc hạ cánh, một vầng trăng lưỡi liềm treo trên Trung tâm Điều khiển ở Houston — ba ngày sau trăng mới. Biển Tĩnh lặng vừa đón bình minh; ánh nắng thấp và bóng dài được chọn có chủ ý để dễ nhận định địa hình.', 'Đây là góc nhìn hẹp (khoảng 6°) tới Mặt Trăng từ Houston vào thời điểm đó.'] },
  ] },
};

// ───────────────────────── 역사 장면 모음: 아폴로 8호 지구돋이 · 아폴로 13호 · 허블 ─────────────────────────
// 장면마다 시점(view) 몇 개: 시각을 맞추고 카메라를 놓은 뒤 설명판(#pbd)을 띄운다. 글은 HISTT[언어][장면].
const HIST = { on: null, step: 0 };
(function () {
  const at = iso => { APP.d = utc2tdb(Date.parse(iso)); APP.live = false; APP.playing = false; simAt(APP.d); UI.time(); };
  const leaveSurf = () => { if (SURF.on) { SURF.on = false; $('surf').hidden = true; } };
  const llOf = (b, v) => { const l = m3tv(b.R3, nrm(v)); return [Math.asin(clamp(l[2], -1, 1)) * R2D, Math.atan2(l[1], l[0]) * R2D]; };
  const rotToward = (a, b, ang) => { const ax = nrm(crs(a, b)); return m3v(qm3(qaxis(ax, ang)), a); };
  // 천체 둘레 고도 h(km)에 떠서, 목표 o 가 지평선 위 elev° 에 보이는 자리로 (달 궤도에서 지구돋이 등)
  function limbView(b, o, h, elev, fov) {
    const e = nrm(sub(o.pos, b.pos)); const dip = Math.acos(b.R / (b.R + h)); // 지평선 내림각
    const zen = Math.PI / 2 + dip - elev * D2R; // 목표가 천정에서 이만큼 떨어지는 자리
    const perp = nrm(crs(e, Math.abs(e[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
    const site = m3v(qm3(qaxis(perp, zen)), e); // e 를 zen 만큼 돌린 방향이 천정
    const [la, lo] = llOf(b, site); SURF.enter(b, 0); SURF.lat = la; SURF.lon = lo; SURF.alt = h; $('surf').hidden = true;
    const f = SURF.camera(); const [al, az] = SURF.altaz(o, f); SURF.yaw = az; SURF.pitch = al - fov * (h > 200 ? 0.35 : 0.18); CAM.fovT = fov;
  }
  // 천체 위 고도 h 에서 하늘의 한 방향(적경·적위)을 천정에 두고 올려다봄
  function zenithView(b, ra, de, h, fov) {
    const v = m3v(EQ2EC, radec2vec(ra * D2R, de * D2R)); const [la, lo] = llOf(b, v);
    SURF.enter(b, 0); SURF.lat = la; SURF.lon = lo; SURF.alt = h; $('surf').hidden = true; SURF.camera(); SURF.yaw = 0; SURF.pitch = 89.97; CAM.fovT = fov;
  }
  const mark = (ctx, w, label, col = '#ffcf6e') => { const p = RN.project(sub(w, CAM.pos)); if (!p.on) return; ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, TAU); ctx.stroke(); ctx.font = '600 12.5px system-ui, sans-serif'; ctx.fillStyle = col; ctx.shadowColor = '#000'; ctx.shadowBlur = 5; ctx.fillText(label, p.x + 14, p.y + 4); ctx.shadowBlur = 0; };
  const surfPt = (b, la, lo, h = 0) => { const l = [Math.cos(la * D2R) * Math.cos(lo * D2R), Math.cos(la * D2R) * Math.sin(lo * D2R), Math.sin(la * D2R)]; return add(b.rp || b.pos, m3v(b.R3, scl(l, b.R + h))); };
  const HDF = [189.206, 62.216]; // 허블 딥 필드 (적경·적위, 도)
  const DEF = {
    apollo8: { views: [
      { go: () => { at('1968-12-24T16:40:00Z'); limbView(BY.moon, BY.earth, 110, 3, 24); } },
      { go: () => { leaveSurf(); at('1968-12-24T16:40:00Z'); CAM.fovT = 50; APP.show.orbits = true; CAM.flyTo(BY.earth, len(sub(BY.moon.pos, BY.earth.pos)) * 1.5, { dir: nrm(add(nrm(sub(BY.moon.pos, BY.earth.pos)), [0, 0, 0.9])), dur: 3 }); } },
    ], photos: [['https://images.nasa.gov/details/as08-14-2383', 'earthrise']] },
    apollo13: { views: [
      { go: () => { leaveSurf(); at('1970-04-14T03:08:00Z'); CAM.fovT = 50; APP.show.orbits = true; const E = BY.earth, M = BY.moon; CAM.flyTo(E, len(sub(M.pos, E.pos)) * 2.1, { dir: nrm(add(nrm(crs(sub(M.pos, E.pos), [0, 0, 1])), [0, 0, 0.7])), dur: 3 }); },
        draw: ctx => { const E = BY.earth, M = BY.moon; const u = nrm(sub(M.pos, E.pos)); mark(ctx, add(E.pos, scl(u, 321860)), HT().apollo13.mark0); } },
      { go: () => { at('1970-04-15T00:21:00Z'); limbView(BY.moon, BY.earth, 254, 3, 60); } },
      { go: () => { leaveSurf(); at('1970-04-17T18:07:00Z'); CAM.fovT = 50; const E = BY.earth; const w = surfPt(E, -21.63, -165.37); CAM.flyTo(E, E.R * 3.2, { dir: nrm(sub(w, E.pos)), dur: 3 }); },
        draw: ctx => mark(ctx, surfPt(BY.earth, -21.63, -165.37), HT().apollo13.mark2) },
    ], photos: [['https://images.nasa.gov/details/as13-59-8500', 'damage'], ['https://images.nasa.gov/details/as13-62-8929', 'mailbox'], ['https://images.nasa.gov/details/as13-60-8588', 'a13earth']] },
    hubble: { views: [
      { go: () => { at('1990-04-25T19:38:00Z'); const E = BY.earth; SURF.enter(E, 0); SURF.lat = 20; SURF.lon = -160; SURF.alt = 612; $('surf').hidden = true; SURF.camera(); SURF.yaw = 90; SURF.pitch = -16; CAM.fovT = 70; } },
      { go: () => { at('1995-12-18T12:00:00Z'); zenithView(BY.earth, HDF[0], HDF[1], 600, 1.2); },
        draw: ctx => { const v = m3v(EQ2EC, radec2vec(HDF[0] * D2R, HDF[1] * D2R)); const p = RN.project(scl(v, 1e6)); if (!p.on) return; const s = (2.6 / 60) * D2R * RN.pxPerRad / (devicePixelRatio > 1 ? 1 : 1);
          ctx.strokeStyle = '#ffcf6e'; ctx.lineWidth = 1.5; ctx.strokeRect(p.x - s / 2, p.y - s / 2, s, s); ctx.font = '600 12.5px system-ui, sans-serif'; ctx.fillStyle = '#ffcf6e'; ctx.fillText(HT().hubble.mark1, p.x + s / 2 + 10, p.y + 4); } },
    ], photos: [['https://images.nasa.gov/details/S31-76-026', 'hstRelease'], ['https://images.nasa.gov/details/PIA12110', 'hdf'], ['https://images.nasa.gov/details/GSFC_20171208_Archive_e000842', 'pillars']] },
  };
  const HT = () => HISTT[LG] || HISTT.en;

    { b: '地月之間', when: '1968年12月24日 · 距地球約38萬 km', body: ['這是人類第一次掙脫地球引力，前往另一個天體。法蘭克·包曼、吉姆·洛弗爾和威廉·安德斯成為第一批把整個地球看作一顆球體的人。'] },
  ] },
  apollo13: { title: '阿波羅13號', mark0: '爆炸位置（距地球約32萬 km，近似）', mark2: '太平洋濺落點', v: [
    { b: '「休士頓，我們出了問題」', when: '1970年4月14日 03:08 UTC · 距地球約32萬 km', body: ['在飛往月球途中，服務艙的2號氧氣槽發生爆炸。大部分電力和氧氣喪失，登月被迫取消，三名太空人把登月艙「水瓶座號」當作救生艇，尋找回家的路。', '黃色標記是當時太空船的大致位置（位於地月連線上，並非真實軌跡）。'] },
    { b: '月球背面，史上最遠', when: '1970年4月15日 00:21 UTC · 月球背面上空254 km', body: ['由於不敢冒險使用主引擎，他們沿著「自由返回」軌道繞過月球返回地球。在月球背面失去聯繫時，他們到達了距地球400,171 km處——至今仍是人類到過的最遠距離。', '這裡，地球從該高度再次越過月平線升起。'] },
    { b: '平安歸來', when: '1970年4月17日 18:07 UTC · 南太平洋', body: ['熬過寒冷、不斷升高的二氧化碳以及匱乏的水和電力之後，指揮艙「奧德賽號」在薩摩亞附近的南太平洋濺落。地面工程師讓太空人用艙內物品拼裝的二氧化碳過濾器「郵筒」成為工程傳奇——一次「成功的失敗」。'] },
  ] },
  hubble: { title: '哈伯太空望遠鏡', mark1: '哈伯深空視野（2.6′ — 滿月的1/12）', v: [
    { b: '從軌道看地球', when: '1990年4月25日 · 高度約612 km', body: ['太空梭發現號用機械臂將哈伯托出並送入軌道。在大氣層之上，星光不會閃爍，因此它看得遠比地面望遠鏡清晰。', '最初傳回的影像是模糊的：主鏡研磨誤差約2.2 μm，相當於髮絲粗細的五十分之一。直到1993年，太空人才為它裝上「眼鏡」（COSTAR修正光學系統）。'] },
    { b: '哈伯深空視野', when: '1995年12月18–28日 · 大熊座方向', body: ['天文學家選了天空中看起來最空曠的一小塊區域，在十天裡拍攝了342張照片。在這塊只有滿月直徑十二分之一的小區域裡，出現了約3,000個星系。', '這是朝那個方向直直仰望的窄視野。在肉眼看來空無一物的方框裡，布滿了數十億光年外的星系——這張照片展示了宇宙有多麼浩瀚。'] },
  ] },
};

HISTT.es = {
  apollo8: { title: 'Apolo 8 — Salida de la Tierra', mark0: '', v: [
    { b: 'Salida de la Tierra desde la órbita lunar', when: '24 dic 1968 16:40 UTC · 110 km sobre la Luna', body: ['El Apolo 8 fue el primer vuelo tripulado en orbitar la Luna. En la cuarta órbita, al salir de la cara oculta, la Tierra se elevó sobre el horizonte lunar. William Anders cargó a toda prisa película en color y tomó «Salida de la Tierra».', 'La foto se convirtió en un emblema del movimiento ecologista. Esa noche la tripulación leyó el Génesis en una emisión de Nochebuena que fue una de las más vistas de la historia.'] },
    { b: 'Entre la Tierra y la Luna', when: '24 dic 1968 · a unos 380.000 km de la Tierra', body: ['Era la primera vez que unas personas escapaban de la gravedad terrestre rumbo a otro mundo. Frank Borman, Jim Lovell y William Anders fueron los primeros humanos en ver la Tierra entera como una sola esfera.'] },
  ] },
  apollo13: { title: 'Apolo 13', mark0: 'Explosión (a unos 320.000 km de la Tierra, aproximado)', mark2: 'Amerizaje en el Pacífico', v: [
    { b: '«Houston, tenemos un problema»', when: '14 abr 1970 03:08 UTC · a unos 320.000 km de la Tierra', body: ['Camino a la Luna, explotó el tanque de oxígeno 2 del módulo de servicio. Sin la mayor parte de la energía y el oxígeno, se canceló el alunizaje y los tres astronautas usaron el módulo lunar Aquarius como bote salvavidas para volver a casa.', 'La marca amarilla es la posición aproximada de la nave en ese momento (sobre la línea Tierra–Luna, no la trayectoria real).'] },
    { b: 'Tras la Luna, más lejos que nunca', when: '15 abr 1970 00:21 UTC · 254 km sobre la cara oculta', body: ['Sin poder arriesgarse a usar el motor principal, rodearon la Luna en una trayectoria de «retorno libre» hacia la Tierra. Incomunicados tras la Luna, llegaron a 400.171 km de la Tierra: aún la mayor distancia jamás recorrida por seres humanos.', 'Aquí la Tierra vuelve a salir tras el horizonte lunar desde esa altitud.'] },
    { b: 'Regreso a salvo', when: '17 abr 1970 18:07 UTC · Pacífico Sur', body: ['Tras soportar el frío, el aumento del dióxido de carbono y la escasez de agua y energía, el módulo de mando Odyssey amerizó en el Pacífico Sur cerca de Samoa. El filtro de CO₂ «buzón» que los ingenieros hicieron construir a la tripulación con objetos de a bordo se volvió una leyenda de la ingeniería: un «fracaso exitoso».'] },
  ] },
  hubble: { title: 'Telescopio espacial Hubble', mark1: 'Campo Profundo del Hubble (2,6′ — 1/12 de la Luna llena)', v: [
    { b: 'La Tierra desde su órbita', when: '25 abr 1990 · a unos 612 km de altura', body: ['El transbordador Discovery sacó el Hubble con su brazo robótico y lo dejó en órbita. Por encima de la atmósfera la luz de las estrellas no titila, así que ve mucho más nítido que los telescopios terrestres.', 'Sus primeras imágenes salieron borrosas: el espejo primario se había pulido mal, unos 2,2 μm, la cincuentava parte del grosor de un cabello. Solo en 1993 los astronautas le pusieron «gafas» (la óptica correctora COSTAR).'] },
    { b: 'Campo Profundo del Hubble', when: '18–28 dic 1995 · hacia la Osa Mayor', body: ['Los astrónomos eligieron una de las zonas del cielo de aspecto más vacío y tomaron 342 exposiciones durante diez días. En una mota de una doceava parte del ancho de la Luna llena aparecieron unas 3.000 galaxias.', 'Esta es una vista estrecha mirando directamente hacia esa zona. Dentro del cuadrado, vacío a simple vista, hay galaxias a miles de millones de años luz: una imagen de lo inmenso que es el universo.'] },
  ] },
};

HPT.fr = { earthrise: 'Lever de Terre (1968)', damage: 'Le module de service éventré par l’explosion', mailbox: 'Le filtre à CO₂ improvisé, la « boîte aux lettres »', a13earth: 'La Terre sur le chemin du retour', hstRelease: 'Hubble libéré du bras de Discovery (1990)', hdf: 'Champ profond de Hubble (1995)', pillars: 'Piliers de la Création' };
HISTT.fr = {
  apollo8: { title: 'Apollo 8 — Lever de Terre', mark0: '', v: [
    { b: 'Lever de Terre en orbite lunaire', when: '24 déc. 1968 16 h 40 UTC · à 110 km au-dessus de la Lune', body: ['Apollo 8 fut le premier vol habité à orbiter autour de la Lune. Lors de la quatrième orbite, en sortant de la face cachée, la Terre se leva au-dessus de l’horizon lunaire. William Anders chargea en hâte un film couleur et prit « Lever de Terre ».', 'La photo devint un emblème du mouvement écologiste. Ce soir-là, l’équipage lut la Genèse lors d’une émission de la veille de Noël qui compte parmi les plus regardées de l’histoire.'] },
    { b: 'Entre la Terre et la Lune', when: '24 déc. 1968 · à environ 380 000 km de la Terre', body: ['C’était la première fois que des humains échappaient à l’emprise gravitationnelle de la Terre pour un autre monde. Frank Borman, Jim Lovell et William Anders furent les premiers à voir la Terre entière comme une seule sphère.'] },
  ] },
  apollo13: { title: 'Apollo 13', mark0: 'Explosion (à environ 320 000 km de la Terre, approximatif)', mark2: 'Amerrissage dans le Pacifique', v: [
    { b: '« Houston, nous avons un problème »', when: '14 avr. 1970 03 h 08 UTC · à environ 320 000 km de la Terre', body: ['En route vers la Lune, le réservoir d’oxygène n° 2 du module de service explosa. Privés de l’essentiel de l’énergie et de l’oxygène, ils renoncèrent à l’alunissage et les trois astronautes utilisèrent le module lunaire Aquarius comme canot de sauvetage pour rentrer.', 'Le repère jaune indique la position approximative du vaisseau à ce moment (sur la ligne Terre–Lune, pas la trajectoire réelle).'] },
    { b: 'Derrière la Lune, au plus loin', when: '15 avr. 1970 00 h 21 UTC · à 254 km au-dessus de la face cachée', body: ['Ne pouvant risquer le moteur principal, ils contournèrent la Lune sur une trajectoire de « retour libre » vers la Terre. Sans contact derrière la Lune, ils atteignirent 400 171 km de la Terre — toujours la plus grande distance jamais parcourue par des humains.', 'Ici, la Terre se lève de nouveau au-delà de l’horizon lunaire depuis cette altitude.'] },
    { b: 'Retour sain et sauf', when: '17 avr. 1970 18 h 07 UTC · Pacifique Sud', body: ['Après le froid, la hausse du dioxyde de carbone et le manque d’eau et d’énergie, le module de commande Odyssey amerrit dans le Pacifique Sud près des Samoa. Le filtre à CO₂ « boîte aux lettres » que les ingénieurs firent fabriquer à l’équipage avec les objets du bord est devenu une légende de l’ingénierie — un « échec réussi ».'] },
  ] },
  hubble: { title: 'Télescope spatial Hubble', mark1: 'Champ profond de Hubble (2,6′ — 1/12 de la pleine Lune)', v: [
    { b: 'La Terre depuis son orbite', when: '25 avr. 1990 · à environ 612 km d’altitude', body: ['La navette Discovery sortit Hubble avec son bras robotique et le plaça en orbite. Au-dessus de l’atmosphère, la lumière des étoiles ne scintille pas : il voit bien plus nettement que les télescopes au sol.', 'Ses premières images étaient floues : le miroir primaire avait été mal poli d’environ 2,2 μm, un cinquantième de l’épaisseur d’un cheveu. Ce n’est qu’en 1993 que des astronautes lui posèrent des « lunettes » (l’optique correctrice COSTAR).'] },
    { b: 'Champ profond de Hubble', when: '18–28 déc. 1995 · vers la Grande Ourse', body: ['Les astronomes choisirent l’une des zones du ciel les plus vides en apparence et prirent 342 poses en dix jours. Dans ce point large d’un douzième de la pleine Lune apparurent environ 3 000 galaxies.', 'Voici une vue étroite tournée droit vers cette zone. Dans ce carré, vide à l’œil nu, se trouvent des galaxies à des milliards d’années-lumière — une image de l’immensité de l’univers.'] },
  ] },
};

HPT.de = { earthrise: 'Erdaufgang (1968)', damage: 'Das von der Explosion aufgerissene Servicemodul', mailbox: 'Der improvisierte CO₂-Filter, der „Briefkasten“', a13earth: 'Die Erde auf dem Heimweg', hstRelease: 'Hubble wird vom Arm der Discovery freigegeben (1990)', hdf: 'Hubble Deep Field (1995)', pillars: 'Säulen der Schöpfung' };
HISTT.de = {
  apollo8: { title: 'Apollo 8 — Erdaufgang', mark0: '', v: [
    { b: 'Erdaufgang aus dem Mondorbit', when: '24. Dez. 1968 16:40 UTC · 110 km über dem Mond', body: ['Apollo 8 war der erste bemannte Flug in eine Mondumlaufbahn. Beim vierten Umlauf, als das Raumschiff hinter der Mondrückseite hervorkam, stieg die Erde über den Mondhorizont. William Anders legte hastig einen Farbfilm ein und nahm „Earthrise“ auf.', 'Das Foto wurde zum Sinnbild der Umweltbewegung. An jenem Abend las die Crew in einer Heiligabend-Sendung aus der Genesis vor – eine der meistgesehenen Sendungen der Geschichte.'] },
    { b: 'Zwischen Erde und Mond', when: '24. Dez. 1968 · etwa 380.000 km von der Erde', body: ['Zum ersten Mal verließen Menschen den Schwerkraftgriff der Erde, um eine andere Welt zu erreichen. Frank Borman, Jim Lovell und William Anders sahen als erste Menschen die ganze Erde als eine einzige Kugel.'] },
  ] },
  apollo13: { title: 'Apollo 13', mark0: 'Explosion (etwa 320.000 km von der Erde, ungefähr)', mark2: 'Wasserung im Pazifik', v: [
    { b: '„Houston, wir haben ein Problem“', when: '14. Apr. 1970 03:08 UTC · etwa 320.000 km von der Erde', body: ['Auf dem Weg zum Mond explodierte Sauerstofftank 2 im Servicemodul. Da der Großteil von Strom und Sauerstoff verloren war, wurde die Landung abgesagt, und die drei Astronauten nutzten die Mondfähre Aquarius als Rettungsboot für den Heimweg.', 'Die gelbe Markierung zeigt die ungefähre Position des Raumschiffs zu dieser Zeit (auf der Linie Erde–Mond, nicht die tatsächliche Flugbahn).'] },
    { b: 'Hinter dem Mond, so weit wie nie', when: '15. Apr. 1970 00:21 UTC · 254 km über der Rückseite', body: ['Da sie das Haupttriebwerk nicht riskieren konnten, schwenkten sie auf einer „freien Rückkehrbahn“ um den Mond zurück zur Erde. Ohne Funkkontakt hinter dem Mond erreichten sie 400.171 km Abstand zur Erde – bis heute die größte Entfernung, die Menschen je zurückgelegt haben.', 'Hier geht die Erde aus dieser Höhe erneut über dem Mondhorizont auf.'] },
    { b: 'Sichere Rückkehr', when: '17. Apr. 1970 18:07 UTC · Südpazifik', body: ['Nach Kälte, steigendem Kohlendioxid und knappem Wasser und Strom wasserte die Kommandokapsel Odyssey im Südpazifik nahe Samoa. Der CO₂-Filter „Briefkasten“, den Ingenieure die Crew aus Gegenständen an Bord bauen ließen, wurde zur Ingenieurslegende – ein „erfolgreicher Fehlschlag“.'] },
  ] },
  hubble: { title: 'Hubble-Weltraumteleskop', mark1: 'Hubble Deep Field (2,6′ — 1/12 des Vollmonds)', v: [
    { b: 'Die Erde aus seiner Umlaufbahn', when: '25. Apr. 1990 · etwa 612 km Höhe', body: ['Die Raumfähre Discovery hob Hubble mit ihrem Roboterarm heraus und setzte es im Orbit aus. Oberhalb der Atmosphäre funkelt das Sternenlicht nicht, daher sieht es weit schärfer als Teleskope am Boden.', 'Die ersten Bilder waren unscharf: Der Hauptspiegel war um etwa 2,2 μm falsch geschliffen, ein Fünfzigstel einer Haarbreite. Erst 1993 setzten Astronauten ihm eine „Brille“ auf (die Korrekturoptik COSTAR).'] },
    { b: 'Hubble Deep Field', when: '18.–28. Dez. 1995 · Richtung Großer Bär', body: ['Astronomen wählten einen der leersten Himmelsausschnitte und machten in zehn Tagen 342 Aufnahmen. In einem Fleck von einem Zwölftel der Vollmondbreite zeigten sich rund 3.000 Galaxien.', 'Dies ist ein enger Blick senkrecht nach oben auf diesen Ausschnitt. Im Quadrat, das dem Auge leer erscheint, liegen Galaxien in Milliarden Lichtjahren Entfernung – ein Bild davon, wie riesig das Universum ist.'] },
  ] },
};

HISTT.pt = {
  apollo8: { title: 'Apollo 8 — Nascer da Terra', mark0: '', v: [
    { b: 'Nascer da Terra da órbita lunar', when: '24 dez 1968 16:40 UTC · 110 km acima da Lua', body: ['A Apollo 8 foi o primeiro voo tripulado a orbitar a Lua. Na quarta órbita, ao contornar o lado oculto, a Terra surgiu sobre o horizonte lunar. William Anders carregou às pressas um filme colorido e fez “Nascer da Terra”.', 'A foto tornou-se um emblema do movimento ambientalista. Naquela noite, a tripulação leu o Gênesis numa transmissão de véspera de Natal que está entre as mais assistidas da história.'] },
    { b: 'Entre a Terra e a Lua', when: '24 dez 1968 · a cerca de 380.000 km da Terra', body: ['Foi a primeira vez que pessoas deixaram o domínio gravitacional da Terra rumo a outro mundo. Frank Borman, Jim Lovell e William Anders foram os primeiros humanos a ver a Terra inteira como uma única esfera.'] },
  ] },
  apollo13: { title: 'Apollo 13', mark0: 'Explosão (a cerca de 320.000 km da Terra, aproximado)', mark2: 'Amerissagem no Pacífico', v: [
    { b: '“Houston, temos um problema”', when: '14 abr 1970 03:08 UTC · a cerca de 320.000 km da Terra', body: ['A caminho da Lua, o tanque de oxigênio 2 do módulo de serviço explodiu. Sem a maior parte da energia e do oxigênio, o pouso foi cancelado e os três astronautas usaram o módulo lunar Aquarius como bote salva-vidas para encontrar o caminho de casa.', 'A marca amarela é a posição aproximada da nave naquele momento (sobre a linha Terra–Lua, não a trajetória real).'] },
    { b: 'Atrás da Lua, mais longe que nunca', when: '15 abr 1970 00:21 UTC · 254 km acima do lado oculto', body: ['Sem poder arriscar o motor principal, contornaram a Lua numa trajetória de “retorno livre” de volta à Terra. Sem contato atrás da Lua, chegaram a 400.171 km da Terra — ainda a maior distância já percorrida por seres humanos.', 'Aqui a Terra volta a nascer além do horizonte lunar, vista daquela altitude.'] },
    { b: 'Retorno seguro', when: '17 abr 1970 18:07 UTC · Pacífico Sul', body: ['Depois do frio, do aumento do dióxido de carbono e da escassez de água e energia, o módulo de comando Odyssey amerissou no Pacífico Sul, perto de Samoa. O filtro de CO₂ “caixa de correio” que os engenheiros fizeram a tripulação montar com objetos de bordo virou lenda da engenharia — um “fracasso bem-sucedido”.'] },
  ] },
  hubble: { title: 'Telescópio Espacial Hubble', mark1: 'Campo Profundo do Hubble (2,6′ — 1/12 da Lua cheia)', v: [
    { b: 'A Terra vista de sua órbita', when: '25 abr 1990 · a cerca de 612 km de altitude', body: ['O ônibus espacial Discovery ergueu o Hubble com seu braço robótico e o colocou em órbita. Acima da atmosfera a luz das estrelas não cintila, então ele enxerga com muito mais nitidez que os telescópios em solo.', 'Suas primeiras imagens saíram borradas: o espelho primário havia sido polido errado em cerca de 2,2 μm, um cinquenta avos da espessura de um fio de cabelo. Só em 1993 astronautas lhe instalaram “óculos” (a óptica corretiva COSTAR).'] },
    { b: 'Campo Profundo do Hubble', when: '18–28 dez 1995 · em direção à Ursa Maior', body: ['Os astrônomos escolheram uma das áreas do céu de aparência mais vazia e fizeram 342 exposições ao longo de dez dias. Num pontinho com um doze avos da largura da Lua cheia, surgiram cerca de 3.000 galáxias.', 'Esta é uma visão estreita olhando direto para aquela área. Dentro do quadrado, vazio a olho nu, há galáxias a bilhões de anos-luz — uma imagem de quão vasto é o universo.'] },
  ] },
};

HISTT.ru = {
  apollo8: { title: '«Аполлон-8» — Восход Земли', mark0: '', v: [
    { b: 'Восход Земли с лунной орбиты', when: '24 дек. 1968 16:40 UTC · 110 км над Луной', body: ['«Аполлон-8» стал первым пилотируемым полётом на орбиту Луны. На четвёртом витке, выходя из-за обратной стороны, экипаж увидел, как Земля поднимается над лунным горизонтом. Уильям Андерс спешно зарядил цветную плёнку и сделал снимок «Восход Земли».', 'Фотография стала символом экологического движения. В тот вечер экипаж прочитал отрывок из Книги Бытия в рождественской трансляции — одной из самых просматриваемых в истории.'] },
    { b: 'Между Землёй и Луной', when: '24 дек. 1968 · около 380 000 км от Земли', body: ['Впервые люди вырвались из гравитационных объятий Земли к другому миру. Фрэнк Борман, Джим Ловелл и Уильям Андерс стали первыми людьми, увидевшими всю Землю целиком как единый шар.'] },
  ] },
  apollo13: { title: '«Аполлон-13»', mark0: 'Взрыв (около 320 000 км от Земли, приблизительно)', mark2: 'Приводнение в Тихом океане', v: [
    { b: '«Хьюстон, у нас проблема»', when: '14 апр. 1970 03:08 UTC · около 320 000 км от Земли', body: ['На пути к Луне взорвался кислородный бак № 2 служебного модуля. Лишившись большей части электроэнергии и кислорода, экипаж отказался от посадки, и трое астронавтов использовали лунный модуль «Водолей» (Aquarius) как спасательную шлюпку, чтобы вернуться домой.', 'Жёлтая метка — приблизительное положение корабля в тот момент (на линии Земля–Луна, а не реальная траектория).'] },
    { b: 'За Луной, дальше всех', when: '15 апр. 1970 00:21 UTC · 254 км над обратной стороной', body: ['Не рискуя включать основной двигатель, они обогнули Луну по траектории «свободного возврата» к Земле. Без связи за Луной они удалились от Земли на 400 171 км — это до сих пор самое большое расстояние, на которое когда-либо удалялись люди.', 'Здесь Земля снова восходит над лунным горизонтом с этой высоты.'] },
    { b: 'Благополучное возвращение', when: '17 апр. 1970 18:07 UTC · южная часть Тихого океана', body: ['Пережив холод, рост углекислого газа, нехватку воды и энергии, командный модуль «Одиссей» (Odyssey) приводнился в южной части Тихого океана близ Самоа. Фильтр CO₂ «почтовый ящик», который инженеры поручили экипажу собрать из подручных предметов, стал инженерной легендой — «успешной неудачей».'] },
  ] },
  hubble: { title: 'Космический телескоп «Хаббл»', mark1: 'Глубокое поле «Хаббла» (2,6′ — 1/12 полной Луны)', v: [
    { b: 'Земля с его орбиты', when: '25 апр. 1990 · высота около 612 км', body: ['Шаттл «Дискавери» извлёк «Хаббл» манипулятором и вывел его на орбиту. Над атмосферой звёзды не мерцают, поэтому телескоп видит гораздо чётче наземных.', 'Первые снимки оказались размытыми: главное зеркало было отшлифовано с ошибкой около 2,2 мкм — одна пятидесятая толщины волоса. Лишь в 1993 году астронавты надели ему «очки» (корректирующую оптику COSTAR).'] },
    { b: 'Глубокое поле «Хаббла»', when: '18–28 дек. 1995 · в направлении Большой Медведицы', body: ['Астрономы выбрали один из самых пустых на вид участков неба и за десять дней сделали 342 снимка. В пятнышке шириной в одну двенадцатую диаметра полной Луны обнаружилось около 3000 галактик.', 'Это узкий вид прямо вверх на этот участок. Внутри квадрата, пустого для глаза, — галактики на расстоянии миллиардов световых лет. Снимок о том, как огромна Вселенная.'] },
  ] },
};

    { b: 'Trở về an toàn', when: '17/4/1970 18:07 UTC · Nam Thái Bình Dương', body: ['Sau khi chịu đựng giá lạnh, lượng CO₂ tăng dần cùng nước và điện khan hiếm, khoang chỉ huy Odyssey hạ xuống Nam Thái Bình Dương gần Samoa. Bộ lọc CO₂ “hộp thư” mà các kỹ sư hướng dẫn phi hành đoàn tự làm từ đồ vật trên tàu đã trở thành huyền thoại kỹ thuật — một “thất bại thành công”.'] },

    { b: 'Trường Sâu Hubble', when: '18–28/12/1995 · hướng chòm Đại Hùng', body: ['Các nhà thiên văn chọn một trong những mảng trời trông trống trải nhất và chụp 342 lần phơi sáng trong mười ngày. Trong một đốm nhỏ chỉ rộng bằng một phần mười hai Trăng tròn, khoảng 3.000 thiên hà đã hiện ra.', 'Đây là góc nhìn hẹp hướng thẳng lên mảng trời đó. Trong ô vuông trống rỗng với mắt thường là những thiên hà cách xa hàng tỷ năm ánh sáng — một bức ảnh cho thấy vũ trụ bao la đến nhường nào.'] },

// 고른 것과 관계있는 궤도만 뚜렷하게: 태양(또는 아무것도 안 고름)이면 모두, 천체면 그 천체·모행성·위성, 탐사선이면 모두 흐리게
