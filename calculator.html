<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitle">계산기</title>
<style>
:root {
  --bg1: #e9ecf3; --bg2: #d5dae6; --body: #f7f8fb; --body-edge: #ffffff; --shadow: 0 30px 60px -20px rgba(40, 52, 90, .35), 0 8px 18px -8px rgba(40, 52, 90, .25);
  --screen: #eef1f7; --screen-ink: #141a2b; --muted: #7d869c; --faint: #a8b0c3;
  --key: #ffffff; --key-ink: #1d2436; --key-hi: rgba(255, 255, 255, .9); --key-lo: rgba(30, 40, 70, .12);
  --fn: #e4e8f1; --fn-ink: #3a4560; --op: #dfe6fb; --op-ink: #2f56d6;
  --eq1: #ff9f43; --eq2: #ff6b3d; --eq-ink: #fff; --ac: #ffe3df; --ac-ink: #d2452f;
  --tape: #fffdf6; --tape-ink: #3b3a33; --tape-line: #ece6d4; --accent: #2f56d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg1: #11141c; --bg2: #07080c; --body: #1b1f2a; --body-edge: #2a3040; --shadow: 0 30px 70px -20px rgba(0, 0, 0, .8), 0 10px 20px -10px rgba(0, 0, 0, .6);
    --screen: #0e1118; --screen-ink: #f2f4fa; --muted: #8a93a8; --faint: #555e72;
    --key: #2a3040; --key-ink: #eef1f8; --key-hi: rgba(255, 255, 255, .07); --key-lo: rgba(0, 0, 0, .45);
    --fn: #222735; --fn-ink: #b8c0d4; --op: #263152; --op-ink: #8fb0ff;
    --eq1: #ffa24a; --eq2: #ff6a3a; --eq-ink: #fff; --ac: #3a2226; --ac-ink: #ff8a78;
    --tape: #191c24; --tape-ink: #d9dcE4; --tape-line: #262b37; --accent: #8fb0ff;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 20% 0%, var(--bg1), var(--bg2));
  color: var(--screen-ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 16px; outline: none; overflow: hidden;
}
.wrap { display: flex; gap: 22px; align-items: flex-start; max-height: 100%; }
.calc {
  width: min(380px, calc(100vw - 32px)); background: linear-gradient(160deg, var(--body-edge), var(--body) 40%);
  border-radius: 34px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
}
.screen {
  background: var(--screen); border-radius: 22px; padding: 16px 18px 14px; min-height: 148px; display: flex; flex-direction: column; justify-content: flex-end;
  box-shadow: inset 0 2px 6px var(--key-lo); position: relative; overflow: hidden; cursor: copy;
}
.screen .top { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .08em; color: var(--faint); text-transform: uppercase; }
.screen .mem { color: var(--accent); font-weight: 600; opacity: 0; transition: opacity .2s; }
.screen .mem.on { opacity: 1; }
.expr { font-size: 17px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; min-height: 24px; font-variant-numeric: tabular-nums; }
.expr span { direction: ltr; unicode-bidi: isolate; }
.main { font-size: 56px; font-weight: 300; text-align: right; white-space: nowrap; line-height: 1.12; letter-spacing: -.02em; font-variant-numeric: tabular-nums; transition: font-size .12s; }
.main.err { font-size: 22px !important; color: var(--ac-ink); font-weight: 500; letter-spacing: 0; padding: 14px 0 6px; }
.preview { font-size: 16px; color: var(--muted); text-align: right; min-height: 21px; font-variant-numeric: tabular-nums; }
.copied { position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 10px); background: var(--accent); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 99px; opacity: 0; transition: all .25s; pointer-events: none; }
.copied.show { opacity: 1; transform: translate(-50%, 0); }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.k {
  border: none; font: inherit; cursor: pointer; user-select: none; -webkit-user-select: none; position: relative; overflow: hidden;
  background: var(--key); color: var(--key-ink); border-radius: 20px; height: 62px; font-size: 25px; font-weight: 400;
  box-shadow: inset 0 1px 0 var(--key-hi), 0 3px 0 var(--key-lo), 0 6px 12px -6px var(--key-lo); transition: transform .06s, box-shadow .06s, filter .15s;
}
.k:hover { filter: brightness(1.04); }
.k:focus { outline: none; }
.k:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.k.down, .k:active { transform: translateY(2px); box-shadow: inset 0 1px 0 var(--key-hi), 0 1px 0 var(--key-lo); }
.k.fn { background: var(--fn); color: var(--fn-ink); font-size: 21px; }
.k.op { background: var(--op); color: var(--op-ink); font-size: 28px; }
.k.op.armed { outline: 2px solid var(--op-ink); outline-offset: -2px; }
.k.ac { background: var(--ac); color: var(--ac-ink); font-size: 20px; font-weight: 600; }
.k.eq { background: linear-gradient(160deg, var(--eq1), var(--eq2)); color: var(--eq-ink); font-size: 30px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 0 rgba(160, 60, 20, .45), 0 10px 20px -8px rgba(255, 100, 50, .6); }
.k.m { height: 36px; border-radius: 12px; font-size: 13px; font-weight: 600; background: transparent; color: var(--muted); box-shadow: none; letter-spacing: .03em; }
.k.m:hover { background: var(--fn); }
.k.m.tapebtn { color: var(--accent); }
.k .rip { position: absolute; border-radius: 50%; transform: scale(0); background: currentColor; opacity: .18; animation: rip .45s ease-out forwards; pointer-events: none; }
@keyframes rip { to { transform: scale(4); opacity: 0; } }
/* 계산 기록 테이프 */
.tape {
  width: 270px; background: var(--tape); color: var(--tape-ink); border-radius: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
}
.tape h2 { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 18px 18px 10px; display: flex; justify-content: space-between; align-items: center; }
.tape h2 button { border: none; background: none; color: var(--muted); font: inherit; font-size: 12px; letter-spacing: 0; text-transform: none; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.tape h2 button:hover { background: var(--tape-line); }
.roll { flex: 1; overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column-reverse; gap: 2px; background-image: repeating-linear-gradient(transparent 0 51px, var(--tape-line) 51px 52px); }
.entry { padding: 8px 6px; border-radius: 10px; cursor: pointer; text-align: right; animation: feed .3s ease-out; font-variant-numeric: tabular-nums; }
.entry:hover { background: var(--tape-line); }
.entry .e { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .r { font-size: 19px; font-weight: 500; overflow-wrap: anywhere; }
.empty { color: var(--faint); font-size: 13px; text-align: center; margin: auto; padding: 30px 0; }
@keyframes feed { from { transform: translateY(14px); opacity: 0; } }
.tape-close { display: none; }
@media (max-width: 760px) {
  .wrap { display: block; }
  .tape { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 62vh; border-radius: 22px 22px 0 0; transform: translateY(105%); transition: transform .3s ease; z-index: 5; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tape.open { transform: translateY(0); }
  .tape-close { display: inline; }
}
@media (min-width: 761px) { .k.m.tapebtn { display: none; } .mrow { grid-template-columns: repeat(4, 1fr); } }
@media (max-height: 700px) { .k { height: 52px; } .screen { min-height: 120px; } .main { font-size: 46px; } }
</style>
</head>
<body tabindex="0">
<div class="wrap">
  <div class="calc">
    <div class="screen" id="screen" title="">
      <div class="top"><span id="brand">wiiiv</span><span class="mem" id="mem">M</span></div>
      <div class="expr" id="expr"></div>
      <div class="main" id="main">0</div>
      <div class="preview" id="preview"></div>
      <div class="copied" id="copied"></div>
    </div>
    <div class="mrow" id="mrow"></div>
    <div class="keys" id="keys"></div>
  </div>
  <div class="tape" id="tape">
    <h2><span id="tapeTitle"></span><span><button id="tapeClear"></button><button class="tape-close" id="tapeClose">✕</button></span></h2>
    <div class="roll" id="roll"></div>
  </div>
</div>
<script>
const LANG = 'ko';
const T = {
  ko: { title: '계산기', tape: '계산 기록', clear: '지우기', empty: '계산하면 여기에 기록됩니다', copied: '복사했습니다', copyTip: '눌러서 결과 복사', div0: '0으로 나눌 수 없습니다', over: '수가 너무 큽니다', tapeBtn: '기록' },
  en: { title: 'Calculator', tape: 'History', clear: 'Clear', empty: 'Your calculations will appear here', copied: 'Copied', copyTip: 'Click to copy the result', div0: 'Cannot divide by zero', over: 'Number too large', tapeBtn: 'Tape' },
}[LANG] || null;
const S = T || { title: 'Calculator', tape: 'History', clear: 'Clear', empty: 'Your calculations will appear here', copied: 'Copied', copyTip: 'Click to copy the result', div0: 'Cannot divide by zero', over: 'Number too large', tapeBtn: 'Tape' };
document.getElementById('pageTitle').textContent = S.title;
document.getElementById('tapeTitle').textContent = S.tape;
document.getElementById('tapeClear').textContent = S.clear;
document.getElementById('screen').title = S.copyTip;

// ───────── 정확한 수: BigInt 분수 (0.1 + 0.2 = 0.3) ─────────
const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
function F(n, d = 1n) { if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; }
const fAdd = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
const fSub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
const fMul = (a, b) => F(a.n * b.n, a.d * b.d);
const fDiv = (a, b) => { if (b.n === 0n) throw new Error('div0'); return F(a.n * b.d, a.d * b.n); };
const fNeg = a => F(-a.n, a.d);
function fFromStr(s) { const neg = s.startsWith('-'); if (neg) s = s.slice(1); const [i, f = ''] = s.split('.'); const r = F(BigInt((i || '0') + f), 10n ** BigInt(f.length)); return neg ? fNeg(r) : r; }
const ZERO = F(0n), HUNDRED = F(100n);
// 표시: 유효 숫자 15자리, 아주 크거나 작으면 ×10ⁿ
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function group(int) { return int.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fFmt(a, sig = 15) {
  if (a.n === 0n) return '0';
  const neg = a.n < 0n, n = neg ? -a.n : a.n, d = a.d;
  // 지수 e: 10^e ≤ n/d < 10^(e+1)
  let e = n.toString().length - d.toString().length; if (e >= 0 ? n < d * 10n ** BigInt(e) : n * 10n ** BigInt(-e) < d) e--;
  const sh = sig - 1 - e;                                   // 남길 자릿수만큼 밀기
  let m = sh >= 0 ? (n * 10n ** BigInt(sh) * 2n + d) / (2n * d) : (n * 2n + d * 10n ** BigInt(-sh)) / (2n * d * 10n ** BigInt(-sh));
  if (m.toString().length > sig) { m /= 10n; e++; }
  let digits = m.toString();
  const sign = neg ? '−' : '';
  if (e >= sig || e < -6) {                                  // 지수 표기
    let mant = digits[0] + (digits.length > 1 ? '.' + digits.slice(1) : ''); mant = mant.replace(/\.?0+$/, '');
    return sign + mant + '×10' + String(e).split('').map(c => SUP[c]).join('');
  }
  let int, frac;
  if (e >= 0) { digits = digits.padEnd(e + 1, '0'); int = digits.slice(0, e + 1); frac = digits.slice(e + 1); }
  else { int = '0'; frac = '0'.repeat(-e - 1) + digits; }
  frac = frac.replace(/0+$/, '');
  return sign + group(int) + (frac ? '.' + frac : '');
}
const fToNum = a => Number(a.n) / Number(a.d);

// ───────── 상태 ─────────
// 식은 [수, 연산, 수, 연산, …] 토큰 목록.
// entry: 입력 중인 수(문자열) 또는 'R'(직전 결과 등 정확한 값 resultVal). has: 마지막 연산자 뒤에 수가 있는가
let tokens = [], entry = '0', resultVal = null, has = true, typing = false, justEq = false, lastOp = null, lastExpr = '', memory = null, error = null;
let tape = [];
try { tape = JSON.parse(localStorage.getItem('wiiiv-calc-tape') || '[]').slice(-60); } catch { tape = []; }
try { const m = localStorage.getItem('wiiiv-calc-mem'); if (m) { const [n, d] = m.split('/'); memory = F(BigInt(n), BigInt(d)); } } catch { memory = null; }
const save = () => { try { localStorage.setItem('wiiiv-calc-tape', JSON.stringify(tape.slice(-60))); localStorage.setItem('wiiiv-calc-mem', memory ? memory.n + '/' + memory.d : ''); } catch { /* 저장 못 해도 동작 */ } };
const PREC = { '+': 1, '−': 1, '×': 2, '÷': 2 };
function applyOp(a, op, b) { if (op === '+') return fAdd(a, b); if (op === '−') return fSub(a, b); if (op === '×') return fMul(a, b); return fDiv(a, b); }
function check(v) { if (v.n !== 0n && Math.abs(fToNum(v)) >= 1e100) throw new Error('over'); return v; }
// 우선순위 계산 (× ÷ 먼저)
function evaluate(list) {
  const vals = [], ops = [];
  const reduce = () => { const b = vals.pop(), a = vals.pop(); vals.push(check(applyOp(a, ops.pop(), b))); };
  list.forEach((t, i) => {
    if (i % 2 === 0) vals.push(t);
    else { while (ops.length && PREC[ops[ops.length - 1]] >= PREC[t]) reduce(); ops.push(t); }
  });
  while (ops.length) reduce();
  return vals[0];
}
const entryVal = () => entry === 'R' ? resultVal : fFromStr(entry === '-' || entry === '-0' ? '0' : entry);
function entryShow() {
  if (entry === 'R') return fFmt(resultVal);
  let s = entry, neg = s.startsWith('-'); if (neg) s = s.slice(1);
  const [i, f] = s.split('.');
  return (neg ? '−' : '') + group(i || '0') + (f !== undefined ? '.' + f : '');
}
function exprText(list, withEntry) {
  const parts = list.map((t, i) => i % 2 === 0 ? fFmt(t) : ' ' + t + ' ');
  if (withEntry) parts.push(entryShow());
  return parts.join('');
}
function afterEq() { if (justEq) { tokens = []; justEq = false; lastOp = null; lastExpr = ''; } }
function setValue(v) { resultVal = v; entry = 'R'; has = true; typing = false; }

// ───────── 키 동작 ─────────
function digit(dg) {
  if (error) clearAll();
  afterEq();
  if (!typing) { entry = dg === '.' ? '0.' : dg; typing = true; has = true; return; }
  if (dg === '.') { if (!entry.includes('.')) entry += '.'; return; }
  if (entry.replace(/[-.]/g, '').length >= 16) return;
  entry = entry === '0' ? dg : entry === '-0' ? '-' + dg : entry + dg;
}
function op(o) {
  if (error) return;
  if (justEq) { justEq = false; lastOp = null; lastExpr = ''; }
  if (!has && tokens.length) { tokens[tokens.length - 1] = o; return; }   // 연산자 바꾸기
  tokens.push(entryVal(), o); has = false; typing = false;
}
function equals() {
  if (error) return;
  let list;
  if (justEq) { if (!lastOp) return; list = [entryVal(), lastOp.op, lastOp.v]; }      // = 반복
  else {
    if (!tokens.length) return;
    const v = has ? entryVal() : evaluate(tokens.slice(0, -1));                      // "5 + =" → 5 + 5
    list = [...tokens, v];
    lastOp = { op: list[list.length - 2], v };
  }
  try {
    const r = evaluate(list); lastExpr = exprText(list) + ' =';
    tape.push({ e: lastExpr, r: fFmt(r), n: r.n.toString(), d: r.d.toString() }); save();
    tokens = []; setValue(r); justEq = true;
  } catch (e) { fail(e); }
}
function percent() {
  if (error) return;
  afterEq();
  let v = fDiv(has ? entryVal() : evaluate(tokens.slice(0, -1)), HUNDRED);
  // a + b% → a 의 b%, a × b% → b/100
  if (tokens.length && (tokens[tokens.length - 1] === '+' || tokens[tokens.length - 1] === '−')) v = fMul(evaluate(tokens.slice(0, -1)), v);
  setValue(v);
}
function negate() {
  if (error) return;
  if (justEq) { justEq = false; lastOp = null; lastExpr = ''; }
  if (!has) { entry = '-0'; has = true; typing = true; return; }
  if (entry === 'R') { setValue(fNeg(resultVal)); return; }
  entry = entry.startsWith('-') ? entry.slice(1) : '-' + entry;
}
function back() {
  if (error) { clearAll(); return; }
  if (!typing) return;
  entry = entry.length > 1 && entry !== '-0' ? entry.slice(0, -1) : '0'; if (entry === '-') entry = '0';
}
function clearEntry() { if (error) { clearAll(); return; } entry = '0'; typing = false; has = true; }
function clearAll() { tokens = []; entry = '0'; resultVal = null; has = true; typing = false; justEq = false; lastOp = null; error = null; lastExpr = ''; }
function fail(e) { error = e.message === 'div0' ? S.div0 : S.over; tokens = []; lastOp = null; justEq = false; }
function mem(k) {
  if (error) return;
  if (k === 'mc') memory = null;
  else if (k === 'mr') { if (memory) { afterEq(); setValue(memory); } }
  else { memory = (k === 'm+' ? fAdd : fSub)(memory || ZERO, has ? entryVal() : evaluate(tokens.slice(0, -1))); typing = false; }
  save();
}

// ───────── 화면 ─────────
const $main = document.getElementById('main'), $expr = document.getElementById('expr'), $prev = document.getElementById('preview'), $mem = document.getElementById('mem');
function fit() {
  $main.style.fontSize = ''; const max = $main.parentElement.clientWidth - 36; let s = parseFloat(getComputedStyle($main).fontSize);
  while ($main.scrollWidth > max && s > 18) { s -= 2; $main.style.fontSize = s + 'px'; }
}
function render() {
  $mem.classList.toggle('on', !!memory);
  document.querySelectorAll('.k.op').forEach(b => b.classList.toggle('armed', !has && tokens.length > 0 && tokens[tokens.length - 1] === b.dataset.v));
  document.querySelector('[data-a="ac"]').textContent = typing && entry !== '0' ? 'C' : 'AC';
  if (error) { $main.textContent = error; $main.classList.add('err'); $expr.innerHTML = ''; $prev.textContent = ''; return; }
  $main.classList.remove('err');
  let shown;
  if (!has && tokens.length) { try { shown = fFmt(evaluate(tokens.slice(0, -1))); } catch { shown = fFmt(tokens[tokens.length - 2]); } }
  else shown = entryShow();
  $main.textContent = shown;
  const ex = justEq ? lastExpr : tokens.length ? exprText(tokens, has) : '';
  $expr.innerHTML = '<span></span>'; $expr.firstChild.textContent = ex;
  // 미리 보기: 아직 = 를 안 눌렀을 때 지금까지의 값
  let pv = '';
  if (tokens.length && has) { try { pv = '= ' + fFmt(evaluate([...tokens, entryVal()])); } catch { pv = ''; } }
  $prev.textContent = pv;
  fit();
}

// ───────── 키 배치 ─────────
const KEYS = [
  ['ac', 'AC', 'ac'], ['back', '⌫', 'fn'], ['pct', '%', 'fn'], ['÷', '÷', 'op'],
  ['7', '7'], ['8', '8'], ['9', '9'], ['×', '×', 'op'],
  ['4', '4'], ['5', '5'], ['6', '6'], ['−', '−', 'op'],
  ['1', '1'], ['2', '2'], ['3', '3'], ['+', '+', 'op'],
  ['neg', '±', 'fn'], ['0', '0'], ['.', '.'], ['=', '=', 'eq'],
];
const MKEYS = [['mc', 'MC'], ['mr', 'MR'], ['m+', 'M+'], ['m-', 'M−'], ['tape', S.tapeBtn, 'tapebtn']];
const $keys = document.getElementById('keys'), $mrow = document.getElementById('mrow');
function mk(parent, [a, label, cls], base) {
  const b = document.createElement('button'); b.className = 'k ' + base + ' ' + (cls || ''); b.textContent = label; b.dataset.a = a; b.dataset.v = a;
  b.addEventListener('pointerdown', ev => { ripple(b, ev); });
  b.addEventListener('click', () => press(a)); parent.appendChild(b);
}
KEYS.forEach(k => mk($keys, k, ''));
MKEYS.forEach(k => mk($mrow, k, 'm'));
function ripple(b, ev) {
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), d = document.createElement('span');
  d.className = 'rip'; d.style.width = d.style.height = s + 'px'; d.style.left = (ev.clientX - r.left - s / 2) + 'px'; d.style.top = (ev.clientY - r.top - s / 2) + 'px';
  b.appendChild(d); setTimeout(() => d.remove(), 460);
}
function press(a) {
  try { act(a); } catch (e) { if (e && (e.message === 'div0' || e.message === 'over')) fail(e); else throw e; }
  if (a !== 'tape') { render(); renderTape(); }
}
function act(a) {
  if (/^[0-9.]$/.test(a)) digit(a);
  else if (a in PREC) op(a);
  else if (a === '=') equals();
  else if (a === 'ac') { const label = document.querySelector('[data-a="ac"]').textContent; label === 'C' ? clearEntry() : clearAll(); }
  else if (a === 'back') back();
  else if (a === 'pct') percent();
  else if (a === 'neg') negate();
  else if (a === 'tape') { document.getElementById('tape').classList.toggle('open'); return; }
  else if (/^m/.test(a)) mem(a);
}

// ───────── 기록 테이프 ─────────
const $roll = document.getElementById('roll');
let tapeShown = -1;
function renderTape() {
  if (tapeShown === tape.length) return; tapeShown = tape.length;
  $roll.innerHTML = '';
  if (!tape.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = S.empty; $roll.appendChild(e); return; }
  [...tape].reverse().forEach((t, i) => {
    const d = document.createElement('div'); d.className = 'entry'; if (i > 0) d.style.animation = 'none';
    const e = document.createElement('div'); e.className = 'e'; e.textContent = t.e;
    const r = document.createElement('div'); r.className = 'r'; r.textContent = t.r;
    d.append(e, r);
    d.addEventListener('click', () => { if (error) clearAll(); afterEq(); setValue(F(BigInt(t.n), BigInt(t.d))); render(); document.getElementById('tape').classList.remove('open'); });
    $roll.appendChild(d);
  });
}
document.getElementById('tapeClear').addEventListener('click', () => { tape = []; save(); renderTape(); });
document.getElementById('tapeClose').addEventListener('click', () => document.getElementById('tape').classList.remove('open'));

// 결과 복사
document.getElementById('screen').addEventListener('click', () => {
  if (error) return;
  const txt = $main.textContent.replace(/,/g, '').replace('−', '-');
  const ok = () => { const c = document.getElementById('copied'); c.textContent = S.copied; c.classList.add('show'); setTimeout(() => c.classList.remove('show'), 1100); };
  try { navigator.clipboard.writeText(txt).then(ok, () => {}); } catch { /* 복사 못 해도 무시 */ }
});

// 키보드
const KB = { Enter: '=', '=': '=', '+': '+', '-': '−', '*': '×', x: '×', X: '×', '/': '÷', '%': 'pct', Backspace: 'back', Escape: 'ac', Delete: 'ac', ',': '.', '.': '.' };
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const a = /^[0-9]$/.test(ev.key) ? ev.key : KB[ev.key]; if (!a) return;
  ev.preventDefault();
  if (a === 'ac' && ev.key === 'Escape') { clearAll(); render(); } else press(a);
  const b = document.querySelector(`.k[data-a="${CSS.escape(a)}"]`); if (b) { b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 110); }
});
// 넓은 화면: 기록 테이프 높이를 계산기에 맞춘다
function sizeTape() { const t = document.getElementById('tape'); t.style.height = innerWidth > 760 ? document.querySelector('.calc').offsetHeight + 'px' : ''; }
window.addEventListener('resize', () => { fit(); sizeTape(); });
sizeTape();
render(); renderTape(); document.body.focus();
window.__gc = { press, state: () => ({ main: $main.textContent, expr: $expr.textContent, preview: $prev.textContent, mem: !!memory, tape: tape.length, error }) };
</script>
