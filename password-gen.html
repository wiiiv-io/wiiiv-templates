<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">비밀번호 생성기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
.container { width: 100%; max-width: 420px; }
h1 { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 24px; color: #e0e0e0; }

.password-card { background: #161628; border-radius: 16px; padding: 20px; margin-bottom: 16px; }

.pw-display { position: relative; background: #1e1e35; border-radius: 12px; padding: 20px; margin-bottom: 16px; min-height: 70px; display: flex; align-items: center; word-break: break-all; }
.pw-text { font-size: 20px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; letter-spacing: 1.5px; line-height: 1.5; flex: 1; user-select: all; }
.pw-text .ch-upper { color: #7c5cfc; }
.pw-text .ch-lower { color: #e0e0e0; }
.pw-text .ch-digit { color: #51cf66; }
.pw-text .ch-symbol { color: #ff922b; }
.pw-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.pw-act-btn { background: #2a2a45; border: none; color: #888; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.pw-act-btn:hover { background: #3a3a55; color: #fff; }
.pw-act-btn.copied { background: #51cf66; color: #fff; }

.strength-bar { height: 4px; border-radius: 2px; background: #1e1e35; margin-bottom: 6px; overflow: hidden; }
.strength-fill { height: 100%; border-radius: 2px; transition: width 0.4s, background 0.4s; }
.strength-label { font-size: 12px; text-align: right; margin-bottom: 16px; transition: color 0.3s; }

.option-group { margin-bottom: 16px; }
.option-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

.length-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.length-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: #1e1e35; outline: none; }
.length-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #7c5cfc; cursor: pointer; border: 2px solid #0d0d1a; }
.length-val { font-size: 20px; font-weight: 600; color: #7c5cfc; width: 36px; text-align: center; font-variant-numeric: tabular-nums; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e1e35; }
.toggle-row:last-child { border-bottom: none; }
.toggle-label { font-size: 14px; color: #ccc; }
.toggle-label small { font-size: 12px; color: #666; margin-left: 6px; }
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #2a2a45; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
.toggle-track::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #666; transition: all 0.2s; }
.toggle input:checked + .toggle-track { background: #7c5cfc; }
.toggle input:checked + .toggle-track::after { left: 23px; background: #fff; }

.gen-btn { width: 100%; background: #7c5cfc; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.gen-btn:hover { background: #6a4ce0; }
.gen-btn:active { transform: scale(0.98); }

.history { margin-top: 16px; }
.history-title { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.history-clear { background: none; border: none; color: #555; font-size: 11px; cursor: pointer; font-family: inherit; }
.history-clear:hover { color: #ff6b6b; }
.history-list { max-height: 200px; overflow-y: auto; }
.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.history-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #161628; border-radius: 8px; margin-bottom: 4px; cursor: pointer; transition: background 0.2s; }
.history-row:hover { background: #1e1e35; }
.history-pw { flex: 1; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-len { font-size: 11px; color: #555; flex-shrink: 0; }
.history-copy { background: none; border: none; color: #555; cursor: pointer; font-size: 12px; flex-shrink: 0; padding: 4px; }
.history-copy:hover { color: #7c5cfc; }
</style>
</head>
<body>
<div class="container">
  <h1>비밀번호 생성기</h1>

  <div class="password-card">
    <div class="pw-display">
      <div class="pw-text" id="pwText"></div>
      <div class="pw-actions">
        <button class="pw-act-btn" id="btnCopy" title="복사">📋</button>
        <button class="pw-act-btn" id="btnRefresh" title="새로 생성">🔄</button>
      </div>
    </div>

    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="strength-label" id="strengthLabel"></div>

    <div class="option-group">
      <div class="option-label">길이</div>
      <div class="length-row">
        <input type="range" class="length-slider" id="lengthSlider" min="4" max="64" value="16">
        <span class="length-val" id="lengthVal">16</span>
      </div>
    </div>

    <div class="option-group">
      <div class="option-label">포함 문자</div>
      <div class="toggle-row">
        <span class="toggle-label">대문자 <small>A-Z</small></span>
        <label class="toggle"><input type="checkbox" id="optUpper" checked><span class="toggle-track"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">소문자 <small>a-z</small></span>
        <label class="toggle"><input type="checkbox" id="optLower" checked><span class="toggle-track"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">숫자 <small>0-9</small></span>
        <label class="toggle"><input type="checkbox" id="optDigit" checked><span class="toggle-track"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">특수문자 <small>!@#$%&*</small></span>
        <label class="toggle"><input type="checkbox" id="optSymbol" checked><span class="toggle-track"></span></label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">모호한 문자 제외 <small>0Oo1Il</small></span>
        <label class="toggle"><input type="checkbox" id="optExclude"><span class="toggle-track"></span></label>
      </div>
    </div>

    <button class="gen-btn" id="btnGen">생성</button>
  </div>

  <div class="history" id="historySection" style="display:none">
    <div class="history-title">
      <span>최근 생성</span>
      <button class="history-clear" id="btnHistoryClear">전체 삭제</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
const LANG = 'ko';
const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const DIGITS = '0123456789';
const SYMBOLS = '!@#$%^&*()-_=+[]{}|;:,.<>?';
const AMBIGUOUS = '0Oo1IlL';
let history = [];

function getCharset() {
  let charset = '';
  if (document.getElementById('optUpper').checked) charset += UPPER;
  if (document.getElementById('optLower').checked) charset += LOWER;
  if (document.getElementById('optDigit').checked) charset += DIGITS;
  if (document.getElementById('optSymbol').checked) charset += SYMBOLS;
  if (document.getElementById('optExclude').checked) {
    charset = charset.split('').filter(c => !AMBIGUOUS.includes(c)).join('');
  }
  return charset;
}

function generate() {
  const charset = getCharset();
  if (charset.length === 0) return '';
  const len = parseInt(document.getElementById('lengthSlider').value);
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let pw = '';
  for (let i = 0; i < len; i++) {
    pw += charset[arr[i] % charset.length];
  }
  return pw;
}

function calcStrength(pw) {
  if (!pw) return { score: 0, label: '', color: '#555' };
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
  const entropy = pw.length * Math.log2(pool || 1);
  if (entropy < 28) return { score: 15, label: '매우 약함', color: '#ff4444' };
  if (entropy < 36) return { score: 30, label: '약함', color: '#ff6b6b' };
  if (entropy < 50) return { score: 50, label: '보통', color: '#ff922b' };
  if (entropy < 70) return { score: 75, label: '강함', color: '#51cf66' };
  return { score: 100, label: '매우 강함', color: '#20c997' };
}

function colorize(pw) {
  return pw.split('').map(c => {
    if (/[A-Z]/.test(c)) return `<span class="ch-upper">${esc(c)}</span>`;
    if (/[a-z]/.test(c)) return `<span class="ch-lower">${esc(c)}</span>`;
    if (/[0-9]/.test(c)) return `<span class="ch-digit">${esc(c)}</span>`;
    return `<span class="ch-symbol">${esc(c)}</span>`;
  }).join('');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(pw) {
  document.getElementById('pwText').innerHTML = colorize(pw);
  const s = calcStrength(pw);
  const fill = document.getElementById('strengthFill');
  fill.style.width = s.score + '%';
  fill.style.background = s.color;
  const label = document.getElementById('strengthLabel');
  label.textContent = s.label;
  label.style.color = s.color;
}

function doGenerate() {
  const pw = generate();
  if (!pw) return;
  render(pw);
  history.unshift({ pw, len: pw.length });
  if (history.length > 10) history.pop();
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (history.length === 0) { section.style.display = 'none'; return; }
  section.style.display = '';
  list.innerHTML = history.map((h, i) =>
    `<div class="history-row" data-idx="${i}">
      <span class="history-pw">${esc(h.pw)}</span>
      <span class="history-len">${h.len}자</span>
      <button class="history-copy" data-pw="${esc(h.pw)}" title="복사">📋</button>
    </div>`
  ).join('');
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }
}

document.getElementById('btnGen').onclick = doGenerate;
document.getElementById('btnRefresh').onclick = doGenerate;

document.getElementById('btnCopy').onclick = async () => {
  const pw = document.getElementById('pwText').textContent;
  if (!pw) return;
  const btn = document.getElementById('btnCopy');
  if (await copyToClipboard(pw)) {
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1500);
  }
};

document.getElementById('lengthSlider').oninput = (e) => {
  document.getElementById('lengthVal').textContent = e.target.value;
};

document.querySelectorAll('.toggle input, #lengthSlider').forEach(el => {
  el.addEventListener('change', doGenerate);
});

document.getElementById('historyList').onclick = (e) => {
  const copyBtn = e.target.closest('.history-copy');
  if (copyBtn) {
    copyToClipboard(copyBtn.dataset.pw);
    copyBtn.textContent = '✓';
    setTimeout(() => { copyBtn.textContent = '📋'; }, 1500);
    return;
  }
  const row = e.target.closest('.history-row');
  if (row) {
    const idx = parseInt(row.dataset.idx);
    render(history[idx].pw);
  }
};

document.getElementById('btnHistoryClear').onclick = () => {
  history = [];
  renderHistory();
};

doGenerate();
</script>
</body>
</html>
