// ── 기술 설명: 스페인어 · 프랑스어 · 독일어 · 포르투갈어 · 러시아어 · 베트남어
TX.es.tech = {
  rules: { name: 'Las reglas', short: '1–9 una vez en cada fila, columna y caja', learn: 'La cuadrícula 9×9 tiene 9 filas, 9 columnas y 9 cajas de 3×3 marcadas con líneas gruesas.\nRellénala para que cada fila, columna y caja tenga del 1 al 9 exactamente una vez. Los números iniciales (pistas) no cambian.\nUn buen sudoku tiene una sola solución y se resuelve con lógica, sin adivinar.' },
  notes: { name: 'Notas de candidatos', short: 'Apunta lo que aún cabe en cada casilla', learn: 'En cuadrículas difíciles, apunta en pequeño los números que aún pueden ir en cada casilla (candidatos).\nUn número ya presente en la misma fila, columna o caja no es candidato. Cuando queda uno, es la respuesta.\n"Notas auto" los escribe todos de una vez.' },
  fullHouse: { name: 'Casa llena', short: 'Solo queda una casilla vacía', learn: 'Si una fila, columna o caja tiene una sola casilla vacía, el número que falta va ahí.\nLa técnica más sencilla, muy usada al final.', hint: '{unit} solo tiene vacía {cell}. Ahí va el {d} que falta.' },
  hiddenSingle: { name: 'Single oculto', short: 'Un número tiene un solo sitio', learn: 'Elige un número y mira una caja (o línea). Si solo hay una casilla donde puede ir, ese es su sitio.\nLas demás están bloqueadas porque su fila o columna ya tiene ese número.', hint: 'En {unit}, el {d} solo puede ir en {cell}.' },
  nakedSingle: { name: 'Single desnudo', short: 'Solo un número cabe en la casilla', learn: 'Elige una casilla y mira su fila, columna y caja. Si solo falta un número, esa es la respuesta.\nCon notas, son las casillas con un único candidato.', hint: 'En {cell} solo cabe el {d}: los demás ya están en su fila, columna o caja.' },
  pointing: { name: 'Apuntado', short: 'Los candidatos de una caja en una línea', learn: 'Si dentro de una caja todos los candidatos de un número están en una fila (o columna), el número irá en ese tramo.\nSe puede quitar de esa línea en las otras cajas.', hint: 'En {unit}, el {d} solo puede ir sobre {unit2}. Quítalo de las otras casillas de {unit2} ({elims}).' },
  claiming: { name: 'Reclamo', short: 'Los candidatos de una línea en una caja', learn: 'Al revés que el apuntado: si en una fila (o columna) todos los candidatos de un número están en una caja, el número de esa caja estará en esta línea.\nQuítalo del resto de la caja.', hint: 'En {unit}, el {d} solo está dentro de {unit2}. Quítalo del resto de {unit2} ({elims}).' },
  nakedPair: { name: 'Pareja desnuda', short: 'Dos casillas con los mismos dos candidatos', learn: 'Si dos casillas de un grupo tienen exactamente los mismos dos candidatos, esos números son suyos.\nQuítalos de las demás casillas del grupo.', hint: '{cells} en {unit} solo tienen {ds}. Quítalos de las demás casillas ({elims}).' },
  hiddenPair: { name: 'Pareja oculta', short: 'Dos números en las mismas dos casillas', learn: 'Si dos números solo pueden ir en las mismas dos casillas de un grupo, esas casillas son de esos números.\nQuita los demás candidatos de esas casillas.', hint: 'En {unit}, {ds} solo pueden ir en {cells}. Quita los otros candidatos de esas casillas.' },
  nakedTriple: { name: 'Trío desnudo', short: 'Tres casillas comparten tres candidatos', learn: 'Si tres casillas de un grupo juntas solo contienen tres números, esos números son suyos (no hace falta que cada una tenga los tres).', hint: 'Juntas, {cells} en {unit} solo tienen {ds}. Quítalos de las demás ({elims}).' },
  hiddenTriple: { name: 'Trío oculto', short: 'Tres números en las mismas tres casillas', learn: 'Si tres números solo pueden ir dentro de las mismas tres casillas, quita los demás candidatos de ellas.', hint: 'En {unit}, {ds} solo pueden ir en {cells}. Quita los otros candidatos.' },
  nakedQuad: { name: 'Cuarteto desnudo', short: 'Cuatro casillas comparten cuatro candidatos', learn: 'Si cuatro casillas juntas solo tienen cuatro números, quítalos del resto del grupo.', hint: 'Juntas, {cells} en {unit} solo tienen {ds}. Quítalos de las demás ({elims}).' },
  hiddenQuad: { name: 'Cuarteto oculto', short: 'Cuatro números en cuatro casillas', learn: 'Si cuatro números solo caben en las mismas cuatro casillas, quita los demás candidatos de ellas.', hint: 'En {unit}, {ds} solo pueden ir en {cells}. Quita los otros candidatos.' },
  xWing: { name: 'X-Wing', short: 'Un rectángulo en dos líneas', learn: 'Si un número solo cabe en dos sitios en cada una de dos filas, y comparten las mismas dos columnas, forman un rectángulo.\nEl número ocupa dos esquinas opuestas: en cualquier caso cubre ambas columnas. Quítalo del resto de esas columnas.', hint: 'El {d} en {lines} solo está en {covers}. Esas líneas ocupan el {d} de {covers}; quítalo de las demás ({elims}).' },
  swordfish: { name: 'Pez espada', short: 'X-Wing en tres líneas', learn: 'Un X-Wing en tres líneas: si un número en tres filas solo cabe en las mismas tres columnas, quítalo del resto de esas columnas.', hint: 'El {d} en {lines} solo está en {covers}. Quítalo de las demás casillas de {covers} ({elims}).' },
  jellyfish: { name: 'Medusa', short: 'X-Wing en cuatro líneas', learn: 'El pez de cuatro líneas: si un número en cuatro filas solo cabe en las mismas cuatro columnas, quítalo del resto.', hint: 'El {d} en {lines} solo está en {covers}. Quítalo de las demás casillas de {covers} ({elims}).' },
  skyscraper: { name: 'Rascacielos', short: 'Dos líneas unidas por un extremo', learn: 'Un número tiene dos sitios en cada una de dos filas; un extremo coincide en columna y los otros no, como dos torres.\nUno de los dos "tejados" será el número: quítalo de las casillas que ven a ambos.', hint: 'El {d} tiene dos sitios en {unit} y en {unit2}, unidos por un extremo. Uno de los otros extremos ({ends}) es {d}: quítalo de las casillas que ven a ambos ({elims}).' },
  twoStringKite: { name: 'Cometa', short: 'Una fila y una columna se unen en una caja', learn: 'Un número tiene dos sitios en una fila y dos en una columna, y un extremo de cada una está en la misma caja.\nUno de los extremos exteriores será el número: quítalo de la casilla que ve a ambos.', hint: 'El {d} tiene dos sitios en {unit} y en {unit2}, que se unen en una caja. Uno de los extremos ({ends}) es {d}: quítalo de {elims}.' },
  xyWing: { name: 'XY-Wing', short: 'Un pivote y dos pinzas', learn: 'Tres casillas de dos candidatos: un pivote {X,Y} y dos pinzas que ve, {X,Z} y {Y,Z}.\nSea cual sea el pivote, una pinza es Z. Quita Z de las casillas que ven ambas pinzas.', hint: 'Pivote {pivot} ({pm}) con pinzas {w1} ({m1}) y {w2} ({m2}): una pinza será {d}. Quítalo de las casillas que ven ambas ({elims}).' },
  xyzWing: { name: 'XYZ-Wing', short: 'Pivote de tres candidatos', learn: 'Como el XY-Wing, pero el pivote tiene {X,Y,Z}. Una de las tres casillas será Z: quítalo de las que ven las tres.', hint: 'Una de {pivot} ({pm}), {w1} ({m1}) y {w2} ({m2}) será {d}. Quítalo de las casillas que ven las tres ({elims}).' },
  wWing: { name: 'W-Wing', short: 'Parejas gemelas unidas por un enlace fuerte', learn: 'Dos casillas que no se ven tienen {X,Y}, y un enlace fuerte de X conecta casillas que ven a cada una.\nNo pueden ser ambas X, así que una es Y: quita Y de las casillas que ven a las dos.', hint: '{a} y {b} tienen {ab}, unidas por el enlace fuerte de {x} ({e}–{f}). Una de ellas es {d}: quítalo de las casillas que ven ambas ({elims}).' },
  xyChain: { name: 'Cadena XY', short: 'Una cadena de casillas de dos candidatos', learn: 'Enlaza casillas de dos candidatos; las vecinas se ven y comparten un número.\nSi la primera no es Z, la cadena obliga a que la última sea Z. Quita Z de las casillas que ven ambos extremos.', hint: 'Cadena {chain}: si la primera no es {d}, la última lo será. Quita {d} de las casillas que ven ambos extremos ({elims}).' },
  coloring: { name: 'Coloreado', short: 'Colorea los enlaces fuertes con dos colores', learn: 'Sigue las líneas donde un número tiene solo dos sitios y colorea alternando azul y naranja. Un color es verdadero y el otro falso.\nSi dos del mismo color se ven, ese color es falso. Una casilla que ve ambos colores no puede ser el número.', hint: 'Coloreando los enlaces fuertes del {d}, un color es verdadero. Quita {d} de las casillas que ven ambos colores ({elims}).', hintWrap: 'Coloreando el {d}, dos casillas del mismo color se ven. Ese color es falso: quita {d} de ellas ({elims}).' },
  uniqueRect: { name: 'Rectángulo único', short: 'Evita el patrón de dos soluciones', learn: 'Si cuatro esquinas de un rectángulo en dos cajas tuvieran solo {X,Y}, X e Y se podrían intercambiar: dos soluciones.\nAsí que si tres esquinas son {X,Y} y la cuarta tiene más, la cuarta no es X ni Y.', hint: 'Si {cells} tuvieran solo {ds}, habría dos soluciones. Así que {cell} no es {ds}: quítalos de {cell}.' },
  bug: { name: 'BUG+1', short: 'Solo una casilla con tres candidatos', learn: 'Si todas las casillas vacías tienen dos candidatos salvo una con tres, esa debe llevar el número "extra": el que aparece tres veces en su fila (o columna, caja).', hint: 'Todas las casillas salvo {cell} tienen dos candidatos. Si {cell} no fuera {d} habría varias soluciones, así que {cell} = {d}.' },
};
TX.fr.tech = {
  rules: { name: 'Les règles', short: '1 à 9 une fois par ligne, colonne, bloc', learn: 'La grille 9×9 compte 9 lignes, 9 colonnes et 9 blocs de 3×3 délimités par des traits épais.\nRemplissez-la pour que chaque ligne, colonne et bloc contienne chaque chiffre de 1 à 9 une seule fois. Les chiffres donnés (indices) ne changent jamais.\nUn bon sudoku a une seule solution et se résout par la logique, sans deviner.' },
  notes: { name: 'Notes de candidats', short: 'Noter ce qui peut encore aller dans une case', learn: 'Sur les grilles difficiles, notez en petit les chiffres encore possibles dans chaque case (candidats).\nUn chiffre déjà présent dans la ligne, la colonne ou le bloc n’est pas candidat. Quand il en reste un, c’est la réponse.\n« Notes auto » les écrit tous d’un coup.' },
  fullHouse: { name: 'Dernière case', short: 'Une seule case vide dans une unité', learn: 'Si une ligne, une colonne ou un bloc n’a plus qu’une case vide, le chiffre manquant y va.\nLa technique la plus simple, très utilisée en fin de partie.', hint: '{unit} n’a plus qu’une case vide, {cell}. Le {d} manquant y va.' },
  hiddenSingle: { name: 'Singleton caché', short: 'Une seule place pour un chiffre', learn: 'Choisissez un chiffre et regardez un bloc (ou une ligne). S’il n’a qu’une case possible, c’est sa place.\nLes autres sont bloquées car leur ligne ou colonne contient déjà ce chiffre.', hint: 'Dans {unit}, le {d} ne peut aller qu’en {cell}.' },
  nakedSingle: { name: 'Singleton nu', short: 'Un seul chiffre possible dans la case', learn: 'Choisissez une case et regardez sa ligne, sa colonne et son bloc. S’il ne manque qu’un chiffre, c’est la réponse.\nAvec les notes, ce sont les cases à un seul candidat.', hint: 'Seul le {d} va en {cell} : tous les autres sont déjà dans sa ligne, sa colonne ou son bloc.' },
  pointing: { name: 'Paire pointante', short: 'Les candidats d’un bloc sur une ligne', learn: 'Si, dans un bloc, tous les candidats d’un chiffre sont sur une même ligne (ou colonne), le chiffre ira sur ce segment.\nOn peut l’éliminer de cette ligne dans les autres blocs.', hint: 'Dans {unit}, le {d} ne peut être que sur {unit2}. Éliminez-le des autres cases de {unit2} ({elims}).' },
  claiming: { name: 'Réclamation', short: 'Les candidats d’une ligne dans un bloc', learn: 'L’inverse : si dans une ligne (ou colonne) tous les candidats d’un chiffre sont dans un seul bloc, ce chiffre du bloc est sur cette ligne.\nÉliminez-le du reste du bloc.', hint: 'Dans {unit}, le {d} n’est que dans {unit2}. Éliminez-le du reste de {unit2} ({elims}).' },
  nakedPair: { name: 'Paire nue', short: 'Deux cases aux deux mêmes candidats', learn: 'Si deux cases d’une unité ont exactement les deux mêmes candidats, ces chiffres leur appartiennent.\nÉliminez-les des autres cases de l’unité.', hint: '{cells} dans {unit} n’ont que {ds}. Éliminez-les des autres cases ({elims}).' },
  hiddenPair: { name: 'Paire cachée', short: 'Deux chiffres dans les deux mêmes cases', learn: 'Si deux chiffres ne peuvent aller que dans les deux mêmes cases d’une unité, ces cases leur reviennent.\nÉliminez les autres candidats de ces cases.', hint: 'Dans {unit}, {ds} ne vont que dans {cells}. Éliminez les autres candidats de ces cases.' },
  nakedTriple: { name: 'Triplet nu', short: 'Trois cases partagent trois candidats', learn: 'Si trois cases d’une unité ne contiennent ensemble que trois chiffres, ceux-ci leur appartiennent (chaque case n’a pas besoin des trois).', hint: 'Ensemble, {cells} dans {unit} n’ont que {ds}. Éliminez-les des autres ({elims}).' },
  hiddenTriple: { name: 'Triplet caché', short: 'Trois chiffres dans les trois mêmes cases', learn: 'Si trois chiffres ne peuvent aller que dans les trois mêmes cases, éliminez les autres candidats de ces cases.', hint: 'Dans {unit}, {ds} ne vont que dans {cells}. Éliminez les autres candidats.' },
  nakedQuad: { name: 'Quadruplet nu', short: 'Quatre cases, quatre candidats', learn: 'Si quatre cases n’ont ensemble que quatre chiffres, éliminez-les du reste de l’unité.', hint: 'Ensemble, {cells} dans {unit} n’ont que {ds}. Éliminez-les des autres ({elims}).' },
  hiddenQuad: { name: 'Quadruplet caché', short: 'Quatre chiffres dans quatre cases', learn: 'Si quatre chiffres ne vont que dans les quatre mêmes cases, éliminez les autres candidats de ces cases.', hint: 'Dans {unit}, {ds} ne vont que dans {cells}. Éliminez les autres candidats.' },
  xWing: { name: 'X-Wing', short: 'Un rectangle sur deux lignes', learn: 'Si un chiffre n’a que deux places dans chacune de deux lignes, sur les deux mêmes colonnes, il forme un rectangle.\nIl occupe deux coins opposés : dans tous les cas les deux colonnes sont prises. Éliminez-le du reste de ces colonnes.', hint: 'Le {d} dans {lines} n’est que sur {covers}. Ces lignes prennent le {d} de {covers} ; éliminez-le ailleurs ({elims}).' },
  swordfish: { name: 'Espadon', short: 'Un X-Wing sur trois lignes', learn: 'Un X-Wing élargi : si un chiffre dans trois lignes ne va que dans les trois mêmes colonnes, éliminez-le du reste de ces colonnes.', hint: 'Le {d} dans {lines} n’est que sur {covers}. Éliminez-le des autres cases de {covers} ({elims}).' },
  jellyfish: { name: 'Méduse', short: 'Un X-Wing sur quatre lignes', learn: 'Le poisson à quatre lignes : si un chiffre dans quatre lignes ne va que dans les quatre mêmes colonnes, éliminez-le du reste.', hint: 'Le {d} dans {lines} n’est que sur {covers}. Éliminez-le des autres cases de {covers} ({elims}).' },
  skyscraper: { name: 'Gratte-ciel', short: 'Deux lignes reliées par un bout', learn: 'Un chiffre a deux places dans chacune de deux lignes ; un bout est dans la même colonne, les autres sont décalés, comme deux tours.\nUn des deux « toits » est le chiffre : éliminez-le des cases qui voient les deux.', hint: 'Le {d} a deux places dans {unit} et {unit2}, reliées par un bout. Un des autres bouts ({ends}) est {d} : éliminez-le des cases qui voient les deux ({elims}).' },
  twoStringKite: { name: 'Cerf-volant', short: 'Une ligne et une colonne se croisent dans un bloc', learn: 'Un chiffre a deux places dans une ligne et deux dans une colonne, avec un bout de chacune dans le même bloc.\nUn des bouts extérieurs est le chiffre : éliminez-le de la case qui voit les deux.', hint: 'Le {d} a deux places dans {unit} et {unit2}, qui se rejoignent dans un bloc. Un des bouts ({ends}) est {d} : éliminez-le de {elims}.' },
  xyWing: { name: 'XY-Wing', short: 'Un pivot et deux pinces', learn: 'Trois cases à deux candidats : un pivot {X,Y} et deux pinces qu’il voit, {X,Z} et {Y,Z}.\nQuel que soit le pivot, une pince vaut Z. Éliminez Z des cases qui voient les deux pinces.', hint: 'Pivot {pivot} ({pm}), pinces {w1} ({m1}) et {w2} ({m2}) : une pince vaut {d}. Éliminez-le des cases qui voient les deux ({elims}).' },
  xyzWing: { name: 'XYZ-Wing', short: 'Un pivot à trois candidats', learn: 'Comme le XY-Wing, mais le pivot a {X,Y,Z}. Une des trois cases vaut Z : éliminez Z des cases qui voient les trois.', hint: 'Une case parmi {pivot} ({pm}), {w1} ({m1}), {w2} ({m2}) vaut {d}. Éliminez-le des cases qui voient les trois ({elims}).' },
  wWing: { name: 'W-Wing', short: 'Paires jumelles reliées par un lien fort', learn: 'Deux cases qui ne se voient pas ont {X,Y}, et un lien fort sur X relie des cases qui voient chacune d’elles.\nElles ne peuvent pas être toutes deux X : l’une vaut Y. Éliminez Y des cases qui voient les deux.', hint: '{a} et {b} ont {ab}, reliées par le lien fort de {x} ({e}–{f}). L’une vaut {d} : éliminez-le des cases qui voient les deux ({elims}).' },
  xyChain: { name: 'Chaîne XY', short: 'Une chaîne de cases à deux candidats', learn: 'Reliez des cases à deux candidats ; les voisines se voient et partagent un chiffre.\nSi la première n’est pas Z, la chaîne force la dernière à valoir Z. Éliminez Z des cases qui voient les deux bouts.', hint: 'Chaîne {chain} : si la première n’est pas {d}, la dernière l’est. Éliminez {d} des cases qui voient les deux bouts ({elims}).' },
  coloring: { name: 'Coloriage', short: 'Colorier les liens forts en deux couleurs', learn: 'Suivez les lignes où un chiffre n’a que deux places et coloriez les cases en bleu et orange alternés. Une couleur est vraie, l’autre fausse.\nSi deux cases de même couleur se voient, cette couleur est fausse. Une case qui voit les deux couleurs ne peut pas porter le chiffre.', hint: 'En coloriant les liens forts du {d}, une couleur est vraie. Éliminez {d} des cases qui voient les deux couleurs ({elims}).', hintWrap: 'En coloriant le {d}, deux cases de même couleur se voient. Cette couleur est fausse : éliminez {d} de ses cases ({elims}).' },
  uniqueRect: { name: 'Rectangle unique', short: 'Éviter le motif à deux solutions', learn: 'Si les quatre coins d’un rectangle sur deux blocs n’avaient que {X,Y}, on pourrait échanger X et Y : deux solutions.\nDonc si trois coins sont {X,Y} et le quatrième a d’autres candidats, il n’est ni X ni Y.', hint: 'Si {cells} n’avaient que {ds}, il y aurait deux solutions. Donc {cell} n’est pas {ds} : éliminez-les de {cell}.' },
  bug: { name: 'BUG+1', short: 'Une seule case à trois candidats', learn: 'Si toutes les cases vides ont deux candidats sauf une qui en a trois, celle-ci porte le chiffre « en trop » : celui qui apparaît trois fois dans sa ligne (ou colonne, bloc).', hint: 'Toutes les cases sauf {cell} ont deux candidats. Si {cell} n’était pas {d}, il y aurait plusieurs solutions : {cell} = {d}.' },
};
TX.de.tech = {
  rules: { name: 'Die Regeln', short: '1–9 einmal pro Zeile, Spalte, Block', learn: 'Das 9×9-Gitter hat 9 Zeilen, 9 Spalten und 9 Blöcke aus 3×3 Feldern, getrennt durch dicke Linien.\nFülle es so, dass jede Zeile, Spalte und jeder Block die Zahlen 1 bis 9 genau einmal enthält. Die Vorgaben ändern sich nie.\nEin gutes Sudoku hat genau eine Lösung und ist ohne Raten lösbar.' },
  notes: { name: 'Kandidaten-Notizen', short: 'Notieren, was noch in ein Feld passt', learn: 'Bei schweren Rätseln notiert man klein die Zahlen, die noch in ein Feld passen (Kandidaten).\nEine Zahl, die schon in Zeile, Spalte oder Block steht, ist kein Kandidat. Bleibt einer übrig, ist er die Lösung.\n„Auto-Notizen“ schreibt alle auf einmal.' },
  fullHouse: { name: 'Letztes Feld', short: 'Nur noch ein leeres Feld in einer Einheit', learn: 'Hat eine Zeile, Spalte oder ein Block nur noch ein leeres Feld, gehört die fehlende Zahl dorthin.\nDie einfachste Technik, gegen Ende ständig gebraucht.', hint: '{unit} hat nur noch ein leeres Feld, {cell}. Die fehlende {d} gehört dorthin.' },
  hiddenSingle: { name: 'Versteckter Single', short: 'Nur ein Platz für eine Zahl', learn: 'Wähle eine Zahl und betrachte einen Block (oder eine Linie). Gibt es nur ein mögliches Feld, ist das ihr Platz.\nDie anderen sind blockiert, weil ihre Zeile oder Spalte die Zahl schon hat.', hint: 'In {unit} kann die {d} nur in {cell} stehen.' },
  nakedSingle: { name: 'Nackter Single', short: 'Nur eine Zahl passt ins Feld', learn: 'Wähle ein Feld und betrachte Zeile, Spalte und Block. Fehlt nur noch eine Zahl, ist sie die Lösung.\nMit Notizen sind das Felder mit genau einem Kandidaten.', hint: 'In {cell} passt nur die {d}: alle anderen stehen schon in Zeile, Spalte oder Block.' },
  pointing: { name: 'Zeigendes Paar', short: 'Kandidaten eines Blocks auf einer Linie', learn: 'Liegen in einem Block alle Kandidaten einer Zahl in einer Zeile (oder Spalte), steht die Zahl in diesem Abschnitt.\nIn den anderen Blöcken dieser Linie kann sie gestrichen werden.', hint: 'In {unit} kann die {d} nur auf {unit2} stehen. Streiche sie aus den anderen Feldern von {unit2} ({elims}).' },
  claiming: { name: 'Blockade', short: 'Kandidaten einer Linie in einem Block', learn: 'Umgekehrt: Liegen in einer Zeile (oder Spalte) alle Kandidaten einer Zahl in einem Block, steht diese Zahl des Blocks auf der Linie.\nStreiche sie im Rest des Blocks.', hint: 'In {unit} liegt die {d} nur in {unit2}. Streiche sie im Rest von {unit2} ({elims}).' },
  nakedPair: { name: 'Nacktes Paar', short: 'Zwei Felder mit denselben zwei Kandidaten', learn: 'Haben zwei Felder einer Einheit genau dieselben zwei Kandidaten, gehören diese Zahlen ihnen.\nStreiche sie in den übrigen Feldern der Einheit.', hint: '{cells} in {unit} haben nur {ds}. Streiche sie in den anderen Feldern ({elims}).' },
  hiddenPair: { name: 'Verstecktes Paar', short: 'Zwei Zahlen in denselben zwei Feldern', learn: 'Können zwei Zahlen nur in dieselben zwei Felder einer Einheit, gehören diese Felder ihnen.\nStreiche die übrigen Kandidaten dieser Felder.', hint: 'In {unit} passen {ds} nur in {cells}. Streiche die anderen Kandidaten dieser Felder.' },
  nakedTriple: { name: 'Nacktes Tripel', short: 'Drei Felder teilen drei Kandidaten', learn: 'Enthalten drei Felder einer Einheit zusammen nur drei Zahlen, gehören diese ihnen (nicht jedes Feld braucht alle drei).', hint: 'Zusammen haben {cells} in {unit} nur {ds}. Streiche sie in den anderen ({elims}).' },
  hiddenTriple: { name: 'Verstecktes Tripel', short: 'Drei Zahlen in denselben drei Feldern', learn: 'Passen drei Zahlen nur in dieselben drei Felder, streiche dort alle anderen Kandidaten.', hint: 'In {unit} passen {ds} nur in {cells}. Streiche die anderen Kandidaten.' },
  nakedQuad: { name: 'Nacktes Quartett', short: 'Vier Felder, vier Kandidaten', learn: 'Haben vier Felder zusammen nur vier Zahlen, streiche diese im Rest der Einheit.', hint: 'Zusammen haben {cells} in {unit} nur {ds}. Streiche sie in den anderen ({elims}).' },
  hiddenQuad: { name: 'Verstecktes Quartett', short: 'Vier Zahlen in vier Feldern', learn: 'Passen vier Zahlen nur in dieselben vier Felder, streiche dort alle anderen Kandidaten.', hint: 'In {unit} passen {ds} nur in {cells}. Streiche die anderen Kandidaten.' },
  xWing: { name: 'X-Wing', short: 'Ein Rechteck über zwei Linien', learn: 'Hat eine Zahl in zwei Zeilen jeweils nur zwei Plätze in denselben zwei Spalten, entsteht ein Rechteck.\nSie besetzt zwei gegenüberliegende Ecken – so oder so sind beide Spalten belegt. Streiche sie im Rest dieser Spalten.', hint: 'Die {d} liegt in {lines} nur auf {covers}. Diese Linien belegen die {d} von {covers}; streiche sie anderswo ({elims}).' },
  swordfish: { name: 'Schwertfisch', short: 'Ein X-Wing über drei Linien', learn: 'Ein erweiterter X-Wing: Passt eine Zahl in drei Zeilen nur in dieselben drei Spalten, streiche sie im Rest dieser Spalten.', hint: 'Die {d} liegt in {lines} nur auf {covers}. Streiche sie in den anderen Feldern von {covers} ({elims}).' },
  jellyfish: { name: 'Qualle', short: 'Ein X-Wing über vier Linien', learn: 'Der Vier-Linien-Fisch: Passt eine Zahl in vier Zeilen nur in dieselben vier Spalten, streiche sie im Rest.', hint: 'Die {d} liegt in {lines} nur auf {covers}. Streiche sie in den anderen Feldern von {covers} ({elims}).' },
  skyscraper: { name: 'Wolkenkratzer', short: 'Zwei Linien, an einem Ende verbunden', learn: 'Eine Zahl hat in zwei Zeilen je zwei Plätze; ein Ende liegt in derselben Spalte, die anderen sind versetzt – wie zwei Türme.\nEines der „Dächer“ ist die Zahl: streiche sie aus Feldern, die beide sehen.', hint: 'Die {d} hat in {unit} und {unit2} je zwei Plätze, an einem Ende verbunden. Eines der anderen Enden ({ends}) ist {d}: streiche sie aus Feldern, die beide sehen ({elims}).' },
  twoStringKite: { name: 'Drachen', short: 'Zeile und Spalte treffen sich im Block', learn: 'Eine Zahl hat zwei Plätze in einer Zeile und zwei in einer Spalte, je ein Ende im selben Block.\nEines der äußeren Enden ist die Zahl: streiche sie aus dem Feld, das beide sieht.', hint: 'Die {d} hat in {unit} und {unit2} je zwei Plätze, die sich in einem Block treffen. Eines der Enden ({ends}) ist {d}: streiche sie aus {elims}.' },
  xyWing: { name: 'XY-Wing', short: 'Ein Drehpunkt und zwei Zangen', learn: 'Drei Felder mit zwei Kandidaten: Drehpunkt {X,Y} und zwei Zangen, die er sieht, {X,Z} und {Y,Z}.\nWas der Drehpunkt auch ist, eine Zange ist Z. Streiche Z aus Feldern, die beide Zangen sehen.', hint: 'Drehpunkt {pivot} ({pm}), Zangen {w1} ({m1}) und {w2} ({m2}): eine Zange ist {d}. Streiche sie aus Feldern, die beide sehen ({elims}).' },
  xyzWing: { name: 'XYZ-Wing', short: 'Drehpunkt mit drei Kandidaten', learn: 'Wie der XY-Wing, aber der Drehpunkt hat {X,Y,Z}. Eines der drei Felder ist Z: streiche Z aus Feldern, die alle drei sehen.', hint: 'Eines von {pivot} ({pm}), {w1} ({m1}), {w2} ({m2}) ist {d}. Streiche sie aus Feldern, die alle drei sehen ({elims}).' },
  wWing: { name: 'W-Wing', short: 'Zwillingspaare mit starker Verbindung', learn: 'Zwei Felder, die sich nicht sehen, haben {X,Y}; eine starke Verbindung auf X verbindet Felder, die je eines davon sehen.\nBeide können nicht X sein, also ist eines Y: streiche Y aus Feldern, die beide sehen.', hint: '{a} und {b} haben {ab}, verbunden durch die starke Verbindung von {x} ({e}–{f}). Eines ist {d}: streiche sie aus Feldern, die beide sehen ({elims}).' },
  xyChain: { name: 'XY-Kette', short: 'Eine Kette aus Zwei-Kandidaten-Feldern', learn: 'Verbinde Felder mit zwei Kandidaten; Nachbarn sehen sich und teilen eine Zahl.\nIst das erste nicht Z, zwingt die Kette das letzte zu Z. Streiche Z aus Feldern, die beide Enden sehen.', hint: 'Kette {chain}: ist das erste Feld nicht {d}, ist es das letzte. Streiche {d} aus Feldern, die beide Enden sehen ({elims}).' },
  coloring: { name: 'Färbung', short: 'Starke Verbindungen zweifarbig färben', learn: 'Folge den Linien, in denen eine Zahl nur zwei Plätze hat, und färbe die Felder abwechselnd blau und orange. Eine Farbe ist wahr, die andere falsch.\nSehen sich zwei Felder gleicher Farbe, ist diese Farbe falsch. Ein Feld, das beide Farben sieht, kann die Zahl nicht sein.', hint: 'Färbt man die starken Verbindungen der {d}, ist eine Farbe wahr. Streiche {d} aus Feldern, die beide Farben sehen ({elims}).', hintWrap: 'Beim Färben der {d} sehen sich zwei gleichfarbige Felder. Diese Farbe ist falsch: streiche {d} aus ihren Feldern ({elims}).' },
  uniqueRect: { name: 'Eindeutiges Rechteck', short: 'Das Muster mit zwei Lösungen vermeiden', learn: 'Hätten vier Rechteckfelder über zwei Blöcke nur {X,Y}, könnte man X und Y tauschen – zwei Lösungen.\nSind also drei Ecken {X,Y} und die vierte hat mehr, ist die vierte weder X noch Y.', hint: 'Hätten {cells} nur {ds}, gäbe es zwei Lösungen. Also ist {cell} nicht {ds}: streiche sie aus {cell}.' },
  bug: { name: 'BUG+1', short: 'Nur ein Feld mit drei Kandidaten', learn: 'Haben alle leeren Felder zwei Kandidaten außer einem mit drei, muss dieses die „überzählige“ Zahl tragen: die, die dreimal in seiner Zeile (oder Spalte, Block) vorkommt.', hint: 'Alle Felder außer {cell} haben zwei Kandidaten. Wäre {cell} nicht {d}, gäbe es mehrere Lösungen: {cell} = {d}.' },
};
TX.pt.tech = {
  rules: { name: 'As regras', short: '1–9 uma vez em cada linha, coluna e quadrante', learn: 'A grade 9×9 tem 9 linhas, 9 colunas e 9 quadrantes 3×3 marcados por linhas grossas.\nPreencha para que cada linha, coluna e quadrante tenha de 1 a 9 exatamente uma vez. Os números iniciais (pistas) não mudam.\nUm bom sudoku tem uma só solução e se resolve com lógica, sem chutar.' },
  notes: { name: 'Notas de candidatos', short: 'Anote o que ainda cabe em cada casa', learn: 'Em grades difíceis, anote pequeno os números que ainda podem ir em cada casa (candidatos).\nUm número já presente na mesma linha, coluna ou quadrante não é candidato. Quando sobra um, é a resposta.\n"Notas auto" escreve todos de uma vez.' },
  fullHouse: { name: 'Última casa', short: 'Só resta uma casa vazia', learn: 'Se uma linha, coluna ou quadrante tem só uma casa vazia, o número que falta vai lá.\nA técnica mais simples, muito usada no final.', hint: '{unit} só tem vazia {cell}. O {d} que falta vai lá.' },
  hiddenSingle: { name: 'Single oculto', short: 'Um número com um só lugar', learn: 'Escolha um número e olhe um quadrante (ou linha). Se só há uma casa onde ele cabe, esse é o lugar.\nAs outras estão bloqueadas porque a linha ou coluna já tem esse número.', hint: 'Em {unit}, o {d} só pode ir em {cell}.' },
  nakedSingle: { name: 'Single nu', short: 'Só um número cabe na casa', learn: 'Escolha uma casa e olhe sua linha, coluna e quadrante. Se só falta um número, é a resposta.\nCom notas, são as casas com um único candidato.', hint: 'Só o {d} cabe em {cell}: os outros já estão na linha, coluna ou quadrante.' },
  pointing: { name: 'Apontamento', short: 'Candidatos de um quadrante numa linha', learn: 'Se num quadrante todos os candidatos de um número estão numa linha (ou coluna), o número ficará nesse trecho.\nRemova-o dessa linha nos outros quadrantes.', hint: 'Em {unit}, o {d} só pode ficar em {unit2}. Remova-o das outras casas de {unit2} ({elims}).' },
  claiming: { name: 'Reivindicação', short: 'Candidatos de uma linha num quadrante', learn: 'O inverso: se numa linha (ou coluna) todos os candidatos de um número estão num quadrante, esse número do quadrante está nesta linha.\nRemova-o do resto do quadrante.', hint: 'Em {unit}, o {d} só está dentro de {unit2}. Remova-o do resto de {unit2} ({elims}).' },
  nakedPair: { name: 'Par nu', short: 'Duas casas com os mesmos dois candidatos', learn: 'Se duas casas de um grupo têm exatamente os mesmos dois candidatos, esses números são delas.\nRemova-os das outras casas do grupo.', hint: '{cells} em {unit} só têm {ds}. Remova-os das outras casas ({elims}).' },
  hiddenPair: { name: 'Par oculto', short: 'Dois números nas mesmas duas casas', learn: 'Se dois números só cabem nas mesmas duas casas de um grupo, essas casas são deles.\nRemova os outros candidatos dessas casas.', hint: 'Em {unit}, {ds} só cabem em {cells}. Remova os outros candidatos dessas casas.' },
  nakedTriple: { name: 'Trio nu', short: 'Três casas dividem três candidatos', learn: 'Se três casas de um grupo juntas só têm três números, eles são delas (cada casa não precisa ter os três).', hint: 'Juntas, {cells} em {unit} só têm {ds}. Remova-os das outras ({elims}).' },
  hiddenTriple: { name: 'Trio oculto', short: 'Três números nas mesmas três casas', learn: 'Se três números só cabem nas mesmas três casas, remova os outros candidatos delas.', hint: 'Em {unit}, {ds} só cabem em {cells}. Remova os outros candidatos.' },
  nakedQuad: { name: 'Quarteto nu', short: 'Quatro casas, quatro candidatos', learn: 'Se quatro casas juntas só têm quatro números, remova-os do resto do grupo.', hint: 'Juntas, {cells} em {unit} só têm {ds}. Remova-os das outras ({elims}).' },
  hiddenQuad: { name: 'Quarteto oculto', short: 'Quatro números em quatro casas', learn: 'Se quatro números só cabem nas mesmas quatro casas, remova os outros candidatos delas.', hint: 'Em {unit}, {ds} só cabem em {cells}. Remova os outros candidatos.' },
  xWing: { name: 'X-Wing', short: 'Um retângulo em duas linhas', learn: 'Se um número só cabe em dois lugares em cada uma de duas linhas, nas mesmas duas colunas, forma-se um retângulo.\nEle ocupa dois cantos opostos: de qualquer jeito cobre as duas colunas. Remova-o do resto dessas colunas.', hint: 'O {d} em {lines} só está em {covers}. Essas linhas ocupam o {d} de {covers}; remova-o das outras ({elims}).' },
  swordfish: { name: 'Peixe-espada', short: 'X-Wing em três linhas', learn: 'Um X-Wing ampliado: se um número em três linhas só cabe nas mesmas três colunas, remova-o do resto dessas colunas.', hint: 'O {d} em {lines} só está em {covers}. Remova-o das outras casas de {covers} ({elims}).' },
  jellyfish: { name: 'Água-viva', short: 'X-Wing em quatro linhas', learn: 'O peixe de quatro linhas: se um número em quatro linhas só cabe nas mesmas quatro colunas, remova-o do resto.', hint: 'O {d} em {lines} só está em {covers}. Remova-o das outras casas de {covers} ({elims}).' },
  skyscraper: { name: 'Arranha-céu', short: 'Duas linhas unidas por uma ponta', learn: 'Um número tem dois lugares em cada uma de duas linhas; uma ponta coincide na coluna e as outras não, como duas torres.\nUm dos "telhados" será o número: remova-o das casas que veem os dois.', hint: 'O {d} tem dois lugares em {unit} e {unit2}, unidos por uma ponta. Uma das outras pontas ({ends}) é {d}: remova-o das casas que veem as duas ({elims}).' },
  twoStringKite: { name: 'Pipa', short: 'Linha e coluna se encontram num quadrante', learn: 'Um número tem dois lugares numa linha e dois numa coluna, com uma ponta de cada no mesmo quadrante.\nUma das pontas externas é o número: remova-o da casa que vê as duas.', hint: 'O {d} tem dois lugares em {unit} e {unit2}, que se encontram num quadrante. Uma das pontas ({ends}) é {d}: remova-o de {elims}.' },
  xyWing: { name: 'XY-Wing', short: 'Um pivô e duas pinças', learn: 'Três casas de dois candidatos: pivô {X,Y} e duas pinças que ele vê, {X,Z} e {Y,Z}.\nSeja qual for o pivô, uma pinça é Z. Remova Z das casas que veem as duas pinças.', hint: 'Pivô {pivot} ({pm}), pinças {w1} ({m1}) e {w2} ({m2}): uma pinça é {d}. Remova-o das casas que veem as duas ({elims}).' },
  xyzWing: { name: 'XYZ-Wing', short: 'Pivô com três candidatos', learn: 'Como o XY-Wing, mas o pivô tem {X,Y,Z}. Uma das três casas é Z: remova Z das casas que veem as três.', hint: 'Uma de {pivot} ({pm}), {w1} ({m1}), {w2} ({m2}) é {d}. Remova-o das casas que veem as três ({elims}).' },
  wWing: { name: 'W-Wing', short: 'Pares gêmeos ligados por elo forte', learn: 'Duas casas que não se veem têm {X,Y}, e um elo forte de X liga casas que veem cada uma.\nNão podem ser ambas X, então uma é Y: remova Y das casas que veem as duas.', hint: '{a} e {b} têm {ab}, ligadas pelo elo forte de {x} ({e}–{f}). Uma delas é {d}: remova-o das casas que veem ambas ({elims}).' },
  xyChain: { name: 'Cadeia XY', short: 'Uma cadeia de casas de dois candidatos', learn: 'Ligue casas de dois candidatos; vizinhas se veem e dividem um número.\nSe a primeira não é Z, a cadeia força a última a ser Z. Remova Z das casas que veem as duas pontas.', hint: 'Cadeia {chain}: se a primeira não é {d}, a última é. Remova {d} das casas que veem as duas pontas ({elims}).' },
  coloring: { name: 'Coloração', short: 'Pinte os elos fortes com duas cores', learn: 'Siga as linhas onde um número tem só dois lugares e pinte as casas alternando azul e laranja. Uma cor é verdadeira, a outra falsa.\nSe duas casas da mesma cor se veem, essa cor é falsa. Uma casa que vê as duas cores não pode ser o número.', hint: 'Pintando os elos fortes do {d}, uma cor é verdadeira. Remova {d} das casas que veem as duas cores ({elims}).', hintWrap: 'Pintando o {d}, duas casas da mesma cor se veem. Essa cor é falsa: remova {d} dessas casas ({elims}).' },
  uniqueRect: { name: 'Retângulo único', short: 'Evite o padrão de duas soluções', learn: 'Se quatro cantos de um retângulo em dois quadrantes tivessem só {X,Y}, daria para trocar X e Y: duas soluções.\nEntão se três cantos são {X,Y} e o quarto tem mais, o quarto não é X nem Y.', hint: 'Se {cells} tivessem só {ds}, haveria duas soluções. Então {cell} não é {ds}: remova-os de {cell}.' },
  bug: { name: 'BUG+1', short: 'Só uma casa com três candidatos', learn: 'Se todas as casas vazias têm dois candidatos exceto uma com três, ela leva o número "extra": o que aparece três vezes na sua linha (ou coluna, quadrante).', hint: 'Todas as casas exceto {cell} têm dois candidatos. Se {cell} não fosse {d}, haveria várias soluções: {cell} = {d}.' },
};
TX.ru.tech = {
  rules: { name: 'Правила', short: '1–9 по разу в строке, столбце, блоке', learn: 'Поле 9×9 состоит из 9 строк, 9 столбцов и 9 блоков 3×3, отделённых жирными линиями.\nЗаполните его так, чтобы в каждой строке, столбце и блоке цифры от 1 до 9 встречались ровно по разу. Начальные цифры (подсказки) не меняются.\nУ хорошего судоку одно решение, и оно находится логикой, без угадывания.' },
  notes: { name: 'Заметки-кандидаты', short: 'Записывать, что ещё может стоять в клетке', learn: 'В трудных задачах мелко записывают цифры, которые ещё могут стоять в клетке (кандидаты).\nЦифра, уже стоящая в той же строке, столбце или блоке, — не кандидат. Когда остаётся одна, это ответ.\n«Автозаметки» записывают всё сразу.' },
  fullHouse: { name: 'Последняя клетка', short: 'В группе осталась одна пустая клетка', learn: 'Если в строке, столбце или блоке осталась одна пустая клетка, недостающая цифра идёт туда.\nСамый простой приём, очень частый в конце.', hint: 'В группе «{unit}» пуста только {cell}. Туда идёт недостающая {d}.' },
  hiddenSingle: { name: 'Скрытая одиночка', short: 'У цифры одно место', learn: 'Выберите цифру и посмотрите на блок (или линию). Если для неё есть только одна клетка, это её место.\nОстальные заблокированы: в их строке или столбце эта цифра уже есть.', hint: 'В группе «{unit}» цифра {d} может стоять только в {cell}.' },
  nakedSingle: { name: 'Голая одиночка', short: 'В клетку подходит одна цифра', learn: 'Выберите клетку и посмотрите на её строку, столбец и блок. Если не хватает только одной цифры, это ответ.\nС заметками это клетки с единственным кандидатом.', hint: 'В {cell} подходит только {d}: остальные цифры уже есть в строке, столбце или блоке.' },
  pointing: { name: 'Указывающая пара', short: 'Кандидаты блока на одной линии', learn: 'Если в блоке все кандидаты цифры лежат в одной строке (или столбце), цифра встанет на этот отрезок.\nЕё можно убрать с этой линии в других блоках.', hint: 'В группе «{unit}» цифра {d} может быть только на линии «{unit2}». Уберите её из других клеток ({elims}).' },
  claiming: { name: 'Захват', short: 'Кандидаты линии в одном блоке', learn: 'Обратный приём: если в строке (или столбце) все кандидаты цифры лежат в одном блоке, эта цифра блока стоит на этой линии.\nУберите её из остальных клеток блока.', hint: 'В группе «{unit}» цифра {d} есть только внутри «{unit2}». Уберите её из остальных клеток ({elims}).' },
  nakedPair: { name: 'Голая пара', short: 'Две клетки с одними и теми же двумя кандидатами', learn: 'Если у двух клеток группы ровно одни и те же два кандидата, эти цифры принадлежат им.\nУберите их из остальных клеток группы.', hint: 'У {cells} в группе «{unit}» только {ds}. Уберите их из других клеток ({elims}).' },
  hiddenPair: { name: 'Скрытая пара', short: 'Две цифры только в двух клетках', learn: 'Если две цифры могут стоять только в одних и тех же двух клетках группы, эти клетки за ними.\nУберите остальных кандидатов из этих клеток.', hint: 'В группе «{unit}» {ds} могут стоять только в {cells}. Уберите из них других кандидатов.' },
  nakedTriple: { name: 'Голая тройка', short: 'Три клетки делят три кандидата', learn: 'Если у трёх клеток группы вместе только три цифры, они принадлежат этим клеткам (каждой не обязательно иметь все три).', hint: 'Вместе у {cells} в группе «{unit}» только {ds}. Уберите их из других ({elims}).' },
  hiddenTriple: { name: 'Скрытая тройка', short: 'Три цифры только в трёх клетках', learn: 'Если три цифры могут стоять только в одних и тех же трёх клетках, уберите оттуда остальных кандидатов.', hint: 'В группе «{unit}» {ds} могут стоять только в {cells}. Уберите других кандидатов.' },
  nakedQuad: { name: 'Голая четвёрка', short: 'Четыре клетки, четыре кандидата', learn: 'Если у четырёх клеток вместе только четыре цифры, уберите их из остальной группы.', hint: 'Вместе у {cells} в группе «{unit}» только {ds}. Уберите их из других ({elims}).' },
  hiddenQuad: { name: 'Скрытая четвёрка', short: 'Четыре цифры в четырёх клетках', learn: 'Если четыре цифры помещаются только в одни и те же четыре клетки, уберите оттуда остальных кандидатов.', hint: 'В группе «{unit}» {ds} могут стоять только в {cells}. Уберите других кандидатов.' },
  xWing: { name: 'X-Wing', short: 'Прямоугольник на двух линиях', learn: 'Если у цифры в двух строках ровно по два места в одних и тех же двух столбцах, получается прямоугольник.\nЦифра займёт два противоположных угла — в любом случае оба столбца заняты. Уберите её из остальных клеток этих столбцов.', hint: 'Цифра {d} в линиях {lines} лежит только на {covers}. Эти линии займут её в {covers}; уберите её из других клеток ({elims}).' },
  swordfish: { name: 'Рыба-меч', short: 'X-Wing на трёх линиях', learn: 'Расширенный X-Wing: если цифра в трёх строках помещается только в те же три столбца, уберите её из остальных клеток этих столбцов.', hint: 'Цифра {d} в линиях {lines} лежит только на {covers}. Уберите её из других клеток ({elims}).' },
  jellyfish: { name: 'Медуза', short: 'X-Wing на четырёх линиях', learn: 'Рыба из четырёх линий: если цифра в четырёх строках помещается только в те же четыре столбца, уберите её из остальных.', hint: 'Цифра {d} в линиях {lines} лежит только на {covers}. Уберите её из других клеток ({elims}).' },
  skyscraper: { name: 'Небоскрёб', short: 'Две линии, связанные одним концом', learn: 'У цифры по два места в двух строках; один конец в общем столбце, другие смещены — как две башни.\nОдна из «крыш» будет этой цифрой: уберите её из клеток, видящих обе.', hint: 'У {d} по два места в «{unit}» и «{unit2}», связанных одним концом. Один из других концов ({ends}) — {d}: уберите её из клеток, видящих оба ({elims}).' },
  twoStringKite: { name: 'Воздушный змей', short: 'Строка и столбец встречаются в блоке', learn: 'У цифры два места в строке и два в столбце, по одному концу в одном блоке.\nОдин из внешних концов — эта цифра: уберите её из клетки, видящей оба.', hint: 'У {d} по два места в «{unit}» и «{unit2}», встречающихся в блоке. Один из концов ({ends}) — {d}: уберите её из {elims}.' },
  xyWing: { name: 'XY-Wing', short: 'Опора и две клешни', learn: 'Три клетки с двумя кандидатами: опора {X,Y} и две видимые ей клешни {X,Z} и {Y,Z}.\nЧем бы ни была опора, одна клешня — Z. Уберите Z из клеток, видящих обе клешни.', hint: 'Опора {pivot} ({pm}), клешни {w1} ({m1}) и {w2} ({m2}): одна клешня — {d}. Уберите её из клеток, видящих обе ({elims}).' },
  xyzWing: { name: 'XYZ-Wing', short: 'Опора с тремя кандидатами', learn: 'Как XY-Wing, но у опоры {X,Y,Z}. Одна из трёх клеток — Z: уберите Z из клеток, видящих все три.', hint: 'Одна из {pivot} ({pm}), {w1} ({m1}), {w2} ({m2}) — {d}. Уберите её из клеток, видящих все три ({elims}).' },
  wWing: { name: 'W-Wing', short: 'Пары-близнецы с сильной связью', learn: 'Две не видящие друг друга клетки содержат {X,Y}, а сильная связь по X соединяет клетки, видящие каждую из них.\nОбе не могут быть X, значит одна — Y: уберите Y из клеток, видящих обе.', hint: '{a} и {b} содержат {ab} и связаны сильной связью по {x} ({e}–{f}). Одна из них — {d}: уберите её из клеток, видящих обе ({elims}).' },
  xyChain: { name: 'XY-цепочка', short: 'Цепочка клеток с двумя кандидатами', learn: 'Соедините клетки с двумя кандидатами; соседние видят друг друга и делят цифру.\nЕсли первая не Z, цепочка заставит последнюю быть Z. Уберите Z из клеток, видящих оба конца.', hint: 'Цепочка {chain}: если первая клетка не {d}, ею будет последняя. Уберите {d} из клеток, видящих оба конца ({elims}).' },
  coloring: { name: 'Раскраска', short: 'Раскрасить сильные связи в два цвета', learn: 'Идите по линиям, где у цифры только два места, и красьте клетки попеременно синим и оранжевым. Один цвет истинен, другой ложен.\nЕсли две клетки одного цвета видят друг друга, этот цвет ложен. Клетка, видящая оба цвета, не может быть этой цифрой.', hint: 'Раскрасив сильные связи {d}, один цвет истинен. Уберите {d} из клеток, видящих оба цвета ({elims}).', hintWrap: 'При раскраске {d} две клетки одного цвета видят друг друга. Этот цвет ложен: уберите {d} из его клеток ({elims}).' },
  uniqueRect: { name: 'Уникальный прямоугольник', short: 'Избегать узора с двумя решениями', learn: 'Если бы четыре угла прямоугольника в двух блоках содержали только {X,Y}, X и Y можно было бы поменять — два решения.\nПоэтому если три угла {X,Y}, а в четвёртом есть ещё кандидаты, четвёртый не X и не Y.', hint: 'Если бы у {cells} были только {ds}, решений было бы два. Значит {cell} не {ds}: уберите их из {cell}.' },
  bug: { name: 'BUG+1', short: 'Лишь одна клетка с тремя кандидатами', learn: 'Если у всех пустых клеток по два кандидата, кроме одной с тремя, в ней стоит «лишняя» цифра — та, что трижды встречается в её строке (или столбце, блоке).', hint: 'У всех клеток, кроме {cell}, по два кандидата. Если бы {cell} не была {d}, решений было бы несколько: {cell} = {d}.' },
};
TX.vi.tech = {
  rules: { name: 'Luật chơi', short: '1–9 một lần mỗi hàng, cột, khối', learn: 'Bàn 9×9 gồm 9 hàng, 9 cột và 9 khối 3×3 chia bởi nét đậm.\nĐiền sao cho mỗi hàng, cột và khối có đủ các số 1 đến 9, mỗi số đúng một lần. Các số cho sẵn không thay đổi.\nSudoku tốt chỉ có một đáp án và giải được bằng logic, không cần đoán.' },
  notes: { name: 'Ghi chú ứng viên', short: 'Ghi những số còn có thể điền', learn: 'Ở bàn khó, ghi nhỏ các số còn có thể điền vào mỗi ô (ứng viên).\nSố đã có trong cùng hàng, cột hoặc khối thì không phải ứng viên. Khi chỉ còn một, đó là đáp án.\n"Tự ghi" sẽ ghi tất cả cùng lúc.' },
  fullHouse: { name: 'Ô cuối cùng', short: 'Chỉ còn một ô trống', learn: 'Khi một hàng, cột hoặc khối chỉ còn một ô trống, số còn thiếu điền vào đó.\nKỹ thuật đơn giản nhất, dùng rất nhiều cuối ván.', hint: '{unit} chỉ còn trống {cell}. Số {d} còn thiếu điền vào đó.' },
  hiddenSingle: { name: 'Đơn ẩn', short: 'Một số chỉ có một chỗ', learn: 'Chọn một số và xem một khối (hoặc hàng, cột). Nếu chỉ có một ô số đó có thể vào, đó là chỗ của nó.\nCác ô khác bị chặn vì hàng hoặc cột đã có số đó.', hint: 'Trong {unit}, số {d} chỉ có thể ở {cell}.' },
  nakedSingle: { name: 'Đơn lộ', short: 'Ô chỉ điền được một số', learn: 'Chọn một ô và xem hàng, cột, khối của nó. Nếu chỉ thiếu một số, đó là đáp án.\nKhi có ghi chú, đó là ô chỉ có một ứng viên.', hint: '{cell} chỉ điền được {d}: các số khác đã có trong hàng, cột hoặc khối.' },
  pointing: { name: 'Chỉ hướng', short: 'Ứng viên trong khối nằm trên một đường', learn: 'Nếu trong một khối, mọi ứng viên của một số nằm trên cùng một hàng (hoặc cột), số đó sẽ ở đoạn ấy.\nCó thể loại nó khỏi đường đó ở các khối khác.', hint: 'Trong {unit}, số {d} chỉ nằm trên {unit2}. Loại {d} khỏi các ô khác của {unit2} ({elims}).' },
  claiming: { name: 'Chiếm khối', short: 'Ứng viên của đường nằm trong một khối', learn: 'Ngược với chỉ hướng: nếu trong một hàng (hoặc cột), mọi ứng viên của một số nằm trong một khối, số đó của khối nằm trên đường này.\nLoại nó khỏi phần còn lại của khối.', hint: 'Trong {unit}, số {d} chỉ nằm trong {unit2}. Loại {d} khỏi phần còn lại của {unit2} ({elims}).' },
  nakedPair: { name: 'Cặp lộ', short: 'Hai ô có cùng hai ứng viên', learn: 'Nếu hai ô trong một nhóm có đúng cùng hai ứng viên, hai số đó thuộc về hai ô này.\nLoại chúng khỏi các ô khác của nhóm.', hint: '{cells} trong {unit} chỉ có {ds}. Loại chúng khỏi các ô khác ({elims}).' },
  hiddenPair: { name: 'Cặp ẩn', short: 'Hai số chỉ ở cùng hai ô', learn: 'Nếu hai số chỉ có thể ở cùng hai ô trong một nhóm, hai ô đó thuộc về hai số này.\nLoại các ứng viên khác khỏi hai ô đó.', hint: 'Trong {unit}, {ds} chỉ có thể ở {cells}. Loại các ứng viên khác khỏi các ô này.' },
  nakedTriple: { name: 'Bộ ba lộ', short: 'Ba ô chia nhau ba ứng viên', learn: 'Nếu ba ô trong một nhóm gộp lại chỉ có ba số, các số đó thuộc về chúng (mỗi ô không cần đủ cả ba).', hint: 'Gộp lại, {cells} trong {unit} chỉ có {ds}. Loại chúng khỏi các ô khác ({elims}).' },
  hiddenTriple: { name: 'Bộ ba ẩn', short: 'Ba số chỉ ở cùng ba ô', learn: 'Nếu ba số chỉ có thể ở cùng ba ô, loại các ứng viên khác khỏi các ô đó.', hint: 'Trong {unit}, {ds} chỉ có thể ở {cells}. Loại các ứng viên khác.' },
  nakedQuad: { name: 'Bộ bốn lộ', short: 'Bốn ô, bốn ứng viên', learn: 'Nếu bốn ô gộp lại chỉ có bốn số, loại chúng khỏi phần còn lại của nhóm.', hint: 'Gộp lại, {cells} trong {unit} chỉ có {ds}. Loại chúng khỏi các ô khác ({elims}).' },
  hiddenQuad: { name: 'Bộ bốn ẩn', short: 'Bốn số trong bốn ô', learn: 'Nếu bốn số chỉ vào được cùng bốn ô, loại các ứng viên khác khỏi các ô đó.', hint: 'Trong {unit}, {ds} chỉ có thể ở {cells}. Loại các ứng viên khác.' },
  xWing: { name: 'X-Wing', short: 'Hình chữ nhật trên hai đường', learn: 'Nếu một số chỉ có hai chỗ trong mỗi hàng của hai hàng, và cùng nằm trên hai cột, chúng tạo thành hình chữ nhật.\nSố đó chiếm hai góc đối nhau — dù thế nào cũng phủ cả hai cột. Loại nó khỏi phần còn lại của hai cột.', hint: 'Số {d} trong {lines} chỉ nằm trên {covers}. Các đường này chiếm số {d} của {covers}; loại nó khỏi các ô khác ({elims}).' },
  swordfish: { name: 'Cá kiếm', short: 'X-Wing trên ba đường', learn: 'X-Wing mở rộng: nếu một số trong ba hàng chỉ nằm trong cùng ba cột, loại nó khỏi phần còn lại của các cột đó.', hint: 'Số {d} trong {lines} chỉ nằm trên {covers}. Loại nó khỏi các ô khác của {covers} ({elims}).' },
  jellyfish: { name: 'Sứa', short: 'X-Wing trên bốn đường', learn: 'Con cá bốn đường: nếu một số trong bốn hàng chỉ nằm trong cùng bốn cột, loại nó khỏi phần còn lại.', hint: 'Số {d} trong {lines} chỉ nằm trên {covers}. Loại nó khỏi các ô khác của {covers} ({elims}).' },
  skyscraper: { name: 'Nhà chọc trời', short: 'Hai đường nối ở một đầu', learn: 'Một số có hai chỗ trong mỗi hàng của hai hàng; một đầu cùng cột, đầu kia lệch nhau — như hai tòa nhà.\nMột trong hai "mái" sẽ là số đó: loại nó khỏi các ô nhìn thấy cả hai.', hint: 'Số {d} có hai chỗ trong {unit} và {unit2}, nối ở một đầu. Một trong hai đầu kia ({ends}) là {d}: loại nó khỏi các ô thấy cả hai ({elims}).' },
  twoStringKite: { name: 'Cánh diều', short: 'Hàng và cột gặp nhau trong khối', learn: 'Một số có hai chỗ trong một hàng và hai chỗ trong một cột, mỗi đường có một đầu trong cùng khối.\nMột trong hai đầu ngoài là số đó: loại nó khỏi ô thấy cả hai.', hint: 'Số {d} có hai chỗ trong {unit} và {unit2}, gặp nhau trong một khối. Một trong hai đầu ({ends}) là {d}: loại nó khỏi {elims}.' },
