<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title id="pageTitle">스도쿠</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:root, [data-theme="night"] {
  --bg: radial-gradient(120% 90% at 50% 0%, #22204a 0%, #12112a 55%, #0d0d1a 100%); --ink: #eceaff; --sub: #9a98c4; --dim: #6d6a99;
  --line: #5a50b8; --thin: #2c2a52; --cell: #17162f; --cellAlt: #1b1a37; --given: #f4f2ff; --user: #a996ff; --acc: #7c5cfc; --acc2: #b39bff; --accInk: #fff;
  --sel: #4a3cae; --peer: #221f45; --same: #3b2f8a; --wrong: #ff5c7a; --wrongBg: #4a1530; --note: #a7a4d6; --noteHi: #ffd36e; --ok: #6fe3a8;
  --hl: rgba(255, 211, 110, .12); --hp: #2f5d4c; --he: #5a2440; --card: linear-gradient(160deg, rgba(34, 32, 72, .95), rgba(14, 13, 32, .97)); --cardLine: rgba(170, 160, 255, .2);
  --btn: rgba(255, 255, 255, .06); --btnLine: rgba(170, 160, 255, .2); --shadow: 0 24px 60px -24px rgba(0, 0, 0, .9);
}
[data-theme="paper"] {
  --bg: radial-gradient(120% 90% at 50% 0%, #fbf7ee 0%, #f1ead9 60%, #e6dcc4 100%); --ink: #2b2620; --sub: #6f6555; --dim: #9a8f7c;
  --line: #3b342a; --thin: #c9bfa9; --cell: #fffdf7; --cellAlt: #fbf6ea; --given: #1f1a14; --user: #2f5fc4; --acc: #2f5fc4; --acc2: #2f5fc4; --accInk: #fff;
  --sel: #bcd2ff; --peer: #efe7d3; --same: #d6e2ff; --wrong: #d02c3c; --wrongBg: #ffd9d6; --note: #7d7262; --noteHi: #c0560f; --ok: #1f9a5b;
  --hl: rgba(255, 196, 0, .16); --hp: #cdeedd; --he: #ffd6dc; --card: linear-gradient(160deg, #fffdf7, #f4ecdc); --cardLine: rgba(80, 60, 30, .2);
  --btn: rgba(60, 40, 10, .06); --btnLine: rgba(80, 60, 30, .22); --shadow: 0 20px 50px -24px rgba(80, 60, 30, .5);
}
[data-theme="ink"] {
  --bg: #000; --ink: #fff; --sub: #a8a8a8; --dim: #777;
  --line: #e6e6e6; --thin: #3a3a3a; --cell: #050505; --cellAlt: #0b0b0b; --given: #fff; --user: #5fd3ff; --acc: #5fd3ff; --acc2: #5fd3ff; --accInk: #001a24;
  --sel: #0f4a63; --peer: #141414; --same: #123446; --wrong: #ff4d4d; --wrongBg: #3d0b0b; --note: #b5b5b5; --noteHi: #ffe14d; --ok: #59e08f;
  --hl: rgba(255, 225, 77, .12); --hp: #12402a; --he: #4a0f1f; --card: #0c0c0c; --cardLine: #3a3a3a;
  --btn: #121212; --btnLine: #3a3a3a; --shadow: none;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); background-color: #0d0d1a; color: var(--ink); font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Hiragino Sans', 'Yu Gothic UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK KR', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; outline: none; transition: background .3s; }
[data-theme="paper"] body { background-color: #f1ead9; } [data-theme="ink"] body { background-color: #000; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
.top { width: var(--bw); display: flex; align-items: center; gap: 8px; }
.top .wl { height: 24px; width: auto; flex: none; display: block; margin-left: 2px; }
.top .ttl { font-weight: 900; font-size: 18px; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .ttl small { font-weight: 700; font-size: 12.5px; color: var(--sub); margin-left: 6px; }
#timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 16px; color: var(--sub); min-width: 52px; text-align: right; }
.ib { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--btnLine); background: var(--btn); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
.ib svg { width: 18px; height: 18px; }
.bar { width: var(--bw); display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--sub); font-weight: 700; min-height: 18px; }
.bar .prog { flex: 1; height: 5px; border-radius: 3px; background: var(--thin); overflow: hidden; }
.bar .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); border-radius: 3px; transition: width .4s; }
.bar b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar .bad b { color: var(--wrong); }
.main { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.app.wide .main { flex-direction: row; align-items: stretch; gap: 22px; }
.bwrap { position: relative; }
.side { width: var(--sw); display: flex; flex-direction: column; gap: 10px; justify-content: center; }

/* ── 판 */
.board { width: var(--bs); height: var(--bs); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: calc(var(--bs) * .006 + 1px); padding: calc(var(--bs) * .006 + 1px); background: var(--line); border-radius: calc(var(--bs) * .025); box-shadow: var(--shadow); touch-action: none; }
.box { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1px; background: var(--thin); overflow: hidden; }
.box:nth-child(1) { border-top-left-radius: calc(var(--bs) * .019); } .box:nth-child(3) { border-top-right-radius: calc(var(--bs) * .019); }
.box:nth-child(7) { border-bottom-left-radius: calc(var(--bs) * .019); } .box:nth-child(9) { border-bottom-right-radius: calc(var(--bs) * .019); }
.cell { position: relative; background: var(--cell); display: grid; place-items: center; cursor: pointer; transition: background-color .12s; }
.box:nth-child(even) .cell { background: var(--cellAlt); }
.cell .v { font-size: calc(var(--bs) * .062); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: var(--user); position: relative; z-index: 1; }
.cell.given .v { color: var(--given); font-weight: 800; }
.cell .n { position: absolute; inset: 6%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
.cell .n span { display: grid; place-items: center; font-size: calc(var(--bs) * .026); font-weight: 700; color: var(--note); line-height: 1; border-radius: 30%; }
.cell .n span.hi { color: var(--noteHi); }
.cell .n span.pat { background: var(--hp); color: var(--ink); }
.cell .n span.x { background: var(--he); color: var(--wrong); text-decoration: line-through; }
.cell .n span.cA { background: #2a62c9; color: #fff; } .cell .n span.cB { background: #c9762a; color: #fff; }
.cell.peer, .box:nth-child(even) .cell.peer { background: var(--peer); }
.cell.same, .box:nth-child(even) .cell.same { background: var(--same); }
.cell.sel, .box:nth-child(even) .cell.sel { background: var(--sel); }
.cell.hl, .box:nth-child(even) .cell.hl { box-shadow: inset 0 0 0 999px var(--hl); }
.cell.hp, .box:nth-child(even) .cell.hp { background: var(--hp); }
.cell.he, .box:nth-child(even) .cell.he { background: var(--he); }
.cell.wrong .v { color: var(--wrong); } .cell.wrong, .box:nth-child(even) .cell.wrong { background: var(--wrongBg); }
.cell.ghost .v { color: var(--ok); opacity: .9; }
.cell.sel::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--acc2); pointer-events: none; z-index: 2; }
.cell.pop .v { animation: pop .28s ease-out both; animation-delay: var(--dl, 0s); }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.cell.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.cell.flash::before { content: ''; position: absolute; inset: 0; background: var(--acc2); opacity: 0; animation: flash .7s ease-out both; animation-delay: var(--dl, 0s); pointer-events: none; }
@keyframes flash { 0% { opacity: 0; } 30% { opacity: .45; } 100% { opacity: 0; } }
.cell.wave .v { animation: wave .9s ease-in-out both; animation-delay: var(--dl, 0s); }
@keyframes wave { 0% { transform: none; } 35% { transform: translateY(-22%) scale(1.25); color: var(--noteHi); } 100% { transform: none; } }
.cover { position: absolute; inset: 0; border-radius: calc(var(--bs) * .025); background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 3; }
.cover b { font-size: 22px; }

/* ── 숫자판 · 도구 */
.tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.app.wide .tools { grid-template-columns: repeat(3, 1fr); } .app.wide .tool { flex-direction: row; justify-content: center; gap: 6px; padding: 9px 4px; font-size: 13px; border-color: var(--btnLine); background: var(--btn); } .app.wide .tool svg { width: 20px; height: 20px; } .app.wide .tool .badge { top: -6px; right: 4px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 6px; font: inherit; font-size: 11.5px; font-weight: 700; color: var(--sub); background: none; border: 1px solid transparent; border-radius: 12px; cursor: pointer; position: relative; min-width: 0; }
.tool span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tool svg { width: 24px; height: 24px; color: var(--ink); }
.tool:hover { background: var(--btn); } .tool:disabled { opacity: .35; cursor: default; background: none; }
.tool.on { background: var(--btn); border-color: var(--acc); color: var(--acc2); } .tool.on svg { color: var(--acc2); }
.tool .badge { position: absolute; top: 2px; right: calc(50% - 22px); font-size: 9.5px; font-weight: 900; background: var(--acc); color: var(--accInk); border-radius: 8px; padding: 1px 5px; }
.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.app.wide .pad { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { position: relative; font: inherit; border-radius: 12px; border: 1px solid var(--btnLine); background: var(--btn); color: var(--user); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0 4px; min-height: 56px; }
.app.wide .key { min-height: 0; aspect-ratio: 1.25; }
.key b { font-size: 26px; font-weight: 600; line-height: 1; }
.app.wide .key b { font-size: 34px; }
.key small { font-size: 10.5px; color: var(--dim); font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.key:hover { filter: brightness(1.15); }
.key.done { opacity: .28; }
.key.act { background: var(--acc); color: var(--accInk); border-color: transparent; } .key.act small { color: var(--accInk); opacity: .8; }
.pad.notes .key b { font-size: 19px; color: var(--note); } .app.wide .pad.notes .key b { font-size: 24px; }
.key.glow { animation: kglow .9s ease-out; }
@keyframes kglow { 0% { box-shadow: 0 0 0 0 var(--acc2); } 50% { box-shadow: 0 0 0 6px transparent; transform: scale(1.06); } }
.editbar { display: flex; flex-direction: column; gap: 8px; }
.editbar p { font-size: 13px; color: var(--sub); line-height: 1.45; text-align: center; }

/* ── 힌트 상자 */
.hintbox { border: 1px solid var(--acc); background: var(--card); border-radius: 16px; padding: 14px 14px 12px; box-shadow: var(--shadow); }
.hintbox h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; } .hintbox h3 small { margin-left: auto; font-size: 11.5px; color: var(--sub); font-weight: 700; }
.hintbox .lvdot { font-size: 10.5px; padding: 2px 7px; border-radius: 8px; background: var(--acc); color: var(--accInk); font-weight: 800; white-space: nowrap; }
.hintbox p { font-size: 13.5px; line-height: 1.55; margin-top: 8px; color: var(--ink); }
.hintbox .foot { margin-top: 10px; }

/* ── 공통 카드 */
.btn { flex: 1 1 auto; padding: 10px 12px; font: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; border: 1px solid var(--btnLine); background: var(--btn); color: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.12); } .btn:disabled { opacity: .35; cursor: default; filter: none; }
.btn.primary { background: linear-gradient(160deg, var(--acc2), var(--acc)); border-color: transparent; color: var(--accInk); box-shadow: 0 8px 20px -10px var(--acc); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.btn.small { flex: 0 0 auto; padding: 6px 10px; font-size: 12.5px; }
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; background: rgba(5, 5, 16, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
[data-theme="paper"] .ov { background: rgba(80, 60, 30, .25); }
.pcard { background: var(--card); border: 1px solid var(--cardLine); border-radius: 22px; padding: 22px 22px 18px; width: min(440px, 100%); max-height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; box-shadow: var(--shadow); }
.pcard::-webkit-scrollbar { display: none; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 4px; }
.logo b { font-size: clamp(30px, 8vw, 42px); font-weight: 900; white-space: nowrap; background: linear-gradient(90deg, var(--acc2), var(--acc)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { text-align: center; color: var(--sub); font-size: 12.5px; letter-spacing: .08em; margin-bottom: 12px; }
.mbox { border: 1px solid var(--cardLine); background: var(--btn); border-radius: 16px; padding: 13px; margin-top: 10px; }
.mbox h3 { font-size: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mbox h3 small { font-size: 12px; color: var(--noteHi); font-weight: 800; white-space: nowrap; }
.mbox p { font-size: 12.5px; color: var(--sub); margin-top: 4px; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 6px 11px; font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; border: 1px solid var(--btnLine); background: var(--btn); color: inherit; cursor: pointer; }
.chip.on { background: linear-gradient(160deg, var(--acc2), var(--acc)); border-color: transparent; color: var(--accInk); }
.lvchips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.lvchips .chip { padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.lvchips .chip i { font-style: normal; font-size: 10px; letter-spacing: 1px; opacity: .75; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
h2 { font-size: 21px; text-align: center; margin-bottom: 10px; }
.big { text-align: center; font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(90deg, var(--acc2), var(--acc)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: var(--sub); font-size: 13px; }
.newrec { text-align: center; color: var(--noteHi); font-weight: 800; letter-spacing: .1em; font-size: 13px; margin-top: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.grid2 { display: grid; grid-template-columns: 1fr auto; gap: 7px 14px; margin-top: 14px; font-size: 14px; color: var(--sub); font-variant-numeric: tabular-nums; }
.grid2 b { color: var(--ink); text-align: right; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--sub); }
.row .chips { margin-top: 0; justify-content: flex-end; }
.sl { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--sub); }
.sl input { width: 100%; accent-color: var(--acc); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; margin-top: 6px; }
th { font-size: 11.5px; color: var(--dim); font-weight: 700; text-align: right; padding: 4px; } th:first-child { text-align: left; }
td { padding: 7px 4px; border-bottom: 1px solid var(--thin); text-align: right; } td:first-child { text-align: left; color: var(--acc2); font-weight: 800; }
h4 { font-size: 12.5px; color: var(--sub); letter-spacing: .08em; margin-top: 16px; }
.keys { display: grid; grid-template-columns: minmax(0, 42%) 1fr; gap: 7px 14px; font-size: 13.5px; color: var(--sub); align-items: center; }
.keys kbd { font: 700 12px ui-monospace, monospace; background: var(--btn); border: 1px solid var(--btnLine); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: var(--ink); justify-self: start; white-space: normal; overflow-wrap: anywhere; }
.tips { margin-top: 14px; display: grid; gap: 6px; font-size: 12.5px; color: var(--sub); line-height: 1.45; }
.tips div::before { content: '•'; color: var(--acc2); margin-right: 6px; }
.toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); z-index: 40; background: var(--card); border: 1px solid var(--acc); padding: 10px 18px; border-radius: 14px; font-weight: 800; animation: toast 2s ease forwards; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; box-shadow: var(--shadow); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 78% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.cont { display: flex; align-items: center; gap: 12px; }
.cont .mini { flex: none; width: 54px; height: 54px; }
.cont .ci { flex: 1; min-width: 0; font-size: 13px; color: var(--sub); line-height: 1.5; } .cont .ci b { color: var(--ink); }

/* ── 배우기 */
.lgroup { margin-top: 14px; } .lgroup h4 { margin: 0 0 6px; display: flex; justify-content: space-between; }
.litem { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; font: inherit; color: inherit; text-align: left; background: var(--btn); border: 1px solid var(--cardLine); border-radius: 12px; cursor: pointer; margin-top: 6px; }
.litem .ck { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--thin); display: grid; place-items: center; font-size: 12px; font-weight: 900; color: var(--accInk); }
.litem.done .ck { background: var(--ok); border-color: var(--ok); }
.litem b { font-size: 14px; display: block; } .litem small { font-size: 12px; color: var(--sub); display: block; margin-top: 1px; line-height: 1.35; }
.litem .lv { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 800; color: var(--sub); }
.lesson { position: fixed; inset: 0; z-index: 11; background: var(--bg); background-color: #0d0d1a; display: flex; align-items: center; justify-content: center; gap: 22px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
[data-theme="paper"] .lesson { background-color: #f1ead9; } [data-theme="ink"] .lesson { background-color: #000; }
.lesson.narrow { flex-direction: column; gap: 10px; justify-content: flex-start; overflow-y: auto; }
.lesson .lpanel { width: var(--sw); display: flex; flex-direction: column; gap: 10px; }
.lesson .ltop { display: flex; align-items: center; gap: 8px; } .lesson .ltop b { font-size: 18px; font-weight: 900; margin-right: auto; }
.lesson .ltext { font-size: 14px; line-height: 1.6; color: var(--ink); }
.lesson .ltext p + p { margin-top: 8px; }
.lesson .ltask { font-size: 13.5px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--acc); color: var(--acc2); font-weight: 700; }
.lesson .ltask.ok { border-style: solid; border-color: var(--ok); color: var(--ok); }
.lesson .lnav { display: flex; gap: 8px; flex-wrap: wrap; }
.lesson .exn { font-size: 12px; color: var(--sub); font-weight: 700; }
</style>
</head>
<body tabindex="0">

<div class="app" id="app">
  <div class="top">
    <button class="ib" id="bMenu" title="Esc"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="16" height="2.4" rx="1.2"/><rect x="4" y="10.8" width="16" height="2.4" rx="1.2"/><rect x="4" y="16.6" width="16" height="2.4" rx="1.2"/></svg></button>
    <img class="wl" id="wlogo" alt="wiiiv"><div class="ttl" id="ttl"></div>
    <span id="timer"></span>
    <button class="ib" id="bPause" title="P"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>

// - 누르면 wiiiv.ai 를 새 탭으로 연다. wiiiv 안(틀)에서는 이미 wiiiv 이고 새 창도 막혀 있어 링크를 걸지 않는다.

// 쓰는 법: wiiivMark(imgElement, '앱id')  — 원본: tools/wiiivapp-src/_shared/wiiiv-logo.js (모든 앱 같은 내용)
const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {

          if (dfs(n, out)) return true;
          path.pop(); used.delete(n);
        }
        return false;
      };
      if (dfs(start, DIGS[s.c[start] & ~BIT(z)][0])) return found;
    }
  }
  return null;
};

// 기술 목록 — 쉬운 것부터. lv: 1 쉬움 · 2 보통 · 3 어려움 · 4 전문가 · 5 마스터
const TECHS = [
  ['fullHouse', 1, T_FULL], ['hiddenSingle', 1, T_HIDDEN1],
  ['nakedSingle', 2, T_NAKED1], ['pointing', 2, T_POINTING], ['claiming', 2, T_CLAIMING],
  ['nakedPair', 3, T_NAKEDN(2)], ['hiddenPair', 3, T_HIDDENN(2)], ['nakedTriple', 3, T_NAKEDN(3)], ['hiddenTriple', 3, T_HIDDENN(3)],
  ['xWing', 4, T_FISH(2)], ['skyscraper', 4, T_SKYSCRAPER], ['twoStringKite', 4, T_KITE], ['xyWing', 4, T_XYWING], ['xyzWing', 4, T_XYZWING],
  ['nakedQuad', 4, T_NAKEDN(4)], ['hiddenQuad', 4, T_HIDDENN(4)], ['swordfish', 4, T_FISH(3)],
  ['uniqueRect', 5, T_UR1], ['bug', 5, T_BUG], ['wWing', 5, T_WWING], ['coloring', 5, T_COLORING], ['jellyfish', 5, T_FISH(4)], ['xyChain', 5, T_XYCHAIN],
];
const TECH_LV = Object.fromEntries(TECHS.map(([n, lv]) => [n, lv]));
function nextStep(s, maxLv = 5) {
  for (const [, lv, fn] of TECHS) { if (lv > maxLv) break; const st = fn(s); if (st) { st.lv = lv; return st; } }
  return null;
}
// 등급: 쉬운 기술부터 써서 끝까지 풀고, 쓴 기술 중 가장 어려운 단계. 못 풀면 lv 6 (기술 밖)
function grade(v) {
  const s = new LS(v), used = {}; let lv = 1, steps = 0, score = 0;
  while (!s.done()) {
    const st = nextStep(s); if (!st) return { lv: 6, used, steps, score };
    used[st.t] = (used[st.t] || 0) + 1; lv = Math.max(lv, st.lv); steps++; score += [0, 1, 3, 12, 40, 120][st.lv];
    s.apply(st);
    if (s.broken()) return { lv: 7, used, steps, score };
  }
  return { lv, used, steps, score };
}

// ── 같은 난이도를 유지하는 변형: 숫자 바꾸기 · 띠/줄 섞기 · 전치 (180° 대칭 유지)
function symLineMap(rand) {
  const f = new Array(9), B = rand() < 0.5 ? 0 : 2, q = shuffle([0, 1, 2], rand);
  for (let r = 0; r < 3; r++) { f[r] = B * 3 + q[r]; f[8 - r] = 8 - f[r]; }
  f[4] = 4; f[3] = rand() < 0.5 ? 3 : 5; f[5] = 8 - f[3];
  return f;
}
function transform(str, rand) {
  const v = parse(str), p = [0, ...shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9], rand)];
  const f = symLineMap(rand), g = symLineMap(rand), tr = rand() < 0.5, out = new Array(81).fill(0);
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) { const d = v[r * 9 + c]; if (!d) continue; const R = f[r], C = g[c]; out[tr ? C * 9 + R : R * 9 + C] = p[d]; }
  return toStr(out);
}

// ── 생성 (도구용 — 앱은 미리 만든 문제 은행 + 변형을 쓴다): 180° 대칭으로 지우며 해가 하나인 동안 계속
function generate(rand, maxLv = 5, minClues = 17) {
  const full = randomFull(rand), v = full.slice();
  const pairs = shuffle(Array.from({ length: 41 }, (_, k) => k), rand);
  let clues = 81;
  for (const i of pairs) {
    const j = 80 - i, n = i === j ? 1 : 2; if (clues - n < minClues) continue;
    const a = v[i], b = v[j]; v[i] = 0; v[j] = 0;
    let ok = solveCount(v, 2).count === 1;
    if (ok && maxLv < 5) ok = grade(v).lv <= maxLv;
    if (ok) clues -= n; else { v[i] = a; v[j] = b; }
  }
  return { puzzle: toStr(v), solution: toStr(full), clues };
}

    nakedPair: { name: '드러난 짝', short: '두 칸이 같은 두 후보만 가짐', learn: '한 줄이나 상자에서 두 칸의 후보가 똑같이 두 숫자(예: 3·7)뿐이면, 그 두 숫자는 이 두 칸이 나눠 가져요.\n그러니 같은 줄·상자의 다른 칸에서는 그 두 숫자를 지울 수 있어요.', hint: '{unit}의 {cells}에는 후보가 {ds}뿐이에요. 이 숫자들은 두 칸이 나눠 가지므로 다른 칸({elims})에서 지웁니다.' },
    hiddenPair: { name: '숨은 짝', short: '두 숫자가 같은 두 칸에만', learn: '한 줄이나 상자에서 두 숫자가 들어갈 수 있는 곳이 같은 두 칸뿐이라면, 그 두 칸은 그 두 숫자로 정해져요.\n그러니 그 두 칸의 다른 후보는 모두 지울 수 있어요. 다른 후보에 가려 잘 안 보여서 "숨은" 짝이에요.', hint: '{unit}에서 {ds}는 {cells}에만 올 수 있어요. 그러니 이 칸들의 다른 후보를 지웁니다.' },
    nakedTriple: { name: '드러난 세 쌍', short: '세 칸이 세 후보를 나눠 가짐', learn: '드러난 짝을 셋으로 늘린 것이에요. 한 줄이나 상자에서 세 칸의 후보를 모두 합쳐도 세 숫자뿐이라면, 그 세 숫자는 이 세 칸이 차지해요.\n칸마다 세 숫자가 다 있을 필요는 없어요 (예: 1·2, 2·3, 1·3).', hint: '{unit}의 {cells}의 후보를 합치면 {ds} 세 숫자뿐이에요. 그러니 다른 칸({elims})에서 이 숫자들을 지웁니다.' },
    hiddenTriple: { name: '숨은 세 쌍', short: '세 숫자가 같은 세 칸에만', learn: '숨은 짝을 셋으로 늘린 것이에요. 세 숫자가 들어갈 수 있는 곳이 모두 같은 세 칸 안이라면, 그 세 칸은 그 세 숫자로 채워져요.\n그 칸들의 다른 후보는 지울 수 있어요.', hint: '{unit}에서 {ds}는 {cells}에만 올 수 있어요. 그러니 이 칸들의 다른 후보를 지웁니다.' },
    nakedQuad: { name: '드러난 네 쌍', short: '네 칸이 네 후보를 나눠 가짐', learn: '네 칸의 후보를 합쳐서 네 숫자뿐이면, 그 네 숫자는 이 칸들 몫이에요. 같은 줄·상자의 다른 칸에서 지울 수 있어요.', hint: '{unit}의 {cells}의 후보를 합치면 {ds}뿐이에요. 다른 칸({elims})에서 이 숫자들을 지웁니다.' },
    hiddenQuad: { name: '숨은 네 쌍', short: '네 숫자가 같은 네 칸에만', learn: '네 숫자가 같은 네 칸 안에만 들어갈 수 있으면, 그 칸들의 다른 후보는 지울 수 있어요.', hint: '{unit}에서 {ds}는 {cells}에만 올 수 있어요. 이 칸들의 다른 후보를 지웁니다.' },
    xWing: { name: 'X-Wing', short: '두 줄 × 두 줄의 사각형', learn: '어떤 숫자가 두 행에서 각각 딱 두 곳에만 올 수 있고, 그 자리가 같은 두 열이라면 직사각형 무늬가 생겨요.\n그 숫자는 대각선 두 꼭짓점에 들어가는데, 어느 쪽이든 두 열을 모두 차지해요. 그러니 그 두 열의 다른 칸에서 그 숫자를 지울 수 있어요. (행과 열을 바꿔도 같아요.)', hint: '{d}는 {lines}에서 {covers} 위에만 있어요. 어느 쪽이든 {covers}의 {d}는 이 줄들이 차지하므로, 다른 칸({elims})에서 {d}를 지웁니다.' },
    swordfish: { name: '황새치', short: 'X-Wing을 세 줄로', learn: 'X-Wing을 세 줄로 넓힌 것이에요. 어떤 숫자가 세 행에서 같은 세 열 안에만 올 수 있으면, 그 세 열의 그 숫자는 이 세 행이 차지해요.\n그 세 열의 다른 칸에서 그 숫자를 지울 수 있어요.', hint: '{d}는 {lines}에서 {covers} 위에만 있어요. 그러니 {covers}의 다른 칸({elims})에서 {d}를 지웁니다.' },
    jellyfish: { name: '해파리', short: 'X-Wing을 네 줄로', learn: '네 줄짜리 물고기예요. 어떤 숫자가 네 행에서 같은 네 열 안에만 올 수 있으면, 그 네 열의 다른 칸에서 그 숫자를 지울 수 있어요.', hint: '{d}는 {lines}에서 {covers} 위에만 있어요. 그러니 {covers}의 다른 칸({elims})에서 {d}를 지웁니다.' },
    skyscraper: { name: '스카이스크래퍼', short: '한쪽만 맞닿은 두 줄', learn: '어떤 숫자가 두 행에서 각각 두 곳에만 올 수 있고, 한쪽 끝은 같은 열에 있지만 다른 쪽 끝은 엇갈려 있어요 (빌딩 두 채 모양).\n같은 열의 두 끝 중 하나만 답이 될 수 있으니, 엇갈린 두 끝(지붕) 중 하나는 반드시 그 숫자예요. 두 지붕을 모두 보는 칸에서 그 숫자를 지워요.', hint: '{d}는 {unit}와 {unit2}에 두 자리씩만 있고 한쪽 끝이 같은 줄에 있어요. 그러니 다른 두 끝({ends}) 중 하나는 반드시 {d} — 둘 다 보는 칸({elims})에서 {d}를 지웁니다.' },
    twoStringKite: { name: '연', short: '행과 열이 상자에서 만남', learn: '어떤 숫자가 한 행에서 두 곳, 한 열에서 두 곳에만 올 수 있고, 행의 한 끝과 열의 한 끝이 같은 상자 안에 있어요.\n그 상자 안 두 끝은 동시에 답이 될 수 없으니, 바깥쪽 두 끝 중 하나는 그 숫자예요. 두 끝을 모두 보는 칸에서 지워요.', hint: '{d}는 {unit}와 {unit2}에 두 자리씩만 있고, 두 줄의 끝이 같은 상자에서 만나요. 그러니 다른 두 끝({ends}) 중 하나는 {d} — 둘 다 보는 {elims}에서 {d}를 지웁니다.' },
    xyWing: { name: 'XY-Wing', short: '축 하나와 날개 둘', learn: '후보가 두 개인 칸 세 개로 만드는 무늬예요. 축 칸이 {X,Y}, 축이 보는 두 날개가 {X,Z}와 {Y,Z}예요.\n축이 X이면 첫 날개가 Z, 축이 Y이면 둘째 날개가 Z가 돼요. 어느 쪽이든 날개 중 하나는 Z! 두 날개를 모두 보는 칸에서 Z를 지울 수 있어요.', hint: '축 {pivot}({pm})과 날개 {w1}({m1}), {w2}({m2}): 축이 무엇이 되든 날개 중 하나는 {d}예요. 두 날개를 모두 보는 칸({elims})에서 {d}를 지웁니다.' },
    xyzWing: { name: 'XYZ-Wing', short: '후보 셋인 축과 날개 둘', learn: 'XY-Wing과 비슷하지만 축이 {X,Y,Z} 세 후보를 가져요. 날개는 {X,Z}와 {Y,Z}.\n축·날개 셋 중 하나는 반드시 Z가 되므로, 세 칸을 모두 보는 칸에서 Z를 지울 수 있어요.', hint: '축 {pivot}({pm})과 날개 {w1}({m1}), {w2}({m2}) 중 하나는 반드시 {d}예요. 세 칸을 모두 보는 칸({elims})에서 {d}를 지웁니다.' },
    wWing: { name: 'W-Wing', short: '같은 두 후보 칸을 강한 연결로', learn: '서로 보지 않는 두 칸이 똑같이 {X,Y} 후보를 가지고, 어떤 줄에서 X가 두 곳에만 올 수 있으며 그 두 곳이 각각 두 칸을 봐요.\n두 칸이 모두 X일 수는 없어요(그 줄에 X가 없어지니까). 그러니 둘 중 하나는 Y — 두 칸을 모두 보는 칸에서 Y를 지워요.', hint: '{a}와 {b}는 둘 다 후보가 {ab}이고, {x}의 강한 연결({e}–{f})이 둘을 이어요. 그러면 둘 중 하나는 {d}예요 — 둘 다 보는 칸({elims})에서 {d}를 지웁니다.' },
    xyChain: { name: 'XY-Chain', short: '두 후보 칸을 잇는 사슬', learn: '후보가 두 개인 칸들을 사슬처럼 이어요. 이웃한 칸은 서로 보고 숫자 하나를 공유해요.\n첫 칸이 Z가 아니라면 다음 칸이 정해지고, 또 다음 칸이 정해져… 마지막 칸이 Z가 돼요. 그러니 양 끝 중 하나는 Z! 양 끝을 모두 보는 칸에서 Z를 지워요.', hint: '두 후보 칸의 사슬 {chain}: 처음 칸이 {d}가 아니면 사슬을 따라 끝 칸이 {d}가 돼요. 그러니 양 끝을 모두 보는 칸({elims})에서 {d}를 지웁니다.' },
    coloring: { name: '컬러링', short: '강한 연결을 두 색으로 칠하기', learn: '어떤 숫자가 두 곳에만 올 수 있는 줄(강한 연결)을 따라 칸을 파랑·주황 두 색으로 번갈아 칠해요. 한 색이 참이면 다른 색은 모두 거짓이에요.\n같은 색 두 칸이 서로 보면 그 색이 거짓이에요. 또, 두 색을 모두 보는 칸은 어느 쪽이든 그 숫자가 될 수 없어요.', hint: '{d}의 강한 연결을 두 색으로 칠하면 둘 중 한 색은 반드시 참이에요. 두 색을 모두 보는 칸({elims})에서 {d}를 지웁니다.', hintWrap: '{d}의 강한 연결을 두 색으로 칠하면 같은 색 두 칸이 서로 마주쳐요. 그 색은 거짓 — 그 색 칸({elims})에서 {d}를 지웁니다.' },
    uniqueRect: { name: '유일 사각형', short: '답이 둘이 되는 무늬 피하기', learn: '좋은 스도쿠는 답이 하나예요. 두 상자에 걸친 직사각형 네 칸이 모두 같은 두 후보 {X,Y}만 가지면, X와 Y를 서로 바꿔도 되니 답이 두 개가 돼요.\n그러니 세 칸이 {X,Y}이고 넷째 칸에 다른 후보도 있다면, 넷째 칸은 X도 Y도 아니에요.', hint: '{cells} 네 칸이 모두 {ds}만 가지면 답이 두 개가 되어 버려요. 그러니 {cell}은 {ds}가 아니에요 — {cell}에서 {ds}를 지웁니다.' },
    bug: { name: 'BUG+1', short: '후보 셋인 칸이 하나만 남음', learn: '모든 빈칸의 후보가 두 개이고 한 칸만 세 개라면, 그 칸이 "여분"의 숫자를 가져야 답이 하나로 정해져요.\n그 칸의 후보 중 행(또는 열·상자)에 세 번 나오는 숫자가 답이에요.', hint: '{cell}만 빼고 모든 빈칸의 후보가 두 개예요. {cell}이 {d}가 아니면 답이 여러 개가 되므로 {cell}은 {d}입니다.' },
  },
};

    pointing: { name: 'Pointing', short: 'A box’s candidates lie on one line', learn: 'If, inside one box, all candidates for a number lie in one row (or column), the number must go in that part of the line.\nSo it can be removed from that line’s cells in other boxes.', hint: 'In {unit}, {d} can only go on {unit2}. So remove {d} from the other cells of {unit2} ({elims}).' },

    xyChain: { name: 'XY-Chain', short: 'A chain of two-candidate cells', learn: 'Link two-candidate cells into a chain; neighbours see each other and share a number.\nIf the first cell isn’t Z, the next is forced, then the next… until the last cell is Z. So one end is Z! Remove Z from cells that see both ends.', hint: 'Chain {chain}: if the first cell isn’t {d}, following the chain makes the last one {d}. Remove {d} from cells seeing both ends ({elims}).' },

    uniqueRect: { name: 'Unique Rectangle', short: 'Avoid the pattern with two solutions', learn: 'A good sudoku has one solution. If four rectangle cells spanning two boxes all held just {X,Y}, X and Y could swap — two solutions.\nSo if three corners are {X,Y} and the fourth has extras, the fourth can be neither X nor Y.', hint: 'If {cells} all held only {ds}, there would be two solutions. So {cell} is not {ds} — remove them from {cell}.' },

  },

    twoStringKite: { name: '凧', short: '行と列がブロックで出会う', learn: 'ある数字が一つの行で二か所、一つの列で二か所にしか入れず、行の端と列の端が同じブロックにあります。\nブロック内の二端は同時に正解になれないので、外側の二端のどちらかがその数字です。両方が見えるマスから消します。', hint: '{d}は{unit}と{unit2}に二か所ずつしかなく、端が同じブロックで出会います。だから外側の二端({ends})のどちらかは{d} — {elims}から{d}を消します。' },
    xyWing: { name: 'XY-Wing', short: '軸と二つの翼', learn: '候補が二つのマス三つで作る形です。軸が{X,Y}、軸から見える二つの翼が{X,Z}と{Y,Z}。\n軸がXなら一つ目の翼がZ、軸がYなら二つ目の翼がZ。どちらでも翼の一方はZ!両方の翼が見えるマスからZを消せます。', hint: '軸{pivot}({pm})と翼{w1}({m1})、{w2}({m2}):軸が何になっても翼の一方は{d}です。両方の翼が見えるマス({elims})から{d}を消します。' },
    xyzWing: { name: 'XYZ-Wing', short: '候補三つの軸と二つの翼', learn: 'XY-Wingに似ていますが、軸が{X,Y,Z}の三候補を持ちます。翼は{X,Z}と{Y,Z}。\n三マスのどれかは必ずZなので、三マスすべてが見えるマスからZを消せます。', hint: '軸{pivot}({pm})と翼{w1}({m1})、{w2}({m2})のどれかは必ず{d}です。三つすべてが見えるマス({elims})から{d}を消します。' },
    wWing: { name: 'W-Wing', short: '同じ二候補を強いリンクでつなぐ', learn: '互いに見えない二マスが同じ{X,Y}を持ち、ある線でXが二か所にしか入れず、その二か所がそれぞれ二マスを見ています。\n二マスが両方Xにはなれない(その線からXが消える)ので、どちらかはY — 両方が見えるマスからYを消します。', hint: '{a}と{b}はどちらも候補が{ab}で、{x}の強いリンク({e}–{f})が二つをつなぎます。だからどちらかは{d} — 両方が見えるマス({elims})から{d}を消します。' },
    xyChain: { name: 'XY-Chain', short: '二候補マスの鎖', learn: '候補が二つのマスを鎖のようにつなぎます。隣同士は互いに見え、数字を一つ共有します。\n最初のマスがZでなければ次が決まり、また次が決まり…最後のマスがZになります。だから両端のどちらかはZ!両端が見えるマスからZを消します。', hint: '二候補マスの鎖{chain}:最初のマスが{d}でなければ、鎖をたどって最後のマスが{d}になります。両端が見えるマス({elims})から{d}を消します。' },
    coloring: { name: 'カラーリング', short: '強いリンクを二色で塗る', learn: 'ある数字が二か所にしか入れない線(強いリンク)をたどり、マスを青・オレンジの二色で交互に塗ります。一方の色が正しければ、もう一方はすべて誤りです。\n同じ色の二マスが互いに見えればその色は誤り。また、二色とも見えるマスはどちらにしてもその数字になれません。', hint: '{d}の強いリンクを二色で塗ると、どちらかの色は必ず正しい。二色とも見えるマス({elims})から{d}を消します。', hintWrap: '{d}の強いリンクを二色で塗ると、同じ色の二マスが互いに見えます。その色は誤り — その色のマス({elims})から{d}を消します。' },
    uniqueRect: { name: 'ユニーク長方形', short: '答えが二つになる形を避ける', learn: '良い数独は答えが一つです。二つのブロックにまたがる長方形の四マスがすべて同じ二候補{X,Y}だけなら、XとYを入れ替えられて答えが二つになります。\nだから三マスが{X,Y}で四つ目に他の候補もあれば、四つ目はXでもYでもありません。', hint: '{cells}の四マスがすべて{ds}だけなら答えが二つになってしまいます。だから{cell}は{ds}ではありません — {cell}から{ds}を消します。' },
    bug: { name: 'BUG+1', short: '候補三つのマスが一つだけ', learn: 'すべての空きマスの候補が二つで、一マスだけ三つなら、そのマスが「余分」の数字を持たないと答えが一つに決まりません。\nそのマスの候補のうち、行(または列・ブロック)に三回現れる数字が答えです。', hint: '{cell}以外のすべての空きマスは候補が二つです。{cell}が{d}でないと答えが複数になるので、{cell}は{d}です。' },
  },
