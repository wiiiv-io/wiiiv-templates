<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title id="pageTitle">벽돌깨기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: radial-gradient(120% 80% at 50% 0%, #1c2346 0%, #0b0e1d 60%, #070912 100%); font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Hiragino Sans', 'Yu Gothic UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK KR', system-ui, sans-serif; color: #eef1ff; user-select: none; -webkit-user-select: none; touch-action: none; outline: none; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
.top { width: var(--bw); display: flex; align-items: center; gap: 8px; }
.top .ttl { font-weight: 900; font-size: 26px; letter-spacing: .02em; background: linear-gradient(90deg, #ff9a3d, #ff4f63, #b45cff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-right: auto; }
.ib { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: #dfe3ff; cursor: pointer; display: grid; place-items: center; flex: none; }
.ib svg { width: 18px; height: 18px; }
.modeline { width: var(--bw); font-size: 13px; color: #9aa3c7; display: flex; justify-content: space-between; gap: 8px; min-height: 18px; }
.modeline b { color: #dfe3ff; font-weight: 700; }
.stats { width: var(--bw); display: flex; gap: 8px; }
.stat { flex: 1; min-width: 0; background: rgba(255, 255, 255, .05); border: 1px solid rgba(160, 170, 255, .14); border-radius: 12px; padding: 6px 10px; position: relative; }
.stat small { display: block; font-size: 11px; letter-spacing: .03em; color: #9aa3c7; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat .plus { position: absolute; right: 10px; top: 4px; font-weight: 900; color: #7dffb0; animation: plus .8s ease-out forwards; pointer-events: none; }
@keyframes plus { to { transform: translateY(-26px); opacity: 0; } }
.actions { width: var(--bw); display: flex; gap: 8px; }
.btn { flex: 1 1 auto; padding: 10px 12px; font: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); } .btn:disabled { opacity: .35; cursor: default; filter: none; }
.btn.primary { background: linear-gradient(160deg, #ff9a3d, #ff4f63); border-color: transparent; color: #fff; box-shadow: 0 8px 20px -8px rgba(255, 79, 99, .6); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.hint { font-size: 12.5px; color: #7d86ad; text-align: center; width: var(--bw); }
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; background: rgba(5, 7, 16, .6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ov[hidden] { display: none; }
.card { background: linear-gradient(160deg, rgba(30, 34, 64, .9), rgba(12, 14, 30, .95)); border: 1px solid rgba(160, 170, 255, .18); border-radius: 22px; padding: 22px 22px 18px; width: min(420px, 100%); max-height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8); }
.card::-webkit-scrollbar { display: none; }
.logo { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.tag { text-align: center; color: #9aa3c7; font-size: 13px; letter-spacing: .08em; margin-bottom: 16px; }
.mbox { border: 1px solid rgba(160, 170, 255, .16); background: rgba(255, 255, 255, .04); border-radius: 16px; padding: 14px; margin-top: 10px; }
.mbox h3 { font-size: 17px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mbox h3 small { font-size: 12px; color: #ffb35c; font-weight: 800; white-space: nowrap; }
.mbox p { font-size: 12.5px; color: #9aa3c7; margin-top: 4px; line-height: 1.45; }
.mbox .status { font-size: 13px; color: #c5cbea; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 6px 11px; font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: inherit; cursor: pointer; }
.chip.on { background: linear-gradient(160deg, #ff9a3d, #ff4f63); border-color: transparent; color: #fff; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
h2 { font-size: 22px; text-align: center; margin-bottom: 10px; }
.big { text-align: center; font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(90deg, #ff9a3d, #ff4f63, #b45cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: #9aa3c7; font-size: 13px; }
.newrec { text-align: center; color: #ffd23f; font-weight: 800; letter-spacing: .1em; font-size: 13px; margin-top: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.grid2 { display: grid; grid-template-columns: 1fr auto; gap: 7px 14px; margin-top: 14px; font-size: 14px; color: #c5cbea; font-variant-numeric: tabular-nums; }
.grid2 b { color: #fff; text-align: right; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: #c5cbea; }
.row > span:first-child { white-space: nowrap; }
.row .chips { margin-top: 0; justify-content: flex-end; }
.sl { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: #c5cbea; }
.sl input { width: 100%; accent-color: #8a7cff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 6px; }
td { padding: 7px 4px; border-bottom: 1px solid rgba(255, 255, 255, .06); } td:last-child { text-align: right; color: #9aa3c7; font-size: 12.5px; }
td:first-child { color: #b9a6ff; font-weight: 800; }
h4 { font-size: 13px; color: #9aa3c7; letter-spacing: .08em; margin-top: 14px; }
.keys { display: grid; grid-template-columns: minmax(0, 45%) 1fr; gap: 7px 14px; font-size: 13.5px; color: #c5cbea; align-items: center; }
.keys kbd { font: 700 12px ui-monospace, monospace; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .15); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: #fff; justify-self: start; white-space: normal; overflow-wrap: anywhere; }
.tips { margin-top: 14px; display: grid; gap: 6px; font-size: 12.5px; color: #9aa3c7; line-height: 1.45; }
.tips div::before { content: '•'; color: #a05cff; margin-right: 6px; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 12; background: rgba(20, 24, 50, .92); border: 1px solid rgba(160, 170, 255, .3); padding: 10px 18px; border-radius: 14px; font-weight: 800; animation: toast 1.8s ease forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

.logo { align-items: center; gap: 10px; }
@keyframes shake { 15% { transform: translate(-6px, 3px); } 30% { transform: translate(5px, -4px); } 45% { transform: translate(-4px, -3px); } 60% { transform: translate(3px, 4px); } 80% { transform: translate(-2px, 1px); } }
.btn.on { background: linear-gradient(160deg, #ff6a6a, #d81e3c); border-color: transparent; color: #fff; }

.app { gap: 8px; }
.bar { width: var(--bw); display: flex; align-items: center; gap: 8px; }
.bar #wlogo { height: 24px; width: auto; flex: none; display: block; }
.bar .stat { text-align: center; padding: 4px 8px; }
.bar .stat b { font-size: 19px; }
.lives { display: flex; gap: 3px; justify-content: center; height: 22px; align-items: center; }
.lives i { width: 18px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ff9a3d 0 22%, #c9d2ee 22% 78%, #ff9a3d 78%); display: block; }
#cv { display: block; border-radius: 6px; touch-action: none; cursor: none; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9); }
.logo b { font-size: clamp(30px, 8.5vw, 46px); font-weight: 900; white-space: nowrap; background: linear-gradient(90deg, #ff9a3d, #ff4f63 50%, #b45cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo { flex-direction: column; gap: 6px; }
.logo .bricks { display: grid; grid-template-columns: repeat(7, 22px); gap: 3px; }
.logo .bricks i { height: 10px; border-radius: 2px; display: block; animation: bob 2.4s ease-in-out infinite; }
.caplist { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin-top: 12px; font-size: 13px; color: #c5cbea; align-items: center; }
.caplist .pill { width: 34px; height: 15px; border-radius: 8px; display: grid; place-items: center; font: 900 10px system-ui, sans-serif; color: #10142a; }
</style>

// - 누르면 wiiiv.ai 를 새 탭으로 연다. wiiiv 안(틀)·바탕화면 앱 창에서는 이미 wiiiv 이고 새 창도 막혀 있어 링크를 걸지 않는다.
// - 그림은 앱 안의 것을 바로 쓰고, 같은 그림을 wiiiv.ai 에서 한 번 받아 간다 → 서버가 앱·환경별 사용 수를 센다 (IP·사용자 정보는 남기지 않음).
//   서버가 느리거나 막혀도 앱에는 영향이 없다. 같은 브라우저는 12시간 캐시라 다시 세지 않는다.
// 쓰는 법: wiiivMark(imgElement, '앱id')  — 원본: tools/wiiivapp-src/_shared/wiiiv-logo.js (모든 앱 같은 내용)
const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  if (location.pathname.startsWith('/api/v2/wiiivapp/run/')) return 'desktop';   // 바탕화면에 설치한 앱 창 (wiiiv 데스크톱)
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;
    } catch { /* 무시 */ }
  }
  if (WIIIV_CTX !== 'wiiiv' && WIIIV_CTX !== 'desktop' && !img.dataset.wiiivLink) {
    img.dataset.wiiivLink = '1'; img.style.cursor = 'pointer'; img.title = 'wiiiv.ai';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); window.open(`${WIIIV_HOME}/?from=${encodeURIComponent(app)}`, '_blank', 'noopener'); });
  }
  return img;
}

function bassLine(chords, bar, style) {

    const [r, , f] = chordNotes(c); const R = r - 12, F5 = f - 12;

const rep = (s, n) => Array(n).fill(s).join(' | ');

    tapLaunch: 'Chạm để phóng', clickLaunch: 'Nhấp chuột hoặc Space để phóng', over: 'Hết trò', won: 'Chiến thắng!', extra: 'Thêm mạng', helpCap: 'Viên trợ giúp!',
    caps: { S: 'Chậm', C: 'Bắt bóng', L: 'Laser', E: 'Rộng', D: 'Ba bóng', B: 'Cửa ra', P: 'Thêm mạng' },
    music: 'Nhạc', musicNames: { auto: 'Tự động', A: 'Neon Breaker', B: 'Lõi', off: 'Tắt' }, mv: 'Âm lượng nhạc', sv: 'Âm lượng hiệu ứng', fx: 'Hạt hiệu ứng', shake: 'Rung màn hình', on: 'Bật', off: 'Tắt',
    reached: 'Màn đạt tới', bricks: 'Gạch đã phá', capsN: 'Viên năng lượng', enemies: 'Kẻ địch',
    keys: [['Chuột · ← →', 'Di chuyển thanh đỡ'], ['Nhấp · Space', 'Phóng bóng · bắn laser'], ['Kéo', 'Di chuyển thanh đỡ (điện thoại)'], ['Esc / P', 'Tạm dừng'], ['M', 'Tắt tiếng']],
    tips: ['S chậm · C bắt bóng · L laser · E thanh đỡ rộng · D ba bóng · B ra cửa bên phải để qua màn · P thêm mạng', 'Gạch bạc phải đánh nhiều lần, gạch vàng không vỡ', 'Bóng chạm càng gần mép thanh đỡ thì nảy càng xiên', 'Nếu 25 giây không phá được gạch nào, sẽ có viên trợ giúp rơi xuống'],
  },
};

// ───────────────────────── 메뉴·흐름·조작 ─────────────────────────
const LANG = 'ko';
const T = (() => { const l = String(LANG || 'en'); if (/^zh-(TW|HK|MO|Hant)/i.test(l)) return TX['zh-TW']; return TX[l] || TX[l.split('-')[0].toLowerCase()] || TX.en; })();
document.documentElement.lang = LANG;
const $ = id => document.getElementById(id);
wiiivMark($('wlogo'), 'breakout');
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (typeof o === 'object' ? o[k] : o));
const coarse = matchMedia('(pointer: coarse)').matches;
const DEF = { music: 'auto', mv: 0.35, sv: 0.7, fx: true, shake: true, muted: false, maxRound: 1 };
let SET = { ...DEF }, BEST = [];
try { const d = JSON.parse(localStorage.getItem('wiiiv-breakout') || '{}'); SET = { ...DEF, ...(d.set || {}) }; BEST = d.best || []; } catch { /* 저장소 없이도 동작 */ }
const save = () => { try { localStorage.setItem('wiiiv-breakout', JSON.stringify({ set: SET, best: BEST })); } catch { /* 무시 */ } };
const chip = new Chip(); chip.setVol(SET.mv, SET.sv); chip.muted = SET.muted;
const scr = new Screen($('cv')); scr.opts = { fx: SET.fx, shake: SET.shake };
let game = null, phase = 'menu', acc = 0, last = performance.now(), demo = null, songNow = null;

// ── 배치
function layout() {
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  const bar = 56; scr.resize(Math.min(W - 16, 760), H - bar - 26, dpr);
  document.documentElement.style.setProperty('--bw', Math.max(300, Math.min(W - 16, parseFloat($('cv').style.width))) + 'px');
}
addEventListener('resize', layout);
function toast(text) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1900); }

// ── 음악
function song() { if (!game || SET.music === 'off') return null; if (SET.music !== 'auto') return SET.music; return game.boss ? 'B' : 'A'; }
function musicSync() { const s = phase === 'play' ? song() : null; if (s !== songNow) { songNow = s; if (s) chip.play(s); else chip.stop(); } }

// ── 시작·끝
function start(round = 1) { chip.init(); game = new Breakout({ round }); game.startRound = round; phase = 'play'; showOnly(null); scr.parts = []; scr.pops = []; songNow = null; hud(); }
function showOnly(id) { for (const k of ['menu', 'settings', 'records', 'help', 'pause', 'result']) $(k).hidden = k !== id; }
function toMenu() { phase = 'menu'; game = null; chip.stop(); songNow = null; buildMenu(); showOnly('menu'); }
function pauseGame(p) {
  if (!game) return;
  if (p && phase === 'play') { phase = 'pause'; chip.pause(true); showOnly('pause'); game.input.left = game.input.right = game.input.fire = false; }
  else if (!p && phase === 'pause') { phase = 'play'; chip.pause(false); showOnly(null); last = performance.now(); }
}
function finish() {
  phase = 'result'; chip.stop(); songNow = null; const g = game, won = g.mode === 'won';
  const rec = { score: g.score, round: g.round, won, date: new Date().toISOString().slice(0, 10) };
  BEST.push(rec); BEST.sort((a, b) => b.score - a.score); BEST.splice(5); save();
  $('resTitle').textContent = won ? T.won : T.over; $('resScore').textContent = g.score.toLocaleString(LANG);
  $('resSub').textContent = `${T.reached} ${fmt(T.roundN, g.round)}`;
  $('resNew').hidden = !(BEST[0] === rec && rec.score > 0); $('resNew').textContent = T.newRec;
  const rows = [[T.bricks, g.stats.bricks], [T.capsN, g.stats.caps], [T.enemies, g.stats.enemies]];
  $('resGrid').innerHTML = ''; for (const [k, v] of rows) { const a = document.createElement('span'); a.textContent = k; const b = document.createElement('b'); b.textContent = v; $('resGrid').append(a, b); }
  showOnly('result');
}
function hud() {
  const g = game; if (!g) return;
  $('vScore').textContent = g.score.toLocaleString(LANG); $('vHi').textContent = Math.max(g.score, BEST[0] ? BEST[0].score : 0).toLocaleString(LANG); $('vRound').textContent = g.round;
  const L = $('vLives'), n = Math.max(0, g.lives - 1); if (L.childElementCount !== Math.min(n, 6)) { L.innerHTML = ''; for (let i = 0; i < Math.min(n, 6); i++) L.appendChild(document.createElement('i')); }
}

// ── 사건 → 소리·효과
function handle(ev) {
  const g = game;
  switch (ev.type) {
    case 'paddle': chip.sfx('paddle', ev); break;
    case 'wall': chip.sfx('wall'); break;
    case 'brick': { const col = BRICK[ev.kind] ? BRICK[ev.kind][0] : '#c8cee6'; scr.chips(ev.x, ev.y, col); scr.burst(ev.x, ev.y, col, 6, 1.5, 22, 2); chip.sfx(ev.kind === 'S' ? 'silverBreak' : 'brick', { row: Math.floor((ev.y - TOP) / BH) }); if (ev.kind === 'S') { scr.pop(ev.x, ev.y, '+' + ev.pts, '#e8ecff'); scr.kick(3); } break; }
    case 'silver': chip.sfx('silver'); scr.burst(ev.x, ev.y, '#ffffff', 4, 1.2, 14, 1.5); break;
    case 'gold': chip.sfx('gold'); scr.burst(ev.x, ev.y, '#ffe08a', 4, 1.2, 14, 1.5); break;
    case 'cap': chip.sfx('cap'); scr.burst(ev.x, ev.y, CAPC[ev.kind], 16, 2.5, 30, 2.5); scr.pop(ev.x, ev.y - 10, T.caps[ev.kind], CAPC[ev.kind]); break;
    case 'laser': chip.sfx('laser'); break;
    case 'enemy': chip.sfx('enemy'); scr.burst(ev.x, ev.y, ['#3fd8f0', '#ff6fd0', '#ffd23f'][ev.kind], 20, 3, 30, 3); scr.pop(ev.x, ev.y, '+100', '#ffffff'); break;
    case 'gate': chip.sfx('gate'); scr.gate[ev.x < FW / 2 ? 0 : 1] = 1; break;
    case 'lose': chip.sfx('lose'); scr.kick(10); scr.burst(ev.x, PY, '#ff9a3d', 40, 4, 50, 3.5); scr.burst(ev.x, PY, '#c9d2ee', 20, 3, 40, 3); chip.stop(); songNow = null; break;
    case 'ready': break;
    case 'extra': chip.sfx('extra'); toast(T.extra); break;
    case 'round': chip.sfx('round'); songNow = null; if (ev.n > (SET.maxRound || 1)) { SET.maxRound = Math.min(BOSS_ROUND, ev.n); save(); } break;
    case 'clear': chip.sfx('clear'); scr.flash = 0.4; break;
    case 'warp': chip.sfx('warp'); break;
    case 'help': chip.sfx('help'); toast(T.helpCap); break;
    case 'bossHit': chip.sfx('bossHit'); scr.kick(6); scr.burst(ev.x, ev.y, '#b45cff', 18, 3, 30, 3); break;
    case 'bossShot': chip.sfx('bossShot'); break;
    case 'bossDie': chip.sfx('bossDie'); scr.kick(20); scr.flash = 1; for (let i = 0; i < 5; i++) scr.burst(ev.x + (Math.random() - 0.5) * 120, ev.y + (Math.random() - 0.5) * 100, ['#b45cff', '#ff4f63', '#ffffff', '#ffd23f'][i % 4], 40, 5, 70, 4); chip.stop(); songNow = null; break;
    case 'over': chip.sfx('over'); setTimeout(() => { if (game === g && phase === 'play') finish(); }, 900); break;
    case 'won': chip.sfx('won'); setTimeout(() => { if (game === g && phase === 'play') finish(); }, 1500); break;
  }
}
// 메뉴 뒤에서 컴퓨터가 시연
function demoStep() {
  if (!demo || demo.mode === 'over' || demo.t > 60 * 90) { demo = new Breakout({ round: 1 + Math.floor(Math.random() * 12) }); demo.lives = 99; }
  const bs = demo.balls.filter(b => !b.stuck).sort((a, b) => b.y - a.y), b = bs[0];
  if (demo.mode === 'intro' || demo.balls.some(x => x.stuck)) demo.release();
  demo.input.tx = b ? b.x + Math.sin(demo.t / 50) * 18 : demo.pad.x; demo.input.fire = true; demo.step(); demo.events.length = 0;
}

// ── 반복
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt; let n = 0;
  while (acc >= 1 / 60 && n++ < 5) {
    acc -= 1 / 60;
    if (phase === 'menu' || !game) demoStep();
    else if (phase === 'play') { game.step(); game.events.splice(0).forEach(handle); }
  }
  if (acc > 0.2) acc = 0;
  if (game && phase === 'play') { hud(); if (game.mode === 'play' || game.mode === 'intro') musicSync(); }
  scr.frame(phase === 'menu' || !game ? demo : game, { T, fmt, touch: coarse });
  requestAnimationFrame(loop);
}

// ── 조작
const cv = $('cv');
const fieldX = clientX => { const r = cv.getBoundingClientRect(); return (clientX - r.left) / r.width * VW - WALL; };
addEventListener('mousemove', e => { if (game && phase === 'play') game.input.tx = fieldX(e.clientX); });
let drag = null;
addEventListener('pointerdown', e => {
  chip.init(); if (!game || phase !== 'play' || e.target.closest('button,.ov')) return;
  if (e.pointerType === 'mouse') { game.input.tx = fieldX(e.clientX); game.release(); game.input.fire = true; return; }
  // 손가락: 끌면 받침이 따라오고(손가락 아래 그대로가 아니라 움직인 만큼), 떼지 않고 있으면 레이저
  drag = { id: e.pointerId, x0: e.clientX, p0: game.pad.x, moved: false }; game.input.fire = true;
});
addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || !game) return;
  const r = cv.getBoundingClientRect(), dx = (e.clientX - drag.x0) / r.width * VW * 1.25;
  if (Math.abs(e.clientX - drag.x0) > 6) drag.moved = true;
  game.input.tx = drag.p0 + dx;
});
const upPtr = e => { if (game) game.input.fire = false; if (drag && drag.id === e.pointerId) { if (!drag.moved && game && phase === 'play') game.release(); drag = null; } };
addEventListener('pointerup', upPtr); addEventListener('pointercancel', upPtr);
addEventListener('keydown', e => {
  chip.init();
  if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { e.preventDefault(); if (phase === 'pause') pauseGame(false); else pauseGame(true); return; }
  if (!game || phase !== 'play') { if (phase === 'menu' && (e.key === 'Enter' || e.key === ' ') && !$('menu').hidden) { e.preventDefault(); $('bStart').click(); } return; }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); game.input.tx = null; game.input.left = true; }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); game.input.tx = null; game.input.right = true; }
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') { e.preventDefault(); game.release(); game.input.fire = true; }
});
addEventListener('keyup', e => {
  if (!game) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') game.input.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') game.input.right = false;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') game.input.fire = false;
});
addEventListener('mouseup', () => { if (game) game.input.fire = false; });
addEventListener('blur', () => pauseGame(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(true); });

// ── 메뉴
function toggleMute() { SET.muted = !SET.muted; chip.setMuted(SET.muted); muteIcon(); save(); }
function muteIcon() { $('bMute').innerHTML = SET.muted ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a5 5 0 010 8" stroke="currentColor" stroke-width="2" fill="none"/></svg>'; }
function buildMenu() {
  $('bCont').hidden = (SET.maxRound || 1) <= 1; $('bCont').textContent = fmt(T.cont, SET.maxRound);
}
function chipsRow(parent, label, opts, cur, onPick) {
  const r = document.createElement('div'); r.className = 'row'; const s = document.createElement('span'); s.textContent = label; const c = document.createElement('div'); c.className = 'chips';
  for (const [v, txt] of opts) { const b = document.createElement('button'); b.className = 'chip' + (cur === v ? ' on' : ''); b.textContent = txt; b.onclick = () => { chip.init(); chip.sfx('menu'); onPick(v); c.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); }; c.appendChild(b); }
  r.append(s, c); parent.appendChild(r);
}
function slider(parent, label, val, on) { const r = document.createElement('label'); r.className = 'sl'; const s = document.createElement('span'); s.textContent = label; const i = document.createElement('input'); i.type = 'range'; i.min = 0; i.max = 1; i.step = 0.05; i.value = val; i.oninput = () => on(+i.value); r.append(s, i); parent.appendChild(r); return i; }
function buildSettings() {
  $('tSettings').textContent = T.settings; const B = $('setBody'); B.innerHTML = '';
  chipsRow(B, T.music, ['auto', 'A', 'B', 'off'].map(k => [k, T.musicNames[k]]), SET.music, v => { SET.music = v; save(); songNow = undefined; if (phase === 'pause') { musicSync(); chip.pause(true); } });
  slider(B, T.mv, SET.mv, v => { SET.mv = v; chip.setVol(v, null); save(); });
  const sv = slider(B, T.sv, SET.sv, v => { SET.sv = v; chip.setVol(null, v); save(); }); sv.onchange = () => { chip.init(); chip.sfx('brick', { row: 3 }); };
  for (const k of ['fx', 'shake']) chipsRow(B, T[k], [[true, T.on], [false, T.off]], SET[k], v => { SET[k] = v; scr.opts = { fx: SET.fx, shake: SET.shake }; save(); });
}
function build() {
  $('pageTitle').textContent = T.title; $('logo').textContent = T.title; $('tTag').textContent = T.tag;
  const lb = $('logoBricks'); lb.innerHTML = ''; ['R', 'O', 'Y', 'G', 'C', 'B', 'V'].forEach((k, i) => { const e = document.createElement('i'); e.style.background = `linear-gradient(${shade(BRICK[k][0], 0.3)}, ${BRICK[k][0]}, ${shade(BRICK[k][0], -0.3)})`; e.style.animationDelay = (i * 0.1) + 's'; lb.appendChild(e); });
  const cl = $('capList'); cl.innerHTML = ''; for (const k of CAPS) { const p = document.createElement('span'); p.className = 'pill'; p.textContent = k; p.style.background = `linear-gradient(${shade(CAPC[k], 0.4)}, ${CAPC[k]}, ${shade(CAPC[k], -0.3)})`; const t = document.createElement('span'); t.textContent = T.caps[k]; cl.append(p, t); }
  $('lScore').textContent = T.score; $('lHi').textContent = T.hi; $('lRound').textContent = T.round; $('lLives').textContent = T.lives;
  $('bStart').textContent = T.start; $('bStart').onclick = () => start(1);
  $('bCont').onclick = () => start(SET.maxRound || 1);
  $('bSettings').textContent = T.settings; $('bRecords').textContent = T.records; $('bHelp').textContent = T.help;
  $('bSettings').onclick = () => { buildSettings(); showOnly('settings'); };
  $('bRecords').onclick = () => {
    $('tRecords').textContent = T.records; const tb = $('recTable'); tb.innerHTML = '';
    if (!BEST.length) { const td = tb.insertRow().insertCell(); td.textContent = T.none; td.style.color = '#9aa3c7'; td.style.fontWeight = '400'; }
    BEST.forEach((r, i) => { const tr = tb.insertRow(); tr.insertCell().textContent = i + 1; tr.insertCell().textContent = r.score.toLocaleString(LANG); tr.insertCell().textContent = `${r.won ? '★ ' : ''}${fmt(T.roundN, r.round)} · ${r.date}`; });
    showOnly('records');
  };
  $('bHelp').onclick = () => {
    $('tHelp').textContent = T.help; $('helpKeys').innerHTML = ''; $('helpTips').innerHTML = '';
    for (const [k, v] of T.keys) { const a = document.createElement('kbd'); a.textContent = k; const b = document.createElement('span'); b.textContent = v; $('helpKeys').append(a, b); }
    for (const t of T.tips) { const d = document.createElement('div'); d.textContent = t; $('helpTips').appendChild(d); }
    showOnly('help');
  };
  for (const id of ['bSetDone', 'bRecDone', 'bHelpDone']) { $(id).textContent = T.done; $(id).onclick = () => showOnly(phase === 'pause' ? 'pause' : 'menu'); }
  $('tPause').textContent = T.pause; $('bResume').textContent = T.resume; $('bRestart').textContent = T.restart; $('bToMenu').textContent = T.toMenu; $('bPSettings').textContent = T.settings;
  $('bResume').onclick = () => pauseGame(false); $('bRestart').onclick = () => game && start(game.startRound || 1); $('bToMenu').onclick = toMenu; $('bPSettings').onclick = () => { buildSettings(); showOnly('settings'); };
  $('bAgain').textContent = T.again; $('bResMenu').textContent = T.menu; $('bAgain').onclick = () => start(game ? game.startRound || 1 : 1); $('bResMenu').onclick = toMenu;
  $('bMute').onclick = () => { chip.init(); toggleMute(); }; muteIcon();
  $('bPause').onclick = () => { chip.init(); if (phase === 'pause') pauseGame(false); else pauseGame(true); };
}
build(); buildMenu(); layout(); showOnly('menu');
addEventListener('pointerdown', () => chip.init(), { capture: true, once: true });
requestAnimationFrame(t => { last = t; loop(t); });
document.body.focus();
window.__bk = { get game() { return game; }, get phase() { return phase; }, start, toMenu, pause: pauseGame, scr, chip };

</script>
</body>
