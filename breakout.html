<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title id="pageTitle">벽돌깨기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; outline: none; }
#ui { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; font-size: 14px; }
#ui .stat { display: flex; align-items: center; gap: 6px; }
#ui .label { color: #888; }
#ui .value { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
.lives { display: flex; gap: 2px; }
.lives span { color: #ff4466; font-size: 14px; }
#controls { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
#playBtn { background: #7c5cfc; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
#playBtn:hover { background: #6a4ce0; }
#keys { font-size: 11px; color: #666; }
canvas { border-radius: 8px; display: block; }
#overlay { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; }
#overlay.active { pointer-events: auto; }
#overlay h2 { font-size: 22px; color: #7c5cfc; }
#overlay p { font-size: 14px; color: #aaa; }
#overlay button { background: #7c5cfc; border: none; color: #fff; padding: 10px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
#overlay button:hover { background: #6a4ce0; }
.wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body tabindex="0">
<div id="controls">
  <button id="playBtn" title="시작/일시정지">▶</button>
  <span id="keys">◀▶ 패들 이동 · 마우스 이동 가능</span>
</div>
<div id="ui">
  <div class="stat"><span class="label" id="lbl-score">점수</span><span class="value" id="score">0</span></div>
  <div class="stat"><span class="label" id="lbl-level">레벨</span><span class="value" id="level">1</span></div>
  <div class="stat"><span class="label" id="lbl-lives">생명</span><span class="lives" id="lives"></span></div>
</div>
<div class="wrapper">
  <canvas id="c"></canvas>
  <div id="overlay"></div>
</div>

<script>
const LANG = 'ko';
const T = {
  ko: { title: '벽돌깨기', playBtn: '시작/일시정지', keys: '◀▶ 패들 이동 · 마우스 이동 가능', score: '점수', level: '레벨', lives: '생명', gameOver: '게임 오버', finalScore: '최종 점수:', restart: '다시 시작' },
  en: { title: 'Breakout', playBtn: 'Start/Pause', keys: '◀▶ Move paddle · Mouse supported', score: 'Score', level: 'Level', lives: 'Lives', gameOver: 'Game Over', finalScore: 'Final Score:', restart: 'Restart' },
}[LANG];
document.getElementById('pageTitle').textContent = T.title;
document.getElementById('playBtn').title = T.playBtn;
document.getElementById('keys').textContent = T.keys;
document.getElementById('lbl-score').textContent = T.score;
document.getElementById('lbl-level').textContent = T.level;
document.getElementById('lbl-lives').textContent = T.lives;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('playBtn');
const overlayEl = document.getElementById('overlay');

let W, H, scale;
const COLS = 10, ROWS = 6;
const BRICK_PAD = 4;
const PADDLE_H = 14;
const BALL_R = 6;
const BRICK_COLORS = ['#ff4466','#ff7744','#ffaa22','#44dd66','#44aaff','#7c5cfc','#cc44ff'];

let bricks, ball, paddle, particles;
let score, lives, levelNum, running, gameOver, animId;
let keys = {};

function resize() {
  const maxW = Math.min(window.innerWidth - 20, 480);
  const maxH = Math.min(window.innerHeight - 120, 600);
  const aspect = 480 / 600;
  if (maxW / maxH > aspect) { H = maxH; W = H * aspect; }
  else { W = maxW; H = W / aspect; }
  W = Math.floor(W); H = Math.floor(H);
  canvas.width = W; canvas.height = H;
  scale = W / 480;
}

function brickW() { return (W - BRICK_PAD * (COLS + 1)) / COLS; }
function brickH() { return Math.floor(20 * scale); }

function initBricks() {
  bricks = [];
  const bw = brickW(), bh = brickH();
  const rows = ROWS + Math.min(levelNum - 1, 4);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      bricks.push({
        x: BRICK_PAD + c * (bw + BRICK_PAD),
        y: 40 * scale + r * (bh + BRICK_PAD),
        w: bw, h: bh,
        color: BRICK_COLORS[r % BRICK_COLORS.length],
        alive: true,
        hp: levelNum > 2 && r < 2 ? 2 : 1
      });
    }
  }
}

function resetBall() {
  ball = {
    x: W / 2, y: H - 50 * scale,
    dx: (2.5 + levelNum * 0.3) * scale * (Math.random() > 0.5 ? 1 : -1),
    dy: -(2.5 + levelNum * 0.3) * scale,
    r: BALL_R * scale,
    onPaddle: true
  };
}

function resetPaddle() {
  const pw = (80 + 0) * scale;
  paddle = { x: W / 2 - pw / 2, y: H - 30 * scale, w: pw, h: PADDLE_H * scale };
}

function init() {
  score = 0; lives = 3; levelNum = 1; gameOver = false;
  particles = [];
  resetPaddle(); resetBall(); initBricks();
  updateUI();
}

function nextLevel() {
  levelNum++;
  resetBall(); initBricks();
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = levelNum;
  const livesEl = document.getElementById('lives');
  livesEl.innerHTML = '';
  for (let i = 0; i < lives; i++) { const s = document.createElement('span'); s.textContent = '♥'; livesEl.appendChild(s); }
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y, dx: (Math.random() - 0.5) * 4, dy: (Math.random() - 0.5) * 4,
      life: 30, color, size: 2 + Math.random() * 3
    });
  }
}

function update() {
  if (ball.onPaddle) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r;
    return;
  }

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
      ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
    ball.dy = -Math.abs(ball.dy);
    const hit = (ball.x - paddle.x) / paddle.w - 0.5;
    ball.dx = hit * 6 * scale;
    ball.y = paddle.y - ball.r;
  }

  if (ball.y > H + ball.r) {
    lives--;
    updateUI();
    if (lives <= 0) {
      gameOver = true;
      running = false;
      playBtn.textContent = '▶';
      showOverlay(T.gameOver, `${T.finalScore} ${score}`, T.restart);
    } else {
      resetBall();
    }
  }

  let allDead = true;
  for (const b of bricks) {
    if (!b.alive) continue;
    allDead = false;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        score += 10 * levelNum;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
        updateUI();
      }
      break;
    }
  }
  if (allDead) nextLevel();

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx; p.y += p.dy; p.dy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (keys['ArrowLeft'] || keys['a']) paddle.x -= 6 * scale;
  if (keys['ArrowRight'] || keys['d']) paddle.x += 6 * scale;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#111125';
  ctx.fillRect(0, 0, W, H);

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 6;
    const r = 4 * scale;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, r);
    ctx.fill();
    if (b.hp > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, r);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#7c5cfc';
  ctx.shadowColor = '#7c5cfc';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, paddle.h / 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  for (const p of particles) {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function showOverlay(title, msg, btnText) {
  overlayEl.className = 'active';
  overlayEl.style.width = W + 'px';
  overlayEl.style.height = H + 'px';
  overlayEl.innerHTML = `<h2>${title}</h2><p>${msg}</p><button onclick="restartGame()">${btnText}</button>`;
}

function hideOverlay() {
  overlayEl.className = '';
  overlayEl.innerHTML = '';
}

function restartGame() {
  hideOverlay();
  init();
  running = true;
  playBtn.textContent = '⏸';
  ball.onPaddle = false;
  loop();
  document.body.focus();
}

function togglePlay() {
  if (gameOver) { restartGame(); return; }
  if (running) {
    running = false;
    playBtn.textContent = '▶';
    cancelAnimationFrame(animId);
  } else {
    running = true;
    playBtn.textContent = '⏸';
    if (ball.onPaddle) ball.onPaddle = false;
    loop();
    document.body.focus();
  }
}

playBtn.addEventListener('click', togglePlay);

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); if (ball.onPaddle && running) ball.onPaddle = false; }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  paddle.x = e.clientX - rect.left - paddle.w / 2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
});
canvas.addEventListener('click', () => {
  if (!running) togglePlay();
  else if (ball.onPaddle) ball.onPaddle = false;
});

window.addEventListener('resize', () => {
  resize();
  resetPaddle();
  initBricks();
  resetBall();
  draw();
});

function setup() {
  resize();
  if (W < 10 || H < 10) {
    requestAnimationFrame(setup);
    return;
  }
  init();
  draw();
}
setup();
document.body.focus();
</script>
</body>
</html>
