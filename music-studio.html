<style>

// ── 드럼 (GM 번호): 킥 36, 림 37, 스네어 38, 클랩 39, 닫힌 하이햇 42, 열린 하이햇 46, 탐 41 45 48, 크래시 49, 라이드 51, 카우벨 56, 셰이커 70
const DRUM_ROWS = [36, 38, 39, 42, 46, 37, 41, 45, 48, 49, 51, 56, 70];
const DRUM_KEYS = { 36: 'kick', 37: 'rim', 38: 'snare', 39: 'clap', 42: 'chh', 46: 'ohh', 41: 'tomL', 45: 'tomM', 48: 'tomH', 49: 'crash', 51: 'ride', 56: 'cowbell', 70: 'shaker' };
const DRUM_COLORS = { 36: '#ff6b6b', 38: '#ffd93d', 39: '#ffa94d', 42: '#69db7c', 46: '#38d9a9', 37: '#e599f7', 41: '#74c0fc', 45: '#4dabf7', 48: '#339af0', 49: '#f783ac', 51: '#faa2c1', 56: '#ffe066', 70: '#c0eb75' };
const HAT_FREQS = [205.3, 304.4, 369.6, 522.7, 540, 800];       // 808 하이햇의 쇳소리 주파수
function metal(ctx, out, t, dur, vol, hp, bp) {
  const g = ctx.createGain(), f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = bp; f1.Q.value = 0.8; f2.type = 'highpass'; f2.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); expTo(g.gain, 0.0001, t + dur); f1.connect(f2); f2.connect(g); g.connect(out);
  const os = HAT_FREQS.map(fq => { const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = fq * 1.4; o.connect(f1); o.start(t); o.stop(t + dur + 0.05); return o; });
  return { g, os };
}
function noiseHit(ctx, out, t, dur, vol, type, freq, q = 1) {
  const s = noiseSrc(ctx), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); expTo(g.gain, 0.0001, t + dur); s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random()); s.stop(t + dur + 0.05); return g;
}
function toneHit(ctx, out, t, f0, f1, sweep, dur, vol, type = 'sine') {
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); expTo(o.frequency, f1, t + sweep);
  g.gain.setValueAtTime(vol, t); expTo(g.gain, 0.0001, t + dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05); return g;
}
const KITS = {
  studio: { // 실제 북에 가까운 소리
    kick(c, o, t, v) { toneHit(c, o, t, 110, 48, 0.09, 0.42, v * 1.1); noiseHit(c, o, t, 0.02, v * 0.25, 'lowpass', 3000); },
    snare(c, o, t, v) { toneHit(c, o, t, 230, 170, 0.05, 0.12, v * 0.5, 'triangle'); noiseHit(c, o, t, 0.22, v * 0.55, 'bandpass', 3800, 0.7); noiseHit(c, o, t, 0.12, v * 0.25, 'highpass', 7000); },
    clap(c, o, t, v) { for (let i = 0; i < 3; i++) noiseHit(c, o, t + i * 0.011, 0.03, v * 1.12, 'bandpass', 1500, 2); noiseHit(c, o, t + 0.033, 0.25, v * 0.88, 'bandpass', 1500, 1.5); },
    chh(c, o, t, v) { return metal(c, o, t, 0.06, v * 0.22, 7000, 10000); },

    rim(c, o, t, v) { toneHit(c, o, t, 1700, 1600, 0.01, 0.03, v * 0.35, 'triangle'); noiseHit(c, o, t, 0.02, v * 0.3, 'highpass', 4000); },
    tomL(c, o, t, v) { toneHit(c, o, t, 130, 85, 0.25, 0.45, v * 0.75); noiseHit(c, o, t, 0.03, v * 0.15, 'lowpass', 1500); },
    tomM(c, o, t, v) { toneHit(c, o, t, 180, 120, 0.22, 0.38, v * 0.7); noiseHit(c, o, t, 0.03, v * 0.15, 'lowpass', 1800); },
    tomH(c, o, t, v) { toneHit(c, o, t, 250, 170, 0.2, 0.32, v * 0.65); noiseHit(c, o, t, 0.03, v * 0.15, 'lowpass', 2200); },
    crash(c, o, t, v) { metal(c, o, t, 1.6, v * 0.13, 4500, 8000); noiseHit(c, o, t, 1.8, v * 0.2, 'highpass', 5000); },
    ride(c, o, t, v) { metal(c, o, t, 0.9, v * 0.162, 6000, 9000); toneHit(c, o, t, 3300, 3200, 0.1, 0.6, v * 0.09, 'square'); },
    cowbell(c, o, t, v) { const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 800; f.Q.value = 3; f.connect(o); toneHit(c, f, t, 540, 540, 0.01, 0.35, v * 0.35, 'square'); toneHit(c, f, t, 800, 800, 0.01, 0.3, v * 0.3, 'square'); },
    shaker(c, o, t, v) { noiseHit(c, o, t, 0.07, v * 0.25, 'highpass', 6000); },

    chh(c, o, t, v) { return metal(c, o, t, 0.045, v * 0.25, 8000, 10500); },

    ohh(c, o, t, v) { return { g: noiseHit(c, o, t, 0.3, v * 0.25, 'highpass', 8000) }; },
    rim(c, o, t, v) { toneHit(c, o, t, 900, 800, 0.02, 0.04, v * 0.4, 'triangle'); },

INSTRUMENTS.drums = { cat: 'drums', color: '#ff8f5a', def: { tone: 0.5, kit: 'studio' }, drum: true,
  play(ctx, out, m, v, t, p) {
    const kit = KITS[p.kit] || KITS.studio, fn = kit[DRUM_KEYS[m]]; if (!fn) return { stop: te => te };
    // 열린 하이햇은 닫힌 하이햇이 나오면 끊긴다 (같은 트랙 안에서)
    const vg = velGain(v) * (0.6 + p.tone * 0.8), h = fn(ctx, out, t, vg);
    if (m === 46 && h && h.g) { p._ohh = h; } else if (m === 42 && p._ohh && p._ohh.g) { try { p._ohh.g.gain.cancelScheduledValues(t); p._ohh.g.gain.setTargetAtTime(0, t, 0.01); } catch (e) { /* 무시 */ } p._ohh = null; }
    return { stop: te => te };
  } };

// ───────────────────────── 작업실 엔진: 프로젝트 · 믹서 · 재생 · 내보내기 ─────────────────────────
// 시간 단위는 박(beat, 4분음표). 마디 = sig 박.
const TRACK_COLORS = ['#5aa9ff', '#ff8f5a', '#ffd23f', '#56d6c9', '#ff5fa2', '#c77dff', '#9be15d', '#ff7b7b', '#e09f3e', '#74c0fc'];
let UID = 1; const uid = p => p + (UID++).toString(36) + Math.random().toString(36).slice(2, 5);
const clone = o => JSON.parse(JSON.stringify(o));
const dbGain = db => (db <= -60 ? 0 : Math.pow(10, db / 20));

function newTrack(inst, name, i = 0) {
  const I = INSTRUMENTS[inst];

// ── 재생 · 녹음

}

// ── 실시간 연주 (자판 · 화면 건반 · 패드)

}
addEventListener('keydown', e => {
  if (document.querySelector('.ov') || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.target.isContentEditable) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyZ') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
  if (mod && e.code === 'KeyD') { e.preventDefault(); duplicateRegion(); return; }
  if (mod && e.code === 'KeyA' && VIEW.btab === 'editor') { e.preventDefault(); const r = selRegion(); if (r) { NSEL = new Set(r.notes); drawRoll(); } return; }
  if (mod) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
  if (e.code === 'Enter') { e.preventDefault(); goStart(); return; }
  if (e.code === 'KeyR' && !e.repeat) { record(); return; }
  if (e.code === 'Delete' || e.code === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.code === 'KeyZ' && !e.repeat) { VIEW.oct = clamp(VIEW.oct - 1, 0, 8); toast(fmt(T.octaveIs, { n: 'C' + VIEW.oct })); saveView(); renderKeysIfOpen(); return; }
  if (e.code === 'KeyX' && !e.repeat) { VIEW.oct = clamp(VIEW.oct + 1, 0, 8); toast(fmt(T.octaveIs, { n: 'C' + VIEW.oct })); saveView(); renderKeysIfOpen(); return; }
  if (e.code === 'KeyC' && !e.repeat) { VIEW.vel = clamp(VIEW.vel - 16, 15, 127); toast(fmt(T.velIs, { n: VIEW.vel })); saveView(); return; }
  if (e.code === 'KeyV' && !e.repeat) { VIEW.vel = clamp(VIEW.vel + 16, 15, 127); toast(fmt(T.velIs, { n: VIEW.vel })); saveView(); return; }
  if (VIEW.btab === 'editor' && NSEL.size && /^Arrow/.test(e.code)) { e.preventDefault(); nudgeNotes(e.code, e.shiftKey); return; }
  if (e.code === 'KeyQ' && !e.repeat) { quantizeSel(); return; }
  if (e.repeat) return;
  const p = typedPitch(e.code); if (p != null) { e.preventDefault(); liveOn('k' + e.code, p); }
});

function regionEl(r, tr) {

function shade(hex, pct) { const n = parseInt(hex.slice(1), 16), f = c => clamp(Math.round(c * (1 + pct / 100)), 0, 255); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }

    selectTrackQuiet(tr.id);
    const now = performance.now(); if (now - lastTap.t < 380 && Math.abs(e.clientX - lastTap.x) < 20 && lastTap.id === tr.id) { createRegionAt(tr, beat); lastTap.t = 0; return; }

    return;
  }
  const r = regionOf(rEl.dataset.r); if (!r) return; e.preventDefault();
  const now = performance.now(); const dbl = now - lastTap.t < 380 && lastTap.id === r.id; lastTap = { t: 0, x: e.clientX, id: r.id };   // 두 번 누르기 후보는 움직이지 않은 누름만
  selectRegion(r); if (dbl) { VIEW.btab = 'editor'; renderBottom(); return; }

  rEl.setPointerCapture(e.pointerId); beginEdit();

    if (rEl._lp) return; const dx = (ev.clientX - st.x) / VIEW.ppb; if (!st.moved && Math.hypot(ev.clientX - st.x, ev.clientY - st.y) < 5) return; st.moved = true;
    if (mode === 'resize') { r.len = Math.max(snapBeats() >= 1 ? 1 : 0.25, snapB(st.len + dx)); rEl.style.width = r.len * VIEW.ppb + 'px'; return; }
    if (st.copy && !st.copied) { st.copied = clone(r); st.copied.id = uid('r'); P.regions.push(st.copied); lanes.querySelector(`.lane[data-t="${r.track}"]`).appendChild(regionEl(st.copied, trackOf(r.track))); }

  };

    if (rEl._lp) { rEl._lp = false; editBase = null; return; }

    if (st.moved) { if (st.copied) { const keep = st.copied; keep.start = st.start; keep.track = st.track; SEL.r = r.id; } SEL.t = r.track; commit(); } else editBase = null;
  };

function selectTrackQuiet(id) { if (SEL.t === id) return; SEL.t = id; SEL.r = null; heads.querySelectorAll('.head').forEach(h => h.classList.toggle('sel', h.dataset.t === id)); lanes.querySelectorAll('.lane').forEach(h => h.classList.toggle('sel', h.dataset.t === id)); lanes.querySelectorAll('.region.sel').forEach(x => x.classList.remove('sel')); renderBottom(); renderInspector(); }

}

// ── 눈금자: 위쪽 띠를 끌면 사이클 구간, 아래쪽을 누르면 재생 위치

  const wrap = $('rulerWrap'), w = wrap.clientWidth, h = wrap.clientHeight, dpr = Math.min(2, devicePixelRatio || 1); if (!w) return;
  rulerC.width = w * dpr; rulerC.height = h * dpr; rulerC.style.width = w + 'px'; rulerC.style.height = h + 'px';
  const c = rulerC.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, w, h);
  const sx = lanesWrap.scrollLeft, ppb = VIEW.ppb, sig = P.sig;
  if (P.cycle.end > P.cycle.start) { c.fillStyle = P.cycle.on ? 'rgba(214,164,0,.85)' : 'rgba(214,164,0,.25)'; c.fillRect(P.cycle.start * ppb - sx, 1, (P.cycle.end - P.cycle.start) * ppb, 11); }

$('rulerWrap').addEventListener('pointerdown', e => {

 lower its volume.":"Baisse le fader de la première piste pour réduire son volume.","Double-click a fader to reset it to 0 dB.":"Double-clique sur un fader pour le remettre à 0 dB.","Slide the second track's pan control to place it left or right.":"Fais glisser le panoramique de la deuxième piste pour la placer à gauche ou à droite.","Spreading instruments left and right makes the mix clearer. REV (reverb) and DLY (delay) work the same way.":"Répartir les instruments à gauche et à droite rend le mix plus clair. REV (réverbération) et DLY (délai) fonctionnent de la même façon.","Open the {t:project} menu.":"Ouvre le menu {t:project}.","{t:exportWav} makes an audio file; {t:exportMidi} makes a note file other music apps can open.":"{t:exportWav} crée un fichier audio ; {t:exportMidi} crée un fichier de notes que d'autres applis de musique peuvent ouvrir.","Making a song":"Créer un morceau","Programming a drum beat":"Programmer un rythme de batterie","Build a basic beat with kick, snare and hi-hat in the step sequencer.":"Crée un rythme de base avec grosse caisse, caisse claire et charleston dans le séquenceur pas à pas.","Press {t:newRegion} at the bottom.":"Appuie sur {t:newRegion} en bas.","A one-bar region appears with a 16-step sequencer. Each step is a sixteenth note.":"Une région d'une mesure apparaît avec un séquenceur à 16 pas. Chaque pas est une double croche.","Click steps 1 and 9 on the Kick row.":"Clique sur les pas 1 et 9 de la ligne grosse caisse (Kick).","A thump on beats 1 and 3.":"Un coup sourd sur les temps 1 et 3.","Click steps 5 and 13 on the Snare row.":"Clique sur les pas 5 et 13 de la ligne caisse claire (Snare).","Snare on beats 2 and 4: the backbone of most pop and rock beats.":"La caisse claire sur les temps 2 et 4 : la colonne vertébrale de la plupart des rythmes pop et rock.","Click the eight odd steps 1, 3, 5 … 15 on the Closed Hat row.":"Clique sur les huit pas impairs 1, 3, 5 … 15 de la ligne charleston fermé (Closed Hat).","Eighth notes that keep the pulse moving.":"Des croches qui font avancer la pulsation.","Press {i:play} to listen. Change steps while it plays.":"Appuie sur {i:play} pour écouter. Modifie les pas pendant la lecture.","Right-click a step (long-press on a phone) to change its loudness.":"Fais un clic droit sur un pas (appui long sur téléphone) pour changer son intensité.","The automatic drummer":"Le batteur automatique","Pick a style and get four bars of drumming.":"Choisis un style et obtiens quatre mesures de batterie.","Press {t:drummer} at the bottom.":"Appuie sur {t:drummer} en bas.","Under {t:style}, choose {t:styles.rock}.":"Dans {t:style}, choisis {t:styles.rock}.","You can audition it first with ▶ {t:preview}.":"Tu peux d'abord l'écouter avec ▶ {t:preview}.","Press {t:apply}.":"Appuie sur {t:apply}.","Four bars of rhythm with a fill in the last bar. Fine-tune it in the step sequencer.":"Quatre mesures de rythme avec un break dans la dernière mesure. Affine-le dans le séquenceur pas à pas.","Press {i:play} to listen.":"Appuie sur {i:play} pour écouter.","Laying down chords":"Poser des accords","Add a chord progression on the piano over the drums.":"Ajoute une grille d'accords au piano par-dessus la batterie.","Click the {t:inst.piano} track header on the left.":"Clique sur l'en-tête de la piste {t:inst.piano} à gauche.","Press {t:chords} at the bottom.":"Appuie sur {t:chords} en bas.","Under {t:progression}, pick the second one (vi–IV–I–V). The chord names appear below.":"Dans {t:progression}, choisis la deuxième (vi–IV–I–V). Les noms des accords apparaissent en dessous.","In C major that is Am – F – C – G, used in countless songs.":"En do majeur (C), cela donne Am – F – C – G, utilisé dans d'innombrables chansons.","Under {t:pattern}, choose {t:patterns.arp}.":"Dans {t:pattern}, choisis {t:patterns.arp}.","The chord notes are played one at a time instead of all together.":"Les notes de l'accord sont jouées une par une au lieu d'ensemble.","Press {i:play} to hear it with the drums.":"Appuie sur {i:play} pour l'écouter avec la batterie.","Use the same feature on a bass track to get a bass line.":"Utilise la même fonction sur une piste de basse pour obtenir une ligne de basse.","Drawing a melody in the piano roll":"Dessiner une mélodie dans le piano roll","Draw a short melody with the pencil.":"Dessine une courte mélodie avec le crayon.","Click in the piano roll to place at least 4 notes. Higher up is higher pitch; further right is later.":"Clique dans le piano roll pour placer au moins 4 notes. Plus haut, c'est plus aigu ; plus à droite, c'est plus tard.","Drag a note to move it, drag its right edge to change the length, double-click to delete.":"Fais glisser une note pour la déplacer, fais glisser son bord droit pour changer sa durée, double-clique pour la supprimer.","Choose 1/8 in the {t:grid} box. New notes snap to eighth notes.":"Choisis 1/8 dans la case {t:grid}. Les nouvelles notes s'alignent sur les croches.","Press {t:quantize} to snap off-beat notes to the grid (key Q).":"Appuie sur {t:quantize} pour caler sur la grille les notes décalées (touche Q).","You can also shape the sound in the {t:inspector} on the left.":"Tu peux aussi façonner le son dans {t:inspector}, à gauche.","Recording from the keys":"Enregistrer depuis le clavier","Play the piano along with the drums and record it.":"Joue du piano avec la batterie et enregistre-le.","Press R on the {t:inst.piano} track header to arm it for recording.":"Appuie sur R dans l'en-tête de la piste {t:inst.piano} pour l'armer en enregistrement.","Press {i:rec} Record (key R). The metronome counts one bar, then recording starts.":"Appuie sur {i:rec} Enregistrer (touche R). Le métronome compte une mesure, puis l'enregistrement démarre.","Play a few notes on the keys (or A S D F …), then press {i:stop} Stop.":"Joue quelques notes au clavier (ou A S D F …), puis appuie sur {i:stop} Stop.","Your playing is now a region. If the timing is loose, open it in the editor and use {t:quantize}.":"Ton jeu est maintenant une région. Si le timing est approximatif, ouvre-la dans l'éditeur et utilise {t:quantize}."},"ja":{"Learn":"学ぶ","Learn music making by doing it":"実際に操作しながら曲作りを学ぶ","Your own song and settings come back when you close this panel.":"このパネルを閉じると、あなたの曲と設定は元に戻ります。","Lessons":"レッスン一覧","Show me":"やってみせて","Restart":"最初から","Next lesson":"次のレッスン","Well done! Feel free to keep experimenting.":"よくできました！あとは自由に試してみてください。","Close":"閉じる","Collapse":"たたむ","Getting started":"はじめに","Playing and moving around":"再生と移動","Play a demo song, change the tempo and turn on cycle.":"デモ曲を再生し、テンポを変えてサイクルをオンにします。","Press {i:play} Play. The Space bar does the same.":"{i:play} 再生を押してください。Space キーでも同じです。","The playhead moves through the song. The display shows the position (bar . beat . 16th).":"再生ヘッドが曲の中を進みます。表示は現在位置（小節 . 拍 . 16分）です。","Press {i:stop} Stop in the same place.":"同じ場所の {i:stop} 停止を押してください。","Playback resumes from where you stopped.":"止めた位置から再生が再開されます。","Press {i:start} Go to start (Enter).":"{i:start} 先頭へ戻る（Enter）を押してください。","Tap the BPM box, type 120 and press Enter. Dragging up or down works too.":"BPM 欄をタップして 120 と入力し、Enter を押してください。上下にドラッグしても変えられます。","The song is faster. Only the tempo changes, not the notes.":"曲が速くなりました。変わるのはテンポだけで、音符はそのままです。","Turn on {i:cycle} Cycle. The yellow band on the ruler repeats.":"{i:cycle} サイクルをオンにしてください。ルーラーの黄色い帯の範囲が繰り返されます。","Handy when polishing one part. Drag along the top of the ruler to change the range.":"一部分を仕上げるときに便利です。ルーラーの上部をドラッグすると範囲を変えられます。","Tracks and instruments":"トラックと音源","Add piano and drum tracks and play them yourself.":"ピアノとドラムのトラックを追加して、自分で演奏してみます。","Press {i:plus} {t:addTrack} and choose {t:inst.piano}.":"{i:plus} {t:addTrack} を押して {t:inst.piano} を選んでください。","One track is one instrument.":"1つのトラックが1つの楽器です。","Open the {t:tabKeys} tab at the bottom.":"下の {t:tabKeys} タブを開いてください。","Play the on-screen keys. On a computer, A S D F G H J K are the white keys.":"画面の鍵盤を弾いてみてください。パソコンでは A S D F G H J K が白鍵です。","Press {t:octave} ▶ to go up an octave (key X; Z goes down).":"{t:octave} ▶ を押して1オクターブ上げてください（X キー、下げるのは Z）。","Now add a {t:inst.drums} track.":"次に {t:inst.drums} トラックを追加してください。","With a drum track selected, the keys become drum pads.":"ドラムトラックを選ぶと、鍵盤がドラムパッドに変わります。","Press M on the drum track header to mute it. S plays that track alone (solo).":"ドラムトラックのヘッダーの M を押してミュートしてみてください。S はそのトラックだけを鳴らします（ソロ）。","Mixing and exporting":"ミックスと書き出し","Balance volume and panning, then find the export menu.":"音量とパンのバランスを整えて、書き出しメニューを探します。","Open the {t:tabMixer} tab at the bottom.":"下の {t:tabMixer} タブを開いてください。","Each track has its own channel strip.":"トラックごとにチャンネルストリップがあります。","Pull the first track's fader down to lower its volume.":"最初のトラックのフェーダーを下げて音量を小さくしてください。","Double-click a fader to reset it to 0 dB.":"フェーダーをダブルクリックすると 0 dB に戻ります。","Slide the second track's pan control to place it left or right.":"2番目のトラックのパンを動かして、左右の位置を決めてください。","Spreading instruments left and right makes the mix clearer. REV (reverb) and DLY (delay) work the same way.":"楽器を左右に振り分けるとミックスがすっきりします。REV（リバーブ）と DLY（ディレイ）も同じように使えます。","Open the {t:project} menu.":"{t:project} メニューを開いてください。","{t:exportWav} makes an audio file; {t:exportMidi} makes a note file other music apps can open.":"{t:exportWav} はオーディオファイルを、{t:exportMidi} は他の音楽アプリで開けるノートのファイルを作ります。","Making a song":"曲を作る","Programming a drum beat":"ドラムビートを打ち込む","Build a basic beat with kick, snare and hi-hat in the step sequencer.":"ステップシーケンサーでキック・スネア・ハイハットの基本ビートを作ります。","Press {t:newRegion} at the bottom.":"下の {t:newRegion} を押してください。","A one-bar region appears with a 16-step sequencer. Each step is a sixteenth note.":"1小節のリージョンと16ステップのシーケンサーが現れます。1ステップは16分音符です。","Click steps 1 and 9 on the Kick row.":"キック（Kick）の行のステップ 1 と 9 をクリックしてください。","A thump on beats 1 and 3.":"1拍目と3拍目にドンと鳴ります。","Click steps 5 and 13 on the Snare row.":"スネア（Snare）の行のステップ 5 と 13 をクリックしてください。","Snare on beats 2 and 4: the backbone of most pop and rock beats.":"2拍目と4拍目のスネア。ほとんどのポップやロックのビートの土台です。","Click the eight odd steps 1, 3, 5 … 15 on the Closed Hat row.":"クローズドハット（Closed Hat）の行で奇数ステップ 1, 3, 5 … 15 の8つをクリックしてください。","Eighth notes that keep the pulse moving.":"8分音符が拍を刻み続けます。","Press {i:play} to listen. Change steps while it plays.":"{i:play} を押して聴いてみてください。再生中にステップを変えられます。","Right-click a step (long-press on a phone) to change its loudness.":"ステップを右クリック（スマホでは長押し）すると強さが変わります。","The automatic drummer":"自動ドラマー","Pick a style and get four bars of drumming.":"スタイルを選ぶだけで4小節のドラム演奏ができます。","Press {t:drummer} at the bottom.":"下の {t:drummer} を押してください。","Under {t:style}, choose {t:styles.rock}.":"{t:style} で {t:styles.rock} を選んでください。","You can audition it first with ▶ {t:preview}.":"▶ {t:preview} で先に試聴できます。","Press {t:apply}.":"{t:apply} を押してください。","Four bars of rhythm with a fill in the last bar. Fine-tune it in the step sequencer.":"最後の小節にフィルが入った4小節のリズムができました。ステップシーケンサーで細かく調整できます。","Press {i:play} to listen.":"{i:play} を押して聴いてみてください。","Laying down chords":"コードを敷く","Add a chord progression on the piano over the drums.":"ドラムの上にピアノでコード進行を加えます。","Click the {t:inst.piano} track header on the left.":"左の {t:inst.piano} トラックのヘッダーをクリックしてください。","Press {t:chords} at the bottom.":"下の {t:chords} を押してください。","Under {t:progression}, pick the second one (vi–IV–I–V). The chord names appear below.":"{t:progression} で2番目（vi–IV–I–V）を選んでください。下にコード名が表示されます。","In C major that is Am – F – C – G, used in countless songs.":"C メジャーでは Am – F – C – G。数えきれない曲で使われている進行です。","Under {t:pattern}, choose {t:patterns.arp}.":"{t:pattern} で {t:patterns.arp} を選んでください。","The chord notes are played one at a time instead of all together.":"コードの音が同時ではなく、1音ずつ弾かれます。","Press {i:play} to hear it with the drums.":"{i:play} を押してドラムと一緒に聴いてみてください。","Use the same feature on a bass track to get a bass line.":"ベーストラックで同じ機能を使うとベースラインができます。","Drawing a melody in the piano roll":"ピアノロールでメロディを描く","Draw a short melody with the pencil.":"鉛筆で短いメロディを描きます。","Click in the piano roll to place at least 4 notes. Higher up is higher pitch; further right is later.":"ピアノロールをクリックして音符を4つ以上置いてください。上ほど高い音、右ほど後の音です。","Drag a note to move it, drag its right edge to change the length, double-click to delete.":"音符をドラッグすると移動、右端をドラッグすると長さの変更、ダブルクリックで削除です。","Choose 1/8 in the {t:grid} box. New notes snap to eighth notes.":"{t:grid} で 1/8 を選んでください。新しい音符が8分音符にスナップします。","Press {t:quantize} to snap off-beat notes to the grid (key Q).":"{t:quantize} を押すと、拍からずれた音符がグリッドに揃います（Q キー）。","You can also shape the sound in the {t:inspector} on the left.":"左の {t:inspector} で音色を調整することもできます。","Recording from the keys":"鍵盤からレコーディング","Play the piano along with the drums and record it.":"ドラムに合わせてピアノを弾き、録音します。","Press R on the {t:inst.piano} track header to arm it for recording.":"{t:inst.piano} トラックのヘッダーの R を押して録音待機にしてください。","Press {i:rec} Record (key R). The metronome counts one bar, then recording starts.":"{i:rec} 録音を押してください（R キー）。メトロノームが1小節カウントしてから録音が始まります。","Play a few notes on the keys (or A S D F …), then press {i:stop} Stop.":"鍵盤（または A S D F …）でいくつか音を弾いてから、{i:stop} 停止を押してください。","Your playing is now a region. If the timing is loose, open it in the editor and use {t:quantize}.":"演奏がリージョンになりました。タイミングがずれていたら、エディタで開いて {t:quantize} を使ってください。"},"pt":{"Learn":"Aprender","Learn music making by doing it":"Aprenda a fazer música fazendo","Your own song and settings come back when you close this panel.":"Sua própria música e suas configurações voltam quando você fecha este painel.","Lessons":"Lições","Show me":"Mostre-me","Restart":"Recomeçar","Next lesson":"Próxima lição","Well done! Feel free to keep experimenting.":"Muito bem! Fique à vontade para continuar experimentando.","Close":"Fechar","Collapse":"Recolher","Getting started":"Primeiros passos","Playing and moving around":"Tocar e navegar","Play a demo song, change the tempo and turn on cycle.":"Toque uma música de demonstração, mude o andamento e ative o ciclo.","Press {i:play} Play. The Space bar does the same.":"Pressione {i:play} Tocar. A barra de espaço (Space) faz o mesmo.","The playhead moves through the song. The display shows the position (bar . beat . 16th).":"O cursor de reprodução percorre a música. O visor mostra a posição (compasso . tempo . semicolcheia).","Press {i:stop} Stop in the same place.":"Pressione {i:stop} Parar no mesmo lugar.","Playback resumes from where you stopped.":"A reprodução continua de onde você parou.","Press {i:start} Go to start (Enter).":"Pressione {i:start} Ir para o início (Enter).","Tap the BPM box, type 120 and press Enter. Dragging up or down works too.":"Toque na caixa BPM, digite 120 e pressione Enter. Arrastar para cima ou para baixo também funciona.","The song is faster. Only the tempo changes, not the notes.":"A música ficou mais rápida. Só o andamento muda, não as notas.","Turn on {i:cycle} Cycle. The yellow band on the ruler repeats.":"Ative {i:cycle} Ciclo. A faixa amarela na régua se repete.","Handy when polishing one part. Drag along the top of the ruler to change the range.":"Útil para lapidar uma parte. Arraste ao longo do topo da régua para mudar o intervalo.","Tracks and instruments":"Faixas e instrumentos","Add piano and drum tracks and play them yourself.":"Adicione faixas de piano e bateria e toque você mesmo.","Press {i:plus} {t:addTrack} and choose {t:inst.piano}.":"Pressione {i:plus} {t:addTrack} e escolha {t:inst.piano}.","One track is one instrument.":"Uma faixa é um instrumento.","Open the {t:tabKeys} tab at the bottom.":"Abra a aba {t:tabKeys} embaixo.","Play the on-screen keys. On a computer, A S D F G H J K are the white keys.":"Toque as teclas na tela. No computador, A S D F G H J K são as teclas brancas.","Press {t:octave} ▶ to go up an octave (key X; Z goes down).":"Pressione {t:octave} ▶ para subir uma oitava (tecla X; Z desce).","Now add a {t:inst.drums} track.":"Agora adicione uma faixa de {t:inst.drums}.","With a drum track selected, the keys become drum pads.":"Com uma faixa de bateria selecionada, as teclas viram pads de bateria.","Press M on the drum track header to mute it. S plays that track alone (solo).":"Pressione M no cabeçalho da faixa de bateria para silenciá-la. S toca só essa faixa (solo).","Mixing and exporting":"Mixagem e exportação","Balance volume and panning, then find the export menu.":"Equilibre o volume e o pan, depois encontre o menu de exportação.","Open the {t:tabMixer} tab at the bottom.":"Abra a aba {t:tabMixer} embaixo.","Each track has its own channel strip.":"Cada faixa tem seu próprio canal.","Pull the first track's fader down to lower its volume.":"Abaixe o fader da primeira faixa para diminuir o volume.","Double-click a fader to reset it to 0 dB.":"Clique duas vezes em um fader para voltar a 0 dB.","Slide the second track's pan control to place it left or right.":"Deslize o controle de pan da segunda faixa para colocá-la à esquerda ou à direita.","Spreading instruments left and right makes the mix clearer. REV (reverb) and DLY (delay) work the same way.":"Espalhar os instrumentos para a esquerda e a direita deixa a mixagem mais clara. REV (reverb) e DLY (delay) funcionam do mesmo jeito.","Open the {t:project} menu.":"Abra o menu {t:project}.","{t:exportWav} makes an audio file; {t:exportMidi} makes a note file other music apps can open.":"{t:exportWav} cria um arquivo de áudio; {t:exportMidi} cria um arquivo de notas que outros apps de música conseguem abrir.","Making a song":"Fazendo uma música","Programming a drum beat":"Programando uma batida de bateria","Build a basic beat with kick, snare and hi-hat in the step sequencer.":"Monte uma batida básica com bumbo, caixa e chimbal no sequenciador de passos.","Press {t:newRegion} at the bottom.":"Pressione {t:newRegion} embaixo.","A one-bar region appears with a 16-step sequencer. Each step is a sixteenth note.":"Aparece uma região de um compasso com um sequenciador de 16 passos. Cada passo é uma semicolcheia.","Click steps 1 and 9 on the Kick row.":"Clique nos passos 1 e 9 da linha do bumbo (Kick).","A thump on beats 1 and 3.":"Uma batida grave nos tempos 1 e 3.","Click steps 5 and 13 on the Snare row.":"Clique nos passos 5 e 13 da linha da caixa (Snare).","Snare on beats 2 and 4: the backbone of most pop and rock beats.":"Caixa nos tempos 2 e 4: a espinha dorsal da maioria das batidas de pop e rock.","Click the eight odd steps 1, 3, 5 … 15 on the Closed Hat row.":"Clique nos oito passos ímpares 1, 3, 5 … 15 da linha do chimbal fechado (Closed Hat).","Eighth notes that keep the pulse moving.":"Colcheias que mantêm o pulso andando.","Press {i:play} to listen. Change steps while it plays.":"Pressione {i:play} para ouvir. Mude os passos enquanto toca.","Right-click a step (long-press on a phone) to change its loudness.":"Clique com o botão direito em um passo (toque longo no celular) para mudar a intensidade.","The automatic drummer":"O baterista automático","Pick a style and get four bars of drumming.":"Escolha um estilo e ganhe quatro compassos de bateria.","Press {t:drummer} at the bottom.":"Pressione {t:drummer} embaixo.","Under {t:style}, choose {t:styles.rock}.":"Em {t:style}, escolha {t:styles.rock}.","You can audition it first with ▶ {t:preview}.":"Você pode ouvir antes com ▶ {t:preview}.","Press {t:apply}.":"Pressione {t:apply}.","Four bars of rhythm with a fill in the last bar. Fine-tune it in the step sequencer.":"Quatro compassos de ritmo com uma virada no último. Ajuste no sequenciador de passos.","Press {i:play} to listen.":"Pressione {i:play} para ouvir.","Laying down chords":"Colocando acordes","Add a chord progression on the piano over the drums.":"Adicione uma progressão de acordes no piano sobre a bateria.","Click the {t:inst.piano} track header on the left.":"Clique no cabeçalho da faixa {t:inst.piano} à esquerda.","Press {t:chords} at the bottom.":"Pressione {t:chords} embaixo.","Under {t:progression}, pick the second one (vi–IV–I–V). The chord names appear below.":"Em {t:progression}, escolha a segunda (vi–IV–I–V). Os nomes dos acordes aparecem embaixo.","In C major that is Am – F – C – G, used in countless songs.":"Em dó maior (C) isso é Am – F – C – G, usado em inúmeras músicas.","Under {t:pattern}, choose {t:patterns.arp}.":"Em {t:pattern}, escolha {t:patterns.arp}.","The chord notes are played one at a time instead of all together.":"As notas do acorde são tocadas uma de cada vez, em vez de todas juntas.","Press {i:play} to hear it with the drums.":"Pressione {i:play} para ouvir com a bateria.","Use the same feature on a bass track to get a bass line.":"Use o mesmo recurso numa faixa de baixo para criar uma linha de baixo.","Drawing a melody in the piano roll":"Desenhando uma melodia no piano roll","Draw a short melody with the pencil.":"Desenhe uma melodia curta com o lápis.","Click in the piano roll to place at least 4 notes. Higher up is higher pitch; further right is later.":"Clique no piano roll para colocar pelo menos 4 notas. Mais para cima é mais agudo; mais para a direita é mais tarde.","Drag a note to move it, drag its right edge to change the length, double-click to delete.":"Arraste uma nota para movê-la, arraste a borda direita para mudar a duração, clique duas vezes para apagar.","Choose 1/8 in the {t:grid} box. New notes snap to eighth notes.":"Escolha 1/8 na caixa {t:grid}. As novas notas se encaixam nas colcheias.","Press {t:quantize} to snap off-beat notes to the grid (key Q).":"Pressione {t:quantize} para alinhar à grade as notas fora do tempo (tecla Q).","You can also shape the sound in the {t:inspector} on the left.":"Você também pode moldar o som no {t:inspector} à esquerda.","Recording from the keys":"Gravando pelo teclado","Play the piano along with the drums and record it.":"Toque piano junto com a bateria e grave.","Press R on the {t:inst.piano} track header to arm it for recording.":"Pressione R no cabeçalho da faixa {t:inst.piano} para armá-la para gravação.","Press {i:rec} Record (key R). The metronome counts one bar, then recording starts.":"Pressione {i:rec} Gravar (tecla R). O metrônomo conta um compasso e então a gravação começa.","Play a few notes on the keys (or A S D F …), then press {i:stop} Stop.":"Toque algumas notas no teclado (ou A S D F …) e depois pressione {i:stop} Parar.","Your playing is now a region. If the timing is loose, open it in the editor and use {t:quantize}.":"Sua execução agora é uma região. Se o tempo ficou solto, abra-a no editor e use {t:quantize}."},"ru":{"Learn":"Обучение","Learn music making by doing it":"Учитесь создавать музыку на практике","Your own song and settings come back when you close this panel.":"Ваша собственная песня и настройки вернутся, когда вы закроете эту панель.","Lessons":"Уроки","Show me":"Показать","Restart":"Сначала","Next lesson":"Следующий урок","Well done! Feel free to keep experimenting.":"Отлично! Теперь экспериментируйте свободно.","Close":"Закрыть","Collapse":"Свернуть","Getting started":"Начало работы","Playing and moving around":"Воспроизведение и навигация","Play a demo song, change the tempo and turn on cycle.":"Включите демо-песню, измените темп и включите цикл.","Press {i:play} Play. The Space bar does the same.":"Нажмите {i:play} «Воспроизвести». Клавиша пробела (Space) делает то же самое.","The playhead moves through the song. The display shows the position (bar . beat . 16th).":"Курсор воспроизведения движется по песне. Дисплей показывает позицию (такт . доля . шестнадцатая).","Press {i:stop} Stop in the same place.":"Нажмите {i:stop} «Стоп» там же.","Playback resumes from where you stopped.":"Воспроизведение продолжится с места остановки.","Press {i:start} Go to start (Enter).":"Нажмите {i:start} «В начало» (Enter).","Tap the BPM box, type 120 and press Enter. Dragging up or down works too.":"Нажмите на поле BPM, введите 120 и нажмите Enter. Можно также тянуть вверх или вниз.","The song is faster. Only the tempo changes, not the notes.":"Песня стала быстрее. Меняется только темп, а не ноты.","Turn on {i:cycle} Cycle. The yellow band on the ruler repeats.":"Включите {i:cycle} «Цикл». Жёлтая полоса на линейке будет повторяться.","Handy when polishing one part. Drag along the top of the ruler to change the range.":"Удобно, когда шлифуете одну часть. Потяните вдоль верхнего края линейки, чтобы изменить диапазон.","Tracks and instruments":"Дорожки и инструменты","Add piano and drum tracks and play them yourself.":"Добавьте дорожки фортепиано и ударных и сыграйте на них сами.","Press {i:plus} {t:addTrack} and choose {t:inst.piano}.":"Нажмите {i:plus} {t:addTrack} и выберите {t:inst.piano}.","One track is one instrument.":"Одна дорожка — один инструмент.","Open the {t:tabKeys} tab at the bottom.":"Откройте вкладку {t:tabKeys} внизу.","Play the on-screen keys. On a computer, A S D F G H J K are the white keys.":"Играйте на экранных клавишах. На компьютере белые клавиши — это A S D F G H J K.","Press {t:octave} ▶ to go up an octave (key X; Z goes down).":"Нажмите {t:octave} ▶, чтобы подняться на октаву (клавиша X; Z — вниз).","Now add a {t:inst.drums} track.":"Теперь добавьте дорожку {t:inst.drums}.","With a drum track selected, the keys become drum pads.":"Когда выбрана дорожка ударных, клавиши превращаются в драм-пэды.","Press M on the drum track header to mute it. S plays that track alone (solo).":"Нажмите M в заголовке дорожки ударных, чтобы заглушить её. S включает только эту дорожку (соло).","Mixing and exporting":"Сведение и экспорт","Balance volume and panning, then find the export menu.":"Отрегулируйте громкость и панораму, затем найдите меню экспорта.","Open the {t:tabMixer} tab at the bottom.":"Откройте вкладку {t:tabMixer} внизу.","Each track has its own channel strip.":"У каждой дорожки свой канал микшера.","Pull the first track's fader down to lower its volume.":"Опустите фейдер первой дорожки, чтобы уменьшить громкость.","Double-click a fader to reset it to 0 dB.":"Дважды щёлкните по фейдеру, чтобы сбросить его на 0 dB.","Slide the second track's pan control to place it left or right.":"Сдвиньте регулятор панорамы второй дорожки, чтобы разместить её слева или справа.","Spreading instruments left and right makes the mix clearer. REV (reverb) and DLY (delay) work the same way.":"Разнесение инструментов влево и вправо делает микс чище. REV (реверберация) и DLY (задержка) работают так же.","Open the {t:project} menu.":"Откройте меню {t:project}.","{t:exportWav} makes an audio file; {t:exportMidi} makes a note file other music apps can open.":"{t:exportWav} создаёт аудиофайл; {t:exportMidi} создаёт файл с нотами, который откроют другие музыкальные программы.","Making a song":"Создание песни","Programming a drum beat":"Программирование барабанного бита","Build a basic beat with kick, snare and hi-hat in the step sequencer.":"Соберите базовый бит из бочки, малого барабана и хай-хэта в степ-секвенсоре.","Press {t:newRegion} at the bottom.":"Нажмите {t:newRegion} внизу.","A one-bar region appears with a 16-step sequencer. Each step is a sixteenth note.":"Появится регион длиной в один такт и 16-шаговый секвенсор. Каждый шаг — шестнадцатая нота.","Click steps 1 and 9 on the Kick row.":"Щёлкните шаги 1 и 9 в строке бочки (Kick).","A thump on beats 1 and 3.":"Удар на 1-ю и 3-ю доли.","Click steps 5 and 13 on the Snare row.":"Щёлкните шаги 5 и 13 в строке малого барабана (Snare).","Snare on beats 2 and 4: the backbone of most pop and rock beats.":"Малый барабан на 2-ю и 4-ю доли — основа большинства поп- и рок-битов.","Click the eight odd steps 1, 3, 5 … 15 on the Closed Hat row.":"Щёлкните восемь нечётных шагов 1, 3, 5 … 15 в строке закрытого хай-хэта (Closed Hat).","Eighth notes that keep the pulse moving.":"Восьмые ноты поддерживают пульсацию.","Press {i:play} to listen. Change steps while it plays.":"Нажмите {i:play}, чтобы послушать. Меняйте шаги во время воспроизведения.","Right-click a step (long-press on a phone) to change its loudness.":"Щёлкните по шагу правой кнопкой (на телефоне — долгое нажатие), чтобы изменить его громкость.","The automatic drummer":"Автоматический барабанщик","Pick a style and get four bars of drumming.":"Выберите стиль и получите четыре такта ударных.","Press {t:drummer} at the bottom.":"Нажмите {t:drummer} внизу.","Under {t:style}, choose {t:styles.rock}.":"В разделе {t:style} выберите {t:styles.rock}.","You can audition it first with ▶ {t:preview}.":"Сначала можно прослушать с помощью ▶ {t:preview}.","Press {t:apply}.":"Нажмите {t:apply}.","Four bars of rhythm with a fill in the last bar. Fine-tune it in the step sequencer.":"Четыре такта ритма со сбивкой в последнем такте. Доработайте его в степ-секвенсоре.","Press {i:play} to listen.":"Нажмите {i:play}, чтобы послушать.","Laying down chords":"Аккорды","Add a chord progression on the piano over the drums.":"Добавьте аккордовую последовательность на фортепиано поверх ударных.","Click the {t:inst.piano} track header on the left.":"Щёлкните заголовок дорожки {t:inst.piano} слева.","Press {t:chords} at the bottom.":"Нажмите {t:chords} внизу.","Under {t:progression}, pick the second one (vi–IV–I–V). The chord names appear below.":"В разделе {t:progression} выберите вторую (vi–IV–I–V). Ниже появятся названия аккордов.","In C major that is Am – F – C – G, used in countless songs.":"В до мажоре (C) это Am – F – C – G — последовательность из бесчисленных песен.","Under {t:pattern}, choose {t:patterns.arp}.":"В разделе {t:pattern} выберите {t:patterns.arp}.","The chord notes are played one at a time instead of all together.":"Ноты аккорда звучат по одной, а не все вместе.","Press {i:play} to hear it with the drums.":"Нажмите {i:play}, чтобы послушать вместе с ударными.","Use the same feature on a bass track to get a bass line.":"Используйте ту же функцию на басовой дорожке, чтобы получить басовую линию.","Drawing a melody in the piano roll":"Рисуем мелодию в пиано-ролле","Draw a short melody with the pencil.":"Нарисуйте короткую мелодию карандашом.","Click in the piano roll to place at least 4 notes. Higher up is higher pitch; further right is later.":"Щёлкайте в пиано-ролле, чтобы поставить не менее 4 нот. Выше — выше звук, правее — позже.","Drag a note to move it, drag its right edge to change the length, double-click to delete.":"Перетащите ноту, чтобы переместить её, потяните за правый край, чтобы изменить длительность, дважды щёлкните, чтобы удалить.","Choose 1/8 in the {t:grid} box. New notes snap to eighth notes.":"Выберите 1/8 в поле {t:grid}. Новые ноты будут привязываться к восьмым.","Press {t:quantize} to snap off-beat notes to the grid (key Q).":"Нажмите {t:quantize}, чтобы выровнять неточные ноты по сетке (клавиша Q).","You can also shape the sound in the {t:inspector} on the left.":"Звук можно настроить и в разделе {t:inspector} слева.","Recording from the keys":"Запись с клавиш","Play the piano along with the drums and record it.":"Сыграйте на фортепиано под ударные и запишите это.","Press R on the {t:inst.piano} track header to arm it for recording.":"Нажмите R в заголовке дорожки {t:inst.piano}, чтобы подготовить её к записи.","Press {i:rec} Record (key R). The metronome counts one bar, then recording starts.":"Нажмите {i:rec} «Запись» (клавиша R). Метроном отсчитает один такт, затем начнётся запись.","Play a few notes on the keys (or A S D F …), then press {i:stop} Stop.":"Сыграйте несколько нот на клавишах (или A S D F …), затем нажмите {i:stop} «Стоп».","Your playing is now a region. If the timing is loose, open it in the editor and use {t:quantize}.":"Ваша игра теперь стала регионом. Если ритм неточный, откройте его в редакторе и используйте {t:quantize}."},"vi":{"Learn":"Học","Learn music making by doing it":"Học làm nhạc bằng cách tự tay thực hành","Your own song and settings come back when you close this panel.":"Bài hát và cài đặt của bạn sẽ trở lại khi bạn đóng bảng này.","Lessons":"Bài học","Show me":"Chỉ cho tôi","Restart":"Làm lại","Next lesson":"Bài tiếp theo","Well done! Feel free to keep experimenting.":"Làm tốt lắm! Giờ bạn cứ thoải mái thử nghiệm.","Close":"Đóng","Collapse":"Thu gọn","Getting started":"Bắt đầu","Playing and moving around":"Phát và di chuyển","Play a demo song, change the tempo and turn on cycle.":"Phát một bài demo, đổi tempo và bật vòng lặp.","Press {i:play} Play. The Space bar does the same.":"Nhấn {i:play} Phát. Phím cách (Space) cũng có tác dụng tương tự.","The playhead moves through the song. The display shows the position (bar . beat . 16th).":"Đầu phát chạy dọc bài hát. Màn hình hiển thị vị trí (ô nhịp . phách . nốt móc kép).","Press {i:stop} Stop in the same place.":"Nhấn {i:stop} Dừng ở cùng chỗ đó.","Playback resumes from where you stopped.":"Phát tiếp từ chỗ bạn đã dừng.","Press {i:start} Go to start (Enter).":"Nhấn {i:start} Về đầu (Enter).","Tap the BPM box, type 120 and press Enter. Dragging up or down works too.":"Chạm vào ô BPM, gõ 120 rồi nhấn Enter. Kéo lên hoặc xuống cũng được.","The song is faster. Only the tempo changes, not the notes.":"Bài hát nhanh hơn. Chỉ tempo thay đổi, các nốt vẫn giữ nguyên.","Turn on {i:cycle} Cycle. The yellow band on the ruler repeats.":"Bật {i:cycle} Vòng lặp. Dải màu vàng trên thước sẽ được lặp lại.","Handy when polishing one part. Drag along the top of the ruler to change the range.":"Tiện khi chỉnh sửa một đoạn. Kéo dọc phần trên của thước để đổi phạm vi.","Tracks and instruments":"Track và nhạc cụ","Add piano and drum tracks and play them yourself.":"Thêm track piano và trống rồi tự chơi.","Press {i:plus} {t:addTrack} and choose {t:inst.piano}.":"Nhấn {i:plus} {t:addTrack} và chọn {t:inst.piano}.","One track is one instrument.":"Mỗi track là một nhạc cụ.","Open the {t:tabKeys} tab at the bottom.":"Mở tab {t:tabKeys} ở phía dưới.","Play the on-screen keys. On a computer, A S D F G H J K are the white keys.":"Chơi các phím trên màn hình. Trên máy tính, A S D F G H J K là các phím trắng.","Press {t:octave} ▶ to go up an octave (key X; Z goes down).":"Nhấn {t:octave} ▶ để lên một quãng tám (phím X; Z để xuống).","Now add a {t:inst.drums} track.":"Giờ hãy thêm một track {t:inst.drums}.","With a drum track selected, the keys become drum pads.":"Khi chọn track trống, các phím sẽ thành pad trống.","Press M on the drum track header to mute it. S plays that track alone (solo).":"Nhấn M trên đầu track trống để tắt tiếng. S chỉ phát riêng track đó (solo).","Mixing and exporting":"Mix và xuất file","Balance volume and panning, then find the export menu.":"Cân chỉnh âm lượng và pan, rồi tìm menu xuất file.","Open the {t:tabMixer} tab at the bottom.":"Mở tab {t:tabMixer} ở phía dưới.","Each track has its own channel strip.":"Mỗi track có một kênh riêng.","Pull the first track's fader down to lower its volume.":"Kéo fader của track đầu tiên xuống để giảm âm lượng.","Double-click a fader to reset it to 0 dB.":"Nhấp đúp vào fader để đưa về 0 dB.","Slide the second track's pan control to place it left or right.":"Trượt nút pan của track thứ hai để đặt nó sang trái hoặc phải.","Spreading instruments left and right makes the mix clearer. REV (reverb) and DLY (delay) work the same way.":"Chia nhạc cụ sang trái và phải giúp bản mix rõ hơn. REV (vang) và DLY (delay) hoạt động tương tự.","Open the {t:project} menu.":"Mở menu {t:project}.","{t:exportWav} makes an audio file; {t:exportMidi} makes a note file other music apps can open.":"{t:exportWav} tạo file âm thanh; {t:exportMidi} tạo file nốt nhạc mà các ứng dụng nhạc khác có thể mở.","Making a song":"Làm một bài hát","Programming a drum beat":"Lập trình nhịp trống","Build a basic beat with kick, snare and hi-hat in the step sequencer.":"Tạo một nhịp cơ bản với trống kick, snare và hi-hat trong step sequencer.","Press {t:newRegion} at the bottom.":"Nhấn {t:newRegion} ở phía dưới.","A one-bar region appears with a 16-step sequencer. Each step is a sixteenth note.":"Một vùng dài một ô nhịp xuất hiện cùng step sequencer 16 bước. Mỗi bước là một nốt móc kép.","Click steps 1 and 9 on the Kick row.":"Nhấp bước 1 và 9 ở hàng trống kick (Kick).","A thump on beats 1 and 3.":"Một tiếng thình ở phách 1 và 3.","Click steps 5 and 13 on the Snare row.":"Nhấp bước 5 và 13 ở hàng snare (Snare).","Snare on beats 2 and 4: the backbone of most pop and rock beats.":"Snare ở phách 2 và 4: xương sống của hầu hết nhịp pop và rock.","Click the eight odd steps 1, 3, 5 … 15 on the Closed Hat row.":"Nhấp tám bước lẻ 1, 3, 5 … 15 ở hàng hi-hat đóng (Closed Hat).","Eighth notes that keep the pulse moving.":"Nốt móc đơn giữ cho nhịp luôn chuyển động.","Press {i:play} to listen. Change steps while it plays.":"Nhấn {i:play} để nghe. Bạn có thể đổi các bước khi đang phát.","Right-click a step (long-press on a phone) to change its loudness.":"Nhấp chuột phải vào một bước (nhấn giữ trên điện thoại) để đổi độ mạnh.","The automatic drummer":"Tay trống tự động","Pick a style and get four bars of drumming.":"Chọn một phong cách và nhận bốn ô nhịp trống.","Press {t:drummer} at the bottom.":"Nhấn {t:drummer} ở phía dưới.","Under {t:style}, choose {t:styles.rock}.":"Trong {t:style}, chọn {t:styles.rock}.","You can audition it first with ▶ {t:preview}.":"Bạn có thể nghe thử trước bằng ▶ {t:preview}.","Press {t:apply}.":"Nhấn {t:apply}.","Four bars of rhythm with a fill in the last bar. Fine-tune it in the step sequencer.":"Bốn ô nhịp tiết tấu với một đoạn fill ở ô nhịp cuối. Tinh chỉnh trong step sequencer.","Press {i:play} to listen.":"Nhấn {i:play} để nghe.","Laying down chords":"Đặt hợp âm","Add a chord progression on the piano over the drums.":"Thêm vòng hợp âm piano lên trên phần trống.","Click the {t:inst.piano} track header on the left.":"Nhấp vào đầu track {t:inst.piano} ở bên trái.","Press {t:chords} at the bottom.":"Nhấn {t:chords} ở phía dưới.","Under {t:progression}, pick the second one (vi–IV–I–V). The chord names appear below.":"Trong {t:progression}, chọn vòng thứ hai (vi–IV–I–V). Tên hợp âm hiện ra bên dưới.","In C major that is Am – F – C – G, used in countless songs.":"Ở Đô trưởng (C) đó là Am – F – C – G, được dùng trong vô số bài hát.","Under {t:pattern}, choose {t:patterns.arp}.":"Trong {t:pattern}, chọn {t:patterns.arp}.","The chord notes are played one at a time instead of all together.":"Các nốt của hợp âm được chơi lần lượt từng nốt thay vì cùng lúc.","Press {i:play} to hear it with the drums.":"Nhấn {i:play} để nghe cùng phần trống.","Use the same feature on a bass track to get a bass line.":"Dùng cùng tính năng này trên track bass để có một dòng bass.","Drawing a melody in the piano roll":"Vẽ giai điệu trong piano roll","Draw a short melody with the pencil.":"Vẽ một giai điệu ngắn bằng bút chì.","Click in the piano roll to place at least 4 notes. Higher up is higher pitch; further right is later.":"Nhấp vào piano roll để đặt ít nhất 4 nốt. Càng lên cao càng cao âm; càng sang phải càng muộn.","Drag a note to move it, drag its right edge to change the length, double-click to delete.":"Kéo nốt để di chuyển, kéo cạnh phải để đổi độ dài, nhấp đúp để xóa.","Choose 1/8 in the {t:grid} box. New notes snap to eighth notes.":"Chọn 1/8 trong ô {t:grid}. Nốt mới sẽ bám theo nốt móc đơn.","Press {t:quantize} to snap off-beat notes to the grid (key Q).":"Nhấn {t:quantize} để đưa các nốt lệch phách về lưới (phím Q).","You can also shape the sound in the {t:inspector} on the left.":"Bạn cũng có thể chỉnh âm sắc trong {t:inspector} ở bên trái.","Recording from the keys":"Thu âm từ bàn phím","Play the piano along with the drums and record it.":"Chơi piano theo trống và thu lại.","Press R on the {t:inst.piano} track header to arm it for recording.":"Nhấn R trên đầu track {t:inst.piano} để sẵn sàng thu âm.","Press {i:rec} Record (key R). The metronome counts one bar, then recording starts.":"Nhấn {i:rec} Thu (phím R). Máy đếm nhịp đếm một ô nhịp rồi bắt đầu thu.","Play a few notes on the keys (or A S D F …), then press {i:stop} Stop.":"Chơi vài nốt trên phím (hoặc A S D F …), rồi nhấn {i:stop} Dừng.","Your playing is now a region. If the timing is loose, open it in the editor and use {t:quantize}.":"Phần chơi của bạn giờ là một vùng. Nếu nhịp chưa chuẩn, hãy mở nó trong trình chỉnh sửa và dùng {t:quantize}."},"zh-TW":{"Learn":"學習","Learn music making by doing it":"邊動手邊學做音樂","Your own song and settings come back when you close this panel.":"關閉此面板後，你自己的歌曲和設定會恢復原狀。","Lessons":"課程","Show me":"示範給我看","Restart":"重新開始","Next lesson":"下一課","Well done! Feel free to keep experimenting.":"做得好！接下來可以自由嘗試。","Close":"關閉","Collapse":"收合","Getting started":"入門","Playing and moving around":"播放與瀏覽","Play a demo song, change the tempo and turn on cycle.":"播放示範曲，調整速度並開啟循環。","Press {i:play} Play. The Space bar does the same.":"按下 {i:play} 播放。空白鍵（Space）效果相同。","The playhead moves through the song. The display shows the position (bar . beat . 16th).":"播放頭在歌曲中移動。顯示器顯示目前位置（小節 . 拍 . 十六分）。","Press {i:stop} Stop in the same place.":"按下同一位置的 {i:stop} 停止。","Playback resumes from where you stopped.":"播放會從停止的位置繼續。","Press {i:start} Go to start (Enter).":"按下 {i:start} 回到開頭（Enter）。","Tap the BPM box, type 120 and press Enter. Dragging up or down works too.":"點一下 BPM 欄，輸入 120 後按 Enter。上下拖曳也可以。","The song is faster. Only the tempo changes, not the notes.":"歌曲變快了。只有速度改變，音符不變。","Turn on {i:cycle} Cycle. The yellow band on the ruler repeats.":"開啟 {i:cycle} 循環。尺規上的黃色區域會重複播放。","Handy when polishing one part. Drag along the top of the ruler to change the range.":"修飾某一段時很方便。沿著尺規上方拖曳即可改變範圍。","Tracks and instruments":"音軌與樂器","Add piano and drum tracks and play them yourself.":"新增鋼琴和鼓的音軌，並親自演奏。","Press {i:plus} {t:addTrack} and choose {t:inst.piano}.":"按下 {i:plus} {t:addTrack}，然後選擇 {t:inst.piano}。","One track is one instrument.":"一條音軌就是一種樂器。","Open the {t:tabKeys} tab at the bottom.":"打開下方的 {t:tabKeys} 分頁。","Play the on-screen keys. On a computer, A S D F G H J K are the white keys.":"彈奏畫面上的琴鍵。在電腦上，A S D F G H J K 是白鍵。","Press {t:octave} ▶ to go up an octave (key X; Z goes down).":"按下 {t:octave} ▶ 升高一個八度（X 鍵；Z 降低）。","Now add a {t:inst.drums} track.":"現在新增一條 {t:inst.drums} 音軌。","With a drum track selected, the keys become drum pads.":"選取鼓音軌時，琴鍵會變成鼓墊。","Press M on the drum track header to mute it. S plays that track alone (solo).":"按下鼓音軌標頭的 M 將它靜音。S 只播放該音軌（獨奏）。","Mixing and exporting":"混音與匯出","Balance volume and panning, then find the export menu.":"平衡音量與聲像，然後找到匯出選單。","Open the {t:tabMixer} tab at the bottom.":"打開下方的 {t:tabMixer} 分頁。","Each track has its own channel strip.":"每條音軌都有自己的通道條。","Pull the first track's fader down to lower its volume.":"將第一條音軌的推桿往下拉，降低音量。","Double-click a fader to reset it to 0 dB.":"雙擊推桿可將它重設為 0 dB。","Slide the second track's pan control to place it left or right.":"滑動第二條音軌的聲像控制，把它放到左邊或右邊。","Spreading instruments left and right makes the mix clearer. REV (reverb) and DLY (delay) work the same way.":"把樂器分配到左右兩側，混音會更清楚。REV（殘響）和 DLY（延遲）的用法相同。","Open the {t:project} menu.":"打開 {t:project} 選單。","{t:exportWav} makes an audio file; {t:exportMidi} makes a note file other music apps can open.":"{t:exportWav} 會產生音訊檔；{t:exportMidi} 會產生其他音樂軟體可以開啟的音符檔。","Making a song":"製作歌曲","Programming a drum beat":"編寫鼓點","Build a basic beat with kick, snare and hi-hat in the step sequencer.":"在步進音序器中用大鼓、小鼓和腳踏鈸做出基本節拍。","Press {t:newRegion} at the bottom.":"按下下方的 {t:newRegion}。","A one-bar region appears with a 16-step sequencer. Each step is a sixteenth note.":"出現一個一小節的區段和 16 步音序器。每一步是一個十六分音符。","Click steps 1 and 9 on the Kick row.":"點選大鼓（Kick）列的第 1 和第 9 步。","A thump on beats 1 and 3.":"第 1 拍和第 3 拍響起「咚」的一聲。","Click steps 5 and 13 on the Snare row.":"點選小鼓（Snare）列的第 5 和第 13 步。","Snare on beats 2 and 4: the backbone of most pop and rock beats.":"第 2、4 拍的小鼓：大多數流行與搖滾節拍的骨幹。","Click the eight odd steps 1, 3, 5 … 15 on the Closed Hat row.":"在閉合腳踏鈸（Closed Hat）列點選 8 個奇數步 1, 3, 5 … 15。","Eighth notes that keep the pulse moving.":"八分音符讓律動持續前進。","Press {i:play} to listen. Change steps while it plays.":"按下 {i:play} 試聽。播放時也可以修改步。","Right-click a step (long-press on a phone) to change its loudness.":"在某一步按右鍵（手機上長按）可改變力度。","The automatic drummer":"自動鼓手","Pick a style and get four bars of drumming.":"選一種風格，就能得到四小節的鼓點。","Press {t:drummer} at the bottom.":"按下下方的 {t:drummer}。","Under {t:style}, choose {t:styles.rock}.":"在 {t:style} 中選擇 {t:styles.rock}。","You can audition it first with ▶ {t:preview}.":"可以先用 ▶ {t:preview} 試聽。","Press {t:apply}.":"按下 {t:apply}。","Four bars of rhythm with a fill in the last bar. Fine-tune it in the step sequencer.":"四小節節奏，最後一小節帶有過門。可以在步進音序器裡微調。","Press {i:play} to listen.":"按下 {i:play} 試聽。","Laying down chords":"鋪上和弦","Add a chord progression on the piano over the drums.":"在鼓的上方用鋼琴加入和弦進行。","Click the {t:inst.piano} track header on the left.":"點選左側的 {t:inst.piano} 音軌標頭。","Press {t:chords} at the bottom.":"按下下方的 {t:chords}。","Under {t:progression}, pick the second one (vi–IV–I–V). The chord names appear below.":"在 {t:progression} 中選擇第二個（vi–IV–I–V）。下方會顯示和弦名稱。","In C major that is Am – F – C – G, used in countless songs.":"在 C 大調中就是 Am – F – C – G，無數歌曲都用過。","Under {t:pattern}, choose {t:patterns.arp}.":"在 {t:pattern} 中選擇 {t:patterns.arp}。","The chord notes are played one at a time instead of all together.":"和弦的音會一個一個彈出，而不是同時發聲。","Press {i:play} to hear it with the drums.":"按下 {i:play}，和鼓一起聽聽看。","Use the same feature on a bass track to get a bass line.":"在貝斯音軌使用同樣的功能，就能得到貝斯線。","Drawing a melody in the piano roll":"在鋼琴捲簾中畫出旋律","Draw a short melody with the pencil.":"用鉛筆畫一段短旋律。","Click in the piano roll to place at least 4 notes. Higher up is higher pitch; further right is later.":"在鋼琴捲簾中點選，放置至少 4 個音符。越往上音越高，越往右越晚。","Drag a note to move it, drag its right edge to change the length, double-click to delete.":"拖曳音符可移動，拖曳右邊緣可改變長度，雙擊可刪除。","Choose 1/8 in the {t:grid} box. New notes snap to eighth notes.":"在 {t:grid} 欄中選擇 1/8。新音符會對齊到八分音符。","Press {t:quantize} to snap off-beat notes to the grid (key Q).":"按下 {t:quantize} 把偏離節拍的音符對齊格線（Q 鍵）。","You can also shape the sound in the {t:inspector} on the left.":"也可以在左側的 {t:inspector} 中調整音色。","Recording from the keys":"用琴鍵錄音","Play the piano along with the drums and record it.":"跟著鼓點彈鋼琴並錄下來。","Press R on the {t:inst.piano} track header to arm it for recording.":"按下 {t:inst.piano} 音軌標頭的 R，讓它進入錄音待命。","Press {i:rec} Record (key R). The metronome counts one bar, then recording starts.":"按下 {i:rec} 錄音（R 鍵）。節拍器先數一小節，然後開始錄音。","Play a few notes on the keys (or A S D F …), then press {i:stop} Stop.":"在琴鍵（或 A S D F …）上彈幾個音，然後按下 {i:stop} 停止。","Your playing is now a region. If the timing is loose, open it in the editor and use {t:quantize}.":"你的演奏現在成了一個區段。如果節奏不穩，在編輯器中開啟它並使用 {t:quantize}。"},"zh":{"Learn":"学习","Learn music making by doing it":"边动手边学做音乐","Your own song and settings come back when you close this panel.":"关闭此面板后，你自己的歌曲和设置会恢复原样。","Lessons":"课程","Show me":"演示给我看","Restart":"重新开始","Next lesson":"下一课","Well done! Feel free to keep experimenting.":"做得好！接下来可以随意尝试。","Close":"关闭","Collapse":"收起","Getting started":"入门","Playing and moving around":"播放与浏览","Play a demo song, change the tempo and turn on cycle.":"播放演示曲，修改速度并开启循环。","Press {i:play} Play. The Space bar does the same.":"按 {i:play} 播放。空格键（Space）效果相同。","The playhead moves through the song. The display shows the position (bar . beat . 16th).":"播放头在歌曲中移动。显示屏显示当前位置（小节 . 拍 . 十六分）。","Press {i:stop} Stop in the same place.":"按同一位置的 {i:stop} 停止。","Playback resumes from where you stopped.":"播放会从停止的位置继续。","Press {i:start} Go to start (Enter).":"按 {i:start} 回到开头（Enter）。","Tap the BPM box, type 120 and press Enter. Dragging up or down works too.":"点按 BPM 框，输入 120 后按 Enter。上下拖动也可以。","The song is faster. Only the tempo changes, not the notes.":"歌曲变快了。只有速度改变，音符不变。","Turn on {i:cycle} Cycle. The yellow band on the ruler repeats.":"开启 {i:cycle} 循环。标尺上的黄色区域会重复播放。","Handy when polishing one part. Drag along the top of the ruler to change the range.":"打磨某一段时很方便。沿标尺顶部拖动可以改变范围。","Tracks and instruments":"音轨与乐器","Add piano and drum tracks and play them yourself.":"添加钢琴和鼓音轨，并亲自演奏。","Press {i:plus} {t:addTrack} and choose {t:inst.piano}.":"按 {i:plus} {t:addTrack}，然后选择 {t:inst.piano}。","One track is one instrument.":"一条音轨就是一件乐器。","Open the {t:tabKeys} tab at the bottom.":"打开底部的 {t:tabKeys} 标签页。","Play the on-screen keys. On a computer, A S D F G H J K ar ,"Press {i:play} to listen. Change steps while it plays.":"按 {i:play} 试听。播放时也可以修改步。","Right-click a step (long-press on a phone) to change its loudness.":"右键点击某一步（手机上长按）可改变其力度。","The automatic drummer":"自动鼓手","Pick a style and get four bars of drumming.":"选择一种风格，即可得到四小节鼓点。","Press {t:drummer} at the bottom.":"按底部的 {t:drummer}。","Under {t:style}, choose {t:styles.rock}.":"在 {t:style} 中选择 {t:styles.rock}。","You can audition it first with ▶ {t:preview}.":"可以先用 ▶ {t:preview} 试听。","Press {t:apply}.":"按 {t:apply}。","Four bars of rhythm with a fill in the last bar. Fine-tune it in the step sequencer.":"四小节节奏，最后一小节带加花。可以在步进音序器里微调。","Press {i:play} to listen.":"按 {i:play} 试听。","Laying down chords":"铺设和弦","Add a chord progression on the piano over the drums.":"在鼓的上方用钢琴加入和弦进行。","Click the {t:inst.piano} track header on the left.":"点击左侧的 {t:inst.piano} 音轨头部。","Press {t:chords} at the bottom.":"按底部的 {t:chords}。","Under {t:progression}, pick the second one (vi–IV–I–V). The chord names appear below.":"在 {t:progression} 中选择第二个（vi–IV–I–V）。下方会显示和弦名称。","In C major that is Am – F – C – G, used in countless songs.":"在 C 大调中就是 Am – F – C – G，无数歌曲都用过。","Under {t:pattern}, choose {t:patterns.arp}.":"在 {t:pattern} 中选择 {t:patterns.arp}。","The chord notes are played one at a time instead of all together.":"和弦的音逐个弹出，而不是同时发声。","Press {i:play} to hear it with the drums.":"按 {i:play}，和鼓一起听听。","Use the same feature on a bass track to get a bass line.":"在贝斯音轨上使用同样的功能，就能得到贝斯线。","Drawing a melody in the piano roll":"在钢琴卷帘中画旋律","Draw a short melody with the pencil.":"用铅笔画一段短旋律。","Click in the piano roll to place at least 4 notes. Higher up is higher pitch; further right is later.":"在钢琴卷帘中点击，放置至少 4 个音符。越往上音越高，越往右越晚。","Drag a note to move it, drag its right edge to change the length, double-click to delete.":"拖动音符可移动，拖动右边缘可改变长度，双击可删除。","Choose 1/8 in the {t:grid} box. New notes snap to eighth notes.":"在 {t:grid} 框中选择 1/8。新音符会吸附到八分音符上。","Press {t:quantize} to snap off-beat notes to the grid (key Q).":"按 // ───────────────────────── 배우기: 옆 패널 + 따라 하는 수업 ─────────────────────────
// 수업 = 단계 목록. 단계마다 누를 곳(target)이 빛나고, 곡 상태가 목표(done)대로 바뀌면 다음 단계로 넘어간다.
// '보여주기'(show)는 작업실이 직접 그 조작을 한다. 수업 동안 사용자의 곡·화면 설정은 따로 두었다가(TUT_NOSAVE)
// 패널을 닫으면 원래대로 돌린다. 문장은 ko·en 을 여기에, 나머지 언어는 TUT_I18N(i18n/*.json, 영어 문장이 열쇠).
(() => {
  const TL = (() => { const l = String(LANG).toLowerCase(); if (/^zh-(tw|hk|mo|hant)/.test(l)) return 'zh-TW'; const b = l.split(/[-_]/)[0]; return ['ko', 'en', 'ja', 'zh', 'es', 'fr', 'de', 'pt', 'ru', 'vi'].includes(b) ? b : 'en'; })();
  const S = (ko, en) => ({ ko, en });
  const tx = o => (o && (o[TL] || (TUT_I18N[TL] && TUT_I18N[TL][o.en]) || o.en)) || '';
  const lab = path => path.split('.').reduce((o, k) => (o ? o[k] : ''), T) || '';
  // {i:아이콘} → 작업실 아이콘, {t:이름} → 작업실 화면에 쓰인 그 언어의 이름
  const rich = s => esc(s).replace(/\{i:(\w+)\}/g, (_, k) => `<span class="tci">${svg(k)}</span>`).replace(/\{t:([\w.]+)\}/g, (_, k) => `<b class="tct">${esc(lab(k))}</b>`);
  const q = sel => (typeof sel === 'string' ? document.querySelector(sel) : sel);
  const click = sel => { const e = q(sel); if (e) e.click(); return !!e; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const playing = () => !!(TR && TR.playing);
  const trOf = inst => P.tracks.find(t => t.inst === inst);
  const regsOf = inst => { const t = trOf(inst); return t ? P.regions.filter(r => r.track === t.id) : []; };
  const notesOf = inst => regsOf(inst).reduce((n, r) => n + r.notes.length, 0);
  const hasNote = (r, p, s) => !!r && r.notes.some(n => n.p === p && Math.abs(n.s - s) < 0.06);
  const dlg = sel => document.querySelector('.ov ' + sel);
  const chipOn = sel => { const e = dlg(sel); return !!e && e.classList.contains('on'); };
  const head = inst => { const t = trOf(inst); return t ? `.head[data-t="${t.id}"]` : '#heads'; };
  const setRange = (sel, v) => { const e = q(sel); if (!e) return; e.dispatchEvent(new Event('pointerdown')); e.value = v; e.dispatchEvent(new Event('input')); e.dispatchEvent(new Event('change')); };
  const addInst = inst => ({ target: () => dlg(`.opt[data-k="${inst}"]`) || '#bAddTrack', done: () => !!trOf(inst), show: async () => { if (!dlg('#il')) click('#bAddTrack'); await wait(250); click(dlg(`.opt[data-k="${inst}"]`)); } });
  const playStep = (say, after) => ({ say, after, target: '#bPlay', done: () => playing(), show: () => click('#bPlay') });
  const stepCell = (p, cells) => ({ target: () => { const r = selRegion(), s = cells.find(c => !hasNote(r, p, c / 4)); return s == null ? null : `.ssrow .step[data-p="${p}"][data-s="${s}"]`; }, done: () => cells.every(c => hasNote(selRegion(), p, c / 4)), show: async () => { for (const c of cells) { if (!hasNote(selRegion(), p, c / 4)) { click(`.ssrow .step[data-p="${p}"][data-s="${c}"]`); await wait(160); } } } });

  // ── 수업 곡
  const proj = {
    demo: () => DEMOS[0].make(),

  async function showMe() {
    const st = stepOf(); if (!st || TUT.busy) return; TUT.busy = true; render();
    try { ensureAudio(); await st.show(); } finally { TUT.busy = false; await wait(120); tick(); render(); }
  }
  // 연주했는지(화면 건반·패드·자판), 퀀타이즈를 눌렀는지
  addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#keys, #pads')) TUT.played = true; }, true);
  addEventListener('keydown', e => { if (e.code in TYPE_KEYS) TUT.played = true; if (e.code === 'KeyQ') TUT.quant = true; }, true);
  addEventListener('click', e => { if (e.target.closest && e.target.closest('#bQuant')) TUT.quant = true; setTimeout(tick, 60); }, true);
  setInterval(() => { if (TUT.open && TUT.L) tick(); }, 250);

  // ── 빛내기
  function mark() {
    document.querySelectorAll('.tut-hl').forEach(e => e.classList.remove('tut-hl'));
    const st = stepOf(); if (!TUT.open || !st) return;
    let t = typeof st.target === 'function' ? st.target() : st.target; t = q(t); if (t) t.classList.add('tut-hl');
  }

  // ── 패널
  const css = document.createElement('style');
  css.textContent = `
#tut{position:fixed;right:12px;top:52px;width:350px;max-height:calc(100% - 64px);display:flex;flex-direction:column;z-index:55;background:rgba(36,37,43,.97);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);color:var(--text);font-size:13px;line-height:1.55;user-select:text;-webkit-user-select:text}
#tut[hidden]{display:none}
#tut header{display:flex;align-items:center;gap:8px;padding:11px 10px 10px 16px;border-bottom:1px solid var(--line)}
#tut header>div{flex:1;min-width:0}#tut header b{display:block;font-size:15px}#tut header small{color:var(--sub);font-size:11.5px}
#tut header .crumb{flex:1;text-align:center;color:var(--sub);font-size:12px}
#tut .x{width:28px;height:28px;border-radius:7px;border:0;background:none;color:var(--sub);font-size:18px;cursor:pointer;display:grid;place-items:center}
#tut .x:hover,#tut .back:hover{background:var(--panel2);color:var(--text)}
#tut .back{border:0;background:none;color:var(--sub);cursor:pointer;padding:5px 7px;border-radius:7px;font-size:12px}
#tut .tb{overflow:auto;padding:12px 16px 16px;min-height:0}
#tut.fold .tb{display:none}
#tut h3{margin:4px 0 6px;font-size:11.5px;letter-spacing:.06em;color:var(--acc2);display:flex;justify-content:space-between}
#tut h3 span{color:var(--sub);font-weight:500}
#tut section+section{margin-top:14px}
#tut ol{list-style:none;margin:0;padding:0}
#tut section li button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 6px;border-radius:9px;border:0;background:none;cursor:pointer;color:inherit}
#tut section li button:hover{background:var(--panel2)}
#tut section li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--panel2);color:var(--sub)}
#tut section li b{display:block;font-size:13.5px}#tut section li small{display:block;color:var(--sub);font-size:12px}
#tut .note{margin:14px 0 0;color:var(--dim);font-size:11.5px}
#tut h2{font-size:16px;margin:0 0 3px;text-wrap:balance}#tut .goal{color:var(--sub);margin:0 0 12px;font-size:12.5px}
#tut .steps{display:flex;flex-direction:column;gap:8px}
#tut .steps li{padding:10px 11px;border-radius:10px;border:1px solid var(--line)}
#tut .steps li.cur{border-color:rgba(255,204,51,.6);background:rgba(255,204,51,.07)}
#tut .steps li.past{opacity:.65}#tut .steps li.past .say::before{content:'✓ ';color:var(--ok);font-weight:700}
#tut .after{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:#c9cad6}
#tut .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#tut .row button{padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--text);cursor:pointer;font-size:12.5px}
#tut .row button:hover{background:var(--panel2)}#tut .row button[disabled]{opacity:.45;cursor:default}
#tut .row .pri{background:var(--acc2);border-color:var(--acc2);color:#1b1a10;font-weight:700;margin-left:auto}
#tut .done p{margin:12px 0 0;color:var(--acc2);font-weight:600}
#tut .tci{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);vertical-align:-5px;margin:0 1px}#tut .tci svg{width:13px;height:13px}
#tut .tct{color:#fff;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-weight:600;white-space:nowrap}
.tut-hl{outline:2px solid var(--acc2)!important;outline-offset:2px;animation:tutglow 1.1s ease-in-out infinite;border-radius:6px}
@keyframes tutglow{50%{outline-color:rgba(255,204,51,.25)}}
@media (prefers-reduced-motion:reduce){.tut-hl{animation:none}}
@media (min-width:900px){body.tut-open #main{margin-right:352px}body.tut-open #tut{right:0;bottom:0;width:352px;max-height:none;border-radius:0;border-right:0;border-bottom:0;box-shadow:none}}
@media (max-width:760px){#tut{left:8px;right:8px;width:auto;top:46px;max-height:32vh}#tut .steps li.past,#tut .goal{display:none}#tut .tb{padding:8px 12px 10px}#tut h2{font-size:14px;margin-bottom:6px}}`;
  document.head.appendChild(css);
  IC.learn = '<path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20.5A2.5 2.5 0 006.5 23H20v-5" fill="none" stroke="currentColor" stroke-width="1.8"/>';
  const btn = document.createElement('button'); btn.className = 'ib'; btn.id = 'bLearn'; btn.title = tx(W.title);
  btn.innerHTML = `${svg('learn')}<span class="hide-m">${esc(tx(W.title))}</span>`; btn.style.color = 'var(--acc2)';
  $('bar').insertBefore(btn, $('bHelp')); btn.onclick = () => setOpen(!TUT.open);
  const pane = document.createElement('aside'); pane.id = 'tut'; pane.hidden = true; document.body.appendChild(pane);
  function setOpen(on) {
    TUT.open = on; pane.hidden = !on; btn.classList.toggle('on', on); document.body.classList.toggle('tut-open', on);
    pane.style.top = $('bar').offsetHeight + (innerWidth >= 900 ? 0 : 6) + 'px';
    if (!on) { TUT.L = null; restore(); }
    render(); dispatchEvent(new Event('resize'));   // 작업 화면 폭이 바뀌었으니 다시 그린다
  }
  function homeView() {
    let h = `<header><div><b>${esc(tx(W.title))}</b><small>${esc(tx(W.sub))}</small></div><button class="x" data-a="close" title="${esc(tx(W.close))}">×</button></header><div class="tb">`;
    for (const c of COURSES) {
      h += `<section><h3>${esc(tx(c.t))} <span>${c.lessons.filter(l => TUT.done.has(l.id)).length}/${c.lessons.length}</span></h3><ol>`;
      c.lessons.forEach((l, i) => { h += `<li><button data-a="go" data-l="${l.id}"><i>${TUT.done.has(l.id) ? '✓' : i + 1}</i><span><b>${esc(tx(l.t))}</b><small>${esc(tx(l.goal))}</small></span></button></li>`; });
      h += '</ol></section>';
    }
    return h + `<p class="note">${esc(tx(W.note))}</p></div>`;
  }
  function lessonView() {
    const L = TUT.L, idx = L.course.lessons.findIndex(x => x.id === L.id) + 1, fin = TUT.si >= L.steps.length;
    let h = `<header><button class="back" data-a="home">◀ ${esc(tx(W.list))}</button><span class="crumb">${esc(tx(L.course.t))} · ${idx}/${L.course.lessons.length}</span><button class="x" data-a="fold" title="${esc(tx(W.fold))}">${TUT.fold ? '▾' : '▴'}</button><button class="x" data-a="close" title="${esc(tx(W.close))}">×</button></header><div class="tb">`;
    h += `<h2>${esc(tx(L.t))}</h2><p class="goal">${esc(tx(L.goal))}</p><ol class="steps">`;
    L.steps.forEach((st, i) => {
      if (i > TUT.si) return;
      h += `<li class="${i === TUT.si ? 'cur' : 'past'}"><div class="say">${rich(tx(st.say))}</div>${i < TUT.si && st.after ? `<div class="after">${rich(tx(st.after))}</div>` : ''}</li>`;
    });
    h += '</ol>';
    if (fin) { const j = LESSONS.findIndex(x => x.id === L.id), nx = LESSONS[j + 1]; h += `<div class="done"><p>${esc(tx(W.well))}</p><div class="row"><button data-a="again">${esc(tx(W.again))}</button>${nx ? `<button class="pri" data-a="go" data-l="${nx.id}">${esc(tx(W.nextL))} ▶</button>` : `<button class="pri" data-a="home">${esc(tx(W.list))}</button>`}</div></div>`; }
    else h += `<div class="row"><button data-a="again">${esc(tx(W.again))}</button><button data-a="show" ${TUT.busy ? 'disabled' : ''}>▶ ${esc(tx(W.show))}</button></div>`;
    return h + '</div>';
  }
  function render() {
    if (TUT.open) {
      pane.classList.toggle('fold', !!(TUT.fold && TUT.L));
      pane.innerHTML = TUT.L ? lessonView() : homeView();
      const c = pane.querySelector('.steps li.cur, .done'); if (c) c.scrollIntoView({ block: 'nearest' });
    }
    mark();
  }
  pane.addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b) return; const a = b.dataset.a;
    if (a === 'close') setOpen(false);
    else if (a === 'home') { TUT.L = null; restore(); render(); }
    else if (a === 'go') startLesson(LESSONS.find(l => l.id === b.dataset.l));
    else if (a === 'again') startLesson(TUT.L);
    else if (a === 'show') showMe();
    else if (a === 'fold') { TUT.fold = !TUT.fold; render(); }
  });
  pane.addEventListener('pointerdown', e => e.stopPropagation());
  // 시험용 (test/t-tutor.py)
  window.__tut = { COURSES, LESSONS, W, TUT, setOpen, startLesson, showMe, tick };
})();

</script>
