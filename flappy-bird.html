<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title id="pageTitle">플래피 버드</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; outline: none; }
#controls { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
#playBtn { background: #7c5cfc; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
#playBtn:hover { background: #6a4ce0; }
#keys { font-size: 11px; color: #666; }
#ui { display: flex; gap: 20px; margin-bottom: 8px; font-size: 14px; }
.stat { display: flex; gap: 6px; align-items: center; }
.label { color: #888; }
.value { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
.wrapper { position: relative; }
canvas { border-radius: 8px; display: block; }
</style>
</head>
<body tabindex="0">
<div id="controls">
  <button id="playBtn" title="시작/일시정지">▶</button>
  <span id="keys">스페이스 / 클릭 — 점프</span>
</div>
<div id="ui">
  <div class="stat"><span class="label" id="lbl-score">점수</span><span class="value" id="score">0</span></div>
  <div class="stat"><span class="label" id="lbl-best">최고</span><span class="value" id="best">0</span></div>
</div>
<div class="wrapper">
  <canvas id="c"></canvas>
</div>

<script>
const LANG = 'ko';
const T = {
  ko: { title: '플래피 버드', playBtn: '시작/일시정지', keys: '스페이스 / 클릭 — 점프', score: '점수', best: '최고', clickToStart: '클릭하여 시작', gameOver: '게임 오버', scoreLabel: '점수:', bestLabel: '최고:', restartHint: '▶ 버튼을 눌러 다시 시작' },
  en: { title: 'Flappy Bird', playBtn: 'Start/Pause', keys: 'Space / Click — Jump', score: 'Score', best: 'Best', clickToStart: 'Click to Start', gameOver: 'Game Over', scoreLabel: 'Score:', bestLabel: 'Best:', restartHint: 'Press ▶ to restart' },
}[LANG];
document.getElementById('pageTitle').textContent = T.title;
document.getElementById('playBtn').title = T.playBtn;
document.getElementById('keys').textContent = T.keys;
document.getElementById('lbl-score').textContent = T.score;
document.getElementById('lbl-best').textContent = T.best;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('playBtn');

let W, H;
const GRAVITY = 0.18;
const FLAP = -4.5;
const PIPE_W = 44;
const PIPE_GAP = 200;
const PIPE_SPEED = 1.4;
const GROUND_H = 50;

let bird, pipes, groundX, score, bestScore, running, gameOver, animId, started;

function resize() {
  W = Math.min(window.innerWidth - 20, 400);
  H = Math.min(window.innerHeight - 100, 600);
  W = Math.floor(W); H = Math.floor(H);
  canvas.width = W; canvas.height = H;
}

function init() {
  bird = { x: W * 0.25, y: H / 2, vy: 0, rotation: 0, frame: 0, flapTimer: 0 };
  pipes = [];
  groundX = 0;
  score = 0;
  gameOver = false;
  started = false;
  try { bestScore = parseInt(localStorage.getItem('flappy_best') || '0'); } catch(e) { bestScore = 0; }
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = bestScore;
}

function spawnPipe() {
  const minY = PIPE_GAP / 2 + 40;
  const maxY = H - GROUND_H - PIPE_GAP / 2 - 40;
  const gapY = minY + Math.random() * (maxY - minY);
  pipes.push({ x: W + 10, gapY, scored: false });
}

function flap() {
  if (gameOver) return;
  if (!started) { started = true; }
  bird.vy = FLAP;
  bird.flapTimer = 8;
}

function update() {
  if (!started) {
    bird.y = H / 2 + Math.sin(Date.now() * 0.004) * 8;
    bird.rotation = 0;
    return;
  }

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.min(bird.vy * 3, 70);
  if (bird.flapTimer > 0) bird.flapTimer--;
  bird.frame = (bird.frame + 0.15) % 3;

  groundX -= PIPE_SPEED;
  if (groundX <= -24) groundX += 24;

  if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 220) {
    spawnPipe();
  }

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED;
    if (p.x + PIPE_W < 0) { pipes.splice(i, 1); continue; }
    if (!p.scored && p.x + PIPE_W < bird.x) {
      p.scored = true;
      score++;
      if (score > bestScore) { bestScore = score; try { localStorage.setItem('flappy_best', bestScore); } catch(e) {} }
      updateUI();
    }

    const birdR = 12;
    if (bird.x + birdR > p.x && bird.x - birdR < p.x + PIPE_W) {
      if (bird.y - birdR < p.gapY - PIPE_GAP / 2 || bird.y + birdR > p.gapY + PIPE_GAP / 2) {
        die();
      }
    }
  }

  if (bird.y + 12 > H - GROUND_H || bird.y - 12 < 0) {
    die();
  }
}

function die() {
  gameOver = true;
  running = false;
  playBtn.textContent = '▶';
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation * Math.PI / 180);

  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#cc9900';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(5, -4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(6, -4, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff6644';
  ctx.beginPath();
  ctx.moveTo(12, -1);
  ctx.lineTo(20, 1);
  ctx.lineTo(12, 4);
  ctx.closePath();
  ctx.fill();

  const wingY = bird.flapTimer > 0 ? -8 : 4;
  ctx.fillStyle = '#ffee66';
  ctx.beginPath();
  ctx.ellipse(-6, wingY, 10, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawPipe(p) {
  const topH = p.gapY - PIPE_GAP / 2;
  const botY = p.gapY + PIPE_GAP / 2;

  const grad1 = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  grad1.addColorStop(0, '#2d8a4e');
  grad1.addColorStop(0.3, '#4caf50');
  grad1.addColorStop(0.7, '#4caf50');
  grad1.addColorStop(1, '#2d8a4e');

  ctx.fillStyle = grad1;
  ctx.fillRect(p.x, 0, PIPE_W, topH);
  ctx.fillRect(p.x - 3, topH - 24, PIPE_W + 6, 24);

  ctx.fillRect(p.x, botY, PIPE_W, H - GROUND_H - botY);
  ctx.fillRect(p.x - 3, botY, PIPE_W + 6, 24);

  ctx.strokeStyle = '#1b5e20';
  ctx.lineWidth = 1;
  ctx.strokeRect(p.x, 0, PIPE_W, topH);
  ctx.strokeRect(p.x - 3, topH - 24, PIPE_W + 6, 24);
  ctx.strokeRect(p.x, botY, PIPE_W, H - GROUND_H - botY);
  ctx.strokeRect(p.x - 3, botY, PIPE_W + 6, 24);
}

function drawGround() {
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(0, H - GROUND_H, W, 8);
  ctx.strokeStyle = '#2e1a0e';
  ctx.lineWidth = 1;
  for (let x = groundX; x < W; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_H + 8);
    ctx.lineTo(x + 12, H - GROUND_H + 20);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.stroke();
  }
}

function drawBackground() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  skyGrad.addColorStop(0, '#1a1a3e');
  skyGrad.addColorStop(0.5, '#2a2a5e');
  skyGrad.addColorStop(1, '#3a3a7e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 5; i++) {
    const cx = (i * 97 + 30) % W;
    const cy = 30 + (i * 43) % 80;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 30 + i * 5, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawBird();

  if (!started && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(T.clickToStart, W / 2, H / 2 + 50);
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4466';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(T.gameOver, W / 2, H / 2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '18px sans-serif';
    ctx.fillText(`${T.scoreLabel} ${score}`, W / 2, H / 2 + 10);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`${T.bestLabel} ${bestScore}`, W / 2, H / 2 + 40);
    ctx.fillStyle = '#888';
    ctx.font = '14px sans-serif';
    ctx.fillText(T.restartHint, W / 2, H / 2 + 75);
  }

  if (started && !gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillText(score, W / 2, 60);
    ctx.shadowBlur = 0;
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function togglePlay() {
  if (gameOver) {
    init();
    running = true;
    playBtn.textContent = '⏸';
    draw();
    loop();
    document.body.focus();
    return;
  }
  if (running) {
    running = false;
    playBtn.textContent = '▶';
    cancelAnimationFrame(animId);
  } else {
    running = true;
    playBtn.textContent = '⏸';
    loop();
    document.body.focus();
  }
}

playBtn.addEventListener('click', togglePlay);

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!running && !gameOver) { togglePlay(); }
    if (running) flap();
  }
});

canvas.addEventListener('click', () => {
  if (!running && !gameOver) { togglePlay(); }
  if (running) flap();
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!running && !gameOver) { togglePlay(); }
  if (running) flap();
}, { passive: false });

window.addEventListener('resize', resize);

resize();
init();
draw();
document.body.focus();
</script>
</body>
</html>
