<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title id="pageTitle">그림판</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:root { --bg: #16181f; --panel: #20232c; --panel2: #2a2e39; --line: rgba(255, 255, 255, .09); --text: #e9ecf3; --sub: #9aa1b2; --acc: #6c8cff; --acc2: #ff6aa2; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 14px 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Hiragino Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; display: grid; grid-template-rows: auto 1fr; }
button { font: inherit; color: inherit; }
/* 위 막대 */
.topbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.topbar::-webkit-scrollbar { display: none; }
.topbar .title { font-weight: 800; margin: 0 6px 0 2px; white-space: nowrap; background: linear-gradient(90deg, #ff6aa2, #ffb347, #6c8cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tb { height: 34px; min-width: 34px; padding: 0 8px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; flex: none; }
.tb:hover { background: var(--panel2); } .tb:disabled { opacity: .35; cursor: default; background: transparent; }
.tb svg { width: 19px; height: 19px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; flex: none; }
.zoomv { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; color: var(--sub); font-size: 12.5px; }
.spacer { flex: 1; }
/* 본문 */
.main { display: grid; grid-template-columns: 52px 1fr 250px; min-height: 0; }
.tools { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; overflow-y: auto; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool { width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; position: relative; flex: none; }
.tool svg { width: 21px; height: 21px; }
.tool:hover { background: var(--panel2); }
.tool.on { background: linear-gradient(160deg, rgba(108, 140, 255, .35), rgba(255, 106, 162, .25)); border-color: rgba(140, 160, 255, .5); }
.colorbtn { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4); cursor: pointer; margin-top: 6px; flex: none; }
.stage { position: relative; overflow: hidden; background: #0f1116; background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px); background-size: 16px 16px; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cursor { position: absolute; pointer-events: none; border: 1px solid rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.7); border-radius: 50%; transform: translate(-50%, -50%); display: none; }
/* 오른쪽 판 */
.side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; scrollbar-width: thin; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.sec h4 { font-size: 11.5px; letter-spacing: .08em; color: var(--sub); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.sv { position: relative; width: 100%; aspect-ratio: 1.35; border-radius: 10px; overflow: hidden; cursor: crosshair; touch-action: none; }
.sv canvas { width: 100%; height: 100%; display: block; }
.knob { position: absolute; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.6); transform: translate(-50%, -50%); pointer-events: none; }
.slider { position: relative; height: 14px; border-radius: 7px; margin-top: 10px; cursor: pointer; touch-action: none; }
.slider .knob { top: 50%; }
.hue { background: linear-gradient(90deg, red, #ff0, lime, cyan, blue, #f0f, red); }
.alpha { background-image: linear-gradient(45deg, #888 25%, transparent 25%, transparent 75%, #888 75%), linear-gradient(45deg, #888 25%, transparent 25%, transparent 75%, #888 75%); background-size: 10px 10px; background-position: 0 0, 5px 5px; background-color: #ccc; }
.alpha .fillg { position: absolute; inset: 0; border-radius: 7px; }
.hexrow { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.hexrow input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 8px; font: 600 13px ui-monospace, monospace; }
.swatch { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); flex: none; }
.palette { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
.palette button { aspect-ratio: 1; border-radius: 5px; border: 1px solid rgba(255,255,255,.15); cursor: pointer; }
.palette button:hover { transform: scale(1.12); }
.recent { display: flex; gap: 4px; margin-top: 6px; min-height: 20px; flex-wrap: wrap; }
.recent button { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); cursor: pointer; }
.row { display: grid; grid-template-columns: max-content 1fr 38px; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--sub); }
.row input[type=range] { width: 100%; accent-color: var(--acc); }
.row output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--acc); border-color: transparent; color: #fff; }
.chip svg { width: 16px; height: 16px; }
.layers { display: flex; flex-direction: column; gap: 4px; }
.layer { display: grid; grid-template-columns: 26px 44px 1fr 26px; align-items: center; gap: 6px; padding: 4px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.layer.on { background: var(--panel2); border-color: rgba(140, 160, 255, .4); }
.layer canvas { width: 44px; height: 33px; border-radius: 4px; background-image: linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%), linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%); background-size: 8px 8px; background-position: 0 0, 4px 4px; background-color: #fff; }
.layer .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer button { width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--sub); }
.layer button svg { width: 16px; height: 16px; }
.lbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.lbar .tb { height: 30px; min-width: 30px; background: var(--panel2); }
/* 휴대폰: 도구는 아래, 오른쪽 판은 떠 있는 창 */
@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .tools { grid-row: 2; flex-direction: row; border-right: none; border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); overflow-x: auto; overflow-y: hidden; }
  .stage { grid-row: 1; }
  .side { position: fixed; left: 8px; right: 8px; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); max-height: 60vh; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.6); z-index: 20; }
  .side.closed { display: none; }
  .colorbtn { margin: 0 4px 0 6px; }
  .hide-m { display: none !important; }
  .topbar .title { order: -3; } #bPanel { order: -2; background: var(--panel2); } #bHelp { display: none; } .topbar .spacer { display: none; }
}
@media (min-width: 761px) { .show-m { display: none !important; } }
/* 대화 상자 */
.ov { position: fixed; inset: 0; background: rgba(5, 6, 10, .6); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: min(400px, 100%); max-height: 100%; overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.dlg h3 { font-size: 18px; margin-bottom: 12px; }
.dlg .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.dlg .grid button, .dlg .btn { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; text-align: left; }
.dlg .grid button small { display: block; color: var(--sub); font-size: 11.5px; }
.dlg .grid button.on { border-color: var(--acc); }
.dlg .foot { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
.btn.primary { background: linear-gradient(160deg, #6c8cff, #8a5cff); border-color: transparent; color: #fff; font-weight: 700; text-align: center; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; color: var(--sub); }
.keys kbd { font: 700 12px ui-monospace, monospace; background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: var(--text); justify-self: start; white-space: nowrap; }
.textbox { position: absolute; z-index: 15; min-width: 40px; background: rgba(255,255,255,.04); border: 1px dashed var(--acc); outline: none; padding: 2px; line-height: 1.2; white-space: pre; color: #000; caret-color: var(--acc2); }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 50; background: rgba(20, 22, 30, .95); border: 1px solid var(--line); padding: 8px 16px; border-radius: 12px; font-weight: 700; animation: toast 1.8s ease forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; } 12%, 75% { opacity: 1; } 100% { opacity: 0; } }
</style>

const hex2 = n => n.toString(16).padStart(2, '0');

// 채우기: 누른 점과 비슷한 색(허용 오차)으로 이어진 영역 → 마스크와 경계 상자
function floodMask(data, w, h, sx, sy, tol) {
  const i0 = (sy * w + sx) * 4, r0 = data[i0], g0 = data[i0 + 1], b0 = data[i0 + 2], a0 = data[i0 + 3];

  let x0 = sx, x1 = sx, y0 = sy, y1 = sy; const st = [sx, sy];

  }

}
