.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; font-size: 12px; } .keys kbd { font: 11.5px var(--font); background: #1f2025; border: 1px solid #45474f; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--text); white-space: nowrap; }
.keys .hd { grid-column: 1 / -1; color: var(--acc2); font-weight: 600; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); background: rgba(30,31,36,.96); border: 1px solid var(--line2); color: var(--text); padding: 8px 16px; border-radius: 9px; z-index: 99; box-shadow: 0 8px 26px rgba(0,0,0,.45); pointer-events: none; animation: tin .18s ease-out; max-width: 80vw; text-align: center; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, 6px); } }
.tip { position: fixed; z-index: 120; background: #111216; color: #e9ebf0; border: 1px solid #3a3c44; padding: 6px 9px; border-radius: 6px; font-size: 12px; pointer-events: none; max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.5); line-height: 1.45; }
.tip b { color: #fff; } .tip .k { color: var(--acc2); margin-left: 6px; } .tip .d { color: var(--sub); display: block; margin-top: 2px; }
.textedit { position: absolute; outline: none; border: 1px dashed rgba(61,139,255,.9); background: transparent; white-space: pre; transform-origin: 0 0; z-index: 4; caret-color: currentColor; min-width: 4px; padding: 0; margin: 0; resize: none; overflow: hidden; line-height: 1.25; }
.textedit.box { white-space: pre-wrap; }
.mobbtn { display: none; }
#menubar .mi.learn { background: linear-gradient(90deg, rgba(255,106,162,.22), rgba(108,140,255,.25)); color: #fff; margin-left: 6px; }
#menubar .mi.learn:hover { background: linear-gradient(90deg, rgba(255,106,162,.4), rgba(108,140,255,.45)); }
#learnBox { position: absolute; left: 14px; bottom: 14px; width: min(380px, calc(100% - 28px)); background: rgba(36,37,43,.97); border: 1px solid rgba(108,140,255,.45); border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 6; transition: opacity .2s; }
#learnBox .lh { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px 14px; } #learnBox .lh svg { width: 18px; height: 18px; color: var(--acc2); } #learnBox .lh .n { margin-left: auto; color: var(--sub); font-size: 12px; } #learnBox .lh .x { margin-left: 4px; }
#learnBox .lh .n + .x { margin-left: 4px; } #learnBox .lh b + .x { margin-left: auto; }
#learnBox .dots { display: flex; gap: 4px; padding: 0 14px 8px; } #learnBox .dots i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); } #learnBox .dots i.on { background: var(--acc); } #learnBox .dots i.ok { background: #4c8; }
#learnBox .lb { padding: 0 14px 10px; line-height: 1.6; font-size: 13px; color: #dfe2ea; } #learnBox .lb b { color: #fff; } #learnBox .lb kbd { font: 11.5px var(--font); background: #1f2025; border: 1px solid #45474f; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
#learnBox .lb .big { font-size: 17px; font-weight: 700; margin-bottom: 6px; } #learnBox .lb .why { display: block; margin-top: 6px; color: var(--sub); font-size: 12px; }
#learnBox .ok { margin: 0 14px 8px; padding: 6px 10px; border-radius: 8px; background: rgba(60,180,110,.18); color: #7fe0a8; font-weight: 600; }
#learnBox .lf { display: flex; justify-content: flex-end; gap: 6px; padding: 0 12px 12px; }
.learn-hl { outline: 2px solid #ff6aa2 !important; outline-offset: 1px; animation: lhl 1.1s ease-in-out infinite; border-radius: 6px; }
@keyframes lhl { 50% { outline-color: rgba(255,106,162,.25); } }
@media (max-width: 820px) {
  #main { grid-template-columns: 44px 1fr 0; }
  #dock { position: fixed; right: 0; top: 72px; bottom: 0; width: min(320px, 88vw); z-index: 40; box-shadow: -20px 0 50px rgba(0,0,0,.5); transform: translateX(100%); transition: transform .25s; }
  body.dockopen #dock { transform: none; }
  .mobbtn { display: inline-grid; } .tool.mobbtn { display: grid; }
  #menubar .ttl { display: none; }
}

// - 누르면 wiiiv.ai 를 새 탭으로 연다. wiiiv 안(틀)에서는 이미 wiiiv 이고 새 창도 막혀 있어 링크를 걸지 않는다.
// - 그림은 앱 안의 것을 바로 쓰고, 같은 그림을 wiiiv.ai 에서 한 번 받아 간다 → 서버가 앱·환경별 사용 수를 센다 (IP·사용자 정보는 남기지 않음).

// 쓰는 법: wiiivMark(imgElement, '앱id')  — 원본: tools/wiiivapp-src/_shared/wiiiv-logo.js (모든 앱 같은 내용)
const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;

// 언어 고르기: 서버가 LANG 을 바꿔 넣는다. ?lang= 로 시험 가능
const pickLang = l => { l = String(l || 'en'); if (/^zh-(TW|HK|MO|Hant)/i.test(l)) return 'zh-TW'; return TX[l] ? l : TX[l.split('-')[0].toLowerCase()] ? l.split('-')[0].toLowerCase() : 'en'; };
let LG = 'ko', T = TX.ko;
function setLang(l) { LG = pickLang(l); const base = TX.en, cur = TX[LG] || base; T = deepFill(cur, base); }
function deepFill(a, b) { if (Array.isArray(b)) return Array.isArray(a) ? a : b; if (b && typeof b === 'object') { const o = {}; for (const k in b) o[k] = deepFill(a ? a[k] : undefined, b[k]); for (const k in (a || {})) if (!(k in o)) o[k] = a[k]; return o; } return a === undefined ? b : a; }

"newCanvasSub": "Größe und Hintergrund wählen","open": "Foto öffnen","openSub": "PNG, JPG, PSD… oder einfach hineinziehen","paste": "Einfügen","pasteSub": "Mit einem kopierten Bild beginnen","transparent": "Transparente Arbeitsfläche","tips": ["💡 Ziehe ein Bild hierher, um es zu öffnen","💡 Ctrl+V fügt ein Bild aus der Zwischenablage ein","💡 Space+Ziehen verschiebt die Ansicht","💡 Ctrl+/ zeigt alle Tastaturbefehle"]},"learn": {"title": "Lernen","lead": "Lerne die Grundlagen der Bildbearbeitung praktisch mit echten Weltraumfotos. Jeder Schritt geht automatisch weiter, sobald du ihn ausführst. Du steckst fest? Drücke „Zeig es mir“.","cardSub": "9 Grundlagen der Bildbearbeitung zum Ausprobieren","practice": "Übung","milky": "Milchstraße","moonPhoto": "Mondfoto","loading": "Übungsfoto wird vorbereitet…","loadFail": "Das Übungsfoto konnte nicht geladen werden (prüfe deine Verbindung)","start": "Übungsstart","show": "Zeig es mir","skip": "Überspringen","good": "Gut gemacht!","done": "Lektion abgeschlossen!","others": "Weitere Lektionen","next": "Nächste Lektion","lessons": {"layers": {"t": "Ebenen-Grundlagen","d": "Wie übereinandergelegte Klarsichtfolien – auf getrennten Ebenen zeichnen","steps": ["Eine Ebene ist wie eine <b>durchsichtige Folie</b>. Klicke unten im Ebenen-Bedienfeld auf <b>Neue Ebene</b> (⊞) oder drücke <kbd>Shift+Ctrl+N</kbd>.<span class=\"why\">Wenn du auf einer neuen Ebene zeichnest, bleibt das Original immer unversehrt.</span>","Wähle den <b>Pinsel</b> (<kbd>B</kbd>) und zeichne irgendetwas auf die neue Ebene.<span class=\"why\">Die Größe änderst du mit <kbd>[</kbd> <kbd>]</kbd>; die Farbe ist das Vordergrundfeld unten links.</span>","Senke die <b>Deckkraft</b> der Ebene auf etwa 50 % (die Zifferntaste <kbd>5</kbd> geht auch).<span class=\"why\">Deckkraft = wie durchsichtig diese Folie ist.</span>","Ändere die <b>Füllmethode</b> auf „Multiplizieren“.<span class=\"why\">Multiplizieren dunkelt Überlappungen ab, wie Tinte – ideal für Schatten.</span>","Klicke auf das <b>Auge</b> neben deiner Ebene, um sie auszublenden, und blende sie dann wieder ein.<span class=\"why\">Ausgeblendet heißt nicht gelöscht. Das wirst du zum Vergleichen ständig nutzen.</span>"],"end": "Ebenen = ein Stapel durchsichtiger Folien. <b>Deckkraft</b> und <b>Füllmethoden</b> bestimmen, wie sie zusammenwirken. Alles andere baut darauf auf."},"mask": {"t": "Montage mit Ebenenmasken","d": "Ausblenden statt radieren – zwei Fotos nahtlos verschmelzen","steps": ["Wähle die obere Ebene <b>Milchstraße</b> und klicke unten im Ebenen-Bedienfeld auf <b>Maske hinzufügen</b> (Kreis im Quadrat).<span class=\"why\">Eine weiße Maske erscheint. Weiß = sichtbar.</span>","Ziehe mit dem <b>Verlaufswerkzeug</b> (<kbd>G</kbd>) von unten nach oben <b>auf der Maske</b>. Die Erdkarte wird von unten eingeblendet.<span class=\"why\">Schwarz auf einer Maske blendet aus, Grau halb – so entsteht ein weicher Übergang.</span>","<kbd>Shift</kbd>+Klick auf die <b>Maskenminiatur</b> deaktiviert die Maske (rotes ✕).<span class=\"why\">Das Original ist noch vollständig da – der große Unterschied zum Radiergummi.</span>","<kbd>Shift</kbd>+Klick auf die Maskenminiatur aktiviert sie wieder."],"end": "Eine Maske ist ein <b>zerstörungsfreier Radiergummi</b>. Du kannst sie jederzeit korrigieren oder rückgängig machen – deshalb basiert jede Montage auf Masken."},"clip": {"t": "Schnittmasken","d": "Ein Foto in die Form eines Textes setzen","steps": ["Wähle die obere Ebene <b>Mondfoto</b> und drücke <kbd>Alt+Ctrl+G</kbd> (Ebene ▸ Schnittmaske erstellen).<span class=\"why\">Sie ist jetzt nur noch innerhalb der Form der Ebene darunter sichtbar (der Text MOON).</span>","Verschiebe das Mondfoto mit dem <b>Verschieben-Werkzeug</b> (<kbd>V</kbd>). Das Foto gleitet innerhalb der Buchstaben.<span class=\"why\">Der Text bleibt eine bearbeitbare Textebene.</span>","Wähle die Textebene <b>MOON</b> und füge unten im Ebenen-Bedienfeld <b>fx</b> ▸ <b>Kontur</b> hinzu.<span class=\"why\">Ebenenstile verzieren, ohne das Original zu verändern.</span>"],"end": "Ein Favorit für Poster und Thumbnails: Die <b>Form</b> der unteren Ebene wird zum <b>sichtbaren Bereich</b> der Ebenen darüber."},"adjust": {"t": "Farbkorrektur mit Einstellungsebenen","d": "Ein flaues Jupiterfoto retten – das Original bleibt erhalten","steps": ["Klicke im Bedienfeld <b>Korrekturen</b> auf <b>Tonwertkorrektur</b> (das Berg-Symbol).<span class=\"why\">Eine „Korrekturfolie“ wird über das Foto gelegt.</span>","Klicke im Bedienfeld <b>Eigenschaften</b> auf <b>Auto</b> oder ziehe die schwarzen und weißen Dreiecke unter dem Histogramm dorthin, wo der Berg beginnt.<span class=\"why\">Wenn die leeren Enden abgeschnitten werden, wird der dunkelste Punkt schwarz und der hellste weiß – der Kontrast kehrt zurück.</span>","Füge eine Einstellungsebene <b>Farbton/Sättigung</b> hinzu und erhöhe die <b>Sättigung</b>.","Schalte das Auge der Ebene <b>Tonwertkorrektur</b> aus, um mit dem Original zu vergleichen.<span class=\"why\">Einstellungsebenen lassen sich jederzeit neu bearbeiten oder entfernen.</span>"],"end": "Korrigiere mit <b>Einstellungsebenen</b>! Die Originalpixel bleiben unberührt, also kannst du frei experimentieren."},"select": {"t": "Auswahlen und Maskierungsmodus","d": "Den Mond freistellen – eine Auswahl mit dem Pinsel verfeinern","steps": ["Ziehe mit der <b>Auswahlellipse</b> (<kbd>M</kbd> oder <kbd>Shift+M</kbd>) um den Mond. <kbd>Shift</kbd> = Kreis, <kbd>Alt</kbd> = von der Mitte aus.","Drücke <kbd>Q</kbd> für den <b>Maskierungsmodus</b>. Rot = außerhalb der Auswahl. Male mit dem <b>Pinsel</b> schwarz zum Entfernen und weiß zum Hinzufügen (<kbd>X</kbd> vertauscht die Farben).","Drücke erneut <kbd>Q</kbd>, um zur Auswahl (laufende Ameisen) zurückzukehren.","Drücke <kbd>Ctrl+J</kbd>, um nur die Auswahl auf eine neue Ebene zu kopieren.<span class=\"why\">Jetzt kannst du den Mond für sich allein verschieben und gestalten.</span>"],"end": "Eine Auswahl bedeutet „nur hier arbeiten“. Im Maskierungsmodus verfeinerst du sie durch <b>Malen</b>."},"channels": {"t": "Auswählen mit Kanälen","d": "Der Profi-Weg, Eis und Wolken nach Helligkeit auszuwählen","steps": ["Öffne den Reiter <b>Kanäle</b> neben Ebenen.<span class=\"why\">Ein Foto besteht aus drei übereinanderliegenden Schwarzweißbildern – Rot, Grün und Blau.</span>","Klicke auf den Kanal <b>Blau</b>. Eis und Wolken sind am hellsten, der Ozean ist dunkel.","<kbd>Ctrl</kbd>+Klick auf den Kanal <b>Blau</b>: Je <b>heller</b>, desto stärker ausgewählt.","Klicke auf <b>RGB</b> und dann <kbd>Ctrl+J</kbd> – nur Eis und Wolken werden zu einer neuen Ebene.<span class=\"why\">Die klassische Technik für komplexe Kanten wie Haare und Blätter.</span>"],"end": "Kanäle sind <b>Helligkeitskarten</b> der Farben. Die Auswahl nach Helligkeit erfasst Kanten, mit denen Auswahlwerkzeuge Mühe haben."},"blend": {"t": "Füllmethoden","d": "Die Milchstraße mit der Erdkarte verschmelzen","steps": ["Ändere die Füllmethode der oberen Ebene <b>Milchstraße</b> auf <b>Negativ multiplizieren</b>.<span class=\"why\">Negativ multiplizieren addiert Licht: Der schwarze Himmel verschwindet, nur die Sterne bleiben.</span>","Probiere auch <b>Multiplizieren · Ineinanderkopieren · Farbe · Differenz</b> aus und sieh, was sich ändert."],"end": "Abdunkeln (Multiplizieren), aufhellen (Negativ multiplizieren), Kontrast (Ineinanderkopieren), nur Farbe (Farbe) – merke sie dir nach Gruppen."},"retouch": {"t": "Retusche-Werkzeuge","d": "Krater von der Mondoberfläche entfernen","steps": ["Male mit dem <b>Bereichsreparatur-Pinsel</b> (<kbd>J</kbd>) einmal über einen kleinen Krater.<span class=\"why\">Er wird ganz natürlich mit der umgebenden Struktur aufgefüllt.</span>","<b>Kopierstempel</b> (<kbd>S</kbd>): <kbd>Alt</kbd>+Klick legt eine Quelle fest, dann malst du an einer anderen Stelle.<span class=\"why\">Er kopiert den Quellbereich – damit kannst du sogar sich wiederholende Muster erzeugen.</span>"],"end": "Die zwei Grundwerkzeuge zum Entfernen von Makeln – die meistgenutzten Werkzeuge der Fotoretusche."},"transform": {"t": "Frei transformieren","d": "Den Mond skalieren, drehen und verzerren","steps": ["Wähle die obere Ebene <b>Mondfoto</b> und drücke <kbd>Ctrl+T</kbd> (Bearbeiten ▸ Frei transformieren).","Ziehe an einer Ecke zum Skalieren, ziehe außerhalb des Rahmens zum Drehen. <kbd>Ctrl</kbd>+Ecke = verzerren. <kbd>Enter</kbd> zum Bestätigen.<span class=\"why\">Du kannst auch exakte Werte oben in der Optionsleiste eingeben.</span>"],"end": "Ein einziges Tastenkürzel, <kbd>Ctrl+T</kbd>, für Skalieren, Drehen, Neigen und Perspektive – das Werkzeug für den letzten Schliff jeder Montage."}}},"aboutSub": "Leicht zu lernen, bereit für echte Arbeit","aboutBody": "Ebenen · Ebenenmasken · Schnittmasken · Gruppen · 27 Füllmethoden · 14 Einstellungsebenen · Kanäle und Alphakanäle · Maskierungsmodus · Auswahlwerkzeuge (Lasso, Zauberstab, Schnellauswahl, Farbbereich) · Frei transformieren (Verzerren, Perspektive) · Kopierstempel und Bereichsreparatur · Filter · PSD öffnen und speichern.<br>Alles läuft auf der GPU dieses Computers; deine Bilder werden nie hochgeladen.","h": {"open": "Öffnen","cleared": "Protokoll gelöscht","brush": "Pinsel","select": "Auswahl","deselect": "Auswahl aufheben","selectAll": "Alles auswählen","reselect": "Erneut auswählen","inverse": "Auswahl umkehren","rect": "Auswahlrechteck","ellipse": "Auswahlellipse","lasso": "Lasso","wand": "Zauberstab","feather": "Weiche Kante","expand": "Erweitern","contract": "Verkleinern","border": "Umrandung","smooth": "Abrunden","loadSel": "Auswahl laden","saveSel": "Auswahl speichern","moveSel": "Auswahl verschieben","nudgeSel": "Auswahl schrittweise verschieben","move": "Verschieben","nudge": "Schrittweise verschieben","movePixels": "Pixel verschieben","dupPixels": "Pixel duplizieren","duplicate": "Ebene duplizieren","align": "Ausrichten","transform": "Frei transformieren","flipH": "Arbeitsfläche horizontal spiegeln","flipV": "Arbeitsfläche vertikal spiegeln","rot90": "90 e": "Pegar","pasteSub": "Empieza con una imagen copiada","transparent": "Lienzo transparente","tips": ["💡 Suelta una imagen para abrirla","💡 Ctrl+V pega una imagen del portapapeles","💡 Space+arrastrar desplaza la vista","💡 Ctrl+/ muestra todos los atajos"]},"learn": {"title": "Aprender","lead": "Aprende lo esencial de la edición de imágenes practicando con fotos reales del espacio. Cada paso avanza solo cuando lo completas. ¿Te has atascado? Pulsa \"Muéstrame\".","cardSub": "9 fundamentos de edición de imágenes, en la práctica","practice": "Práctica","milky": "Vía Láctea","moonPhoto": "Foto de la Luna","loading": "Preparando la foto de práctica…","loadFail": "No se pudo cargar la foto de práctica (revisa tu conexión)","start": "Empezar práctica","show": "Muéstrame","skip": "Saltar","good": "¡Muy bien!","done": "¡Lección completada!","others": "Otras lecciones","next": "Siguiente lección","lessons": {"layers": {"t": "Conceptos básicos de capas","d": "Como apilar láminas transparentes: dibuja en capas separadas","steps": ["Una capa es una <b>lámina transparente</b>. Haz clic en el botón <b>Nueva capa</b> (⊞) bajo el panel Capas, o pulsa <kbd>Shift+Ctrl+N</kbd>.<span class=\"why\">Dibujar en una capa nueva nunca daña el original.</span>","Elige el <b>Pincel</b> (<kbd>B</kbd>) y dibuja lo que quieras en la capa nueva.<span class=\"why\">El tamaño se cambia con <kbd>[</kbd> <kbd>]</kbd>; el color es la muestra de color frontal, abajo a la izquierda.</span>","Baja la <b>Opacidad</b> de la capa a un 50% aproximadamente (también vale la tecla numérica <kbd>5</kbd>).<span class=\"why\">Opacidad = cuánto se transparenta esta lámina.</span>","Cambia el <b>modo de fusión</b> a \"Multiplicar\".<span class=\"why\">Multiplicar oscurece donde las cosas se superponen, como la tinta: ideal para sombras.</span>","Haz clic en el <b>ojo</b> junto a tu capa para ocultarla y luego vuelve a mostrarla.<span class=\"why\">Ocultar no es eliminar. Lo usarás continuamente para comparar.</span>"],"end": "Capa = una pila de láminas transparentes. La <b>opacidad</b> y los <b>modos de fusión</b> deciden cómo se combinan. Todo lo demás se construye sobre esto."},"mask": {"t": "Composición con máscaras de capa","d": "Ocultar en lugar de borrar: funde dos fotos sin que se note","steps": ["Con la capa superior <b>Vía Láctea</b> seleccionada, haz clic en el botón <b>Añadir máscara</b> (círculo dentro de un cuadrado) bajo el panel Capas.<span class=\"why\">Aparece una máscara blanca. Blanco = visible.</span>","Con la herramienta <b>Degradado</b> (<kbd>G</kbd>), arrastra de abajo→arriba <b>sobre la máscara</b>. El mapa de la Tierra aparece gradualmente desde abajo.<span class=\"why\">El negro en una máscara oculta y el gris oculta a medias: una transición suave.</span>","<kbd>Shift</kbd>+clic en la <b>miniatura de la máscara</b> para desactivarla (✕ roja).<span class=\"why\">El original sigue ahí intacto: esa es la gran diferencia con el Borrador.</span>","<kbd>Shift</kbd>+clic de nuevo en la miniatura de la máscara para activarla."],"end": "Una máscara es un <b>borrador no destructivo</b>. Siempre puedes corregirla o deshacerla; por eso la composición se basa en máscaras."},"clip": {"t": "Máscaras de recorte","d": "Coloca una foto dentro de la forma de un texto","steps": ["Selecciona la capa superior <b>Foto de la Luna</b> y pulsa <kbd>Alt+Ctrl+G</kbd> (Capa ▸ Crear máscara de recorte).<span class=\"why\">Ahora solo se ve dentro de la forma de la capa inferior (el texto MOON).</span>","Mueve la foto de la Luna con la herramienta <b>Mover</b> (<kbd>V</kbd>). La foto se desliza dentro de las letras.<span class=\"why\">El texto sigue siendo una capa de texto editable.</span>","Selecciona la capa de texto <b>MOON</b> y añade <b>fx</b> ▸ <b>Trazo</b> bajo el panel Capas.<span class=\"why\">Los estilos de capa decoran sin modificar el original.</span>"],"end": "Un clásico para pósteres y miniaturas: la <b>forma</b> de la capa base se convierte en el <b>área visible</b> de las capas de encima."},"adjust": {"t": "Corrección de color con capas de ajuste","d": "Rescata una foto apagada de Júpiter conservando el original","steps": ["En el panel <b>Ajustes</b>, haz clic en <b>Niveles</b> (el icono de la montaña).<span class=\"why\">Se coloca una \"lámina de corrección\" sobre la foto.</span>","Haz clic en <b>Automático</b> en el panel <b>Propiedades</b>, o arrastra los triángulos negro y blanco bajo el histograma hasta donde empieza la montaña.<span class=\"why\">Al recortar los extremos vacíos, el punto más oscuro pasa a ser negro y el más claro blanco: vuelve el contraste.</span>","Añade una capa de ajuste <b>Tono/saturación</b> y sube la <b>Saturación</b>.","Desactiva el ojo de la capa <b>Niveles</b> para compararla con el original.<span class=\"why\">Las capas de ajuste se pueden reeditar o eliminar en cualquier momento.</span>"],"end": "¡Corrige con <b>capas de ajuste</b>! Los píxeles originales no se tocan, así que puedes experimentar con total libertad."},"select": {"t": "Selecciones y Máscara rápida","d": "Recorta la Luna: refina una selección con un pincel","steps": ["Dibuja alrededor de la Luna con el <b>Marco elíptico</b> (<kbd>M</kbd> o <kbd>Shift+M</kbd>). <kbd>Shift</kbd> = círculo, <kbd>Alt</kbd> = desde el centro.","Pulsa <kbd>Q</kbd> para activar la <b>Máscara rápida</b>. Rojo = fuera de la selección. Pinta de negro con el <b>Pincel</b> para quitar y de blanco para añadir (<kbd>X</kbd> conmuta los colores).","Pulsa <kbd>Q</kbd> otra vez para volver a la selección (las hormigas en marcha).","Pulsa <kbd>Ctrl+J</kbd> para copiar solo la selección en una capa nueva.<span class=\"why\">Ahora puedes mover la Luna y darle estilo por separado.</span>"],"end": "Una selección significa \"trabaja solo aquí\". La Máscara rápida te permite refinarla <b>pintando</b>."},"channels": {"t": "Seleccionar con canales","d": "El método profesional para seleccionar hielo y nubes por luminosidad","steps": ["Abre la pestaña <b>Canales</b>, junto a Capas.<span class=\"why\">Una foto son tres fotos en blanco y negro (rojo, verde y azul) apiladas.</span>","Haz clic en el canal <b>Azul</b>. El hielo y las nubes son lo más claro; el océano es oscuro.","<kbd>Ctrl</kbd>+clic en el canal <b>Azul</b>: cuanto <b>más claro</b>, con más fuerza se selecciona.","Haz clic en <b>RGB</b> y luego <kbd>Ctrl+J</kbd>: solo el hielo y las nubes pasan a una capa nueva.<span class=\"why\">La técnica clásica para bordes complejos como el cabello o las hojas.</span>"],"end": "Los canales son <b>mapas de luminosidad</b> del color. Seleccionar por luminosidad captura bordes que a las herramientas de selección se les resisten."},"blend": {"t": "Modos de fusión","d": "Funde la Vía Láctea con el mapa de la Tierra","steps": ["Cambia el modo de fusión de la capa superior <b>Vía Láctea</b> a <b>Trama</b>.<span class=\"why\">Trama suma luz: el cielo negro desaparece y solo quedan las estrellas.</span>","Prueba también <b>Multiplicar · Superponer · Color · Diferencia</b> y observa qué cambia."],"end": "Oscurecer (Multiplicar), aclarar (Trama), contraste (Superponer), solo color (Color): recuérdalos por grupos."},"retouch": {"t": "Herramientas de retoque","d": "Elimina cráteres de la superficie lunar","steps": ["Pasa una vez el <b>Pincel corrector puntual</b> (<kbd>J</kbd>) sobre un cráter pequeño.<span class=\"why\">Lo rellena de forma natural con la textura de alrededor.</span>","<b>Tampón de clonar</b> (<kbd>S</kbd>): <kbd>Alt</kbd>+clic para fijar un origen y luego pinta en otro lugar.<span class=\"why\">Copia la zona de origen; incluso puedes crear patrones repetidos.</span>"],"end": "Las dos bases para eliminar imperfecciones: las herramientas más usadas en el retoque fotográfico."},"transform": {"t": "Transformación libre","d": "Escala, rota y distorsiona la Luna","steps": ["Selecciona la capa superior <b>Foto de la Luna</b> y pulsa <kbd>Ctrl+T</kbd> (Edición ▸ Transformación libre).","Arrastra una esquina para escalar y arrastra fuera del cuadro para rotar. <kbd>Ctrl</kbd>+esquina = distorsionar. <kbd>Enter</kbd> para confirmar.<span class=\"why\">También puedes escribir valores exactos en la barra de opciones de arriba.</span>"],"end": "Un solo atajo, <kbd>Ctrl+T</kbd>, para escalar, rotar, sesgar y aplicar perspectiva: la herramienta de acabado de la composición."}}},"aboutSub": "Fácil de aprender, listo para el trabajo real","aboutBody": "Capas · máscaras de capa · máscaras de recorte · grupos · 27 modos de fusión · 14 capas de ajuste · canales y canales alfa · Máscara rápida · herramientas de selección (lazo, varita mágica, selección rápida, gama de colores) · transformación libre (distorsión, perspectiva) · tampón de clonar y pincel corrector puntual · filtros · apertura y guardado de PSD.<br>Todo se ejecuta en la GPU de este equipo; tus imágenes nunca se suben a ningún servidor.","h": {"open": "Abrir","cleared": "Historia borrada","brush": "Pincel","select": "Seleccionar","deselect": "Deseleccionar","selectAll": "Seleccionar todo","reselect": "Volver a seleccionar","inverse": "Invertir selección","rect": "Marco rectangular","ellipse": "Marco elíptico","lasso": "Lazo","wand": "Varita mágica","feather": "Calar","expand": "Expandir","contract": "Contraer","border": "Borde","smooth": "Suavizar","loadSel": "Cargar selección","saveSel": "Guardar selección","moveSel": "Mover selección","nudgeSel": "Desplazar selección","move": "Mover","nudge": "Desplazar","movePixels": "Mover píxeles","dupPixels": "Duplicar píxeles","duplicate": "Duplicar capa","align": "Alinear","transform": "Transformación libre","flipH": "Voltear lienzo horizontal","flipV": "Voltear lienzo vertical","rot90": "Rotar 90°","rot270": "Rotar 90°","rot180": "Rotar 180°","canvasSize": "Tamaño de lienzo","crop": "Recortar","imageSize": "Tamaño de imagen","trim": "Cortar","rasterize": "Rasterizar","newLayer": "Nueva capa","delLayer": "Eliminar capa","viaCopy": "Capa vía copiar","viaCut": "Capa vía cortar","group": "Agrupar capas","ungr Extérieur","location": "Position","format": "Format","quality": "Qualité","scale": "Échelle","exportNote": "Le PNG conserve la transparence. Le JPEG est aplati sur fond blanc."},"btn": {"ok": "OK","cancel": "Annuler","apply": "Valider","close": "Fermer","create": "Créer","export": "Exporter","dontSave": "Ne pas enregistrer","saveWiiiv": "Enregistrer en .wiiiv"},"wc": {"lead": "Un éditeur d'images professionnel — calques, masques, couches, calques de réglage, filtres, ouverture et enregistrement PSD.","newCanvas": "Nouvelle zone de travail","newCanvasSub": "Choisissez la taille et l'arrière-plan","open": "Ouvrir une photo","openSub": "PNG, JPG, PSD… ou déposez-la simplement","paste": "Coller","pasteSub": "Partir d'une image copiée","transparent": "Zone de travail transparente","tips": ["💡 Déposez une image pour l'ouvrir","💡 Ctrl+V colle une image du presse-papiers","💡 Space+glisser déplace la vue","💡 Ctrl+/ affiche tous les raccourcis"]},"learn": {"title": "Apprendre","lead": "Apprenez l'essentiel de la retouche d'images en pratiquant sur de vraies photos de l'espace. Chaque étape avance toute seule dès que vous la réalisez. Bloqué ? Appuyez sur « Montre-moi ».","cardSub": "9 bases de la retouche d'images, en pratique","practice": "Exercice","milky": "Voie lactée","moonPhoto": "Photo de la Lune","loading": "Préparation de la photo d'exercice…","loadFail": "Impossible de charger la photo d'exercice (vérifiez votre connexion)","start": "Début de l'exercice","show": "Montre-moi","skip": "Passer","good": "Bravo !","done": "Leçon terminée !","others": "Autres leçons","next": "Leçon suivante","lessons": {"layers": {"t": "Les bases des calques","d": "Comme des films transparents empilés — dessinez sur des calques séparés","steps": ["Un calque, c'est une <b>feuille de film transparent</b>. Cliquez sur le bouton <b>Nouveau calque</b> (⊞) sous le panneau Calques, ou appuyez sur <kbd>Shift+Ctrl+N</kbd>.<span class=\"why\">Dessiner sur un nouveau calque n'abîme jamais l'original.</span>","Prenez le <b>Pinceau</b> (<kbd>B</kbd>) et dessinez ce que vous voulez sur le nouveau calque.<span class=\"why\">La taille se règle avec <kbd>[</kbd> <kbd>]</kbd> ; la couleur est celle du carré de premier plan, en bas à gauche.</span>","Baissez l'<b>Opacité</b> du calque à environ 50 % (la touche <kbd>5</kbd> marche aussi).<span class=\"why\">Opacité = à quel point ce film laisse voir à travers.</span>","Passez le <b>mode de fusion</b> sur « Produit ».<span class=\"why\">Produit assombrit là où les choses se superposent, comme de l'encre — idéal pour les ombres.</span>","Cliquez sur l'<b>œil</b> à côté de votre calque pour le masquer, puis réaffichez-le.<span class=\"why\">Masqué ne veut pas dire supprimé. Vous l'utiliserez sans cesse pour comparer.</span>"],"end": "Calque = une pile de films transparents. L'<b>opacité</b> et les <b>modes de fusion</b> décident de leur mélange. Tout le reste repose là-dessus."},"mask": {"t": "Composer avec les masques de fusion","d": "Masquer plutôt qu'effacer — fondre deux photos sans raccord","steps": ["Le calque <b>Voie lactée</b> du haut étant sélectionné, cliquez sur le bouton <b>Ajouter un masque</b> (un cercle dans un carré) sous le panneau Calques.<span class=\"why\">Un masque blanc apparaît. Blanc = visible.</span>","Avec l'outil <b>Dégradé</b> (<kbd>G</kbd>), faites glisser de bas en haut <b>sur le masque</b>. La carte de la Terre apparaît en fondu par le bas.<span class=\"why\">Le noir masque, le gris masque à moitié — pour une transition douce.</span>","<kbd>Shift</kbd>+clic sur la <b>vignette du masque</b> pour le désactiver (✕ rouge).<span class=\"why\">L'original est toujours là, intact — c'est toute la différence avec la Gomme.</span>","<kbd>Shift</kbd>+clic à nouveau sur la vignette du masque pour le réactiver."],"end": "Un masque est une <b>gomme non destructive</b>. Vous pouvez toujours le corriger ou revenir en arrière : c'est pour cela que le photomontage repose sur les masques."},"clip": {"t": "Masques d'écrêtage","d": "Placer une photo dans la forme d'un texte","steps": ["Sélectionnez le calque <b>Photo de la Lune</b> du haut et appuyez sur <kbd>Alt+Ctrl+G</kbd> (Calque ▸ Créer un masque d'écrêtage).<span class=\"why\">Il ne s'affiche plus qu'à l'intérieur de la forme du calque inférieur (le texte MOON).</span>","Déplacez la photo de la Lune avec l'<b>outil Déplacement</b> (<kbd>V</kbd>). La photo glisse à l'intérieur des lettres.<span class=\"why\">Le texte reste un calque de texte modifiable.</span>","Sélectionnez le calque de texte <b>MOON</b> et ajoutez <b>fx</b> ▸ <b>Contour</b> sous le panneau Calques.<span class=\"why\">Les styles de calque décorent sans modifier l'original.</span>"],"end": "Un grand classique des affiches et miniatures : la <b>forme</b> du calque de base devient la <b>zone visible</b> des calques au-dessus."},"adjust": {"t": "Corriger les couleurs avec les calques de réglage","d": "Sauver une photo terne de Jupiter — en gardant l'original","steps": ["Dans le panneau <b>Réglages</b>, cliquez sur <b>Niveaux</b> (l'icône en forme de montagne).<span class=\"why\">Un « film de correction » est posé sur la photo.</span>","Cliquez sur <b>Auto</b> dans le panneau <b>Propriétés</b>, ou faites glisser les triangles noir et blanc sous l'histogramme jusqu'au début de la montagne.<span class=\"why\">En coupant les extrémités vides, le point le plus sombre devient noir et le plus clair devient blanc — le contraste revient.</span>","Ajoutez un calque de réglage <b>Teinte/Saturation</b> et augmentez la <b>Saturation</b>.","Désactivez l'œil du calque <b>Niveaux</b> pour comparer avec l'original.<span class=\"why\">Les calques de réglage peuvent être modifiés ou supprimés à tout moment.</span>"],"end": "Corrigez avec des <b>calques de réglage</b> ! Les pixels d'origine restent intacts : vous pouvez expérimenter en toute liberté."},"select": {"t": "Sélections et mode Masque","d": "Détourer la Lune — affiner une sélection au pinceau","steps": ["Tracez autour de la Lune avec l'<b>Ellipse de sélection</b> (<kbd>M</kbd> ou <kbd>Shift+M</kbd>). <kbd>Shift</kbd> = cercle, <kbd>Alt</kbd> = depuis le centre.","Appuyez sur <kbd>Q</kbd> pour passer en <b>mode Masque</b>. Rouge = hors de la sélection. Peignez en noir avec le <b>Pinceau</b> pour retirer, en blanc pour ajouter (<kbd>X</kbd> permute les couleurs).","Appuyez de nouveau sur <kbd>Q</kbd> pour revenir à la sélection (les pointillés animés).","Appuyez sur <kbd>Ctrl+J</kbd> pour copier uniquement la sélection sur un nouveau calque.<span class=\"why\">Vous pouvez maintenant déplacer et styliser la Lune toute seule.</span>"],"end": "Une sélection veut dire « travailler uniquement ici ». Le mode Masque permet de l'affiner en <b>peignant</b>."},"channels": {"t": "Sélectionner avec les couches","d": "La méthode pro pour isoler glace et nuages selon leur luminosité","steps": ["Ouvrez l'onglet <b>Couches</b> à côté de Calques.<span class=\"why\">Une photo, ce sont trois photos en noir et blanc — rouge, vert et bleu — superposées.</span>","Cliquez sur la couche <b>Bleu</b>. La glace et les nuages sont les plus clairs ; l'océan est sombre.","<kbd>Ctrl</kbd>+clic sur la couche <b>Bleu</b> : plus c'est <b>clair</b>, plus c'est fortement sélectionné.","Cliquez sur <b>RGB</b>, puis <kbd>Ctrl+J</kbd> — seuls la glace et les nuages deviennent un nouveau calque.<span class=\"why\">La technique classique pour les contours complexes comme les cheveux ou les feuillages.</span>"],"end": "Les couches sont des <b>cartes de luminosité</b> des couleurs. Sélectionner par la luminosité capture des contours difficiles pour les outils de sélection."},"blend": {"t": "Modes de fusion","d": "Fondre la Voie lactée dans la carte de la Terre","steps": ["Passez le mode de fusion du calque <b>Voie lactée</b> du haut sur <b>Superposition</b>.<span class=\"why\">Superposition ajoute de la lumière : le ciel noir disparaît et seules les étoiles restent.</span>","Essayez aussi <b>Produit · Incrustation · Couleur · Différence</b> et observez ce qui change."],"end": "Assombrir (Produit), éclaircir (Superposition), contraster (Incrustation), couleur seule (Couleur) — retenez-les par famille."},"retouch": {"t": "Outils de retouche","d": "Effacer des cratères de la surface lunaire","steps": ["Passez une fois le <b>Correcteur localisé</b> (<kbd>J</kbd>) sur un petit cratère.<span class=\"why\">Il se comble naturellement avec la texture environnante.</span>","<b>Tampon de duplication</b> (<kbd>S</kbd>) : <kbd>Alt</kbd>+clic pour définir une source, puis peignez ailleurs.<span class=\"why\">Il copie la zone source — vous pouvez même créer des motifs répétés.</span>"],"end": "Les deux outils de base pour effacer les défauts — les plus utilisés en retouche photo."},"transform": {"t": "Transformation manuelle","d": "Redimensionner, faire pivoter et déformer la Lune","steps": ["Sélectionnez le calque <b>Photo de la Lune</b> du haut et appuyez sur <kbd>Ctrl+T</kbd> (Édition ▸ Transformation manuelle).","Faites glisser un coin pour redimensionner, faites glisser à l'extérieur du cadre pour faire pivoter. <kbd>Ctrl</kbd>+coin = torsion. <kbd>Enter</kbd> pour valider.<span class=\"why\">Vous pouvez aussi saisir des valeurs exactes dans la barre d'options en haut.</span>"],"end": "Un seul raccourci, <kbd>Ctrl+T</kbd>, pour l'échelle, la rotation, l'inclinaison et la perspective — l'outil de finition du photomontage."}}},"aboutSub": "Facile à apprendre, prêt pour le vrai travail","aboutBody": "Calques · masques de fusion · masques d'écrêtage · groupes · 27 modes de fusion · 14 calques de réglage · couches et couches alpha · mode Masque · outils de sélection (lasso, baguette magique, sélection rapide, plage de couleurs) · transformation manuelle (torsion, perspective) · tampon de duplication et correcteur localisé · filtres · ouverture et enregistrement PSD.<br>Tout s'exécute sur le GPU de cet ordinateur ; vos images ne sont jamais envoyées en ligne.","h": {"open": "Ouvrir","cleared": "  "シャープ（強）","highPass": "ハイパス","addNoise": "ノイズを加える","mosaic": "モザイク","emboss": "エンボス","findEdges": "輪郭検出","solarize": "ソラリゼーション","clouds": "雲模様","vignette": "周辺光量","offset": "スクロール"},"fp": {"radius": "半径","angle": "角度","distance": "距離","amount": "量","cx": "中心 X","cy": "中心 Y","threshold": "しきい値","gauss": "ガウス分布","mono": "グレースケールノイズ","cell": "セルの大きさ","height": "高さ","scale": "比率","mid": "中心点","dx": "水平方向","dy": "垂直方向","wrap": "ラップアラウンド"},"fpHint": {"clouds": "描画色と背景色から雲模様を描画します。"},"cr": {"sample": "指定色域（画像をクリック）","high": "ハイライト","mid": "中間調","shadow": "シャドウ","skin": "スキントーン","fuzz": "許容量","hint": "画像をクリックしてサンプル · Shift+クリックで追加 · Alt+クリックで削除。赤い部分は選択されていません。"},"dlg": {"name": "名前","width": "幅","height": "高さ","background": "背景","white": "ホワイト","black": "ブラック","transparent": "透明","bgColor": "背景色","gray50": "50% グレー","presets": {"screen": "画面サイズ","fhd": "Full HD","4k": "4K","a4": "A4 (300 ppi)","square": "正方形（SNS）","story": "縦長（ストーリー）","thumb": "YouTube サムネイル","web": "Web 画面","small": "小"},"keepRatio": "縦横比を固定","relative": "相対","anchor": "基準位置","preview": "プレビュー","newC": "新規","current": "現在","original": "元のカラーに戻す","pickHint": "このウィンドウを開いている間、画像をクリックするとその色を取得できます。","contents": "内容","keepTransp": "透明部分の保持","inside": "内側","center": "中央","outside": "外側","location": "位置","format": "形式","quality": "画質","scale": "比率","exportNote": "PNG は透明部分を保持します。JPEG は白背景に統合されます。"},"btn": {"ok": "OK","cancel": "キャンセル","apply": "確定","close": "閉じる","create": "作成","export": "書き出し","dontSave": "保存しない","saveWiiiv": ".wiiiv で保存"},"wc": {"lead": "プロ仕様の画像エディター — レイヤー、マスク、チャンネル、調整レイヤー、フィルター、PSD の読み込みと保存。","newCanvas": "新規カンバス","newCanvasSub": "サイズと背景を選択","open": "写真を開く","openSub": "PNG、JPG、PSD… ドロップするだけでも OK","paste": "ペースト","pasteSub": "コピーした画像から始める","transparent": "透明カンバス","tips": ["💡 画像をドロップすると開けます","💡 Ctrl+V でクリップボードの画像をペースト","💡 Space+ドラッグで表示をスクロール","💡 Ctrl+/ ですべてのショートカットを表示"]},"learn": {"title": "学ぶ","lead": "本物の宇宙写真を使って、画像編集の基本を手を動かしながら学びましょう。操作をすると次のステップへ自動で進みます。迷ったら「やってみせて」を押してください。","cardSub": "画像編集の基本 9 項目を実践で","practice": "練習","milky": "天の川","moonPhoto": "月の写真","loading": "練習用の写真を準備しています…","loadFail": "練習用の写真を読み込めませんでした（接続を確認してください）","start": "練習スタート","show": "やってみせて","skip": "スキップ","good": "よくできました！","done": "レッスン完了！","others": "ほかのレッスン","next": "次のレッスン","lessons": {"layers": {"t": "レイヤーの基本","d": "透明なフィルムを重ねるように — 別々のレイヤーに描こう","steps": ["レイヤーは<b>透明なフィルム</b>のようなものです。レイヤーパネル下の<b>新規レイヤー</b>ボタン（⊞）をクリックするか、<kbd>Shift+Ctrl+N</kbd> を押しましょう。<span class=\"why\">新しいレイヤーに描けば、元の画像を傷つけることはありません。</span>","<b>ブラシ</b>（<kbd>B</kbd>）を選んで、新しいレイヤーに自由に描いてみましょう。<span class=\"why\">サイズは <kbd>[</kbd> <kbd>]</kbd> で変更。色は左下の描画色です。</span>","レイヤーの<b>不透明度</b>を 50% くらいまで下げてみましょう（数字キー <kbd>5</kbd> でも OK）。<span class=\"why\">不透明度 = このフィルムがどれだけ透けるか、です。</span>","<b>描画モード</b>を「乗算」に変えてみましょう。<span class=\"why\">乗算はインクのように重なった部分が暗くなります — 影を描くのにぴったりです。</span>","レイヤーの横にある<b>目のアイコン</b>をクリックして非表示にし、もう一度表示してみましょう。<span class=\"why\">非表示は削除ではありません。比較するときにいつも使う操作です。</span>"],"end": "レイヤー = 透明なフィルムの重なり。<b>不透明度</b>と<b>描画モード</b>で重なり方が決まります。ほかのすべてはこの上に成り立っています。"},"mask": {"t": "レイヤーマスクで合成","d": "消すのではなく隠す — 2 枚の写真を自然になじませよう","steps": ["一番上の<b>天の川</b>レイヤーを選んだまま、レイヤーパネル下の<b>マスクを追加</b>ボタン（四角の中に丸）をクリックしましょう。<span class=\"why\">白いマスクが現れます。白 = 見える部分です。</span>","<b>グラデーション</b>ツール（<kbd>G</kbd>）で、<b>マスクの上</b>を下から上へドラッグしましょう。下から地球の地図がふわっと現れます。<span class=\"why\">マスクの黒は隠し、グレーは半分隠します — だからなめらかに移り変わるのです。</span>","<b>マスクのサムネール</b>を <kbd>Shift</kbd>+クリックしてマスクを無効にしましょう（赤い ✕）。<span class=\"why\">元の画像はすべて残っています — ここが消しゴムとの大きな違いです。</span>","もう一度マスクのサムネールを <kbd>Shift</kbd>+クリックして有効に戻しましょう。"],"end": "マスクは<b>元に戻せる消しゴム</b>です。いつでも直したりやり直したりできるので、合成はマスクを使って行います。"},"clip": {"t": "クリッピングマスク","d": "文字の形の中に写真を入れよう","steps": ["一番上の<b>月の写真</b>レイヤーを選んで <kbd>Alt+Ctrl+G</kbd> を押しましょう（レイヤー ▸ クリッピングマスクを作成）。<span class=\"why\">下のレイヤー（MOON の文字）の形の中だけに表示されるようになります。</span>","<b>移動ツール</b>（<kbd>V</kbd>）で月の写真を動かしてみましょう。写真が文字の中をスライドします。<span class=\"why\">文字は編集できるテキストレイヤーのままです。</span>","<b>MOON</b> のテキストレイヤーを選び、レイヤーパネル下の <b>fx</b> ▸ <b>境界線</b>を追加しましょう。<span class=\"why\">レイヤースタイルなら、元の画像を変えずに飾れます。</span>"],"end": "ポスターやサムネールで大人気のテクニック。下のレイヤーの<b>形</b>が、上のレイヤーの<b>見える範囲</b>になります。"},"adjust": {"t": "調整レイヤーで色調補正","d": "くすんだ木星の写真をよみがえらせよう — 元画像はそのまま","steps": ["<b>色調補正</b>パネルで<b>レベル補正</b>（山のアイコン）をクリックしましょう。<span class=\"why\">写真の上に「補正用のフィルム」が 1 枚重なります。</span>","<b>属性</b>パネルの<b>自動補正</b>をクリックするか、ヒストグラムの下にある黒と白の三角を、山が始まる位置までドラッグしましょう。<span class=\"why\">何もない両端を切り詰めると、いちばん暗い所が黒に、いちばん明るい所が白になり、コントラストがよみがえります。</span>","<b>色相・彩度</b>の調整レイヤーを追加して、<b>彩度</b>を上げてみましょう。","<b>レベル補正</b>レイヤーの目をオフにして、元の画像と比べてみましょう。<span class=\"why\">調整レイヤーはいつでも再編集したり削除したりできます。</span>"],"end": "補正は<b>調整レイヤー</b>で！元のピクセルは変わらないので、安心していろいろ試せます。"},"select": {"t": "選択範囲とクイックマスク","d": "月を切り抜こう — ブラシで選択範囲を整える","steps": ["<b>楕円形選択</b>（<kbd>M</kbd> または <kbd>Shift+M</kbd>）で月を囲みましょう。<kbd>Shift</kbd> = 正円、<kbd>Alt</kbd> = 中心から。","<kbd>Q</kbd> を押して<b>クイックマスク</b>に切り替えます。赤 = 選択範囲の外です。<b>ブラシ</b>で黒を塗ると削除、白を塗ると追加できます（<kbd>X</kbd> で色を入れ替え）。","もう一度 <kbd>Q</kbd> を押して、選択範囲（点線）に戻りましょう。","<kbd>Ctrl+J</kbd> を押して、選択した部分だけを新しいレイヤーにコピーしましょう。<span class=\"why\">これで月だけを動かしたり、スタイルを付けたりできます。</span>"],"end": "選択範囲は「ここだけ作業する」という意味です。クイックマスクを使えば、<b>ペイント</b>で選択範囲を整えられます。"},"channels": {"t": "チャンネルで選択","d": "明るさで氷や雲を選ぶ、プロの方法","steps": ["レイヤーの隣にある<b>チャンネル</b>タブを開きましょう。<span class=\"why\">写真は、レッド・グリーン・ブルーの 3 枚の白黒写真が重なってできています。</span>","<b>ブルー</b>チャンネルをクリックしましょう。氷と雲がいちばん明るく、海は暗く見えます。","<b>ブルー</b>チャンネルを <kbd>Ctrl</kbd>+クリックしましょう。<b>明るい</b>部分ほど強く選択されます。","<b>RGB</b> をクリックしてから <kbd>Ctrl+J</kbd> — 氷と雲だけが新しいレイヤーになります。<span class=\"why\">髪の毛や木の葉のような複雑な輪郭を選ぶ定番テクニックです。</span>"],"end": "チャンネルは色ごとの<b>明るさの地図</b>です。明るさで選択すると、選択ツールが苦手な輪郭もうまく捉えられます。"},"blend": {"t": "描画モード","d": "天の川を地球の地図に溶け込ませよう","steps": ["一番上の<b>天の川</b>レイヤーの描画モードを<b>スクリーン</b>に変えましょう。<span class=\"why\">スクリーンは光を足すモード。黒い空が消えて、星だけが残ります。</span>","<b>乗算 · オーバーレイ · カラー · 差の絶対値</b>も試して、何が変わるか見てみましょう。"],"end": "暗くする（乗算）、明るくする（スクリーン）、コントラスト（オーバーレイ）、色だけ（カラー）— グループで覚えましょう。"},"retouch": {"t": "レタッチツール","d": "月面のクレーターを消してみよう","steps": ["<b>スポット修復ブラシ</b>（<kbd>J</kbd>）で、小さなクレーターを 1 回なぞりましょう。<span class=\"why\">周りの質感で自然に埋めてくれます。</span>","<b>コピースタンプ</b>（<kbd>S</kbd>）：<kbd>Alt</kbd>+クリックでコピー元を設定し、別の場所をペイントしましょう。<span class=\"why\">コピー元の部分を写し取ります — 繰り返し模様も作れます。</span>"],"end": "不要なものを消す 2 つの基本ツール。写真レタッチでいちばんよく使われるツールです。"},"transform": {"t": "自由変形","d": "月を拡大・縮小、回転、変形しよう","steps": ["一番上の<b>月の写真</b>レイヤーを選んで <kbd>Ctrl+T</kbd> を押しましょう（編集 ▸ 自由変形）。","コーナーをドラッグすると拡大・縮小、枠の外側をドラッグすると回転します。<kbd>Ctrl</kbd>+コーナー = 自由な形に。<kbd>Enter</kbd> で確定です。<span class=\"why\">上部のオプションバーに正確な数値を入力することもできます。</span>"],"end": "<kbd>Ctrl+T</kbd> ひとつで拡大・縮小、回転、歪み、遠近法まで — 合成の仕上げに欠かせないツールです。"}}},"aboutSub": "覚えやすく、実務にも使える","aboutBody": "レイヤー · レイヤーマスク · クリッピングマスク · グループ · 27 種類の描画モード · 14 種類の調整レイヤー · チャンネルとアルファチャンネル · クイックマスク · 選択ツール（なげなわ、自動選択、クイック選択、色域指定）· 自由変形（自由な形に、遠近法）· コピースタンプとスポット修復 · フィルター · PSD の読み込みと保存。<br>すべての処理はこのコンピューターの GPU で行われ、画像がアップロードされることはありません。","h": {"open": "開く","cleared": "ヒストリーを消去","brush": "ブラシ","select": "選択","deselect": "選択を解除","selectAll": "すべてを選択","reselect": "再選択","inverse": "選択範囲を反転","rect": "長方形選択","ellipse": "楕円形選択","lasso": "なげなわ","wand": "自動選択","feather": "境界をぼかす","expand": "拡張","contract": "縮小","border": "境界線","smooth": "滑らかに","loadSel": "選択範囲を読み込む","saveSel": "選択範囲を保存","moveSel": "選択範囲の移動","nudgeSel": "選択範囲の微調整","move": "移動","nudge": "微調整","movePixels": "ピクセルを移動","dupPixels": "ピクセルを複製","duplicate": "レイヤーを複製","align": "整列","transform": "自由変形","flipH": "カンバスを左右に反転","flipV": "カンバスを上下に反転","rot90": "90°回転","rot270": "90°回転","rot180": "180°回転","canvasSize": "カンバスサイズ","crop": "切り抜き","imageSize": "画像解像度","trim": "トリミング","rasterize": "ラスタライズ","newLayer": "新規レイヤー","delLayer": "レイヤーを削除","viaCopy": "選択範囲をコピーしたレイヤー","viaCut": "選択範囲をカットしたレイヤー","group": "レイヤーをグループ化","ungroup": "グループ解除","reorder": "レイヤーの重ね順","merge": "レイヤーを結合","mergeDown": "下のレイヤーと結合","mergeVisible": "表示レイヤーを結合","flatten": "画像を統合","stamp": "表示レイヤーをスタンプ","clip": "クリッピングマスク","unclip": "クリッピングを解除","addMask": "レイヤーマスクを追加","delMask": "マスクを削除","applyMask": "マスクを適 o da sua camada para ocultá-la e depois mostre-a de novo.<span class=\"why\">Oculto não é excluído. Você vai usar isso o tempo todo para comparar.</span>"],"end": "Camada = uma pilha de filmes transparentes. A <b>Opacidade</b> e os <b>modos de mesclagem</b> decidem como eles se combinam. Todo o resto se constrói sobre isso."},"mask": {"t": "Composição com máscaras de camada","d": "Ocultar em vez de apagar — una duas fotos sem emendas","steps": ["Com a camada <b>Via Láctea</b> do topo selecionada, clique no botão <b>Adicionar máscara</b> (círculo dentro de um quadrado) abaixo do painel Camadas.<span class=\"why\">Aparece uma máscara branca. Branco = visível.</span>","Com a ferramenta <b>Gradiente</b> (<kbd>G</kbd>), arraste de baixo para cima <b>sobre a máscara</b>. O mapa da Terra surge suavemente por baixo.<span class=\"why\">Preto na máscara oculta, cinza oculta pela metade — uma transição suave.</span>","<kbd>Shift</kbd>+clique na <b>miniatura da máscara</b> para desativá-la (✕ vermelho).<span class=\"why\">O original continua todo lá — essa é a grande diferença em relação à Borracha.</span>","<kbd>Shift</kbd>+clique de novo na miniatura da máscara para ativá-la."],"end": "Uma máscara é uma <b>borracha não destrutiva</b>. Você sempre pode corrigir ou desfazer, e é por isso que as composições são feitas com máscaras."},"clip": {"t": "Máscaras de corte","d": "Coloque uma foto dentro do formato de um texto","steps": ["Selecione a camada <b>Foto da Lua</b> do topo e pressione <kbd>Alt+Ctrl+G</kbd> (Camada ▸ Criar máscara de corte).<span class=\"why\">Agora ela aparece apenas dentro do formato da camada abaixo (o texto MOON).</span>","Mova a foto da Lua com a <b>ferramenta Mover</b> (<kbd>V</kbd>). A foto desliza por dentro das letras.<span class=\"why\">O texto continua sendo uma camada de texto editável.</span>","Selecione a camada de texto <b>MOON</b> e adicione <b>fx</b> ▸ <b>Traçado</b> abaixo do painel Camadas.<span class=\"why\">Os estilos de camada decoram sem alterar o original.</span>"],"end": "Um favorito para pôsteres e miniaturas: o <b>formato</b> da camada base se torna a <b>área visível</b> das camadas acima."},"adjust": {"t": "Correção de cor com camadas de ajuste","d": "Salve uma foto apagada de Júpiter — mantendo o original","steps": ["No painel <b>Ajustes</b>, clique em <b>Níveis</b> (o ícone de montanha).<span class=\"why\">Um \"filme de correção\" é colocado sobre a foto.</span>","Clique em <b>Automático</b> no painel <b>Propriedades</b> ou arraste os triângulos preto e branco sob o histograma até onde a montanha começa.<span class=\"why\">Cortar as pontas vazias torna o ponto mais escuro preto e o mais claro branco — o contraste volta.</span>","Adicione uma camada de ajuste <b>Matiz/Saturação</b> e aumente a <b>Saturação</b>.","Desligue o olho da camada <b>Níveis</b> para comparar com o original.<span class=\"why\">Camadas de ajuste podem ser reeditadas ou removidas a qualquer momento.</span>"],"end": "Corrija com <b>camadas de ajuste</b>! Os pixels originais ficam intactos, então você pode experimentar à vontade."},"select": {"t": "Seleções e Máscara rápida","d": "Recorte a Lua — refine a seleção com um pincel","steps": ["Desenhe ao redor da Lua com o <b>Letreiro elíptico</b> (<kbd>M</kbd> ou <kbd>Shift+M</kbd>). <kbd>Shift</kbd> = círculo, <kbd>Alt</kbd> = a partir do centro.","Pressione <kbd>Q</kbd> para a <b>Máscara rápida</b>. Vermelho = fora da seleção. Pinte de preto com o <b>Pincel</b> para remover e de branco para adicionar (<kbd>X</kbd> alterna as cores).","Pressione <kbd>Q</kbd> de novo para voltar à seleção (as \"formigas marchando\").","Pressione <kbd>Ctrl+J</kbd> para copiar apenas a seleção para uma nova camada.<span class=\"why\">Agora você pode mover e estilizar a Lua separadamente.</span>"],"end": "Uma seleção significa \"trabalhe só aqui\". A Máscara rápida permite refiná-la <b>pintando</b>."},"channels": {"t": "Seleção com canais","d": "O jeito profissional de selecionar gelo e nuvens pelo brilho","steps": ["Abra a guia <b>Canais</b> ao lado de Camadas.<span class=\"why\">Uma foto são três fotos em preto e branco — vermelho, verde e azul — empilhadas.</span>","Clique no canal <b>Azul</b>. O gelo e as nuvens são os mais claros; o oceano é escuro.","<kbd>Ctrl</kbd>+clique no canal <b>Azul</b>: quanto <b>mais claro</b>, mais forte a seleção.","Clique em <b>RGB</b> e depois em <kbd>Ctrl+J</kbd> — só o gelo e as nuvens viram uma nova camada.<span class=\"why\">A técnica clássica para bordas complexas, como cabelos e folhas.</span>"],"end": "Os canais são <b>mapas de brilho</b> de cada cor. Selecionar pelo brilho captura bordas que as ferramentas de seleção têm dificuldade em pegar."},"blend": {"t": "Modos de mesclagem","d": "Funda a Via Láctea ao mapa da Terra","steps": ["Mude o modo de mesclagem da camada <b>Via Láctea</b> do topo para <b>Divisão</b>.<span class=\"why\">Divisão soma luz: o céu preto desaparece e só as estrelas ficam.</span>","Experimente também <b>Multiplicação · Sobrepor · Cor · Diferença</b> e veja o que muda."],"end": "Escurecer (Multiplicação), clarear (Divisão), contraste (Sobrepor), só a cor (Cor) — memorize-os por grupo."},"retouch": {"t": "Ferramentas de retoque","d": "Remova crateras da superfície lunar","steps": ["Pincele uma vez sobre uma pequena cratera com o <b>Pincel de recuperação para manchas</b> (<kbd>J</kbd>).<span class=\"why\">Ele preenche naturalmente com a textura ao redor.</span>","<b>Carimbo</b> (<kbd>S</kbd>): <kbd>Alt</kbd>+clique para definir a origem e depois pinte em outro lugar.<span class=\"why\">Ele copia a área de origem — dá até para criar padrões repetidos.</span>"],"end": "Os dois básicos para remover imperfeições — as ferramentas mais usadas no retoque de fotos."},"transform": {"t": "Transformação livre","d": "Redimensione, gire e distorça a Lua","steps": ["Selecione a camada <b>Foto da Lua</b> do topo e pressione <kbd>Ctrl+T</kbd> (Editar ▸ Transformação livre).","Arraste um canto para redimensionar e arraste fora da caixa para girar. <kbd>Ctrl</kbd>+canto = distorcer. <kbd>Enter</kbd> para confirmar.<span class=\"why\">Você também pode digitar valores exatos na barra de opções, no topo.</span>"],"end": "Um único atalho, <kbd>Ctrl+T</kbd>, para escala, rotação, inclinação e perspectiva — a ferramenta de acabamento das composições."}}},"aboutSub": "Fácil de aprender, pronto para o trabalho de verdade","aboutBody": "Camadas · máscaras de camada · máscaras de corte · grupos · 27 modos de mesclagem · 14 camadas de ajuste · canais e canais alfa · Máscara rápida · ferramentas de seleção (laço, varinha mágica, seleção rápida, intervalo de cores) · transformação livre (distorcer, perspectiva) · carimbo e pincel de recuperação para manchas · filtros · abertura e salvamento de PSD.<br>Tudo roda na GPU deste computador; suas imagens nunca são enviadas.","h": {"open": "Abrir","cleared": "Histórico limpo","brush": "Pincel","select": "Selecionar","deselect": "Desmarcar","selectAll": "Selecionar tudo","reselect": "Selecionar novamente","inverse": "Inverter seleção","rect": "Letreiro retangular","ellipse": "Letreiro elíptico","lasso": "Laço","wand": "Varinha mágica","feather": "Difusão","expand": "Expandir","contract": "Contrair","border": "Borda","smooth": "Suavizar","loadSel": "Carregar seleção","saveSel": "Salvar seleção","moveSel": "Mover seleção","nudgeSel": "Deslocar seleção","move": "Mover","nudge": "Deslocar","movePixels": "Mover pixels","dupPixels": "Duplicar pixels","duplicate": "Duplicar camada","align": "Alinhar","transform": "Transformação livre","flipH": "Inverter tela de pintura na horizontal","flipV": "Inverter tela de pintura na vertical","rot90": "Girar 90°","rot270": "Girar 90°","rot180": "Girar 180°","canvasSize": "Tamanho da tela de pintura","crop": "Cortar","imageSize": "Tamanho da imagem","trim": "Aparar","rasterize": "Rasterizar","newLayer": "Nova camada","delLayer": "Excluir camada","viaCopy": "Camada por cópia","viaCut": "Camada por recorte","group" hue": "Цветовой тон","lightness": "Яркость","colorize": "Тонирование","shadows": "Тени","midtones": "Средние тона","highlights": "Света","cyanRed": "Голубой ↔ Красный","magentaGreen": "Пурпурный ↔ Зеленый","yellowBlue": "Желтый ↔ Синий","keepLum": "Сохранить свечение","tint": "Оттенок","color": "Цвет","density": "Плотность","constant": "Константа","mono": "Монохромный"},"curvePresets": {"none": "По умолчанию","contrast": "Усиление контраста","strong": "Сильный контраст","lighter": "Светлее","darker": "Темнее","negative": "Негатив","fade": "Блеклый","sCurve": "S-образная кривая"},"pf": {"warm85": "Теплый фильтр (85)","warm81": "Теплый фильтр (81)","cool80": "Холодный фильтр (80)","cool82": "Холодный фильтр (82)","red": "Красный","orange": "Оранжевый","yellow": "Желтый","green": "Зеленый","cyan": "Голубой","blue": "Синий","violet": "Фиолетовый","magenta": "Пурпурный","sepia": "Сепия","custom": "Заказной"},"fltGroup": {"blur": "Размытие","sharpen": "Усиление резкости","noise": "Шум","pixelate": "Оформление","stylize": "Стилизация","render": "Рендеринг","other": "Другое"},"flt": {"gaussian": "Размытие по Гауссу","boxBlur": "Размытие по рамке","motion": "Размытие в движении","radial": "Радиальное размытие (линейное)","spin": "Размытие вращения","unsharp": "Контурная резкость","sharpenMore": "Резкость+","highPass": "Цветовой контраст","addNoise": "Добавить шум","mosaic": "Мозаика","emboss": "Тиснение","findEdges": "Выделение краев","solarize": "Соляризация","clouds": "Облака","vignette": "Виньетка","offset": "Сдвиг"},"fp": {"radius": "Радиус","angle": "Угол","distance": "Смещение","amount": "Эффект","cx": "Центр X","cy": "Центр Y","threshold": "Порог","gauss": "По Гауссу","mono": "Монохромный","cell": "Размер ячейки","height": "Высота","scale": "Масштаб","mid": "Средняя точка","dx": "По горизонтали","dy": "По вертикали","wrap": "Вставить отсеченные фрагменты"},"fpHint": {"clouds": "Создает узор облаков из основного и фонового цветов."},"cr": {"sample": "По образцам (щелкните по изображению)","high": "Света","mid": "Средние тона","shadow": "Тени","skin": "Телесные тона","fuzz": "Разброс","hint": "Щелкните по изображению, чтобы взять образец · Shift+щелчок добавляет · Alt+щелчок вычитает. Красные области не выделены."},"dlg": {"name": "Имя","width": "Ширина","height": "Высота","background": "Фон","white": "Белый","black": "Черный","transparent": "Прозрачный","bgColor": "Цвет фона","gray50": "50% серого","presets": {"screen": "Размер экрана","fhd": "Full HD","4k": "4K","a4": "A4 (300 ppi)","square": "Квадрат (соцсети)","story": "Вертикаль (сторис)","thumb": "Обложка YouTube","web": "Веб-экран","small": "Маленький"},"keepRatio": "Сохранять пропорции","relative": "Относительно","anchor": "Расположение","preview": "Просмотр","newC": "новый","current": "текущий","original": "Вернуть исходный цвет","pickHint": "Пока это окно открыто, щелкните по изображению, чтобы взять его цвет.","contents": "Содержимое","keepTransp": "Сохранить прозрачность","inside": "Внутри","center": "По центру","outside": "Снаружи","location": "Положение","format": "Формат","quality": "Качество","scale": "Масштаб","exportNote": "PNG сохраняет прозрачность. JPEG сводится на белый фон."},"btn": {"ok": "ОК","cancel": "Отмена","apply": "Применить","close": "Закрыть","create": "Создать","export": "Экспорт","dontSave": "Не сохранять","saveWiiiv": "Сохранить как .wiiiv"},"wc": {"lead": "Профессиональный редактор изображений: слои, маски, каналы, корректирующие слои, фильтры, открытие и сохранение PSD.","newCanvas": "Новый холст","newCanvasSub": "Выберите размер и фон","open": "Открыть фото","openSub": "PNG, JPG, PSD… или просто перетащите","paste": "Вставить","pasteSub": "Начать со скопированного изображения","transparent": "Прозрачный холст","tips": ["💡 Перетащите изображение, чтобы открыть его","💡 Ctrl+V вставляет изображение из буфера обмена","💡 Space+перетаскивание прокручивает вид","💡 Ctrl+/ показывает все сочетания клавиш"]},"learn": {"title": "Обучение","lead": "Освойте основы редактирования изображений на практике с настоящими космическими снимками. Каждый шаг засчитывается автоматически, как только вы его выполните. Застряли? Нажмите «Показать».","cardSub": "9 основ редактирования изображений на практике","practice": "Практика","milky": "Млечный Путь","moonPhoto": "Фото Луны","loading": "Готовим учебное фото…","loadFail": "Не удалось загрузить учебное фото (проверьте подключение)","start": "Начать практику","show": "Показать","skip": "Пропустить","good": "Отлично!","done": "Урок пройден!","others": "Другие уроки","next": "Следующий урок","lessons": {"layers": {"t": "Основы слоев","d": "Как стопка прозрачных пленок — рисуем на отдельных слоях","steps": ["Слой — это <b>прозрачная пленка</b>. Нажмите кнопку <b>Новый слой</b> (⊞) внизу панели «Слои» или нажмите <kbd>Shift+Ctrl+N</kbd>.<span class=\"why\">Рисуя на новом слое, вы никогда не испортите оригинал.</span>","Возьмите <b>Кисть</b> (<kbd>B</kbd>) и нарисуйте что угодно на новом слое.<span class=\"why\">Размер меняется клавишами <kbd>[</kbd> <kbd>]</kbd>, а цвет — это основной цвет в образце слева внизу.</span>","Уменьшите <b>Непрозрачность</b> слоя примерно до 50% (можно нажать цифру <kbd>5</kbd>).<span class=\"why\">Непрозрачность — это то, насколько пленка просвечивает.</span>","Смените <b>режим наложения</b> на «Умножение».<span class=\"why\">Умножение затемняет места наложения, как чернила, — отлично подходит для теней.</span>","Щелкните по <b>глазу</b> рядом со своим слоем, чтобы скрыть его, а потом покажите снова.<span class=\"why\">Скрытый слой не удален. Вы будете постоянно так сравнивать результат.</span>"],"end": "Слои — это стопка прозрачных пленок. <b>Непрозрачность</b> и <b>режимы наложения</b> определяют, как они сочетаются. На этом строится все остальное."},"mask": {"t": "Монтаж со слоем-маской","d": "Скрываем, а не стираем — плавно соединяем два фото","steps": ["Выбрав верхний слой <b>Млечный Путь</b>, нажмите кнопку <b>Добавить маску</b> (круг в квадрате) внизу панели «Слои».<span class=\"why\">Появится белая маска. Белое = видно.</span>","Инструментом <b>Градиент</b> (<kbd>G</kbd>) проведите снизу вверх <b>по маске</b>. Карта Земли плавно проступит снизу.<span class=\"why\">Черное на маске скрывает, серое скрывает наполовину — получается мягкий переход.</span>","<kbd>Shift</kbd>+щелчок по <b>миниатюре маски</b> отключает маску (красный ✕).<span class=\"why\">Оригинал остался целиком — в этом главное отличие от Ластика.</span>","Снова <kbd>Shift</kbd>+щелчок по миниатюре маски, чтобы включить ее."],"end": "Маска — это <b>неразрушающий ластик</b>. Ее всегда можно поправить или отменить, поэтому весь монтаж строится на масках."},"clip": {"t": "Обтравочные маски","d": "Помещаем фото внутрь букв","steps": ["Выберите верхний слой <b>Фото Луны</b> и нажмите <kbd>Alt+Ctrl+G</kbd> (Слои ▸ Создать обтравочную маску).<span class=\"why\">Теперь фото видно только внутри формы слоя ниже (текста MOON).</span>","Подвигайте фото Луны <b>инструментом «Перемещение»</b> (<kbd>V</kbd>). Фото скользит внутри букв.<span class=\"why\">Текст по-прежнему остается редактируемым текстовым слоем.</span>","Выберите текстовый слой <b>MOON</b> и добавьте <b>fx</b> ▸ <b>Обводка</b> внизу панели «Слои».<span class=\"why\">Стили слоя украшают, не меняя оригинал.</span>"],"end": "Любимый прием для постеров и обложек: <b>форма</b> нижнего слоя становится <b>видимой областью</b> слоев над ним."},"adjust": {"t": "Цветокоррекция корректирующими слоями","d": "Спасаем блеклое фото Юпитера, не трогая оригинал","steps": ["На панели <b>Коррекция</b> щелкните <b>Уровни</b> (значок с горкой).<span class=\"why\">Поверх фото ложится «корректирующая пленка».</span>","Нажмите <b>Авто</b> на панели <b>Свойства</b> или подвиньте черный и белый треугольники под гистограммой туда, где начинается «горка».<span class=\"why\">Отсекая пустые края, мы делаем самую темную точку черной, а самую светлую — белой, и контраст возвращается.</span>","Добавьте корректирующий слой <b>Цветовой тон/Насыщенность</b> и повысьте <b>Насыщенность</b>.","Выключите глаз у слоя <b>Уровни</b>, чтобы сравнить с оригиналом.<span class=\"why\">Корректирующие слои можно в любой момент изменить или удалить.</span>"],"end": "Исправляйте <b>корректирующими слоями</b>! Исходные пикселы остаются нетронутыми, так что экспериментируйте смело."},"select": {"t": "Выделение и Быстрая маска","d": "Вырезаем Луну — уточняем выделение кистью","steps": ["Обведите Луну инструментом <b>Овальная область</b> (<kbd>M</kbd> или <kbd>Shift+M</kbd>). <kbd>Shift</kbd> = круг, <kbd>Alt</kbd> = от центра.","Нажмите <kbd>Q</kbd> для <b>Быстрой маски</b>. Красное = вне выделения. Рисуйте <b>Кистью</b> черным, чтобы убрать, белым — чтобы добавить (<kbd>X</kbd> меняет цвета местами).","Снова нажмите <kbd>Q</kbd>, чтобы вернуться к выделению («марширующие муравьи»).","Нажмите <kbd>Ctrl+J</kbd>, чтобы скопировать только выделенное на новый слой.<span class=\"why\">Теперь Луну можно двигать и оформлять отдельно.</span>"],"end": "Выделение означает «работаем только здесь». Быстрая маска позволяет уточнять его <b>рисованием</b>."},"channels": {"t": "Выделение с помощью каналов","d": "Профессиональный способ выделить лед и облака по яркости","steps": ["Откройте вкладку <b>Каналы</b> рядом со «Слоями».<span class=\"why\">Цветное фото — это три черно-белых снимка (красный, зеленый и синий), сложенных вместе.</span>","Щелкните по каналу <b>Синий</b>. Лед и облака здесь самые светлые, а океан темный.","<kbd>Ctrl</kbd>+щелчок по каналу <b>Синий</b>: чем <b>светлее</b> участок, тем сильнее он выделен.","Щелкните <b>RGB</b>, затем <kbd>Ctrl+J</kbd> — только лед и облака станут новым слоем.<span class=\"why\">Классический прием для сложных краев, таких как волосы и листва.</span>"],"end": "Каналы — это <b>карты яркости</b> цветов. Выделение по яркости захватывает края, с которыми не справляются инструменты выделения."},"blend": {"t": "Режимы наложения","d": "Растворяем Млечный Путь в карте Земли","steps": ["Смените режим наложения верхнего слоя <b>Млечный Путь</b> на <b>Экран</b>.<span class=\"why\">Экран добавляет свет: черное небо исчезает, остаются только звезды.</span>","Попробуйте также <b>Умножение · Перекрытие · Цветность · Разница</b> и посмотрите, что меняется."],"end": "Затемнить (Умножение), осветлить (Экран), контраст (Перекрытие), только цвет (Цветность) — запоминайте их по группам."},"retouch": {"t": "Инструменты ретуши","d": "Убираем кратеры с поверхности Луны","steps": ["Один раз проведите по маленькому кратеру <b>Точечной восстанавливающей кистью</b> (<kbd>J</kbd>).<span class=\"why\">Она естественно заполняет место окружающей текстурой.</span>","<b>Штамп</b> (<kbd>S</kbd>): <kbd>Alt</kbd>+щелчок задает источник, затем рисуйте в другом месте.<span class=\"why\">Он копирует исходную область — можно даже создавать повторяющиеся узоры.</span>"],"end": "Две основы удаления дефектов — самые используемые инструменты фоторетуши."},"transform": {"t": "Свободное трансформирование","d": "Масштабируем, вращаем и искажаем Луну","steps": ["Выберите верхний слой <b>Фото Луны</b> и нажмите <kbd>Ctrl+T</kbd> (Редактирование ▸ Свободное трансформирование).","Тяните за угол, чтобы масштабировать, за пределами рамки — чтобы вращать. <kbd>Ctrl</kbd>+угол = искажение. <kbd>Enter</kbd> — применить.<span class=\"why\">Точные значения можно ввести и на панели параметров вверху.</span>"],"end": "Одно сочетание <kbd>Ctrl+T</kbd> — для масштаба, поворота, наклона и перспективы. Это завершающий инструмент монтажа."}}},"aboutSub": "Легко освоить, готов к настоящей работе","aboutBody": "Слои · слои-маски · обтравочные маски · группы · 27 режимов наложения · 14 корректирующих слоев · каналы и альфа-каналы · Быстрая маска · инструменты выделения (лассо, волшебная палочка, быстрое выделение, цветовой диапазон) · свободное трансформирование (искажение, перспектива) · штамп и точечная восстанавливающая кисть · фильтры · открытие и сохранение PSD.<br>Все работает на GPU этого компьют t": "Canvas trong suốt","tips": ["💡 Thả ảnh vào để mở","💡 Ctrl+V dán ảnh từ bộ nhớ tạm","💡 Space+kéo để di chuyển khung nhìn","💡 Ctrl+/ liệt kê mọi phím tắt"]},"learn": {"title": "Học","lead": "Học những điều cốt lõi của chỉnh sửa ảnh qua thực hành với ảnh vũ trụ thật. Mỗi bước sẽ tự chuyển tiếp khi bạn làm xong. Bị kẹt? Hãy nhấn \"Chỉ cho tôi\".","cardSub": "9 kỹ năng chỉnh sửa ảnh cơ bản, học qua thực hành","practice": "Thực hành","milky": "Dải Ngân Hà","moonPhoto": "Ảnh Mặt Trăng","loading": "Đang chuẩn bị ảnh thực hành…","loadFail": "Không tải được ảnh thực hành (hãy kiểm tra kết nối mạng)","start": "Bắt đầu thực hành","show": "Chỉ cho tôi","skip": "Bỏ qua","good": "Làm tốt lắm!","done": "Hoàn thành bài học!","others": "Bài học khác","next": "Bài tiếp theo","lessons": {"layers": {"t": "Cơ bản về lớp","d": "Giống như chồng các tấm phim trong — vẽ trên từng lớp riêng","steps": ["Lớp là một <b>tấm phim trong suốt</b>. Hãy nhấp nút <b>Lớp mới</b> (⊞) bên dưới bảng Lớp, hoặc nhấn <kbd>Shift+Ctrl+N</kbd>.<span class=\"why\">Vẽ trên lớp mới thì ảnh gốc không bao giờ bị hỏng.</span>","Chọn <b>Cọ</b> (<kbd>B</kbd>) và vẽ bất cứ thứ gì lên lớp mới.<span class=\"why\">Đổi kích thước bằng <kbd>[</kbd> <kbd>]</kbd>; màu vẽ là ô màu tiền cảnh ở góc dưới bên trái.</span>","Giảm <b>Độ mờ đục</b> của lớp xuống khoảng 50% (nhấn phím số <kbd>5</kbd> cũng được).<span class=\"why\">Độ mờ đục = tấm phim này trong đến mức nào.</span>","Đổi <b>chế độ hòa trộn</b> sang \"Multiply\".<span class=\"why\">Multiply làm tối chỗ chồng lên nhau, giống như mực — rất hợp để vẽ bóng.</span>","Nhấp vào <b>con mắt</b> cạnh lớp của bạn để ẩn nó, rồi hiện lại.<span class=\"why\">Ẩn không phải là xóa. Bạn sẽ dùng thao tác này suốt để so sánh.</span>"],"end": "Lớp = một chồng phim trong suốt. <b>Độ mờ đục</b> và <b>chế độ hòa trộn</b> quyết định cách chúng kết hợp. Mọi thứ khác đều xây dựng trên nền tảng này."},"mask": {"t": "Ghép ảnh bằng mặt nạ lớp","d": "Ẩn thay vì xóa — hòa hai bức ảnh liền mạch","steps": ["Khi đang chọn lớp <b>Dải Ngân Hà</b> trên cùng, hãy nhấp nút <b>Thêm mặt nạ</b> (hình tròn trong hình vuông) bên dưới bảng Lớp.<span class=\"why\">Một mặt nạ trắng xuất hiện. Trắng = hiển thị.</span>","Với công cụ <b>Chuyển sắc</b> (<kbd>G</kbd>), kéo từ dưới→lên <b>trên mặt nạ</b>. Bản đồ Trái Đất sẽ hiện dần từ bên dưới.<span class=\"why\">Màu đen trên mặt nạ thì ẩn, màu xám thì ẩn một nửa — tạo chuyển tiếp mềm mại.</span>","<kbd>Shift</kbd>+nhấp vào <b>hình thu nhỏ của mặt nạ</b> để tắt mặt nạ (dấu ✕ đỏ).<span class=\"why\">Ảnh gốc vẫn còn nguyên — đây là khác biệt lớn so với Tẩy.</span>","<kbd>Shift</kbd>+nhấp vào hình thu nhỏ của mặt nạ lần nữa để bật lại."],"end": "Mặt nạ là một <b>cục tẩy không phá hủy</b>. Bạn luôn có thể sửa hoặc hoàn tác, vì thế việc ghép ảnh đều dựa trên mặt nạ."},"clip": {"t": "Mặt nạ cắt","d": "Đặt bức ảnh vào bên trong hình dạng của chữ","steps": ["Chọn lớp <b>Ảnh Mặt Trăng</b> trên cùng và nhấn <kbd>Alt+Ctrl+G</kbd> (Lớp ▸ Tạo mặt nạ cắt).<span class=\"why\">Giờ nó chỉ hiện bên trong hình dạng của lớp bên dưới (chữ MOON).</span>","Di chuyển ảnh Mặt Trăng bằng <b>công cụ Di chuyển</b> (<kbd>V</kbd>). Bức ảnh sẽ trượt bên trong các con chữ.<span class=\"why\">Chữ vẫn là lớp chữ có thể chỉnh sửa.</span>","Chọn lớp chữ <b>MOON</b> và thêm <b>fx</b> ▸ <b>Viền</b> bên dưới bảng Lớp.<span class=\"why\">Kiểu lớp giúp trang trí mà không thay đổi bản gốc.</span>"],"end": "Kỹ thuật được ưa chuộng cho áp phích và ảnh bìa: <b>hình dạng</b> của lớp nền trở thành <b>vùng hiển thị</b> của các lớp phía trên."},"adjust": {"t": "Chỉnh màu bằng lớp điều chỉnh","d": "Cứu bức ảnh Sao Mộc xỉn màu — vẫn giữ ảnh gốc","steps": ["Trong bảng <b>Điều chỉnh</b>, nhấp <b>Levels</b> (biểu tượng ngọn núi).<span class=\"why\">Một \"tấm phim chỉnh màu\" được đặt phủ lên bức ảnh.</span>","Nhấp <b>Tự động</b> trong bảng <b>Thuộc tính</b>, hoặc kéo tam giác đen và trắng dưới biểu đồ histogram đến chỗ \"ngọn núi\" bắt đầu.<span class=\"why\">Cắt bỏ hai đầu trống sẽ khiến điểm tối nhất thành đen và điểm sáng nhất thành trắng — độ tương phản trở lại.</span>","Thêm lớp điều chỉnh <b>Sắc độ/Bão hòa</b> và tăng <b>Bão hòa</b>.","Tắt con mắt của lớp <b>Levels</b> để so sánh với ảnh gốc.<span class=\"why\">Lớp điều chỉnh có thể sửa lại hoặc xóa đi bất cứ lúc nào.</span>"],"end": "Hãy chỉnh màu bằng <b>lớp điều chỉnh</b>! Điểm ảnh gốc được giữ nguyên, nên bạn tha hồ thử nghiệm."},"select": {"t": "Vùng chọn và Mặt nạ nhanh","d": "Tách Mặt Trăng — tinh chỉnh vùng chọn bằng cọ","steps": ["Vẽ quanh Mặt Trăng bằng công cụ <b>Chọn hình elip</b> (<kbd>M</kbd> hoặc <kbd>Shift+M</kbd>). <kbd>Shift</kbd> = hình tròn, <kbd>Alt</kbd> = từ tâm.","Nhấn <kbd>Q</kbd> để vào <b>Mặt nạ nhanh</b>. Màu đỏ = ngoài vùng chọn. Dùng <b>Cọ</b> tô đen để bớt, tô trắng để thêm (<kbd>X</kbd> đổi màu).","Nhấn <kbd>Q</kbd> lần nữa để quay về vùng chọn (đường kiến bò).","Nhấn <kbd>Ctrl+J</kbd> để sao chép riêng vùng chọn sang một lớp mới.<span class=\"why\">Giờ bạn có thể di chuyển và trang trí Mặt Trăng một cách riêng biệt.</span>"],"end": "Vùng chọn nghĩa là \"chỉ làm việc ở đây\". Mặt nạ nhanh giúp bạn tinh chỉnh nó bằng cách <b>tô vẽ</b>."},"channels": {"t": "Chọn bằng kênh","d": "Cách chuyên nghiệp để chọn băng và mây theo độ sáng","steps": ["Mở thẻ <b>Kênh</b> cạnh thẻ Lớp.<span class=\"why\">Một bức ảnh là ba ảnh đen trắng — đỏ, lục và lam — chồng lên nhau.</span>","Nhấp vào kênh <b>Lam</b>. Băng và mây sáng nhất; đại dương thì tối.","<kbd>Ctrl</kbd>+nhấp vào kênh <b>Lam</b>: chỗ nào <b>càng sáng</b> thì được chọn càng mạnh.","Nhấp <b>RGB</b>, rồi nhấn <kbd>Ctrl+J</kbd> — chỉ băng và mây trở thành lớp mới.<span class=\"why\">Kỹ thuật kinh điển cho các đường viền phức tạp như tóc và lá cây.</span>"],"end": "Kênh là <b>bản đồ độ sáng</b> của màu sắc. Chọn theo độ sáng bắt được những đường viền mà công cụ chọn thường gặp khó."},"blend": {"t": "Chế độ hòa trộn","d": "Hòa Dải Ngân Hà vào bản đồ Trái Đất","steps": ["Đổi chế độ hòa trộn của lớp <b>Dải Ngân Hà</b> trên cùng sang <b>Screen</b>.<span class=\"why\">Screen cộng thêm ánh sáng: bầu trời đen biến mất, chỉ còn lại các vì sao.</span>","Thử thêm <b>Multiply · Overlay · Color · Difference</b> và xem điều gì thay đổi."],"end": "Làm tối (Multiply), làm sáng (Screen), tương phản (Overlay), chỉ màu (Color) — hãy nhớ chúng theo nhóm."},"retouch": {"t": "Công cụ chỉnh sửa ảnh","d": "Xóa các miệng hố trên bề mặt Mặt Trăng","steps": ["Quét <b>Cọ Chữa lành điểm</b> (<kbd>J</kbd>) một lần qua một miệng hố nhỏ.<span class=\"why\">Nó lấp đầy tự nhiên bằng kết cấu xung quanh.</span>","<b>Clone Stamp</b> (<kbd>S</kbd>): <kbd>Alt</kbd>+nhấp để đặt nguồn, rồi tô ở chỗ khác.<span class=\"why\">Nó sao chép vùng nguồn — bạn thậm chí có thể tạo hoa văn lặp lại.</span>"],"end": "Hai công cụ cơ bản để xóa khuyết điểm — được dùng nhiều nhất khi chỉnh sửa ảnh."},"transform": {"t": "Biến đổi tự do","d": "Co giãn, xoay và bóp méo Mặt Trăng","steps": ["Chọn lớp <b>Ảnh Mặt Trăng</b> trên cùng và nhấn <kbd>Ctrl+T</kbd> (Chỉnh sửa ▸ Biến đổi tự do).","Kéo một góc để co giãn, kéo ra ngoài khung để xoay. <kbd>Ctrl</kbd>+góc = bóp méo. <kbd>Enter</kbd> để xác nhận.<span class=\"why\">Bạn cũng có thể nhập số chính xác trên thanh tùy chọn phía trên.</span>"],"end": "Chỉ một phím tắt <kbd>Ctrl+T</kbd> cho co giãn, xoay, nghiêng và phối cảnh — công cụ hoàn thiện của ghép ảnh."}}},"aboutSub": "Dễ học, sẵn sàng cho công việc thực tế","aboutBody": "Lớp · mặt nạ lớp · mặt nạ cắt · nhóm · 27 chế độ hòa trộn · 14 lớp điều chỉnh · kênh và kênh alpha · mặt nạ nhanh · công cụ chọn (lasso, đũa thần, chọn nhanh, dải màu) · biến đổi tự do (bóp méo, phối cảnh) · clone stamp và chữa lành điểm · bộ lọc · mở và lưu PSD.<br>Mọi thứ chạy trên GPU của máy tính này; ảnh của bạn không bao giờ bị tải lên.","h": {"open": "Mở","cleared": "Đã xóa lịch sử","brush": "Cọ","select": "Chọn","deselect": "Bỏ chọn","selectAll": "Chọn tất cả","reselect": "Chọn lại","inverse": "Đảo vùng chọn","rect": "Chọn hình chữ nhật","ellipse": "Chọn h 比","lighter": "較亮","darker": "較暗","negative": "負片","fade": "褪色","sCurve": "S 曲線"},"pf": {"warm85": "加溫濾鏡 (85)","warm81": "加溫濾鏡 (81)","cool80": "冷卻濾鏡 (80)","cool82": "冷卻濾鏡 (82)","red": "紅","orange": "橙","yellow": "黃","green": "綠","cyan": "青","blue": "藍","violet": "紫","magenta": "洋紅","sepia": "褐色","custom": "自訂"},"fltGroup": {"blur": "模糊","sharpen": "銳利化","noise": "雜訊","pixelate": "像素","stylize": "風格化","render": "演算上色","other": "其他"},"flt": {"gaussian": "高斯模糊","boxBlur": "方框模糊","motion": "動態模糊","radial": "放射狀模糊（縮放）","spin": "迴轉模糊","unsharp": "遮色片銳利化調整","sharpenMore": "更銳利化","highPass": "顏色快調","addNoise": "增加雜訊","mosaic": "馬賽克","emboss": "浮雕","findEdges": "找出邊緣","solarize": "曝光過度","clouds": "雲狀效果","vignette": "暈映","offset": "畫面錯位"},"fp": {"radius": "強度","angle": "角度","distance": "間距","amount": "總量","cx": "中心 X","cy": "中心 Y","threshold": "臨界值","gauss": "高斯","mono": "單色的","cell": "單元格大小","height": "高度","scale": "縮放","mid": "中間點","dx": "水平","dy": "垂直","wrap": "漸繞"},"fpHint": {"clouds": "以前景色和背景色產生雲朵圖樣。"},"cr": {"sample": "樣本顏色（按一下影像）","high": "亮部","mid": "中間調","shadow": "陰影","skin": "膚色","fuzz": "朦朧","hint": "按一下影像取樣 · Shift+按一下增加 · Alt+按一下減去。紅色區域為未選取。"},"dlg": {"name": "名稱","width": "寬度","height": "高度","background": "背景","white": "白色","black": "黑色","transparent": "透明","bgColor": "背景色","gray50": "50% 灰色","presets": {"screen": "螢幕尺寸","fhd": "Full HD","4k": "4K","a4": "A4 (300 ppi)","square": "正方形（社群）","story": "直式（限時動態）","thumb": "YouTube 縮圖","web": "網頁畫面","small": "小尺寸"},"keepRatio": "強制比例","relative": "相對","anchor": "錨點","preview": "預視","newC": "新的","current": "目前","original": "恢復原本的顏色","pickHint": "此視窗開啟時，按一下影像即可選取該處顏色。","contents": "內容","keepTransp": "保留透明","inside": "內部","center": "居中","outside": "外部","location": "位置","format": "格式","quality": "品質","scale": "縮放","exportNote": "PNG 會保留透明度；JPEG 會以白色背景平面化。"},"btn": {"ok": "確定","cancel": "取消","apply": "確認","close": "關閉","create": "建立","export": "轉存","dontSave": "不儲存","saveWiiiv": "儲存為 .wiiiv"},"wc": {"lead": "專業影像編輯器 — 圖層、遮色片、色版、調整圖層、濾鏡，還能開啟和儲存 PSD。","newCanvas": "新畫布","newCanvasSub": "選擇尺寸和背景","open": "開啟相片","openSub": "PNG、JPG、PSD… 或直接拖放進來","paste": "貼上","pasteSub": "從拷貝的影像開始","transparent": "透明畫布","tips": ["💡 拖放影像即可開啟","💡 Ctrl+V 可貼上剪貼簿中的影像","💡 Space+拖曳可平移畫面","💡 Ctrl+/ 可查看所有快速鍵"]},"learn": {"title": "學習","lead": "用真實的太空相片，動手學會影像編輯的核心技巧。完成動作後就會自動進入下一步。卡住了嗎？按「示範給我看」就好。","cardSub": "動手學 9 項影像編輯必備技巧","practice": "練習","milky": "銀河","moonPhoto": "月球相片","loading": "正在準備練習相片…","loadFail": "無法載入練習相片（請檢查網路連線）","start": "開始練習","show": "示範給我看","skip": "略過","good": "做得好！","done": "課程完成！","others": "其他課程","next": "下一課","lessons": {"layers": {"t": "圖層基礎","d": "就像疊起一張張透明片 — 在不同圖層上作畫","steps": ["圖層就像一張<b>透明片</b>。按一下圖層面板下方的<b>新增圖層</b>按鈕 (⊞)，或按 <kbd>Shift+Ctrl+N</kbd>。<span class=\"why\">在新圖層上作畫，永遠不會破壞原始影像。</span>","選擇<b>筆刷</b> (<kbd>B</kbd>)，在新圖層上隨意畫點什麼吧。<span class=\"why\">用 <kbd>[</kbd> <kbd>]</kbd> 調整尺寸；顏色就是左下角的前景色。</span>","把圖層的<b>不透明度</b>降到大約 50%（也可以按數字鍵 <kbd>5</kbd>）。<span class=\"why\">不透明度 = 這張透明片有多透。</span>","把<b>混合模式</b>改成「色彩增值」。<span class=\"why\">色彩增值會讓重疊處像墨水一樣變暗 — 很適合畫陰影。</span>","按一下圖層旁的<b>眼睛</b>把它隱藏，再讓它重新顯示。<span class=\"why\">隱藏不等於刪除。比較前後差異時會一直用到喔。</span>"],"end": "圖層 = 一疊透明片。<b>不透明度</b>和<b>混合模式</b>決定它們如何疊合。其他所有功能都建立在這個基礎上。"},"mask": {"t": "用圖層遮色片合成","d": "不是擦掉而是隱藏 — 讓兩張相片無縫融合","steps": ["選取最上方的<b>銀河</b>圖層，按一下圖層面板下方的<b>增加遮色片</b>按鈕（方框中有圓形）。<span class=\"why\">會出現一個白色遮色片。白色 = 顯示。</span>","使用<b>漸層</b>工具 (<kbd>G</kbd>)，<b>在遮色片上</b>由下往上拖曳。地球地圖就會從下方漸漸浮現。<span class=\"why\">遮色片上的黑色會隱藏、灰色會半隱藏 — 形成柔和的過渡。</span>","<kbd>Shift</kbd>+按一下<b>遮色片縮圖</b>即可停用遮色片（出現紅色 ✕）。<span class=\"why\">原始影像完整保留 — 這就是和橡皮擦最大的不同。</span>","再次 <kbd>Shift</kbd>+按一下遮色片縮圖，重新啟用它。"],"end": "遮色片是一種<b>非破壞性的橡皮擦</b>。隨時都能修改或復原，所以影像合成都是以遮色片為基礎。"},"clip": {"t": "剪裁遮色片","d": "把相片放進文字的形狀裡","steps": ["選取最上方的<b>月球相片</b>圖層，按 <kbd>Alt+Ctrl+G</kbd>（圖層 ▸ 建立剪裁遮色片）。<span class=\"why\">現在它只會顯示在下方圖層（MOON 文字）的形狀內。</span>","用<b>移動工具</b> (<kbd>V</kbd>) 移動月球相片，相片會在文字裡面滑動。<span class=\"why\">文字仍然是可以編輯的文字圖層。</span>","選取 <b>MOON</b> 文字圖層，從圖層面板下方的 <b>fx</b> ▸ 加上<b>筆畫</b>。<span class=\"why\">圖層樣式可以裝飾圖層，又不會改變原始內容。</span>"],"end": "海報和縮圖最愛用的技巧：底層圖層的<b>形狀</b>會成為上方圖層的<b>可見範圍</b>。"},"adjust": {"t": "用調整圖層校正色彩","d": "救回一張黯淡的木星相片 — 同時保留原始影像","steps": ["在<b>調整</b>面板中，按一下<b>色階</b>（山形圖示）。<span class=\"why\">相片上方會疊上一張「校正用的透明片」。</span>","按一下<b>內容</b>面板中的<b>自動</b>，或把色階分佈圖下方的黑色和白色三角形拖到山形開始的位置。<span class=\"why\">裁掉兩端的空白，最暗處就會變成黑色、最亮處變成白色 — 對比就回來了。</span>","加入<b>色相/飽和度</b>調整圖層，並提高<b>飽和度</b>。","關閉<b>色階</b>圖層的眼睛，和原始影像比較看看。<span class=\"why\">調整圖層隨時都能重新編輯或移除。</span>"],"end": "用<b>調整圖層</b>來校正！原始像素完全不受影響，可以放心大膽地嘗試。"},"select": {"t": "選取範圍與快速遮色片","d": "把月球去背 — 用筆刷精修選取範圍","steps": ["用<b>橢圓選取畫面工具</b>（<kbd>M</kbd> 或 <kbd>Shift+M</kbd>）沿著月球圈選。<kbd>Shift</kbd> = 正圓形，<kbd>Alt</kbd> = 從中心開始。","按 <kbd>Q</kbd> 進入<b>快速遮色片</b>。紅色 = 選取範圍以外。用<b>筆刷</b>塗黑色可移除、塗白色可增加（<kbd>X</kbd> 可切換顏色）。","再按一次 <kbd>Q</kbd>，回到選取範圍（螞蟻線）。","按 <kbd>Ctrl+J</kbd>，只把選取範圍拷貝到新圖層。<span class=\"why\">現在可以單獨移動月球、替它加上樣式了。</span>"],"end": "選取範圍的意思是「只在這裡作業」。快速遮色片讓你能用<b>繪畫</b>的方式精修它。"},"channels": {"t": "用色版選取","d": "專業人士依亮度選取冰層和雲朵的方法","steps": ["打開圖層旁邊的<b>色版</b>標籤。<span class=\"why\">一張相片其實是紅、綠、藍三張黑白相片疊在一起。</span>","按一下<b>藍</b>色版。冰層和雲朵最亮，海洋則很暗。","<kbd>Ctrl</kbd>+按一下<b>藍</b>色版：<b>越亮</b>的地方，選取得越完整。","按一下 <b>RGB</b>，再按 <kbd>Ctrl+J</kbd> — 只有冰層和雲朵會變成新圖層。<span class=\"why\">這是處理髮絲、樹葉等複雜邊緣的經典技巧。</span>"],"end": "色版是各顏色的<b>亮度地圖</b>。依亮度選取，能抓到選取工具難以處理的邊緣。"},"blend": {"t": "混合模式","d": "讓銀河融入地球地圖","steps": ["把最上方<b>銀河</b>圖層的混合模式改成<b>濾色</b>。<span class=\"why\">濾色會疊加光線：黑色的天空消失，只留下星星。</span>","也試試<b>色彩增值 · 覆蓋 · 顏色 · 差異化</b>，看看有什麼變化。"],"end": "變暗（色彩增值）、變亮（濾色）、對比（覆蓋）、只換顏色（顏色）— 依群組來記就很好記。"},"retouch": {"t": "修飾工具","d": "去除月球表面的隕石坑","steps": ["用<b>污點修復筆刷</b> (<kbd>J</kbd>) 在小隕石坑上刷一下。<span class=\"why\">它會用周圍的紋理自然地填補。</span>","<b>仿製印章</b> (<kbd>S</kbd>)：<kbd>Alt</kbd>+按一下設定來源，再到其他地方塗抹。<span class=\"why\">它會拷貝來源區域 — 甚至可以做出重複的圖樣。</span>"],"end": "去除瑕疵的兩大基本功 — 也是相片修飾中最常用的工具。"},"transform": {"t": "任意變形","d": "縮放、旋轉和扭曲月球","steps": ["選取最上方的<b>月球相片</b>圖層，按 <kbd>Ctrl+T</kbd>（編輯 ▸ 任意變形）。","拖曳角落可縮放，在框外拖曳可旋轉。<kbd>Ctrl</kbd>+角落 = 扭曲。按 <kbd>Enter</kbd> 確認。<span class=\"why\">也可以在上方的選項列輸入精確數值。</span>"],"end": "只要一個快速鍵 <kbd>Ctrl+T</kbd>，就能縮放、旋轉、傾斜和透視 — 影像合成的收尾利器。"}}},"aboutSub": "容易上手，也能用於實際工作","aboutBody": "圖層 · 圖層遮色片 · 剪裁遮色片 · 群組 · 27 種混合模式 · 14 種調整圖層 · 色版與 Alpha 色版 · 快速遮色片 · 選取工具（套索、魔術棒、快速選取、顏色範圍）· 任意變形（扭曲、透視）· 仿製印章與污點修復 · 濾鏡 · PSD 開啟與儲存。<br>所有處理都在這台電腦的 GPU 上執行，您的影像絕不會被上傳。","h": {"open": "開啟","cleared": "已清除步驟記錄","brush": "筆刷","select": "選取","deselect": "取消選取","selectAll": "全選","reselect": "重新選取","inverse": "反轉選取","rect": "矩形選取畫面","ellipse": "橢圓選取畫面","lasso": "套索","wand": "魔術棒","feather": "羽化","expand": "擴張","contract": "縮減","border": "邊界","smooth": "平滑","loadSel": "載入選取範圍","saveSel": "儲存選取範圍","moveSel": "移動選取範圍","nudgeSel": "微調選取範圍","move": "移動","nudge": "微調","movePixels": "移動像素","dupPixels": "複製像素","duplicate": "複製圖層","align": "對齊","transform": "任意變形","flipH": "水平翻轉版面","flipV": "垂直翻轉版面","rot90": "旋轉 90°","rot270": "旋轉 90°","rot180": "旋轉 180°","canvasSize": "版面尺寸","crop": "裁切","imageSize": "影像尺寸","trim": "修剪","rasterize": "點陣化","newLayer": "新增圖層","delLayer": "刪除圖層","viaCopy": "拷貝的圖層","viaCut": "剪下的圖層","group": "群組圖層","ungroup": "解散群組","reorder": "圖層順序","merge": "合併圖層","mergeDown": "向下合併","mergeVisible": "合併可見圖層","flatten": "影像平面化","stamp": "蓋印可見圖層","clip": "剪裁遮色片","unclip": "釋放剪裁","addMask": "增加圖層遮色片","delMask": "刪除遮色片","applyMask": "套用遮色片","invertMask": "反轉遮色片","maskToggle": "切換遮色片","maskLink": "連結遮色片","lock": "鎖定","rename": "重新命名","visibility": "可見度","opacity": "不透明度","fill": "填滿","blend": "混合模式","fillColor": "填色","fillLayer": "填滿圖層","place": "置入","layerStyle": "圖層樣式","clearStyle": "清除圖層樣式","paste": "貼上","cut": "剪下","clear": "清除","stroke": "筆畫","type": "文字","typeEdit": "編輯文字","shape": "形狀","shapeEdit": "編輯形狀","newChannel": "新增色版","delChannel": "刪除色版"},"msg": {"noTarget": "沒有可供繪畫的圖層","locked": "圖層已鎖定","hidden": "無法在隱藏的圖層上繪畫","rasterFirst": "文字和形狀圖層必須先點陣化（圖層 > 點陣化）","notOnMask": "此工具無法用於遮色片或色版","cloneSrc": "請先 Alt+按一下以設定仿製來源","cloneSet": "已設定仿製來源","noTransform": "請選取要變
