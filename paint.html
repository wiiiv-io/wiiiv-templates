拖进来也行","paste": "粘贴","pasteSub": "从拷贝的图像开始","transparent": "透明画布","tips": ["💡 拖入图像即可打开","💡 Ctrl+V 从剪贴板粘贴图像","💡 Space+拖动 可平移视图","💡 Ctrl+/ 查看全部快捷键"]},"learn": {"title": "学习","lead": "用真实的太空照片亲手学习图像编辑的核心功能。每一步完成后会自动进入下一步。卡住了？点“演示给我看”。","cardSub": "9 个图像编辑必备技能，动手学","practice": "练习","milky": "银河","moonPhoto": "月球照片","loading": "正在准备练习照片…","loadFail": "无法加载练习照片（请检查网络连接）","start": "开始练习","show": "演示给我看","skip": "跳过","good": "做得好！","done": "课程完成！","others": "其他课程","next": "下一课","lessons": {"layers": {"t": "图层基础","d": "就像叠放透明胶片——在不同图层上分别绘画","steps": ["图层就是一张<b>透明胶片</b>。单击“图层”面板下方的<b>新建图层</b>按钮 (⊞)，或按 <kbd>Shift+Ctrl+N</kbd>。<span class=\"why\">在新图层上绘画，永远不会破坏原图。</span>","选择<b>画笔</b> (<kbd>B</kbd>)，在新图层上随意画点什么吧。<span class=\"why\">用 <kbd>[</kbd> <kbd>]</kbd> 调整大小；颜色就是左下角的前景色。</span>","把图层的<b>不透明度</b>降到 50% 左右（也可以按数字键 <kbd>5</kbd>）。<span class=\"why\">不透明度 = 这张胶片有多透明。</span>","把<b>混合模式</b>改为“正片叠底”。<span class=\"why\">正片叠底会让重叠处像墨水一样变暗——非常适合画阴影。</span>","单击图层旁边的<b>眼睛</b>图标将它隐藏，再单击一次重新显示。<span class=\"why\">隐藏不等于删除。对比效果时你会经常用到它。</span>"],"end": "图层 = 一叠透明胶片。<b>不透明度</b>和<b>混合模式</b>决定它们如何组合。其他所有功能都建立在这个基础之上。"},"mask": {"t": "用图层蒙版合成","d": "用隐藏代替擦除——让两张照片无缝融合","steps": ["选中最上面的<b>银河</b>图层，单击“图层”面板下方的<b>添加蒙版</b>按钮（方框中带圆形）。<span class=\"why\">会出现一个白色蒙版。白色 = 可见。</span>","用<b>渐变</b>工具 (<kbd>G</kbd>) <b>在蒙版上</b>从下往上拖动，地球地图就会从下方渐渐显现。<span class=\"why\">蒙版上的黑色会隐藏，灰色则半隐藏——形成柔和的过渡。</span>","按住 <kbd>Shift</kbd> 单击<b>蒙版缩览图</b>，停用蒙版（出现红色 ✕）。<span class=\"why\">原图完好无损——这正是它和橡皮擦的最大区别。</span>","再次按住 <kbd>Shift</kbd> 单击蒙版缩览图，重新启用蒙版。"],"end": "蒙版是一块<b>非破坏性的橡皮擦</b>。随时可以修改或撤销，所以图像合成都离不开蒙版。"},"clip": {"t": "剪贴蒙版","d": "把照片装进文字的形状里","steps": ["选中最上面的<b>月球照片</b>图层，按 <kbd>Alt+Ctrl+G</kbd>（图层 ▸ 创建剪贴蒙版）。<span class=\"why\">现在它只在下方图层（MOON 文字）的形状内显示。</span>","用<b>移动工具</b> (<kbd>V</kbd>) 移动月球照片，照片会在字母里面滑动。<span class=\"why\">文字仍然是可以编辑的文字图层。</span>","选中 <b>MOON</b> 文字图层，在“图层”面板下方添加 <b>fx</b> ▸ <b>描边</b>。<span class=\"why\">图层样式可以装饰图层，却不改变原图。</span>"],"end": "海报和缩略图的常用技巧：底层图层的<b>形状</b>就是上方图层的<b>可见区域</b>。"},"adjust": {"t": "用调整图层校色","d": "拯救一张灰蒙蒙的木星照片——同时保留原图","steps": ["在<b>调整</b>面板中单击<b>色阶</b>（山形图标）。<span class=\"why\">照片上会盖上一层“校正胶片”。</span>","在<b>属性</b>面板中单击<b>自动</b>，或把直方图下方的黑色和白色三角形拖到“山脚”开始的位置。<span class=\"why\">剪掉两端的空白，最暗处变成黑色、最亮处变成白色——对比度就回来了。</span>","再添加一个<b>色相/饱和度</b>调整图层，提高<b>饱和度</b>。","关闭<b>色阶</b>图层的眼睛图标，和原图对比一下。<span class=\"why\">调整图层随时可以重新编辑或删除。</span>"],"end": "用<b>调整图层</b>来校正吧！原始像素保持不变，你可以放心大胆地尝试。"},"select": {"t": "选区与快速蒙版","d": "抠出月球——用画笔精修选区","steps": ["用<b>椭圆选框工具</b>（<kbd>M</kbd> 或 <kbd>Shift+M</kbd>）沿月球画一圈。<kbd>Shift</kbd> = 正圆，<kbd>Alt</kbd> = 从中心开始。","按 <kbd>Q</kbd> 进入<b>快速蒙版</b>。红色 = 选区之外。用<b>画笔</b>涂黑色可去除，涂白色可添加（<kbd>X</kbd> 切换颜色）。","再按一次 <kbd>Q</kbd>，回到选区（蚂蚁线）。","按 <kbd>Ctrl+J</kbd>，只把选区内容拷贝到新图层。<span class=\"why\">现在可以单独移动月球、为它添加样式了。</span>"],"end": "选区的意思是“只在这里操作”。快速蒙版让你可以用<b>绘画</b>的方式精修选区。"},"channels": {"t": "用通道建立选区","d": "按亮度选出冰层和云层的专业方法","steps": ["打开“图层”旁边的<b>通道</b>选项卡。<span class=\"why\">一张照片其实是红、绿、蓝三张黑白照片叠在一起。</span>","单击<b>蓝</b>通道。冰层和云层最亮，海洋则很暗。","按住 <kbd>Ctrl</kbd> 单击<b>蓝</b>通道：<b>越亮</b>的地方，被选中的程度越高。","单击 <b>RGB</b>，再按 <kbd>Ctrl+J</kbd>——只有冰层和云层变成了新图层。<span class=\"why\">这是处理头发、树叶等复杂边缘的经典技法。</span>"],"end": "通道是颜色的<b>亮度地图</b>。按亮度建立选区，能抓住选择工具难以处理的边缘。"},"blend": {"t": "混合模式","d": "让银河融入地球地图","steps": ["把最上面<b>银河</b>图层的混合模式改为<b>滤色</b>。<span class=\"why\">滤色会叠加光线：黑色的天空消失了，只留下星星。</span>","再试试<b>正片叠底 · 叠加 · 颜色 · 差值</b>，看看有什么变化。"],"end": "变暗（正片叠底）、变亮（滤色）、对比（叠加）、只改颜色（颜色）——按组来记就很轻松。"},"retouch": {"t": "修饰工具","d": "去除月球表面的陨石坑","steps": ["用<b>污点修复画笔</b> (<kbd>J</kbd>) 在一个小陨石坑上涂抹一下。<span class=\"why\">它会用周围的纹理自然地填补。</span>","<b>仿制图章</b> (<kbd>S</kbd>)：按住 <kbd>Alt</kbd> 单击设置取样点，然后在别处涂抹。<span class=\"why\">它会复制取样区域——甚至可以做出重复图案。</span>"],"end": "去除瑕疵的两大基本功——照片修饰中最常用的工具。"},"transform": {"t": "自由变换","d": "缩放、旋转和扭曲月球","steps": ["选中最上面的<b>月球照片</b>图层，按 <kbd>Ctrl+T</kbd>（编辑 ▸ 自由变换）。","拖动角点可缩放，在框外拖动可旋转。<kbd>Ctrl</kbd>+角点 = 扭曲。按 <kbd>Enter</kbd> 提交。<span class=\"why\">也可以在顶部的选项栏中输入精确数值。</span>"],"end": "一个快捷键 <kbd>Ctrl+T</kbd>，搞定缩放、旋转、斜切和透视——图像合成的收尾利器。"}}},"aboutSub": "易学易用，胜任实际工作","aboutBody": "图层 · 图层蒙版 · 剪贴蒙版 · 组 · 27 种混合模式 · 14 种调整图层 · 通道与 Alpha 通道 · 快速蒙版 · 选择工具（套索、魔棒、快速选择、色彩范围）· 自由变换（扭曲、透视）· 仿制图章与污点修复 · 滤镜 · PSD 打开与存储。<br>所有处理都在本机 GPU 上完成，你的图像绝不会被上传。","h": {"open": "打开","cleared": "已清除历史记录","brush": "画笔","select": "选择","deselect": "取消选择","selectAll": "全选","reselect": "重新选择","inverse": "选择反向","rect": "矩形选框","ellipse": "椭圆选框","lasso": "套索","wand": "魔棒","feather": "羽化","expand": "扩展","contract": "收缩","border": "边界","smooth": "平滑","loadSel": "载入选区","saveSel": "存储选区","moveSel": "移动选区","nudgeSel": "微移选区","move": "移动","nudge": "微移","movePixels": "移动像素","dupPixels": "复制像素","duplicate": "复制图层","align": "对齐","transform": "自由变换","flipH": "水平翻转画布","flipV": "垂直翻转画布","rot90": "旋转 90 度","rot270": "旋转 90 度","rot180": "旋转 180 度","canvasSize": "画布大小","crop": "裁剪","imageSize": "图像大小","trim": "裁切","rasterize": "栅格化","newLayer": "新建图层","delLayer": "删除图层","viaCopy": "通过拷贝的图层","viaCut": "通过剪切的图层","group": "图层编组","ungroup": "取消编组","reorder": "图层顺序","merge": "合并图层","mergeDown": "向下合并","mergeVisible": "合并可见图层","flatten": "拼合图像","stamp": "盖印可见图层","clip": "剪贴蒙版","unclip": "释放剪贴蒙版","addMask": "添加图层蒙版","delMask": "删除蒙版","applyMask": "应用蒙版","invertMask": "反相蒙版","maskToggle": "切换蒙版","maskLink": "链接蒙版","lock": "锁定","rename": "重命名","visibility": "可见性","opacity": "不透明度","fill": "填充","blend": "混合模式","fillColor": "填充颜色","fillLayer": "填充图层","place": "置入","layerStyle": "图层样式","clearStyle": "清除图层样式","paste": "粘贴","cut": "剪切","clear": "清除","stroke": "描边","type": "文字","typeEdit": "编辑文字","shape": "形状","shapeEdit": "编辑形状","newChannel": "新建通道","delChannel": "删除通道"},"msg": {"noTarget": "没有可绘画的图层","locked": "图层已锁定","hidden": "无法在隐藏的图层上绘画","rasterFirst": "文字图层和形状图层需要先栅格化（图层 > 栅格化）","notOnMask": "此工具不能用于蒙版或通道","cloneSrc": "请先按住 Alt 单击设置仿制源","cloneSet": "已设置仿制源","noTransform": "请选择要变换的像素图层","selEmpty": "选区为空","noSel": "没有选区","noPixels": "请选择含有像素的图层","tooBig": "图像过大 ({w}×{h})","bigPlaced": "图像比文档大——可用 Ctrl+T 调整大小","opened": "已打开 {n}","unknownFile": "无法打开：{n}","openF // ───────────────────────── 시작 ─────────────────────────
(async function boot() {
  setLang(QS.get("lang") || LANG); document.documentElement.lang = LG;
  glc = $('gl'); ov = $('ov'); ovc = ov.getContext('2d');
  if (!GL.init(glc)) { document.body.innerHTML = `<div style="padding:40px;color:#ddd;font:15px sans-serif">${esc(T.noWebGL)}</div>`; return; }
  GL.blank();
  glc.addEventListener('webglcontextlost', e => { e.preventDefault(); toast(T.msg.ctxLost, 6000); });
  BR.init();
  MENU.build(); TOOLBAR.build(); PANELS.build(); OPT.initInput(); OPT.build();
  $('main').style.setProperty('--dock', PST.dock + 'px');
  // 판 너비 끌기
  $('dockGrip').onpointerdown = e => { e.preventDefault(); const x0 = e.clientX, w0 = PST.dock; const mv = ev => { PST.dock = clamp(w0 - (ev.clientX - x0), 240, 520); $('main').style.setProperty('--dock', PST.dock + 'px'); resize(); }; const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); saveSetSoon(); }; addEventListener('pointermove', mv); addEventListener('pointerup', up); };
  $('fileIn').onchange = e => { IO.openFiles([...e.target.files], false); e.target.value = ''; };
  $('placeIn').onchange = e => { IO.openFiles([...e.target.files], true); e.target.value = ''; };
  resize();
  const restored = !QS.has('fresh') && await IO.restore();
  if (restored) toast(T.msg.restored);
  refreshAll(); requestAnimationFrame(frame);
  // 처음 쓰는 사람에게 한 번: 사용법 한 줄
  if (!store.get('seen', false)) { store.set('seen', true); setTimeout(() => toast(T.msg.firstHint, 6000), 1200); }
  window.addEventListener('beforeunload', () => { IO.saveNow(); saveSettings(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { IO.saveNow(); saveSettings(); } });
  window.PAINT = { D: () => D, DOCS, IO, SEL, LAYER, TF, BR, COMP, GL, PST, setTool, DLG }; window.PSDX = PSD; window.LEARNX = LEARN; // 시험용
})();
