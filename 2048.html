<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title id="pageTitle">2048</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { background: radial-gradient(120% 80% at 50% 0%, #1c2346 0%, #0b0e1d 60%, #070912 100%); font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Hiragino Sans', 'Yu Gothic UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK KR', system-ui, sans-serif; color: #eef1ff; user-select: none; -webkit-user-select: none; touch-action: none; outline: none; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
.top { width: var(--bw); display: flex; align-items: center; gap: 8px; }
.top .wl { height: 24px; width: auto; flex: none; display: block; margin-left: 2px; }
.top .ttl { font-weight: 900; font-size: 26px; letter-spacing: .02em; background: linear-gradient(90deg, #5cc8ff, #b06bff, #ff6b9a); -webkit-background-clip: text; background-clip: text; color: transparent; margin-right: auto; }
.ib { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: #dfe3ff; cursor: pointer; display: grid; place-items: center; flex: none; }
.ib svg { width: 18px; height: 18px; }
.modeline { width: var(--bw); font-size: 13px; color: #9aa3c7; display: flex; justify-content: space-between; gap: 8px; min-height: 18px; }
.modeline b { color: #dfe3ff; font-weight: 700; }
.stats { width: var(--bw); display: flex; gap: 8px; }
.stat { flex: 1; min-width: 0; background: rgba(255, 255, 255, .05); border: 1px solid rgba(160, 170, 255, .14); border-radius: 12px; padding: 6px 10px; position: relative; }
.stat small { display: block; font-size: 11px; letter-spacing: .03em; color: #9aa3c7; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat .plus { position: absolute; right: 10px; top: 4px; font-weight: 900; color: #7dffb0; animation: plus .8s ease-out forwards; pointer-events: none; }
@keyframes plus { to { transform: translateY(-26px); opacity: 0; } }
.actions { width: var(--bw); display: flex; gap: 8px; }
.btn { flex: 1 1 auto; padding: 10px 12px; font: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); } .btn:disabled { opacity: .35; cursor: default; filter: none; }
.btn.primary { background: linear-gradient(160deg, #6c7cff, #a05cff); border-color: transparent; color: #fff; box-shadow: 0 8px 20px -8px rgba(140, 100, 255, .7); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.board { position: relative; width: var(--bw); height: var(--bw); border-radius: calc(var(--g) * 1.6); background: rgba(14, 18, 40, .85); border: 1px solid rgba(160, 170, 255, .16); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9), inset 0 0 40px rgba(90, 110, 255, .08); flex: none; }
.board.shake { animation: shake .28s; }
@keyframes shake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -3px); } 60% { transform: translate(-3px, -2px); } 80% { transform: translate(2px, 3px); } }
.cell { position: absolute; border-radius: calc(var(--g) * 1.1); background: rgba(255, 255, 255, .045); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .35); }
.tile { position: absolute; left: 0; top: 0; width: var(--cs); height: var(--cs); transition: transform var(--sp) cubic-bezier(.2, .8, .3, 1); will-change: transform; z-index: 2; }
.tile .in { width: 100%; height: 100%; border-radius: calc(var(--g) * 1.1); display: grid; place-items: center; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; background: var(--bg); color: var(--fg); box-shadow: inset 0 calc(var(--cs) * .06) 0 rgba(255, 255, 255, .18), inset 0 calc(var(--cs) * -.07) 0 rgba(0, 0, 0, .25), 0 calc(var(--cs) * .05) calc(var(--cs) * .12) rgba(0, 0, 0, .35); }
.tile.glow .in { box-shadow: inset 0 calc(var(--cs) * .06) 0 rgba(255, 255, 255, .25), inset 0 calc(var(--cs) * -.07) 0 rgba(0, 0, 0, .25), 0 0 calc(var(--cs) * .35) var(--gl); }
.tile.new .in { animation: appear .2s ease-out both; animation-delay: calc(var(--sp) * .6); }
.tile.pop { z-index: 3; } .tile.pop .in { animation: pop .22s ease-out; }
.tile.stone .in { background: repeating-linear-gradient(135deg, #2a2f45 0 8px, #232838 8px 16px); color: #5d6684; box-shadow: inset 0 0 0 2px #3a4160, inset 0 -6px 0 rgba(0, 0, 0, .3); }
@keyframes appear { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes pop { 0% { transform: scale(.85); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }
.hint { font-size: 12.5px; color: #7d86ad; text-align: center; width: var(--bw); }
.ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; background: rgba(5, 7, 16, .6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ov[hidden] { display: none; }
.card { background: linear-gradient(160deg, rgba(30, 34, 64, .9), rgba(12, 14, 30, .95)); border: 1px solid rgba(160, 170, 255, .18); border-radius: 22px; padding: 22px 22px 18px; width: min(420px, 100%); max-height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8); }
.card::-webkit-scrollbar { display: none; }
.logo { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
.logo span { width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: 28px; color: #fff; box-shadow: inset 0 4px 0 rgba(255, 255, 255, .2), inset 0 -5px 0 rgba(0, 0, 0, .25), 0 0 18px var(--gl); background: var(--bg); animation: bob 2.6s ease-in-out infinite; }
.logo span:nth-child(2) { animation-delay: .15s; } .logo span:nth-child(3) { animation-delay: .3s; } .logo span:nth-child(4) { animation-delay: .45s; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.tag { text-align: center; color: #9aa3c7; font-size: 13px; letter-spacing: .08em; margin-bottom: 16px; }
.mbox { border: 1px solid rgba(160, 170, 255, .16); background: rgba(255, 255, 255, .04); border-radius: 16px; padding: 14px; margin-top: 10px; }
.mbox h3 { font-size: 17px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mbox h3 small { font-size: 12px; color: #ffb35c; font-weight: 800; white-space: nowrap; }
.mbox p { font-size: 12.5px; color: #9aa3c7; margin-top: 4px; line-height: 1.45; }
.mbox .status { font-size: 13px; color: #c5cbea; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 6px 11px; font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; border: 1px solid rgba(160, 170, 255, .2); background: rgba(255, 255, 255, .06); color: inherit; cursor: pointer; }
.chip.on { background: linear-gradient(160deg, #6c7cff, #a05cff); border-color: transparent; color: #fff; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
h2 { font-size: 22px; text-align: center; margin-bottom: 10px; }
.big { text-align: center; font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(90deg, #5cc8ff, #b06bff, #ff6b9a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: #9aa3c7; font-size: 13px; }
.newrec { text-align: center; color: #ffd23f; font-weight: 800; letter-spacing: .1em; font-size: 13px; margin-top: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.grid2 { display: grid; grid-template-columns: 1fr auto; gap: 7px 14px; margin-top: 14px; font-size: 14px; color: #c5cbea; font-variant-numeric: tabular-nums; }
.grid2 b { color: #fff; text-align: right; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: #c5cbea; }
.row > span:first-child { white-space: nowrap; }
.row .chips { margin-top: 0; justify-content: flex-end; }
.sl { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: #c5cbea; }
.sl input { width: 100%; accent-color: #8a7cff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 6px; }
td { padding: 7px 4px; border-bottom: 1px solid rgba(255, 255, 255, .06); } td:last-child { text-align: right; color: #9aa3c7; font-size: 12.5px; }
td:first-child { color: #b9a6ff; font-weight: 800; }
h4 { font-size: 13px; color: #9aa3c7; letter-spacing: .08em; margin-top: 14px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 13.5px; color: #c5cbea; align-items: center; }
.keys kbd { font: 700 12px ui-monospace, monospace; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .15); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: #fff; justify-self: start; white-space: nowrap; }
.tips { margin-top: 14px; display: grid; gap: 6px; font-size: 12.5px; color: #9aa3c7; line-height: 1.45; }
.tips div::before { content: '•'; color: #a05cff; margin-right: 6px; }
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 12; background: rgba(20, 24, 50, .92); border: 1px solid rgba(160, 170, 255, .3); padding: 10px 18px; border-radius: 14px; font-weight: 800; animation: toast 1.8s ease forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.mini { display: grid; gap: 3px; margin: 12px auto 0; width: 132px; }
.mini i { aspect-ratio: 1; border-radius: 4px; background: var(--bg); display: block; }
</style>

class Rng {

// ───────────────────────── 8비트 소리 장치 (펄스 2 · 삼각 1 · 잡음 1, 옛 게임기 방식) ─────────────────────────
const NOTE_IX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function parseTrack(src) {
  const ev = []; let t = 0;

    const [n, l] = tok.split(':'); const len = +(l || 1);

const CH_Q = { '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 10], m7: [0, 3, 10], dim: [0, 3, 6] };
function chordNotes(name) { const m = /^([A-G][#b]?)(m7|m|7|dim)?$/.exec(name); const root = noteMidi(m[1] + '3'); return CH_Q[m[2] || ''].map(i => root + i); }

// 베이스: 근음 옥타브 왕복 (8분), 3박자 곡은 근음·5음·5음
function bassLine(chords, bar, style) {
  return chords.map(c => {
    const [r, , f] = chordNotes(c); const R = r - 12, F5 = f - 12;
    if (bar === 12) return `${MN(R)}:4 ${MN(F5)}:4 ${MN(F5 + 0)}:4`;
    if (style === 'pizz') return `${MN(R)}:2 r:2 ${MN(F5 - 12 < 36 ? F5 : F5 - 12)}:2 r:2 ${MN(R)}:2 r:2 ${MN(F5 - 12 < 36 ? F5 : F5 - 12)}:2 r:2`;
    return Array.from({ length: bar / 2 }, (_, i) => `${MN(i % 2 ? R + 12 : R)}:2`).join(' ');

function compLine(chords, bar) {
  return chords.map(c => {
    const [, th, fi] = chordNotes(c).map(m => m + 12);
    if (bar === 12) return `r:4 ${MN(th)}:2 r:2 ${MN(fi)}:2 r:2`;
    return `r:2 ${MN(th)}:2 r:2 ${MN(fi)}:2 r:2 ${MN(th)}:2 r:2 ${MN(fi)}:2`;
  }).join(' | ');
}
const rep = (s, n) => Array(n).fill(s).join(' | ');

class Chip {
