<style>

const WORKER_SRC = "// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 \uacc4\uc0b0 \uc77c\uafbc (Web Worker \uc548\uc5d0\uc11c \ub3c8\ub2e4) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// \ubc1b\ub294 \uc77c:\n//   ref  : \uae30\uc900\uc810 \uada4\ub3c4\ub97c \uace0\uc815\uc18c\uc218\uc810(BigInt)\uc73c\ub85c \uc815\ubc00 \uacc4\uc0b0 \u2192 double \ubc30\uc5f4\ub85c \ub3cc\ub824\uc90c\n//   setref: \uae30\uc900 \uada4\ub3c4 \ubc1b\uc544 \ub450\uae30\n//   rows : \ud654\uba74 \uba87 \uc904 \uacc4\uc0b0 (\uc77c\ubc18 \u00b7 \uc12d\ub3d9 \u00b7 \uc904\ub9ac\uc544)\n// \ub3cc\ub824\uc8fc\ub294 \uac12 (\ud654\uc18c\ub9c8\ub2e4): it = \ubd80\ub4dc\ub7ec\uc6b4 \ubc18\ubcf5 \uc218 (-1 = \uc548\ucabd), ang = \ubc95\uc120 \ubc29\ud5a5(\uc870\uba85), de = \uacbd\uacc4\uae4c\uc9c0 \uac70\ub9ac(\ud654\uc18c \ub2e8\uc704)\nlet REF = null;\nconst BAIL = 65536;          // |z|^2 > 256^2 \uc774\uba74 \ud0c8\ucd9c (\ubd80\ub4dc\ub7ec\uc6b4 \uc0c9\uc774 \ub9e4\ub044\ub7fd\uac8c)\nconst LOG2 = Math.log(2);\nfunction bigToD(z, F, P) { return F <= 1000 ? Number(z) * P : Number(z >> BigInt(F - 1000)) * P; }\nfunction refOrbit(msg) {\n  const F = msg.F, Fb = BigInt(F), F1 = BigInt(F - 1), cx = BigInt(msg.cx), cy = BigInt(msg.cy), N = msg.maxIter;\n  const P = F <= 1000 ? Math.pow(2, -F) : Math.pow(2, -1000);\n  const zr = new Float64Array(N + 2), zi = new Float64Array(N + 2);\n  let a = 0n, b = 0n, n = 0, t0 = Date.now();\n  for (; n <= N; n++) {\n    const ar = bigToD(a, F, P), ai = bigToD(b, F, P); zr[n] = ar; zi[n] = ai;\n    if (ar * ar + ai * ai > 1e8) break;          // \ud0c8\ucd9c\ud55c \uac12\uc740 \ub123\uc9c0 \uc54a\ub294\ub2e4 (\uc720\ud6a8\ud55c \uc55e\ubd80\ubd84\ub9cc)\n    const a2 = (a * a) >> Fb, b2 = (b * b) >> Fb, ab = (a * b) >> F1;\n    a = a2 - b2 + cx; b = ab + cy;\n    if ((n & 4095) === 0 && Date.now() - t0 > 250) { t0 = Date.now(); self.postMessage({ type: 'refprog', id: msg.id, n, N }); }\n  }\n  const len = Math.max(1, Math.min(n, N + 1));\n  return { zr: zr.slice(0, len), zi: zi.slice(0, len), len };\n}\nfunction rows(m) {\n  const { W, y0, y1, maxIter, light } = m, dx = m.dx, nPx = W * (y1 - y0);\n  const it = new Float32Array(nPx), ang = new Float32Array(nPx), de = new Float32Array(nPx);\n  const mode = m.mode, f = m.formula;\n  const pw = f === 'multi3' ? 3 : 2, lpw = Math.log(pw);\n  for (let py = y0; py < y1; py++) {\n    for (let px = 0; px < W; px++) {\n      const k = (py - y0) * W + px;\n      let n = 0, zr = 0, zi = 0, dr = 0, di = 0, fr = 0, fi = 0, mag = 0, esc = false;\n      if (mode === 'perturb') {\n        // \uc12d\ub3d9: \uae30\uc900 \uada4\ub3c4 Z \uc640\uc758 \ucc28\uc774 z \ub9cc double \ub85c. \ub9ac\ubca0\uc774\uc2f1\uc73c\ub85c \ud654\uba74 \uae68\uc9d0\uc744 \ub9c9\ub294\ub2e4.\n        const Zr = REF.zr, Zi = REF.zi, len = REF.len, dcr = m.ox + px * dx, dci = m.oy - py * dx; let r = 0;\n        let sr = 1e9, si = 1e9, per = 0, perLen = 16, mr = 1, mi = 0;   // \uc8fc\uae30 \uac80\ucd9c: \uac19\uc740 \uac12\uc744 \ub418\ud480\uc774\ud558\uace0, \uadf8 \uc8fc\uae30\uac00 \ub04c\uc5b4\ub2f9\uae30\ub294(\uc2b9\uc218 < 1) \uacbd\uc6b0\ub9cc \uc548\ucabd\n        while (n < maxIter) {\n          if (r >= len - 1) { zr += Zr[r]; zi += Zi[r]; r = 0; }     // \uae30\uc900 \uada4\ub3c4 \ub05d: \uc804\uccb4 \uac12\uc73c\ub85c \uac08\uc544\ud0c0\uace0 \ucc98\uc74c\ubd80\ud130\n          const Ar = Zr[r], Ai = Zi[r];\n          { const gr = 2 * (Ar + zr), gi = 2 * (Ai + zi), t = mr * gr - mi * gi; mi = mr * gi + mi * gr; mr = t; }\n          if (light) { const gr = Ar + zr, gi = Ai + zi, ndr = 2 * (gr * dr - gi * di) + 1; di = 2 * (gr * di + gi * dr); dr = ndr; }\n          const nzr = 2 * (Ar * zr - Ai * zi) + zr * zr - zi * zi + dcr; zi = 2 * (Ar * zi + Ai * zr) + 2 * zr * zi + dci; zr = nzr;\n   S.done = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'), im = g.createImageData(w, h); colorize(im, S.it, S.ang, S.de, 0, w * h); g.putImageData(im, 0, 0); S.canvas = c; onDone(S); };
  S.status = onStatus; return S;
}

// ════════════ 확대 영상 (XaoS 방식: 키프레임을 미리 계산해 겹쳐 늘린다) ════════════
let MOVIE = null;
function movieDialog() {
  const deep = zoomText(V.scale);
  dialog(`<h3>${esc(T.movie)}</h3><div class="mopts">
      <button class="opt on" data-m="fly"><b>${esc(T.movieFly)}</b><small>${esc(fmt(T.movieFlyD, { z: deep }))}</small></button>
      <button class="opt" data-m="dive"><b>${esc(T.movieDive)}</b><small>${esc(T.movieDiveD)}</small></button></div>
    <h5>${esc(T.speed)}</h5><div class="chips" id="msp"></div><p class="note">${esc(T.movieNote)}</p>
    <div class="foot"><button class="btn" data-close>${esc(T.cancel)}</button><button class="btn pri" id="ok">${svg('play')}${esc(T.start)}</button></div>`, (o, close) => {
    let mode = 'fly', sp = lsGet('mspeed', 1.6);
    o.querySelectorAll('.opt').forEach(b => b.onclick = () => { mode = b.dataset.m; o.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); });
    chipRow(o.querySelector('#msp'), '', [[3, T.slow], [1.6, T.normal], [0.9, T.fast]], sp, v => { sp = +v; lsSet('mspeed', sp); });
    o.querySelector('#ok').onclick = () => { close(); startMovie(mode, sp); };

}
function startMovie(mode, secPerDouble) {
  stopMovie(true); ENG.cancel();
  const target = { ...V }, home = HOME[V.julia.on ? 'julia' : V.formula];
  const s0 = mode === 'fly' ? Math.max(V.scale, home[2]) : V.scale;
  const n = mode === 'fly' ? Math.max(1, Math.ceil(Math.log2(s0 / V.scale))) : 1e9;
  const q = [0.45, 0.6, 0.8][SET.quality] || 0.6, w = Math.round(CW * q), h = Math.round(CH * q);
  MOVIE = { mode, target, s0, n, k: 0, p: 0, sec: secPerDouble, frames: [], busy: false, w, h, anchors: [], last: performance.now(), centers: [] };
  // 영상 동안 기준점 계산을 한 번만: 가장 깊은 곳의 비트 수로 고정
  MOVIE.F = mode === 'fly' ? V.F : fracBitsFor(MIN_SCALE.deep);
  MOVIE.centers[0] = { cx: refix(V.cx, V.F, MOVIE.F), cy: refix(V.cy, V.F, MOVIE.F) };
  if (mode === 'fly') for (let i = 0; i <= n; i++) MOVIE.centers[i] = MOVIE.centers[0];
  $('movieBar').hidden = false; syncTop(); computeFrame(0); requestAnimationFrame(movieTick);
}
const frameScale = (i, M = MOVIE) => M.s0 / Math.pow(2, i);
function computeFrame(i) {
  const M = MOVIE; if (!M || M.busy || M.frames[i] || !M.centers[i]) return; if (M.mode === 'fly' && i > M.n) return;
  const sc = i === M.n && M.mode === 'fly' ? M.target.scale : frameScale(i);
  if (sc < MIN_SCALE.deep) { M.end = Math.min(M.end ?? i - 1, i - 1); return; }
  M.busy = true;
  const v = { formula: M.target.formula, julia: M.target.julia, cx: M.centers[i].cx, cy: M.centers[i].cy, F: M.F, scale: sc };
  v.maxIter = maxIterOf(v);
  const refIter = M.mode === 'fly' ? maxIterOf({ ...v, scale: M.target.scale }) : 0;
  const S = makeSink(M.w, M.h, COL.light || COL.edge > 0, S => {
    if (MOVIE !== M) return; M.busy = false; M.frames[i] = S;
    if (M.mode === 'dive') pickNext(i, S);

  }, p => { $('movieMsg').textContent = fmt(T.refCalc, { p: Math.round(p * 100) }); });

}
function computeAhead() { const M = MOVIE; if (!M) return; for (let i = M.k; i <= M.k + 2; i++) if (!M.frames[i]) { computeFrame(i); break; } }
// 자동 잠수: 가운데 가까이에서 경계에 가장 가까운(반복이 가장 큰) 바깥 점으로

    const v = S.it[y * w + x]; if (v < 0) continue; const sc = v - 0.02 * Math.hypot(x - w / 2, y - h / 2) + Math.random() * 0.5; if (sc > best) { best = sc; bx = x; by = y; }
  }

}
function movieTick(now) {
  const M = MOVIE; if (!M) return; const dt = Math.min(0.1, (now - M.last) / 1000); M.last = now;
  const A = M.frames[M.k], B = M.frames[M.k + 1], finalFly = M.mode === 'fly' && M.k >= M.n;
  if (finalFly || (M.end != null && M.k >= M.end)) { finishMovie(); return; }
  if (A && B) { M.p += dt / M.sec; $('movieMsg').textContent = zoomText(frameScale(M.k) / Math.pow(2, Math.min(1, M.p))); }
  else if (!M.busy) computeAhead(); else if (!$('movieMsg').textContent.includes('%')) $('movieMsg').textContent = T.computing;
  if (M.p >= 1) { M.frames[M.k] = null; M.k++; M.p = 0; computeAhead(); }
  const a = M.frames[M.k], b = M.frames[M.k + 1];
  if (a) {
    // 지금 프레임을 기준점 쪽으로 늘리고, 다음 프레임을 그 가운데에 겹친다
    const p = b ? M.p : 0, k = Math.pow(2, p), anc = M.anchors[M.k] || { x: M.w / 2, y: M.h / 2 }, cxp = M.w / 2, cyp = M.h / 2;
    const ax = anc.x + (cxp - anc.x) * p, ay = anc.y + (cyp - anc.y) * p, sx = W / M.w;
    ctx.setTransform(sx, 0, 0, sx, 0, 0); ctx.imageSmoothingEnabled = true;
    ctx.save(); ctx.translate(ax, ay); ctx.scale(k, k); ctx.translate(-anc.x, -anc.y); ctx.drawImage(a.canvas, 0, 0); ctx.restore();
    if (b) { ctx.save(); ctx.translate(ax, ay); ctx.scale(k / 2, k / 2); ctx.translate(-M.w / 2, -M.h / 2); ctx.drawImage(b.canvas, 0, 0); ctx.restore(); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);

}
function finishMovie() {

}
function stopMovie(silent) {
  if (!MOVIE) return; const M = MOVIE; MOVIE = null; ENG.cancel(); $('movieBar').hidden = true; syncTop();
  if (!silent) { const c = M.centers[M.k]; if (c) { V = { formula: M.target.formula, julia: M.target.julia, cx: c.cx, cy: c.cy, F: M.F, scale: frameScale(M.k, M) / Math.pow(2, M.p) }; setBits(V); } xf = null; render(); pushHist(); }
}
// 장소로 가기 (영상으로 날아가려면 ▶)
function flyTo(pl) {
  const v = mkView(pl.f || 'mandel', pl.x, pl.y, pl.s, pl.j ? { on: true, jr: pl.j[0], ji: pl.j[1] } : null);
  if (pl.pal) { COL.pal = pl.pal; LUT = buildLut(COL.pal); }
  if (pl.col) Object.assign(COL, pl.col);
  saveSet(); if (mobile()) $('side').classList.add('closed');
  setView(v); if (TAB === 'color') buildSide();
}

// ════════════ 큰 그림 저장 ════════════
function exportDialog() {
  const sizes = [['screen', `${CW * 2} × ${CH * 2}`, CW * 2, CH * 2], ['fhd', '1920 × 1080', 1920, 1080], ['qhd', '2560 × 1440', 2560, 1440], ['uhd', '3840 × 2160', 3840, 2160], ['sq', '2048 × 2048', 2048, 2048]];
  let pick = 'fhd', aa = false;
  dialog(`<h3>${esc(T.savePng)}</h3><div class="mopts" id="sz">${sizes.map(([k, l]) => `<button class="opt ${k === pick ? 'on' : ''}" data-k="${k}"><b>${esc(T.sizes[k])}</b><small>${l}</small></button>`).join('')}</div>
    <h5>${esc(T.antialias)}</h5><div class="chips" id="aa"></div><p class="note">${esc(T.exportNote)}</p>
    <div class="foot"><button class="btn" data-close>${esc(T.cancel)}</button><button class="btn pri" id="ok">${esc(T.save)}</button></div>`, (o, close) => {
    o.querySelectorAll('#sz .opt').forEach(b => b.onclick = () => { pick = b.dataset.k; o.querySelectorAll('#sz .opt').forEach(x => x.classList.toggle('on', x === b)); });
    chipRow(o.querySelector('#aa'), '', [[0, T.off], [1, '2×2']], 0, v => { aa = v === '1'; });
    o.querySelector('#ok').onclick = () => { const s = sizes.find(x => x[0] === pick); close(); exportPng(s[2], s[3], aa && s[2] * s[3] <= 2560 * 1440); };
  });
}
function exportPng(w, h, aa) {
  if (MOVIE) stopMovie(true); const m = aa ? 2 : 1, rw = w * m, rh = h * m;
  const busy = document.createElement('div'); busy.className = 'busy'; busy.innerHTML = `<div>${esc(T.rendering)}</div><div class="bar"><i id="exProg"></i></div><button class="btn" id="exCancel">${esc(T.cancel)}</button>`; document.body.appendChild(busy);
  let cancelled = false; busy.querySelector('#exCancel').onclick = () => { cancelled = true; ENG.cancel(); busy.remove(); render(); };
  // 같은 중심·같은 세로 범위, 가로는 그림 비율대로
  const v = { ...V, maxIter: maxIterOf(V) }; let rows = 0;
  const S = makeSink(rw, rh, COL.light || COL.edge > 0, S => {
    if (cancelled) return; busy.remove();
    let c = S.canvas; if (m > 1) { const d = document.createElement('canvas'); d.width = w; d.height = h; const g = d.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, w, h); c = d; }
    c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `wiiiv-fractal-${zoomText(V.scale).replace(/[^0-9a-z.]+/gi, '_')}.png`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast(T.savedPng); render(); });
  });
  S.prog = () => { rows++; const p = $('exProg'); if (p) p.style.width = Math.min(100, rows / Math.ceil(rh / 6) * 100) + '%'; };
  ENG.start(v, rw, rh, { light: COL.light || COL.edge > 0, passes: [1], sink: S });
}

// ════════════ 단축키 ════════════
addEventListener('keydown', e => {
  if (document.querySelector('.ovl') || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === 'Escape' && MOVIE) { stopMovie(); return; }
  if (k === '+' || k === '=') animZoom(CW / 2, CH / 2, 2); else if (k === '-' || k === '_') animZoom(CW / 2, CH / 2, 0.5);
  else if (k === 'Home') goHome(); else if (k === 'Backspace') { e.preventDefault(); goHist(-1); }
  else if (/^Arrow/.test(k)) { e.preventDefault(); const s = CH * 0.12; moveBy(k === 'ArrowLeft' ? -s : k === 'ArrowRight' ? s : 0, k === 'ArrowUp' ? -s : k === 'ArrowDown' ? s : 0); render(); pushHist(); }
  else if (k === 'j' || k === 'J') $('bJul').click(); else if (k === 'o' || k === 'O') $('bOrb').click();
  else if (k === 'c' || k === 'C') { cycleOn = !cycleOn; cycleLast = performance.now(); if (TAB === 'color') buildSide(); }
  else if (k === 'p' || k === 'P') { const i = (PALETTE_ORDER.indexOf(COL.pal) + 1) % PALETTE_ORDER.length; COL.pal = PALETTE_ORDER[i]; LUT = buildLut(COL.pal); saveSet(); recolor(); if (TAB === 'color') buildSide(); toast(T.palNames[COL.pal] || COL.pal); }
  else if (k === 'm' || k === 'M') $('bMovie').click(); else if (k === 's' || k === 'S') exportDialog();
});
// 색 순환: 다시 계산 없이 띠를 흘린다
function loop(now) {
  if (cycleOn && !MOVIE && !rendering && !xf) { const dt = (now - cycleLast) / 1000; cycleLast = now; COL.offset = (COL.offset + dt * cycleSpeed * 0.15 + 1) % 1; recolor(); }
  else cycleLast = now;
  requestAnimationFrame(loop);
}

// ════════════ 시작 ════════════
$('jbox').onclick = () => { const c = $('jprev').dataset.c; if (!c) return; const [jr, ji] = c.split(',').map(Number); openJulia(+jr.toFixed(10), +ji.toFixed(10)); };

$('jprevT').textContent = T.juliaClick;
buildTop();
if (lsGet('panel', !mobile()) === false || mobile()) $('side').classList.add('closed');
buildSide();
(() => {
  const saved = lsGet('view', null); try { V = saved ? viewFrom(saved) : null; } catch (e) { V = null; }
  if (!V) { const h = HOME.mandel; V = mkView('mandel', h[0], h[1], h[2]); }
  resize(); render(); pushHist();
})();
let rzT = null; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { resize(); if (!MOVIE) render(); }, 150); });
requestAnimationFrame(loop);
window.__fx = { get V() { return V; }, set V(v) { V = v; }, ENG, setView, mkView, viewStr, viewFrom, render, get rendering() { return rendering; }, get MOVIE() { return MOVIE; }, startMovie, stopMovie, flyTo, COL, SET, recolor, zoomAbout, get buf() { return buf; }, get W() { return W; }, get H() { return H; }, exportPng, PLACES: () => PLACES };
