<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 체스</title>
<style>
:root{--bg:#0d0d1a;--panel:rgba(18,16,38,.74);--line:rgba(255,255,255,.09);--fg:#ecebff;--dim:#a3a2c8;--acc:#7c5cfc;--acc2:#b9a6ff;--gold:#e8c77a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.45 'Segoe UI','Malgun Gothic',-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
button,select{font:inherit;color:inherit}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{pointer-events:none}
#gl.grab{cursor:grabbing}#gl.pt{cursor:pointer}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#top{position:fixed;left:14px;top:14px;display:flex;align-items:center;gap:12px;padding:9px 16px 9px 10px;max-width:calc(100% - 330px)}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#7c5cfc,#4fb3ff);box-shadow:0 0 18px rgba(124,92,252,.6);color:#fff;flex:none}
#top b{font-size:15px;display:block;white-space:nowrap}
#status{font-size:12.5px;color:var(--acc2);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.chk{color:#ff7a8a;font-weight:700}
#side{position:fixed;right:14px;top:14px;bottom:14px;width:300px;display:flex;flex-direction:column;gap:10px;padding:14px;transition:transform .3s ease}
.pc{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent;transition:all .25s}
.pc.turn{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px rgba(124,92,252,.4)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}
.av.w{background:linear-gradient(#fff,#e2dac6);color:#2a2620}.av.b{background:linear-gradient(#2b2b38,#0d0d14);color:#e9e6ff;border:1px solid #4a4766}
.pc .nm{font-weight:600;font-size:13px}.pc .cap{font-size:16px;letter-spacing:-2px;color:var(--dim);min-height:20px;line-height:20px}
.pc .adv{font-size:11px;color:var(--gold);margin-left:6px;letter-spacing:0}
.pc .think{margin-left:auto;font-size:11px;color:var(--acc2)}
#moves{flex:1;overflow-y:auto;border-radius:12px;background:rgba(0,0,0,.2);padding:8px 6px;font-variant-numeric:tabular-nums;scrollbar-width:thin;min-height:70px}
.mv{display:grid;grid-template-columns:28px 1fr 1fr;gap:2px;padding:2px 6px;border-radius:6px;font-size:13px}
.mv:nth-child(odd){background:rgba(255,255,255,.03)}
.mv>span:first-child{color:var(--dim)}.mv .last{color:#fff;background:rgba(124,92,252,.4);border-radius:5px;padding:0 5px;margin-left:-5px;justify-self:start}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:14px 0}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:7px 2px;cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .15s}
.btn i{font-style:normal;font-size:17px;line-height:1.2}.btn:hover{background:rgba(124,92,252,.28);border-color:var(--acc)}.btn:disabled{opacity:.35;pointer-events:none}
.set{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;font-size:12px;color:var(--dim)}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:4px 2px;cursor:pointer;font-size:11.5px;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
#evalbar{position:fixed;left:16px;top:50%;transform:translateY(-50%);width:12px;height:44vh;border-radius:8px;overflow:hidden;background:#14141c;border:1px solid var(--line);box-shadow:0 0 18px rgba(0,0,0,.4)}
#evalw{position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(#ffffff,#d8d2c2);transition:height .7s cubic-bezier(.3,.8,.3,1)}
#evalbar.flip #evalw{bottom:auto;top:0}
#evaln{position:fixed;left:2px;width:40px;text-align:center;font-size:10.5px;color:var(--dim);top:calc(50% + 22vh + 6px);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,5,15,.28);z-index:10;padding:16px}
.modal[hidden]{display:none}
.card{padding:26px 28px;width:min(380px,100%);text-align:center}
.card h1{font-size:34px;letter-spacing:.01em;background:linear-gradient(90deg,#fff,#b9a6ff 55%,#4fb3ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.card .sub{color:var(--dim);margin:2px 0 20px;font-size:11px;letter-spacing:.2em}
.card .set{text-align:left;margin:0 auto 20px;gap:11px 12px}
.card p{color:var(--dim);margin:6px 0 18px}
.go{border:0;background:linear-gradient(135deg,#7c5cfc,#4f8bff);color:#fff;font-weight:700;font-size:15px;padding:11px 36px;border-radius:12px;cursor:pointer;box-shadow:0 6px 24px rgba(124,92,252,.5)}
.go.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line);margin-left:6px}
.promo{display:flex;gap:10px;justify-content:center;margin-top:14px}
.promo button{width:64px;height:64px;font-size:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);cursor:pointer;line-height:1}
.promo button:hover{background:var(--acc)}
#menu{position:fixed;right:14px;top:14px;width:42px;height:42px;border-radius:12px;display:none;place-items:center;font-size:20px;cursor:pointer;z-index:6}
#nogl{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);padding:30px;text-align:center}
#nogl[hidden]{display:none}
@media (max-width:860px){
  #side{left:10px;right:10px;top:auto;bottom:10px;width:auto;height:min(60vh,460px);transform:translateY(calc(100% + 20px))}
  #side.open{transform:none}
  #menu{display:grid}
  #top{max-width:calc(100% - 80px)}
  #evalbar,#evaln{display:none}
}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<div id="top" class="glass"><div class="logo">♞</div><div style="min-width:0"><b id="tTitle"></b><div id="status"></div></div></div>
<div id="evalbar"><div id="evalw"></div></div><div id="evaln"></div>
<button id="menu" class="glass">☰</button>
<aside id="side" class="glass">
  <div class="pc" id="pcTop"></div>
  <div id="moves"></div>
  <div class="pc" id="pcBot"></div>
  <div class="btns">
    <button class="btn" id="bNew"><i>✦</i><span></span></button>
    <button class="btn" id="bUndo"><i>↶</i><span></span></button>
    <button class="btn" id="bHint"><i>💡</i><span></span></button>
    <button class="btn" id="bFlip"><i>⟲</i><span></span></button>
  </div>
  <div class="set">
    <span id="lTheme"></span><div class="seg" id="segTheme"></div>
    <span id="lSound"></span><div class="seg" id="segSound"></div>
  </div>
</aside>
<div class="modal" id="mStart"><div class="card glass">
  <h1 id="sTitle"></h1><div class="sub">WIIIV · 3D CHESS</div>
  <div class="set">
    <span id="lOpp"></span><div class="seg" id="segOpp"></div>
    <span id="lLevel"></span><div class="seg" id="segLevel"></div>
    <span id="lColor"></span><div class="seg" id="segColor"></div>
    <span id="lTheme2"></span><div class="seg" id="segTheme2"></div>
  </div>
  <button class="go" id="bStart"></button>
</div></div>
<div class="modal" id="mPromo" hidden><div class="card glass"><b id="pTitle"></b><div class="promo" id="promoBtns"></div></div></div>
<div class="modal" id="mOver" hidden><div class="card glass"><h1 id="oTitle"></h1><p id="oText"></p><button class="go" id="bAgain"></button><button class="go ghost" id="bReview"></button></div></div>
<div id="nogl" hidden></div>
<script>
/*

  ];
  const KM = [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20];

  const ZP = new Int32Array(23 * 128).map(rnd), ZC = new Int32Array(16).map(rnd), ZE = new Int32Array(128).map(rnd), ZS = rnd();

            else out.push(enc(sq, t2, 0, 0));
