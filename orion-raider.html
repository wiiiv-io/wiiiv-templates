<title>오리온 레이더</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0d0d1a;overflow:hidden;user-select:none;-webkit-user-select:none;outline:none;touch-action:none}
body{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Hiragino Sans','PingFang SC',sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
/* 휴대폰 조작 */
#tui{position:fixed;inset:0;pointer-events:none;display:none}
#tui.show{display:block}
#tzone{position:absolute;left:0;top:48px;width:52%;bottom:var(--ph,110px);pointer-events:auto;touch-action:none}
#tstick{position:absolute;width:112px;height:112px;border-radius:50%;border:2px solid rgba(124,92,252,.55);background:rgba(124,92,252,.12);display:none;pointer-events:none}
#tstick.on{display:block}
#tstick i{position:absolute;left:31px;top:31px;width:50px;height:50px;border-radius:50%;background:rgba(200,180,255,.55);box-shadow:0 0 14px rgba(124,92,252,.7)}
.tb{position:absolute;pointer-events:auto;touch-action:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(160,140,255,.45);background:rgba(20,18,40,.55);color:#e6e0ff;font:700 16px 'Segoe UI',sans-serif;display:grid;place-items:center}
.tb.down{background:rgba(124,92,252,.6)}
.tb.big{width:86px;height:86px;border-radius:50%;right:18px;bottom:calc(var(--ph,110px) + 16px);font-size:30px;color:#ff8aa0;border-color:rgba(255,90,120,.6);background:rgba(60,10,25,.45)}
.tb.big.down{background:rgba(255,60,100,.55);color:#fff}
.tcol{position:absolute;right:114px;bottom:calc(var(--ph,110px) + 16px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.trow{position:absolute;right:14px;bottom:calc(var(--ph,110px) + 116px);display:flex;gap:6px;pointer-events:none}
.tcol .tb,.trow .tb{position:static}
.tb.laser{background:rgba(255,60,100,.45)}
#tpause{right:12px;top:44px}
#wlogo{position:fixed;left:12px;top:8px;height:20px;width:auto;display:block;z-index:2;filter:drop-shadow(0 0 5px rgba(124,92,252,.55))}
</style>

// ── wiiiv 표시 (2026-11-01 나무님): 앱 HTML 이 어디로 퍼지든 wiiiv 앱인 줄 알게
// - 누르면 wiiiv.ai 를 새 탭으로 연다. wiiiv 안(틀)에서는 이미 wiiiv 이고 새 창도 막혀 있어 링크를 걸지 않는다.
// - 그림은 앱 안의 것을 바로 쓰고, 같은 그림을 wiiiv.ai 에서 한 번 받아 간다 → 서버가 앱·환경별 사용 수를 센다 (IP·사용자 정보는 남기지 않음).
//   서버가 느리거나 막혀도 앱에는 영향이 없다. 같은 브라우저는 12시간 캐시라 다시 세지 않는다.
// 쓰는 법: wiiivMark(imgElement, '앱id')  — 원본: tools/wiiivapp-src/_shared/wiiiv-logo.js (모든 앱 같은 내용)
const WIIIV_HOME = 'https://wiiiv.ai';
const WIIIV_CTX = (() => {
  if (location.protocol === 'file:') return 'file';
  try { if (window.parent !== window && (location.href === 'about:srcdoc' || location.href === window.parent.location.href)) return 'wiiiv'; } catch { /* 다른 출처의 틀: 남의 사이트 */ }
  return 'web';
})();
let wiiivPinged = false;
function wiiivMark(img, app) {
  img.src = WIIIV_LOGO; img.alt = 'wiiiv'; img.draggable = false;
  if (!wiiivPinged) {
    wiiivPinged = true;
    try {
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* 없음 */ }
      new Image().src = `${WIIIV_HOME}/api/wivapp/logo?app=${encodeURIComponent(app)}&ctx=${WIIIV_CTX}&tz=${encodeURIComponent(tz)}&lang=${encodeURIComponent(navigator.language || '')}`;
    } catch { /* 무시 */ }
  }
  if (WIIIV_CTX !== 'wiiiv' && !img.dataset.wiiivLink) {
    img.dataset.wiiivLink = '1'; img.style.cursor = 'pointer'; img.title = 'wiiiv.ai';
    img.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); window.open(`${WIIIV_HOME}/?from=${encodeURIComponent(app)}`, '_blank', 'noopener'); });
  }
  return img;
}
/*__WIIIV_MARK_END__*/

      if (lc.z > 5) { const lq = proj(lc); ctx.beginPath(); ctx.arc(lq[0], lq[1], 4, 0, Math.PI * 2); ctx.stroke(); }
    } else {
      // 화면 밖이면 가장자리에 화살표
      const ang = Math.atan2(-c.y, c.x), ex = W / 2 + Math.cos(ang) * Math.min(W, H) * 0.38;
      const ey = clamp(H / 2 + Math.sin(ang) * Math.min(W, H) * 0.3, 50, H - ph - 24);   // 계기판에 겹치지 않게
      ctx.fillStyle = P.tgt.k.radar; ctx.beginPath();
      ctx.moveTo(ex + Math.cos(ang) * 12, ey + Math.sin(ang) * 12); ctx.lineTo(ex + Math.cos(ang + 2.5) * 10, ey + Math.sin(ang + 2.5) * 10); ctx.lineTo(ex + Math.cos(ang - 2.5) * 10, ey + Math.sin(ang - 2.5) * 10); ctx.fill();
    }
  }
  // 알림
  if (G.msgT > 0 && G.msg && G.state === 'play') {
    ctx.globalAlpha = Math.min(1, G.msgT * 2); ctx.font = '700 18px Segoe UI, Malgun Gothic, sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe9a8'; ctx.fillText(G.msg, W / 2, H * 0.22); ctx.globalAlpha = 1;
  }
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,60,60,${G.flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  if (G.wire) { ctx.fillStyle = '#5dff9c'; ctx.font = '10px monospace'; ctx.textAlign = 'left'; ctx.fillText('VECTOR', 14, 38); }
}
// 터치 기기에서는 'Enter / 클릭 — 계속' 같은 안내를 '▶ 계속' 으로
const nextT = t => (isTouch() && t.includes('—') ? '▶ ' + t.split('—').pop().trim() : t);
function panel(lines, title, sub) {
  ctx.fillStyle = 'rgba(8,8,20,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7c5cfc'; fitFont(title, W - 24, 800, Math.min(44, W / 14), 14); ctx.fillText(title, W / 2, H * 0.3);
  if (sub) { ctx.fillStyle = '#9aa0c8'; ctx.font = '600 13px Segoe UI, sans-serif'; ctx.fillText(sub, W / 2, H * 0.3 + 26); }
  // 화면이 좁으면 낱말 단위로 줄을 나눈다
  let y = H * 0.42; const maxW = W - 32;
  for (const l of lines) {
    ctx.fillStyle = l.c || '#e6e8ff'; ctx.font = l.f || '15px Segoe UI, Malgun Gothic, sans-serif';
    const words = String(l.t).split(' '); let line = '';
    const out = []; for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } out.push(line);
    for (const o of out) { ctx.fillText(o, W / 2, y); y += 22; } y += 4;
  }
}
// 제목 화면용 — 천천히 도는 T형 전투기
function titleShip() {
  const e = { kind: 'fighter', k: KIND.fighter, pos: add(P.pos, add(mul(P.o.f, 150), mul(P.o.u, -10))), o: basis(), hitT: 0, hp: 1 };
  const a = G.time * 0.7; e.o.f = norm(V(Math.sin(a), 0.25 * Math.sin(a * 0.7), Math.cos(a))); e.o.u = V(0, 1, 0); orthonormal(e.o);
  const keep = enemies; enemies = [e]; drawWorld(); enemies = keep;
}
function render() {
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake * 12, rnd(-1, 1) * G.shake * 12);
  drawSky();
  if (G.state === 'title') {
    [P.o.f, P.o.r] = turnPair(P.o.f, P.o.r, 0.0015); orthonormal(P.o);
    titleShip(); ctx.restore();
    const tch = isTouch();
    panel([
      ...(tch ? [T.touch1, T.touch2] : [T.keys1, T.keys2, T.keys3]).map(t => ({ t, c: '#cfd6ff', f: '13px Segoe UI, Malgun Gothic, sans-serif' })),
      { t: '' },
      { t: tch ? T.tapStart : T.clickStart, c: Math.sin(G.time * 4) > 0 ? '#ffe9a8' : '#a99a6a', f: '700 17px Segoe UI, Malgun Gothic, sans-serif' },
      { t: G.best ? `BEST ${G.best}` : '', c: '#9aa0c8' },
    ], T.title, T.sub);
    return;
  }
  drawDust(); drawWorld(); drawHud();
  ctx.restore();
  if (G.state === 'brief') {
    const b = T.brief[G.stage];
    panel([{ t: b[1] }, { t: '' }, { t: nextT(T.enterNext), c: '#ffe9a8', f: '700 15px Segoe UI, Malgun Gothic, sans-serif' }], `${T.stage} ${G.stage + 1} — ${b[0]}`);
  } else if (G.state === 'paused') panel([{ t: T.paused }], T.title);
  else if (G.state === 'clear') panel([{ t: `${T.bonus} +${G.bonus}` }, { t: `${T.score} ${G.score}` }, { t: '' }, { t: nextT(T.enterNext), c: '#ffe9a8' }], T.clear);
  else if (G.state === 'over') panel([{ t: `${T.score} ${G.score}` }, { t: '' }, { t: nextT(T.retry), c: '#ffe9a8' }], G.failReason === 'escaped' ? T.escaped : T.over);
  else if (G.state === 'ending') {
    const lines = T.endText.map(t => ({ t, c: t.startsWith('—') ? '#c8a2ff' : '#e6e8ff' }));
    lines.push({ t: '' }, { t: `${T.endScore} ${G.score}`, c: '#ffe9a8', f: '700 18px Segoe UI, Malgun Gothic, sans-serif' }, { t: nextT(T.endAgain), c: '#9aa0c8' });
    panel(lines, T.endTitle);
  }
}

// ───────────────────────── 실행 ─────────────────────────
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  update(dt); render();
  if (AC) { music(G.state === 'title' ? 'title' : G.state === 'ending' ? 'ending' : G.stage >= 5 ? 'battle2' : 'battle'); musPause(G.state === 'paused' || document.hidden); }
  if (typeof touchUi === 'function') touchUi();
  requestAnimationFrame(loop);
}
function boot() {
  resize();
  if (W < 10 || H < 10) { requestAnimationFrame(boot); return; }
  document.body.focus();
  requestAnimationFrame(loop);
}
boot();

// ───────────────────────── 휴대폰 조작 (떠 있는 조종간 + 버튼) ─────────────────────────
const TOUCH = { x: 0, y: 0, on: false, id: null, cx: 0, cy: 0 };
const isTouch = () => !!(matchMedia('(pointer: coarse)').matches || TOUCH.seen);
(function buildTouch() {
  const ui = document.createElement('div'); ui.id = 'tui';
  ui.innerHTML = `<div id="tzone"></div><div id="tstick"><i></i></div>
    <button class="tb big" data-k="fire" id="tfire"></button>
    <div class="tcol"><button class="tb" data-k="r">▲</button><button class="tb" data-k="f">▼</button></div>
    <div class="trow"><button class="tb" data-k="q">⟲</button><button class="tb" data-k="e">⟳</button><button class="tb" data-k="z" id="tz">Z</button><button class="tb" data-k="t" id="tt">T</button><button class="tb" data-k="v">V</button></div>
    <button class="tb" data-k="p" id="tpause">II</button>`;
  document.body.appendChild(ui);
  const zone = ui.querySelector('#tzone'), stick = ui.querySelector('#tstick'), knob = stick.querySelector('i');
  const R = 56;
  zone.addEventListener('pointerdown', e => {
    e.preventDefault(); audio(); if (e.pointerType === 'touch') TOUCH.seen = true; if (TOUCH.on) return;
    TOUCH.on = true; TOUCH.id = e.pointerId; TOUCH.cx = e.clientX; TOUCH.cy = e.clientY; try { zone.setPointerCapture(e.pointerId); } catch (x) { /* */ }
    stick.style.left = (e.clientX - R) + 'px'; stick.style.top = (e.clientY - R) + 'px'; stick.classList.add('on'); knob.style.transform = 'translate(0,0)';
  });
  zone.addEventListener('pointermove', e => {
    if (!TOUCH.on || e.pointerId !== TOUCH.id) return;
    let dx = e.clientX - TOUCH.cx, dy = e.clientY - TOUCH.cy; const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    // 가운데 근처는 무시하고, 끝으로 갈수록 세게 (세밀한 조준이 쉽게)
    const f = v => { const a = Math.abs(v) / R; return Math.sign(v) * (a < 0.08 ? 0 : Math.pow((a - 0.08) / 0.92, 1.5)); };
    TOUCH.x = f(dx); TOUCH.y = -f(dy);
  });
  const end = e => { if (e.pointerId !== TOUCH.id) return; TOUCH.on = false; TOUCH.id = null; TOUCH.x = TOUCH.y = 0; stick.classList.remove('on'); };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  // 버튼: 누르는 동안 키를 누른 것으로
  ui.querySelectorAll('.tb').forEach(b => {
    const k = b.dataset.k, key = k === 'fire' ? 'mouse' : k;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); audio(); if (e.pointerType === 'touch') TOUCH.seen = true; b.classList.add('down'); try { b.setPointerCapture(e.pointerId); } catch (x) { /* 이미 끝난 손가락 */ }
      if (['z', 't', 'v', 'p'].includes(k)) document.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
      else keys[key] = true;
    });
    const up = () => { b.classList.remove('down'); if (!['z', 't', 'v', 'p'].includes(k)) keys[key] = false; };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  });
  addEventListener('pointerdown', e => { if (e.pointerType === 'touch') TOUCH.seen = true; }, { capture: true, passive: true });
})();
// 매 장면: 경기 중이고 터치 기기일 때만 보인다
function touchUi() {
  const ui = document.getElementById('tui'), show = isTouch() && (G.state === 'play' || G.state === 'paused');
  ui.classList.toggle('show', show); if (!show) return;
  const ph = Math.max(110, H * 0.2); ui.style.setProperty('--ph', ph + 'px');
  document.getElementById('tfire').textContent = '●'; document.getElementById('tz').classList.toggle('laser', P.mode === 'laser');
  document.getElementById('tpause').textContent = G.state === 'paused' ? '▶' : 'II';
}

</script>
</body>
